<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central de Estudos</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2034%2034%22%3E%3Crect%20width%3D%2234%22%20height%3D%2234%22%20rx%3D%229%22%20fill%3D%22%230b3a75%22/%3E%3Cpath%20d%3D%22M8%2022%2017%2011l9%2011%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%2217%22%20cy%3D%2211%22%20r%3D%222.6%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: início (4 cursos + financeiro geral) → página de cada curso com abas Curso, Trilha, Financeiro, Leituras, Certificado; leitor de aula em painel lateral */
:root{
  --bg:#f2f5fa; --surface:#fff; --raise:#f7f9fc; --line:#dbe2ee; --fg:#101c33; --muted:#5b6a83; --navy:#0b3a75;
  --qual:#1559b8; --ia:#0e8a78; --aud:#6b3fc0; --ing:#cf6a0c;
  --qual-s:#e5eefb; --ia-s:#e0f4f0; --aud-s:#eee8fa; --ing-s:#fcefe2;
  --ok:#2e7d32; --warn:#c0392b; --late:#b26a00;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --cert:"Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1220; --surface:#111b2e; --raise:#16233a; --line:#26344d; --fg:#e8eefa; --muted:#9caccb; --navy:#9cc3f7;
  --qual:#6aa5f0; --ia:#4fd1bd; --aud:#b49af0; --ing:#f5a54a;
  --qual-s:#152a4a; --ia-s:#0f2f2b; --aud-s:#251c42; --ing-s:#33230f; --ok:#6cc070; --warn:#ef7a6b; --late:#f0b252; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1220; --surface:#111b2e; --raise:#16233a; --line:#26344d; --fg:#e8eefa; --muted:#9caccb; --navy:#9cc3f7;
  --qual:#6aa5f0; --ia:#4fd1bd; --aud:#b49af0; --ing:#f5a54a;
  --qual-s:#152a4a; --ia-s:#0f2f2b; --aud-s:#251c42; --ing-s:#33230f; --ok:#6cc070; --warn:#ef7a6b; --late:#f0b252; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{color:var(--muted);font-size:.84rem;margin:0}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c,var(--navy));outline-offset:2px}
.c-qual{--c:var(--qual);--cs:var(--qual-s)} .c-ia{--c:var(--ia);--cs:var(--ia-s)} .c-aud{--c:var(--aud);--cs:var(--aud-s)} .c-ing{--c:var(--ing);--cs:var(--ing-s)}

/* topo */
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.brand{display:flex;gap:10px;align-items:center;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand h1{font-size:1.35rem;color:var(--navy)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip[aria-current="page"]{background:var(--c,var(--navy));border-color:var(--c,var(--navy));color:#fff}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-current="page"] i{background:#fff}
.sync{font-size:.75rem;color:var(--muted)}

/* início */
.hero{display:grid;gap:6px}
.hero h2{font-size:clamp(1.5rem,3.6vw,2.1rem);color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--navy);white-space:nowrap}
.kpi span{font-size:.8rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;min-width:0}
.ccard .band{background:var(--c);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.band svg{flex:none}
.ccard .band h3{font-size:1.05rem}
.ccard .band small{opacity:.85;font-size:.78rem}
.ccard .body{padding:14px 16px;display:grid;gap:10px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--cs) 0);display:grid;place-items:center;flex:none}
.ring span{background:var(--surface);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.85rem}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.row > div{min-width:0}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.late{background:color-mix(in srgb,var(--late) 18%,transparent);color:var(--late)}
.pill.wait{background:var(--cs);color:var(--c)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--c)}
.btn.main{background:var(--c);border-color:var(--c);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.chart{overflow-x:auto}.chart svg{display:block;min-width:700px;width:100%;height:auto}

/* curso */
.chero{background:var(--c);color:#fff;border-radius:16px;padding:20px;display:grid;gap:14px;position:relative;overflow:hidden}
.chero .motif{position:absolute;right:-30px;top:-30px;opacity:.14;pointer-events:none}
.chero h2{font-size:clamp(1.3rem,3.4vw,1.9rem)}
.chero .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem;opacity:.95}
.chero .bar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.chero .bar i{display:block;height:100%;background:#fff;border-radius:99px}
.chero .btn{background:#fff;color:var(--c);border-color:#fff}
.chero .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--c);border-bottom-color:var(--c)}
details.about{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details > summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"+";color:var(--c);font-weight:700;font-size:1.1rem}
details[open] > summary::after{content:"–"}
.about p{margin:0;padding:0 14px 12px;color:var(--muted)}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mod > summary{padding:12px 14px}
.mod .mh{display:flex;gap:12px;align-items:center;min-width:0;flex:1}
.mnum{width:34px;height:34px;border-radius:9px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:none}
.mod.done .mnum{background:var(--c);color:#fff}
.mod h4{font-size:.98rem}
.mod .sub{font-size:.78rem;color:var(--muted);font-weight:500}
.mod .minibar{width:70px;height:6px;background:var(--cs);border-radius:99px;overflow:hidden;flex:none}
.mod .minibar i{display:block;height:100%;background:var(--c)}
.mobj{padding:0 14px 8px;color:var(--muted);font-size:.86rem;margin:0}
.weeks{list-style:none;margin:0;padding:0 8px 10px;display:grid;gap:2px}
.wk{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;min-width:0}
.wk:hover{background:var(--raise)}
.wk input{accent-color:var(--c);width:17px;height:17px;flex:none}
.wk .open{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.wk .d{font-size:.75rem;color:var(--muted);width:78px;flex:none;white-space:nowrap}
.wk .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wk.done .t{color:var(--muted);text-decoration:line-through}
.wk.now{background:var(--cs)}
.wk .tag{font-size:.68rem;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:5px;padding:0 5px;flex:none}

/* trilha */
.trail{list-style:none;margin:0;padding:8px 0;display:grid}
.stop{display:grid;grid-template-columns:72px 1fr;gap:12px;min-height:84px}
.road{position:relative;display:flex;justify-content:center}
.road::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:10px;margin-left:-5px;background:var(--line);border-radius:6px}
.road .fill{position:absolute;top:0;left:50%;width:10px;margin-left:-5px;background:var(--c);border-radius:6px}
.road::after{content:"";position:absolute;top:0;bottom:0;left:50%;margin-left:-1px;border-left:2px dashed color-mix(in srgb,var(--surface) 80%,transparent)}
.stop:first-child .road::before,.stop:first-child .road::after{top:20px}
.stop:last-child .road::before,.stop:last-child .road::after{bottom:auto;height:22px}
.node{position:relative;z-index:1;margin-top:6px;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--cs) 0);display:grid;place-items:center;box-shadow:0 0 0 4px var(--bg)}
.node span{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--c)}
.stop.done .node span{background:var(--c);color:#fff}
.stop.cur .node{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--bg),0 0 0 9px color-mix(in srgb,var(--c) 30%,transparent)}}
.sinfo{padding-top:8px;min-width:0}
.sinfo h4{font-size:.95rem}
.sinfo .note{font-size:.78rem}
.truck{display:inline-flex;gap:6px;align-items:center;font-size:.74rem;font-weight:700;color:var(--c);margin-top:4px}
.goal .node span{background:var(--c);color:#fff}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;background:var(--raise);color:var(--muted);border:1px dashed var(--line)}
.badge.on{background:var(--c);color:#fff;border:0}

/* financeiro e leituras */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
table.fin{width:100%;border-collapse:collapse;font-size:.88rem}
table.fin th,table.fin td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.fin th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.fin input{accent-color:var(--c);width:16px;height:16px}
.tw{overflow-x:auto}
.book{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.book:last-child{border:0}
.spine{width:44px;height:58px;border-radius:3px 6px 6px 3px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 70%,#000) 0 6px,var(--c) 6px);box-shadow:inset -4px 0 0 rgba(255,255,255,.18)}
.book b{display:block;font-size:.92rem}
.book small{color:var(--muted);display:block}
.site{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.site:last-child{border:0}
.site b{color:var(--c)}
.site span{font-size:.82rem;color:var(--muted)}
.site em{font-style:normal;color:var(--c);font-weight:700;flex:none}

/* certificado */
.certwrap{overflow-x:auto}
.cert{min-width:640px;aspect-ratio:1.414;background:#fffdf8;color:#1c2333;border-radius:6px;position:relative;padding:5%;display:grid;align-content:center;justify-items:center;text-align:center;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cert::before{content:"";position:absolute;inset:14px;border:3px solid var(--cc);border-radius:4px}
.cert::after{content:"";position:absolute;inset:22px;border:1px solid var(--cc);border-radius:2px;opacity:.5}
.cert .k{font-family:var(--display);letter-spacing:.3em;font-size:.8rem;color:var(--cc);font-weight:700}
.cert h3{font-family:var(--cert);font-size:2.4rem;font-weight:600;letter-spacing:.04em}
.cert .nm{font-family:var(--cert);font-style:italic;font-size:2.6rem;border-bottom:1px solid #c9ccd6;padding:0 40px 4px;min-width:60%}
.cert p{margin:0;max-width:62ch;font-size:.95rem;color:#3b4459}
.cert .cn{font-family:var(--display);font-size:1.3rem;font-weight:700;color:var(--cc)}
.cert .foot{display:flex;justify-content:space-between;width:80%;margin-top:18px;font-size:.78rem;color:#5b6478}
.cert .seal{position:absolute;right:9%;bottom:12%;width:88px;height:88px;border-radius:50%;background:var(--cc);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.72rem;line-height:1.1;box-shadow:0 0 0 5px #fffdf8,0 0 0 7px var(--cc)}
.locked .cert{filter:grayscale(1) blur(1.5px);opacity:.45}
.lockmsg{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:grid;gap:4px;font-size:.84rem;font-weight:600}
.field input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:min(360px,100%)}

/* leitor */
[hidden]{display:none!important}
.reader{position:fixed;inset:0;z-index:50;background:rgba(5,12,26,.55);display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(760px,100%);height:100%;overflow-y:auto;border-left:5px solid var(--c);
  padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
.sheet-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.sheet-top .k{font-size:.75rem;color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.x{background:none;border:0;font-size:1.5rem;line-height:1;padding:4px 10px;border-radius:6px;color:var(--muted);cursor:pointer}
.x:hover{background:var(--raise)}
.sheet h2{font-size:1.45rem;color:var(--fg)}
.when{font-size:.84rem;color:var(--muted)}
.lesson{font-size:.98rem;line-height:1.7;max-width:70ch}
.lesson p{margin:0 0 .8em}
.lesson table{border-collapse:collapse;width:100%;font-size:.88rem;margin:.2em 0 .8em}
.lesson th,.lesson td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.lesson th{background:var(--cs)}
.tbl{overflow-x:auto}
.lesson pre{background:var(--raise);border-radius:8px;padding:10px;overflow-x:auto;font-size:.84rem}
.lesson code{background:var(--raise);padding:1px 5px;border-radius:4px;font-size:.88em}
.box{border-radius:10px;padding:12px 14px;background:var(--cs)}
.box h4{margin:0 0 6px;font-size:.9rem;color:var(--c)}
.box ul{margin:0;padding-left:18px;display:grid;gap:3px}
.box.task{background:var(--raise);border-left:4px solid var(--c)}
.quiz{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px}
.quiz h4{font-size:.95rem}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer}
.opt:hover{border-color:var(--c)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.fb{font-size:.88rem;margin:0}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.donechk{display:flex;gap:8px;align-items:center;font-weight:600}
.donechk input{width:18px;height:18px;accent-color:var(--c)}
@media (max-width:520px){.wk .d{width:88px;font-size:.7rem}.cert{min-width:560px}}
@media (prefers-reduced-motion:reduce){.stop.cur .node{animation:none}}

.menu{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.menu:hover{border-color:var(--navy)}
.menu svg{flex:none}
.ferias{display:flex;gap:10px;align-items:center;padding:8px 12px;margin:4px 8px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--raise) 0 10px,transparent 10px 20px);border:1px dashed var(--line);font-size:.82rem;color:var(--muted);font-weight:600}
.ferias b{color:var(--fg)}
.stop.vac{min-height:56px}
.stop.vac .node{width:30px;height:30px;margin-top:8px;background:var(--raise);border:2px dashed var(--line)}
.stop.vac .road::before{background:repeating-linear-gradient(180deg,var(--line) 0 6px,transparent 6px 12px)}
.lesson h4{font-family:var(--display);font-size:1.02rem;margin:1.1em 0 .4em;color:var(--fg)}
.lesson ul,.lesson ol{margin:0 0 .8em;padding-left:20px;display:grid;gap:4px}
.cal{display:flex;flex-wrap:wrap;gap:8px}
.cal span{font-size:.8rem;border-radius:8px;padding:6px 10px;background:var(--raise);border:1px dashed var(--line);color:var(--muted);white-space:nowrap}
.cal b{color:var(--fg)}
.hdr-r{display:flex;gap:10px;align-items:center;position:relative}
.conta{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:2px;cursor:pointer;display:grid;place-items:center;overflow:hidden}
.conta:hover,.conta[aria-expanded="true"]{border-color:var(--navy)}
.conta img,.painel img{border-radius:50%;display:block;object-fit:cover}
.ini{display:grid;place-items:center;border-radius:50%;background:var(--navy);color:var(--bg);font-family:var(--display);font-weight:700;font-size:.9rem}
.painel{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(10,25,50,.18);padding:16px;display:grid;gap:12px}
.pc-top{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line);min-width:0}
.pc-top > div{display:grid;min-width:0}
.pc-top b{font-size:1rem}
.pc-top span,.pc-row span{font-size:.8rem;color:var(--muted)}
.pc-row{display:flex;gap:10px;align-items:flex-start}
.pc-row > div{display:grid;gap:2px;min-width:0}
.pc-row b{font-size:.88rem}
.pc-ico{width:22px;text-align:center;color:var(--navy);font-weight:700;flex:none}

{n:"Fundamentos da Qualidade",o:"Entender o que é qualidade, como ela evoluiu e quais princípios sustentam a gestão moderna.",a:[
L("O que é qualidade e como ela evoluiu",`<h4>Definições que você precisa conhecer</h4>
<p>A ISO 9000 define qualidade como o <b>grau em que um conjunto de características inerentes de um objeto satisfaz requisitos</b>. Em outras palavras: qualidade não é luxo nem perfeição, é cumprir o que foi combinado com o cliente, de forma consistente. Juran resumiu como <i>adequação ao uso</i>; Crosby como <i>conformidade com requisitos</i>; Deming como <i>atender e superar as necessidades do cliente de forma econômica</i>.</p>
<p>Um requisito pode ser <b>declarado</b> (prazo de entrega no contrato), <b>implícito</b> (a carga chegar sem avaria, mesmo que ninguém escreva isso) ou <b>obrigatório</b> (legislação, como emissão correta do CT-e e do MDF-e).</p>
<h4>As quatro eras da qualidade</h4>
<table><tr><th>Era</th><th>Período</th><th>Foco</th><th>Quem cuida</th></tr>
<tr><td>Inspeção</td><td>até 1930</td><td>separar o defeito no fim</td><td>inspetores</td></tr>
<tr><td>Controle estatístico</td><td>1930–1950</td><td>medir e controlar a variação do processo</td><td>engenharia</td></tr>
<tr><td>Garantia da qualidade</td><td>1950–1980</td><td>sistemas, procedimentos, prevenção</td><td>departamento da qualidade</td></tr>
<tr><td>Gestão estratégica</td><td>1980 em diante</td><td>qualidade como vantagem competitiva</td><td>todos, liderados pela alta direção</td></tr></table>
<p>Cada era não apagou a anterior: hoje usamos inspeção, estatística e sistemas, mas dentro de uma visão estratégica.</p>
<h4>Qualidade em serviços</h4>
<p>Serviço é <b>intangível</b> (não dá para estocar nem inspecionar antes), <b>simultâneo</b> (é produzido enquanto é consumido), <b>variável</b> (depende de pessoas) e <b>perecível</b> (caminhão vazio hoje é capacidade perdida). Por isso a qualidade em transporte depende muito de processo padronizado e de gente treinada, porque não há como "separar o defeito" antes de o cliente perceber.</p>
<h4>Erros comuns</h4>
<ul><li>Achar que qualidade é só papel e auditoria.</li><li>Medir qualidade apenas por reclamações (a maioria dos clientes insatisfeitos simplesmente vai embora).</li><li>Confundir qualidade com custo alto: falta de qualidade é que custa caro.</li></ul>`,
["Qualidade = atender requisitos de forma consistente","Requisitos podem ser declarados, implícitos ou obrigatórios","4 eras: inspeção, controle estatístico, garantia, gestão estratégica","Serviço é intangível, simultâneo, variável e perecível"],
`Para um cliente da MIR, requisitos declarados são prazo e preço; implícitos são carga íntegra e informação de rastreio; obrigatórios são CT-e, MDF-e e seguro. Falhar em qualquer um deles é falta de qualidade.`,
`Liste 3 requisitos declarados, 3 implícitos e 3 obrigatórios do serviço de transporte da empresa.`,
[["Segundo a ISO 9000, qualidade é:",["Usar os melhores materiais","O grau em que características satisfazem requisitos","Ter certificado ISO","Não ter nenhuma reclamação"],1,"A definição oficial liga qualidade ao atendimento de requisitos."],
["Uma característica do serviço que dificulta a inspeção prévia é:",["Tangibilidade","Simultaneidade entre produção e consumo","Estocagem","Padronização total"],1,"O serviço acontece enquanto é consumido, então não dá para separar o defeito antes."]]),
L("Os mestres da qualidade",`<h4>W. Edwards Deming</h4>
<p>Estatístico americano que ajudou a reconstruir a indústria japonesa no pós-guerra. Ideias centrais: <b>a maioria dos problemas (cerca de 94%) vem do sistema, não das pessoas</b>; é preciso entender a variação; e a gestão deve ser contínua. Divulgou o ciclo PDCA (que ele chamava de PDSA) e deixou os <b>14 pontos</b>, entre eles: constância de propósito, acabar com a dependência da inspeção em massa, não escolher fornecedor só por preço, treinamento no trabalho, eliminar o medo, quebrar barreiras entre departamentos, eliminar metas numéricas sem método e incentivar a educação.</p>
<h4>Joseph Juran</h4>
<p>Definiu qualidade como adequação ao uso e criou a <b>Trilogia de Juran</b>: <i>planejamento</i> da qualidade (entender o cliente e projetar o processo), <i>controle</i> (manter o desempenho) e <i>melhoria</i> (atingir níveis inéditos). Também aplicou o <b>princípio de Pareto</b> à qualidade: poucos vitais, muitos triviais.</p>
<h4>Philip Crosby</h4>
<p>Defendeu o <b>zero defeito</b> como padrão de desempenho e a ideia de que <i>"a qualidade é gratuita"</i>: o que custa é a não qualidade. Propôs medir a qualidade pelo <b>preço da não conformidade</b>.</p>
<h4>Armand Feigenbaum e Kaoru Ishikawa</h4>
<p>Feigenbaum criou o conceito de <b>Controle da Qualidade Total (TQC)</b>: qualidade envolve todas as áreas, de vendas ao pós-venda. Ishikawa popularizou as <b>7 ferramentas da qualidade</b>, o diagrama de causa e efeito e os <b>Círculos de Controle da Qualidade</b>, envolvendo os trabalhadores da linha de frente.</p>
<h4>Comparativo</h4>
<table><tr><th>Autor</th><th>Ideia-chave</th><th>Legado prático</th></tr>
<tr><td>Deming</td><td>sistema e variação</td><td>PDCA, 14 pontos</td></tr><tr><td>Juran</td><td>adequação ao uso</td><td>Trilogia, Pareto</td></tr>
<tr><td>Crosby</td><td>zero defeito</td><td>custo da não conformidade</td></tr><tr><td>Feigenbaum</td><td>qualidade total</td><td>TQC</td></tr><tr><td>Ishikawa</td><td>participação</td><td>7 ferramentas, CCQ</td></tr></table>`,
["Deming: problemas vêm do sistema; PDCA; 14 pontos","Juran: Trilogia (planejar, controlar, melhorar)","Crosby: zero defeito, custo da não conformidade","Feigenbaum: TQC; Ishikawa: 7 ferramentas e CCQ"],
`Quando um conferente erra a contagem de volumes, a visão de Deming pergunta primeiro: o processo ajuda ou atrapalha? Há etiqueta legível, leitor funcionando, tempo suficiente, treinamento? Culpar a pessoa raramente resolve.`,
`Escolha 3 dos 14 pontos de Deming e avalie de 1 a 5 como a empresa está em cada um, com uma justificativa.`,
[["Quem criou a Trilogia da Qualidade?",["Deming","Juran","Crosby","Ishikawa"],1,"Planejamento, controle e melhoria é a Trilogia de Juran."],
["'A qualidade é gratuita' é uma ideia associada a:",["Crosby","Feigenbaum","Taylor","Ishikawa"],0,"Crosby mostrou que o custo vem da não conformidade."]]),
L("Os 7 princípios da gestão da qualidade",`<h4>Por que os princípios importam</h4>
<p>A ISO 9000 apresenta sete princípios que sustentam todos os requisitos da ISO 9001. Eles não são auditados diretamente, mas quem os entende consegue interpretar qualquer cláusula sem decorar.</p>
<h4>Os princípios, um a um</h4>
<ol><li><b>Foco no cliente:</b> entender necessidades atuais e futuras, medir satisfação e agir. Benefício: fidelização e reputação.</li>
<li><b>Liderança:</b> líderes estabelecem propósito e direção e criam condições para as pessoas se engajarem.</li>
<li><b>Engajamento das pessoas:</b> pessoas competentes, com autonomia e reconhecidas, em todos os níveis.</li>
<li><b>Abordagem de processo:</b> resultados consistentes vêm de atividades gerenciadas como processos inter-relacionados, formando um sistema.</li>
<li><b>Melhoria:</b> organizações de sucesso têm foco contínuo em melhorar, reagindo a mudanças internas e externas.</li>
<li><b>Tomada de decisão baseada em evidência:</b> decisões a partir de análise de dados aumentam a chance de acerto.</li>
<li><b>Gestão de relacionamento:</b> fornecedores, parceiros e outras partes interessadas também influenciam o desempenho.</li></ol>
<h4>Ligando princípios e cláusulas</h4>
<table><tr><th>Princípio</th><th>Onde aparece na ISO 9001</th></tr>
<tr><td>Foco no cliente</td><td>5.1.2, 8.2, 9.1.2</td></tr><tr><td>Liderança</td><td>5.1, 5.2, 5.3</td></tr><tr><td>Engajamento</td><td>7.2, 7.3, 7.4</td></tr>
<tr><td>Processo</td><td>4.4, 8.1</td></tr><tr><td>Melhoria</td><td>10</td></tr><tr><td>Evidência</td><td>9.1.3, 9.3</td></tr><tr><td>Relacionamento</td><td>8.4</td></tr></table>
<h4>Erros comuns</h4>
<ul><li>Tratar "foco no cliente" só como pesquisa de satisfação anual.</li><li>Decidir pela reclamação mais barulhenta em vez dos dados.</li><li>Ver fornecedor como adversário em vez de parceiro.</li></ul>`,
["7 princípios: cliente, liderança, pessoas, processo, melhoria, evidência, relacionamento","Princípios explicam o porquê dos requisitos","Cada princípio se conecta a cláusulas da ISO 9001"],
`Decisão baseada em evidência: antes de reforçar a frota numa rota, olhe o índice de entregas no prazo por rota e dia da semana dos últimos 3 meses. Talvez o problema seja horário de carregamento, não falta de caminhão.`,
`Para cada princípio, escreva um exemplo real que você já viu acontecer (bom ou ruim) na empresa.`,
[["Qual princípio está ligado ao controle de fornecedores e parceiros?",["Liderança","Gestão de relacionamento","Melhoria","Abordagem de processo"],1,"Gestão de relacionamento trata das partes interessadas, como fornecedores."],
["Os princípios da gestão da qualidade estão descritos na:",["ISO 9000","ISO 19011","ISO 14001","ISO 31000"],0,"A ISO 9000 traz fundamentos, vocabulário e os 7 princípios."]])]},
{n:"A Norma ISO 9001:2026",o:"Dominar a estrutura da norma e os requisitos de contexto, liderança e planejamento.",a:[
L("Família ISO 9000 e estrutura da norma",`<h4>A família de normas</h4>
<p><b>ISO 9000</b>: fundamentos e vocabulário. <b>ISO 9001</b>: requisitos do sistema de gestão da qualidade, a única certificável. <b>ISO 9004</b>: orientações para o sucesso sustentado. <b>ISO 19011</b>: diretrizes para auditoria. No Brasil, a ABNT publica as versões traduzidas (ABNT NBR ISO).</p>
<h4>Estrutura Harmonizada</h4>
<p>Desde 2015 as normas de sistemas de gestão seguem a mesma estrutura de 10 cláusulas, o que facilita integrar qualidade, meio ambiente (14001), segurança (45001) e segurança da informação (27001).</p>
<table><tr><th>Cláusula</th><th>Tema</th><th>PDCA</th></tr>
<tr><td>1 a 3</td><td>Escopo, referências, termos</td><td>introdutórias</td></tr>
<tr><td>4</td><td>Contexto da organização</td><td>Plan</td></tr><tr><td>5</td><td>Liderança</td><td>Plan</td></tr><tr><td>6</td><td>Planejamento</td><td>Plan</td></tr>
<tr><td>7</td><td>Apoio</td><td>Do</td></tr><tr><td>8</td><td>Operação</td><td>Do</td></tr>
<tr><td>9</td><td>Avaliação de desempenho</td><td>Check</td></tr><tr><td>10</td><td>Melhoria</td><td>Act</td></tr></table>
<h4>Como ler a norma</h4>
<p><b>"Deve"</b> indica requisito; <b>"convém"</b> indica recomendação (aparece nos anexos); <b>"pode"</b> indica permissão. Cada requisito responde a uma pergunta: o que a organização precisa determinar, implementar, manter ou reter. Leia sempre com um caso real em mente.</p>
<h4>A versão 2026</h4>
<p>A revisão mantém a estrutura e o núcleo dos requisitos. Os pontos de atenção divulgados durante a revisão são: cultura da qualidade e comportamento ético da liderança, riscos e oportunidades tratados de forma mais clara, mudanças climáticas no contexto (vinda da emenda de 2024) e anexos explicativos mais completos. Confira sempre no texto oficial publicado antes de ajustar documentos.</p>`,
["Só a ISO 9001 é certificável","Estrutura de 10 cláusulas comum às normas de gestão","4–6 Plan, 7–8 Do, 9 Check, 10 Act","'Deve' = requisito; 'convém' = recomendação"],
`Ao revisar uma IT da MIR para a 2026, use a pergunta: qual cláusula esta IT ajuda a cumprir, e que evidência ela gera? Assim cada documento tem um propósito claro.`,
`Desenhe o ciclo PDCA e posicione cada cláusula de 4 a 10. Depois liste um documento da empresa ligado a cada uma.`,
[["Qual cláusula trata da avaliação de desempenho?",["7","8","9","10"],2,"A cláusula 9 reúne monitoramento, auditoria interna e análise crítica."],
["Na norma, 'convém' indica:",["Requisito obrigatório","Recomendação","Proibição","Definição"],1,"'Convém' é recomendação, não requisito."]]),
L("Contexto, partes interessadas e escopo",`<h4>4.1 Contexto da organização</h4>
<p>A organização deve determinar as <b>questões externas e internas</b> pertinentes ao seu propósito que afetam sua capacidade de alcançar os resultados pretendidos, e monitorar essas questões. Externas: mercado, concorrência, legislação, tecnologia, economia, clima. Internas: cultura, conhecimento, sistemas, estrutura, recursos.</p>
<p>Ferramentas úteis: <b>SWOT</b> (forças, fraquezas, oportunidades, ameaças) e <b>PESTEL</b> (político, econômico, social, tecnológico, ambiental, legal).</p>
<h4>4.2 Partes interessadas</h4>
<p>Determine as partes interessadas pertinentes ao SGQ e os requisitos delas que são relevantes. Uma matriz simples resolve:</p>
<table><tr><th>Parte</th><th>Necessidade/expectativa</th><th>Como monitorar</th></tr>
<tr><td>Clientes</td><td>prazo, integridade, rastreio</td><td>OTIF, pesquisa, reclamações</td></tr>
<tr><td>Colaboradores</td><td>salário em dia, segurança, treinamento</td><td>clima, turnover</td></tr>
<tr><td>Agregados</td><td>carga programada, pagamento em dia</td><td>reuniões, avaliação</td></tr>
<tr><td>Órgãos públicos</td><td>documentação fiscal, licenças</td><td>conformidade legal</td></tr></table>
<h4>4.3 Escopo e 4.4 Processos</h4>
<p>O escopo define <b>onde</b> o SGQ se aplica (unidades, serviços) e precisa estar disponível como informação documentada, incluindo justificativas para requisitos não aplicáveis (ex.: projeto e desenvolvimento, 8.3, em muitas transportadoras). A 4.4 pede que os processos sejam determinados com entradas, saídas, sequência, critérios, recursos, responsáveis, riscos e indicadores.</p>
<h4>Erros comuns</h4><ul><li>Fazer a SWOT uma vez e nunca revisar.</li><li>Listar partes interessadas sem dizer o que elas esperam.</li><li>Excluir requisitos do escopo sem justificativa.</li></ul>`,
["Questões internas e externas devem ser monitoradas","Partes interessadas: só as pertinentes, com seus requisitos","Escopo documentado, com justificativas de não aplicabilidade","Processos com entradas, saídas, donos e indicadores"],
`Questão externa: alta do diesel e da manutenção. Interna: alta rotatividade de conferentes. Ambas afetam a capacidade de entregar no prazo e devem aparecer na análise de contexto e nos riscos.`,
`Faça a SWOT da sua unidade com pelo menos 3 itens por quadrante e monte a matriz de 5 partes interessadas.`,
[["A justificativa de requisitos não aplicáveis deve constar:",["No escopo","No organograma","Na política","Em lugar nenhum"],0,"A 4.3 pede o escopo documentado com justificativas."],
["PESTEL analisa fatores:",["Internos de processo","Externos do ambiente","Financeiros apenas","De clientes apenas"],1,"PESTEL organiza questões externas."]]),
L("Liderança, política, objetivos e mudanças",`<h4>5.1 Liderança e comprometimento</h4>
<p>A alta direção deve <b>demonstrar</b> liderança: responsabilizar-se pela eficácia do SGQ, garantir política e objetivos compatíveis com a estratégia, integrar o SGQ aos processos de negócio, prover recursos, comunicar a importância da qualidade, apoiar outras lideranças e promover a melhoria. Em 2026 ganha força a promoção de uma <b>cultura da qualidade</b> e de comportamento ético.</p>
<h4>5.2 Política da qualidade</h4>
<p>Deve ser apropriada ao propósito, fornecer estrutura para objetivos, incluir compromisso de atender requisitos e de melhoria contínua, estar documentada, comunicada, entendida e aplicada. Pergunta de auditoria clássica: "o que a política significa para o seu trabalho?"</p>
<h4>5.3 Papéis e responsabilidades</h4><p>Responsabilidades e autoridades devem ser atribuídas e comunicadas: quem garante que o SGQ atende à norma, que os processos entregam o esperado, que o desempenho é relatado à direção.</p>
<h4>6.1, 6.2 e 6.3 Planejamento</h4>
<p><b>Riscos e oportunidades</b> (6.1): determinar e planejar ações proporcionais. <b>Objetivos da qualidade</b> (6.2): mensuráveis, coerentes com a política, monitorados, comunicados e atualizados, com plano: o quê, recursos, responsável, prazo e como avaliar. <b>Mudanças</b> (6.3): planejadas considerando propósito, consequências, integridade do SGQ, recursos e responsabilidades.</p>
<table><tr><th>Objetivo ruim</th><th>Objetivo bom (SMART)</th></tr>
<tr><td>Melhorar as entregas</td><td>Elevar entregas no prazo de 91% para 95% até dez/27 na rota Vale do Itajaí</td></tr>
<tr><td>Reduzir avarias</td><td>Reduzir avarias de 2,1 para 1,2 por mil volumes até jun/27</td></tr></table>`,
["Liderança precisa ser demonstrada, não delegada","Política: compromisso com requisitos e melhoria, comunicada e entendida","Objetivos SMART com plano de ação","Mudanças no SGQ devem ser planejadas"],
`Um objetivo como "reduzir avarias para 1,2 por mil volumes" só é completo com plano: treinamento de amarração (o quê), líder da expedição (quem), até março (quando), indicador mensal (como avaliar).`,
`Pegue 2 objetivos da qualidade da empresa e reescreva no formato SMART com plano de ação completo.`,
[["Objetivos da qualidade devem ser:",["Qualitativos","Mensuráveis e monitorados","Definidos só pela qualidade","Secretos"],1,"A 6.2 exige objetivos mensuráveis e monitorados."],
["Quem deve demonstrar liderança pelo SGQ?",["Apenas o setor da qualidade","A alta direção","O auditor","O cliente"],1,"A 5.1 é dirigida à alta direção."]])]},
{n:"Apoio e Operação",o:"Aplicar os requisitos de recursos, competência, documentação e operação a uma transportadora.",a:[
L("Recursos, competência e comunicação",`<h4>7.1 Recursos</h4>
<p>Inclui pessoas, infraestrutura (veículos, armazéns, TI), ambiente para operação dos processos (fatores físicos, sociais e psicológicos), <b>recursos de monitoramento e medição</b> (balanças calibradas, leitores) e <b>conhecimento organizacional</b> (lições aprendidas, know-how que não pode sair com quem sai da empresa).</p>
<h4>7.2 Competência</h4>
<p>A organização deve determinar a competência necessária para cada função, assegurar que as pessoas sejam competentes (educação, treinamento ou experiência), tomar ações para adquirir competência quando faltar, <b>avaliar a eficácia</b> dessas ações e reter informação documentada como evidência. A matriz de competências (como a RG 22) é a evidência central.</p>
<h4>7.3 Conscientização</h4><p>As pessoas devem conhecer a política, os objetivos pertinentes, sua contribuição para o SGQ e as implicações de não atender aos requisitos. Integração, DDS e murais são meios comuns.</p>
<h4>7.4 Comunicação</h4><p>Defina <b>o que, quando, com quem, como e quem comunica</b>. Uma matriz de comunicação evita que informações críticas (mudança de tabela, nova IT) se percam.</p>
<h4>Avaliando eficácia de treinamento</h4>
<table><tr><th>Nível</th><th>Pergunta</th><th>Exemplo</th></tr>
<tr><td>Reação</td><td>Gostou?</td><td>pesquisa ao fim</td></tr><tr><td>Aprendizado</td><td>Aprendeu?</td><td>prova prática</td></tr>
<tr><td>Comportamento</td><td>Aplica?</td><td>observação na doca após 30 dias</td></tr><tr><td>Resultado</td><td>Mudou o indicador?</td><td>avarias caíram</td></tr></table>
<p>Lista de presença sozinha não prova eficácia.</p>`,
["Recursos incluem medição calibrada e conhecimento organizacional","Competência: determinar, prover, avaliar eficácia, registrar","Conscientização: política, objetivos, contribuição, consequências","Comunicação: o que, quando, com quem, como, quem"],
`Treinamento de amarração com eficácia comprovada: prova prática no dia, observação de 10 cargas após 30 dias e queda do índice de avarias no trimestre.`,
`Escolha uma função da sua unidade e escreva a competência exigida (educação, treinamento, experiência) e como avaliar a eficácia.`,
[["Lista de presença comprova:",["Eficácia do treinamento","Apenas a participação","Competência total","Resultado no indicador"],1,"Presença não mostra se a pessoa aprendeu ou aplica."],
["Balança da expedição está ligada a qual requisito?",["7.1.5 Recursos de monitoramento e medição","5.2 Política","9.3 Análise crítica","4.2 Partes interessadas"],0,"Equipamentos de medição precisam ser adequados e, quando necessário, calibrados."]]),
L("Informação documentada",`<h4>Manter e reter</h4>
<p><b>Manter</b> informação documentada = documentos vivos que orientam o trabalho (procedimentos, ITs, política). <b>Reter</b> = registros que evidenciam o que foi feito (checklists, certificados, relatórios). A norma não exige manual da qualidade nem número mínimo de procedimentos: a organização decide o que é necessário para a eficácia, conforme tamanho, complexidade e competência das pessoas.</p>
<h4>7.5.2 Criando e atualizando</h4><p>Todo documento precisa de identificação (título, código, revisão, data), formato adequado (papel, digital, vídeo) e análise crítica e aprovação.</p>
<h4>7.5.3 Controle</h4>
<p>Garantir que esteja disponível onde e quando necessário e protegido (contra perda de confidencialidade, uso impróprio ou perda de integridade). Atividades: distribuição, acesso, recuperação, uso, armazenamento, preservação, controle de alterações, retenção e disposição. Documentos externos (normas, legislação, manuais de clientes) também precisam de controle.</p>
<h4>Boas práticas</h4>
<ul><li>Lista mestra com código, título, revisão, data e responsável.</li><li>Histórico de alterações no próprio documento.</li><li>Documentos obsoletos retirados de circulação ou marcados.</li><li>Tabela de temporalidade dos registros (quanto tempo guardar e como descartar).</li><li>ITs com fotos e fluxos: menos texto, mais clareza.</li></ul>
<h4>Erros comuns</h4><ul><li>IT impressa desatualizada colada na parede.</li><li>Registro sem data ou sem assinatura.</li><li>Documentar demais: ninguém lê procedimento de 20 páginas.</li></ul>`,
["Manter = documentos; reter = registros","Não há exigência de manual da qualidade","Identificação, revisão e aprovação de todo documento","Controle inclui documentos externos e obsoletos"],
`Na revisão das ITs para a ISO 9001:2026, aproveite para reduzir texto, incluir fotos do passo a passo e registrar no histórico o motivo da mudança.`,
`Confira 10 documentos da lista mestra: estão na revisão certa, aprovados e disponíveis onde são usados? Anote as falhas.`,
[["Um checklist preenchido é informação documentada a ser:",["Mantida","Retida","Descartada","Aprovada pela direção"],1,"Registros são retidos como evidência."],
["Normas técnicas e legislação usadas pela empresa são:",["Documentos externos que precisam de controle","Desnecessárias","Registros","Documentos obsoletos"],0,"Documentos de origem externa também devem ser identificados e controlados."]]),
L("Operação: do pedido à entrega",`<h4>8.1 Planejamento e controle operacional</h4><p>Defina requisitos dos serviços, critérios para os processos e para aceitação, recursos necessários e controles. Mudanças planejadas devem ser controladas e as não intencionais analisadas.</p>
<h4>8.2 Requisitos para produtos e serviços</h4><p>Comunicação com o cliente (informações, cotações, contratos, reclamações, propriedade do cliente), determinação dos requisitos (inclusive legais) e <b>análise crítica antes de assumir o compromisso</b>: a empresa consegue atender esse prazo, esse tipo de carga, esse destino?</p>
<h4>8.4 Provedores externos</h4><p>Agregados, redespachos, oficinas e seguradora: critérios de seleção, avaliação, monitoramento e reavaliação, com registros.</p>
<h4>8.5 Prestação do serviço</h4>
<table><tr><th>Requisito</th><th>Na transportadora</th></tr>
<tr><td>8.5.1 Condições controladas</td><td>ITs de coleta, conferência, carregamento, roteirização</td></tr>
<tr><td>8.5.2 Identificação e rastreabilidade</td><td>etiquetas, CT-e, rastreio por volume</td></tr>
<tr><td>8.5.3 Propriedade do cliente</td><td>a carga sob guarda: proteger e comunicar perdas</td></tr>
<tr><td>8.5.4 Preservação</td><td>amarração, cobertura, segregação de químicos</td></tr>
<tr><td>8.5.5 Pós-entrega</td><td>comprovante, tratamento de indenizações</td></tr></table>
<h4>8.6 e 8.7</h4><p><b>Liberação</b>: verificar que os requisitos foram atendidos antes de liberar (conferência antes de despachar). <b>Saídas não conformes</b>: avaria, extravio, documento errado devem ser identificados e tratados (correção, segregação, informação ao cliente), com registro.</p>`,
["Análise crítica dos requisitos antes de aceitar o serviço","Provedores externos com critérios e reavaliação","A carga do cliente é propriedade do cliente (8.5.3)","Saídas não conformes identificadas, tratadas e registradas"],
`Cliente pede coleta de produto químico para amanhã: a análise crítica (8.2.3) verifica se o veículo, o motorista com MOPP e a rota aceitam essa carga antes de confirmar.`,
`Monte o fluxo do pedido à entrega da sua unidade e marque em cada etapa qual requisito da cláusula 8 se aplica.`,
[["Verificar se a empresa consegue atender um pedido antes de aceitar é:",["8.2.3 Análise crítica","9.2 Auditoria","7.3 Conscientização","10.3 Melhoria"],0,"A análise crítica dos requisitos é feita antes do compromisso."],
["Uma carga avariada identificada na doca é tratada como:",["Saída não conforme (8.7)","Propriedade da empresa","Recurso de medição","Objetivo da qualidade"],0,"Saídas não conformes precisam ser controladas."]])]},
{n:"Gestão por Processos",o:"Mapear, medir e melhorar processos com SIPOC, BPMN e indicadores.",a:[
L("Processos, cadeia de valor e SIPOC",`<h4>O que é processo</h4><p>Conjunto de atividades inter-relacionadas que transforma entradas em saídas, agregando valor. Todo processo tem <b>dono</b>, <b>cliente</b> (interno ou externo), <b>entradas</b>, <b>saídas</b>, <b>recursos</b> e <b>indicadores</b>. Gestão por processos olha a empresa de forma horizontal, atravessando departamentos, do pedido do cliente à entrega.</p>
<h4>Cadeia de valor</h4><p>Divide os macroprocessos em <b>primários</b> (entregam valor direto: comercial, coleta, transferência, distribuição, pós-venda) e <b>de apoio</b> (RH, TI, manutenção, financeiro, qualidade). Há ainda os de <b>gestão</b> (planejamento estratégico, análise crítica).</p>
<h4>SIPOC</h4><p>Visão macro em uma linha, ótima para começar qualquer projeto:</p>
<table><tr><th>S Fornecedores</th><th>I Entradas</th><th>P Processo</th><th>O Saídas</th><th>C Clientes</th></tr>
<tr><td>Cliente remetente, SAC</td><td>Solicitação, nota fiscal</td><td>Receber pedido → programar → coletar → conferir → descarregar</td><td>Carga na unidade, CT-e</td><td>Expedição, destinatário</td></tr></table>
<p>Regras: 4 a 7 etapas no P, verbos no infinitivo, comece pelas saídas e clientes.</p>
<h4>Hierarquia</h4><p>Macroprocesso → processo → subprocesso → atividade → tarefa. Mapeie no nível que resolve o problema: diretoria precisa de macro; a IT precisa de tarefa.</p>`,
["Processo transforma entradas em saídas com valor","Cadeia de valor: primários, apoio e gestão","SIPOC: visão macro antes de detalhar","Mapear no nível certo de detalhe"],
`SIPOC da entrega: fornecedores = expedição e roteirização; entradas = carga e romaneio; processo = carregar, sair, entregar, colher comprovante, baixar; saídas = carga entregue e baixa no sistema; clientes = destinatário e remetente.`,
`Monte o SIPOC de dois processos da sua unidade: coleta e entrega.`,
[["No SIPOC, a letra C representa:",["Custos","Clientes","Controles","Capacidade"],1,"C = Customers."],["Manutenção de frota é um processo:",["Primário","De apoio","De gestão","Externo"],1,"Ela apoia os processos que entregam valor ao cliente."]]),
L("Mapeamento com BPMN",`<h4>Elementos essenciais</h4>
<table><tr><th>Elemento</th><th>Símbolo</th><th>Uso</th></tr>
<tr><td>Evento de início/fim</td><td>círculo fino / grosso</td><td>o que dispara e o que encerra</td></tr>
<tr><td>Atividade</td><td>retângulo arredondado</td><td>trabalho feito, verbo + objeto</td></tr>
<tr><td>Gateway exclusivo</td><td>losango com X</td><td>decisão: só um caminho segue</td></tr>
<tr><td>Gateway paralelo</td><td>losango com +</td><td>caminhos simultâneos</td></tr>
<tr><td>Fluxo de sequência</td><td>seta contínua</td><td>ordem das atividades</td></tr>
<tr><td>Pool e raias</td><td>faixas horizontais</td><td>quem executa</td></tr>
<tr><td>Objeto de dados</td><td>folha com canto dobrado</td><td>documento usado ou gerado</td></tr></table>
<h4>Passo a passo para mapear</h4><ol><li>Defina início, fim e escopo.</li><li>Entreviste quem executa e observe o trabalho real.</li><li>Desenhe o <b>AS-IS</b> (como é), sem corrigir ainda.</li><li>Valide com a equipe.</li><li>Marque problemas: retrabalho, esperas, decisões sem critério.</li><li>Desenhe o <b>TO-BE</b> e só depois escreva a IT.</li></ol>
<h4>Ferramentas gratuitas</h4><p>Bizagi Modeler, draw.io (diagrams.net) e Camunda Modeler.</p>
<h4>Erros comuns</h4><ul><li>Desenhar o processo "ideal" achando que é o real.</li><li>Raia sem dono ou com nome de pessoa em vez de função.</li><li>Gateway sem rótulo nas saídas ("sim/não").</li><li>Fluxo que nunca chega a um evento de fim.</li></ul>`,
["Eventos, atividades, gateways, fluxos e raias","AS-IS antes do TO-BE","Mapeie com quem executa","Gateways sempre rotulados"],
`Coleta: início (cliente solicita) → SAC registra no sistema → gateway "tem veículo na janela?" → sim: programa coleta / não: negocia nova data → motorista coleta → conferente confere → fim (carga na unidade). Raias: SAC, Programação, Motorista, Conferência.`,
`Desenhe no draw.io o processo de coleta da sua unidade em BPMN, com raias e pelo menos um gateway.`,
[["Losango com X no BPMN significa:",["Caminhos paralelos","Decisão exclusiva","Fim do processo","Documento"],1,"Gateway exclusivo: apenas um caminho é seguido."],["O primeiro mapa a desenhar é o:",["TO-BE","AS-IS","Organograma","Fluxo de caixa"],1,"Primeiro entenda o processo como ele é."]]),
L("Indicadores de processo e melhoria",`<h4>Tipos de indicador</h4>
<table><tr><th>Tipo</th><th>Pergunta</th><th>Exemplo</th></tr>
<tr><td>Eficácia</td><td>Atingiu o resultado?</td><td>% entregas no prazo</td></tr>
<tr><td>Eficiência</td><td>Usou bem os recursos?</td><td>custo por entrega, ocupação do veículo</td></tr>
<tr><td>Efetividade</td><td>Gerou o impacto esperado?</td><td>retenção de clientes</td></tr>
<tr><td>Produtividade</td><td>Quanto por recurso?</td><td>volumes conferidos por hora</td></tr></table>
<p>Distinga também indicador de <b>resultado</b> (olha para trás: atrasos do mês) e de <b>tendência/direcionador</b> (antecipa: tempo de doca de hoje).</p>
<h4>Ficha do indicador</h4><p>Nome, objetivo, fórmula, unidade, meta, frequência, fonte do dado, responsável pela coleta e pela análise, e o que fazer quando sair da meta. Sem ficha, cada pessoa calcula de um jeito.</p>
<h4>Do AS-IS ao TO-BE</h4><p>Perguntas para melhorar: essa etapa agrega valor ao cliente? Pode ser eliminada, juntada, simplificada ou automatizada? Há dado digitado duas vezes? Há aprovação sem motivo? Há espera entre etapas? Use a sequência <b>Eliminar → Simplificar → Automatizar → Padronizar</b>. Automatizar um processo ruim só faz o erro acontecer mais rápido.</p>
<h4>Dono do processo</h4><p>Responde pelos resultados, mantém o mapa e a IT atualizados, acompanha indicadores e lidera melhorias. Sem dono, o processo não melhora.</p>`,
["Eficácia, eficiência, efetividade, produtividade","Indicadores de resultado e de tendência","Ficha do indicador evita cálculos diferentes","Eliminar, simplificar, automatizar, padronizar"],
`Expedição: eficácia = % cargas saindo no horário; eficiência = volumes carregados por homem-hora; tendência = cargas pendentes de conferência às 16h (antecipa atraso na saída).`,
`Crie a ficha completa de um indicador da sua área e proponha 3 melhorias no TO-BE de um processo.`,
[["Custo por entrega é um indicador de:",["Eficácia","Eficiência","Efetividade","Satisfação"],1,"Mede o uso dos recursos."],["A ordem recomendada para melhorar é:",["Automatizar primeiro","Eliminar, simplificar, automatizar, padronizar","Padronizar e esquecer","Contratar mais gente"],1,"Automatize só o que já foi simplificado."]])]},
{n:"Ferramentas da Qualidade",o:"Aplicar as ferramentas básicas para coletar, priorizar e analisar problemas.",a:[
L("Folha de verificação, estratificação e Pareto",`<h4>Folha de verificação</h4><p>Formulário para coletar dados no momento em que acontecem, de forma padronizada. Defina antes: o que registrar, categorias, período, quem coleta. Exemplo de colunas: data, turno, cliente, tipo de ocorrência (avaria, falta, sobra, endereço), local.</p>
<h4>Estratificação</h4><p>Separar os dados por grupos (unidade, rota, turno, cliente, motorista, tipo de carga) para descobrir onde o problema se concentra. A média geral esconde: 3% de atraso no total pode ser 1% em quatro rotas e 12% em uma.</p>
<h4>Diagrama de Pareto</h4><p>Gráfico de barras em ordem decrescente com a linha de percentual acumulado. Mostra os <b>poucos vitais</b> que causam a maior parte do problema (regra 80/20).</p>
<table><tr><th>Ocorrência</th><th>Qtde</th><th>%</th><th>% acum.</th></tr>
<tr><td>Amarração inadequada</td><td>62</td><td>48%</td><td>48%</td></tr><tr><td>Empilhamento errado</td><td>31</td><td>24%</td><td>72%</td></tr>
<tr><td>Embalagem do cliente</td><td>18</td><td>14%</td><td>86%</td></tr><tr><td>Empilhadeira</td><td>11</td><td>9%</td><td>95%</td></tr><tr><td>Outros</td><td>7</td><td>5%</td><td>100%</td></tr></table>
<p>Atacando as duas primeiras causas, resolvemos 72% das avarias.</p>
<h4>Como fazer no Excel</h4><ol><li>Tabela com categoria e quantidade, ordenada do maior para o menor.</li><li>Calcule % e % acumulado.</li><li>Inserir → Gráfico de combinação: barras para quantidade e linha no eixo secundário para % acumulado.</li></ol>
<h4>Erros comuns</h4><ul><li>Categoria "outros" maior que as outras (categorias mal definidas).</li><li>Pareto por quantidade quando o problema é custo: faça também por valor em reais.</li></ul>`,
["Folha de verificação padroniza a coleta","Estratificar revela onde o problema se concentra","Pareto mostra os poucos vitais (80/20)","Faça Pareto por quantidade e por custo"],
`Um Pareto por valor pode mudar a prioridade: poucas ocorrências de extravio podem custar mais do que muitas avarias pequenas.`,
`Crie uma folha de verificação de ocorrências, use por 2 semanas e monte o Pareto por quantidade e por valor.`,
[["A linha do Pareto representa:",["Média","Percentual acumulado","Meta","Desvio padrão"],1,"A linha mostra o acumulado para achar os poucos vitais."],["Estratificar dados significa:",["Somar tudo","Separar por grupos para comparar","Apagar extremos","Arredondar"],1,"Estratificação divide os dados por categorias."]]),
L("Causa e efeito, 5 porquês e brainstorming",`<h4>Diagrama de Ishikawa</h4><p>Também chamado espinha de peixe ou causa e efeito. O problema fica na cabeça e as causas possíveis são organizadas em categorias, os <b>6M</b>:</p>
<table><tr><th>M</th><th>Pergunta</th><th>Exemplo (avaria)</th></tr>
<tr><td>Método</td><td>O procedimento é claro e seguido?</td><td>sem padrão de amarração</td></tr><tr><td>Máquina</td><td>Equipamentos adequados?</td><td>catraca gasta</td></tr>
<tr><td>Mão de obra</td><td>Pessoas treinadas e em número suficiente?</td><td>conferentes novos</td></tr><tr><td>Material</td><td>Insumos adequados?</td><td>fita de baixa resistência</td></tr>
<tr><td>Medida</td><td>Medições confiáveis?</td><td>avaria registrada tarde</td></tr><tr><td>Meio ambiente</td><td>Condições do local?</td><td>doca molhada, pouca luz</td></tr></table>
<p>O Ishikawa lista <b>causas possíveis</b>. Depois é preciso verificar com dados quais são as reais.</p>
<h4>5 porquês</h4><p>Pergunte "por quê?" até chegar a uma causa que, se eliminada, impede a repetição. Exemplo: carga avariada → caiu do palete → não estava amarrada → conferente não sabia que precisava → não há padrão nem treinamento → <b>causa raiz: ausência de padrão de amarração</b>. Teste: se eu criar o padrão e treinar, o problema some?</p>
<h4>Brainstorming bem feito</h4><ol><li>Defina o problema por escrito.</li><li>Gere ideias sem crítica (quantidade primeiro).</li><li>Todos falam, um de cada vez.</li><li>Agrupe ideias parecidas.</li><li>Priorize com votação ou matriz.</li></ol>
<h4>Erros comuns</h4><ul><li>Parar o porquê em "falha humana".</li><li>Escrever soluções no lugar de causas no Ishikawa.</li><li>Brainstorming dominado pelo chefe.</li></ul>`,
["Ishikawa organiza causas possíveis nos 6M","Causas possíveis precisam ser verificadas com dados","5 porquês até a causa que impede a repetição","'Falha humana' raramente é causa raiz"],
