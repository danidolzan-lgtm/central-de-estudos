["Ferramentas e MCP","Ferramentas são funções que o agente pode chamar, descritas por nome, descrição e parâmetros. O <b>MCP</b> (Model Context Protocol) padroniza a conexão entre agentes e sistemas, para que uma integração sirva a vários modelos.","Descreva 3 ferramentas que um agente de coletas precisaria."],
["Automação de processos","Combine automação clássica (agendamentos, scripts, RPA) com IA onde há texto ou decisão. Regra prática: o que é fixo vira regra; o que é variável vai para a IA; o que é crítico passa por uma pessoa.","Automatize um relatório que você faz manualmente toda semana."],
["Avaliação de sistemas com LLM","Monte um conjunto de casos de teste com a resposta esperada e meça acertos a cada mudança de prompt ou modelo. Monitore em produção: custo, tempo, erros e satisfação. Guarde exemplos de falhas para melhorar.","Crie 20 casos de teste para seu prompt de extração de e-mails."]],

["Painéis e apps","Streamlit transforma um script Python num app web em minutos: filtros, gráficos, upload de arquivo e resultado do modelo. Ótimo para mostrar valor rápido para a operação.","Crie um app Streamlit que mostre a previsão de atrasos."],

{n:"Nível 1 · Primeiros passos",o:"Apresentar-se e entender frases básicas.",w:[
["Verb to be","O verbo to be (ser/estar) é a base de tudo: <i>I am, you are, he/she/it is, we/they are</i>. Pergunta: inverta (<i>Are you ready?</i>). Negativa: acrescente not (<i>She isn't here</i>).\n\n<i>I am a quality analyst. The truck is late. Are they at the dock?</i>","Escreva 10 frases sobre você e seu trabalho usando to be."],
["Pronomes e possessivos","Sujeito: <i>I, you, he, she, it, we, they</i>. Possessivos: <i>my, your, his, her, its, our, their</i>. O 's indica posse: <i>the driver's phone</i> (o telefone do motorista).","Descreva sua família ou equipe usando possessivos."],
["There is / there are e artigos","<i>There is</i> (singular) e <i>there are</i> (plural) significam 'há/tem'. <b>A/an</b> = um/uma (an antes de som de vogal: <i>an invoice</i>). <b>The</b> = o/a/os/as, algo específico.\n\n<i>There are three trucks at the dock. There is an error in the invoice.</i>","Descreva sua unidade de trabalho com 8 frases usando there is/are."],
["Números, datas e horas","Números 1-100, ordinais (<i>first, second, third</i>), datas (<i>November 10th</i>), horas (<i>It's half past nine</i> = 9h30; <i>quarter to five</i> = 16h45). Em inglês americano a data é mês/dia: 11/10 = 10 de novembro.","Diga em voz alta 10 horários e 10 datas do seu calendário."]],

{n:"Nível 1 · Presente",o:"Falar de rotinas e do que está acontecendo agora.",w:[

["Perguntas e negativas com do/does","Pergunta: <i>Do you work on Saturdays? Does she speak English?</i> Negativa: <i>I don't drive. He doesn't work here.</i> Com does o verbo perde o -s.","Faça 5 perguntas a um colega imaginário sobre a rotina dele."],
["Advérbios de frequência","<i>always</i> (sempre), <i>usually</i> (geralmente), <i>often</i> (frequentemente), <i>sometimes</i> (às vezes), <i>rarely</i> (raramente), <i>never</i> (nunca). Ficam antes do verbo principal e depois do to be: <i>I usually check the reports. He is always on time.</i>","Diga com que frequência você faz 8 atividades."],
["Present continuous","Para ações acontecendo agora ou planos próximos: to be + verbo com -ing. <i>I am working now. The driver is loading the truck. We are meeting tomorrow.</i>","Descreva o que 6 pessoas estão fazendo agora na sua empresa."]],

{n:"Nível 1 · Passado e futuro",o:"Contar o que aconteceu e falar de planos.",w:[

["Simple past: irregulares","Os mais usados: <i>go/went, have/had, get/got, make/made, take/took, send/sent, come/came, see/saw, say/said, buy/bought, think/thought, leave/left</i>. Pergunta e negativa usam did: <i>Did you send it? I didn't see it.</i>","Coloque os 12 verbos no Anki e escreva uma frase com cada um."],

["Comparativos e superlativos","Palavras curtas: <i>-er / the -est</i> (<i>faster, the fastest</i>). Longas: <i>more / the most</i> (<i>more efficient, the most efficient</i>). Irregulares: <i>good/better/best, bad/worse/worst</i>.","Compare 3 rotas da empresa (distância, tempo, custo)."],
["Preposições de tempo e lugar","Tempo: <i>at</i> (horas: at 9), <i>on</i> (dias: on Monday), <i>in</i> (meses, anos: in November). Lugar: <i>at</i> (ponto: at the dock), <i>on</i> (superfície), <i>in</i> (dentro: in the warehouse).","Escreva 10 frases sobre a agenda da semana com as preposições certas."],
["Contáveis e incontáveis","Contáveis: <i>boxes, trucks</i> (many, a few). Incontáveis: <i>information, equipment, freight, advice</i> (much, a little) e nunca levam -s. <i>Some</i> em afirmativas, <i>any</i> em perguntas e negativas.","Faça 8 frases com much, many, some e any."]],

{n:"Nível 2 · Modais e instruções",o:"Dar conselhos, expressar obrigação e possibilidade.",w:[
["Should, must e have to","<i>should</i> = conselho (<i>You should check the invoice</i>). <i>must</i> = obrigação forte, muitas vezes interna ou regra escrita. <i>have to</i> = obrigação externa. <i>don't have to</i> = não precisa; <i>mustn't</i> = é proibido.","Escreva 5 regras de segurança do armazém com must e mustn't."],
["May e might","Possibilidade: <i>The truck might be late. It may rain tomorrow.</i> May também é usado para pedir permissão de forma formal: <i>May I come in?</i>","Escreva 5 riscos para a próxima semana com might."],
["Pedidos educados","Do mais direto ao mais educado: <i>Can you…? Could you…? Would you mind + -ing…? I was wondering if you could…</i>","Reescreva 5 pedidos diretos de forma educada."],
["Instruções e sequências","Imperativo: <i>Check the seal. Sign the form.</i> Sequência: <i>First, … Next, … Then, … Finally, …</i> Negativa: <i>Don't stack the boxes.</i>","Escreva em inglês o passo a passo de um processo da empresa."]],

 ing:'<path d="M5 8h20a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H14l-6 5v-5H5a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M31 15h3a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-2v4l-5-4h-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><text x="15" y="19.5" font-size="9" font-weight="700" text-anchor="middle" fill="currentColor" font-family="Inter,sans-serif">EN</text>'};

/* semanas achatadas por curso */
C.forEach(c=>{c.L=[];c.mods.forEach((m,mi)=>{m.w.forEach((w,wi)=>c.L.push({mi,wi,k:`${c.id}-${mi}-${wi}`,t:w[0],w}));c.L.push({mi,wi:m.w.length,k:`${c.id}-${mi}-r`,t:"Revisão e avaliação: "+m.n,rev:true});});
 c.L.forEach((x,i)=>{x.i=i;x.ini=wDate(i);x.fim=new Date(x.ini.getTime()+6*DIA);});
 {const l=c.L[c.L.length-1],em=new Date(l.ini.getFullYear(),l.ini.getMonth()+1,0);c.fimData=l.fim<em?l.fim:em;l.fim=c.fimData;} c.carga=c.L.length*c.horas;});
const curWeek=Math.floor((HOJE-INICIO)/(7*DIA));

/* estado: navegador + sincronização na conta */
let st={feito:{},pagas:{},nome:"",conc:{},quiz:{}};
try{const s=JSON.parse(localStorage.getItem("planoEstudos3")||"null");if(s)st=Object.assign(st,s);}catch(e){}

function save(){try{localStorage.setItem("planoEstudos3",JSON.stringify(st));}catch(e){}
 if(docRef){clearTimeout(dbTimer);dbTimer=setTimeout(()=>docRef.set(JSON.parse(JSON.stringify(st))).then(()=>syncMsg("Progresso sincronizado na sua conta")).catch(()=>syncMsg("Progresso salvo neste navegador")),1200);}}
function syncMsg(t){const e=document.getElementById("sync");if(e)e.textContent=t;}
(async()=>{try{if(!window.claude||!claude.use)return;const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);if(!d||!u)return;
 const id=await u.id();if(!id)return;db=d;docRef=d.doc("data/users/"+id+"/progresso");
 const snap=await docRef.get();if(snap.exists){const r=snap.data()||{};
  ["feito","pagas","conc","quiz"].forEach(k=>st[k]=Object.assign({},r[k]||{},st[k]));if(!st.nome&&r.nome)st.nome=r.nome;}
 syncMsg("Progresso sincronizado na sua conta");save();render();}catch(e){}})();

const doneCount=c=>c.L.filter(x=>st.feito[x.k]).length;
const pct=c=>Math.round(doneCount(c)/c.L.length*100);
const nextW=c=>c.L.find(x=>!st.feito[x.k])||c.L[c.L.length-1];

 const esperado=Math.min(c.L.length,curWeek+1),d=doneCount(c);
 if(d>=c.L.length)return '<span class="pill ok">Concluído</span>';
 if(d>=esperado)return `<span class="pill ok">${d>esperado?"Adiantado "+(d-esperado)+" sem.":"No ritmo"}</span>`;
 return `<span class="pill late">${esperado-d} sem. atrasado</span>`;}
function setDone(k,v){st.feito[k]=v;const c=C.find(x=>k.startsWith(x.id+"-"));
 if(c&&doneCount(c)===c.L.length&&!st.conc[c.id])st.conc[c.id]=dmy(HOJE);
 if(c&&doneCount(c)<c.L.length)delete st.conc[c.id];save();}

/* rotas */
let route="inicio",tab="curso";
function go(r,t){route=r;if(t)tab=t;if(location.hash!=="#"+r)location.hash=r;render();window.scrollTo(0,0);}

}

 const feitos=C.reduce((s,c)=>s+doneCount(c),0), tot=C.reduce((s,c)=>s+c.L.length,0);

function drawChart(mensal){

 ${c.mods.map((m,mi)=>{const s=modStats(c,mi),ini=s.ws[0].ini,fim=s.ws[s.n-1].fim;return `<details class="mod ${s.d===s.n?"done":""}" ${n.mi===mi?"open":""}>
  <summary><div class="mh"><span class="mnum">${mi+1}</span><div class="nowrap"><h4 class="nowrap">${m.n}</h4><div class="sub num">${ddmm(ini)}/${String(ini.getFullYear()).slice(2)} a ${ddmm(fim)}/${String(fim.getFullYear()).slice(2)} · ${s.d}/${s.n} semanas</div></div></div><span class="minibar"><i style="width:${s.p}%"></i></span></summary>
  <p class="mobj">${m.o}</p>
  <ul class="weeks">${s.ws.map(x=>`<li class="wk ${st.feito[x.k]?"done":""} ${x.i===curWeek?"now":""}"><input type="checkbox" data-k="${x.k}" aria-label="Concluída" ${st.feito[x.k]?"checked":""}>
   <button class="open" data-w="${x.i}"><span class="d num">Sem ${x.i+1} · ${ddmm(x.ini)}</span><span class="t">${esc(x.t)}</span></button>${x.rev?'<span class="tag">Avaliação</span>':x.w[3]?'<span class="tag">Aula completa</span>':""}</li>`).join("")}</ul></details>`}).join("")}</div>`;
 tv.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>openW(c,+b.dataset.w));
 tv.querySelectorAll("input[data-k]").forEach(i=>i.onchange=()=>{setDone(i.dataset.k,i.checked);render();});
}
function tabTrilha(tv,c){
 const n=nextW(c),allDone=doneCount(c)===c.L.length;
 tv.innerHTML=`<div class="grid2" style="align-items:start">
 <section class="panel"><div class="panel-head"><h3>Trilha do curso</h3><span class="note num">${pct(c)}% percorrido</span></div>
 <ol class="trail">${c.mods.map((m,mi)=>{const s=modStats(c,mi),cur=!allDone&&n.mi===mi;
  return `<li class="stop ${s.d===s.n?"done":""} ${cur?"cur":""}"><div class="road"><span class="fill" style="height:${s.d===s.n?100:s.p}%"></span><div class="node" style="--p:${s.p}"><span>${s.d===s.n?"✓":mi+1}</span></div></div>
   <div class="sinfo"><h4 class="nowrap">${m.n}</h4><div class="note num">${s.d}/${s.n} semanas · ${mesLbl(Math.max(0,Math.round((s.ws[0].ini-INICIO)/(30.44*DIA))))}</div>${cur?`<div class="truck">${truckSvg} Você está aqui: ${esc(n.t)}</div>`:""}</div></li>`}).join("")}
  <li class="stop goal ${allDone?"done":""}"><div class="road"><span class="fill" style="height:${allDone?100:0}%"></span><div class="node" style="--p:${allDone?100:0}"><span>★</span></div></div>
   <div class="sinfo"><h4>Certificado de conclusão</h4><div class="note">${allDone?"Liberado em "+st.conc[c.id]:"Libera ao concluir as "+c.L.length+" semanas"}</div></div></li></ol></section>
 <section class="panel"><div class="panel-head"><h3>Selos de módulo</h3><span class="note">${c.mods.filter((_,mi)=>{const s=modStats(c,mi);return s.d===s.n}).length} de ${c.mods.length}</span></div>
  <div class="badges">${c.mods.map((m,mi)=>{const s=modStats(c,mi);return `<span class="badge ${s.d===s.n?"on":""}" title="${esc(m.n)}">${mi+1}</span>`}).join("")}</div>
  <p class="note" style="margin-top:12px">Cada módulo termina com uma semana de revisão e avaliação. Concluindo todas as semanas do módulo, o selo acende.</p></section></div>`;
}
function tabFin(tv,c){
 const total=c.parcela*c.parcelas,pagas=[...Array(c.parcelas)].filter((_,i)=>st.pagas[c.id+"-"+i]).length;
 tv.innerHTML=`<div class="grid2" style="align-items:start">
 <section class="panel"><div class="panel-head"><h3>Parcelas</h3><span class="note num">${pagas} de ${c.parcelas} pagas</span></div>
  <div class="tw"><table class="fin num"><thead><tr><th>Nº</th><th>Mês</th><th>Valor</th><th>Paga</th></tr></thead><tbody>
  ${[...Array(c.parcelas)].map((_,i)=>`<tr><td>${i+1}</td><td>${mesLbl(i)}</td><td>${brl(c.parcela)}</td><td><input type="checkbox" data-p="${c.id}-${i}" aria-label="Parcela ${i+1} paga" ${st.pagas[c.id+"-"+i]?"checked":""}></td></tr>`).join("")}
  </tbody></table></div></section>
 <section class="panel" style="display:grid;gap:12px"><h3>Resumo</h3>
  <div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><span>Total do curso</span><b class="num">${brl(total)}</b></div><div class="kpi"><span>Já pago</span><b class="num">${brl(pagas*c.parcela)}</b></div>
  <div class="kpi"><span>Falta pagar</span><b class="num">${brl(total-pagas*c.parcela)}</b></div><div class="kpi"><span>Custo por hora</span><b class="num">${brl(Math.round(total/c.carga))}</b></div></div>
  <p class="note">${{qual:"Mercado: pós EAD em Gestão da Qualidade vai de R$ 50 a R$ 560 por mês, com média perto de R$ 120. R$ 160 cobre uma instituição de boa reputação.",ia:"Mercado: pós EAD em IA vai de R$ 40 a R$ 1.180 por mês, com média perto de R$ 110. R$ 200 permite curso com aulas ao vivo e projetos.",aud:"Estimativa: formação de auditor líder SGI costuma custar entre R$ 1.500 e R$ 4.000 no total. R$ 1.600 em 8x cobre um preparatório EAD com certificado.",ing:"Estimativa: escolas online cobram de R$ 150 a R$ 450 por mês. R$ 250 cobre aulas ao vivo em grupo. Plano estendido até dez/2028 (26 parcelas)."}[c.id]}</p></section></div>`;
 tv.querySelectorAll("[data-p]").forEach(i=>i.onchange=()=>{st.pagas[i.dataset.p]=i.checked;save();tabFin(tv,c);});
}
function tabLeit(tv,c){
 tv.innerHTML=`<div class="grid2" style="align-items:start">
 <section class="panel"><div class="panel-head"><h3>Livros recomendados</h3></div>${c.livros.map(b=>`<div class="book"><span class="spine"></span><div><b>${b[0]}</b><small>${b[1]}</small><small>${b[2]}</small></div></div>`).join("")}</section>
 <section class="panel"><div class="panel-head"><h3>Sites e cursos gratuitos</h3></div>${c.sites.map(s=>`<a class="site" href="${s[1]}" target="_blank" rel="noopener"><div><b>${s[0]}</b><br><span>${s[2]}</span></div><em>↗</em></a>`).join("")}</section></div>`;
}
function tabCert(tv,c){
 const ok=doneCount(c)===c.L.length,cod=(c.id+"-"+(st.conc[c.id]||"")+"-"+(st.nome||"")).split("").reduce((h,ch)=>(h*31+ch.charCodeAt(0))>>>0,7).toString(36).toUpperCase().slice(0,8);
 const quizTot=c.mods.length;
 tv.innerHTML=`<div style="display:grid;gap:14px" class="${ok?"":"locked"}">
 ${ok?"":`<div class="panel lockmsg"><span class="pill late">Bloqueado</span><span>Conclua as ${c.L.length-doneCount(c)} semanas restantes para liberar o certificado.</span></div>`}
 <label class="field" for="certNome">Nome no certificado<input id="certNome" value="${esc(st.nome)}" placeholder="Seu nome completo" maxlength="60"></label>
 <div class="certwrap"><div class="cert" id="cert" style="--cc:var(--${c.id})">
  <div class="k">CERTIFICADO DE CONCLUSÃO</div><h3>Plano de Estudos</h3><p>Certificamos que</p>
  <div class="nm" id="certNm">${esc(st.nome||"Seu nome")}</div>
  <p>concluiu a trilha de estudos</p><div class="cn">${c.nome}</div>
  <p>com ${c.L.length} semanas de estudo, ${c.mods.length} módulos e ${quizTot} avaliações, carga horária de ${c.carga} horas, no período de ${dmy(c.L[0].ini)} a ${ok?st.conc[c.id]:dmy(c.fimData)}.</p>
  <div class="foot"><span>Concluído em ${ok?st.conc[c.id]:"—"}</span><span>Código ${ok?cod:"—"}</span></div>
  <div class="seal">${c.carga} h<br>${c.curto}</div></div></div>
 <div class="nav"><p class="note">Certificado do seu plano pessoal de estudos. O diploma oficial vem da instituição em que você se matricular.</p>
  <button class="btn main" id="dl" ${ok?"":"disabled"} hidden>Baixar certificado (PNG)</button></div></div>`;
 const inp=tv.querySelector("#certNome");inp.oninput=()=>{st.nome=inp.value.trim();save();tv.querySelector("#certNm").textContent=st.nome||"Seu nome";};
 inp.onchange=()=>tabCert(tv,c);
 const dl=tv.querySelector("#dl");
 dl.hidden=false;
 dl.onclick=async()=>{dl.disabled=true;dl.textContent="Gerando…";try{const blob=await certPng(c,cod),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`certificado-${c.id}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);dl.textContent="Certificado baixado";}catch(e){dl.textContent="Não foi possível baixar";}setTimeout(()=>{dl.disabled=false;dl.textContent="Baixar certificado (PNG)";},2500);};
}
async function certPng(c,cod){
 try{await document.fonts.ready;}catch(e){}
 const W=2000,H=1414,cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
 const cc=getComputedStyle(document.documentElement).getPropertyValue("--"+c.id).trim();
 g.fillStyle="#fffdf8";g.fillRect(0,0,W,H);g.strokeStyle=cc;g.lineWidth=8;g.strokeRect(40,40,W-80,H-80);g.lineWidth=2;g.globalAlpha=.5;g.strokeRect(62,62,W-124,H-124);g.globalAlpha=1;
 g.textAlign="center";const t=(s,f,col,y)=>{g.font=f;g.fillStyle=col;g.fillText(s,W/2,y);};
 g.letterSpacing="12px";t("CERTIFICADO DE CONCLUSÃO","700 34px 'Space Grotesk',sans-serif",cc,260);g.letterSpacing="0px";
 t("Plano de Estudos","600 84px 'Cormorant Garamond',Georgia,serif","#1c2333",370);
 t("Certificamos que","400 32px Inter,sans-serif","#3b4459",460);
 t(st.nome||"Seu nome","italic 500 96px 'Cormorant Garamond',Georgia,serif","#1c2333",580);
 g.strokeStyle="#c9ccd6";g.lineWidth=2;g.beginPath();g.moveTo(560,610);g.lineTo(1440,610);g.stroke();
 t("concluiu a trilha de estudos","400 32px Inter,sans-serif","#3b4459",690);
 t(c.nome,"700 50px 'Space Grotesk',sans-serif",cc,770);
 t(`com ${c.L.length} semanas de estudo, ${c.mods.length} módulos e ${c.mods.length} avaliações,`,"400 30px Inter,sans-serif","#3b4459",860);
 t(`carga horária de ${c.carga} horas, de ${dmy(c.L[0].ini)} a ${st.conc[c.id]}.`,"400 30px Inter,sans-serif","#3b4459",905);
 g.font="400 26px Inter,sans-serif";g.fillStyle="#5b6478";g.textAlign="left";g.fillText("Concluído em "+st.conc[c.id],200,1180);g.fillText("Código "+cod,200,1220);
 g.beginPath();g.arc(1700,1130,105,0,7);g.fillStyle=cc;g.fill();g.lineWidth=6;g.strokeStyle="#fffdf8";g.beginPath();g.arc(1700,1130,92,0,7);g.stroke();
 g.fillStyle="#fff";g.textAlign="center";g.font="700 40px 'Space Grotesk',sans-serif";g.fillText(c.carga+" h",1700,1125);g.font="600 24px 'Space Grotesk',sans-serif";g.fillText(c.curto,1700,1162);
 return await new Promise(r=>cv.toBlob(r,"image/png"));
}

/* leitor de aula */
const reader=document.getElementById("reader"),sheet=document.getElementById("sheet");let lastFocus=null;
function fmt(t){return t.split(/\n\n+/).map(b=>/^\s*<(table|pre)/.test(b)?`<div class="tbl">${b}</div>`:`<p>${b.replace(/\n/g," ")}</p>`).join("");}
function openW(c,i){
 const x=c.L[i],m=c.mods[x.mi];sheet.className="sheet c-"+c.id;
 let body="";
 if(x.rev){const qs=m.q;body=`<div class="lesson"><p>Semana de revisão do módulo <b>${m.n}</b>. Releia os pontos-chave das aulas, refaça as atividades que ficaram pendentes e responda a avaliação.</p></div>
  <div class="box"><h4>O que revisar</h4><ul>${m.w.map(w=>`<li>${esc(w[0])}</li>`).join("")}</ul></div>
  ${qs.map((q,qi)=>quizHtml(q[0],q[1],qi,true)).join("")}`;}
 else{const w=x.w,a=w[3]?A[w[3]]:null;
  body=a?`<div class="lesson">${fmt(a.r)}</div><div class="box"><h4>Pontos-chave</h4><ul>${a.p.map(p=>`<li>${p}</li>`).join("")}</ul></div><div class="box"><h4>Na prática</h4><div class="lesson">${fmt(a.ex)}</div></div>${quizHtml(a.q.p,a.q.o,0)}`
   :`<div class="lesson">${fmt(w[1])}</div>`;
  body+=`<div class="box task"><h4>Atividade da semana</h4><div class="lesson"><p>${w[2]}</p></div></div>`;}
 sheet.innerHTML=`<div class="sheet-top"><span class="k nowrap">${c.curto} · Módulo ${x.mi+1} · Semana ${x.i+1} de ${c.L.length}</span><button class="x" id="lClose" aria-label="Fechar aula">×</button></div>
  <div><h2 id="lTitle">${esc(x.t)}</h2><div class="when num">${dmy(x.ini)} a ${dmy(x.fim)} · ${c.horas} h de estudo</div></div>${body}
  <label class="donechk"><input type="checkbox" id="lDone" ${st.feito[x.k]?"checked":""}> Semana concluída</label>
  <div class="nav"><button class="btn" id="lPrev" ${i===0?"disabled":""}>← Anterior</button><button class="btn main" id="lNext">${i===c.L.length-1?"Concluir curso":"Concluir e avançar →"}</button></div>`;
 const answers=x.rev?m.q.map(q=>[q[2],q[3]]):(x.w[3]&&A[x.w[3]]?[[A[x.w[3]].q.c,A[x.w[3]].q.e]]:[]);
 sheet.querySelectorAll(".quiz").forEach((qz,qi)=>qz.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const [ci,ex]=answers[qi],ok=+b.dataset.i===ci;
  qz.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));b.classList.add(ok?"right":"wrong");
  const fb=qz.querySelector(".fb");fb.hidden=false;fb.innerHTML=ok?"<b>Certo.</b> "+ex:"<b>Ainda não.</b> Releia a aula e tente outra opção.";}));
 sheet.querySelector("#lClose").onclick=closeW;
 sheet.querySelector("#lDone").onchange=e=>{setDone(x.k,e.target.checked);render();};
 sheet.querySelector("#lPrev").onclick=()=>openW(c,i-1);
 sheet.querySelector("#lNext").onclick=()=>{setDone(x.k,true);render();if(i<c.L.length-1)openW(c,i+1);else{closeW();if(route===c.id){tab="cert";render();}}};
 if(reader.hidden){lastFocus=document.activeElement;reader.hidden=false;document.body.style.overflow="hidden";}
 sheet.scrollTop=0;sheet.querySelector("#lClose").focus();
}
function quizHtml(p,o,qi,rev){return `<div class="quiz"><h4>${rev?"Questão "+(qi+1):"Exercício"}: ${p}</h4>${o.map((t,i)=>`<button class="opt" data-i="${i}">${t}</button>`).join("")}<p class="fb" hidden></p></div>`;}
function closeW(){reader.hidden=true;document.body.style.overflow="";if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}
reader.addEventListener("click",e=>{if(e.target===reader)closeW();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!reader.hidden)closeW();});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});}catch(e){}
render();
</script>
