L("Auditoria integrada do SGI na prática",`<h4>Níveis de integração do auditado</h4>
<table><tr><th>Nível</th><th>Como é</th><th>Impacto na auditoria</th></tr>
<tr><td>Sistemas separados</td><td>Manuais, procedimentos e equipes diferentes</td><td>Auditorias combinadas, com pouca sinergia</td></tr>
<tr><td>Parcialmente integrado</td><td>Documentos de apoio comuns (controle de documentos, auditoria, NC), operação separada</td><td>Plano único com algumas partes separadas</td></tr>
<tr><td>Totalmente integrado</td><td>Política, objetivos, riscos, processos e análise crítica únicos</td><td>Auditoria por processo, cobrindo tudo de uma vez</td></tr></table>
<h4>Planejando a auditoria integrada</h4>
<ul><li>Use a matriz de correlação das três normas (feita na primeira aula).</li>
<li>Planeje por processo; em cada processo, liste os requisitos de cada norma.</li>
<li>Equipe com competência nas três disciplinas; se um auditor não tem competência em SSO, combine com outro ou com especialista técnico.</li>
<li>O tempo de auditoria integrada é menor que a soma das separadas, mas a redução depende do nível real de integração (documentos IAF definem regras para auditorias combinadas de certificação).</li></ul>
<h4>Correlação rápida: o que é comum e o que é específico</h4>
<table><tr><th>Cláusula</th><th>Comum</th><th>Específico 9001</th><th>Específico 14001</th><th>Específico 45001</th></tr>
<tr><td>5</td><td>Liderança, política, papéis</td><td>Foco no cliente</td><td>Compromisso com proteção ambiental</td><td>5.4 consulta e participação</td></tr>
<tr><td>6.1</td><td>Riscos e oportunidades</td><td>—</td><td>Aspectos e obrigações</td><td>Perigos e requisitos legais</td></tr>
<tr><td>7</td><td>Recursos, competência, comunicação, documentos</td><td>Medição, conhecimento</td><td>Comunicação externa</td><td>Competência para identificar perigos</td></tr>
<tr><td>8</td><td>Controle operacional</td><td>Requisitos, projeto, fornecedores, liberação</td><td>Ciclo de vida, emergências</td><td>Hierarquia, mudanças, contratados, emergências</td></tr>
<tr><td>9</td><td>Monitoramento, auditoria, análise crítica</td><td>Satisfação do cliente</td><td>Avaliação de conformidade</td><td>Avaliação de conformidade</td></tr>
<tr><td>10</td><td>NC, ação corretiva, melhoria</td><td>—</td><td>—</td><td>Incidentes</td></tr></table>
<h4>Entrevista integrada</h4>
<p>Ao entrevistar o supervisor de manutenção, num único bloco: <i>Como vocês planejam a manutenção preventiva (9001 7.1.3)? Onde vão o óleo e as peças trocadas (14001 8.1)? Como é feita a permissão para trabalho em painel elétrico (45001 8.1.2 / NR-10)? Qual foi o último incidente ou quase acidente e o que mudou (45001 10.2)?</i></p>
<h4>Relatando no SGI</h4>
<p>Cada NC deve indicar a cláusula de cada norma afetada. Uma mesma falha pode atingir as três: ausência de avaliação de eficácia de treinamentos atinge 7.2 das três normas e vira <b>uma</b> NC com três referências, não três NCs duplicadas.</p>
<h4>Riscos da auditoria integrada</h4>
<ul><li>Uma disciplina "engolir" as outras (geralmente a qualidade domina e SSO fica superficial).</li>
<li>Auditor sem competência em todas as áreas.</li>
<li>Pressa: tentar cobrir tudo e não aprofundar nada.</li>
<li>Integração só no papel: manual único, mas operação desconectada.</li></ul>`,

L("Preparação para a prova de auditor líder",`<h4>Como costuma ser a certificação de auditor líder</h4>
<p>Cursos de auditor líder aprovados (CQI/IRCA, Exemplar Global e outros esquemas) têm em geral cerca de 40 horas por norma, avaliação contínua durante o curso (simulações e estudos de caso) e uma <b>prova escrita final</b>. Os formatos mudam com o tempo e variam por esquema e provedor: confirme sempre as regras atuais. Depois do curso, o registro como auditor normalmente exige experiência comprovada em auditorias.</p>
<h4>O que as provas avaliam</h4>
<table><tr><th>Área</th><th>Conteúdo típico</th></tr>
<tr><td>Norma da disciplina</td><td>Propósito e interpretação dos requisitos, termos e definições</td></tr>
<tr><td>Princípios e processo de auditoria</td><td>ISO 19011, papéis, etapas, ISO/IEC 17021-1 para certificação</td></tr>
<tr><td>Planejamento</td><td>Plano, escopo, amostragem, alocação de equipe</td></tr>
<tr><td>Condução</td><td>Perguntas, evidências, cenários de campo</td></tr>
<tr><td>Constatações</td><td>Identificar NCs em estudos de caso, citar a cláusula, classificar</td></tr>
<tr><td>Relato e follow-up</td><td>Conclusões, ações corretivas, verificação de eficácia</td></tr>
<tr><td>Comportamento</td><td>Ética, conflitos, situações difíceis</td></tr></table>
<h4>Estudo de caso resolvido</h4>
<p><b>Cenário</b>: Num armazém, você observa um funcionário terceirizado operando uma empilhadeira. Ele diz que começou na semana passada e que "aprendeu olhando os colegas". O supervisor informa que o curso de operador está agendado para o mês que vem.</p>
<p><b>Resposta</b>: Requisito: ISO 45001, 7.2 (competência) e 8.1.4.2 (contratados); também a NR-11 exige que o operador seja habilitado e treinado. Evidência: operador terceirizado operando empilhadeira sem treinamento, conforme declaração dele e do supervisor, em [data], no armazém. Declaração: a organização não assegurou a competência de trabalhador contratado em atividade com perigo significativo. Classificação: provavelmente maior, por risco grave à vida e descumprimento legal. Ação imediata do auditor: comunicar ao responsável para interromper a atividade.</p>
<h4>Técnicas para a prova</h4>
<ul><li>Leia o cenário duas vezes; sublinhe fatos, não opiniões.</li>
<li>Para cada fato, pergunte: qual requisito ele atende ou não atende?</li>
<li>Sempre indique cláusula e norma; seja específico.</li>
<li>Diferencie NC de OM: sem requisito violado, não é NC.</li>
<li>Em perguntas de comportamento, a resposta certa preserva os princípios (integridade, independência, apresentação justa).</li>
<li>Administre o tempo: não gaste metade da prova numa questão.</li></ul>
<h4>Plano de revisão das últimas semanas</h4>
<ol><li>Releia a ISO 19011 e as três normas inteiras, com marcador.</li>
<li>Refaça a matriz de correlação de memória.</li>
<li>Escreva 30 NCs a partir de situações variadas, cronometrando.</li>
<li>Faça os quizzes de revisão de todos os módulos.</li>
<li>Simule uma reunião de abertura e uma de encerramento em voz alta.</li></ol>
<h4>Próximos passos depois deste curso</h4>
<p>Fazer um curso de auditor líder aprovado (de cada norma ou integrado), participar de auditorias internas como auditor e depois como líder, acompanhar auditorias externas e registrar as horas. Com experiência, é possível atuar em organismos de certificação, em auditorias de segunda parte ou como auditor líder interno de SGI.</p>`,

L("O que é um sistema de gestão e por que integrar",`<h4>Sistema de gestão em uma frase</h4>
<p>É o "jeito organizado" de uma organização transformar intenções (política) em resultados (objetivos), controlando processos, pessoas e recursos e aprendendo com os erros. Toda organização tem algum sistema de gestão, formal ou não; as normas ISO oferecem um modelo testado e reconhecido internacionalmente.</p>
<h4>Os três pilares do SGI</h4>
<table><tr><th>Sistema</th><th>Norma</th><th>Pergunta que responde</th><th>Resultado pretendido</th></tr>
<tr><td>Qualidade (SGQ)</td><td>ISO 9001</td><td>Entregamos o que o cliente precisa, sempre?</td><td>Produtos e serviços conformes e satisfação do cliente</td></tr>
<tr><td>Ambiental (SGA)</td><td>ISO 14001</td><td>Como reduzimos nosso impacto no meio ambiente?</td><td>Desempenho ambiental, compliance, objetivos ambientais</td></tr>
<tr><td>Saúde e segurança (SGSSO)</td><td>ISO 45001</td><td>Como evitamos que as pessoas se machuquem ou adoeçam?</td><td>Prevenção de lesões e problemas de saúde, locais de trabalho seguros e saudáveis</td></tr></table>
<h4>SGI: Sistema de Gestão Integrado</h4>
<p>É um único sistema que atende aos requisitos de duas ou mais normas, com elementos comuns compartilhados. Não é "três sistemas num só manual": é uma forma de gerir a organização em que qualidade, meio ambiente e segurança são considerados juntos em cada decisão.</p>
<h4>Benefícios da integração</h4>
<ul><li><b>Menos burocracia</b>: um controle de documentos, uma auditoria interna, uma análise crítica, um tratamento de não conformidades.</li>
<li><b>Visão sistêmica</b>: uma mudança de processo é avaliada ao mesmo tempo quanto a qualidade, ambiente e segurança.</li>
<li><b>Menos conflito</b> entre áreas (produção, qualidade, SESMT, meio ambiente).</li>
<li><b>Custos menores</b> de manutenção e de auditorias de certificação combinadas.</li>
<li><b>Coerência</b> para a liderança, que olha um painel único de desempenho.</li></ul>
<h4>Desafios</h4>
<ul><li>Culturas e linguagens diferentes entre áreas técnicas.</li>
<li>Risco de uma disciplina dominar (em geral a qualidade).</li>
<li>Requisitos específicos que não podem ser "diluídos" (participação dos trabalhadores na 45001, aspectos ambientais na 14001).</li>
<li>Exige profissionais com visão das três áreas: exatamente o objetivo desta pós.</li></ul>
<h4>Abordagem de processo e PDCA</h4>
<p>As três normas se apoiam em duas ideias. <b>Abordagem de processo</b>: entender a organização como processos interligados que transformam entradas em saídas. <b>PDCA</b>: Planejar (cláusulas 4 a 6), Fazer (7 e 8), Checar (9), Agir (10). Junto com o <b>pensamento baseado em risco</b>, formam a espinha dorsal de qualquer sistema moderno.</p>
<h4>Mitos comuns</h4>
<table><tr><th>Mito</th><th>Realidade</th></tr>
<tr><td>Sistema de gestão é papelada</td><td>As normas atuais exigem pouca documentação obrigatória; o foco é resultado</td></tr>
<tr><td>Certificação garante produto perfeito</td><td>Garante que existe um sistema para controlar e melhorar</td></tr>
<tr><td>É assunto do setor da qualidade</td><td>É responsabilidade da alta direção e de todos</td></tr>
<tr><td>Só serve para indústria</td><td>Serve para hospitais, escolas, prefeituras, ONGs, software, serviços</td></tr></table>`,
["Sistema de gestão: política → objetivos → processos → resultados → melhoria","SGI = um sistema atendendo várias normas","Benefícios: menos burocracia, visão sistêmica, custo menor","Abordagem de processo + PDCA + pensamento baseado em risco","Não é papelada nem assunto só da qualidade"],
`Numa padaria com SGI, a troca do forno a lenha por forno elétrico é avaliada de uma vez: padrão de assamento e treinamento (qualidade), fim da fumaça e mudança no consumo de energia (ambiente), eliminação do risco de queimadura com brasas e da exposição à fumaça (segurança).`,

L("História: da inspeção à gestão integrada",`<h4>A evolução da qualidade</h4>
<table><tr><th>Era</th><th>Período</th><th>Foco</th></tr>
<tr><td>Inspeção</td><td>Até 1930</td><td>Separar defeitos no final da produção</td></tr>
<tr><td>Controle estatístico</td><td>1930–1950</td><td>Controlar a variação durante o processo (Shewhart, cartas de controle)</td></tr>
<tr><td>Garantia da qualidade</td><td>1950–1980</td><td>Sistemas e procedimentos para prevenir falhas</td></tr>
<tr><td>Gestão estratégica / Qualidade total</td><td>1980 em diante</td><td>Qualidade como estratégia, envolvendo toda a organização e o cliente</td></tr></table>
<h4>Os grandes pensadores</h4>
<table><tr><th>Autor</th><th>Contribuição</th></tr>
<tr><td>W. Edwards Deming</td><td>A maioria dos problemas vem do sistema, não das pessoas; 14 pontos; difundiu o ciclo PDCA (PDSA) no Japão</td></tr>
<tr><td>Joseph Juran</td><td>Qualidade como adequação ao uso; Trilogia (planejar, controlar, melhorar); aplicação do princípio de Pareto</td></tr>
<tr><td>Philip Crosby</td><td>Zero defeito; "a qualidade é gratuita": o caro é a não qualidade</td></tr>
<tr><td>Armand Feigenbaum</td><td>Controle da Qualidade Total (TQC): todas as áreas participam</td></tr>
<tr><td>Kaoru Ishikawa</td><td>Diagrama de causa e efeito, 7 ferramentas, Círculos de Controle da Qualidade</td></tr>
<tr><td>Taiichi Ohno</td><td>Sistema Toyota de Produção, base do Lean</td></tr></table>
<h4>A trajetória ambiental</h4>
<ul><li>1972: Conferência de Estocolmo, primeira grande conferência da ONU sobre meio ambiente.</li>
<li>1987: Relatório Brundtland define <b>desenvolvimento sustentável</b>: atender às necessidades do presente sem comprometer as gerações futuras.</li>
<li>1992: Rio-92 (Eco-92), Agenda 21; a ISO cria comitê de gestão ambiental (TC 207).</li>
<li>1992: BS 7750 britânica, base da ISO 14001.</li>
<li>1996: primeira ISO 14001; revisões em 2004 e 2015, emenda climática em 2024 e nova edição em preparação.</li>
<li>2015: Acordo de Paris e Objetivos de Desenvolvimento Sustentável (ODS) da ONU.</li></ul>
<h4>A trajetória da saúde e segurança</h4>
<ul><li>Revolução Industrial: jornadas longas e acidentes levam às primeiras leis trabalhistas.</li>
<li>1919: criação da OIT (Organização Internacional do Trabalho).</li>
<li>1978: Normas Regulamentadoras (NRs) no Brasil (Portaria 3.214).</li>
<li>1999: OHSAS 18001, especificação amplamente usada para SST.</li>
<li>2018: ISO 45001 substitui a OHSAS 18001, alinhada à estrutura comum.</li>
<li>2020 em diante: revisão da NR-1 com GRO/PGR e inclusão de riscos psicossociais.</li></ul>
<h4>A família ISO 9000</h4>
<p>Primeira edição em 1987, revisões em 1994, 2000 (abordagem de processo), 2008 e 2015 (risco e estrutura comum), emenda climática em 2024 e edição 2026. A lição histórica: as normas evoluíram de "documentar tudo" para "gerir riscos e resultados".</p>`,

L("Normas ISO: como são feitas, como ler e a Estrutura Harmonizada",`<h4>Quem faz as normas</h4>
<ul><li><b>ISO</b> (International Organization for Standardization): federação de organismos nacionais de normalização, com sede em Genebra. As normas são criadas por comitês técnicos (TC 176 qualidade, TC 207 ambiental, TC 283 SSO) por consenso entre especialistas de vários países.</li>
<li><b>ABNT</b>: representa o Brasil na ISO e publica as versões brasileiras (ABNT NBR ISO 9001, por exemplo) por meio de comitês como o CB-25 (qualidade) e o CB-38 (gestão ambiental).</li></ul>
<p>Etapas de uma norma: proposta → rascunho de trabalho (WD) → rascunho de comitê (CD) → rascunho de norma internacional (DIS) → rascunho final (FDIS) → publicação. Revisões sistemáticas acontecem a cada cinco anos.</p>
<h4>Como ler uma norma</h4>
<table><tr><th>Verbo</th><th>Significado</th></tr>
<tr><td>Deve (shall)</td><td>Requisito obrigatório</td></tr>
<tr><td>Convém (should)</td><td>Recomendação</td></tr>
<tr><td>Pode (may)</td><td>Permissão</td></tr>
<tr><td>Pode (can)</td><td>Possibilidade ou capacidade</td></tr></table>
<p><b>Notas</b> explicam e orientam, mas não são requisitos. <b>Anexos</b> podem ser normativos ou informativos. Normas de diretrizes (ISO 9004, ISO 19011, ISO 31000, ISO 14004) usam "convém" e não são certificáveis.</p>
<h4>A Estrutura Harmonizada (HS)</h4>
<p>Definida no Anexo SL das Diretivas ISO/IEC, garante que todas as normas de sistema de gestão tenham:</p>
<ul><li>Mesma sequência de cláusulas (1 a 10);</li>
<li>Textos idênticos para requisitos comuns;</li>
<li>Termos e definições comuns (organização, parte interessada, requisito, risco, competência, informação documentada, processo, desempenho, terceirizar, monitoramento, medição, auditoria, conformidade, não conformidade, ação corretiva, melhoria contínua, entre outros).</li></ul>
<p>Cada disciplina acrescenta textos específicos. Saber o que é comum e o que é específico é a chave para integrar.</p>
<h4>Normas de apoio da família</h4>
<table><tr><th>Norma</th><th>Para quê</th></tr>
<tr><td>ISO 9000</td><td>Fundamentos e vocabulário da qualidade; 7 princípios</td></tr>

L("Certificação, acreditação e escolha do organismo",`<h4>Conformidade × certificação</h4>
<p>Uma organização pode atender às normas sem ser certificada (autodeclaração ou auditoria de clientes). A <b>certificação</b> é a confirmação, por organismo independente, de que o sistema atende à norma. É voluntária, mas muitas vezes exigida por clientes, licitações ou cadeias globais.</p>
<h4>A cadeia de confiança</h4>
<table><tr><th>Nível</th><th>Quem</th><th>Norma de referência</th></tr>
<tr><td>Acordos internacionais</td><td>IAF (International Accreditation Forum)</td><td>Acordos de reconhecimento mútuo</td></tr>
<tr><td>Acreditação</td><td>Cgcre/Inmetro no Brasil</td><td>ISO/IEC 17011</td></tr>
<tr><td>Certificação</td><td>Organismos certificadores (OC)</td><td>ISO/IEC 17021-1 e partes específicas</td></tr>
<tr><td>Organização certificada</td><td>A empresa</td><td>ISO 9001, 14001, 45001</td></tr></table>
<p>Certificado com marca de acreditação de membro do IAF é reconhecido internacionalmente. Desconfie de "certificados" emitidos sem auditoria, em poucos dias, ou por organismos sem acreditação verificável: consulte o banco de dados IAF CertSearch.</p>
<h4>O ciclo de certificação</h4>
<ol><li>Pedido e proposta (duração calculada pelo número de pessoas, complexidade e riscos).</li>
<li>Auditoria de estágio 1: documentação e prontidão.</li>
<li>Auditoria de estágio 2: implementação e eficácia.</li>
<li>Tratamento das não conformidades.</li>
<li>Decisão de certificação pelo OC.</li>
<li>Manutenções ao menos anuais.</li>
<li>Recertificação a cada 3 anos.</li></ol>
<h4>Escolhendo um organismo certificador</h4>
<ul><li>Acreditação válida para o escopo e o setor (código IAF do seu ramo).</li>
<li>Reputação junto aos seus clientes.</li>
<li>Auditores com experiência no setor.</li>
<li>Capacidade de fazer auditoria combinada das três normas.</li>
<li>Custo total do ciclo de 3 anos (não só da certificação inicial), incluindo deslocamentos.</li>
<li>Prazos e flexibilidade de agenda.</li></ul>
<h4>Preparando a organização</h4>
<ol><li>Pelo menos um ciclo completo de auditoria interna em todos os processos e requisitos.</li>
<li>Uma análise crítica pela direção realizada.</li>
<li>Registros suficientes para demonstrar implementação (normalmente alguns meses de operação do sistema).</li>
<li>Ações corretivas abertas em andamento.</li>
<li>Pessoas preparadas para explicar o que fazem (não decorar a norma).</li></ol>
<h4>Custos e retorno</h4>
<p>Custos: consultoria (opcional), treinamento, horas internas, adequações (infraestrutura, legal), auditorias de certificação. Retorno: acesso a clientes, redução de desperdícios e acidentes, menos multas, melhor imagem. O retorno depende de usar o sistema para gerir, e não só para "ter o certificado".</p>`,

MOD("sgi","ISO 9001 em profundidade","Implementar e gerir cada requisito da ISO 9001 a partir dos princípios da qualidade, com exemplos de diferentes setores.",[
L("Os 7 princípios e o vocabulário da qualidade (ISO 9000)",`<h4>Os 7 princípios da gestão da qualidade</h4>
<table><tr><th>Princípio</th><th>Ideia</th><th>Na prática</th></tr>
<tr><td>Foco no cliente</td><td>Atender e superar necessidades atuais e futuras</td><td>Ouvir clientes, medir percepção, agir sobre reclamações</td></tr>
<tr><td>Liderança</td><td>Líderes criam propósito, direção e condições</td><td>Metas claras, recursos, exemplo</td></tr>
<tr><td>Engajamento das pessoas</td><td>Pessoas competentes, empoderadas e engajadas</td><td>Reconhecimento, autonomia, participação</td></tr>
<tr><td>Abordagem de processo</td><td>Resultados consistentes vêm de processos inter-relacionados</td><td>Mapa de processos, donos de processo</td></tr>
<tr><td>Melhoria</td><td>Foco contínuo em melhorar</td><td>PDCA, kaizen, projetos</td></tr>
<tr><td>Decisão baseada em evidência</td><td>Análise de dados aumenta a chance de acerto</td><td>Indicadores confiáveis, análise antes de decidir</td></tr>
<tr><td>Gestão de relacionamento</td><td>Partes interessadas influenciam o desempenho</td><td>Parceria com fornecedores, comunidade</td></tr></table>
<h4>Termos essenciais da ISO 9000</h4>
<ul><li><b>Qualidade</b>: grau em que um conjunto de características inerentes de um objeto satisfaz requisitos.</li>
<li><b>Requisito</b>: necessidade ou expectativa declarada, geralmente implícita ou obrigatória.</li>
<li><b>Conformidade / não conformidade</b>: atendimento / não atendimento de um requisito.</li>
<li><b>Defeito</b>: não conformidade relacionada a um uso pretendido ou especificado (termo com implicação legal; use com cuidado).</li>
<li><b>Correção</b> × <b>ação corretiva</b>: correção elimina a não conformidade detectada (retrabalhar a peça); ação corretiva elimina a causa para evitar repetição.</li>
<li><b>Eficácia</b>: extensão em que atividades planejadas são realizadas e resultados alcançados. <b>Eficiência</b>: relação entre resultado e recursos.</li>
<li><b>Saída</b>: resultado de um processo; produtos e serviços são saídas.</li>
<li><b>Informação documentada</b>: informação que precisa ser controlada e mantida, com o meio que a contém.</li></ul>
<h4>Requisitos declarados, implícitos e obrigatórios</h4>
<p>Num hotel: declarado = "quarto com vista para o mar" (na reserva); implícito = lençóis limpos (ninguém escreve, mas todos esperam); obrigatório = alvará sanitário e do Corpo de Bombeiros.</p>
<h4>Custo da qualidade</h4>
<table><tr><th>Categoria</th><th>Exemplos</th></tr>
<tr><td>Prevenção</td><td>Treinamento, planejamento, manutenção preventiva, projeto robusto</td></tr>
<tr><td>Avaliação</td><td>Inspeções, testes, auditorias, calibração</td></tr>
<tr><td>Falhas internas</td><td>Retrabalho, refugo, paradas</td></tr>
<tr><td>Falhas externas</td><td>Reclamações, garantias, devoluções, multas, perda de clientes</td></tr></table>
<p>Investir em prevenção reduz as falhas, que costumam ser muito mais caras, especialmente as externas.</p>`,
["7 princípios: cliente, liderança, pessoas, processo, melhoria, evidência, relacionamento","Correção elimina a NC; ação corretiva elimina a causa","Eficácia (resultado) × eficiência (recursos)","Requisitos declarados, implícitos e obrigatórios","Prevenção é mais barata que falhas externas"],
`Numa escola de idiomas, uma turma reclama que o material chegou atrasado. Correção: entregar o material e repor a aula. Ação corretiva: descobrir que o pedido à editora era feito só uma semana antes do início das turmas e mudar o prazo para 30 dias, com estoque mínimo.`,
`Para uma organização à sua escolha, escreva um exemplo concreto de cada princípio sendo bem aplicado e um sendo violado. Estime os custos da qualidade em cada uma das quatro categorias.`,

L("Implementando contexto, liderança e processos",`<h4>Passo 1: entender o contexto (4.1)</h4>
<p>Ferramentas úteis:</p>
<ul><li><b>SWOT</b>: forças, fraquezas (internas), oportunidades e ameaças (externas).</li>
<li><b>PESTEL</b>: fatores políticos, econômicos, sociais, tecnológicos, ambientais e legais.</li>
<li>Análise de concorrentes, tendências do setor, mudança climática.</li></ul>
<p>Registre de forma simples e revise ao menos na análise crítica.</p>
<h4>Passo 2: partes interessadas (4.2)</h4>
<table><tr><th>Parte interessada</th><th>Necessidades e expectativas</th><th>Vira requisito do SGQ?</th></tr>
<tr><td>Clientes</td><td>Prazo, preço, qualidade, atendimento</td><td>Sim</td></tr>
<tr><td>Colaboradores</td><td>Condições de trabalho, treinamento</td><td>Em parte</td></tr>
<tr><td>Órgãos reguladores</td><td>Cumprimento de normas sanitárias</td><td>Sim (obrigatório)</td></tr>
<tr><td>Fornecedores</td><td>Pagamento em dia, previsibilidade</td><td>Decisão da organização</td></tr>
<tr><td>Comunidade</td><td>Empregos, ausência de incômodos</td><td>Decisão da organização</td></tr></table>
<h4>Passo 3: escopo (4.3)</h4>
<p>Defina produtos, serviços, unidades e atividades. Exemplo: "Projeto e fabricação de móveis planejados para residências, na unidade de Lages/SC". Requisitos não aplicáveis precisam de justificativa e não podem afetar a conformidade de produtos e serviços.</p>
<h4>Passo 4: mapear processos (4.4)</h4>
<p>Classifique em <b>processos principais</b> (geram valor ao cliente), <b>de apoio</b> (RH, manutenção, compras, TI) e <b>de gestão</b> (planejamento, análise crítica, auditoria). Para cada processo defina: dono, entradas, saídas, clientes, recursos, riscos, indicadores e documentos.</p>
<h4>SIPOC: ferramenta simples</h4>
<table><tr><th>S – Fornecedores</th><th>I – Entradas</th><th>P – Processo</th><th>O – Saídas</th><th>C – Clientes</th></tr>
<tr><td>Distribuidores de alimentos</td><td>Ingredientes, pedidos</td><td>Preparar refeições</td><td>Refeições prontas</td><td>Clientes do restaurante, delivery</td></tr></table>
<h4>Passo 5: liderança (5)</h4>
<ul><li>Defina a política com a alta direção (não copie modelos prontos).</li>
<li>Atribua responsabilidades: donos de processo, representante ou coordenador do sistema, comitê.</li>
<li>Integre o SGQ às reuniões de gestão já existentes, em vez de criar reuniões paralelas.</li></ul>
<h4>Escrevendo uma boa política</h4>
<p>Curta, ligada ao propósito e com os compromissos exigidos: atender requisitos aplicáveis e melhorar continuamente. Exemplo: <i>"Oferecer refeições saborosas e seguras, com atendimento acolhedor, cumprindo os requisitos dos clientes e da legislação sanitária e melhorando continuamente nossos processos e nossa equipe."</i></p>`,
["Contexto com SWOT e PESTEL","Partes interessadas: decidir quais necessidades viram requisitos","Escopo claro; exclusões só se não afetarem a conformidade","Processos principais, de apoio e de gestão, com dono e indicadores","SIPOC e política curta com compromissos exigidos"],
`Uma empresa de software mapeia: processos principais (vendas, desenvolvimento, implantação, suporte), apoio (RH, infraestrutura de TI, compras de licenças), gestão (planejamento estratégico, gestão de riscos, auditoria). O processo de suporte tem como indicador o tempo médio de resolução de chamados.`,
`Para uma organização de sua escolha, faça: SWOT, matriz de partes interessadas, declaração de escopo, mapa de processos e SIPOC de dois processos principais. Escreva a política da qualidade.`,
[["SWOT analisa:",["Apenas fatores externos","Forças, fraquezas, oportunidades e ameaças","Só concorrentes","Apenas finanças"],1,"Fatores internos e externos."],["Um processo de apoio típico é:",["Prestação do serviço ao cliente","Manutenção","Venda","Entrega"],1,"Apoia os processos principais."],["No SIPOC, o 'C' representa:",["Custos","Clientes","Controles","Cronograma"],1,"Customers: clientes."]]),
L("Implementando riscos, objetivos, recursos e documentação",`<h4>Riscos e oportunidades (6.1) passo a passo</h4>
<ol><li>Para cada processo, liste o que pode dar errado (riscos) e o que pode dar mais certo (oportunidades), usando contexto e partes interessadas.</li>
<li>Avalie (ex.: probabilidade × impacto de 1 a 5).</li>
<li>Defina ações proporcionais para os mais relevantes: evitar, eliminar a fonte, mudar a probabilidade ou consequência, compartilhar, aceitar com decisão informada; para oportunidades, aproveitar.</li>
<li>Integre as ações ao processo (procedimento, controle, indicador).</li>
<li>Avalie a eficácia periodicamente.</li></ol>
<h4>Objetivos da qualidade (6.2)</h4>
<p>Use o modelo SMART (específico, mensurável, atingível, relevante, temporal). Exemplo: "Reduzir reclamações de entrega de 4% para 2% dos pedidos até dezembro". Plano: ações, recursos, responsável, prazo e como avaliar.</p>
<h4>Planejamento de mudanças (6.3)</h4>
<p>Mudar sistema, estrutura ou processos com propósito, consequências, recursos e responsabilidades avaliados antes. Ex.: implantar um novo software de gestão.</p>
<h4>Recursos (7.1)</h4>
<ul><li><b>Infraestrutura</b>: plano de manutenção de equipamentos, edifícios, TI e transporte.</li>
<li><b>Ambiente para operação</b>: fatores físicos (temperatura, iluminação, ruído), sociais (não discriminação) e psicológicos (prevenção de estresse e esgotamento).</li>
<li><b>Monitoramento e medição</b>: lista de instrumentos, calibração ou verificação, critério de aceitação, identificação.</li>
<li><b>Conhecimento organizacional</b>: lições aprendidas, manuais técnicos, mentorias, bases de conhecimento.</li></ul>
<h4>Competência e conscientização (7.2, 7.3)</h4>
<p>Matriz de competências por função (requisitos × situação de cada pessoa), plano de treinamento, avaliação de eficácia (prova, observação, indicador), integração de novos colaboradores com política e riscos do posto.</p>
<h4>Informação documentada (7.5)</h4>
<table><tr><th>Exigida pela ISO 9001 (exemplos)</th><th>Tipo</th></tr>
<tr><td>Escopo, política, objetivos</td><td>Manter</td></tr>
<tr><td>Evidência de competência</td><td>Reter</td></tr>
<tr><td>Resultados de calibração / verificação</td><td>Reter</td></tr>
<tr><td>Análise crítica de requisitos, avaliação de fornecedores</td><td>Reter</td></tr>
<tr><td>Liberação de produtos, saídas não conformes, mudanças</td><td>Reter</td></tr>
<tr><td>Resultados de auditoria interna, análise crítica, ações corretivas</td><td>Reter</td></tr></table>
<p>Além disso, documente o que for necessário para a eficácia. Regra prática: documente quando a falta do documento gera risco (atividade complexa, pouco frequente, rotatividade alta, exigência legal).</p>
<h4>Boas práticas documentais</h4>
<ul><li>Procedimentos curtos, com fluxogramas e fotos.</li>
<li>Instruções no posto de trabalho, em linguagem simples.</li>
<li>Sistema eletrônico com controle de versão, aprovação e acesso.</li>
<li>Tabela de retenção de registros: onde, quanto tempo, quem acessa, como descartar.</li></ul>`,
["Riscos por processo, avaliados e com ações proporcionais","Objetivos SMART com plano completo","Ambiente de operação inclui fatores sociais e psicológicos","Matriz de competências + avaliação de eficácia","Documente quando a ausência gera risco"],
`Num salão de beleza, risco: reação alérgica a coloração. Ação: teste de mecha e ficha de anamnese obrigatórios antes do serviço (procedimento + registro). Oportunidade: clientes pedem agendamento on-line; ação: implantar aplicativo de agendamento com lembrete automático.`,

L("Implementando a operação: do cliente à entrega",`<h4>8.1 Planejar a operação</h4>
<p>Para cada produto ou serviço: requisitos, critérios de processo e de aceitação, recursos, controles, registros e como lidar com mudanças e terceirizados. Pode ser um plano de controle, um roteiro de serviço ou um plano de projeto.</p>
<h4>8.2 Requisitos de produtos e serviços</h4>
<ul><li>Comunicação com o cliente: informações, pedidos, contratos, retroalimentação, reclamações, propriedade do cliente, contingências.</li>
<li>Determinar requisitos: especificados pelo cliente, legais, implícitos e os que a organização julga necessários.</li>
<li><b>Analisar criticamente antes de aceitar</b>: a organização consegue entregar o que prometeu? (capacidade, prazo, recursos, requisitos legais).</li>
<li>Controlar alterações de pedido.</li></ul>
<h4>8.3 Projeto e desenvolvimento</h4>
<table><tr><th>Etapa</th><th>Exemplo numa escola que cria um curso novo</th></tr>
<tr><td>Planejamento</td><td>Cronograma, equipe, etapas</td></tr>
<tr><td>Entradas</td><td>Necessidades dos alunos, requisitos do MEC, cursos anteriores</td></tr>
<tr><td>Controles: análise crítica</td><td>Reunião de coordenação avaliando o plano</td></tr>
<tr><td>Verificação</td><td>Conteúdo confere com as entradas?</td></tr>
<tr><td>Validação</td><td>Turma piloto confirma que o curso atende ao uso pretendido</td></tr>
<tr><td>Saídas</td><td>Plano de ensino, materiais, critérios de avaliação</td></tr>
<tr><td>Alterações</td><td>Registro de mudanças após o piloto</td></tr></table>
<h4>8.4 Fornecedores e terceirizados</h4>
<p>Defina critérios (qualidade, prazo, preço, capacidade, certificações, requisitos legais), avalie antes de contratar, monitore o desempenho e reavalie. O controle é proporcional ao impacto: um fornecedor de material de escritório não precisa do mesmo rigor que o laboratório que analisa seu produto. Comunique requisitos claros: especificações, aprovações, competência, verificações.</p>
<h4>8.5 Produção e prestação do serviço</h4>
<ul><li>Instruções e padrões disponíveis; recursos de medição; pessoas competentes; infraestrutura.</li>
<li>Validação de processos especiais.</li>
<li><b>Prevenção de erro humano</b>: dispositivos à prova de erro (poka-yoke), checklists, dupla checagem em atividades críticas.</li>
<li>Identificação e rastreabilidade (lotes, ordens de serviço, prontuários).</li>
<li>Propriedade do cliente (incluindo dados pessoais), preservação e atividades pós-entrega.</li></ul>
<h4>8.6 e 8.7 Liberação e saídas não conformes</h4>
<p>Libere só após verificações planejadas, com registro de quem liberou. Para saídas não conformes: identificar, segregar, corrigir, devolver, suspender, informar o cliente ou obter concessão, sempre com registro.</p>
<h4>Serviços: blueprint</h4>
<p>Para serviços, desenhe a jornada do cliente com pontos de contato, ações de linha de frente, bastidores e sistemas de apoio. Cada ponto de contato tem um padrão e um risco de falha.</p>`,

`Desenhe a operação completa (8.1 a 8.7) de um serviço que você conhece, incluindo um blueprint de serviço com 8 pontos de contato e os controles de cada um. Defina critérios de avaliação para 3 fornecedores críticos.`,
[["Turma piloto para confirmar que um curso atende ao uso pretendido é:",["Verificação","Validação","Análise crítica de pedido","Liberação"],1,"Validação confirma o uso pretendido."],["Poka-yoke é:",["Um tipo de auditoria","Um dispositivo à prova de erro","Um indicador financeiro","Um fornecedor japonês"],1,"Evita que o erro aconteça ou passe adiante."],["O controle de fornecedores deve ser:",["Igual para todos","Proporcional ao impacto no produto ou serviço","Inexistente para serviços","Apenas por preço"],1,"8.4 fala em tipo e extensão do controle."]]),
L("Implementando desempenho e melhoria",`<h4>Sistema de indicadores (9.1)</h4>
<ul><li>Indicadores por processo, ligados aos objetivos.</li>
<li>Ficha do indicador: nome, fórmula, fonte dos dados, frequência, meta, responsável, como analisar.</li>
<li>Painel visual (gestão à vista) e reunião de análise periódica.</li></ul>
<h4>Satisfação do cliente (9.1.2)</h4>
<table><tr><th>Método</th><th>Vantagem</th></tr>
<tr><td>Pesquisa de satisfação (CSAT)</td><td>Mede uma interação específica</td></tr>
<tr><td>NPS (Net Promoter Score)</td><td>Simples: probabilidade de recomendar de 0 a 10; % promotores (9-10) − % detratores (0-6)</td></tr>
<tr><td>Reclamações e elogios</td><td>Espontâneos, ricos em detalhes</td></tr>
<tr><td>Avaliações on-line e redes sociais</td><td>Percepção pública</td></tr>
<tr><td>Dados de recompra, cancelamento, devolução</td><td>Comportamento real</td></tr></table>
<h4>Auditoria interna (9.2)</h4>
<p>Forme auditores internos de várias áreas (curso de 16 a 24 horas baseado na ISO 19011), garanta que não auditem a própria área, faça programa baseado em risco e acompanhe as ações. Auditoria interna boa é aquela que ajuda a direção a enxergar riscos, não a que "não encontra nada".</p>
<h4>Análise crítica pela direção (9.3)</h4>
<p>Pauta-padrão com todas as entradas obrigatórias, dados preparados com antecedência, decisões registradas com responsável e prazo. Frequência comum: semestral ou anual, mas pode ser integrada às reuniões mensais de resultado.</p>
<h4>Não conformidade e ação corretiva (10.2)</h4>
<ol><li>Registrar e reagir: conter e corrigir.</li>
<li>Avaliar a necessidade de ação corretiva (gravidade, recorrência).</li>
<li>Analisar a causa raiz (5 porquês, Ishikawa).</li>
<li>Verificar se há NCs semelhantes em outros lugares.</li>
<li>Definir e implementar ações.</li>
<li>Verificar eficácia após tempo suficiente.</li>
<li>Atualizar riscos e o sistema se preciso.</li></ol>
<h4>Melhoria contínua (10.3)</h4>
<p>Fontes de melhoria: análise de dados, auditorias, sugestões de colaboradores, benchmarking, inovação, reclamações. Ferramentas: PDCA, kaizen, projetos Lean Six Sigma, programas de ideias. O objetivo é tornar o sistema mais adequado, suficiente e eficaz.</p>
<h4>Maturidade (ISO 9004)</h4>
<p>A ISO 9004 propõe autoavaliação em níveis de maturidade (de 1 a 5) em temas como liderança, processos, recursos e melhoria. É útil depois da certificação para sair do "cumprir requisito" e buscar excelência e sucesso sustentado.</p>`,
["Ficha de indicador: fórmula, fonte, meta, responsável","NPS = % promotores − % detratores","Auditor interno de outra área, programa por risco","Análise crítica com todas as entradas e decisões registradas","ISO 9004 para avançar em maturidade"],
`Uma academia mede NPS mensal: 60% promotores e 15% detratores → NPS 45. Reclamações concentram-se em equipamentos quebrados. Ação corretiva: manutenção preventiva semanal e canal de aviso pelo app. Três meses depois, NPS 58 e reclamações de equipamento caem 70%.`,
`Crie 6 fichas de indicadores completas para uma organização fictícia, uma pesquisa NPS com 5 perguntas complementares, um programa de auditoria interna anual e uma pauta de análise crítica com todas as entradas da 9.3.`,
[["Com 50% promotores e 20% detratores, o NPS é:",["70","30","50","20"],1,"NPS = 50 − 20 = 30."],["Antes de definir ação corretiva, deve-se:",["Punir o responsável","Analisar a causa raiz","Fechar a NC","Ignorar a correção"],1,"Ação sem causa não resolve."],["A ISO 9004 trata de:",["Requisitos para certificação","Sucesso sustentado e maturidade da gestão","Auditoria","Meio ambiente"],1,"Orientação para ir além da 9001."]])
]);

MOD("sgi","ISO 14001 em profundidade","Implementar o sistema de gestão ambiental: contexto ambiental, levantamento de aspectos, legislação, controles, emergências e desempenho.",[
L("Conceitos ambientais e o contexto do SGA",`<h4>Por que a gestão ambiental importa</h4>
<p>Organizações consomem recursos (água, energia, matérias-primas) e geram resíduos, efluentes e emissões. A gestão ambiental reduz impactos, custos e riscos legais, e responde a pressões de clientes, investidores e comunidade.</p>
<h4>Conceitos fundamentais</h4>
<table><tr><th>Conceito</th><th>Explicação</th></tr>
<tr><td>Aspecto ambiental</td><td>A "causa": elemento da atividade que interage com o meio ambiente</td></tr>
<tr><td>Impacto ambiental</td><td>O "efeito": mudança no meio ambiente, adversa ou benéfica</td></tr>
<tr><td>Condição ambiental</td><td>Estado do meio ambiente em um momento (qualidade do ar, disponibilidade de água)</td></tr>
<tr><td>Desempenho ambiental</td><td>Resultado mensurável relacionado à gestão dos aspectos</td></tr>
<tr><td>Prevenção da poluição</td><td>Evitar, reduzir ou controlar poluentes na fonte</td></tr>
<tr><td>Ciclo de vida</td><td>Da extração da matéria-prima ao destino final</td></tr>
<tr><td>Economia circular</td><td>Manter materiais em uso pelo maior tempo possível: reduzir, reutilizar, reciclar, remanufaturar</td></tr></table>
<h4>Contexto ambiental (4.1 e 4.2)</h4>
<ul><li><b>Condições ambientais</b> que afetam a organização: secas, enchentes, ondas de calor, escassez de recursos.</li>
<li><b>Condições que a organização afeta</b>: rio receptor de efluente, área de preservação vizinha, qualidade do ar local.</li>
<li><b>Mudança climática</b>: riscos físicos (eventos extremos) e de transição (novas leis, exigências de clientes por redução de carbono).</li>
<li><b>Partes interessadas</b>: órgão ambiental, comunidade, clientes, investidores, ONGs, seguradoras.</li></ul>
<h4>Política ambiental</h4>
<p>Compromissos obrigatórios: proteção do meio ambiente, incluindo prevenção da poluição e outros compromissos pertinentes ao contexto; atendimento às obrigações de compliance; melhoria contínua do SGA para aumentar o desempenho ambiental. Exemplo para uma rede de lavanderias: <i>"Prestar serviços de lavanderia com uso responsável de água, energia e produtos químicos, prevenindo a poluição, cumprindo a legislação e as demais obrigações assumidas e melhorando continuamente nosso desempenho ambiental."</i></p>
<h4>Papéis ambientais</h4>
<p>Defina quem responde por licenças, resíduos, monitoramentos, emergências e relacionamento com órgãos ambientais. Em organizações pequenas, a mesma pessoa pode acumular funções de qualidade, ambiente e segurança: mais um motivo para integrar.</p>`,
["Aspecto = causa; impacto = efeito","Contexto ambiental: condições que afetam e que são afetadas","Mudança climática: riscos físicos e de transição","Política: proteção ambiental, compliance e melhoria","Defina responsáveis por licenças, resíduos e emergências"],
`Uma vinícola identifica como condição ambiental que a afeta a irregularidade de chuvas na serra (risco à safra) e como condição que ela afeta o rio que recebe efluente da lavagem de tanques. Partes interessadas: órgão ambiental estadual, vizinhos, importadores que exigem pegada de carbono.`,
`Para uma organização de sua escolha, descreva as condições ambientais que a afetam e que ela afeta, os riscos climáticos físicos e de transição e as 8 partes interessadas ambientais com suas expectativas. Escreva a política ambiental.`,
[["Qual é um risco climático de transição?",["Enchente","Onda de calor","Nova lei que taxa emissões","Seca"],2,"Riscos de transição vêm de mudanças regulatórias e de mercado."],["Economia circular busca:",["Descartar mais rápido","Manter materiais em uso pelo maior tempo possível","Aumentar consumo","Eliminar a reciclagem"],1,"Reduzir, reutilizar, reciclar, remanufaturar."],["Um compromisso obrigatório da política ambiental é:",["Lucro","Atendimento às obrigações de compliance","Marketing verde","Zero resíduo"],1,"Compliance, proteção ambiental e melhoria."]]),
L("Levantamento de aspectos e impactos (LAIA) passo a passo",`<h4>Passo 1: dividir em atividades</h4>
<p>Use o mapa de processos e desça ao nível de atividade: recebimento, armazenamento, produção, manutenção, limpeza, refeitório, escritório, transporte, obras.</p>
<h4>Passo 2: identificar aspectos por categoria</h4>
<table><tr><th>Categoria</th><th>Exemplos</th></tr>
<tr><td>Consumo de recursos</td><td>Água, energia, combustível, papel, matérias-primas</td></tr>
<tr><td>Emissões atmosféricas</td><td>Gases de combustão, poeira, odor, gases de refrigeração</td></tr>
<tr><td>Efluentes</td><td>Sanitário, industrial, água de lavagem, pluvial contaminada</td></tr>
<tr><td>Resíduos</td><td>Perigosos (Classe I), não perigosos (Classe II), recicláveis, orgânicos</td></tr>
<tr><td>Ruído e vibração</td><td>Máquinas, geradores, veículos</td></tr>
<tr><td>Uso do solo</td><td>Impermeabilização, supressão de vegetação</td></tr>
<tr><td>Vazamentos e derramamentos</td><td>Combustíveis, óleos, químicos (emergência)</td></tr>
<tr><td>Aspectos indiretos</td><td>Fornecedores, uso e descarte do produto pelo cliente</td></tr></table>
<p>Para cada um, considere condição <b>normal</b>, <b>anormal</b> e de <b>emergência</b>, e situações passadas, presentes e futuras planejadas.</p>
<h4>Passo 3: definir critérios de significância</h4>
<p>Exemplo de método:</p>
<table><tr><th>Critério</th><th>1</th><th>2</th><th>3</th></tr>
<tr><td>Severidade</td><td>Impacto local e reversível</td><td>Impacto moderado</td><td>Impacto grave ou irreversível</td></tr>
<tr><td>Frequência / probabilidade</td><td>Rara</td><td>Mensal</td><td>Diária</td></tr>
<tr><td>Abrangência</td><td>Restrita ao posto</td><td>Dentro do terreno</td><td>Além dos limites</td></tr></table>
<p>Significância = S × F × A; acima de um corte (ex.: 12) é significativo. <b>Filtros automáticos</b>: aspecto com requisito legal, reclamação de parte interessada ou emergência grave é significativo independentemente da pontuação.</p>
<h4>Passo 4: definir controles e usar o resultado</h4>
<p>Aspectos significativos alimentam: objetivos ambientais (6.2), controles operacionais (8.1), competência e conscientização (7.2, 7.3), comunicação (7.4), monitoramento (9.1) e preparação para emergências (8.2).</p>
<h4>Passo 5: manter vivo</h4>
<p>Revise quando houver mudanças (novo produto, equipamento, área, lei), após incidentes e ao menos anualmente. Envolva quem executa as atividades: eles conhecem os aspectos melhor que ninguém.</p>
<h4>Classificação de resíduos no Brasil</h4>
<p>A ABNT NBR 10004 classifica resíduos em Classe I (perigosos) e Classe II (não perigosos, subdivididos em IIA não inertes e IIB inertes); a norma foi revisada recentemente, então confira a edição vigente. Resíduos de serviços de saúde têm regras próprias (ANVISA RDC 222/2018) e resíduos da construção civil seguem a Resolução CONAMA 307/2002.</p>`,
["Desça ao nível de atividade","Categorias: recursos, emissões, efluentes, resíduos, ruído, solo, emergências, indiretos","Condição normal, anormal e de emergência","Critérios definidos + filtros automáticos (legal, reclamação)","Aspectos significativos alimentam objetivos, controles e emergências"],
`Num hotel: lavanderia (consumo de água: S2 F3 A1 = 6; efluente com detergente: requisito legal → significativo), cozinha (óleo de fritura usado: S2 F3 A2 = 12 → significativo), piscina (armazenamento de cloro: emergência com vazamento → significativo).`,
`Faça o LAIA completo de uma organização fictícia com 6 atividades e ao menos 30 aspectos, aplicando os critérios desta aula e os filtros. Liste os significativos e os controles para cada um.`,
[["Um aspecto com requisito legal aplicável deve ser considerado:",["Sempre irrelevante","Significativo por filtro","Só se a nota for alta","Opcional"],1,"Filtro automático de significância."],["Resíduos perigosos na ABNT NBR 10004 são:",["Classe I","Classe IIA","Classe IIB","Classe III"],0,"Classe I = perigosos."],["O uso do produto pelo cliente é um aspecto:",["Direto controlado","Indireto que a organização pode influenciar","Irrelevante","De emergência"],1,"Aspecto que pode ser influenciado."]]),
L("Legislação ambiental brasileira para o SGI",`<h4>Estrutura do direito ambiental</h4>
<ul><li><b>Constituição Federal, art. 225</b>: todos têm direito ao meio ambiente ecologicamente equilibrado; poder público e coletividade devem defendê-lo.</li>
<li>Competência comum de União, estados e municípios (LC 140/2011 organiza quem licencia o quê).</li>
<li>Responsabilidade ambiental em três esferas: <b>civil</b> (reparar o dano, independentemente de culpa), <b>administrativa</b> (multas, embargos) e <b>penal</b> (Lei 9.605/1998, alcançando pessoas físicas e jurídicas).</li></ul>
<h4>Instrumentos principais</h4>
<table><tr><th>Instrumento</th><th>O que é</th><th>Referência</th></tr>
<tr><td>Licenciamento ambiental</td><td>Licença Prévia (LP), de Instalação (LI) e de Operação (LO), com condicionantes</td><td>Lei 6.938/1981, CONAMA 237/1997, normas estaduais</td></tr>
<tr><td>EIA/RIMA</td><td>Estudo de impacto para atividades de significativo impacto</td><td>CONAMA 001/1986</td></tr>
<tr><td>Cadastro Técnico Federal</td><td>Registro de atividades potencialmente poluidoras, com relatório anual (RAPP) e taxa (TCFA)</td><td>IBAMA</td></tr>
<tr><td>Outorga de uso da água</td><td>Autorização para captar ou lançar</td><td>Lei 9.433/1997</td></tr>
<tr><td>Padrões de efluentes</td><td>Limites para lançamento</td><td>CONAMA 430/2011 e normas estaduais</td></tr>
<tr><td>Qualidade do ar</td><td>Padrões e controle de emissões</td><td>CONAMA 491/2018, PRONAR</td></tr>
<tr><td>Política Nacional de Resíduos Sólidos</td><td>Hierarquia (não geração, redução, reutilização, reciclagem, tratamento, disposição), PGRS, logística reversa, responsabilidade compartilhada</td><td>Lei 12.305/2010, Decreto 10.936/2022</td></tr>
<tr><td>Áreas protegidas e vegetação</td><td>APP, reserva legal, supressão</td><td>Código Florestal, Lei 12.651/2012</td></tr>
<tr><td>Áreas contaminadas</td><td>Gerenciamento e remediação</td><td>CONAMA 420/2009</td></tr></table>
<h4>Gestão de requisitos legais no SGI</h4>
<ol><li><b>Identificar</b>: a partir do LAIA e do levantamento de perigos, liste as leis aplicáveis em todas as esferas.</li>
<li><b>Acessar e atualizar</b>: assine um serviço de atualização legal ou acompanhe diários oficiais e sites dos órgãos.</li>
<li><b>Interpretar</b>: o que exatamente a organização precisa fazer?</li>
<li><b>Implementar</b>: atribuir responsável, prazo e controle.</li>
<li><b>Avaliar o atendimento</b> periodicamente (9.1.2), com evidência.</li>
<li><b>Comunicar</b> a quem precisa saber.</li></ol>
<h4>Matriz de requisitos legais (exemplo de colunas)</h4>
<p>Requisito | Esfera | Aspecto/perigo relacionado | Exigência prática | Responsável | Evidência de atendimento | Periodicidade | Situação | Ação.</p>
<h4>Integração com SSO</h4>
<p>A mesma matriz pode incluir as NRs, o eSocial de SST, alvarás e AVCB, transformando-se numa matriz legal única do SGI.</p>`,
["Responsabilidade ambiental civil, administrativa e penal","Licenciamento: LP, LI, LO e condicionantes","PNRS: hierarquia de resíduos, PGRS e logística reversa","Ciclo legal: identificar, atualizar, interpretar, implementar, avaliar","Matriz legal única para ambiente e SSO no SGI"],
`Uma oficina mecânica de bairro precisa, conforme o município e o estado: licença ambiental (ou dispensa formal), caixa separadora de água e óleo, destinação de óleo lubrificante usado para rerrefino (logística reversa prevista em resolução CONAMA), MTR para resíduos perigosos e alvará dos bombeiros.`,
`Monte uma matriz legal integrada com 25 requisitos (ambientais e de SSO) para uma organização fictícia, preenchendo todas as colunas. Identifique quais exigências variam por estado ou município.`,
[["A responsabilidade civil ambiental:",["Exige provar culpa","Independe de culpa","Só atinge pessoas físicas","Não existe no Brasil"],1,"Responsabilidade objetiva: basta o dano e o nexo."],["A Lei 12.305/2010 trata de:",["Recursos hídricos","Resíduos sólidos","Crimes ambientais","Licenciamento"],1,"Política Nacional de Resíduos Sólidos."],["As três licenças do licenciamento trifásico são:",["LP, LI e LO","LA, LB e LC","LE, LS e LT","LR, LP e LF"],0,"Prévia, Instalação e Operação."]]),
L("Operação ambiental, emergências, desempenho e carbono",`<h4>Controle operacional (8.1)</h4>
<p>Para cada aspecto significativo defina controle pela hierarquia: <b>eliminar</b> (deixar de usar um solvente), <b>substituir</b> (tinta à base de água), <b>engenharia</b> (filtro, bacia de contenção, ETE), <b>administrativo</b> (procedimento, treinamento, sinalização, inspeção).</p>
<h4>Gestão de resíduos na prática</h4>
<ol><li>Inventário de resíduos por tipo e volume.</li>
<li>Prioridade: não gerar, reduzir, reutilizar, reciclar, tratar, dispor.</li>
<li>Segregação na fonte com coletores identificados.</li>
<li>Armazenamento temporário adequado (coberto, impermeável, contenção para perigosos).</li>
<li>Transportadores e destinadores licenciados, com MTR e certificado de destinação final.</li>
<li>Indicadores: kg por unidade produzida, % reciclado, custo de destinação.</li></ol>
<h4>Ciclo de vida na operação</h4>
<p>Inclua critérios ambientais no projeto (ecodesign: menos material, desmontável, reciclável), nas compras (produtos com selo, fornecedores licenciados) e na informação ao cliente (como descartar, como usar com menos consumo).</p>
<h4>Emergências ambientais (8.2)</h4>
<ul><li>Cenários: vazamento de combustível ou químico, incêndio com água contaminada, rompimento de tanque, falha da ETE.</li>
<li>Recursos: kits de contenção, barreiras, válvulas de bloqueio, contatos do órgão ambiental e de empresas de atendimento.</li>
<li>Simulados periódicos integrados com a brigada de incêndio (SSO).</li>
<li>Comunicação a autoridades quando exigido.</li></ul>
<h4>Desempenho ambiental (9.1)</h4>
<table><tr><th>Indicador</th><th>Fórmula exemplo</th></tr>
<tr><td>Intensidade hídrica</td><td>M³ de água / tonelada produzida (ou por hóspede, por aluno)</td></tr>
<tr><td>Intensidade energética</td><td>KWh / unidade produzida</td></tr>
<tr><td>Taxa de reciclagem</td><td>Kg reciclado / kg total de resíduos</td></tr>
<tr><td>Conformidade de efluentes</td><td>% de laudos dentro dos padrões</td></tr>
<tr><td>Ocorrências ambientais</td><td>Número por período</td></tr></table>
<h4>Gases de efeito estufa (GEE)</h4>
<p>O inventário segue o <b>GHG Protocol</b> (no Brasil, Programa Brasileiro GHG Protocol da FGV) e a <b>ISO 14064-1</b>.</p>
<ul><li><b>Escopo 1</b>: emissões diretas (combustível de frota própria, caldeira, gases de refrigeração).</li>
<li><b>Escopo 2</b>: energia elétrica comprada.</li>
<li><b>Escopo 3</b>: cadeia de valor (fornecedores, transporte terceirizado, viagens, uso e fim de vida do produto).</li></ul>
<p>Com o inventário, a organização define metas de redução (eficiência energética, energia renovável, mudança de combustível) e só depois considera compensação.</p>`,
["Hierarquia de controles também no ambiental","Resíduos: não gerar → reduzir → reutilizar → reciclar → tratar → dispor","Ecodesign e compras sustentáveis = ciclo de vida","Indicadores de intensidade (por unidade produzida)","GEE: escopos 1, 2 e 3 (GHG Protocol, ISO 14064-1)"],
`Uma escola calcula suas emissões: escopo 1 (gás do refeitório e van própria), escopo 2 (energia elétrica) e escopo 3 (deslocamento de alunos e professores, papel comprado). Com painéis solares e incentivo à carona, reduz o escopo 2 em 60% e o escopo 3 em 15% em dois anos.`,
`Para uma organização fictícia, escreva o plano de gestão de resíduos, um plano de emergência ambiental com 3 cenários, 6 indicadores de desempenho ambiental e uma estimativa qualitativa das fontes de emissões nos escopos 1, 2 e 3.`,
[["Energia elétrica comprada entra no escopo:",["1","2","3","Nenhum"],1,"Escopo 2 = energia adquirida."],["Na hierarquia de resíduos, a primeira prioridade é:",["Reciclar","Dispor em aterro","Não gerar","Incinerar"],2,"Não geração vem primeiro."],["Um indicador de intensidade é:",["Total de água no ano","M³ de água por unidade produzida","Número de funcionários","Faturamento"],1,"Relaciona consumo à produção."]])
]);

MOD("sgi","ISO 45001 em profundidade","Implementar o sistema de saúde e segurança ocupacional: cultura, participação, gestão de riscos, legislação brasileira e resposta a incidentes.",[
L("Cultura de segurança, liderança e participação",`<h4>Por que a 45001 é diferente</h4>
<p>Na qualidade o foco é o cliente; no ambiental, o meio ambiente; na SSO, a vida e a saúde das pessoas que trabalham para a organização. Por isso a ISO 45001 dá papel central à <b>liderança</b> e à <b>participação dos trabalhadores</b>.</p>
<h4>Responsabilidades da alta direção (5.1)</h4>
<ul><li>Responsabilidade total e prestação de contas pela prevenção de lesões e problemas de saúde.</li>
<li>Garantir locais de trabalho seguros e saudáveis.</li>
<li>Desenvolver, liderar e promover uma <b>cultura</b> que apoie os resultados do sistema.</li>
<li>Proteger trabalhadores de represálias ao relatar incidentes, perigos, riscos e oportunidades.</li>
<li>Assegurar processos de consulta e participação.</li>
<li>Apoiar comitês de saúde e segurança (no Brasil, a CIPA, NR-5).</li></ul>
<h4>Política de SSO (5.2): compromissos obrigatórios</h4>
<p>Prover condições de trabalho seguras e saudáveis; atender requisitos legais e outros; <b>eliminar perigos e reduzir riscos</b> de SSO; melhoria contínua; <b>consulta e participação</b> dos trabalhadores e seus representantes.</p>
<h4>Consulta e participação (5.4)</h4>
<table><tr><th>Mecanismo</th><th>Exemplo prático</th></tr>
<tr><td>CIPA e comitês</td><td>Reuniões mensais com análise de incidentes</td></tr>
<tr><td>Diálogo diário de segurança (DDS)</td><td>5-10 min antes do turno sobre o risco do dia</td></tr>
<tr><td>Participação na avaliação de riscos</td><td>Operadores ajudam a montar o inventário do seu posto</td></tr>
<tr><td>Canal de relatos</td><td>App, caixa, QR code para perigos e quase acidentes, sem punição</td></tr>
<tr><td>Investigação participativa</td><td>Quem executa a tarefa participa da análise de causa</td></tr>
<tr><td>Direito de recusa</td><td>Parar a atividade diante de risco grave e iminente</td></tr></table>
<h4>Maturidade da cultura de segurança</h4>
<table><tr><th>Estágio</th><th>Como se pensa</th></tr>
<tr><td>Patológico</td><td>"acidente acontece; o importante é produzir"</td></tr>
<tr><td>Reativo</td><td>Segurança só depois que alguém se machuca</td></tr>
<tr><td>Calculista</td><td>Muitos procedimentos e indicadores, gestão de cima para baixo</td></tr>
<tr><td>Proativo</td><td>Liderança e trabalhadores antecipam riscos</td></tr>
<tr><td>Generativo</td><td>Segurança faz parte de como se trabalha; relatar é valorizado</td></tr></table>
<p>Modelo inspirado na "escada da cultura de segurança" de Hudson. Serve para diagnosticar e planejar a evolução.</p>
<h4>Cultura justa (just culture)</h4>
<p>Diferencia erro humano (consolar e melhorar o sistema), comportamento de risco (orientar) e comportamento imprudente (ação disciplinar). Sem cultura justa, as pessoas escondem incidentes e o sistema perde sua principal fonte de aprendizado.</p>
<h4>Saúde mental no trabalho</h4>
<p>A ISO 45003 orienta a gestão de riscos psicossociais: carga e ritmo excessivos, jornadas longas, falta de autonomia, assédio, conflitos, insegurança no emprego, isolamento. Esses fatores devem entrar na identificação de perigos, como já exige a NR-1 atualizada.</p>`,

L("Identificação de perigos, avaliação de riscos e o PGR",`<h4>Tipos de perigos</h4>
<table><tr><th>Categoria</th><th>Exemplos</th></tr>
<tr><td>Físicos</td><td>Ruído, calor, frio, vibração, radiação, pressão</td></tr>
<tr><td>Químicos</td><td>Poeiras, fumos, vapores, solventes, gases</td></tr>
<tr><td>Biológicos</td><td>Vírus, bactérias, fungos, perfurocortantes contaminados</td></tr>
<tr><td>Ergonômicos</td><td>Postura, levantamento de peso, repetitividade, mobiliário</td></tr>
<tr><td>Mecânicos / de acidentes</td><td>Máquinas, quedas, eletricidade, incêndio, veículos, ferramentas</td></tr>
<tr><td>Psicossociais</td><td>Sobrecarga, assédio, metas abusivas, trabalho isolado, violência</td></tr></table>
<h4>Métodos de identificação e avaliação</h4>
<ul><li><b>APR</b> (Análise Preliminar de Riscos): etapa da tarefa → perigo → risco → controles.</li>
<li><b>Matriz de risco</b>: probabilidade × severidade (ex.: 5×5) com classificação (baixo, moderado, alto, crítico).</li>
<li><b>Inspeções e checklists</b> por área.</li>
<li><b>Análise de incidentes</b> passados e dados de saúde (afastamentos, queixas).</li>
<li><b>AET</b> (análise ergonômica do trabalho) para riscos ergonômicos.</li>
<li><b>Avaliações quantitativas</b> de agentes físicos, químicos e biológicos (dosimetria de ruído, medição de calor, amostragem de ar).</li></ul>
<h4>O GRO e o PGR da NR-1</h4>
<p>O <b>Gerenciamento de Riscos Ocupacionais (GRO)</b> é o processo; o <b>Programa de Gerenciamento de Riscos (PGR)</b> é sua documentação, composta de:</p>
<ul><li><b>Inventário de riscos</b>: caracterização dos processos e ambientes, descrição de perigos e possíveis lesões, fontes, avaliação e classificação dos riscos, medidas existentes.</li>
<li><b>Plano de ação</b>: medidas de prevenção a introduzir, aprimorar ou manter, com cronograma e responsáveis, e forma de acompanhamento.</li></ul>
<p>A NR-1 exige considerar a hierarquia de medidas, a participação dos trabalhadores e a revisão quando houver mudanças, acidentes ou a cada 2 anos (prazos podem variar conforme certificações; verifique o texto vigente). O PGR conversa diretamente com os requisitos 6.1.2 e 8.1.2 da ISO 45001: um bom inventário de riscos atende aos dois.</p>
<h4>Avaliando oportunidades de SSO (6.1.2.3)</h4>
<p>Além de riscos, identifique oportunidades: adaptar o trabalho às pessoas, eliminar perigos em projetos novos, automatizar tarefas perigosas, programas de saúde (vacinação, ergonomia, saúde mental).</p>
<h4>Exemplo de linha do inventário</h4>
<table><tr><th>Atividade</th><th>Perigo</th><th>Lesão possível</th><th>P</th><th>S</th><th>Risco</th><th>Controles existentes</th><th>Ação</th></tr>
<tr><td>Limpeza de vidros externos</td><td>Trabalho em altura</td><td>Queda, fratura, morte</td><td>3</td><td>5</td><td>15 – alto</td><td>Cinto e treinamento NR-35</td><td>Substituir por limpador com haste e plataforma elevatória; ancoragem certificada</td></tr></table>`,
["Perigos físicos, químicos, biológicos, ergonômicos, mecânicos e psicossociais","APR + matriz P × S + inspeções + dados de saúde","PGR = inventário de riscos + plano de ação (NR-1)","Um bom inventário atende à NR-1 e à ISO 45001","Considere também oportunidades de SSO"],

L("Legislação de SSO: NRs, saúde ocupacional e eSocial",`<h4>Base legal</h4>
<ul><li><b>Constituição Federal</b>, art. 7º, XXII: redução dos riscos inerentes ao trabalho.</li>
<li><b>CLT</b>, capítulo V (segurança e medicina do trabalho).</li>
<li><b>Normas Regulamentadoras (NRs)</b> do Ministério do Trabalho e Emprego.</li>
<li>Legislação previdenciária (acidente do trabalho, aposentadoria especial, FAP/RAT).</li>
<li>Normas dos Corpos de Bombeiros estaduais e da vigilância sanitária.</li></ul>
<h4>NRs mais aplicadas</h4>
<table><tr><th>NR</th><th>Tema</th><th>Principais obrigações</th></tr>
<tr><td>NR-1</td><td>Disposições gerais e GRO</td><td>PGR, treinamentos, direito de recusa, informação aos trabalhadores</td></tr>
<tr><td>NR-4</td><td>SESMT</td><td>Dimensionamento de profissionais de segurança e saúde</td></tr>
<tr><td>NR-5</td><td>CIPA</td><td>Constituição, eleição, treinamento, reuniões</td></tr>
<tr><td>NR-6</td><td>EPI</td><td>Fornecimento gratuito, com CA, treinamento e registro</td></tr>
<tr><td>NR-7</td><td>PCMSO</td><td>Exames admissional, periódico, de retorno, mudança de risco e demissional (ASO)</td></tr>
<tr><td>NR-9</td><td>Avaliação de agentes físicos, químicos e biológicos</td><td>Avaliações e controle das exposições</td></tr>
<tr><td>NR-10</td><td>Eletricidade</td><td>Prontuário, treinamento, desenergização</td></tr>
<tr><td>NR-11</td><td>Transporte e movimentação de materiais</td><td>Operadores habilitados e treinados</td></tr>
<tr><td>NR-12</td><td>Máquinas e equipamentos</td><td>Proteções, parada de emergência, capacitação</td></tr>
<tr><td>NR-15 / NR-16</td><td>Insalubridade / periculosidade</td><td>Adicionais e limites de tolerância</td></tr>
<tr><td>NR-17</td><td>Ergonomia</td><td>AEP e, quando necessário, AET</td></tr>
<tr><td>NR-23</td><td>Proteção contra incêndios</td><td>Combinada com normas estaduais de bombeiros</td></tr>
<tr><td>NR-24</td><td>Condições sanitárias e de conforto</td><td>Vestiários, refeitórios, sanitários</td></tr>
<tr><td>NR-33 / NR-35</td><td>Espaço confinado / trabalho em altura</td><td>Permissão de trabalho, treinamento, resgate</td></tr></table>
<p>Há NRs setoriais (construção NR-18, saúde NR-32, rural NR-31, frigoríficos NR-36, entre outras). Consulte sempre a versão vigente no portal gov.br do MTE: as NRs vêm passando por revisões frequentes.</p>
<h4>eSocial de SST</h4>
<table><tr><th>Evento</th><th>Conteúdo</th></tr>
<tr><td>S-2210</td><td>Comunicação de Acidente de Trabalho (CAT)</td></tr>
<tr><td>S-2220</td><td>Monitoramento da saúde do trabalhador (ASO)</td></tr>
<tr><td>S-2240</td><td>Condições ambientais do trabalho: agentes nocivos</td></tr></table>
<p>As informações do eSocial alimentam o Perfil Profissiográfico Previdenciário (PPP) eletrônico e cálculos previdenciários. Inconsistência entre PGR, PCMSO e eSocial é um risco legal relevante.</p>
<h4>Integração com o SGI</h4>
<p>Inclua as NRs na matriz legal única, ligue cada uma a perigos do inventário e defina evidências de atendimento. A avaliação de conformidade (ISO 45001, 9.1.2) verifica tudo periodicamente.</p>`,

L("Controles operacionais, contratados, emergências e incidentes",`<h4>Controles operacionais (8.1)</h4>
<ul><li>Procedimentos e instruções seguras de trabalho.</li>
<li><b>Permissão de trabalho (PT)</b> para atividades críticas: altura, espaço confinado, trabalho a quente, eletricidade, escavação.</li>
<li><b>Bloqueio e etiquetagem</b> (LOTO) de energias perigosas antes de manutenção.</li>
<li>Inspeções de segurança e manutenção preventiva de proteções.</li>
<li>Programa de EPIs com seleção, treinamento, troca e higienização.</li>
<li>Adaptação do trabalho aos trabalhadores (ergonomia).</li></ul>
<h4>Gestão de mudanças (8.1.3)</h4>
<p>Checklist mínimo antes de qualquer mudança: novos perigos? Riscos alterados? Requisitos legais? Treinamento? Documentos e sinalização? Comunicação a terceiros? Aprovação de quem?</p>
<h4>Contratados (8.1.4.2)</h4>
<ol><li>Critérios de seleção incluindo desempenho em SSO.</li>
<li>Requisitos contratuais de SSO.</li>
<li>Integração antes de entrar (regras, riscos, emergência).</li>
<li>Documentação: ASO, treinamentos obrigatórios, EPIs.</li>
<li>Permissão de trabalho e acompanhamento.</li>
<li>Avaliação de desempenho e lições aprendidas.</li></ol>
<h4>Emergências (8.2)</h4>
<p>Plano de emergência com cenários (incêndio, vazamento, acidente grave, mal súbito, evacuação, eventos climáticos), brigada treinada, primeiros socorros, rotas e pontos de encontro, comunicação com serviços externos, simulados periódicos com avaliação. Integre com as emergências ambientais.</p>
<h4>Incidentes e investigação (10.2)</h4>
<ol><li>Atender a vítima e controlar a situação.</li>
<li>Preservar o local e as evidências.</li>
<li>Comunicar (internamente e, se acidente, CAT no eSocial).</li>
<li>Investigar com equipe que inclua trabalhadores: o que aconteceu, por quê (causas imediatas, básicas e de gestão).</li>
<li>Definir ações pela hierarquia de controles.</li>
<li>Compartilhar lições aprendidas em outras áreas.</li>
<li>Verificar eficácia.</li></ol>
<h4>Pirâmide de Bird</h4>
<p>Estudos clássicos de Heinrich e Bird mostram que, para cada acidente grave, há muitos acidentes leves, danos materiais e centenas de quase acidentes e atos ou condições inseguras. As proporções exatas são debatidas, mas a lição continua válida: tratar a base da pirâmide (quase acidentes, condições inseguras) previne os eventos graves. Atenção: acidentes fatais têm causas próprias (energias de alto potencial); por isso muitas organizações têm programas específicos para riscos de fatalidade.</p>
<h4>Indicadores de SSO</h4>
<table><tr><th>Tipo</th><th>Indicador</th></tr>
<tr><td>Reativo</td><td>Taxa de frequência = nº de acidentes × 1.000.000 / horas-homem trabalhadas (ABNT NBR 14280)</td></tr>
<tr><td>Reativo</td><td>Taxa de gravidade = dias perdidos e debitados × 1.000.000 / horas-homem</td></tr>
<tr><td>Proativo</td><td>Quase acidentes relatados, inspeções realizadas, ações no prazo, DDS realizados, % de PT corretas</td></tr></table>`,

MOD("sgi","Integração do SGI","Projetar e gerir um sistema integrado de verdade: modelo, documentação, política, objetivos, indicadores e gestão de riscos unificada.",[
L("Modelos e etapas de integração",`<h4>Níveis de integração</h4>
<table><tr><th>Nível</th><th>Características</th></tr>
<tr><td>1. Coexistência</td><td>Sistemas separados, cada um com manual, equipe e auditoria</td></tr>
<tr><td>2. Alinhamento</td><td>Documentos de apoio comuns (controle de documentos, NC, auditoria interna)</td></tr>
<tr><td>3. Integração parcial</td><td>Política, objetivos e análise crítica únicos; operação ainda separada</td></tr>
<tr><td>4. Integração total</td><td>Processos de negócio já incorporam qualidade, ambiente e SSO; um painel, uma gestão de riscos</td></tr></table>
<h4>Abordagens</h4>
<ul><li><b>Por norma</b>: implanta uma norma e acrescenta as outras. Comum, mas tende a gerar "puxadinhos".</li>
<li><b>Por processo</b> (recomendada): parte do mapa de processos e inclui em cada um os requisitos das três normas.</li>
<li><b>Por risco</b>: parte dos maiores riscos do negócio (cliente, ambiente, pessoas) e constrói controles integrados.</li></ul>
<h4>Referências para integrar</h4>
<ul><li>A Estrutura Harmonizada comum às três normas.</li>
<li>A publicação da ISO <i>The integrated use of management system standards</i> (IUMSS), que orienta a integração.</li>
<li>A PAS 99 britânica (especificação de requisitos comuns para sistemas integrados), hoje usada mais como referência.</li></ul>
<h4>Roteiro de integração em 8 etapas</h4>
<ol><li><b>Diagnóstico</b>: o que existe, o que falta (gap analysis) e o nível atual de integração.</li>
<li><b>Patrocínio</b> da alta direção e definição da equipe (qualidade, SESMT, meio ambiente, donos de processo).</li>
<li><b>Contexto e partes interessadas</b> integrados.</li>
<li><b>Mapa de processos</b> único com requisitos das três normas em cada processo.</li>
<li><b>Gestão de riscos integrada</b>: riscos de negócio, aspectos ambientais e perigos de SSO num método coerente.</li>
<li><b>Documentação</b> enxuta e integrada.</li>
<li><b>Implementação e treinamento</b> com foco nas pessoas da operação.</li>
<li><b>Monitoramento, auditoria e análise crítica</b> integrados.</li></ol>
<h4>Fatores críticos de sucesso</h4>
<ul><li>Liderança visível.</li>
<li>Coordenação única do sistema com apoio técnico de cada disciplina.</li>
<li>Linguagem comum (glossário do SGI).</li>
<li>Ferramentas compartilhadas (um software para documentos, NCs, auditorias e indicadores).</li>
<li>Respeito aos requisitos específicos de cada norma.</li>
<li>Medir os ganhos da integração (horas economizadas, custo de auditorias, tempo de resposta).</li></ul>`,
["4 níveis: coexistência, alinhamento, parcial, total","Integrar por processo é o caminho recomendado","Referências: Estrutura Harmonizada, IUMSS da ISO, PAS 99","8 etapas: diagnóstico → análise crítica integrada","Respeite requisitos específicos; meça os ganhos"],

L("Documentação integrada e informação documentada",`<h4>Princípio: documentação mínima e útil</h4>
<p>As normas atuais exigem poucos documentos específicos. Documente para que as pessoas façam certo, para demonstrar resultados e para cumprir leis, não para impressionar o auditor.</p>
<h4>Estrutura documental típica de um SGI</h4>
<table><tr><th>Nível</th><th>Documento</th><th>Exemplos</th></tr>
<tr><td>1</td><td>Estratégicos</td><td>Política integrada, escopo, mapa de processos, objetivos; manual do SGI (opcional, não exigido)</td></tr>
<tr><td>2</td><td>Procedimentos de gestão comuns</td><td>Controle de informação documentada, gestão de riscos, NC e ação corretiva, auditoria interna, análise crítica, gestão de mudanças, competência</td></tr>
<tr><td>3</td><td>Documentos de processo</td><td>Fichas de processo, procedimentos operacionais com qualidade, ambiente e SSO integrados</td></tr>
<tr><td>4</td><td>Instruções e formulários</td><td>Instruções de trabalho no posto, checklists, permissões de trabalho</td></tr>
<tr><td>5</td><td>Registros</td><td>Evidências de execução e resultados</td></tr></table>
<h4>Procedimento operacional integrado</h4>
<p>Em vez de três documentos para a mesma tarefa, um só com seções: objetivo, responsáveis, EPIs e riscos, aspectos ambientais e destino de resíduos, passo a passo com pontos de controle de qualidade, o que fazer em caso de anomalia ou emergência, registros gerados.</p>
<h4>Informação documentada exigida (resumo)</h4>
<table><tr><th>Comum às três</th><th>ISO 14001 (exemplos)</th><th>ISO 45001 (exemplos)</th></tr>
<tr><td>Escopo, política, objetivos, evidência de competência, resultados de monitoramento, programa e resultados de auditoria, análise crítica, NCs e ações</td><td>Aspectos e critérios, aspectos significativos, obrigações de compliance, controle operacional necessário, preparação para emergências, avaliação de conformidade</td><td>Riscos e oportunidades e processos para tratá-los, requisitos legais, processos de emergência, avaliação de conformidade, incidentes e investigações</td></tr></table>
<h4>Controle (7.5.3)</h4>
<ul><li>Identificação (código, título, versão, data).</li>
<li>Análise e aprovação antes de publicar.</li>
<li>Distribuição e acesso controlados; versão vigente no ponto de uso.</li>
<li>Controle de alterações (o que mudou).</li>
<li>Retenção e descarte definidos.</li>
<li>Documentos externos identificados e controlados (normas, leis, manuais de fabricantes, FDS).</li></ul>
<h4>Gestão eletrônica</h4>
<p>Planilhas compartilhadas e pastas em nuvem funcionam em organizações pequenas, com regras claras de versão e permissão. Softwares de gestão de SGI integram documentos, NCs, auditorias, indicadores, treinamentos e riscos, com fluxo de aprovação e trilha de auditoria. O importante é o processo; a ferramenta é meio.</p>
<h4>Linguagem dos documentos</h4>
<p>Frases curtas, verbos no imperativo, fluxogramas, fotos, ícones de EPI e de resíduos. Teste: uma pessoa nova consegue executar a tarefa lendo o documento?</p>`,

L("Política, objetivos e indicadores integrados",`<h4>Política integrada</h4>
<p>Deve conter, de forma clara e curta, os compromissos obrigatórios das três normas:</p>
<table><tr><th>Norma</th><th>Compromissos obrigatórios</th></tr>
<tr><td>ISO 9001</td><td>Atender requisitos aplicáveis; melhoria contínua do SGQ</td></tr>
<tr><td>ISO 14001</td><td>Proteção do meio ambiente, incluindo prevenção da poluição; atender obrigações de compliance; melhoria contínua para aumentar desempenho ambiental</td></tr>
<tr><td>ISO 45001</td><td>Condições seguras e saudáveis; atender requisitos legais e outros; eliminar perigos e reduzir riscos; melhoria contínua; consulta e participação dos trabalhadores</td></tr></table>
<p>Exemplo para uma indústria de alimentos: <i>"Produzir alimentos seguros e saborosos que encantem nossos clientes, protegendo o meio ambiente e a vida das pessoas. Para isso, nos comprometemos a: atender aos requisitos dos clientes, legais e demais assumidos; prevenir a poluição e usar recursos de forma responsável; eliminar perigos e reduzir riscos, garantindo trabalho seguro e saudável com a participação de todos; e melhorar continuamente nosso sistema e nosso desempenho."</i></p>
<h4>Desdobramento de objetivos</h4>
<p>Da política para objetivos estratégicos, depois para metas por processo e, por fim, para ações individuais. Ferramenta útil: <b>Hoshin Kanri</b> (desdobramento das diretrizes) ou <b>OKRs</b> (objetivos e resultados-chave).</p>
<table><tr><th>Diretriz</th><th>Objetivo</th><th>Indicador</th><th>Meta</th></tr>
<tr><td>Encantar clientes</td><td>Reduzir reclamações</td><td>Reclamações por mil unidades</td><td>De 1,2 para 0,6 até dez</td></tr>
<tr><td>Proteger o meio ambiente</td><td>Reduzir consumo de água</td><td>M³ por tonelada</td><td>−10% no ano</td></tr>
<tr><td>Proteger as pessoas</td><td>Reduzir acidentes com afastamento</td><td>Taxa de frequência</td><td>−30% no ano</td></tr>
<tr><td>Proteger as pessoas</td><td>Fortalecer a prevenção</td><td>Quase acidentes relatados por mês</td><td>≥ 40</td></tr></table>
<h4>Painel integrado (dashboard)</h4>
<p>Um painel único para a direção com 10 a 15 indicadores-chave das três dimensões, usando o padrão de semáforo (verde, amarelo, vermelho), tendência e ações. Na operação, quadros de gestão à vista por área.</p>
<h4>Cuidados com indicadores</h4>
<ul><li>Defina claramente fórmula e fonte; dados confiáveis antes de metas ambiciosas.</li>
<li>Equilibre indicadores de resultado (atrasados) e de processo (antecipados).</li>
<li>Evite metas que incentivam esconder problemas (ex.: bônus por "zero acidentes" pode reduzir relatos).</li>
<li>Menos é mais: indicadores sem uso devem ser eliminados.</li></ul>
<h4>Comunicação integrada (7.4)</h4>
<p>Matriz de comunicação: o quê, para quem, quando, como, quem comunica. Inclua comunicações externas obrigatórias (órgão ambiental, eSocial, clientes) e internas (DDS, murais, reuniões, intranet).</p>`,

L("Gestão de riscos integrada e ISO 31000",`<h4>ISO 31000: diretrizes de gestão de riscos</h4>
<p>Risco é o <b>efeito da incerteza nos objetivos</b>, podendo ser negativo ou positivo. A ISO 31000 (não certificável) oferece princípios, estrutura e processo aplicáveis a qualquer tipo de risco, ótima base para integrar riscos de qualidade, ambiente, SSO e negócio.</p>
<h4>Princípios (resumo)</h4>
<p>Gestão de riscos integrada, estruturada e abrangente, personalizada, inclusiva, dinâmica, baseada na melhor informação disponível, considerando fatores humanos e culturais, e com melhoria contínua. O propósito central é criar e proteger valor.</p>
<h4>Processo de gestão de riscos</h4>
<ol><li><b>Escopo, contexto e critérios</b>: o que será avaliado, apetite a risco, escalas.</li>
<li><b>Identificação</b>: o que pode acontecer, por quê, com que consequências.</li>
<li><b>Análise</b>: probabilidade, consequência, controles existentes.</li>
<li><b>Avaliação</b>: comparar com critérios e priorizar.</li>
<li><b>Tratamento</b>: evitar, assumir para buscar oportunidade, remover a fonte, mudar probabilidade, mudar consequência, compartilhar (seguro, contrato), reter com decisão informada.</li>
<li>Durante todo o processo: <b>comunicação e consulta</b>, <b>monitoramento e análise crítica</b>, <b>registro e relato</b>.</li></ol>
<h4>Integrando três mundos de risco</h4>
<table><tr><th>Disciplina</th><th>O que entra</th><th>Requisito</th></tr>
<tr><td>Qualidade e negócio</td><td>Riscos e oportunidades de processos, clientes, fornecedores, mercado</td><td>ISO 9001 6.1</td></tr>
<tr><td>Ambiental</td><td>Aspectos significativos, obrigações de compliance, riscos e oportunidades ambientais</td><td>ISO 14001 6.1.1 a 6.1.4</td></tr>
<tr><td>SSO</td><td>Perigos e riscos de SSO, outros riscos ao sistema, oportunidades</td><td>ISO 45001 6.1.1 a 6.1.4</td></tr></table>
<p>Use escalas compatíveis (por exemplo, consequência de 1 a 5 com descrições para cliente, ambiente, pessoas, finanças, legal e imagem) para comparar e priorizar riscos de naturezas diferentes num único mapa.</p>
<h4>Exemplo de escala de consequência integrada</h4>
<table><tr><th>Nível</th><th>Pessoas</th><th>Ambiente</th><th>Cliente</th><th>Financeiro</th></tr>
<tr><td>1</td><td>Sem lesão</td><td>Sem impacto externo</td><td>Sem percepção</td><td>&lt; R$ 1 mil</td></tr>
<tr><td>3</td><td>Lesão com afastamento</td><td>Impacto local reversível</td><td>Reclamação formal</td><td>R$ 10–100 mil</td></tr>
<tr><td>5</td><td>Fatalidade ou incapacidade permanente</td><td>Dano grave e duradouro</td><td>Perda de cliente importante</td><td>&gt; R$ 1 milhão</td></tr></table>
<h4>Ferramentas complementares</h4>
<ul><li><b>Bow-tie</b>: evento central com causas à esquerda (barreiras de prevenção) e consequências à direita (barreiras de mitigação).</li>
<li><b>Mapa de calor</b> para a direção.</li>
<li><b>Registro de riscos</b> com dono, controles, plano e data de revisão.</li>
<li><b>Indicadores de risco (KRIs)</b>: sinais de alerta antecipados.</li></ul>`,
["Risco = efeito da incerteza nos objetivos (negativo ou positivo)","ISO 31000: princípios, estrutura e processo","Identificar → analisar → avaliar → tratar, com comunicação e monitoramento","Escalas compatíveis para comparar riscos de naturezas diferentes","Bow-tie, mapa de calor, registro de riscos e KRIs"],
