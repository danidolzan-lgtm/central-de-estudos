`Pegue a última ata de análise crítica e marque cada entrada obrigatória como presente ou ausente.`,
[["Fechar uma NC sem verificar a eficácia fere:",["10.2","7.2","4.1","8.4"],0,"A eficácia das ações corretivas deve ser analisada."],["Desde a emenda de 2024, o contexto deve considerar:",["Câmbio","Mudanças climáticas","Concorrência internacional","Salário mínimo"],1,"A emenda incluiu mudanças climáticas."]])]},
{n:"ISO 14001 para Auditores",o:"Auditar o sistema de gestão ambiental de uma transportadora.",a:[
L("Política, aspectos e impactos ambientais",`<h4>Objetivo da ISO 14001</h4><p>Proteger o meio ambiente, cumprir obrigações de conformidade e melhorar o desempenho ambiental. A política deve incluir compromissos com <b>proteção ambiental</b> (incluindo prevenção da poluição), <b>atendimento às obrigações de conformidade</b> e <b>melhoria contínua</b>.</p>
<h4>Aspecto × impacto</h4><p><b>Aspecto</b>: elemento da atividade que interage com o ambiente. <b>Impacto</b>: a mudança resultante. Considere condições normais, anormais e de emergência, e a <b>perspectiva de ciclo de vida</b> (o que acontece antes e depois da sua atividade).</p>
<table><tr><th>Atividade</th><th>Aspecto</th><th>Impacto</th><th>Controle</th></tr><tr><td>Rodagem da frota</td><td>emissão de gases</td><td>poluição do ar, efeito estufa</td><td>manutenção, teste de opacidade, renovação</td></tr><tr><td>Troca de óleo</td><td>geração de óleo usado</td><td>contaminação do solo e água</td><td>coleta por empresa licenciada, MTR</td></tr><tr><td>Lavagem de veículos</td><td>efluente oleoso</td><td>contaminação da água</td><td>caixa separadora, outorga</td></tr><tr><td>Expedição</td><td>resíduos de plástico e paletes</td><td>ocupação de aterro</td><td>coleta seletiva, reuso</td></tr><tr><td>Abastecimento</td><td>vazamento potencial</td><td>contaminação do solo</td><td>bacia de contenção, kit de emergência</td></tr></table>
<h4>Significância</h4><p>Critérios típicos: severidade, frequência/probabilidade, abrangência, requisito legal, preocupação das partes interessadas. Os significativos devem ser comunicados e considerados em objetivos, controles e treinamento. O auditor verifica se o método é coerente e aplicado de forma consistente.</p>`,
["Política: proteção ambiental, obrigações de conformidade, melhoria","Aspecto é causa; impacto é efeito","Normal, anormal e emergência; ciclo de vida","Significativos viram controles e objetivos"],
`Na oficina, o auditor pede a planilha de aspectos e confere no local: o óleo usado está armazenado em área coberta e impermeável, com MTR das últimas coletas?`,
`Monte a planilha de aspectos e impactos de uma unidade com pelo menos 8 atividades e avalie a significância.`,
[["'Emissão de gases pelo escapamento' é:",["Impacto","Aspecto","Requisito legal","Objetivo"],1,"A emissão é o aspecto; a poluição é o impacto."],["A política ambiental deve conter compromisso com:",["Lucro máximo","Prevenção da poluição/proteção ambiental","Redução de salários","Expansão"],1,"É um dos compromissos obrigatórios."]]),
L("Obrigações de conformidade no Brasil",`<h4>Requisito</h4><p>A organização deve determinar e ter acesso às obrigações de conformidade relacionadas aos aspectos ambientais, considerar essas obrigações no sistema e <b>avaliar periodicamente o atendimento</b> (9.1.2), retendo evidências.</p>
<h4>Obrigações típicas de uma transportadora</h4><table><tr><th>Tema</th><th>Referência</th><th>Evidência</th></tr>
<tr><td>Licenciamento</td><td>Res. CONAMA 237 e órgão estadual (IMA em SC)</td><td>licença de operação vigente e condicionantes</td></tr>
<tr><td>Resíduos</td><td>Lei 12.305 (PNRS), MTR nacional (SINIR)</td><td>PGRS, MTR, CDF (certificado de destinação)</td></tr>
<tr><td>Óleo lubrificante usado</td><td>Res. CONAMA 362</td><td>coleta por rerrefinador autorizado</td></tr>
<tr><td>Emissões veiculares</td><td>PROCONVE, programas de opacidade</td><td>laudos de opacidade/fumaça preta</td></tr>
<tr><td>Produtos perigosos</td><td>Res. ANTT 5.998/2022</td><td>MOPP, kit, ficha de emergência, sinalização</td></tr>
<tr><td>Água e efluentes</td><td>outorga, normas de lançamento</td><td>outorga, análises</td></tr>
<tr><td>Crimes ambientais</td><td>Lei 9.605</td><td>—</td></tr></table>
<h4>Como auditar</h4><ol><li>Existe lista de requisitos legais atualizada?</li><li>Para cada requisito, há evidência de atendimento?</li><li>Licenças e condicionantes estão em dia?</li><li>A avaliação de conformidade foi feita na frequência definida e por pessoa competente?</li></ol>
<p>Licença vencida, destinação sem MTR ou condicionante descumprida costumam ser <b>NC maior</b>.</p>`,
["Determinar, acessar, considerar e avaliar obrigações","Licença, PGRS, MTR, CDF, óleo usado, emissões, produtos perigosos","Avaliação periódica de conformidade com registro","Licença vencida costuma ser NC maior"],
`O auditor sorteia 3 MTRs do semestre e confere: o transportador e o destinador estavam licenciados? Há CDF correspondente?`,
`Monte a lista de requisitos legais ambientais da sua unidade com a evidência de atendimento de cada um.`,
[["O documento que acompanha o transporte de resíduos é o:",["CT-e","MTR","ART","CNH"],1,"Manifesto de Transporte de Resíduos."],["A destinação de óleo lubrificante usado é regulada pela:",["CONAMA 362","NR-35","ISO 19011","Lei do Inquilinato"],0,"CONAMA 362 trata do óleo lubrificante usado."]]),
L("Controle operacional, emergências e desempenho ambiental",`<h4>8.1 Controle operacional</h4><p>Controles para os processos ligados aos aspectos significativos: procedimentos, critérios operacionais, controles de engenharia. Inclui a <b>perspectiva de ciclo de vida</b>: requisitos ambientais em compras e contratações (oficinas, coletores de resíduos, lavadores) e informações para clientes sobre impactos relevantes.</p>
<h4>8.2 Preparação e resposta a emergências</h4><ol><li>Identificar situações potenciais (vazamento de diesel, derramamento de carga química, incêndio).</li><li>Planejar respostas para prevenir ou mitigar impactos.</li><li>Responder a situações reais.</li><li><b>Testar periodicamente</b> as respostas (simulados).</li><li>Analisar criticamente e revisar após simulados e ocorrências.</li><li>Treinar pessoas e informar partes interessadas pertinentes.</li></ol>
<h4>9.1 Monitoramento e desempenho</h4><table><tr><th>Indicador</th><th>Exemplo de meta</th></tr><tr><td>Consumo de diesel</td><td>km/l por tipo de veículo</td></tr><tr><td>Emissões de CO₂</td><td>kg CO₂ por tonelada-km</td></tr><tr><td>Resíduos destinados corretamente</td><td>100% com MTR e CDF</td></tr><tr><td>Reciclagem</td><td>% de plástico e papelão reciclados</td></tr><tr><td>Ocorrências ambientais</td><td>zero vazamentos</td></tr></table>
<h4>Como auditar emergências</h4><p>Peça o último simulado: cenário, participantes, tempo de resposta, falhas encontradas e ações tomadas. Vá ao local e confira o kit (completo, acessível, sinalizado) e pergunte a um colaborador o que ele faria em um vazamento.</p>`,
["Controle operacional para aspectos significativos","Ciclo de vida: requisitos em compras e contratações","Emergências: planejar, testar, revisar, treinar","Indicadores de desempenho ambiental com metas"],
`Simulado de vazamento no pátio: contenção em 8 minutos, mas o kit estava a 80 metros da bomba. Ação: novo kit ao lado do ponto de abastecimento e novo simulado em 60 dias.`,
`Avalie o último simulado de emergência ambiental: houve registro, análise e ações de melhoria? Confira um kit no local.`,
[["Além do plano de emergência, a ISO 14001 exige:",["Só guardar o plano","Testar periodicamente as respostas","Contratar seguradora","Certificar fornecedores"],1,"Testes periódicos, quando praticável."],["Exigir licença ambiental da oficina contratada é aplicação de:",["Perspectiva de ciclo de vida/controle de contratados","Auditoria de 3ª parte","Análise crítica","Política"],0,"Controle sobre processos terceirizados e compras."]])]},
{n:"ISO 45001 para Auditores",o:"Auditar o sistema de gestão de saúde e segurança ocupacional.",a:[
L("Perigos, riscos, hierarquia de controles e NRs",`<h4>Conceitos</h4><p><b>Perigo</b>: fonte com potencial de causar lesão ou problemas de saúde. <b>Risco de SSO</b>: combinação da probabilidade do evento com a gravidade da lesão. A identificação deve ser contínua e proativa, cobrindo atividades rotineiras e não rotineiras, fatores humanos, <b>fatores psicossociais</b> (jornada, pressão, assédio), situações de emergência, pessoas no local (visitantes, terceiros) e mudanças.</p>
<h4>Hierarquia de controles (8.1.2)</h4><table><tr><th>Ordem</th><th>Controle</th><th>Exemplo (doca)</th></tr><tr><td>1</td><td>Eliminar</td><td>retirar a necessidade de pedestre na área de manobra</td></tr><tr><td>2</td><td>Substituir</td><td>empilhadeira elétrica no lugar da a combustão</td></tr><tr><td>3</td><td>Engenharia</td><td>faixas segregadas, barreiras, sensores de presença</td></tr><tr><td>4</td><td>Administrativo</td><td>procedimentos, sinalização, treinamento, limite de velocidade</td></tr><tr><td>5</td><td>EPI</td><td>colete refletivo, calçado de segurança</td></tr></table>
<h4>NRs que o auditor precisa conhecer</h4><table><tr><th>NR</th><th>Tema</th></tr><tr><td>NR-1</td><td>disposições gerais, GRO e PGR (inventário de riscos e plano de ação)</td></tr><tr><td>NR-5</td><td>CIPA</td></tr><tr><td>NR-6</td><td>EPI</td></tr><tr><td>NR-7</td><td>PCMSO</td></tr><tr><td>NR-11</td><td>transporte, movimentação e armazenagem de materiais</td></tr><tr><td>NR-12</td><td>máquinas e equipamentos</td></tr><tr><td>NR-17</td><td>ergonomia</td></tr><tr><td>NR-23</td><td>proteção contra incêndios</td></tr><tr><td>NR-35</td><td>trabalho em altura (lonas, cargas altas)</td></tr></table>`,
["Perigo é a fonte; risco combina probabilidade e gravidade","Inclui fatores psicossociais e atividades não rotineiras","Hierarquia: eliminar, substituir, engenharia, administrativo, EPI","PGR da NR-1 é evidência central no Brasil"],
`Constatação típica: o PGR identifica atropelamento por empilhadeira como risco alto, mas o único controle implementado é colete refletivo. A hierarquia não foi aplicada.`,
`Faça o levantamento de perigos de uma doca e proponha controles seguindo a hierarquia.`,
[["Na hierarquia de controles, a primeira opção é:",["EPI","Treinamento","Eliminar o perigo","Sinalização"],2,"Eliminar vem primeiro; EPI é a última barreira."],["A NR-11 trata de:",["Trabalho em altura","Transporte e movimentação de materiais","Ergonomia","CIPA"],1,"Movimentação, armazenagem e manuseio de materiais."]]),
L("Participação dos trabalhadores, contratadas e mudanças",`<h4>5.4 Consulta e participação</h4><p>Diferencial da ISO 45001. <b>Consulta</b> = buscar opinião antes de decidir. <b>Participação</b> = envolver na decisão. A norma exige consulta de trabalhadores não gerenciais sobre necessidades das partes interessadas, política, papéis, requisitos legais, objetivos, controles de terceiros, monitoramento e auditorias; e <b>participação</b> na identificação de perigos, avaliação de riscos, definição de controles, necessidades de treinamento, comunicação e investigação de incidentes.</p><p>A organização deve <b>remover barreiras</b>: idioma, alfabetização, medo de represália, falta de tempo, custos.</p>
<h4>Como auditar</h4><ul><li>Entreviste trabalhadores da linha de frente, não só líderes.</li><li>"Você já participou de alguma análise de acidente ou levantamento de riscos?"</li><li>"Se você vê algo perigoso, o que faz? Já aconteceu algo com quem relatou?"</li><li>Atas de CIPA, DDS, registros de sugestões.</li></ul>
<h4>8.1.4 Contratados e terceirização</h4><p>Coordenar compras, contratados e terceirização: critérios de SSO na seleção, integração de segurança, controle de documentação (ASO, treinamentos, NR-35), fiscalização no local. Agregados e terceiros de carga e descarga entram aqui.</p>
<h4>8.1.3 Gestão de mudanças</h4><p>Novos locais, processos, equipamentos, legislação ou organização do trabalho devem ter os riscos avaliados antes de implementar.</p>`,
["Consulta ≠ participação","Trabalhadores não gerenciais participam da análise de riscos e incidentes","Remover barreiras à participação","Contratados e mudanças com riscos avaliados antes"],
`Ao entrevistar um ajudante de terceiro na descarga, o auditor descobre que ele não recebeu integração de segurança. Evidência para constatação na 8.1.4.`,
`Prepare 6 perguntas para entrevistar trabalhadores sobre participação e aplique a 3 pessoas de funções diferentes.`,
[["Trabalhadores não gerenciais devem participar de:",["Definição de salários","Identificação de perigos e investigação de incidentes","Decisão de investimentos","Contratação de diretores"],1,"Está listado na 5.4."],["Integração de segurança para descarregadores terceirizados se relaciona a:",["8.1.4 Contratados","9.3 Análise crítica","4.3 Escopo","7.5 Documentos"],0,"Coordenação com contratados."]]),
L("Incidentes, emergências e desempenho em SSO",`<h4>Incidente</h4><p>Ocorrência que resulta ou poderia resultar em lesão ou problema de saúde. Inclui o <b>quase acidente</b>. Acidente é o incidente com lesão.</p>
<h4>10.2 Incidentes, NC e ação corretiva</h4><ol><li>Reagir em tempo hábil (socorro, controle, consequências).</li><li>Investigar com <b>participação dos trabalhadores</b>.</li><li>Determinar causas (raiz, no sistema, não culpados).</li><li>Revisar a avaliação de riscos.</li><li>Ações seguindo a hierarquia de controles.</li><li>Avaliar eficácia e comunicar.</li></ol><p>Ferramentas: 5 porquês, árvore de causas, Ishikawa. No Brasil, acidentes de trabalho exigem <b>CAT</b> e registros no eSocial.</p>
<h4>Pirâmide de Bird</h4><p>Para cada acidente grave há dezenas de leves e centenas de quase acidentes. Tratar quase acidentes previne os graves. Uma organização que registra poucos quase acidentes provavelmente não tem cultura de relato.</p>
<h4>8.2 Emergências</h4><p>Planos para incêndio, acidentes com veículos, vazamentos, primeiros socorros; brigada (NR-23 e normas do Corpo de Bombeiros); simulados com registro e revisão.</p>
<h4>Indicadores</h4><table><tr><th>Reativos</th><th>Proativos</th></tr><tr><td>taxa de frequência e gravidade, dias perdidos</td><td>quase acidentes relatados, inspeções feitas, % treinados, ações concluídas</td></tr></table><p>Bons sistemas acompanham principalmente os proativos.</p>`,
["Incidente inclui quase acidente","Investigar causas no sistema, com trabalhadores","Pirâmide de Bird: tratar quase acidentes previne graves","Indicadores reativos e proativos"],
`Unidade com zero quase acidentes registrados em 6 meses e 2 acidentes com afastamento: sinal de ausência de cultura de relato, não de segurança.`,
`Analise um quase acidente com os 5 porquês e defina ações pela hierarquia de controles.`,
[["Um quase acidente deve ser:",["Ignorado","Registrado e investigado","Punido","Tratado só se repetir"],1,"É incidente e deve ser investigado."],["Número de inspeções realizadas é indicador:",["Reativo","Proativo","Financeiro","De qualidade"],1,"Mede ação preventiva."]])]},
{n:"Técnicas de Auditoria",o:"Planejar, conduzir e relatar auditorias com qualidade.",a:[
L("Planejamento: plano de auditoria e lista de verificação",`<h4>Iniciando a auditoria</h4><p>Contato com o auditado: confirmar objetivos, escopo, critérios, datas, acesso a documentos, questões de segurança no local e acompanhantes.</p>
<h4>Análise prévia</h4><p>Documentos do sistema, resultados de auditorias anteriores, indicadores, reclamações, mudanças recentes. Isso permite focar nos riscos.</p>
<h4>Plano de auditoria</h4><table><tr><th>Item</th><th>Conteúdo</th></tr><tr><td>Objetivos</td><td>o que a auditoria quer verificar</td></tr><tr><td>Escopo</td><td>unidades, processos, período</td></tr><tr><td>Critérios</td><td>normas, procedimentos, requisitos legais e de clientes</td></tr><tr><td>Agenda</td><td>horários por processo e responsável</td></tr><tr><td>Equipe</td><td>auditor líder, auditores, especialistas, observadores</td></tr><tr><td>Logística</td><td>reuniões, sala, EPIs, acesso</td></tr></table><p>Envie ao auditado com antecedência e aceite ajustes razoáveis.</p>
<h4>Lista de verificação</h4><p>Guia, não roteiro rígido. Boas práticas: organizar por processo; ligar cada pergunta ao requisito; prever a evidência esperada; deixar espaço para anotações; incluir perguntas abertas. Um bom checklist tem de 20 a 40 itens por processo.</p><table><tr><th>Requisito</th><th>Pergunta</th><th>Evidência esperada</th><th>Anotação</th></tr><tr><td>9001 8.5.2</td><td>Como um volume é rastreado da coleta à entrega?</td><td>leitura no sistema, etiqueta</td><td></td></tr><tr><td>45001 8.1.2</td><td>Como pedestres são protegidos das empilhadeiras?</td><td>faixas, barreiras, regras</td><td></td></tr></table>`,
["Contato inicial confirma escopo, critérios e logística","Análise prévia foca nos riscos","Plano com objetivos, escopo, critérios, agenda e equipe","Checklist guia, não engessa"],
`Plano de 1 dia na unidade: 8h abertura; 8h30 SAC e cotações; 10h expedição (integrada 9001/14001/45001); 13h oficina e resíduos; 15h RH e competências; 16h30 preparação; 17h encerramento.`,
`Escreva o plano de uma auditoria integrada de 1 dia em uma unidade e um checklist de 20 itens para a expedição.`,
[["Quando o plano de auditoria deve ser enviado?",["Depois da auditoria","Com antecedência ao auditado","Nunca","Só se pedirem"],1,"Permite preparação e ajustes."],["A lista de verificação deve ser:",["Roteiro rígido","Guia ligado aos requisitos","Opcional sempre","Secreta"],1,"Guia o auditor sem impedir seguir as evidências."]]),
L("Execução: entrevistas, evidências e amostragem",`<h4>Reunião de abertura</h4><p>Apresentar a equipe, confirmar objetivos, escopo, critérios e agenda, explicar como as constatações serão comunicadas, condições de encerramento e confidencialidade. Curta: 15 a 20 minutos.</p>
<h4>Entrevistando</h4><ul><li>Explique o motivo e coloque a pessoa à vontade.</li><li>Entreviste quem faz o trabalho, no local de trabalho.</li><li>Perguntas abertas: "como…", "me mostre…", "o que acontece quando…".</li><li>Escute mais, fale menos; use silêncio.</li><li>Não discuta, não dê consultoria, não critique.</li><li>Confirme o entendimento e agradeça.</li></ul>
<h4>Evidência objetiva</h4><p>Dados que comprovam a existência ou veracidade de algo: registros, declarações de fato, observações. Fontes: entrevistas, observação das atividades, documentos e registros, dados e indicadores. <b>Triangule</b>: o que dizem, o que o documento manda e o que você observa precisam bater.</p>
<h4>Amostragem</h4><p>Defina tamanho e critério, escolha aleatoriamente e cubra períodos, turnos e pessoas diferentes. Referência prática: 5 a 10 itens por amostra; amplie se encontrar problema. Registre a amostra (números de CT-e, datas, nomes).</p>
<h4>Anotações</h4><p>Anote tudo com rastreabilidade: documento, revisão, número do registro, data, nome e função de quem foi entrevistado. Uma constatação sem dados de referência não se sustenta.</p>
<h4>Gestão do tempo</h4><p>Siga a agenda; se um processo exigir mais tempo, combine com o auditado e o líder da equipe.</p>`,
["Abertura curta e clara","Perguntas abertas, no local, com quem faz","Triangule entrevista, documento e observação","Amostra aleatória e registrada"],
`Em vez de "vocês fazem conferência?", diga "me mostre as conferências de ontem do caminhão da rota Rio do Sul". Amostra: 5 cargas de dias e turnos diferentes.`,
`Faça uma entrevista de auditoria simulada com um colega sobre um processo dele e peça feedback sobre suas perguntas.`,
[["Qual pergunta é mais adequada?",["Vocês seguem a IT?","Está tudo certo?","Me mostre os registros de conferência de ontem","Vocês fazem conferência?"],2,"Pedir para ver gera evidência objetiva."],["Triangular evidências significa:",["Usar três auditores","Comparar entrevista, documento e observação","Auditar três unidades","Fazer três perguntas"],1,"As três fontes devem ser coerentes."]]),
L("Constatações, relatório e acompanhamento",`<h4>Tipos de constatação</h4><table><tr><th>Tipo</th><th>Definição</th></tr><tr><td>Conformidade</td><td>requisito atendido</td></tr><tr><td>NC maior</td><td>ausência ou falha total de um requisito, ou falha que compromete a capacidade do sistema de atingir resultados; várias NCs menores no mesmo requisito podem virar maior</td></tr><tr><td>NC menor</td><td>falha pontual, que não compromete o sistema</td></tr><tr><td>Oportunidade de melhoria</td><td>não é NC; sugestão de aprimoramento</td></tr></table>
<h4>Redação da NC</h4><p><b>Requisito</b> + <b>evidência</b> + <b>declaração</b>. Factual, clara, rastreável, sem opinião, sem solução.</p><p>Exemplo: "A ISO 45001, 8.1.2, exige eliminar perigos e reduzir riscos pela hierarquia de controles. Na doca 2 da unidade X, em 10/03, pedestres e empilhadeiras circulavam na mesma área sem faixa ou barreira; o PGR classifica o risco como alto e o único controle é o colete refletivo. Os controles não seguem a hierarquia."</p>
<h4>Reunião de encerramento</h4><p>Apresentar constatações e conclusões, confirmar o entendimento, explicar próximos passos (prazos para plano de ação), registrar divergências não resolvidas.</p>
<h4>Relatório</h4><p>Objetivos, escopo, critérios, equipe, datas e locais, constatações e evidências, conclusões, pontos fortes, distribuição. Emitido no prazo combinado.</p>
<h4>Acompanhamento</h4><p>O auditado propõe correções e ações corretivas com causa raiz. O auditor avalia se o plano é adequado e, depois, se as ações foram implementadas e eficazes. NC maior normalmente exige evidência antes da recomendação de certificação.</p>`,
["Conformidade, NC maior, NC menor, oportunidade de melhoria","NC = requisito + evidência + declaração, sem solução","Encerramento confirma entendimento e próximos passos","Acompanhar plano, implementação e eficácia"],
`Três checklists sem assinatura em 20 verificados são uma NC menor. Nenhum checklist feito no mês, em uma unidade, mostra falha total do controle: NC maior.`,
`Redija 3 NCs (uma de cada norma) a partir de situações reais ou simuladas, e classifique como maior ou menor.`,
[["Quais são os três elementos de uma NC bem escrita?",["Nome, cargo, data","Requisito, evidência, declaração","Causa, ação, prazo","Problema, culpado, multa"],1,"Requisito, evidência objetiva e declaração."],["Uma sugestão sem requisito descumprido é:",["NC maior","NC menor","Oportunidade de melhoria","Observação legal"],2,"Não há NC sem requisito descumprido."]])]},
{n:"Auditoria Integrada, Liderança e Prova",o:"Liderar auditorias integradas e se preparar para a certificação de auditor.",a:[
L("Liderando auditorias integradas",`<h4>Auditar por processo</h4><p>Organize a auditoria por processo, não por norma. Na expedição, verifique na mesma visita: requisitos do cliente e conferência (9001), resíduos e emergências (14001), perigos e controles (45001). Use checklist com colunas por norma para não deixar requisitos específicos sem cobertura.</p>
<h4>Tempo de auditoria</h4><p>Certificadoras usam tabelas do IAF (documento MD 5 e MD 11 para integradas) que relacionam número de pessoas e complexidade ao tempo de auditoria. A integração pode reduzir o tempo total, desde que todos os requisitos sejam cobertos.</p>
<h4>Papel do auditor líder</h4><ul><li>Planejar e distribuir processos conforme a competência de cada auditor.</li><li>Conduzir abertura e encerramento.</li><li>Fazer reuniões rápidas da equipe ao longo do dia.</li><li>Garantir consistência na classificação das constatações.</li><li>Resolver conflitos e divergências com o auditado.</li><li>Decidir a conclusão e assinar o relatório.</li></ul>
<h4>Situações difíceis</h4><table><tr><th>Situação</th><th>Como agir</th></tr><tr><td>Auditado discorda da NC</td><td>reapresente o requisito e a evidência; se persistir, registre a divergência</td></tr><tr><td>Atraso na agenda</td><td>reprioritize processos de maior risco, combine com o auditado</td></tr><tr><td>Evidência apresentada "depois"</td><td>avalie se é válida para o período auditado</td></tr><tr><td>Risco grave imediato (segurança)</td><td>comunique na hora ao responsável</td></tr></table>`,
["Auditar por processo cobrindo as três normas","Tempo de auditoria segue documentos do IAF","Líder planeja, alinha a equipe e decide a conclusão","Divergências são registradas, não discutidas sem fim"],
`Ao encontrar empilhadeira operando com pedestres sem segregação, o auditor líder comunica imediatamente ao gerente da unidade, antes mesmo do encerramento, por ser risco grave.`,
`Monte um checklist integrado da expedição com colunas para 9001, 14001 e 45001, e o roteiro da reunião de encerramento.`,
[["Em uma auditoria integrada, é recomendado organizar por:",["Norma","Processo","Ordem alfabética","Departamento financeiro"],1,"Auditar por processo cobre as normas de forma natural."],["Quem decide a conclusão da auditoria?",["O auditado","O auditor líder","O consultor","O cliente"],1,"É papel do auditor líder."]]),
L("Estudos de caso: classificando situações",`<h4>Como resolver um estudo de caso</h4><ol><li>Leia a situação e destaque os fatos.</li><li>Pergunte: há um requisito descumprido? Qual norma e cláusula?</li><li>A falha é pontual ou sistêmica?</li><li>Classifique: conformidade, NC menor, NC maior ou oportunidade.</li><li>Redija com requisito + evidência + declaração.</li></ol>
<h4>Casos para treinar</h4><table><tr><th>Situação</th><th>Análise</th></tr>
<tr><td>A IT de conferência está na revisão 04, mas a doca usa uma cópia impressa da revisão 02.</td><td>9001 7.5.3: documento obsoleto em uso. NC menor (pontual).</td></tr>
<tr><td>A empresa não tem nenhum registro de avaliação de conformidade legal ambiental.</td><td>14001 9.1.2: ausência total. NC maior.</td></tr>
<tr><td>Extintor da área de abastecimento vencido há 3 meses.</td><td>45001 8.1/8.2 e NR-23: NC menor se pontual; maior se generalizado.</td></tr>
<tr><td>Agregados não são avaliados, mas fazem 40% das entregas.</td><td>9001 8.4: ausência de controle sobre provedor crítico. NC maior.</td></tr>
<tr><td>Auditor sugere usar QR code nos checklists.</td><td>Oportunidade de melhoria.</td></tr>
<tr><td>Quase acidente registrado, mas sem investigação.</td><td>45001 10.2: NC menor (ou maior se for padrão).</td></tr>
<tr><td>Política da qualidade não menciona melhoria contínua.</td><td>9001 5.2.1: NC menor.</td></tr></table>
<h4>Erros clássicos em prova</h4><ul><li>Confundir 7.5 (documentos) com 8.5 (prestação do serviço).</li><li>Chamar de NC o que é oportunidade.</li><li>Esquecer requisito legal como critério.</li><li>Classificar como maior uma falha pontual.</li></ul>`,
["Fatos → requisito → pontual ou sistêmico → classificação","Ausência total ou falha em provedor crítico tende a NC maior","Sugestão sem requisito é oportunidade","Requisitos legais também são critérios"],
`Resolva sempre com o texto da norma ao lado: a prova costuma permitir consulta, e saber onde está cada requisito vale mais do que decorar.`,
`Crie mais 10 estudos de caso a partir da sua realidade e resolva cada um com cláusula e classificação.`,
[["Cópia obsoleta de IT em uso na doca fere:",["7.5.3","8.4","9.3","4.1"],0,"Controle de informação documentada."],["Ausência total de avaliação de agregados críticos tende a ser:",["Conformidade","NC menor","NC maior","Oportunidade"],2,"Falha total de controle sobre provedor crítico."]]),
L("Prova, registro e carreira de auditor",`<h4>A prova de auditor líder</h4><p>Cursos de auditor líder (cerca de 40 horas) normalmente têm avaliação contínua (participação, exercícios, simulação de auditoria) e exame final escrito com questões de interpretação, classificação de NCs e técnicas da ISO 19011. Cursos reconhecidos por entidades como Exemplar Global ou CQI/IRCA seguem padrões próprios.</p>
<h4>Revisão final</h4><table><tr><th>Tema</th><th>O que dominar</th></tr><tr><td>Estrutura</td><td>cláusulas 4 a 10 e o que é específico de cada norma</td></tr><tr><td>Definições</td><td>NC, risco, perigo, aspecto, impacto, incidente, evidência</td></tr><tr><td>ISO 19011</td><td>princípios, programa, etapas, competências</td></tr><tr><td>Classificação</td><td>NC maior, menor, oportunidade</td></tr><tr><td>Controles</td><td>hierarquia de controles, controle operacional</td></tr><tr><td>Certificação</td><td>estágios 1 e 2, ciclo de 3 anos</td></tr></table>
<h4>Dia da prova</h4><ul><li>Leia o enunciado inteiro antes de responder.</li><li>Em casos, sublinhe os fatos.</li><li>Use a norma para confirmar a cláusula.</li><li>Gerencie o tempo: não fique preso em uma questão.</li></ul>
<h4>Registro e carreira</h4><p>Para registro internacional, além do curso, é exigida experiência comprovada em auditorias (como auditor em formação e depois como líder). Comece pelas auditorias internas da empresa, registrando data, escopo, papel e horas. Caminhos: auditor interno, auditor de segunda parte para clientes, auditor de certificadora, consultor. Mantenha-se atualizado: novas versões de normas (como a ISO 9001:2026 e a 14001) exigem cursos de transição.</p>`,
["Prova: interpretação, classificação e ISO 19011","Revise estrutura, definições e controles","Use a norma para confirmar cláusulas","Experiência registrada é exigida para registro internacional"],
`Depois de certificado, conduza a próxima auditoria interna da MIR como auditor líder, com um auditor em formação, e registre como experiência.`,
`Faça um simulado de 30 questões cronometrado e monte sua planilha de registro de auditorias.`,
[["Além do curso, o registro internacional de auditor costuma exigir:",["Diploma de engenharia","Experiência comprovada em auditorias","Inglês fluente","Carta da empresa"],1,"Entidades pedem auditorias realizadas."],["O ciclo de certificação de terceira parte dura:",["1 ano","3 anos","5 anos","10 anos"],1,"Três anos, com supervisões anuais."]])]}
],

{n:"First Steps",o:"Apresentar-se, falar de pessoas e descrever lugares com frases simples.",a:[
L("Verb to be",`<h4>Formas</h4><table><tr><th>Afirmativa</th><th>Negativa</th><th>Pergunta</th></tr><tr><td>I am (I'm)</td><td>I'm not</td><td>Am I?</td></tr><tr><td>You are (you're)</td><td>you aren't</td><td>Are you?</td></tr><tr><td>He/She/It is (he's)</td><td>he isn't</td><td>Is he?</td></tr><tr><td>We/They are (we're)</td><td>we aren't</td><td>Are they?</td></tr></table>
<h4>Usos</h4><ul><li>Identidade e profissão: <i>I'm a quality analyst.</i></li><li>Origem: <i>We're from Santa Catarina.</i></li><li>Estado e localização: <i>The truck is at the dock. The manager is busy.</i></li><li>Idade: <i>I'm 30</i> (não "I have 30 years").</li></ul>
<h4>Respostas curtas</h4><p><i>Are you ready? Yes, I am. / No, I'm not.</i> Não se usa contração na resposta curta afirmativa ("Yes, I'm" está errado).</p>
<h4>Apresentação pronta</h4><p><i>Hi, I'm ___. I'm from Rio do Sul, in Brazil. I'm a ___ at a freight company. Nice to meet you.</i></p>`,
["am / is / are","Contrações: I'm, he's, they're","Idade com to be: I'm 30","Resposta curta sem contração: Yes, I am"],
`"Is the driver here? No, he isn't. He's at the warehouse."`,
`Escreva e grave sua apresentação com 6 frases usando to be.`,
[["Qual frase está correta?",["She are here.","She is here.","She am here.","She be here."],1,"He/she/it usa is."],["Como dizer 'tenho 30 anos'?",["I have 30 years.","I am 30.","I'm have 30.","I has 30."],1,"Idade em inglês usa to be."]]),
L("Pronomes, possessivos e família",`<h4>Pronomes</h4><table><tr><th>Sujeito</th><th>Objeto</th><th>Possessivo</th></tr><tr><td>I</td><td>me</td><td>my</td></tr><tr><td>you</td><td>you</td><td>your</td></tr><tr><td>he</td><td>him</td><td>his</td></tr><tr><td>she</td><td>her</td><td>her</td></tr><tr><td>it</td><td>it</td><td>its</td></tr><tr><td>we</td><td>us</td><td>our</td></tr><tr><td>they</td><td>them</td><td>their</td></tr></table>
<p><i>She calls me every day. Their office is big. Call him, please.</i></p>
<h4>Genitivo 's</h4><p>Indica posse: <i>the driver's phone</i> (o telefone do motorista), <i>the customer's address</i>. No plural terminado em s, só o apóstrofo: <i>the drivers' room</i>.</p>
<h4>Família e equipe</h4><p><i>mother, father, sister, brother, wife, husband, girlfriend, boyfriend, son, daughter</i> / <i>manager, coworker (colleague), team, boss</i>.</p>
<h4>Atenção</h4><p><i>its</i> (dele, de coisa) ≠ <i>it's</i> (it is). <i>their</i> ≠ <i>there</i> ≠ <i>they're</i>.</p>`,
["Sujeito, objeto e possessivo","'s indica posse","its ≠ it's","their / there / they're"],
`"My manager's name is Ana. Her team has six people. I work with them every day."`,
`Descreva sua família ou equipe em 8 frases usando possessivos e 's.`,
[["Complete: This is ___ car (dele).",["he","his","him","he's"],1,"Possessivo de he é his."],["'The driver's phone' significa:",["Os motoristas telefonam","O telefone do motorista","O motorista é telefone","Motoristas e telefones"],1,"'s indica posse."]]),
L("Artigos, plurais e there is / there are",`<h4>Artigos</h4><p><b>a</b> antes de som de consoante (<i>a truck, a university</i>); <b>an</b> antes de som de vogal (<i>an invoice, an hour</i>); <b>the</b> para algo específico ou já mencionado (<i>the truck at dock 2</i>). Não use artigo em generalizações: <i>Trucks are expensive.</i></p>
<h4>Plurais</h4><table><tr><th>Regra</th><th>Exemplo</th></tr><tr><td>+s</td><td>box → boxes? não: box → boxes (+es)</td></tr><tr><td>+s padrão</td><td>truck → trucks</td></tr><tr><td>-s, -sh, -ch, -x → +es</td><td>box → boxes, branch → branches</td></tr><tr><td>consoante + y → ies</td><td>delivery → deliveries</td></tr><tr><td>irregulares</td><td>person → people, man → men, child → children</td></tr></table>
<h4>There is / there are</h4><p>"Há/tem" (existência): <i>There is a problem with the invoice. There are three trucks at the dock. Is there a manager here? There aren't any pallets.</i></p>
<p>Não confunda com <i>have</i>: "A unidade tem 20 funcionários" = <i>The branch has 20 employees</i> (posse); "Tem um caminhão lá fora" = <i>There is a truck outside</i> (existência).</p>`,
["a antes de consoante; an antes de som de vogal","the para algo específico","Plurais: +s, +es, -ies, irregulares","There is/are = existência; have = posse"],
`"There are 40 deliveries today and there is a problem with one address."`,
`Descreva sua unidade de trabalho em 10 frases com there is/are e plurais.`,
[["Complete: ___ hour.",["a","an","the","—"],1,"Hour começa com som de vogal."],["Plural de delivery:",["deliverys","deliveries","deliveryes","delivery"],1,"Consoante + y vira ies."]])]},
{n:"Daily Life",o:"Falar de rotinas, hábitos e frequência.",a:[
L("Simple present",`<h4>Uso</h4><p>Rotinas, hábitos, fatos e horários fixos: <i>I work from 8 to 6. The office opens at 8. Trucks leave every night.</i></p>
<h4>Terceira pessoa</h4><table><tr><th>Regra</th><th>Exemplo</th></tr><tr><td>+s</td><td>work → works</td></tr><tr><td>-o, -s, -sh, -ch, -x → +es</td><td>go → goes, finish → finishes</td></tr><tr><td>consoante + y → ies</td><td>study → studies</td></tr><tr><td>irregular</td><td>have → has</td></tr></table>
<h4>Verbos de rotina</h4><p><i>wake up, get up, have breakfast, go to work, check emails, attend a meeting, have lunch, finish work, get home, go to bed</i>.</p>
<h4>Expressões de tempo</h4><p><i>every day, every Monday, in the morning, at night, on weekends, once a week, twice a month</i>.</p>`,
["Rotinas, fatos e horários","He/she/it + s","go → goes, have → has","Expressões de tempo"],
`"I wake up at 6. I check the dashboards at 8. My manager has a meeting every Monday."`,
`Escreva sua rotina de um dia de trabalho em 10 frases e a de um colega (com he/she).`,
[["Complete: She ___ to work by car.",["go","goes","going","gos"],1,"Go → goes na terceira pessoa."],["Complete: He ___ two kids.",["have","has","haves","having"],1,"Have → has."]]),
L("Perguntas e negativas com do / does",`<h4>Estrutura</h4><table><tr><th></th><th>I/you/we/they</th><th>he/she/it</th></tr><tr><td>Negativa</td><td>I don't work</td><td>She doesn't work</td></tr><tr><td>Pergunta</td><td>Do you work?</td><td>Does she work?</td></tr><tr><td>Resposta</td><td>Yes, I do / No, I don't</td><td>Yes, she does / No, she doesn't</td></tr></table><p>Com <b>does</b> o verbo perde o -s: <i>Does he speak</i> (não "speaks").</p>
<h4>Palavras interrogativas</h4><p><i>What</i> (o que), <i>Where</i> (onde), <i>When</i> (quando), <i>What time</i> (que horas), <i>Who</i> (quem), <i>Why</i> (por quê), <i>How</i> (como), <i>How often</i> (com que frequência), <i>How long</i> (quanto tempo), <i>How much/many</i> (quanto).</p><p><i>Where do you work? What time does the truck leave? How often do you travel?</i></p>
<h4>Exceção: to be</h4><p>Com to be não se usa do: <i>Are you busy?</i> (não "Do you are").</p>`,
["don't / doesn't","Do/Does + verbo base","What, Where, When, How often…","To be não usa do"],
`"What time does the warehouse open? It opens at 6. Does it close on Saturdays? No, it doesn't."`,
`Escreva 10 perguntas sobre a rotina de um colega usando palavras interrogativas diferentes.`,
[["Complete: ___ he speak English?",["Do","Does","Is","Are"],1,"He usa does."],["Qual está correta?",["She doesn't works.","She doesn't work.","She don't work.","She not work."],1,"Com doesn't o verbo fica na forma base."]]),
L("Advérbios de frequência e rotina de trabalho",`<h4>Frequência</h4><table><tr><th>Advérbio</th><th>%</th></tr><tr><td>always</td><td>100%</td></tr><tr><td>usually</td><td>80%</td></tr><tr><td>often</td><td>60%</td></tr><tr><td>sometimes</td><td>40%</td></tr><tr><td>rarely / seldom</td><td>10%</td></tr><tr><td>never</td><td>0%</td></tr></table>
<h4>Posição</h4><p>Antes do verbo principal: <i>I usually check the reports.</i> Depois do to be: <i>He is always on time.</i> Expressões como <i>every day</i> e <i>once a week</i> vão no fim: <i>We have a meeting once a week.</i></p>
<h4>Falando do trabalho</h4><p><i>I'm responsible for… / I deal with… / I work with… / I usually… / Most of my time I…</i></p><p><i>I'm responsible for the quality system. I usually analyze data in the morning and I sometimes visit the branches.</i></p>`,
["always → never","Antes do verbo; depois do to be","Expressões de tempo no fim","I'm responsible for… / I deal with…"],
`"I always check the late deliveries first. I rarely work on Sundays."`,
`Grave um áudio de 1 minuto sobre sua rotina usando 5 advérbios de frequência.`,
[["Posição correta:",["I check usually emails.","I usually check emails.","Usually I check emails always.","I check emails usually always."],1,"Antes do verbo principal."],["Complete: He ___ late.",["never is","is never","never be","is be never"],1,"Depois do to be."]])]},
{n:"Right Now",o:"Falar do que está acontecendo agora, de datas e horários, e se virar ao telefone.",a:[
L("Present continuous",`<h4>Forma</h4><p>to be + verbo-ing: <i>I am working. She is driving. They are loading the truck.</i> Negativa: <i>I'm not working.</i> Pergunta: <i>Are you working?</i></p>
<h4>Regras do -ing</h4><p>make → making (tira o e), stop → stopping (dobra a consoante em sílaba forte curta), lie → lying.</p>
<h4>Usos</h4><ul><li>Agora: <i>I'm checking the report right now.</i></li><li>Situação temporária: <i>I'm studying English this year.</i></li><li>Mudanças: <i>Prices are going up.</i></li></ul>
<h4>Simple × continuous</h4><p><i>I work in Rio do Sul</i> (sempre) × <i>I'm working in Blumenau this week</i> (temporário). Verbos de estado não costumam ir para o -ing: <i>know, like, want, need, understand, believe</i> (<i>I need</i>, não "I'm needing").</p>`,
["to be + -ing","Agora, temporário, mudanças","Simple = rotina; continuous = agora/temporário","Verbos de estado: know, need, want"],
`"The driver is unloading at the customer now. We are waiting for the proof of delivery."`,
`Descreva o que 8 pessoas estão fazendo agora na sua empresa.`,
[["Qual frase indica algo temporário?",["I work here.","I'm working from home this week.","I always work.","I worked."],1,"Continuous para situação temporária."],["Qual está correta?",["I'm needing help.","I need help.","I needing help.","I am need help."],1,"Need é verbo de estado."]]),
L("Números, datas e horas",`<h4>Números</h4><p>13 thirteen × 30 thirty (a tônica muda: thir<b>TEEN</b> × <b>THIR</b>ty). 100 a hundred, 1,000 a thousand, 1,000,000 a million. Atenção: em inglês a vírgula separa milhares e o ponto separa decimais: <b>1,250.75</b>.</p>
<h4>Ordinais e datas</h4><p>1st first, 2nd second, 3rd third, 4th fourth, 21st twenty-first. Datas: <i>November 10th, 2026</i>; falado: <i>November the tenth</i>. Nos EUA, 11/10 = 10 de novembro (mês/dia). Prepositions: <i>on</i> Monday, <i>on</i> May 5th, <i>in</i> May, <i>in</i> 2027, <i>at</i> 9 a.m.</p>
<h4>Horas</h4><table><tr><th>Hora</th><th>Forma 1</th><th>Forma 2</th></tr><tr><td>9:00</td><td>nine o'clock</td><td>nine</td></tr><tr><td>9:15</td><td>quarter past nine</td><td>nine fifteen</td></tr><tr><td>9:30</td><td>half past nine</td><td>nine thirty</td></tr><tr><td>9:45</td><td>quarter to ten</td><td>nine forty-five</td></tr></table><p>a.m. = manhã; p.m. = tarde/noite.</p>`,
["thirteen × thirty: a tônica muda","1,250.75: vírgula para milhar","on + dia, in + mês/ano, at + hora","quarter past, half past, quarter to"],
`"The pickup is on Tuesday, March 9th, at half past two p.m. The cargo weighs 1,250 kilos."`,
`Leia em voz alta 15 datas, horas e valores da sua agenda e de notas fiscais.`,
[["Como se escreve mil duzentos e cinquenta e setenta e cinco centavos em inglês?",["1.250,75","1,250.75","1 250 75","1250,75"],1,"Vírgula para milhar, ponto para decimal."],["Complete: The meeting is ___ Monday.",["in","on","at","by"],1,"Dias usam on."]]),
L("Ao telefone e soletrando",`<h4>Alfabeto (sons que confundem)</h4><table><tr><th>Letra</th><th>Som</th></tr><tr><td>A</td><td>ei</td></tr><tr><td>E</td><td>í</td></tr><tr><td>I</td><td>ai</td></tr><tr><td>G</td><td>dji</td></tr><tr><td>J</td><td>djei</td></tr><tr><td>R</td><td>ar</td></tr><tr><td>W</td><td>dâbliu</td></tr><tr><td>Y</td><td>uai</td></tr></table><p>E-mail: @ = <i>at</i>, . = <i>dot</i>, - = <i>dash</i>, _ = <i>underscore</i>.</p>
<h4>Frases de telefone</h4><table><tr><th>Situação</th><th>Frase</th></tr><tr><td>Atender</td><td>Good morning, MirindoSul, ___ speaking.</td></tr><tr><td>Pedir alguém</td><td>Could I speak to ___, please?</td></tr><tr><td>Aguardar</td><td>Hold on a second, please.</td></tr><tr><td>Transferir</td><td>I'll put you through.</td></tr><tr><td>Ausente</td><td>I'm afraid she's not available. Can I take a message?</td></tr><tr><td>Não entendeu</td><td>Sorry, could you repeat that, please?</td></tr><tr><td>Soletrar</td><td>Could you spell that, please?</td></tr><tr><td>Encerrar</td><td>Thanks for calling. Have a nice day.</td></tr></table>`,
["Letras confusas: A, E, I, G, J, R, Y","@ at, . dot","Frases prontas para atender, transferir e anotar recado","Could you spell that?"],
`"Could you spell your last name? S-I-L-V-A. And your email? silva at company dot com."`,
`Simule em voz alta uma ligação de confirmação de coleta, soletrando nome e e-mail.`,
[["'I'll put you through' significa:",["Vou desligar","Vou transferir a ligação","Vou anotar","Vou repetir"],1,"Transferir para a pessoa."],["Como se lê '@' num e-mail?",["at","arroba","and","dot"],0,"@ é 'at'."]])]},
{n:"The Past",o:"Contar o que aconteceu ontem, na semana passada e em experiências passadas.",a:[
L("Simple past: was/were e verbos regulares",`<h4>Was / were</h4><p>I/he/she/it <b>was</b>; you/we/they <b>were</b>. <i>The truck was late. We were at the meeting. Were you there?</i></p>
<h4>Verbos regulares</h4><p>+ed: work → worked, deliver → delivered, stop → stopped, study → studied, arrive → arrived.</p>
<h4>Pronúncia do -ed</h4><table><tr><th>Som</th><th>Quando</th><th>Exemplos</th></tr><tr><td>/t/</td><td>depois de sons surdos (p, k, s, sh, ch, f)</td><td>worked, stopped, fixed</td></tr><tr><td>/d/</td><td>depois de sons sonoros</td><td>delivered, called, planned</td></tr><tr><td>/ɪd/</td><td>só depois de t ou d</td><td>started, needed, loaded</td></tr></table><p>Erro comum: falar "work-ed" com sílaba extra. Só ganha sílaba depois de t/d.</p>
<h4>Expressões de passado</h4><p><i>yesterday, last week, last month, two days ago, in 2020, this morning</i>.</p>`,
["was / were","Regulares + ed","Pronúncia /t/, /d/, /ɪd/","yesterday, last week, ago"],
`"Yesterday we delivered 300 orders. Two trucks arrived late because it rained."`,
`Escreva 10 coisas que você fez ontem com verbos regulares e leia em voz alta cuidando do -ed.`,
[["Qual se pronuncia com sílaba extra (/ɪd/)?",["worked","started","called","stopped"],1,"Depois de t ou d."],["Complete: They ___ at the office yesterday.",["was","were","are","is"],1,"They usa were."]]),
L("Verbos irregulares",`<h4>Os 30 mais usados</h4><table><tr><th>Base</th><th>Passado</th><th>Base</th><th>Passado</th></tr><tr><td>be</td><td>was/were</td><td>go</td><td>went</td></tr><tr><td>have</td><td>had</td><td>get</td><td>got</td></tr><tr><td>do</td><td>did</td><td>make</td><td>made</td></tr><tr><td>say</td><td>said</td><td>see</td><td>saw</td></tr><tr><td>take</td><td>took</td><td>come</td><td>came</td></tr><tr><td>give</td><td>gave</td><td>find</td><td>found</td></tr><tr><td>think</td><td>thought</td><td>tell</td><td>told</td></tr><tr><td>send</td><td>sent</td><td>leave</td><td>left</td></tr><tr><td>buy</td><td>bought</td><td>bring</td><td>brought</td></tr><tr><td>pay</td><td>paid</td><td>meet</td><td>met</td></tr><tr><td>write</td><td>wrote</td><td>speak</td><td>spoke</td></tr><tr><td>drive</td><td>drove</td><td>break</td><td>broke</td></tr><tr><td>lose</td><td>lost</td><td>begin</td><td>began</td></tr><tr><td>know</td><td>knew</td><td>put</td><td>put</td></tr><tr><td>feel</td><td>felt</td><td>understand</td><td>understood</td></tr></table>
<h4>Como decorar</h4><p>Agrupe por padrão: <i>buy/bought, bring/brought, think/thought</i>; <i>send/sent, spend/spent, lend/lent</i>; <i>put/put, cut/cut, cost/cost</i>. Coloque no Anki com uma frase de trabalho.</p>`,
["Decore os 30 mais usados","Agrupe por padrão de som","Use sempre em frases","Revise no Anki"],
`"The driver left at 5, drove 300 km and brought the documents back. He lost one invoice."`,
`Coloque os 30 verbos no Anki com uma frase cada e conte uma história de 8 frases usando 10 deles.`,
[["Passado de 'bring':",["bringed","brought","brang","brung"],1,"Bring → brought."],["Passado de 'leave':",["leaved","left","lived","leaft"],1,"Leave → left."]]),
L("Perguntas no passado e contando histórias",`<h4>Did</h4><p>Pergunta: <i>Did you send the report?</i> Negativa: <i>I didn't send it.</i> Depois de did o verbo volta à forma base: <i>Did he go</i> (não "went").</p><p><i>What did you do yesterday? Where did the truck stop? Why didn't they call?</i></p>
<h4>Past continuous</h4><p>was/were + -ing para ação em andamento no passado, interrompida por outra: <i>I was driving when the customer called. While we were loading, it started to rain.</i></p>
<h4>Conectores de história</h4><p><i>First, then, after that, later, suddenly, in the end, finally</i>.</p>
<h4>Estrutura de relato de problema</h4><ol><li>Contexto: <i>Last Friday we were delivering in Joinville.</i></li><li>Problema: <i>Suddenly the truck broke down.</i></li><li>Ação: <i>We called the mechanic and sent another truck.</i></li><li>Resultado: <i>In the end, we delivered everything by 6 p.m.</i></li></ol>`,
["Did + verbo base","didn't + verbo base","Past continuous: ação em andamento interrompida","First, then, suddenly, in the end"],
`"What happened? We were waiting at the dock when the system went down. Then we issued the documents manually."`,
`Conte por escrito e em áudio um problema real do trabalho seguindo a estrutura de 4 partes.`,
[["Complete: Did you ___ the email?",["sent","send","sending","sends"],1,"Depois de did, forma base."],["Complete: I ___ driving when he called.",["am","was","were","did"],1,"I com past continuous: was."]])]},
{n:"Future and Plans",o:"Falar de planos, previsões e compromissos.",a:[
L("Will e going to",`<h4>Will</h4><ul><li>Decisão na hora: <i>The phone is ringing. I'll answer it.</i></li><li>Promessas e ofertas: <i>I'll send it today. I'll help you.</i></li><li>Previsões de opinião: <i>I think it will rain.</i></li></ul><p>Negativa: <i>won't</i>. Pergunta: <i>Will you…?</i></p>
<h4>Going to</h4><ul><li>Planos já decididos: <i>We're going to open a new branch next year.</i></li><li>Previsões com evidência: <i>Look at the traffic. We're going to be late.</i></li></ul>
<h4>Comparando</h4><table><tr><th>Situação</th><th>Frase</th></tr><tr><td>Já planejado</td><td>I'm going to study for the TOEIC next year.</td></tr><tr><td>Decidido agora</td><td>OK, I'll call him now.</td></tr><tr><td>Promessa</td><td>I'll send you the report by Friday.</td></tr></table>`,
["Will: decisão na hora, promessa, opinião","Going to: plano e evidência","won't = will not","I'll send it by Friday"],
`"We're going to change the route next month. Don't worry, I'll update the customer today."`,
`Escreva 6 planos para 2027 com going to e 6 promessas de trabalho com will.`,
[["'The phone is ringing. I ___ answer it.'",["am going to","will","did","am"],1,"Decisão espontânea: will."],["Plano já decidido:",["I'll study next year, I think.","I'm going to start a course in February.","I study tomorrow.","I studied tomorrow."],1,"Plano: going to."]]),
L("Present continuous para futuro e expressões de tempo",`<h4>Compromissos marcados</h4><p>Para algo agendado com hora e lugar, use present continuous: <i>I'm meeting the client on Tuesday at 10. We're flying to São Paulo next week.</i></p>
<h4>Horários oficiais</h4><p>Simple present para tabelas e horários: <i>The truck leaves at 10 p.m. The course starts on February 1st.</i></p>
<h4>Expressões</h4><p><i>tomorrow, the day after tomorrow, next week, next month, in two days, by Friday</i> (até sexta), <i>until</i> (até, duração), <i>soon, later, ASAP</i>.</p><p><b>by × until</b>: <i>Send it by Friday</i> (prazo) × <i>I'm here until 6</i> (até, duração contínua).</p>
<h4>Resumo do futuro</h4><table><tr><th>Forma</th><th>Uso</th></tr><tr><td>will</td><td>decisão, promessa</td></tr><tr><td>going to</td><td>plano, evidência</td></tr><tr><td>present continuous</td><td>compromisso agendado</td></tr><tr><td>simple present</td><td>horário fixo</td></tr></table>`,
["Continuous para compromissos agendados","Simple present para horários","by = prazo; until = duração","4 formas de futuro"],
`"I'm visiting the Joinville branch on Thursday. The bus leaves at 7, so I need the report by Wednesday."`,
`Descreva sua agenda da próxima semana usando as 4 formas de futuro.`,
[["'Envie até sexta' (prazo) é:",["Send it until Friday.","Send it by Friday.","Send it in Friday.","Send it at Friday."],1,"By indica prazo."],["Compromisso agendado:",["I meet the client tomorrow at 10, maybe.","I'm meeting the client tomorrow at 10.","I met the client tomorrow.","I will meeting."],1,"Present continuous para agenda."]]),
L("Marcando, confirmando e remarcando",`<h4>Sugerir</h4><p><i>Are you free on Monday? How about Tuesday at 3? Would Thursday work for you? Shall we meet at 10?</i></p>
<h4>Aceitar e recusar</h4><p><i>Monday works for me. That's fine. / I'm afraid I can't on Monday. I'm busy all day.</i></p>
<h4>Remarcar</h4><p><i>Something came up. Could we reschedule? Can we move the meeting to Friday? Sorry for the short notice.</i></p>
<h4>Confirmar</h4><p><i>Just to confirm, we're meeting on Tuesday at 3 p.m. at your office. / See you then.</i></p>
<h4>Coletas e entregas</h4><table><tr><th>Português</th><th>Inglês</th></tr><tr><td>agendar coleta</td><td>schedule a pickup</td></tr><tr><td>janela de entrega</td><td>delivery window</td></tr><tr><td>reagendar</td><td>reschedule</td></tr><tr><td>destinatário ausente</td><td>consignee not available</td></tr></table>`,

`"Could we reschedule the pickup to Thursday? The truck is full on Wednesday. Just to confirm, the delivery window is 8 to 12."`,
`Escreva 3 e-mails curtos: marcar, remarcar e confirmar uma reunião ou coleta.`,
[["'Something came up' significa:",["Algo subiu","Surgiu um imprevisto","Algo chegou","Deu certo"],1,"Expressão para imprevistos."],["Forma educada de recusar:",["No.","I'm afraid I can't on Monday.","Impossible.","Never Monday."],1,"I'm afraid suaviza."]])]},
{n:"Work Vocabulary",o:"Dominar o vocabulário do trabalho em logística e descrever a empresa.",a:[

L("Cargos, setores e empresa",`<h4>Cargos</h4><p><i>CEO, director, manager, supervisor, coordinator, analyst, assistant, clerk, driver, warehouse worker, dock worker, dispatcher, sales representative, customer service agent</i>.</p>

L("Falando do seu trabalho",`<h4>Estrutura de 1 minuto</h4><ol><li>Cargo e empresa: <i>I'm a quality and systems analyst at a freight company.</i></li><li>Responsabilidades: <i>I'm responsible for the quality management system and I build dashboards.</i></li><li>Rotina: <i>I usually analyze data, support the branches and prepare reports.</i></li><li>Projeto atual: <i>Right now I'm working on an AI control tower.</i></li><li>O que gosta: <i>What I like most is solving problems with data.</i></li></ol>

{n:"Describing Things",o:"Descrever, comparar e localizar coisas e pessoas.",a:[
L("Adjetivos, comparativos e superlativos",`<h4>Adjetivos</h4><p>Vêm antes do substantivo e não têm plural: <i>a big truck, two big trucks</i>.</p>
<h4>Comparativos e superlativos</h4><table><tr><th>Tipo</th><th>Comparativo</th><th>Superlativo</th></tr><tr><td>curto</td><td>fast → faster than</td><td>the fastest</td></tr><tr><td>terminado em e</td><td>large → larger</td><td>the largest</td></tr><tr><td>consoante+vogal+consoante</td><td>big → bigger</td><td>the biggest</td></tr><tr><td>terminado em y</td><td>busy → busier</td><td>the busiest</td></tr><tr><td>longo</td><td>more efficient than</td><td>the most efficient</td></tr><tr><td>irregular</td><td>good → better / bad → worse / far → further</td><td>the best / the worst / the furthest</td></tr></table>
<h4>Outras comparações</h4><p><i>as fast as</i> (tão rápido quanto), <i>not as expensive as</i>, <i>much cheaper</i> (muito mais barato), <i>a bit slower</i>.</p>`,
["Adjetivo antes do substantivo, sem plural","-er/-est para curtos; more/most para longos","good/better/best, bad/worse/worst","as … as / much / a bit"],
`"Route A is shorter than route B, but route B is safer. The most efficient option is the night route."`,
`Compare 3 rotas ou 3 fornecedores em 10 frases.`,
[["Comparativo de 'good':",["gooder","better","more good","best"],1,"Irregular."],["Complete: This is ___ route.",["the most short","the shortest","shorter","most short"],1,"Short é curto: the shortest."]]),
L("Preposições de lugar e movimento",`<h4>Lugar</h4><table><tr><th>Preposição</th><th>Uso</th><th>Exemplo</th></tr><tr><td>in</td><td>dentro, cidade, país</td><td>in the warehouse, in Blumenau</td></tr><tr><td>on</td><td>superfície, rua</td><td>on the pallet, on Main Street</td></tr><tr><td>at</td><td>ponto, endereço exato</td><td>at the dock, at 123 Main Street</td></tr><tr><td>next to / beside</td><td>ao lado</td><td>next to the office</td></tr><tr><td>between</td><td>entre</td><td>between dock 2 and 3</td></tr><tr><td>in front of / behind</td><td>na frente / atrás</td><td>behind the building</td></tr><tr><td>opposite</td><td>em frente (do outro lado)</td><td>opposite the gas station</td></tr></table>
<h4>Movimento</h4><p><i>to</i> (para), <i>from</i> (de), <i>into</i> (para dentro), <i>out of</i>, <i>through</i> (através), <i>along</i> (ao longo), <i>across</i> (atravessando).</p>
<h4>Direções</h4><p><i>Go straight ahead. Turn left/right. Take the second exit. It's on your left.</i></p>`,
["in = dentro; on = superfície; at = ponto","next to, between, behind, opposite","to, from, into, through","Turn left, go straight ahead"],
`"The forklift is at dock 3, between the two trucks. Put the boxes on the pallet and move it into the warehouse."`,
`Descreva o layout da sua unidade em 10 frases e dê direções de como chegar até ela.`,
[["Complete: The truck is ___ the dock.",["in","at","on","into"],1,"Ponto específico: at."],["Complete: Put it ___ the pallet.",["in","on","at","to"],1,"Superfície: on."]]),
L("Contáveis e incontáveis: some, any, much, many",`<h4>Contáveis × incontáveis</h4><p>Contáveis têm plural: <i>a box, two boxes</i>. Incontáveis não: <i>information, equipment, freight, furniture, advice, money, traffic, feedback, software, luggage</i>. Nunca "informations".</p><p>Para contar incontáveis: <i>a piece of information, a piece of advice</i>.</p>
<h4>Quantificadores</h4><table><tr><th></th><th>Contáveis</th><th>Incontáveis</th></tr><tr><td>muito</td><td>many</td><td>much</td></tr><tr><td>pouco</td><td>a few / few</td><td>a little / little</td></tr><tr><td>quanto?</td><td>How many?</td><td>How much?</td></tr><tr><td>muito (afirmativa)</td><td colspan="2">a lot of / lots of</td></tr></table>
<h4>Some e any</h4><p><i>some</i> em afirmativas e ofertas (<i>Would you like some coffee?</i>); <i>any</i> em negativas e perguntas (<i>Do we have any pallets? We don't have any.</i>).</p>`,
["information, equipment, freight, advice: incontáveis","many/few para contáveis; much/little para incontáveis","a lot of serve para os dois","some afirmativa; any negativa e pergunta"],
`"How many trucks do we have today? Only a few. And how much freight is waiting? A lot."`,
`Escreva 12 frases sobre a operação com many, much, a few, a little, some e any.`,
[["Qual é incontável?",["truck","information","box","driver"],1,"Information não tem plural."],["Complete: How ___ money?",["many","much","few","lot"],1,"Money é incontável."]])]},
{n:"Modal Verbs",o:"Expressar habilidade, permissão, conselho, obrigação e possibilidade.",a:[
L("Can e could",`<h4>Can</h4><ul><li>Habilidade: <i>I can drive a truck.</i></li><li>Possibilidade: <i>We can deliver tomorrow.</i></li><li>Permissão informal: <i>Can I use your computer?</i></li></ul><p>Negativa: <i>can't</i>. Depois de modal, verbo base sem to: <i>can speak</i> (não "can to speak" nem "can speaks").</p>
<h4>Could</h4><ul><li>Passado de can: <i>I couldn't find the invoice.</i></li><li>Pedido educado: <i>Could you send me the file?</i></li><li>Sugestão: <i>We could try another route.</i></li></ul>
<h4>Be able to</h4><p>Para tempos que can não tem: <i>I will be able to finish it tomorrow. I have been able to reduce delays.</i></p>`,
["can + verbo base","could: passado, pedido educado, sugestão","can't / couldn't","be able to para outros tempos"],
`"Could you help me? I can't open the system. Maybe we could restart it."`,
`Escreva 5 coisas que você sabe fazer, 5 pedidos com could e 3 sugestões com could.`,
[["Qual está correta?",["She can speaks English.","She can speak English.","She cans speak.","She can to speak."],1,"Modal + verbo base."],["Pedido mais educado:",["Send me the file.","Could you send me the file?","You send file.","Can send?"],1,"Could é mais polido."]]),
L("Should, must e have to",`<h4>Should</h4><p>Conselho e recomendação: <i>You should check the address before leaving. You shouldn't stack these boxes.</i></p>
<h4>Must e have to</h4><table><tr><th>Forma</th><th>Uso</th><th>Exemplo</th></tr><tr><td>must</td><td>obrigação forte, regra escrita, opinião do falante</td><td>Drivers must wear seat belts.</td></tr><tr><td>have to</td><td>obrigação externa, rotina</td><td>I have to send the report every Monday.</td></tr><tr><td>mustn't</td><td>proibição</td><td>You mustn't smoke near the fuel pump.</td></tr><tr><td>don't have to</td><td>não é necessário</td><td>You don't have to come on Saturday.</td></tr></table><p>Atenção à diferença entre <i>mustn't</i> (proibido) e <i>don't have to</i> (não precisa).</p>
<h4>Passado</h4><p>Must e have to no passado: <i>had to</i>: <i>We had to cancel the delivery.</i></p>`,
["should = conselho","must = obrigação forte/regra","mustn't = proibido; don't have to = não precisa","had to = passado"],
`"All visitors must wear a vest. You don't have to sign this form, but you should read the safety rules."`,
`Escreva 8 regras de segurança do armazém com must, mustn't, should e don't have to.`,
[["'You mustn't smoke here' significa:",["Não precisa fumar","É proibido fumar aqui","Você deveria fumar","Talvez fume"],1,"Proibição."],["Passado de have to:",["haved to","had to","has to","must"],1,"Had to."]]),
L("May, might e pedidos educados",`<h4>Possibilidade</h4><p><i>may</i> e <i>might</i> (talvez): <i>The truck might be late because of the rain. It may rain tomorrow.</i> Might soa um pouco menos provável.</p>
<h4>Permissão formal</h4><p><i>May I come in? May I ask a question?</i></p>
<h4>Escala de educação</h4><table><tr><th>Mais direto</th><th>→</th><th>Mais educado</th></tr><tr><td>Send it.</td><td>Can you send it?</td><td>Could you send it, please?</td></tr><tr><td></td><td>Would you send it?</td><td>Would you mind sending it?</td></tr><tr><td></td><td></td><td>I was wondering if you could send it.</td></tr></table><p><i>Would you mind</i> + verbo-ing. Resposta para aceitar: <i>No, not at all</i> (não me importo).</p>
<h4>Ofertas</h4><p><i>Would you like some help? Shall I call the customer? Do you want me to check?</i></p>`,
["may / might = talvez","May I…? é formal","Would you mind + -ing","Would you like…? Shall I…?"],
`"I was wondering if you could send me the tracking report. Shall I call the customer while you check?"`,
`Reescreva 8 pedidos diretos de forma educada usando níveis diferentes.`,
[["Complete: Would you mind ___ the door?",["close","closing","to close","closed"],1,"Mind + -ing."],["'It might rain' expressa:",["Certeza","Possibilidade","Obrigação","Proibição"],1,"Possibilidade."]])]},
{n:"Listening and Pronunciation",o:"Treinar o ouvido e falar com mais clareza.",a:[
L("Como treinar o listening",`<h4>Por que é difícil</h4><p>Na fala real, palavras se juntam, sílabas fracas quase somem e o ritmo é rápido. Ninguém entende 100% no início, e isso é normal.</p>
<h4>Técnica das 3 escutas</h4><ol><li>Ouça sem legenda: qual é a ideia geral?</li><li>Ouça com legenda/transcrição em inglês: o que você não pegou?</li><li>Ouça de novo sem legenda: perceba o quanto melhorou.</li></ol>
<h4>Shadowing</h4><p>Repita o áudio logo atrás, imitando ritmo e entonação. Treina ouvido e pronúncia ao mesmo tempo. Comece com 1 minuto e frases curtas.</p>
<h4>Escolhendo o material</h4><table><tr><th>Nível</th><th>Material</th></tr><tr><td>A1–A2</td><td>BBC Learning English, ESL Pod, vídeos para estudantes</td></tr><tr><td>B1</td><td>6 Minute English, séries que você já viu, YouTube de interesse</td></tr><tr><td>B1+–B2</td><td>TED, podcasts de negócios, palestras técnicas</td></tr></table><p>Regra: entenda pelo menos 60–70%. Muito difícil desanima; fácil demais não ensina.</p>`,
["Não entender tudo é normal","3 escutas: geral, com transcrição, de novo","Shadowing treina ouvido e fala","Material com 60–70% de compreensão"],
`Rotina no caminho do trabalho: um episódio de 6 Minute English, anotando 3 expressões para o Anki.`,
`Faça as 3 escutas com um episódio de 6 Minute English e anote 5 expressões novas.`,
[["Shadowing é:",["Ler legendas em português","Repetir o áudio logo atrás, imitando","Traduzir palavra por palavra","Ouvir em 2x"],1,"Imitar ritmo e entonação."],["O material ideal permite entender cerca de:",["10%","60–70%","100%","0%"],1,"Desafio na medida certa."]]),
L("Sons difíceis para brasileiros",`<h4>Os principais</h4><table><tr><th>Som</th><th>Como fazer</th><th>Exemplos</th></tr><tr><td>TH surdo</td><td>ponta da língua entre os dentes, sopro</td><td>think, three, thanks</td></tr><tr><td>TH sonoro</td><td>mesma posição, com voz</td><td>the, this, they</td></tr><tr><td>H</td><td>aspirado, como um suspiro (não é R)</td><td>house, hotel, help</td></tr><tr><td>R</td><td>língua para trás, sem tocar o céu da boca</td><td>red, report, truck</td></tr><tr><td>i curto × i longo</td><td>ship × sheep, live × leave</td><td>it × eat</td></tr><tr><td>Final sem "i"</td><td>não acrescente vogal</td><td>stop (não "stópi"), dock, check</td></tr><tr><td>-ed</td><td>/t/, /d/, /ɪd/</td><td>worked, called, started</td></tr></table>
<h4>Palavras que brasileiros erram muito</h4><p><i>comfortable</i> (CÂMF-tâ-bou), <i>vegetable</i>, <i>schedule</i> (SKÉ-djul nos EUA), <i>develop</i> (di-VÉ-lop), <i>event</i> (i-VENT), <i>hotel</i> (rou-TÉL), <i>chocolate</i>.</p>
<h4>Ferramentas</h4><p>Cambridge Dictionary (áudio britânico e americano) e YouGlish (a palavra em vídeos reais).</p>`,
["TH com a língua entre os dentes","H aspirado; R sem tocar o céu da boca","ship × sheep","Não acrescente 'i' no final"],
`Diga devagar e depois rápido: "Three thousand trucks think the third route is better."`,
`Grave-se lendo 20 palavras desta aula e compare com o Cambridge Dictionary.`,
[["Como se pronuncia o 'h' de 'help'?",["Como R","Aspirado, como um suspiro","Mudo","Como F"],1,"H inglês é aspirado."],["Qual par diferencia i curto e longo?",["ship / sheep","think / sink","work / walk","truck / track"],0,"Ship (curto) × sheep (longo)."]]),
L("Fala conectada e entonação",`<h4>Fala conectada</h4><p>Palavras se ligam: <i>pick it up</i> soa "pi-ki-tâp"; <i>what do you</i> soa "uádâiu"; <i>going to</i> vira "gonna" e <i>want to</i> vira "wanna" na fala informal.</p>
<h4>Formas fracas</h4><p>Palavras gramaticais perdem força: <i>to</i> (tâ), <i>for</i> (fâr), <i>and</i> (ân), <i>can</i> (kân) na afirmativa, mas <i>can't</i> é forte. Por isso "I can go" e "I can't go" se distinguem pela força, não só pelo t.</p>
<h4>Acento da frase</h4><p>Palavras de conteúdo (substantivos, verbos, adjetivos) são fortes: <i>I NEED the REPORT by FRIDAY.</i> Mudar o acento muda o sentido: <i>I didn't SAY he was late</i> (eu não disse) × <i>I didn't say HE was late</i> (disse que outro estava).</p>
<h4>Entonação</h4><p>Perguntas de sim/não sobem no fim (<i>Are you ready?↗</i>); perguntas com wh- descem (<i>Where do you work?↘</i>).</p>`,
["Palavras se ligam na fala","gonna, wanna na fala informal","Formas fracas de to, for, and, can","Acento nas palavras de conteúdo"],
`"I can (kân) deliver on Monday, but I can't (KÉNT) deliver on Tuesday."`,
`Escolha 1 minuto de um vídeo, transcreva e marque as ligações e as palavras fortes; depois faça shadowing.`,
[["'Gonna' é a forma falada de:",["go to","going to","got to","gone"],1,"Going to na fala informal."],["Pergunta de sim/não costuma ter entonação:",["Descendo","Subindo no fim","Plana","Sem regra"],1,"Sobe no final."]])]},
{n:"Present Perfect",o:"Falar de experiências e de ações com ligação ao presente.",a:[
L("Forma e usos do present perfect",`<h4>Forma</h4><p>have/has + particípio passado: <i>I have worked, she has sent, they have gone</i>. Contrações: <i>I've, she's, we've</i>. Negativa: <i>haven't, hasn't</i>. Pergunta: <i>Have you…?</i></p>
<h4>Particípios irregulares úteis</h4><p>be → been, do → done, go → gone, see → seen, take → taken, write → written, send → sent, make → made, give → given, know → known, speak → spoken, eat → eaten.</p>
<h4>Usos</h4><ul><li>Experiências (sem data): <i>I've been to Argentina. Have you ever worked with SAP?</i></li><li>Ação recente com efeito agora: <i>The truck has arrived</i> (está aqui).</li><li>Situação que continua: <i>I've worked here for five years</i> (e ainda trabalho).</li></ul>
<h4>Ever e never</h4><p><i>Have you ever been to the US? No, I've never been there.</i></p>`,
["have/has + particípio","Experiências sem data","Ação recente com efeito presente","ever / never"],
`"Have you ever had a cargo claim? Yes, we have had a few this year."`,
`Escreva 10 frases sobre suas experiências profissionais com present perfect.`,
[["Particípio de 'write':",["wrote","written","writed","write"],1,"Write → wrote → written."],["Complete: She ___ never been to Europe.",["have","has","is","did"],1,"She usa has."]]),
L("For, since, already, yet, just",`<h4>For × since</h4><p><b>for</b> + período: <i>for three years, for two hours</i>. <b>since</b> + ponto de início: <i>since 2020, since Monday, since I was a child</i>. <i>How long have you worked here?</i></p>
<h4>Already, yet, just</h4><table><tr><th>Palavra</th><th>Uso</th><th>Exemplo</th></tr><tr><td>already</td><td>já (afirmativa)</td><td>I've already sent it.</td></tr><tr><td>yet</td><td>já (pergunta) / ainda (negativa), no fim</td><td>Have you sent it yet? I haven't sent it yet.</td></tr><tr><td>just</td><td>acabou de</td><td>The truck has just left.</td></tr><tr><td>still</td><td>ainda (situação que continua)</td><td>I still haven't received it.</td></tr></table>
<h4>Present perfect continuous</h4><p>have been + -ing para ação que vem acontecendo até agora: <i>I've been studying English since November. We've been waiting for an hour.</i></p>`,
["for + período; since + início","already, yet, just, still","yet no fim da frase","have been + -ing para ação contínua"],
`"Have you received the POD yet? Not yet, I've been waiting since Monday. The driver has just called."`,
`Responda 10 perguntas sobre tarefas da semana usando already, yet, just e still.`,
[["Complete: I've lived here ___ 2019.",["for","since","ago","yet"],1,"Since + ponto inicial."],["'The truck has just left' significa:",["O caminhão vai sair","O caminhão acabou de sair","O caminhão ainda não saiu","O caminhão saiu ontem"],1,"Just = acabou de."]]),
L("Present perfect × simple past",`<h4>A diferença</h4><table><tr><th>Simple past</th><th>Present perfect</th></tr><tr><td>momento definido e terminado</td><td>sem momento definido ou ligado ao agora</td></tr><tr><td>I sent it yesterday.</td><td>I've sent it.</td></tr><tr><td>I worked there in 2019.</td><td>I've worked here since 2019.</td></tr><tr><td>Did you see the email this morning? (manhã já passou)</td><td>Have you seen the email today? (hoje ainda não acabou)</td></tr></table>
<h4>Palavras-chave</h4><p>Simple past: <i>yesterday, last week, ago, in 2020, when</i>. Present perfect: <i>ever, never, already, yet, just, since, for (até agora), so far, recently</i>.</p>
<h4>Conversa típica</h4><p><i>Have you ever had a problem with this customer? (perfect) Yes, we have. Last month they complained about a delay. (past) What happened? (past)</i> A conversa começa no perfect e passa para o past quando entra o detalhe.</p>`,
["Past = momento definido","Perfect = sem data ou até agora","Com yesterday/ago use sempre past","Comece no perfect e detalhe no past"],
`"We've reduced delays by 15% this year. In June, we changed the loading schedule."`,
`Corrija 10 frases misturando os dois tempos e escreva um parágrafo começando no perfect e detalhando no past.`,
[["Qual está correta?",["I have sent it yesterday.","I sent it yesterday.","I have send it yesterday.","I did sent it."],1,"Com yesterday: simple past."],["Complete: ___ you ever been to Chile?",["Did","Have","Were","Do"],1,"Experiência: present perfect."]])]},
{n:"Conversation Skills",o:"Manter conversas com naturalidade e dar opinião.",a:[
L("Frases prontas para conversar",`<h4>Por que chunks</h4><p>Falantes fluentes não montam cada frase do zero: usam blocos prontos. Decorar 50 deles acelera muito a fluência.</p>
<table><tr><th>Função</th><th>Frases</th></tr><tr><td>Começar</td><td>So, … / Well, … / Actually, …</td></tr><tr><td>Ganhar tempo</td><td>Let me think… / That's a good question. / How can I put it…</td></tr><tr><td>Pedir repetição</td><td>Sorry, could you say that again? / What do you mean by…?</td></tr><tr><td>Verificar</td><td>Do you know what I mean? / Does that make sense?</td></tr><tr><td>Explicar de novo</td><td>What I mean is… / In other words…</td></tr><tr><td>Concordar</td><td>Exactly. / I agree. / That's true.</td></tr><tr><td>Surpresa/interesse</td><td>Really? / That's interesting. / No way!</td></tr><tr><td>Mudar de assunto</td><td>By the way… / Speaking of…</td></tr></table>
<h4>Quando faltar a palavra</h4><p>Explique: <i>It's a kind of… / It's something you use to… / It's like…</i>. Nunca trave: contorne.</p>`,

L("Small talk",`<h4>O que é</h4><p>Conversa leve antes de reuniões e calls. Cria conexão e é esperada em ambientes internacionais.</p>
<h4>Temas seguros</h4><p>Fim de semana, clima, viagem, trabalho em geral, esportes, comida, cidade. Evite política, religião, salário e assuntos pessoais delicados.</p>
<h4>Fórmula: responder + detalhar + devolver</h4><p><i>How was your weekend? — Pretty good, thanks. I went hiking with my girlfriend. How about you?</i></p>
<table><tr><th>Pergunta</th><th>Resposta natural</th></tr><tr><td>How's it going?</td><td>Not bad. Busy week, though. And you?</td></tr><tr><td>How's the weather there?</td><td>It's really hot today, around 35 degrees.</td></tr><tr><td>Any plans for the weekend?</td><td>Nothing special, just relaxing.</td></tr><tr><td>How long have you been with the company?</td><td>About six years now.</td></tr></table>
<h4>Encerrando</h4><p><i>Well, shall we get started? / It was nice talking to you. / Let's catch up later.</i></p>`,
["Temas seguros: clima, fim de semana, viagem","Responder + detalhar + devolver","Evite política, religião e salário","Shall we get started? para encerrar"],
`"How's it going? — Pretty busy, it's our peak season. We're delivering a lot for Black Friday. How about you?"`,

L("Dando e pedindo opinião",`<h4>Dar opinião</h4><p><i>I think… / In my opinion… / From my point of view… / I believe… / It seems to me that… / Personally, I…</i></p>
<h4>Pedir opinião</h4><p><i>What do you think about…? How do you feel about…? What's your view on…?</i></p>
<h4>Concordar e discordar</h4><table><tr><th>Concordar</th><th>Discordar com educação</th></tr><tr><td>I totally agree.</td><td>I see your point, but…</td></tr><tr><td>That's a good point.</td><td>I'm not so sure about that.</td></tr><tr><td>You're right.</td><td>I see it a bit differently.</td></tr><tr><td>Exactly.</td><td>That's true, however…</td></tr></table>
<h4>Justificar</h4><p><i>because…, since…, the main reason is…, for example…</i>. Uma opinião sem motivo soa fraca.</p>`,

{n:"Phrasal Verbs and Collocations",o:"Soar natural com as combinações mais usadas.",a:[
L("Phrasal verbs de trabalho",`<h4>O que são</h4><p>Verbo + partícula com significado próprio. Muito comuns na fala e em e-mails.</p>
<table><tr><th>Phrasal verb</th><th>Significado</th><th>Exemplo</th></tr><tr><td>pick up</td><td>coletar, buscar</td><td>We'll pick up the cargo at 9.</td></tr><tr><td>drop off</td><td>deixar, entregar</td><td>He dropped off the boxes.</td></tr><tr><td>follow up</td><td>acompanhar, dar retorno</td><td>I'll follow up on this tomorrow.</td></tr><tr><td>set up</td><td>configurar, organizar</td><td>Let's set up a meeting.</td></tr><tr><td>figure out</td><td>descobrir, entender</td><td>We need to figure out the cause.</td></tr><tr><td>look into</td><td>investigar</td><td>I'll look into the complaint.</td></tr><tr><td>carry out</td><td>realizar</td><td>We carried out the audit.</td></tr><tr><td>run out of</td><td>ficar sem</td><td>We ran out of pallets.</td></tr><tr><td>fill in / out</td><td>preencher</td><td>Please fill in the form.</td></tr><tr><td>check in / out</td><td>registrar entrada/saída</td><td>Drivers check in at the gate.</td></tr></table>
<h4>Separáveis</h4><p>Alguns aceitam objeto no meio: <i>pick the cargo up / pick it up</i> (com pronome, sempre no meio: não "pick up it").</p>`,
["Aprenda sempre em frase","pick up, drop off, follow up, look into","Pronome vai no meio: pick it up","Revise no Anki com a frase inteira"],

L("Mais phrasal verbs essenciais",`<table><tr><th>Phrasal verb</th><th>Significado</th><th>Exemplo</th></tr><tr><td>get back to</td><td>retornar a alguém</td><td>I'll get back to you by Friday.</td></tr><tr><td>put off</td><td>adiar</td><td>They put off the meeting.</td></tr><tr><td>call off</td><td>cancelar</td><td>The event was called off.</td></tr><tr><td>come up with</td><td>ter uma ideia, propor</td><td>She came up with a great solution.</td></tr><tr><td>deal with</td><td>lidar com</td><td>I deal with complaints.</td></tr><tr><td>sort out</td><td>resolver</td><td>We sorted out the problem.</td></tr><tr><td>go over</td><td>revisar</td><td>Let's go over the numbers.</td></tr><tr><td>point out</td><td>apontar, destacar</td><td>The auditor pointed out two issues.</td></tr><tr><td>break down</td><td>quebrar (máquina) / detalhar</td><td>The truck broke down. / Break down the costs.</td></tr><tr><td>take over</td><td>assumir</td><td>He took over the project.</td></tr><tr><td>catch up</td><td>colocar em dia</td><td>Let's catch up next week.</td></tr><tr><td>turn down</td><td>recusar</td><td>They turned down our offer.</td></tr></table>
<h4>Dica</h4><p>Em e-mails formais há equivalentes: <i>postpone</i> (put off), <i>cancel</i> (call off), <i>investigate</i> (look into), <i>review</i> (go over). Saber os dois registros ajuda.</p>`,

L("Collocations e expressões",`<h4>Make × do</h4><table><tr><th>make</th><th>do</th></tr><tr><td>a decision, a mistake, a call, progress, an effort, money, a plan, an appointment, sure</td><td>business, a job, research, homework, your best, a favor, an audit (ou carry out), the dishes</td></tr></table>
<h4>Outras collocations de trabalho</h4><p><i>take a break, take notes, take responsibility, take action, pay attention, meet a deadline, miss a deadline, reach a target, run a meeting, raise an issue, give feedback, solve a problem</i>.</p>
<h4>Expressões comuns</h4><table><tr><th>Expressão</th><th>Significado</th></tr><tr><td>It's up to you.</td><td>Você decide.</td></tr><tr><td>We're on the same page.</td><td>Estamos alinhados.</td></tr><tr><td>Keep me posted.</td><td>Me mantenha informado.</td></tr><tr><td>ASAP</td><td>o mais rápido possível</td></tr><tr><td>No worries.</td><td>Sem problemas.</td></tr><tr><td>Touch base</td><td>conversar rapidamente</td></tr><tr><td>Heads up</td><td>aviso antecipado</td></tr></table>`,
