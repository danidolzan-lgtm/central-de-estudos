L("Histograma, dispersão, GUT e 5W2H",`<h4>Histograma</h4><p>Mostra a distribuição de uma variável: quantas vezes cada faixa de valor aparece. Revela se os dados são simétricos, se têm dois picos (duas populações misturadas, como dois turnos diferentes) ou se estão fora da especificação.</p>
<h4>Diagrama de dispersão</h4><p>Cruza duas variáveis para ver se há relação: distância × prazo, peso × tempo de descarga, idade do veículo × custo de manutenção. Relação forte não prova causa, mas indica onde investigar.</p>
<h4>Matriz GUT</h4><p>Prioriza problemas com notas de 1 a 5:</p>
<table><tr><th>Nota</th><th>Gravidade</th><th>Urgência</th><th>Tendência</th></tr>
<tr><td>5</td><td>extremamente grave</td><td>ação imediata</td><td>piora rápido</td></tr><tr><td>3</td><td>grave</td><td>o quanto antes</td><td>piora a médio prazo</td></tr>
<tr><td>1</td><td>sem gravidade</td><td>pode esperar</td><td>não piora</td></tr></table>
<p>Prioridade = G × U × T. Uma variação útil é a matriz <b>esforço × impacto</b>: comece pelo alto impacto e baixo esforço.</p>
<h4>5W2H</h4><p>Transforma decisão em plano: <b>What</b> (o quê), <b>Why</b> (por quê), <b>Where</b> (onde), <b>When</b> (quando), <b>Who</b> (quem), <b>How</b> (como), <b>How much</b> (quanto custa). Toda linha precisa de um nome e uma data. Acompanhe o plano em reunião periódica até concluir.</p>`,
["Histograma mostra a distribuição dos dados","Dispersão mostra relação entre duas variáveis","GUT: prioridade = G × U × T","5W2H: toda ação com dono, prazo e custo"],
`Um histograma do tempo de descarga mostrou dois picos: 30 min no turno da manhã e 55 min à tarde. A causa estava na escala: menos ajudantes à tarde.`,
`Priorize 5 problemas da sua área com a GUT e monte o 5W2H do primeiro colocado.`,
[["Um histograma com dois picos pode indicar:",["Processo perfeito","Duas populações misturadas","Erro de digitação sempre","Falta de dados"],1,"Dois picos sugerem duas origens diferentes, como turnos."],["Na GUT, a prioridade é:",["G+U+T","G×U×T","Só G","Média"],1,"Multiplica-se as três notas."]])]},
{n:"Análise e Solução de Problemas",o:"Resolver problemas pela causa raiz e garantir que não voltem.",a:[
L("PDCA e MASP",`<h4>PDCA</h4><p><b>Plan</b>: identificar o problema, analisar causas e planejar ações. <b>Do</b>: executar, treinar. <b>Check</b>: verificar se o resultado foi atingido. <b>Act</b>: padronizar se deu certo, ou voltar ao Plan se não deu. Há também o <b>SDCA</b> (Standard, Do, Check, Act), que mantém o padrão no dia a dia. O PDCA melhora; o SDCA sustenta.</p>
<h4>MASP em 8 etapas</h4>
<table><tr><th>PDCA</th><th>Etapa</th><th>Ferramentas</th></tr>
<tr><td>P</td><td>1 Identificação do problema</td><td>dados históricos, Pareto</td></tr><tr><td>P</td><td>2 Observação</td><td>estratificação, ida ao local</td></tr>
<tr><td>P</td><td>3 Análise das causas</td><td>Ishikawa, 5 porquês, dados</td></tr><tr><td>P</td><td>4 Plano de ação</td><td>5W2H</td></tr>
<tr><td>D</td><td>5 Ação</td><td>treinamento, execução</td></tr><tr><td>C</td><td>6 Verificação</td><td>comparação antes/depois</td></tr>
<tr><td>A</td><td>7 Padronização</td><td>IT, treinamento, poka-yoke</td></tr><tr><td>A</td><td>8 Conclusão</td><td>lições aprendidas</td></tr></table>
<h4>Como definir bem o problema</h4><p>Problema é a diferença entre o resultado atual e a meta, com números: "atraso de entregas na rota X subiu de 4% para 11% entre jul e set". Evite problemas vagos ("comunicação ruim") ou que já trazem a solução ("falta de um sistema novo").</p>
<h4>Gemba</h4><p>Vá ao local onde o trabalho acontece. Observe, pergunte, veja os dados reais. Muitos problemas são resolvidos errado porque a análise foi feita só na sala de reunião.</p>`,
["PDCA melhora; SDCA mantém o padrão","MASP: 8 etapas dentro do PDCA","Problema = diferença entre atual e meta, com números","Vá ao gemba antes de concluir"],
`Problema: avarias subiram de 1,2 para 2,1 por mil volumes. Observação: 70% na doca 3, turno da tarde. Causa: falta de padrão de amarração e catraca gasta. Ação: padrão com fotos, troca das catracas. Verificação: 1,1 após 2 meses. Padronização: IT e treinamento na integração.`,
`Escolha um problema real e escreva as etapas 1 a 4 do MASP com dados.`,
[["Em qual etapa do MASP se compara antes e depois?",["Observação","Verificação","Plano de ação","Conclusão"],1,"A verificação checa se a meta foi atingida."],["Qual é uma boa definição de problema?",["Comunicação ruim","Falta de sistema","Atraso subiu de 4% para 11% de jul a set","O pessoal não colabora"],2,"Problema bem definido tem números e período."]]),
L("Não conformidade e ação corretiva",`<h4>10.2 na ISO 9001</h4><p>Quando ocorre uma não conformidade, a organização deve:</p><ol><li><b>Reagir</b>: tomar ação para controlar e corrigir, e lidar com as consequências.</li><li><b>Avaliar a necessidade de ação</b> para eliminar as causas: analisar a NC, determinar as causas e verificar se existem NCs similares ou se poderiam ocorrer.</li><li><b>Implementar</b> as ações necessárias.</li><li><b>Analisar criticamente a eficácia</b> das ações.</li><li>Atualizar riscos e oportunidades, se necessário.</li><li>Fazer mudanças no SGQ, se necessário.</li></ol><p>E reter informação documentada da natureza da NC, das ações e dos resultados.</p>
<h4>Correção × ação corretiva</h4><table><tr><th></th><th>Correção</th><th>Ação corretiva</th></tr>
<tr><td>Foco</td><td>efeito</td><td>causa</td></tr><tr><td>Exemplo</td><td>reentregar a carga</td><td>corrigir o cadastro de endereços e validar CEP</td></tr><tr><td>Impede repetição?</td><td>não</td><td>sim</td></tr></table>
<h4>Verificação de eficácia</h4><p>Defina antes <b>como</b> e <b>quando</b> vai verificar: "acompanhar 3 meses; eficaz se nenhuma reentrega por erro de cadastro". Fechar a RNC no mesmo dia da ação é sinal de que a eficácia não foi verificada.</p>
<h4>Fontes de NC</h4><p>Reclamações de clientes, auditorias internas e externas, indicadores fora da meta, inspeções, ocorrências operacionais, sugestões dos colaboradores.</p>`,
["Reagir, analisar causa, agir, verificar eficácia","Correção trata o efeito; ação corretiva elimina a causa","Verificar se há NCs similares em outros lugares","Defina antes como verificar a eficácia"],
`RNC: reentrega por endereço errado. Correção: reentregar. Causa: cadastro sem validação de CEP. Ação corretiva: validação automática e revisão dos 200 maiores clientes. Similares: verificar outras unidades. Eficácia: zero reentregas por cadastro em 90 dias.`,
`Revise 3 RNCs antigas: houve análise de causa? A eficácia foi verificada com prazo e critério?`,
[["Reentregar uma carga entregue no endereço errado é:",["Ação corretiva","Correção","Ação preventiva","Melhoria contínua"],1,"Corrige o efeito, mas não a causa."],["Após implementar a ação corretiva, a norma exige:",["Arquivar","Analisar a eficácia","Demitir","Abrir auditoria externa"],1,"A eficácia deve ser analisada criticamente."]]),
L("Relatório A3 e método 8D",`<h4>A3</h4><p>Nasceu na Toyota: uma folha tamanho A3 que conta a história do problema de forma visual. Obriga a pensar com clareza e facilita a conversa com a liderança.</p>
<table><tr><th>Lado esquerdo (entender)</th><th>Lado direito (agir)</th></tr>
<tr><td>1 Contexto: por que importa</td><td>5 Contramedidas</td></tr><tr><td>2 Situação atual com dados e gráfico</td><td>6 Plano de implementação (5W2H)</td></tr>
<tr><td>3 Meta</td><td>7 Acompanhamento e resultados</td></tr><tr><td>4 Análise de causa raiz</td><td>8 Padronização e próximos passos</td></tr></table>
<h4>Método 8D</h4><p>Muito usado em reclamações de clientes, principalmente indústria automotiva:</p>
<ol><li><b>D1</b> Formar a equipe</li><li><b>D2</b> Descrever o problema (5W2H do problema)</li><li><b>D3</b> Ação de contenção imediata</li><li><b>D4</b> Causa raiz (e por que não foi detectado)</li><li><b>D5</b> Escolher ações corretivas permanentes</li><li><b>D6</b> Implementar e validar</li><li><b>D7</b> Prevenir recorrência (padrões, outros processos)</li><li><b>D8</b> Reconhecer a equipe e encerrar</li></ol>
<h4>Quando usar cada um</h4><p>MASP: problemas internos crônicos. 8D: reclamação formal de cliente com prazo de resposta. A3: comunicar qualquer problema ou proposta para a liderança em uma página.</p>
<p>Um diferencial do 8D é a pergunta dupla na causa: <b>por que aconteceu</b> e <b>por que não foi detectado</b> antes de chegar ao cliente.</p>`,
["A3 conta o problema em uma página","8D: 8 disciplinas, com contenção imediata","8D pergunta por que ocorreu e por que não foi detectado","MASP para problemas internos; 8D para reclamações de clientes"],
`Cliente industrial pede resposta formal sobre extravio. D3: localizar a carga e reforçar a conferência daquele cliente. D4: falha de leitura da etiqueta e conferência só por amostragem. D7: leitura 100% para clientes críticos em todas as unidades.`,
`Faça um A3 de um problema da sua unidade e apresente para seu gestor.`,
[["No 8D, a ação imediata para proteger o cliente é o:",["D1","D3","D5","D8"],1,"D3 é a contenção."],["Uma característica do A3 é:",["Ser um relatório de 30 páginas","Caber em uma folha","Dispensar dados","Ser usado só em finanças"],1,"A3 condensa a análise em uma folha."]])]},
{n:"Gestão de Riscos",o:"Identificar, avaliar e tratar riscos com ISO 31000, matriz e FMEA.",a:[
L("Mentalidade de risco e ISO 31000",`<h4>Conceito</h4><p>Risco é o <b>efeito da incerteza sobre os objetivos</b>. O efeito pode ser negativo (ameaça) ou positivo (oportunidade). A ISO 9001 pede mentalidade de risco, sem exigir método específico.</p>
<h4>Processo da ISO 31000</h4><ol><li><b>Escopo, contexto e critérios</b>: o que vamos avaliar e como pontuar.</li><li><b>Identificação</b>: o que pode acontecer, por quê, com que consequência.</li><li><b>Análise</b>: probabilidade e consequência, controles existentes.</li><li><b>Avaliação</b>: comparar com critérios e apetite a risco.</li><li><b>Tratamento</b>: escolher e implementar respostas.</li><li>Em todas as etapas: <b>comunicação, consulta, monitoramento e análise crítica</b>, com registro.</li></ol>
<h4>Matriz de riscos 5×5</h4><table><tr><th>Probabilidade ↓ / Impacto →</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
<tr><td>5 Quase certo</td><td>5</td><td>10</td><td>15</td><td>20</td><td>25</td></tr><tr><td>3 Possível</td><td>3</td><td>6</td><td>9</td><td>12</td><td>15</td></tr><tr><td>1 Raro</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr></table>
<p>Exemplo de critério: até 6 verde (aceitar e monitorar), 8 a 12 amarelo (plano de ação), 15 ou mais vermelho (ação imediata).</p>
<h4>Respostas ao risco</h4><p><b>Evitar</b> (não fazer a atividade), <b>reduzir</b> (controles), <b>transferir/compartilhar</b> (seguro, contrato), <b>aceitar</b> (consciente e monitorado). Para oportunidades: explorar, compartilhar, melhorar, aceitar.</p>`,
["Risco = efeito da incerteza sobre objetivos","ISO 31000: identificar, analisar, avaliar, tratar, monitorar","Matriz probabilidade × impacto com critérios definidos","Evitar, reduzir, transferir, aceitar"],
`Risco: roubo de carga em rota específica. Probabilidade 3, impacto 5 = 15 (vermelho). Tratamento: reduzir (escolta e rastreador) e transferir (seguro RCF-DC). Monitorar ocorrências mensalmente.`,
`Identifique 8 riscos do seu processo, pontue na matriz 5×5 e defina a resposta de cada um.`,
[["Contratar seguro para a carga é uma resposta de:",["Evitar","Transferir","Aceitar","Explorar"],1,"Seguro transfere o impacto financeiro."],["A ISO 9001 exige para riscos:",["FMEA obrigatório","ISO 31000 obrigatória","Mentalidade de risco, sem método fixo","Nada"],2,"A norma não prescreve método."]]),
L("FMEA na prática",`<h4>O que é</h4><p>Análise de Modos e Efeitos de Falha: ferramenta <b>preventiva</b> que estuda como cada etapa de um processo pode falhar antes que a falha aconteça. Existe FMEA de projeto e de processo; em serviços usamos o de processo.</p>
<h4>Colunas</h4><table><tr><th>Etapa</th><th>Modo de falha</th><th>Efeito</th><th>S</th><th>Causa</th><th>O</th><th>Controle atual</th><th>D</th><th>RPN</th></tr>
<tr><td>Emissão do CT-e</td><td>peso digitado errado</td><td>frete a menor</td><td>7</td><td>digitação manual</td><td>5</td><td>conferência por amostragem</td><td>6</td><td>210</td></tr>
<tr><td>Carregamento</td><td>volume em caminhão errado</td><td>atraso e reentrega</td><td>8</td><td>sem leitura de etiqueta</td><td>4</td><td>conferência visual</td><td>5</td><td>160</td></tr></table>
<h4>Escalas</h4><p><b>Severidade</b> (1 imperceptível a 10 perigoso/legal), <b>Ocorrência</b> (1 quase impossível a 10 quase certa), <b>Detecção</b> (1 detecção certa a 10 não detectável). Atenção: na detecção, nota alta é ruim.</p>
<h4>Priorização</h4><p>RPN = S × O × D. Priorize os maiores RPN, mas trate sempre falhas com <b>severidade 9 ou 10</b> (segurança e legislação), mesmo com RPN baixo. As versões mais novas (AIAG-VDA) usam a <b>Prioridade de Ação</b> (alta, média, baixa) em vez do RPN.</p>
<h4>Ações</h4><p>Reduzir ocorrência (eliminar a causa), melhorar detecção (controle automático) ou, raramente, reduzir severidade. Depois recalcule. No exemplo, validação automática do peso contra a NF-e reduz D para 2 → RPN 70.</p>`,
["FMEA é preventivo","RPN = Severidade × Ocorrência × Detecção","Detecção alta = difícil detectar = pior","Severidade 9–10 é tratada sempre"],
`Faça o FMEA com quem executa o processo: o emissor de CT-e sabe onde o erro acontece melhor que qualquer gestor.`,
`Monte um FMEA de 6 etapas do processo de emissão de CT-e ou de carregamento, com ações para os 3 maiores RPN.`,
[["No FMEA, uma nota de detecção 9 significa:",["Detecção quase certa","Falha difícil de detectar","Falha grave","Falha frequente"],1,"Nota alta de detecção é ruim."],["RPN 210 com S=7, O=5 implica D igual a:",["4","5","6","7"],2,"7 × 5 × 6 = 210."]]),
L("Continuidade e gestão de mudanças",`<h4>Gestão de mudanças (6.3 e 8.5.6)</h4><p>Mudanças no SGQ ou nos processos (novo sistema, nova unidade, novo cliente grande, troca de fornecedor) devem ser planejadas considerando: propósito e consequências, integridade do sistema, disponibilidade de recursos, alocação de responsabilidades. Depois, analise o resultado e registre quem autorizou.</p>
<h4>Checklist de mudança</h4><ul><li>O que muda e por quê?</li><li>Quais processos, documentos e pessoas são afetados?</li><li>Quais riscos a mudança cria?</li><li>Precisa de treinamento?</li><li>Como comunicar clientes e equipe?</li><li>Qual o plano de volta se der errado?</li><li>Como saber se deu certo?</li></ul>
<h4>Continuidade de negócios</h4><p>A ISO 22301 trata de sistemas de gestão de continuidade. Mesmo sem certificar, vale aplicar: identificar processos críticos, o tempo máximo que podem ficar parados e planos de contingência para cenários prováveis.</p>
<table><tr><th>Cenário</th><th>Impacto</th><th>Contingência</th></tr>
<tr><td>Queda do sistema de emissão</td><td>sem CT-e, sem saída de carga</td><td>contingência fiscal (DPEC/EPEC), lista de contatos do suporte</td></tr>
<tr><td>Enchente na unidade</td><td>carga e veículos em risco</td><td>plano de remoção, unidade alternativa</td></tr>
<tr><td>Greve de caminhoneiros</td><td>atrasos gerais</td><td>comunicação proativa, priorização de clientes</td></tr></table>
<p>Teste os planos com simulados e atualize após cada ocorrência real.</p>`,
["Mudanças planejadas, com riscos e plano de volta","Processos críticos e tempo máximo de parada","Planos de contingência testados","ISO 22301 para continuidade"],
`Implantação de um novo módulo no sistema de transporte: piloto em uma unidade, treinamento antes, plano de volta ao processo antigo e indicador de erros de emissão na primeira semana.`,
`Escreva um plano de contingência de 1 página para queda do sistema de emissão na sua unidade.`,
[["Um 'plano de volta' em gestão de mudanças serve para:",["Cancelar a empresa","Retornar à situação anterior se a mudança falhar","Demitir responsáveis","Auditar"],1,"É a saída segura caso a mudança dê errado."],["Norma de gestão de continuidade de negócios:",["ISO 22301","ISO 14001","ISO 9004","ISO 17025"],0,"A ISO 22301 trata de continuidade."]])]},
{n:"Estatística Aplicada e CEP",o:"Usar estatística para entender e controlar a variação dos processos.",a:[
L("Estatística descritiva",`<h4>Tendência central</h4><p><b>Média</b>: soma dividida pela quantidade; sensível a valores extremos. <b>Mediana</b>: o valor do meio com os dados ordenados; resistente a extremos. <b>Moda</b>: o valor mais frequente. Em prazos de entrega, a mediana costuma representar melhor o "normal", porque poucos atrasos longos puxam a média.</p>
<h4>Dispersão</h4><p><b>Amplitude</b> = máximo − mínimo. <b>Desvio padrão (σ)</b> = o quanto os valores se afastam da média, em média. <b>Coeficiente de variação</b> = σ / média, útil para comparar processos de escalas diferentes. Dois processos com mesma média e desvios diferentes entregam experiências muito diferentes ao cliente.</p>
<h4>Distribuição normal</h4><p>Muitos processos seguem a curva em forma de sino: cerca de <b>68%</b> dos dados ficam em ±1σ, <b>95%</b> em ±2σ e <b>99,7%</b> em ±3σ da média.</p>
<h4>No Excel</h4><table><tr><th>Medida</th><th>Fórmula</th></tr><tr><td>Média</td><td>=MÉDIA(A2:A31)</td></tr><tr><td>Mediana</td><td>=MED(A2:A31)</td></tr><tr><td>Desvio padrão amostral</td><td>=DESVPAD.A(A2:A31)</td></tr><tr><td>Quartis</td><td>=QUARTIL.INC(A2:A31;1)</td></tr></table>
<h4>Boxplot</h4><p>Mostra mediana, quartis e outliers num só gráfico; ótimo para comparar unidades ou rotas lado a lado.</p>`,
["Média é sensível a extremos; mediana não","Desvio padrão mede a variação","68–95–99,7% em ±1, 2 e 3σ","Boxplot compara grupos rapidamente"],
`Tempo de entrega de duas rotas: ambas com média de 2 dias. Rota A: σ = 0,3. Rota B: σ = 1,1. O cliente da rota B vive incerto, mesmo com a mesma média.`,
`Pegue o tempo de entrega de 30 CT-es, calcule média, mediana, desvio e monte um boxplot por rota.`,
[["Qual medida é menos afetada por valores extremos?",["Média","Mediana","Amplitude","Desvio padrão"],1,"A mediana depende só da posição central."],["Em distribuição normal, ±2σ contém aproximadamente:",["68%","95%","99,7%","50%"],1,"Regra empírica: 95% em ±2σ."]]),
L("Gráficos de controle (CEP)",`<h4>Ideia central</h4><p>Todo processo varia. <b>Causas comuns</b> são a variação natural do sistema; <b>causas especiais</b> são eventos fora do normal (empilhadeira quebrada, chuva forte, falta de motorista). O gráfico de controle separa uma da outra. Reagir a causa comum como se fosse especial (mexer no processo a cada oscilação) piora a variação.</p>
<h4>Limites</h4><p>Linha central = média. <b>LSC e LIC</b> (limites superior e inferior de controle) = média ± 3σ do processo. São calculados com os dados, não com a meta do cliente.</p>
<h4>Qual gráfico usar</h4><table><tr><th>Dado</th><th>Gráfico</th><th>Exemplo</th></tr>
<tr><td>Contínuo, subgrupos</td><td>X-barra e R</td><td>tempo de descarga, 5 por dia</td></tr><tr><td>Contínuo, individual</td><td>I-AM</td><td>custo diário de combustível</td></tr>
<tr><td>Proporção de defeituosos</td><td>p</td><td>% CT-es com erro por dia</td></tr><tr><td>Contagem de defeitos</td><td>c ou u</td><td>avarias por dia</td></tr></table>
<h4>Regras de sinal (Western Electric)</h4><ul><li>1 ponto fora dos limites.</li><li>7 ou mais pontos seguidos do mesmo lado da média.</li><li>6 pontos seguidos subindo ou descendo.</li><li>2 de 3 pontos além de 2σ do mesmo lado.</li></ul>
<h4>Sequência correta</h4><ol><li>Coletar ao menos 20–25 pontos.</li><li>Calcular limites.</li><li>Investigar e eliminar causas especiais.</li><li>Com o processo estável, buscar reduzir a variação comum (mudança no sistema).</li></ol>`,
["Causa comum é do sistema; causa especial é evento atípico","Limites = média ± 3σ, calculados dos dados","Escolha o gráfico pelo tipo de dado","Regras de sinal indicam causa especial"],
`Gráfico p do % de entregas atrasadas por dia: média 4%, LSC 9%. Em um dia de 14%, a investigação mostrou queda do sistema de roteirização. É causa especial: registre e trate.`,
`Monte um gráfico p no Excel com o percentual diário de entregas atrasadas de 30 dias e marque os sinais.`,
[["Sete pontos seguidos acima da média indicam:",["Processo perfeito","Possível causa especial","Erro do gráfico","Nada"],1,"É uma das regras de sinal."],["Os limites de controle vêm:",["Da meta do cliente","Dos dados do próprio processo","Do contrato","Da norma"],1,"Limites de controle são calculados dos dados."]]),
L("Capacidade e amostragem",`<h4>Capacidade de processo</h4><p>Compara a variação do processo com a <b>especificação</b> (o que o cliente aceita). Um processo pode estar sob controle (estável) e mesmo assim não ser capaz (varia mais do que o cliente tolera).</p>
<table><tr><th>Índice</th><th>Fórmula</th><th>Leitura</th></tr>
<tr><td>Cp</td><td>(LSE − LIE) / 6σ</td><td>potencial, ignora centralização</td></tr>
<tr><td>Cpk</td><td>menor de (LSE − média)/3σ e (média − LIE)/3σ</td><td>real, considera centralização</td></tr></table>
<p>Referência: Cpk < 1 incapaz; 1 a 1,33 aceitável com atenção; ≥ 1,33 capaz. Com só um limite (ex.: tempo máximo), calcule o lado que existe.</p>
<p>Exemplo: descarga com média 42 min, σ = 6, limite máximo 60 min. Cpk = (60 − 42) / (3 × 6) = 1,0. Processo no limite: reduza a variação ou a média.</p>
<h4>Amostragem</h4><p>Inspecionar 100% é caro e cansativo (e a atenção cai). Amostragem examina parte dos itens com regras claras. Requisitos: <b>aleatória</b>, <b>representativa</b> (turnos, dias, pessoas) e com tamanho adequado. Normas de referência: ABNT NBR 5426 (planos por atributos).</p>
<h4>Aplicações em serviço</h4><ul><li>Auditar 5% dos CT-es emitidos por dia, sorteados.</li><li>Verificar 10 checklists por semana por unidade.</li><li>Conferir peso de 1 a cada 20 volumes na balança.</li></ul>`,
["Estável não significa capaz","Cpk ≥ 1,33 indica processo capaz","Amostra aleatória e representativa","Inspeção 100% cansa e falha"],
`Ligue a capacidade ao contrato: se o cliente aceita até 48h e seu Cpk é 0,8, você vai descumprir o prazo com frequência, mesmo sem nenhum "problema" no dia a dia.`,
`Calcule o Cpk de um tempo da sua operação com um limite definido e proponha um plano de amostragem para conferir documentos.`,
[["Um processo estável com Cpk 0,7 é:",["Capaz","Estável mas incapaz","Fora de controle","Perfeito"],1,"Estabilidade e capacidade são coisas diferentes."],["Uma boa amostra deve ser:",["Escolhida por conveniência","Aleatória e representativa","Sempre do mesmo turno","A maior possível só"],1,"Aleatoriedade e representatividade evitam vieses."]])]},
{n:"Lean e Six Sigma",o:"Eliminar desperdícios, criar fluxo e reduzir variação com projetos DMAIC.",a:[
L("Lean: valor, desperdícios e 5S",`<h4>Os 5 princípios Lean</h4><ol><li><b>Valor</b>: definido pelo cliente.</li><li><b>Fluxo de valor</b>: todas as etapas para entregar esse valor.</li><li><b>Fluxo contínuo</b>: sem esperas e interrupções.</li><li><b>Produção puxada</b>: produzir quando o cliente pede.</li><li><b>Perfeição</b>: melhoria contínua.</li></ol>
<h4>Os 8 desperdícios em uma transportadora</h4><table><tr><th>Desperdício</th><th>Exemplo</th></tr>
<tr><td>Transporte</td><td>carga que dá voltas no armazém</td></tr><tr><td>Inventário</td><td>carga parada aguardando consolidação</td></tr><tr><td>Movimentação</td><td>conferente andando para buscar leitor</td></tr>
<tr><td>Espera</td><td>caminhão 2h na doca</td></tr><tr><td>Superprocessamento</td><td>três conferências do mesmo volume</td></tr><tr><td>Superprodução</td><td>relatórios que ninguém lê</td></tr>
<tr><td>Defeitos</td><td>avarias, CT-e com erro, reentregas</td></tr><tr><td>Talento não usado</td><td>ninguém pergunta ideias à equipe</td></tr></table>
<h4>5S</h4><p><b>Seiri</b> (utilização): separar o necessário do desnecessário. <b>Seiton</b> (ordenação): um lugar para cada coisa. <b>Seisou</b> (limpeza): limpar e inspecionar. <b>Seiketsu</b> (padronização): padrões visuais. <b>Shitsuke</b> (disciplina): manter com auditorias e hábito.</p>
<h4>Gestão visual</h4><p>Faixas no piso, quadros de status de doca, etiquetas coloridas por destino, quadro de indicadores do turno. A regra: qualquer pessoa deve entender a situação em 5 segundos.</p>`,
["Valor é definido pelo cliente","8 desperdícios, incluindo talento não usado","5S organiza e sustenta o ambiente","Gestão visual: entender em 5 segundos"],
`Etiquetas coloridas por rota e áreas demarcadas no piso por destino reduziram o tempo de separação e os volumes carregados no caminhão errado.`,
`Caminhe pela unidade por 30 minutos e anote um exemplo de cada desperdício. Faça uma auditoria 5S com nota de 1 a 5 por senso.`,
[["Caminhão esperando 2h na doca é desperdício de:",["Transporte","Espera","Defeito","Inventário"],1,"Tempo parado aguardando é espera."],["Qual senso do 5S cria um lugar para cada coisa?",["Seiri","Seiton","Seisou","Shitsuke"],1,"Seiton é ordenação."]]),
L("Fluxo de valor, kaizen e Lean na logística",`<h4>VSM: Mapeamento do Fluxo de Valor</h4><p>Desenho de ponta a ponta do fluxo de materiais e de informações, com dados de cada etapa: tempo de ciclo, tempo de espera, número de pessoas, % de erro. Compare o <b>tempo de agregação de valor</b> com o <b>lead time total</b>. Em logística é comum que menos de 10% do tempo agregue valor; o resto é espera.</p>
<p>Passos: escolha uma família de serviço (ex.: carga fracionada Blumenau → Rio do Sul), desenhe o estado atual andando pelo processo, calcule os tempos, desenhe o estado futuro e um plano para chegar lá.</p>
<h4>Fluxo puxado e kanban</h4><p>Cada etapa trabalha quando a seguinte sinaliza necessidade. O kanban (cartão ou quadro) limita o trabalho em andamento e mostra gargalos.</p>
<h4>Kaizen</h4><p>Melhoria contínua em pequenos passos. O <b>evento kaizen</b> reúne a equipe por 1 a 5 dias focada em um problema: entender, testar soluções no local e padronizar. Princípios: ir ao gemba, ouvir quem faz, testar rápido, medir.</p>
<h4>Ferramentas Lean na logística</h4><table><tr><th>Ferramenta</th><th>Aplicação</th></tr>
<tr><td>Cross-docking</td><td>carga entra e sai sem estocagem</td></tr><tr><td>Agendamento de docas</td><td>reduz fila e espera</td></tr><tr><td>Milk run</td><td>rota fixa de coletas em vários clientes</td></tr>
<tr><td>SMED</td><td>reduzir tempo de preparação (troca de carreta)</td></tr><tr><td>Trabalho padronizado</td><td>sequência fixa de carregamento por rota</td></tr></table>`,
["VSM compara tempo de valor com lead time","Kanban limita trabalho em andamento","Kaizen: melhoria rápida com a equipe","Cross-docking, agendamento e milk run"],
`No VSM de uma carga, o lead time foi de 52 horas, com apenas 3 horas de atividade real. O maior tempo estava na espera para consolidação: a solução foi mudar o horário de corte das coletas.`,
`Faça o VSM de uma carga da coleta à entrega com os tempos reais e identifique a maior espera.`,
[["Em um VSM, o que costuma ser pequeno em relação ao lead time?",["Tempo de agregação de valor","Espera","Estoque","Distância"],0,"A maior parte do lead time costuma ser espera."],["Milk run é:",["Rota fixa de coleta em vários fornecedores","Cálculo de frete","Tipo de embalagem","Auditoria"],0,"É uma rota programada que passa por vários pontos."]]),
L("Six Sigma e o projeto DMAIC",`<h4>O que é</h4><p>Metodologia para reduzir variação e defeitos com dados e estatística. Seis sigma equivale a 3,4 defeitos por milhão de oportunidades. Papéis: Champion (patrocinador), Black Belt (lidera projetos complexos), <b>Green Belt</b> (lidera projetos na própria área), Yellow Belt (apoia).</p>
<h4>DMAIC</h4><table><tr><th>Fase</th><th>Pergunta</th><th>Entregas e ferramentas</th></tr>
<tr><td>Define</td><td>Qual o problema e a meta?</td><td>project charter, SIPOC, voz do cliente → CTQ</td></tr>
<tr><td>Measure</td><td>Como está hoje?</td><td>plano de coleta, linha de base, MSA</td></tr>
<tr><td>Analyze</td><td>Quais as causas reais?</td><td>Ishikawa, estratificação, testes de hipótese</td></tr>
<tr><td>Improve</td><td>Quais soluções funcionam?</td><td>piloto, poka-yoke, matriz de solução</td></tr>
<tr><td>Control</td><td>Como manter?</td><td>plano de controle, CEP, padronização, passagem ao dono</td></tr></table>
<h4>Teste de hipótese em uma frase</h4><p>H0 diz que "não há diferença"; se o <b>p-valor</b> for menor que 0,05, rejeitamos H0 e concluímos que a diferença é estatisticamente significativa. Testes comuns: t (duas médias), ANOVA (várias médias), qui-quadrado (proporções), correlação e regressão.</p>
<h4>Poka-yoke</h4><p>Dispositivo ou regra que impede o erro ou o sinaliza na hora: campo de peso que não aceita valor fora do padrão da NF-e, leitor que apita se o volume não pertence à rota.</p>
<h4>Bom projeto Green Belt</h4><p>Escopo controlável, 3 a 6 meses, ganho mensurável (em reais ou indicador) e dados disponíveis. Pode ser a base do TCC.</p>`,
["Six Sigma reduz variação com dados","DMAIC: Define, Measure, Analyze, Improve, Control","p-valor < 0,05 rejeita H0","Poka-yoke impede o erro na origem"],
`Charter: reduzir CT-es emitidos com erro de 3,2% para 1% em 4 meses na unidade X. CTQ do cliente: valor correto na fatura. Ganho estimado: R$ 4 mil/mês em retrabalho e descontos.`,
`Escreva o project charter de um projeto Green Belt para a sua área: problema, meta, escopo, equipe, prazo e ganho.`,
[["Com p-valor 0,02 e significância 0,05:",["Aceita-se H0","Rejeita-se H0","O teste é inválido","Precisa repetir sempre"],1,"p menor que 0,05 leva a rejeitar H0."],["Em qual fase do DMAIC se faz a linha de base?",["Define","Measure","Improve","Control"],1,"Measure mede a situação atual."]])]},
{n:"Indicadores, Clientes e Fornecedores",o:"Medir desempenho, ouvir o cliente e gerir a cadeia de fornecedores.",a:[
L("KPIs, BSC e rotina de resultados",`<h4>Bons indicadores</h4><p>Poucos, ligados aos objetivos, com meta, fórmula, frequência, fonte e responsável. Use metas <b>SMART</b>: específicas, mensuráveis, atingíveis, relevantes e com prazo.</p>
<h4>Balanced Scorecard</h4><p>Kaplan e Norton propuseram equilibrar o desempenho em 4 perspectivas ligadas por causa e efeito:</p>
<table><tr><th>Perspectiva</th><th>Pergunta</th><th>Indicador na MIR</th></tr>
<tr><td>Financeira</td><td>Como os sócios nos veem?</td><td>margem por rota, inadimplência</td></tr>
<tr><td>Clientes</td><td>Como os clientes nos veem?</td><td>OTIF, NPS, reclamações por mil CT-es</td></tr>
<tr><td>Processos internos</td><td>Em que precisamos ser excelentes?</td><td>CT-e sem erro, avarias, tempo de doca</td></tr>
<tr><td>Aprendizado e crescimento</td><td>Como continuar melhorando?</td><td>horas de treino, turnover, sugestões implementadas</td></tr></table>
<p>O <b>mapa estratégico</b> mostra a lógica: pessoas treinadas → processos melhores → clientes satisfeitos → resultado financeiro.</p>
<h4>Rotina de resultados</h4><p>Indicador só muda o resultado com rotina: reunião curta e fixa (15 minutos no início do turno, 1 hora no mês), painel visível, foco nos desvios, ações com dono e prazo, revisão das ações da reunião anterior. Use semáforo (verde/amarelo/vermelho) e tendência das últimas semanas.</p>
<h4>Erros comuns</h4><ul><li>Dezenas de indicadores sem ninguém analisando.</li><li>Meta impossível que desmotiva, ou fácil demais.</li><li>Olhar só o mês fechado e nunca a tendência.</li></ul>`,
["Poucos indicadores, ligados aos objetivos","BSC: financeiro, clientes, processos, aprendizado","Mapa estratégico liga as perspectivas","Rotina de análise transforma número em ação"],
`Reunião de 15 minutos às 7h30 na unidade: entregas do dia anterior, ocorrências, cargas pendentes e uma ação para o dia. Em 3 meses, o OTIF da unidade subiu 4 pontos.`,
`Monte um BSC simples com 2 indicadores por perspectiva e proponha a rotina de reunião para a unidade.`,
[["Horas de treinamento por colaborador ficam em qual perspectiva do BSC?",["Financeira","Clientes","Processos internos","Aprendizado e crescimento"],3,"Investimento em pessoas é aprendizado e crescimento."],["O que torna um indicador útil?",["Ter muitas casas decimais","Rotina de análise e ação","Ficar escondido","Mudar de fórmula todo mês"],1,"Sem rotina, o indicador não muda o resultado."]]),
L("A voz do cliente: satisfação, NPS e reclamações",`<h4>9.1.2 Satisfação do cliente</h4><p>A organização deve monitorar a percepção dos clientes sobre o grau em que suas necessidades foram atendidas. Fontes: pesquisas, reclamações, elogios, reuniões, dados de garantia, análise de perda de clientes, participação de mercado.</p>
<h4>SERVQUAL: 5 dimensões</h4><p><b>Confiabilidade</b> (fazer o prometido), <b>responsividade</b> (rapidez e disposição), <b>segurança</b> (competência e confiança), <b>empatia</b> (atenção individual), <b>tangíveis</b> (aparência de veículos, pessoas, documentos). Satisfação = percepção − expectativa.</p>
<h4>NPS</h4><p>"De 0 a 10, quanto você recomendaria a MIR?" Promotores 9–10, neutros 7–8, detratores 0–6. <b>NPS = % promotores − % detratores</b>. Ex.: 60% promotores, 15% detratores → NPS 45. Sempre pergunte o porquê e retorne aos detratores em até 48h.</p>
<h4>OTIF e indicadores de serviço</h4><p>OTIF (On Time In Full) = entregas no prazo e completas ÷ total. Outros: tempo de resposta do SAC, % reclamações por mil CT-es, % comprovantes digitalizados em 24h.</p>
<h4>Tratamento de reclamações (ISO 10002)</h4><ol><li>Registrar e confirmar recebimento.</li><li>Avaliar e investigar.</li><li>Responder com solução e prazo.</li><li>Tratar a causa (ação corretiva).</li><li>Medir satisfação com o tratamento.</li></ol><p>Um cliente bem atendido na reclamação costuma ficar mais fiel do que um que nunca teve problema.</p>`,
["Satisfação = percepção − expectativa","SERVQUAL: confiabilidade, responsividade, segurança, empatia, tangíveis","NPS = % promotores − % detratores","Reclamação é fonte de melhoria (ISO 10002)"],
`OTIF do mês: 1.000 entregas, 940 no prazo e 925 no prazo e sem avaria ou falta: OTIF = 92,5%.`,
`Desenhe uma pesquisa NPS de 3 perguntas e calcule o OTIF da sua unidade no último mês.`,
[["Com 50% promotores, 30% neutros e 20% detratores, o NPS é:",["30","50","70","20"],0,"50 − 20 = 30."],["A norma de diretrizes para tratamento de reclamações é:",["ISO 10002","ISO 14001","ISO 22301","ISO 45001"],0,"ISO 10002 trata da satisfação e reclamações."]]),
L("Fornecedores e custos da qualidade",`<h4>8.4 Provedores externos</h4><p>A organização deve definir critérios de <b>avaliação, seleção, monitoramento de desempenho e reavaliação</b>, e reter registros. O controle deve ser proporcional ao impacto: um agregado que faz entregas em nome da empresa exige mais controle que o fornecedor de material de escritório.</p>
<table><tr><th>Critério (agregado)</th><th>Peso</th><th>Medição</th></tr>
<tr><td>Pontualidade</td><td>30%</td><td>% coletas e entregas no horário</td></tr><tr><td>Avarias e extravios</td><td>25%</td><td>ocorrências por mês</td></tr>
<tr><td>Documentação</td><td>20%</td><td>CNH, ANTT, seguro, veículo em dia</td></tr><tr><td>Comunicação</td><td>15%</td><td>retorno e uso do app</td></tr><tr><td>Postura com o cliente</td><td>10%</td><td>reclamações</td></tr></table>
<p>Classificação: A (≥ 85) mantém; B (70–84) plano de melhoria; C (< 70) reavaliação.</p>
<h4>Custos da qualidade (modelo PAF)</h4><table><tr><th>Categoria</th><th>Exemplos</th></tr>
<tr><td>Prevenção</td><td>treinamento, manutenção preventiva, planejamento, poka-yoke</td></tr>
<tr><td>Avaliação</td><td>conferência, inspeção, auditorias</td></tr>
<tr><td>Falha interna</td><td>retrabalho de CT-e, recarga, horas extras por erro</td></tr>
<tr><td>Falha externa</td><td>indenizações, reentregas, descontos, perda de cliente</td></tr></table>
<p>Lógica: cada real em prevenção economiza vários em falhas. Mostrar os custos da não qualidade em reais é a forma mais eficaz de conseguir apoio da direção.</p>`,
["Controle de fornecedores proporcional ao impacto","Critérios com peso e reavaliação periódica","PAF: prevenção, avaliação, falha interna, falha externa","Falha externa é a mais cara"],
`Indenizações de avaria em 12 meses: R$ 85 mil (falha externa). Programa de treino e padronização: R$ 6 mil (prevenção). Se reduzir 30% das avarias, o retorno é de mais de 4 vezes.`,
`Crie a ficha de avaliação de agregados com critérios e pesos e levante em reais os custos de falha externa dos últimos 6 meses.`,
[["Treinamento de conferentes é custo de:",["Prevenção","Avaliação","Falha interna","Falha externa"],0,"Treinar evita falhas."],["Reentrega por endereço errado é custo de:",["Prevenção","Avaliação","Falha interna","Falha externa"],3,"A falha chegou ao cliente."]])]},
{n:"Auditoria, Melhoria Contínua e TCC",o:"Fechar o ciclo do SGQ e concluir a especialização com um trabalho aplicado.",a:[
L("Auditoria interna",`<h4>9.2 na ISO 9001</h4><p>Auditorias internas a intervalos planejados para verificar se o SGQ atende aos requisitos da própria organização e da norma, e se está implementado e mantido de forma eficaz. A organização deve ter um <b>programa</b> (frequência, métodos, responsabilidades, relatos) considerando a importância dos processos, mudanças e resultados anteriores.</p>
<h4>Etapas</h4><ol><li>Programa anual baseado em riscos.</li><li>Plano de cada auditoria: escopo, critérios, horários, auditores.</li><li>Preparação: documentos, indicadores, NCs anteriores, checklist.</li><li>Reunião de abertura.</li><li>Coleta de evidências: entrevistas, observação, registros.</li><li>Constatações: conformidade, não conformidade, oportunidade de melhoria.</li><li>Reunião de encerramento.</li><li>Relatório e acompanhamento das ações.</li></ol>
<h4>Regras de ouro</h4><ul><li>Auditor não audita o próprio trabalho (imparcialidade).</li><li>Constatação sempre com evidência objetiva.</li><li>Perguntas abertas: "me mostre como…".</li><li>Auditoria não é caça a culpados; é verificação do sistema.</li></ul>
<h4>Redigindo uma NC</h4><p><b>Requisito</b>: ISO 9001 7.2 exige evidência de competência. <b>Evidência</b>: 2 de 6 conferentes da unidade X sem registro de treinamento na IT de conferência. <b>Declaração</b>: não há evidência de competência de todos os conferentes.</p>
<p>O curso de auditor aprofunda todas essas técnicas.</p>`,
["Programa de auditoria baseado em riscos e resultados anteriores","Auditor não audita o próprio trabalho","Constatação = requisito + evidência + declaração","Auditoria verifica o sistema, não caça culpados"],
`Programa anual: todas as unidades auditadas uma vez; unidades com mais reclamações ou mudanças recentes, duas vezes. Processos críticos (emissão, conferência) em todas as auditorias.`,
`Monte o programa anual de auditorias internas para as unidades, com critério de frequência baseado em riscos.`,
[["Quem não deve auditar um processo?",["Quem trabalha nele","Auditor treinado de outra área","Consultor externo","Auditor da matriz"],0,"Imparcialidade: não auditar o próprio trabalho."],["Uma constatação de NC precisa de:",["Opinião do auditor","Evidência objetiva","Testemunha","Foto obrigatória"],1,"Toda constatação se apoia em evidência."]]),
L("Análise crítica, melhoria contínua e cultura da qualidade",`<h4>9.3 Análise crítica pela direção</h4><p>A alta direção deve analisar o SGQ a intervalos planejados. <b>Entradas obrigatórias</b>: situação das ações de análises anteriores; mudanças em questões externas e internas; desempenho do SGQ (satisfação, objetivos, desempenho de processos, NCs e ações corretivas, monitoramento, auditorias, fornecedores); adequação de recursos; eficácia das ações para riscos e oportunidades; oportunidades de melhoria. <b>Saídas</b>: decisões sobre melhorias, mudanças no SGQ e recursos, com registro.</p>
<h4>Dicas para uma boa reunião</h4><ul><li>Envie os dados antes; na reunião, discuta decisões.</li><li>Use um painel com tendência, não só o último mês.</li><li>Ata com decisões, responsáveis e prazos.</li></ul>
<h4>10.3 Melhoria contínua</h4><p>A organização deve melhorar continuamente a adequação, suficiência e eficácia do SGQ, usando os resultados de análises e auditorias. Melhoria pode ser incremental (kaizen) ou de ruptura (inovação, novo sistema).</p>
<h4>Cultura da qualidade</h4><p>Ponto reforçado na ISO 9001:2026. Sinais de uma cultura forte: as pessoas relatam erros sem medo; a liderança dá o exemplo; decisões usam dados; problemas viram aprendizado; o cliente aparece nas conversas do dia a dia. Como construir: reconhecer quem aponta problemas, liderança no gemba, comunicação dos resultados, treinamento contínuo e coerência entre discurso e prática.</p>`,
["Análise crítica tem entradas e saídas definidas","Ata com decisões, responsáveis e prazos","Melhoria incremental e de ruptura","Cultura da qualidade: relatar sem medo, liderança pelo exemplo"],

L("O que é IA: conceitos, história e tipos",`<h4>Definições</h4><p><b>Inteligência Artificial</b> é o campo que cria sistemas capazes de realizar tarefas que normalmente exigiriam inteligência humana: reconhecer padrões, prever, decidir, entender e gerar linguagem. <b>Machine Learning</b> é a parte da IA em que o sistema aprende com exemplos em vez de seguir regras escritas à mão. <b>Deep Learning</b> é o machine learning com redes neurais de muitas camadas. <b>IA generativa</b> cria conteúdo novo: texto, imagem, código, áudio.</p>
<h4>Linha do tempo</h4><table><tr><th>Ano</th><th>Marco</th></tr><tr><td>1950</td><td>Turing propõe o "jogo da imitação"</td></tr><tr><td>1956</td><td>Conferência de Dartmouth cria o termo IA</td></tr><tr><td>1970–90</td><td>sistemas especialistas e "invernos da IA"</td></tr><tr><td>1997</td><td>Deep Blue vence Kasparov no xadrez</td></tr><tr><td>2012</td><td>deep learning vence a competição ImageNet</td></tr><tr><td>2017</td><td>artigo do Transformer</td></tr><tr><td>2022 em diante</td><td>popularização dos grandes modelos de linguagem</td></tr></table>
<h4>Tipos de aplicação</h4><ul><li><b>Preditiva</b>: prever número ou categoria (prazo, risco de atraso).</li><li><b>Prescritiva/otimização</b>: escolher a melhor ação (rotas, escalas).</li><li><b>Percepção</b>: visão computacional e voz.</li><li><b>Generativa</b>: textos, resumos, código, imagens.</li><li><b>Agentes</b>: sistemas que planejam e executam tarefas com ferramentas.</li></ul>

L("Probabilidade e teorema de Bayes",`<h4>Conceitos</h4><p>Probabilidade de 0 a 1. <b>Eventos independentes</b>: P(A e B) = P(A) × P(B). <b>Probabilidade condicional</b>: P(A|B) = P(A e B) / P(B), a chance de A sabendo que B ocorreu.</p>
<h4>Teorema de Bayes</h4><p>P(A|B) = P(B|A) × P(A) / P(B). Ele atualiza uma crença inicial (priori) com nova evidência.</p>
<h4>Exemplo prático</h4><p>De 1.000 CT-es, 100 atrasaram (10%). Dos atrasados, 60 eram de sexta-feira. No total, 200 CT-es eram de sexta. Qual a chance de atraso sabendo que é sexta?</p><p>P(atraso|sexta) = P(sexta|atraso) × P(atraso) / P(sexta) = (60/100 × 0,10) / 0,20 = <b>0,30</b>. Sexta tem 30% de atraso contra 10% no geral: sinal claro para investigar.</p>
<h4>Tabela de contingência</h4><table><tr><th></th><th>Atrasou</th><th>No prazo</th><th>Total</th></tr><tr><td>Sexta</td><td>60</td><td>140</td><td>200</td></tr><tr><td>Outros dias</td><td>40</td><td>760</td><td>800</td></tr><tr><td>Total</td><td>100</td><td>900</td><td>1000</td></tr></table><p>Montar a tabela resolve quase todo problema de probabilidade condicional sem fórmula.</p>
<h4>Onde Bayes aparece em IA</h4><p>Filtros de spam (Naive Bayes), diagnóstico, atualização de estimativas de risco e modelos probabilísticos. Ele também explica o "paradoxo do falso positivo": se o evento é raro, mesmo um teste bom gera muitos alarmes falsos.</p>`,

L("Random forest, boosting e pipelines",`<h4>Ensembles</h4><p>Combinam muitos modelos fracos em um forte. <b>Random forest</b>: centenas de árvores, cada uma treinada com uma amostra diferente dos dados e das variáveis; a decisão é a votação. <b>Gradient boosting</b> (XGBoost, LightGBM, CatBoost): árvores em sequência, cada uma corrigindo o erro das anteriores. Em dados de tabela, o boosting costuma ter o melhor desempenho.</p>

L("Clusterização e redução de dimensão",`<h4>K-means</h4><p>Agrupa os dados em k grupos minimizando a distância de cada ponto ao centro do seu grupo. Passos: escolher k, sortear centros, atribuir pontos ao centro mais próximo, recalcular centros, repetir.</p><pre>from sklearn.preprocessing import StandardScaler

L("Anomalias e ajuste de hiperparâmetros",`<h4>Detecção de anomalias</h4><p>Encontrar registros muito diferentes do normal: fraude, erro de digitação, consumo de combustível fora do padrão, frete por kg absurdo.</p><table><tr><th>Método</th><th>Ideia</th></tr><tr><td>Regra estatística</td><td>z-score acima de 3 ou fora de 1,5× o intervalo interquartil</td></tr><tr><td>Isolation Forest</td><td>pontos raros são isolados com poucas divisões</td></tr><tr><td>Local Outlier Factor</td><td>compara a densidade com os vizinhos</td></tr><tr><td>Autoencoder</td><td>rede neural que reconstrói o normal e erra no anormal</td></tr></table>
<pre>from sklearn.ensemble import IsolationForest

          "modelo__learning_rate": [0.01, 0.05, 0.1],
          "modelo__num_leaves": [15, 31, 63]}

busca.fit(X_tr, y_tr); print(busca.best_params_)</pre>
<p><b>GridSearch</b> testa todas as combinações; <b>RandomizedSearch</b> sorteia e é mais rápido; <b>Optuna</b> faz busca inteligente. Avalie o modelo final no conjunto de teste uma única vez.</p>`,

L("Componentes de uma série temporal",`<h4>O que é</h4><p>Observações ordenadas no tempo: coletas por dia, CT-es por semana, litros de diesel por mês. A ordem importa e os valores vizinhos se parecem (autocorrelação).</p>
<h4>Componentes</h4><table><tr><th>Componente</th><th>Exemplo</th></tr><tr><td>Tendência</td><td>volume crescendo 8% ao ano</td></tr><tr><td>Sazonalidade</td><td>segunda mais forte que sábado; pico em novembro e dezembro</td></tr><tr><td>Ciclos</td><td>efeitos da economia, sem período fixo</td></tr><tr><td>Feriados e eventos</td><td>véspera de feriado, Black Friday, greve</td></tr><tr><td>Ruído</td><td>variação aleatória</td></tr></table>
<pre>serie = df.groupby("data")["coletas"].sum().asfreq("D").fillna(0)
from statsmodels.tsa.seasonal import seasonal_decompose
dec = seasonal_decompose(serie, period=7)
dec.plot()</pre>
<h4>Preparação</h4><ul><li>Frequência regular (dias sem dado viram zero ou são tratados).</li><li>Calendário de feriados nacionais e municipais.</li><li>Identificar quebras (nova unidade, novo cliente grande).</li></ul>
<h4>Autocorrelação</h4><p>O gráfico ACF mostra quanto o valor de hoje se parece com o de 1, 2, 7 dias atrás. Um pico em 7 confirma sazonalidade semanal.</p>
<h4>Médias móveis</h4><p><code>serie.rolling(7).mean()</code> suaviza o ruído e revela a tendência; muito usada em painéis.</p>`,
["Tendência, sazonalidade, ciclos, eventos, ruído","Frequência regular e calendário de feriados","ACF revela sazonalidade","Média móvel suaviza e mostra tendência"],

L("Modelos de previsão",`<h4>Comece pelo simples</h4><table><tr><th>Método</th><th>Ideia</th></tr><tr><td>Ingênuo</td><td>amanhã = hoje</td></tr><tr><td>Ingênuo sazonal</td><td>próxima segunda = última segunda</td></tr><tr><td>Média móvel</td><td>média das últimas n semanas no mesmo dia</td></tr></table><p>Todo modelo sofisticado precisa vencer esses.</p>
<h4>Modelos clássicos</h4><p><b>Suavização exponencial (Holt-Winters)</b>: pesa mais o passado recente, com tendência e sazonalidade. <b>ARIMA/SARIMA</b>: modela autocorrelação e diferenças; poderoso, mas exige ajuste.</p>
<h4>Prophet</h4><pre>from prophet import Prophet
d = serie.reset_index(); d.columns = ["ds", "y"]
m = Prophet(weekly_seasonality=True, yearly_seasonality=True)
m.add_country_holidays(country_name="BR")
m.fit(d)
fut = m.make_future_dataframe(periods=28)
prev = m.predict(fut)
m.plot(prev)</pre><p>Lida bem com feriados, dados faltantes e mudanças de tendência; dá intervalos de previsão.</p>
<h4>ML para séries</h4><p>Transforme em tabela com variáveis de calendário e defasagens (valor de 7 e 14 dias atrás, média da última semana) e use LightGBM. Funciona muito bem e permite incluir variáveis externas (previsão de chuva, campanhas de clientes).</p>
<h4>Intervalos de previsão</h4><p>Informe sempre a faixa ("entre 380 e 450 coletas"), não só um número: decisões de escala dependem do pior caso.</p>`,

L("Avaliando previsões e aplicando na logística",`<h4>Validação temporal</h4><p>Nunca embaralhe datas. Use <b>backtesting</b>: treine até a semana t, preveja t+1 a t+4, avance uma semana e repita. A média dos erros mostra o desempenho real.</p>
<h4>Métricas</h4><table><tr><th>Métrica</th><th>Uso</th></tr><tr><td>MAE</td><td>erro médio em unidades (coletas)</td></tr><tr><td>MAPE</td><td>erro percentual; cuidado com valores próximos de zero</td></tr><tr><td>WAPE</td><td>soma dos erros / soma dos reais; melhor para séries com zeros</td></tr><tr><td>Viés</td><td>erra mais para cima ou para baixo?</td></tr></table>
<h4>Aplicações na transportadora</h4><ul><li><b>Escala de equipe</b>: ajudantes e conferentes por turno.</li><li><b>Frota</b>: veículos e agregados por dia.</li><li><b>Doca</b>: janelas de carga e descarga.</li><li><b>Compras</b>: diesel, paletes, fitas.</li><li><b>Comercial</b>: meta realista por unidade.</li></ul>
<h4>Da previsão à decisão</h4><p>Previsão de 450 coletas → produtividade de 18 coletas por motorista/dia → 25 motoristas + margem de 10% = 28. Mostre o cálculo no painel: as pessoas confiam no que entendem.</p>
<h4>Monitoramento</h4><p>Compare previsto × real toda semana. Se o erro crescer (novo cliente, mudança de rota), retreine. Documente eventos atípicos para não ensinar o modelo errado.</p>`,

L("Redes neurais: como funcionam",`<h4>O neurônio artificial</h4><p>Recebe entradas, multiplica cada uma por um peso, soma com um viés e passa por uma <b>função de ativação</b>. Sem ativação não linear, várias camadas seriam equivalentes a uma só.</p><table><tr><th>Ativação</th><th>Uso</th></tr><tr><td>ReLU</td><td>camadas ocultas (padrão)</td></tr><tr><td>Sigmoide</td><td>saída binária (probabilidade)</td></tr><tr><td>Softmax</td><td>saída com várias classes</td></tr><tr><td>Linear</td><td>saída de regressão</td></tr></table>
<h4>Camadas</h4><p>Entrada → camadas ocultas → saída. Cada camada aprende representações mais abstratas: em imagens, bordas → formas → objetos.</p>
<h4>Treinamento</h4><ol><li><b>Forward</b>: calcula a previsão.</li><li><b>Perda</b>: mede o erro (entropia cruzada para classes, MSE para números).</li><li><b>Backpropagation</b>: calcula quanto cada peso contribuiu para o erro.</li><li><b>Gradiente descendente</b>: ajusta os pesos um pouco na direção que reduz o erro (taxa de aprendizado).</li><li>Repete por várias <b>épocas</b>, em <b>lotes (batches)</b>.</li></ol>
<h4>Arquiteturas</h4><table><tr><th>Arquitetura</th><th>Dados</th></tr><tr><td>Densa (MLP)</td><td>tabelas</td></tr><tr><td>CNN</td><td>imagens</td></tr><tr><td>RNN/LSTM</td><td>sequências (hoje menos usadas)</td></tr><tr><td>Transformer</td><td>texto, e cada vez mais imagem e áudio</td></tr></table>
<p>Em dados de tabela, boosting costuma vencer redes neurais com menos esforço. Redes brilham em imagem, texto e áudio.</p>`,
["Neurônio: soma ponderada + ativação","Backpropagation + gradiente descendente","Épocas e lotes","CNN para imagem; Transformer para texto"],

L("Treinando redes com Keras",`<h4>Modelo simples</h4><pre>import tensorflow as tf
from tensorflow import keras
modelo = keras.Sequential([
    keras.layers.Input(shape=(X_tr.shape[1],)),
    keras.layers.Dense(64, activation="relu"),
    keras.layers.Dropout(0.2),
    keras.layers.Dense(32, activation="relu"),
    keras.layers.Dense(1, activation="sigmoid")])
modelo.compile(optimizer="adam", loss="binary_crossentropy",
               metrics=[keras.metrics.AUC()])
parar = keras.callbacks.EarlyStopping(patience=5, restore_best_weights=True)
hist = modelo.fit(X_tr, y_tr, validation_split=0.2,
                  epochs=100, batch_size=64, callbacks=[parar])</pre>
<h4>Lendo as curvas</h4><p>Plote a perda de treino e de validação por época. Ambas caindo: aprendendo. Treino caindo e validação subindo: <b>overfitting</b>, hora de parar. As duas altas: underfitting (modelo pequeno ou dados ruins).</p>
<h4>Regularização</h4><ul><li><b>Dropout</b>: desliga neurônios aleatórios no treino.</li><li><b>Early stopping</b>: para quando a validação piora.</li><li><b>L2</b>: penaliza pesos grandes.</li><li><b>Mais dados</b> ou aumento de dados (data augmentation) em imagens.</li></ul>
<h4>Dicas práticas</h4><ul><li>Padronize as entradas (StandardScaler).</li><li>Comece pequeno e aumente.</li><li>Adam com taxa 0,001 é um bom padrão.</li><li>Use GPU no Colab: Ambiente de execução → Alterar tipo → GPU.</li><li>PyTorch é a alternativa mais usada em pesquisa; a lógica é a mesma.</li></ul>`,

[["Perda de validação subindo enquanto a de treino cai indica:",["Underfitting","Overfitting","Modelo perfeito","Erro de GPU"],1,"O modelo começa a decorar o treino."],["Dropout:",["Remove dados","Desliga neurônios aleatórios no treino","Aumenta a taxa de aprendizado","Salva o modelo"],1,"É uma técnica de regularização."]]),
L("Visão computacional e transfer learning",`<h4>Tarefas</h4><table><tr><th>Tarefa</th><th>Pergunta</th><th>Exemplo</th></tr><tr><td>Classificação</td><td>O que tem na imagem?</td><td>amarração correta ou não</td></tr><tr><td>Detecção</td><td>Onde está cada objeto?</td><td>contar paletes, veículos na doca</td></tr><tr><td>Segmentação</td><td>Contorno exato</td><td>área ocupada no baú</td></tr><tr><td>OCR</td><td>Que texto aparece?</td><td>ler canhotos, etiquetas, placas</td></tr></table>
<h4>CNN</h4><p>Camadas convolucionais aplicam filtros que detectam padrões locais (bordas, texturas); camadas de pooling reduzem o tamanho; no fim, camadas densas classificam.</p>
<h4>Transfer learning</h4><p>Em vez de treinar do zero (exige milhões de imagens), use um modelo já treinado no ImageNet e ajuste só as últimas camadas com poucas centenas de fotos suas.</p><pre>base = keras.applications.EfficientNetB0(include_top=False,
        weights="imagenet", input_shape=(224,224,3), pooling="avg")
base.trainable = False
modelo = keras.Sequential([base, keras.layers.Dense(1, activation="sigmoid")])</pre>
<p><b>Data augmentation</b> (girar, espelhar, mudar brilho) multiplica os exemplos.</p>
<h4>Detecção e OCR prontos</h4><p>YOLO (Ultralytics) para detecção em tempo real; Tesseract e EasyOCR para OCR. Hoje, <b>LLMs multimodais</b> leem documentos e fotos diretamente e extraem campos em JSON sem treinar nada: ótimo ponto de partida.</p>

L("Processamento de linguagem natural e embeddings",`<h4>Do texto aos números</h4><ol><li><b>Limpeza</b>: minúsculas, remover ruído (assinaturas de e-mail, códigos).</li><li><b>Tokenização</b>: dividir em pedaços (palavras ou subpalavras).</li><li><b>Representação</b>: transformar em vetores.</li></ol>
<h4>Abordagens</h4><table><tr><th>Técnica</th><th>Ideia</th><th>Limite</th></tr><tr><td>Bag of words / TF-IDF</td><td>conta palavras, pesa as raras</td><td>ignora ordem e sentido</td></tr><tr><td>Word2Vec</td><td>vetores por palavra</td><td>mesmo vetor em contextos diferentes</td></tr><tr><td>Embeddings de Transformers</td><td>vetor por frase ou documento, considerando contexto</td><td>custo computacional</td></tr></table>
<h4>Embeddings</h4><p>Vetores de centenas de números em que textos de significado parecido ficam próximos. "Carga chegou molhada" e "mercadoria avariada pela chuva" ficam próximas mesmo sem palavras em comum. A proximidade é medida pela <b>similaridade de cosseno</b>.</p><pre>from sentence_transformers import SentenceTransformer
m = SentenceTransformer("paraphrase-multilingual-MiniLM-L12-v2")
v = m.encode(["carga chegou molhada", "mercadoria avariada pela chuva"])</pre>
<h4>Tarefas clássicas</h4><ul><li>Classificação de texto (tipo de reclamação).</li><li>Análise de sentimento.</li><li>Extração de entidades (CNPJ, cidade, peso).</li><li>Busca semântica.</li><li>Agrupamento de temas.</li></ul>`,
["Texto vira números via tokenização e vetores","TF-IDF conta palavras; embeddings capturam sentido","Similaridade de cosseno mede proximidade","Classificação, sentimento, entidades, busca"],
`Agrupar 2.000 reclamações por embedding revelou 6 temas, sendo "falta de aviso antes da entrega" o terceiro maior, algo que não aparecia nas categorias do sistema.`,
`Calcule embeddings de 30 reclamações reais anonimizadas e agrupe com K-means; dê um nome a cada grupo.`,
[["Embeddings servem para:",["Comprimir imagens","Representar significado de textos como vetores","Criptografar","Gerar senhas"],1,"Textos parecidos ficam próximos."],["TF-IDF tem como limite:",["Ser lento","Ignorar ordem e sentido","Exigir GPU","Não funcionar em português"],1,"Ele só conta palavras."]]),
L("LLMs e engenharia de prompt",`<h4>Como funcionam</h4><p>Grandes modelos de linguagem são Transformers treinados com enormes volumes de texto para prever o próximo token. Depois passam por ajuste com instruções e preferências humanas. Conceitos: <b>token</b> (pedaço de palavra), <b>janela de contexto</b> (quanto texto cabe por vez), <b>temperatura</b> (aleatoriedade da resposta).</p>
<h4>Limitações</h4><ul><li><b>Alucinação</b>: inventa fatos com confiança.</li><li>Conhecimento com data de corte.</li><li>Pode seguir instruções escondidas em textos (prompt injection).</li><li>Cálculos longos: peça código ou use ferramentas.</li></ul>
<h4>Estrutura de um bom prompt</h4><table><tr><th>Parte</th><th>Exemplo</th></tr><tr><td>Papel e contexto</td><td>Você analisa ocorrências de uma transportadora de carga fracionada.</td></tr><tr><td>Tarefa</td><td>Classifique a ocorrência abaixo.</td></tr><tr><td>Regras</td><td>Use só as categorias: avaria, falta, endereço, ausente, outros.</td></tr><tr><td>Formato</td><td>Responda em JSON com categoria e justificativa curta.</td></tr><tr><td>Exemplos</td><td>2 ou 3 casos resolvidos (few-shot).</td></tr><tr><td>Dados</td><td>Separe com marcadores, como tags &lt;ocorrencia&gt;.</td></tr></table>
<h4>Técnicas</h4><ul><li>Peça para dizer "não sei" quando faltar informação.</li><li>Divida tarefas grandes em etapas.</li><li>Peça que cite o trecho usado como base.</li><li>Teste com casos difíceis e guarde um conjunto de testes.</li></ul>`,
["LLM prevê o próximo token","Alucinação: confira fatos críticos","Prompt: papel, tarefa, regras, formato, exemplos, dados","Separe instruções de dados com marcadores"],

L("RAG: respostas fundamentadas nos seus documentos",`<h4>O problema</h4><p>O LLM não conhece suas ITs, PGs, tabelas e contratos. Colar tudo no prompt é caro e não cabe. O <b>RAG</b> (Retrieval-Augmented Generation) busca só os trechos relevantes e entrega ao modelo como contexto.</p>

L("Agentes de IA e ferramentas",`<h4>O que é um agente</h4><p>Um LLM que, além de responder, <b>decide e executa ações</b> com ferramentas, em ciclo: entender o objetivo → planejar → chamar uma ferramenta → observar o resultado → decidir o próximo passo → concluir.</p>

L("Sistemas de gestão e Estrutura Harmonizada",`<h4>Sistema de gestão</h4><p>Conjunto de elementos inter-relacionados (políticas, objetivos, processos, recursos) para alcançar objetivos. Cada norma foca uma disciplina: <b>ISO 9001</b> qualidade, <b>ISO 14001</b> meio ambiente, <b>ISO 45001</b> saúde e segurança ocupacional, ISO 27001 segurança da informação, ISO 50001 energia.</p>
<h4>Estrutura Harmonizada</h4><p>Todas seguem as mesmas cláusulas 4 a 10, com textos e definições comuns. Isso permite um <b>SGI</b> (Sistema de Gestão Integrado) com uma política, um programa de auditoria e uma análise crítica únicos.</p>

<tr><td>7 Apoio</td><td>recursos, competência, comunicação, documentos</td><td>—</td></tr>
<tr><td>8 Operação</td><td>controle operacional</td><td>9001: requisitos do cliente; 14001/45001: emergências</td></tr>
<tr><td>9 Avaliação</td><td>monitoramento, auditoria, análise crítica</td><td>14001/45001: avaliação de conformidade legal</td></tr>
<tr><td>10 Melhoria</td><td>NC, ação corretiva, melhoria</td><td>45001: incidentes</td></tr></table>
<h4>Vantagens do SGI</h4><ul><li>Menos documentos duplicados.</li><li>Uma visão única dos riscos do negócio.</li><li>Auditorias integradas mais curtas.</li><li>Processos enxergados como um todo (qualidade, ambiente e segurança na mesma doca).</li></ul>`,

L("Tipos de auditoria e certificação",`<h4>Primeira, segunda e terceira parte</h4><table><tr><th>Tipo</th><th>Quem audita</th><th>Exemplo</th></tr><tr><td>1ª parte</td><td>a própria organização</td><td>auditoria interna da MIR</td></tr><tr><td>2ª parte</td><td>parte com interesse (cliente)</td><td>indústria química auditando a transportadora</td></tr><tr><td>3ª parte</td><td>organismo independente</td><td>certificadora acreditada</td></tr></table>
<h4>Outros tipos</h4><p>Auditoria de <b>sistema</b>, de <b>processo</b> ou de <b>produto/serviço</b>; <b>combinada</b> (várias normas ao mesmo tempo); <b>conjunta</b> (várias organizações auditando juntas); <b>remota</b> (por vídeo, com evidências digitais).</p>

L("ISO 19011: princípios, programa e competências",`<h4>Os 7 princípios de auditoria</h4><ol><li><b>Integridade</b>: honestidade, imparcialidade.</li><li><b>Apresentação justa</b>: relatar com verdade e exatidão.</li><li><b>Devido cuidado profissional</b>.</li><li><b>Confidencialidade</b>.</li><li><b>Independência</b>: não auditar o próprio trabalho.</li><li><b>Abordagem baseada em evidência</b>.</li><li><b>Abordagem baseada em risco</b>.</li></ol>
<h4>Programa de auditoria</h4><p>Conjunto de auditorias para um período. Define objetivos, riscos e oportunidades do programa, escopo, frequência, métodos, recursos, critérios de seleção dos auditores e registros. Monitore e melhore o programa.</p>
<h4>Métodos</h4><table><tr><th></th><th>No local</th><th>Remoto</th></tr><tr><td>Com interação humana</td><td>entrevistas, observação acompanhada</td><td>videochamada, compartilhamento de tela</td></tr><tr><td>Sem interação</td><td>análise de documentos e observação do trabalho</td><td>análise de registros digitais</td></tr></table>
<h4>Competência do auditor</h4><p><b>Comportamentos</b>: ético, mente aberta, diplomático, observador, perceptivo, versátil, persistente, decidido, autoconfiante, culturalmente sensível. <b>Conhecimentos</b>: princípios e métodos de auditoria, normas e documentos, contexto da organização, requisitos legais. Auditor líder: também planejar, liderar a equipe, comunicar e resolver conflitos.</p>
<h4>Avaliação de auditores</h4><p>Registros de formação, experiência, observação em auditoria, feedback dos auditados e revisão de relatórios.</p>`,
["7 princípios: integridade, apresentação justa, cuidado, confidencialidade, independência, evidência, risco","Programa = conjunto de auditorias de um período","Métodos no local e remotos","Competência: comportamentos e conhecimentos"],
`Abordagem baseada em risco no programa: unidades com mais ocorrências, mudanças recentes ou NCs anteriores recebem mais auditorias e mais tempo.`,
`Faça uma autoavaliação de 1 a 5 nos comportamentos do auditor e escreva como desenvolver os 2 mais fracos.`,

{n:"ISO 9001 para Auditores",o:"Interpretar os requisitos da ISO 9001:2026 com foco nas evidências.",a:[
L("Cláusulas 4 a 6: o que perguntar e o que pedir",`<h4>Como auditar contexto e planejamento</h4><table><tr><th>Requisito</th><th>Pergunta</th><th>Evidência</th></tr>
<tr><td>4.1 Contexto</td><td>Quais questões afetam seus resultados? Quando foram revisadas?</td><td>SWOT/PESTEL datada, ata de análise crítica</td></tr>
<tr><td>4.2 Partes interessadas</td><td>Quem são e o que esperam? Como monitoram?</td><td>matriz de partes interessadas</td></tr>
<tr><td>4.3 Escopo</td><td>Quais unidades e serviços? O que não se aplica e por quê?</td><td>escopo documentado</td></tr>
<tr><td>4.4 Processos</td><td>Como os processos se relacionam? Quem é o dono?</td><td>mapa de processos, indicadores</td></tr>
<tr><td>5.1 Liderança</td><td>Como a direção acompanha o SGQ?</td><td>participação em análises, decisões</td></tr>
<tr><td>5.2 Política</td><td>O que a política significa para seu trabalho?</td><td>entrevistas, comunicação</td></tr>
<tr><td>6.1 Riscos</td><td>Quais riscos do processo? Que ações?</td><td>matriz de riscos coerente com o contexto</td></tr>
<tr><td>6.2 Objetivos</td><td>Quais objetivos da área? Como estão?</td><td>planos, indicadores</td></tr>
<tr><td>6.3 Mudanças</td><td>Houve mudanças? Como foram planejadas?</td><td>registro de mudança</td></tr></table>
<h4>Coerência</h4><p>O auditor experiente cruza informações: as questões do contexto aparecem nos riscos? Os riscos geram ações? Os objetivos refletem a política? Essa trilha é mais reveladora do que checar documentos soltos.</p>
<h4>NCs típicas</h4><ul><li>Contexto feito para a certificação e nunca revisado.</li><li>Objetivos sem plano de ação.</li><li>Colaboradores que não sabem dizer como contribuem com a política.</li></ul>`,
["Pergunte, peça evidência e cruze informações","Contexto → riscos → ações → objetivos devem ser coerentes","Política precisa ser entendida, não decorada","Objetivo sem plano é NC frequente"],
`Pergunta que revela muito: "a alta do diesel aparece na análise de contexto; que risco ela gerou e que ação foi tomada?" Se não houver ligação, o SGQ está no papel.`,
`Monte um checklist com 2 perguntas e a evidência esperada para cada requisito de 4.1 a 6.3.`,
[["Qual evidência mostra que a política foi entendida?",["Quadro na parede","Entrevista em que a pessoa explica sua contribuição","Assinatura do diretor","Site da empresa"],1,"Entendimento se verifica conversando."],["Um objetivo da qualidade sem plano de ação é:",["Conformidade","Não conformidade com 6.2.2","Oportunidade sem importância","Requisito de cliente"],1,"A 6.2.2 exige planejar como atingir os objetivos."]]),
L("Cláusulas 7 e 8: apoio e operação na transportadora",`<h4>Cláusula 7</h4><table><tr><th>Requisito</th><th>Evidência</th></tr><tr><td>7.1.5 Medição</td><td>balanças calibradas, certificados, identificação da situação</td></tr><tr><td>7.1.6 Conhecimento</td><td>lições aprendidas, base de conhecimento</td></tr><tr><td>7.2 Competência</td><td>matriz de competências, treinamentos, avaliação de eficácia</td></tr><tr><td>7.3 Conscientização</td><td>integração, entrevistas</td></tr><tr><td>7.5 Documentos</td><td>lista mestra, revisões, controle de obsoletos</td></tr></table>
<h4>Cláusula 8 em serviços de transporte</h4><table><tr><th>Requisito</th><th>Onde olhar</th></tr><tr><td>8.2 Requisitos do cliente</td><td>cotações, contratos, tabelas, análise antes de aceitar cargas especiais</td></tr><tr><td>8.4 Externos</td><td>avaliação de agregados e redespachos, documentação</td></tr><tr><td>8.5.1 Condições controladas</td><td>ITs na doca, checklists, sistema</td></tr><tr><td>8.5.2 Rastreabilidade</td><td>etiqueta, CT-e, leitura de volumes</td></tr><tr><td>8.5.3 Propriedade do cliente</td><td>como a carga é protegida, como perdas são comunicadas</td></tr><tr><td>8.5.4 Preservação</td><td>amarração, cobertura, segregação</td></tr><tr><td>8.7 Saídas não conformes</td><td>registro de avarias e extravios, tratamento</td></tr></table>
<h4>Técnica: seguir uma carga</h4><p>Escolha um CT-e e siga sua trilha: cotação → coleta → conferência → transferência → entrega → comprovante → eventual ocorrência. Em cada etapa, compare o que a IT manda com o que o registro mostra e com o que você vê.</p>`,
["Medição calibrada e competência com eficácia","8.2: análise antes de aceitar o serviço","Carga do cliente é propriedade do cliente","Siga uma carga do início ao fim"],
`Seguindo o CT-e 4521: a coleta foi registrada, mas a conferência não tem leitura de 2 volumes. A IT exige leitura 100%. Evidência concreta para uma constatação.`,
`Escolha 3 CT-es e faça a trilha completa no sistema, anotando onde a evidência estava ou faltava.`,
[["Uma balança sem calibração usada para cobrar frete fere o requisito:",["7.1.5","5.2","9.3","4.2"],0,"Recursos de monitoramento e medição."],["A técnica de 'seguir uma carga' serve para:",["Atrasar a auditoria","Verificar a implementação ponta a ponta","Calcular frete","Treinar motoristas"],1,"Mostra o processo real em todas as etapas."]]),
L("Cláusulas 9 e 10 e a transição para 2026",`<h4>Cláusula 9</h4><table><tr><th>Requisito</th><th>Evidência</th></tr><tr><td>9.1.1 Monitoramento</td><td>o que medir, como, quando, quem analisa</td></tr><tr><td>9.1.2 Satisfação</td><td>pesquisas, reclamações, análise</td></tr><tr><td>9.1.3 Análise de dados</td><td>relatórios com conclusões e ações</td></tr><tr><td>9.2 Auditoria interna</td><td>programa, planos, relatórios, competência dos auditores</td></tr><tr><td>9.3 Análise crítica</td><td>ata com todas as entradas e saídas</td></tr></table>
<h4>Cláusula 10</h4><p>10.2: reação, análise de causa, ações, <b>eficácia verificada</b>, registros. 10.3: evidência de melhoria contínua (projetos, indicadores melhorando). Teste rápido: escolha 3 NCs fechadas e verifique se a eficácia foi avaliada com critério e prazo.</p>
<h4>Transição para a ISO 9001:2026</h4><p>A estrutura de cláusulas foi mantida. Pontos de atenção divulgados durante a revisão:</p><ul><li>Cultura da qualidade e comportamento ético promovidos pela liderança.</li><li>Riscos e oportunidades tratados de forma mais clara.</li><li>Mudanças climáticas consideradas no contexto (desde a emenda de 2024).</li><li>Anexos com mais orientação de interpretação.</li></ul><p>Na auditoria de transição, foque nas mudanças e em como a organização as incorporou. Normalmente há um período de transição de cerca de três anos; confirme prazos com a certificadora e o IAF. Sempre trabalhe com o texto oficial publicado.</p>`,
["Análise de dados deve gerar conclusões e ações","Análise crítica com todas as entradas","Teste: 3 NCs fechadas têm eficácia avaliada?","Transição 2026: cultura, ética, riscos e clima"],
