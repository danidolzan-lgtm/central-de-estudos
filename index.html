L("Produtividade pessoal: organizar, comunicar e planejar",`<h4>Organizar a vida</h4>
<table><tr><th>Situação</th><th>Prompt</th></tr>
<tr><td>Cabeça cheia de tarefas</td><td>"Vou despejar tudo que preciso fazer. Organize por urgência e importância (matriz de Eisenhower) e sugira o que fazer hoje, esta semana e o que delegar ou cortar."</td></tr>
<tr><td>Rotina</td><td>"Monte uma rotina semanal realista com: trabalho 8h-17h, academia 3x, estudo 1h por dia, tempo com a família e 7h de sono."</td></tr>
<tr><td>Metas</td><td>"Transforme minha meta 'ler mais' em metas SMART e hábitos diários pequenos."</td></tr>
<tr><td>Mudança de casa</td><td>"Crie um checklist de mudança de apartamento para 8 semanas antes até 1 semana depois."</td></tr>
<tr><td>Viagem</td><td>"Lista de bagagem para 5 dias em clima frio, com criança de 3 anos."</td></tr></table>
<h4>Comunicação do dia a dia</h4>
<ul><li>Mensagens difíceis: reclamar com a operadora, cobrar um conserto, recusar um convite sem magoar.</li>
<li>Recados para condomínio, escola dos filhos, grupo da família.</li>
<li>Responder avaliações ou reclamações de forma educada.</li>
<li>Preparar conversas: "Vou conversar com meu vizinho sobre o barulho. Me ajude a planejar o que dizer, como começar e como reagir se ele ficar irritado."</li></ul>
<h4>Resumir e entender</h4>
<p>Cole ou envie: manual de um aparelho, regulamento de condomínio, termos de uso, bula, edital, artigo longo. Peça: "Resuma os pontos que realmente importam para mim, que sou [contexto]." Para vídeos longos, assistentes com integração ao YouTube ou transcrições resumem o conteúdo.</p>
<h4>Agenda e lembretes</h4>
<p>Assistentes conectados à agenda (Gemini com Google Agenda, Copilot com Outlook, Claude com conectores) podem criar eventos, encontrar horários e preparar o resumo do dia. Sem conexão, peça um plano e copie para a agenda.</p>
<h4>Fazendo a IA trabalhar por você</h4>
<ul><li><b>Voz</b>: dite ideias no carro ou caminhando e peça para organizar depois.</li>
<li><b>Fotos</b>: fotografe uma lousa, cardápio, nota fiscal ou receita e peça transcrição, tradução ou análise.</li>
<li><b>Modelos</b>: crie modelos reutilizáveis (lista de compras padrão, checklist de viagem).</li>
<li><b>Revisão semanal</b>: toda sexta, despeje o que aconteceu e peça um resumo com pendências para a próxima semana.</li></ul>
<h4>Cuidado com a superdependência</h4>
<p>Use a IA para tirar peso do que é repetitivo e liberar tempo para o que importa. Decisões pessoais, relações e valores continuam sendo seus.</p>`,
["Despeje tarefas e peça priorização (Eisenhower)","Mensagens difíceis e preparação de conversas","Resuma manuais, regulamentos, editais e bulas","Use voz e fotos como entrada","Revisão semanal com IA"],
`Foto da conta de luz + prompt: "Explique esta conta, compare o consumo com os meses anteriores mostrados no gráfico e dê 5 dicas para reduzir 15% no próximo mês para uma casa com 3 pessoas." Lembre de cobrir dados pessoais antes de enviar.`,
`Durante uma semana, use IA para: priorizar suas tarefas na segunda, preparar uma mensagem difícil, resumir um documento longo, organizar uma lista com foto e fazer a revisão semanal na sexta. Anote quanto tempo economizou.`,
[["A matriz de Eisenhower organiza tarefas por:",["Cor e tamanho","Urgência e importância","Preço e prazo","Nome e data"],1,"Urgente × importante."],["Antes de enviar foto de uma conta pessoal, deve-se:",["Aumentar o brilho","Cobrir dados pessoais desnecessários","Enviar para todos","Imprimir"],1,"Privacidade em primeiro lugar."],["Uma boa prática para não depender demais da IA é:",["Deixar que ela decida tudo","Usá-la no repetitivo e manter as decisões pessoais com você","Nunca usar","Usar só à noite"],1,"IA como apoio."]]),
L("Estudos e aprendizado acelerado",`<h4>A IA como tutor pessoal</h4>
<p>Pesquisas sobre aprendizagem mostram que tutoria individual é uma das formas mais eficazes de aprender. Assistentes de IA tornam isso acessível: explicam de vários jeitos, respondem a qualquer hora e adaptam o nível. O segredo é usá-los para <b>pensar mais</b>, não menos.</p>
<h4>Técnicas de estudo com base em evidências</h4>
<table><tr><th>Técnica</th><th>Como a IA ajuda</th></tr>
<tr><td>Prática de recuperação (testar-se)</td><td>Gerar perguntas, quizzes e flashcards a partir do seu material</td></tr>
<tr><td>Repetição espaçada</td><td>Criar cartões para Anki em formato pergunta;resposta</td></tr>
<tr><td>Intercalação</td><td>Misturar tipos de exercícios diferentes numa lista</td></tr>
<tr><td>Elaboração</td><td>Perguntar "por quê?" e "como isso se liga a...?"</td></tr>
<tr><td>Exemplos concretos</td><td>Pedir exemplos do seu dia a dia</td></tr>
<tr><td>Dupla codificação</td><td>Pedir diagramas, tabelas e mapas mentais</td></tr></table>
<h4>Fluxo de estudo semanal com IA</h4>
<ol><li><b>Antes da aula</b>: "Me dê uma visão geral de 5 minutos sobre [tema] e 3 perguntas para eu tentar responder durante o estudo."</li>
<li><b>Durante</b>: pergunte sempre que travar; peça analogias.</li>
<li><b>Depois</b>: explique com suas palavras e peça correção (Feynman).</li>

L("Lógica de programação e primeiro programa",`<h4>Por que aprender a programar na era da IA</h4>
<p>A IA escreve código, mas quem entende o básico consegue pedir melhor, perceber erros, adaptar e automatizar a própria vida. Programar é dar instruções precisas a um computador, e a lógica é a mesma de um bom prompt: clareza, passo a passo e condições.</p>
<h4>Algoritmo: receita passo a passo</h4>
<p>Fazer café: 1) encher a chaleira; 2) ligar o fogo; 3) <b>enquanto</b> a água não ferver, esperar; 4) colocar o pó no filtro; 5) <b>se</b> quiser forte, usar 3 colheres, <b>senão</b> 2; 6) despejar a água; 7) servir. Aí estão os três pilares: <b>sequência</b>, <b>condição</b> (se/senão) e <b>repetição</b> (enquanto).</p>
<h4>Por que Python</h4>
<ul><li>Sintaxe simples, parecida com inglês.</li>
<li>Muito usado em automação, dados, IA e web.</li>
<li>Gratuito, com milhares de bibliotecas prontas.</li>
<li>É a linguagem que as IAs mais dominam.</li></ul>
<h4>Onde programar sem instalar nada</h4>
<ul><li><b>Google Colab</b> (colab.research.google.com): cadernos Python no navegador, gratuitos.</li>
<li>Executar código direto em assistentes que rodam Python (análise de dados).</li>
<li>Depois, instale no computador: Python (python.org) + editor <b>VS Code</b>.</li></ul>
<h4>Primeiros comandos</h4>
<pre><code>print("Olá, mundo!")
nome = input("Qual é o seu nome? ")
print("Prazer,", nome)
idade = int(input("Quantos anos você tem? "))
print("Daqui a 10 anos você terá", idade + 10, "anos.")</code></pre>
<ul><li><b>Print</b> mostra na tela.</li>
<li><b>Input</b> lê o que o usuário digita (sempre como texto).</li>
<li><b>int()</b> converte texto em número inteiro.</li>
<li>O sinal <b>=</b> guarda um valor numa variável.</li></ul>
<h4>Comentários e erros</h4>
<p>Linhas que começam com # são comentários (o computador ignora). Erros são normais: leia a última linha da mensagem (por exemplo, <i>NameError</i> = nome não definido; <i>SyntaxError</i> = escrita errada; <i>TypeError</i> = tipos incompatíveis). Cole o erro numa IA e peça explicação simples.</p>
<h4>Como estudar programação com IA</h4>
<ol><li>Peça explicação de um conceito com exemplo.</li>
<li>Digite o código você mesmo (não só copie e cole).</li>
<li>Mude algo e veja o que acontece.</li>
<li>Peça um exercício e tente sozinho antes de pedir a solução.</li></ol>`,

L("Variáveis, tipos, condições e repetições",`<h4>Tipos de dados</h4>
<table><tr><th>Tipo</th><th>Exemplo</th><th>Uso</th></tr>
<tr><td>int</td><td>42</td><td>Números inteiros</td></tr>
<tr><td>float</td><td>3.75</td><td>Números com casas decimais (use ponto)</td></tr>
<tr><td>str</td><td>"Maria"</td><td>Textos</td></tr>
<tr><td>bool</td><td>True / False</td><td>Verdadeiro ou falso</td></tr></table>
<h4>Operadores</h4>
<p>Aritméticos: + − * / // (divisão inteira) % (resto) ** (potência). Comparação: == (igual), != (diferente), &gt;, &lt;, &gt;=, &lt;=. Lógicos: and, or, not.</p>
<h4>Condições: if, elif, else</h4>
<pre><code>temperatura = float(input("Temperatura hoje: "))
if temperatura &gt;= 30:
    print("Dia de praia!")
elif temperatura &gt;= 20:
    print("Bom para caminhar.")
else:
    print("Leve um casaco.")</code></pre>
<p>A <b>indentação</b> (4 espaços) define o que está dentro do if. Esquecer os dois pontos ou a indentação é o erro mais comum de iniciantes.</p>
<h4>Repetição com for</h4>
<pre><code>for i in range(1, 11):
    print("7 x", i, "=", 7 * i)</code></pre>
<p><i>Range(1, 11)</i> gera de 1 a 10 (o último número não entra).</p>
<h4>Repetição com while</h4>
<pre><code>saldo = 1000
meses = 0
while saldo &lt; 2000:
    saldo = saldo * 1.01
    meses = meses + 1
print("Dobrou em", meses, "meses")</code></pre>
<p>O while repete enquanto a condição for verdadeira. Cuidado com laços infinitos: garanta que algo mude a cada volta.</p>
<h4>f-strings: textos com variáveis</h4>
<pre><code>nome = "Ana"
total = 153.5
print(f"{nome}, sua compra deu R$ {total:.2f}")</code></pre>
<p>O <i>:.2f</i> mostra 2 casas decimais.</p>
<h4>Exemplo completo: jogo de adivinhação</h4>
<pre><code>import random
secreto = random.randint(1, 50)
tentativas = 0
while True:
    palpite = int(input("Seu palpite (1 a 50): "))
    tentativas += 1
    if palpite == secreto:
        print(f"Acertou em {tentativas} tentativas!")
        break
    elif palpite &lt; secreto:
        print("Maior...")
    else:
        print("Menor...")</code></pre>
<p><i>Break</i> sai do laço. <i>import random</i> traz uma biblioteca pronta de números aleatórios.</p>`,

L("Funções, listas, dicionários e arquivos",`<h4>Funções</h4>
<p>Blocos reutilizáveis que recebem entradas (parâmetros) e devolvem resultados (return).</p>
<pre><code>def parcela(valor, juros_mensal, meses):
    i = juros_mensal / 100
    return valor * i / (1 - (1 + i) ** -meses)

p = parcela(30000, 1.5, 48)
print(f"Parcela: R$ {p:.2f}")</code></pre>
<p>Funções organizam o código e evitam repetição. Dê nomes claros.</p>

for item in compras:
    print("-", item)</code></pre>
<p>Índices começam em 0. <i>compras[-1]</i> é o último item.</p>
<h4>Dicionários: pares chave-valor</h4>

L("Programar com IA: do pedido ao programa funcionando",`<h4>A nova forma de programar</h4>
<p>Hoje é possível descrever em português o que se quer e receber código funcionando. Isso é chamado informalmente de "vibe coding". Funciona muito bem para scripts pessoais e protótipos, desde que você saiba testar, ler o código e corrigir. Para coisas importantes, entender o código continua essencial.</p>
<h4>O ciclo</h4>
<ol><li><b>Descreva o objetivo</b> com entradas, saídas e exemplos.</li>
<li><b>Peça um plano</b> antes do código ("quais etapas e bibliotecas você usaria?").</li>
<li><b>Gere o código</b> em partes pequenas.</li>
<li><b>Rode e teste</b> com dados de exemplo.</li>
<li><b>Cole o erro completo</b> quando falhar e peça correção explicada.</li>
<li><b>Peça explicação</b> linha a linha das partes que não entendeu.</li>
<li><b>Melhore</b>: tratamento de erros, mensagens claras, comentários.</li></ol>
<h4>Prompt modelo para código</h4>
<pre><code>Quero um script Python para [objetivo].
Entrada: [arquivo/pasta/dados, com exemplo].
Saída esperada: [o que deve acontecer, com exemplo].
Ambiente: Windows 11, Python 3, sem bibliotecas pagas.
Requisitos: comentários em português, tratar erros comuns,
não apagar nada sem pedir confirmação.
Primeiro explique o plano em tópicos; depois mostre o código completo.</code></pre>
<h4>Depurando com IA</h4>
<ul><li>Cole a mensagem de erro inteira e o trecho do código.</li>
<li>Diga o que esperava e o que aconteceu.</li>
<li>Peça: "explique a causa do erro antes de corrigir".</li>
<li>Se a correção não resolver, dê o novo erro; se entrar em círculos, peça outra abordagem.</li></ul>
<h4>Ferramentas de programação com IA</h4>
<table><tr><th>Ferramenta</th><th>Como funciona</th></tr>
<tr><td>Chat (Claude, ChatGPT, Gemini)</td><td>Você copia e cola o código</td></tr>
<tr><td>Editores com IA (VS Code + GitHub Copilot, Cursor, Windsurf)</td><td>Sugestões e chat dentro do editor, vendo seus arquivos</td></tr>
<tr><td>Agentes de programação (Claude Code, OpenAI Codex, Gemini CLI)</td><td>Leem o projeto, criam e editam arquivos, rodam comandos e testes</td></tr>
<tr><td>Criadores de apps por conversa (artefatos, Replit, Lovable, Bolt)</td><td>Geram aplicações web completas a partir de descrições</td></tr></table>
<h4>Segurança ao rodar código gerado</h4>
<ul><li>Leia o que o código faz antes de rodar, especialmente se apaga, move ou envia arquivos.</li>
<li>Teste primeiro numa pasta de cópia.</li>
<li>Nunca cole senhas ou chaves no código; use variáveis de ambiente.</li>
<li>Desconfie de comandos que pedem para desativar antivírus ou rodar como administrador sem motivo.</li></ul>
<h4>Seu nível ideal</h4>
<p>Você não precisa decorar sintaxe. Precisa: entender lógica, ler código, saber testar, saber descrever problemas e saber avaliar se a solução faz sentido. Esse é o perfil de quem aproveita a IA ao máximo.</p>`,

L("Terminal: PowerShell e bash sem medo",`<h4>O que é o terminal</h4>
<p>Uma janela onde você dá comandos por texto ao sistema operacional. É mais rápido para tarefas repetitivas e é onde muitas ferramentas de IA e programação rodam. No Windows: <b>PowerShell</b> ou <b>Terminal do Windows</b>. No macOS e Linux: <b>bash</b> ou <b>zsh</b>.</p>
<h4>Comandos essenciais</h4>
<table><tr><th>Ação</th><th>PowerShell (Windows)</th><th>Bash/zsh (Mac/Linux)</th></tr>
<tr><td>Onde estou?</td><td>Get-Location (pwd)</td><td>pwd</td></tr>
<tr><td>Listar arquivos</td><td>Get-ChildItem (ls, dir)</td><td>ls -la</td></tr>
<tr><td>Entrar em pasta</td><td>cd Documentos</td><td>cd Documentos</td></tr>
<tr><td>Voltar uma pasta</td><td>cd ..</td><td>cd ..</td></tr>
<tr><td>Criar pasta</td><td>mkdir Fotos2026</td><td>mkdir Fotos2026</td></tr>
<tr><td>Copiar</td><td>Copy-Item a.txt b.txt (cp)</td><td>Cp a.txt b.txt</td></tr>
<tr><td>Mover / renomear</td><td>Move-Item a.txt pasta (mv)</td><td>Mv a.txt pasta/</td></tr>
<tr><td>Apagar (cuidado!)</td><td>Remove-Item a.txt (rm)</td><td>Rm a.txt</td></tr>
<tr><td>Ver conteúdo</td><td>Get-Content a.txt (cat)</td><td>Cat a.txt</td></tr>
<tr><td>Procurar texto</td><td>Select-String "palavra" *.txt</td><td>Grep "palavra" *.txt</td></tr>
<tr><td>Rodar Python</td><td>python script.py</td><td>Python3 script.py</td></tr>
<tr><td>Limpar a tela</td><td>Cls</td><td>clear</td></tr></table>
<p>Dicas: a tecla Tab completa nomes; seta para cima repete comandos anteriores; caminhos com espaços vão entre aspas: cd "Área de Trabalho".</p>
<h4>Exemplos úteis</h4>
<pre><code># PowerShell: listar os 10 maiores arquivos da pasta Downloads
Get-ChildItem $HOME/Downloads -File | Sort-Object Length -Descending | Select-Object -First 10 Name, Length

# PowerShell: renomear todas as fotos .jpg acrescentando "viagem_" no início
Get-ChildItem *.jpg | Rename-Item -NewName { "viagem_" + $_.Name }</code></pre>
<p>A barra vertical | (pipe) passa o resultado de um comando para o próximo. Esse encadeamento é a grande força do terminal.</p>
<h4>Scripts</h4>
<p>Um script é um arquivo com vários comandos: .ps1 no PowerShell, .sh no bash, .py em Python. No Windows, rodar scripts .ps1 pode exigir ajustar a política de execução; peça à IA o comando adequado e entenda o que ele faz antes.</p>
<h4>Gerenciadores de pacotes</h4>
<p>Instale programas por comando: <i>winget</i> no Windows (ex.: winget install Python.Python.3.12), <i>brew</i> no macOS, <i>apt</i> no Linux, e <i>pip</i> para bibliotecas Python.</p>
<h4>Segurança</h4>
<ul><li>Comandos de apagar não mandam para a lixeira: confira duas vezes.</li>
<li>Não cole comandos da internet que você não entende; peça à IA para explicar cada parte.</li>
<li>Evite rodar como administrador sem necessidade.</li></ul>`,

L("Automatizando arquivos e tarefas com Python",`<h4>O que vale automatizar</h4>
<p>Tarefas repetitivas, chatas e com regra clara: organizar downloads, renomear fotos, fazer backup, juntar PDFs, converter formatos, gerar relatórios, enviar lembretes. Regra prática: se você faz mais de uma vez por semana e leva mais de 5 minutos, vale automatizar.</p>
<h4>Organizador da pasta Downloads</h4>
<pre><code>from pathlib import Path
import shutil

pasta = Path.home() / "Downloads"
destinos = {
    "Imagens": [".jpg", ".jpeg", ".png", ".gif", ".webp"],
    "Documentos": [".pdf", ".docx", ".xlsx", ".txt", ".pptx"],
    "Videos": [".mp4", ".mov", ".avi"],
    "Compactados": [".zip", ".rar", ".7z"],
}
SIMULAR = True  # troque para False quando estiver satisfeito

for arquivo in pasta.iterdir():
    if arquivo.is_file():
        for nome, extensoes in destinos.items():
            if arquivo.suffix.lower() in extensoes:
                alvo = pasta / nome
                if SIMULAR:
                    print(f"Moveria {arquivo.name} para {nome}")
                else:
                    alvo.mkdir(exist_ok=True)
                    shutil.move(str(arquivo), str(alvo / arquivo.name))</code></pre>
<p>O modo SIMULAR mostra o que aconteceria sem mexer em nada.</p>
<h4>Backup simples com data</h4>
<pre><code>from pathlib import Path
from datetime import date
import shutil

origem = Path.home() / "Documents" / "Estudos"
destino = Path("D:/Backup") / f"Estudos_{date.today():%Y-%m-%d}"
shutil.copytree(origem, destino)
print("Backup feito em", destino)</code></pre>
<h4>Juntar PDFs</h4>
<pre><code># pip install pypdf
from pypdf import PdfWriter
from pathlib import Path

writer = PdfWriter()
for pdf in sorted(Path("apostilas").glob("*.pdf")):
    writer.append(str(pdf))
writer.write("apostila_completa.pdf")</code></pre>
<h4>Agendando para rodar sozinho</h4>
<ul><li><b>Windows</b>: Agendador de Tarefas (Task Scheduler): criar tarefa básica → gatilho (diário, ao ligar) → ação "iniciar programa" com python e o caminho do script.</li>
<li><b>MacOS / Linux</b>: cron ou launchd.</li>
<li>Na nuvem: serviços como GitHub Actions podem rodar scripts em horários definidos.</li></ul>
<h4>Outras automações pessoais com Python</h4>
<ul><li>Converter imagens para outro formato ou tamanho (biblioteca Pillow).</li>
<li>Extrair texto de PDFs para pesquisar.</li>
<li>Gerar certificados ou convites a partir de uma lista (nomes num CSV).</li>
<li>Monitorar o preço de um produto num site que permita (respeitando os termos de uso).</li>

L("Automação sem código: conectando apps",`<h4>No-code e low-code</h4>

<h4>Anatomia de uma automação</h4>

L("O que é uma API, JSON e chaves de acesso",`<h4>API em uma frase</h4>
<p>API (Interface de Programação de Aplicações) é uma porta que permite que um programa converse com outro. Em vez de você abrir o site do clima, seu programa pede à API do serviço de clima e recebe os dados prontos. Com APIs de IA, seu programa envia um texto e recebe a resposta do modelo.</p>
<h4>Como funciona uma chamada</h4>
<ol><li>Seu programa envia uma <b>requisição</b> (request) para um endereço (endpoint), geralmente por HTTPS.</li>
<li>A requisição leva <b>cabeçalhos</b> (como a chave de acesso) e um <b>corpo</b> com os dados.</li>
<li>O servidor processa e devolve uma <b>resposta</b> com um código de status (200 = sucesso; 401 = não autorizado; 429 = muitas requisições; 500 = erro do servidor) e os dados.</li></ol>
<h4>JSON: a língua das APIs</h4>
<pre><code>{
  "cidade": "Florianópolis",
  "Temperatura": 24.5,
  "chuva": false,
  "previsao": [
    {"dia": "segunda", "max": 27},
    {"dia": "terça", "max": 25}
  ]
}</code></pre>
<p>Objetos entre chaves, listas entre colchetes, textos entre aspas duplas. Em Python, JSON vira dicionários e listas com <i>json.loads()</i> ou <i>resposta.json()</i>.</p>
<h4>Primeiro exemplo: API pública sem chave</h4>
<pre><code>import requests
r = requests.get("https://brasilapi.com.br/api/cep/v1/88010000")
dados = r.json()
print(dados["city"], "-", dados["state"])</code></pre>
<p>A BrasilAPI oferece dados públicos (CEP, feriados, bancos). Ótima para treinar.</p>
<h4>Chaves de API: trate como senha</h4>
<ul><li>São criadas no console do provedor (Anthropic Console, plataforma da OpenAI, Google AI Studio).</li>
<li><b>Nunca</b> coloque a chave no código que você compartilha nem em páginas públicas.</li>
<li>Guarde em <b>variáveis de ambiente</b> ou num arquivo .env que não vai para o GitHub.</li>
<li>Se vazar, revogue e crie outra imediatamente.</li></ul>
<pre><code># No terminal (PowerShell), definir para a sessão atual:
$env:ANTHROPIC_API_KEY = "sua-chave-aqui"
# No Python:
import os
chave = os.environ["ANTHROPIC_API_KEY"]</code></pre>
<h4>Custos</h4>
<p>APIs de IA cobram por <b>tokens</b> de entrada e de saída, normalmente com preço por milhão de tokens, variando por modelo (modelos maiores custam mais). Para uso pessoal, os custos costumam ser baixos, mas defina <b>limites de gasto</b> no console do provedor e monitore. Diferente da assinatura do chat, a API é cobrada pelo uso.</p>
<h4>Documentação: sua melhor amiga</h4>
<p>Cada provedor tem documentação com exemplos (docs.claude.com, platform.openai.com/docs, ai.google.dev). Modelos e parâmetros mudam: sempre copie os nomes de modelos atuais da documentação oficial.</p>`,

<p>Os SDKs evoluem; se algo mudar, consulte o "quickstart" da documentação oficial ou peça a um assistente com busca a versão atual do exemplo.</p>
<h4>Conceitos das APIs de chat</h4>
<table><tr><th>Conceito</th><th>Explicação</th></tr>
<tr><td>system</td><td>Instrução geral de comportamento (papel, tom, regras)</td></tr>

<h4>A API não lembra sozinha</h4>

L("Embeddings e RAG: IA que responde com os seus documentos",`<h4>O problema</h4>
<p>O modelo não conhece seus documentos (apostilas, manuais da casa, anotações). Colar tudo em cada pergunta funciona até certo ponto, mas fica caro e esbarra no limite de contexto quando há muitos arquivos.</p>
<h4>RAG: geração aumentada por recuperação</h4>
<ol><li><b>Preparar</b>: dividir documentos em pedaços (chunks) de algumas centenas de palavras.</li>
<li><b>Indexar</b>: transformar cada pedaço em um <b>embedding</b> e guardar num banco vetorial.</li>
<li><b>Perguntar</b>: transformar a pergunta em embedding e buscar os pedaços mais parecidos.</li>
<li><b>Gerar</b>: enviar ao modelo a pergunta + os pedaços encontrados, instruindo a responder só com base neles e citar a fonte.</li></ol>
<h4>Embeddings</h4>
<p>Um embedding é uma lista de números que representa o significado de um texto. Textos com sentido parecido ficam "perto" nesse espaço, mesmo com palavras diferentes: "como trocar o pneu" fica perto de "substituição de roda furada". Isso permite busca por significado, não só por palavra exata.</p>
<h4>Ferramentas</h4>
<table><tr><th>Camada</th><th>Opções</th></tr>
<tr><td>Sem código</td><td>NotebookLM, projetos com arquivos no Claude e no ChatGPT, GPTs e Gems com arquivos</td></tr>
<tr><td>Modelos de embedding</td><td>Oferecidos por OpenAI, Google, Voyage AI (recomendado pela Anthropic), Cohere e modelos abertos (sentence-transformers)</td></tr>
<tr><td>Bancos vetoriais</td><td>Chroma e FAISS (locais e simples), pgvector, Pinecone, Qdrant</td></tr>
<tr><td>Frameworks</td><td>LangChain, LlamaIndex (facilitam montar o fluxo)</td></tr></table>
<h4>Esqueleto de RAG simples</h4>
<pre><code># pip install chromadb
import chromadb
db = chromadb.Client()
col = db.create_collection("apostilas")   # usa um modelo de embedding padrão local

trechos = ["A ISO 9001 trata de gestão da qualidade...", "A ISO 14001 trata de gestão ambiental..."]
col.add(documents=trechos, ids=[str(i) for i in range(len(trechos))])

pergunta = "Qual norma fala de meio ambiente?"
achados = col.query(query_texts=[pergunta], n_results=2)["documents"][0]
contexto = chr(10).join(achados)
prompt = f"Responda só com base no contexto. Se não estiver nele, diga que não sabe.{chr(10)}Contexto:{chr(10)}{contexto}{chr(10)}Pergunta: {pergunta}"
# envie 'prompt' para o modelo com o SDK da aula anterior</code></pre>
<h4>Dicas para um RAG que funciona</h4>
<ul><li>Pedaços com sentido completo (por seção, por parágrafo), com um pouco de sobreposição.</li>
<li>Guarde metadados (arquivo, página) para citar a fonte.</li>
<li>Busque mais pedaços do que precisa e deixe o modelo escolher.</li>
<li>Teste com perguntas reais e avalie se a resposta está correta e citada.</li>
<li>Contexto longo × RAG: para poucos documentos, colocar tudo no contexto pode ser mais simples e preciso.</li></ul>
<h4>Projeto pessoal</h4>
<p>"Pergunte às minhas apostilas": RAG com os PDFs dos cursos da sua Central de Estudos, respondendo dúvidas com citação da página.</p>`,

L("Ferramentas, function calling e MCP",`<h4>Modelos que usam ferramentas</h4>
<p>Sozinho, um modelo só gera texto. Com <b>ferramentas</b> (tool use ou function calling), ele pode pedir para executar funções que você define: consultar o clima, buscar na web, calcular, ler a agenda, salvar um arquivo. O modelo decide quando chamar e com quais argumentos; seu programa executa e devolve o resultado; o modelo usa o resultado na resposta.</p>
<h4>O fluxo</h4>
<ol><li>Você descreve as ferramentas disponíveis (nome, descrição, parâmetros em JSON Schema).</li>
<li>O usuário pergunta: "Vou precisar de guarda-chuva amanhã em Curitiba?"</li>
<li>O modelo responde pedindo: usar a ferramenta <i>previsao_tempo</i> com <i>cidade = "Curitiba"</i>.</li>
<li>Seu código chama a API do clima e devolve o resultado ao modelo.</li>
<li>O modelo responde: "Sim, há 80% de chance de chuva à tarde."</li></ol>
<h4>Definindo uma ferramenta (Claude)</h4>
<pre><code>ferramentas = [{
    "name": "previsao_tempo",
    "description": "Retorna a previsão do tempo para uma cidade brasileira.",
    "input_schema": {
        "type": "object",
        "properties": {"cidade": {"type": "string", "description": "Nome da cidade"}},
        "required": ["cidade"],
    },
}]
msg = client.messages.create(model="claude-sonnet-5-5", max_tokens=500, tools=ferramentas,
    messages=[{"role": "user", "content": "Vai chover amanhã em Curitiba?"}])
for bloco in msg.content:
    if bloco.type == "tool_use":
        print("O modelo pediu:", bloco.name, bloco.input)</code></pre>
<p>OpenAI e Gemini têm mecanismos equivalentes (function calling). A documentação de cada um mostra como devolver o resultado da ferramenta.</p>
<h4>MCP: Model Context Protocol</h4>
<p>Padrão aberto, criado pela Anthropic em 2024 e adotado por várias empresas e ferramentas, para conectar assistentes de IA a fontes de dados e ferramentas de forma padronizada. Em vez de cada app criar sua integração, um <b>servidor MCP</b> expõe ferramentas (ler arquivos, consultar um banco, acessar um app) e qualquer <b>cliente MCP</b> compatível (como o Claude e outros assistentes e editores) pode usá-las.</p>
<table><tr><th>Peça</th><th>Papel</th></tr>
<tr><td>Cliente / host</td><td>O assistente ou app de IA (Claude, editores de código, outros)</td></tr>
<tr><td>Servidor MCP</td><td>Programa que oferece ferramentas, recursos e prompts</td></tr>
<tr><td>Ferramentas</td><td>Ações que o modelo pode executar</td></tr>
<tr><td>Recursos</td><td>Dados que podem ser lidos (arquivos, registros)</td></tr></table>
<p>Na prática, os "conectores" dos assistentes (Google Drive, agenda, e-mail, Notion e muitos outros) costumam usar MCP por baixo.</p>
<h4>Segurança com ferramentas</h4>
<ul><li>Dê às ferramentas só as permissões necessárias (ler é diferente de apagar).</li>
<li>Peça confirmação humana antes de ações irreversíveis (enviar, pagar, apagar).</li>
<li>Cuidado com <b>prompt injection</b>: textos de páginas, e-mails ou arquivos podem conter instruções maliciosas que tentam manipular o modelo. Trate conteúdo externo como dado, não como ordem.</li>
<li>Instale servidores MCP só de fontes confiáveis.</li></ul>`,

L("Agentes de IA: o que são e como usar",`<h4>Do chat ao agente</h4>
<p>Um chat responde. Um <b>agente</b> recebe um objetivo e trabalha em várias etapas: planeja, usa ferramentas (navegador, terminal, arquivos, apps), observa os resultados, corrige o rumo e entrega. É a evolução mais importante da IA recente.</p>
<h4>Tipos de agentes disponíveis</h4>
<table><tr><th>Tipo</th><th>Exemplos</th><th>Bom para</th></tr>
<tr><td>Agentes de programação</td><td>Claude Code, OpenAI Codex, Gemini CLI, GitHub Copilot (modo agente), Cursor</td><td>Criar e corrigir programas, scripts e sites inteiros</td></tr>
<tr><td>Agentes de pesquisa</td><td>Modos de pesquisa aprofundada dos assistentes</td><td>Relatórios com muitas fontes</td></tr>
<tr><td>Agentes de navegador</td><td>Extensões e modos agente que clicam e preenchem sites</td><td>Comparar preços, preencher formulários, reservas (com supervisão)</td></tr>
<tr><td>Agentes de computador</td><td>IA que vê a tela e usa aplicativos</td><td>Tarefas em programas sem API</td></tr>
<tr><td>Agentes de tarefas</td><td>Assistentes que trabalham em segundo plano com arquivos e conectores</td><td>Organizar documentos, produzir entregas completas</td></tr></table>
<h4>Claude Code na prática (exemplo de agente de programação)</h4>
<ol><li>Instale conforme a documentação oficial e abra numa pasta de projeto.</li>
<li>Descreva o objetivo: "Crie um site de receitas da família com busca por ingrediente, em HTML, CSS e JavaScript, e um arquivo LEIAME."</li>
<li>O agente propõe um plano, cria os arquivos, roda e testa.</li>
<li>Você revisa, pede ajustes e aprova as ações.</li></ol>
<p>Um arquivo de instruções do projeto (no Claude Code, o CLAUDE.md) guarda preferências e regras para o agente seguir sempre.</p>
<h4>Como delegar bem para um agente</h4>
<ul><li><b>Objetivo claro</b> e critério de pronto: "está pronto quando...".</li>
<li><b>Contexto e restrições</b>: onde estão os arquivos, o que não pode mexer.</li>
<li><b>Etapas de verificação</b>: "rode os testes", "mostre antes de enviar".</li>
<li><b>Pontos de aprovação</b> para ações sensíveis (pagar, enviar, apagar, publicar).</li>
<li>Comece com tarefas pequenas e aumente a autonomia conforme ganhar confiança.</li></ul>
<h4>Limites atuais</h4>
<ul><li>Agentes erram, principalmente em tarefas longas e ambíguas; revise os resultados.</li>
<li>Sites com captcha, login complexo ou mudanças de layout atrapalham.</li>
<li>Custam mais (mais tokens e tempo) que um chat simples.</li>
<li>Riscos de segurança: permissões amplas e prompt injection.</li></ul>
<h4>Para onde vai</h4>

L("Modelos locais e de código aberto",`<h4>O que são modelos abertos</h4>
<p>Modelos com pesos disponíveis para baixar e rodar no seu computador ou servidor: famílias como Llama (Meta), Qwen (Alibaba), Mistral, Gemma (Google), DeepSeek, Phi (Microsoft) e outras. Licenças variam: algumas permitem uso comercial amplo, outras têm restrições.</p>
<h4>Por que rodar localmente</h4>
<ul><li><b>Privacidade</b>: os dados não saem do seu computador.</li>
<li><b>Sem custo por uso</b> depois de instalado.</li>
<li><b>Funciona offline</b>.</li>
<li><b>Aprendizado e personalização</b>.</li></ul>
<p>Desvantagens: modelos que rodam em computadores comuns são menos capazes que os maiores modelos de nuvem; exigem memória e, de preferência, placa de vídeo.</p>
<h4>Ferramentas para começar</h4>
<table><tr><th>Ferramenta</th><th>Perfil</th></tr>
<tr><td>Ollama</td><td>Linha de comando simples: ollama run nome-do-modelo; também oferece API local</td></tr>
<tr><td>LM Studio</td><td>Interface gráfica para baixar e conversar com modelos</td></tr>
<tr><td>Jan, GPT4All</td><td>Apps de chat local</td></tr>
<tr><td>Open WebUI</td><td>Interface web estilo ChatGPT para modelos locais</td></tr>
<tr><td>Hugging Face</td><td>Repositório de modelos, dados e demonstrações</td></tr></table>
<h4>Quanto de máquina precisa</h4>
<table><tr><th>Tamanho do modelo</th><th>Memória aproximada (quantizado em 4 bits)</th><th>Uso</th></tr>
<tr><td>1 a 4 bilhões de parâmetros</td><td>2 a 4 GB</td><td>Tarefas simples, roda até em notebooks modestos</td></tr>
<tr><td>7 a 9 bilhões</td><td>5 a 8 GB</td><td>Bom equilíbrio para uso pessoal</td></tr>
<tr><td>12 a 32 bilhões</td><td>8 a 24 GB</td><td>Qualidade maior, pede placa de vídeo boa ou Mac com muita memória</td></tr>
<tr><td>70 bilhões ou mais</td><td>40 GB ou mais</td><td>Estações de trabalho</td></tr></table>
<p><b>Quantização</b> reduz a precisão dos números do modelo (por exemplo, para 4 bits) para caber em menos memória, com pequena perda de qualidade. Os valores são aproximados e variam por modelo e formato.</p>
<h4>Usando a API local do Ollama em Python</h4>
<pre><code>import requests
r = requests.post("http://localhost:11434/api/generate",
                  json={"model": "NOME-DO-MODELO", "prompt": "Resuma em 3 tópicos: ...", "stream": False})
print(r.json()["response"])</code></pre>
<h4>Quando usar local × nuvem</h4>
<table><tr><th>Local</th><th>Nuvem</th></tr>
<tr><td>Dados muito sensíveis (documentos pessoais, saúde)</td><td>Tarefas complexas e raciocínio difícil</td></tr>
<tr><td>Volume grande de tarefas simples (classificar, resumir curto)</td><td>Programação séria e agentes</td></tr>
<tr><td>Sem internet</td><td>Multimodal avançado, busca na web</td></tr></table>`,

L("Escolhendo e avaliando modelos: qualidade, custo e confiança",`<h4>Critérios de escolha</h4>
<table><tr><th>Critério</th><th>Perguntas</th></tr>
<tr><td>Qualidade na tarefa</td><td>Escreve bem em português? acerta raciocínios? programa bem?</td></tr>
<tr><td>Velocidade</td><td>Responde rápido o suficiente para o uso?</td></tr>
<tr><td>Custo</td><td>Plano mensal ou preço por token cabe no orçamento?</td></tr>
<tr><td>Contexto</td><td>Aceita o tamanho dos documentos que preciso?</td></tr>
<tr><td>Recursos</td><td>Busca, voz, imagens, arquivos, agentes, integrações</td></tr>
<tr><td>Privacidade</td><td>Como os dados são tratados? há opção de não treinar?</td></tr>
<tr><td>Confiabilidade</td><td>Alucina pouco? admite quando não sabe?</td></tr></table>
<h4>Benchmarks: úteis, mas com cautela</h4>
<p>Empresas divulgam resultados em testes padronizados (matemática, programação, conhecimento geral, raciocínio). Rankings feitos por votação de usuários, como o LMArena, comparam modelos às cegas. Cuidados: um modelo pode ir bem no teste e mal na sua tarefa; resultados envelhecem rápido; alguns testes vazam para os dados de treino. O melhor benchmark é o seu.</p>
<h4>Monte sua avaliação pessoal</h4>
<ol><li>Escolha 10 tarefas reais e representativas do seu uso.</li>
<li>Escreva o mesmo prompt para todos os modelos.</li>
<li>Defina critérios e notas de 1 a 5 (correção, clareza, utilidade, formato, tom).</li>
<li>Avalie às cegas quando possível (peça a alguém para embaralhar as respostas).</li>
<li>Repita a cada poucos meses: os modelos mudam.</li></ol>
<h4>Estratégia de custo</h4>
<ul><li>Use modelos menores e baratos para tarefas simples e em grande volume.</li>
<li>Reserve os maiores e o raciocínio estendido para o que é difícil.</li>
<li>Em APIs, aproveite recursos como cache de prompt e processamento em lote, que reduzem custos.</li>
<li>Defina limites de gasto.</li></ul>
<h4>Combinando modelos</h4>
<p>Uma prática poderosa: um modelo gera, outro revisa. Ou peça a dois assistentes a mesma análise importante e compare. Diferenças apontam onde verificar.</p>
<h4>Verificação de fatos: o método SIFT</h4>
<p><b>S</b>top (pare antes de compartilhar), <b>I</b>nvestigate the source (quem disse?), <b>F</b>ind better coverage (outras fontes confirmam?), <b>T</b>race claims (volte à fonte original). Vale para respostas de IA, notícias e redes sociais.</p>
<h4>Acompanhando a evolução</h4>
<p>O campo muda toda semana. Siga os blogs oficiais das empresas (Anthropic, OpenAI, Google, Microsoft, Meta), newsletters confiáveis de IA e canais educativos. Teste novidades com sua avaliação pessoal em vez de acreditar em promessas.</p>`,

L("Ética, riscos, regulação e o futuro",`<h4>Riscos que todo usuário deve conhecer</h4>
<table><tr><th>Risco</th><th>Como se manifesta</th><th>Como mitigar</th></tr>
<tr><td>Alucinação</td><td>Fatos, números e fontes inventados</td><td>Verificar, pedir fontes, usar documentos</td></tr>
<tr><td>Vieses</td><td>Respostas que reproduzem preconceitos dos dados</td><td>Pedir perspectivas diversas, revisar criticamente</td></tr>
<tr><td>Privacidade</td><td>Dados pessoais expostos ou usados para treino</td><td>Configurações, anonimizar, modelos locais</td></tr>
<tr><td>Deepfakes e golpes</td><td>Vozes e vídeos falsos, phishing perfeito</td><td>Verificar por canais conhecidos, palavra-código</td></tr>
<tr><td>Prompt injection</td><td>Conteúdo externo manipula agentes</td><td>Permissões mínimas, confirmação humana</td></tr>
<tr><td>Dependência</td><td>Perder habilidades por não praticar</td><td>Usar para aprender, não só para terceirizar</td></tr>
<tr><td>Desinformação em massa</td><td>Conteúdo falso convincente circulando</td><td>Verificação (SIFT), fontes confiáveis</td></tr></table>
<h4>Direitos autorais</h4>
<p>Há debates e processos judiciais no mundo sobre o uso de obras protegidas no treino de modelos e sobre a autoria de conteúdo gerado por IA. Em muitos países, obras geradas só por máquina não recebem proteção de direito autoral da mesma forma que obras humanas. No uso pessoal: não use IA para copiar obras de terceiros, cite fontes, respeite marcas e personagens protegidos e verifique os termos da plataforma antes de uso comercial.</p>
<h4>Regulação</h4>
<ul><li><b>União Europeia</b>: o AI Act, em vigor desde 2024 com aplicação gradual, classifica sistemas por risco (inaceitável, alto, limitado, mínimo) e impõe obrigações de transparência, como rotular deepfakes.</li>
<li><b>Brasil</b>: a LGPD já se aplica ao tratamento de dados pessoais por sistemas de IA; o PL 2338/2023, sobre o marco legal da IA, foi aprovado no Senado e segue em tramitação (confira a situação atual). O TSE tem regras sobre uso de IA em propaganda eleitoral.</li>
<li>Outros países adotam leis, diretrizes e compromissos voluntários das empresas.</li></ul>
<h4>Segurança em IA (AI safety)</h4>
<p>Empresas e pesquisadores trabalham para que sistemas cada vez mais capazes sejam seguros, honestos e alinhados aos valores humanos: testes de riscos, políticas de uso, interpretabilidade, limites para usos perigosos. Como usuário, você contribui usando com responsabilidade e reportando problemas.</p>
<h4>Princípios pessoais de uso responsável</h4>
<ol><li>Transparência: diga quando um conteúdo foi feito com IA, se isso importar para quem recebe.</li>
<li>Verificação: confira antes de compartilhar ou decidir.</li>
<li>Respeito: não crie conteúdo que engane ou prejudique pessoas.</li>
<li>Privacidade: proteja seus dados e os dos outros.</li>
<li>Aprendizado: use a IA para crescer, não para parar de pensar.</li></ol>
<h4>Trabalho e sociedade</h4>
<p>A IA muda profissões e tarefas, criando oportunidades e desafios. As habilidades que mais valorizam quem usa IA: pensamento crítico, comunicação clara, criatividade, conhecimento do domínio, capacidade de aprender continuamente e ética. Exatamente o que você desenvolveu neste curso.</p>`,

<h4>Ideias de projetos</h4>

<li><b>Tutor dos meus cursos</b>: RAG com as apostilas da Central de Estudos + gerador de flashcards para o Anki + resumo semanal em áudio.</li>

<h4>Etapas</h4>

<li><b>Construção</b>: comece pelo mínimo que funciona e melhore em ciclos.</li>
<li><b>Testes</b>: use por pelo menos 2 semanas; anote falhas e melhorias.</li>
<li><b>Segurança e privacidade</b>: dados protegidos, chaves seguras, permissões mínimas.</li>
<li><b>Documentação</b>: LEIAME com o que faz, como usar, como manter e limitações.</li>
<li><b>Apresentação</b>: vídeo ou apresentação de 5 a 10 minutos.</li></ol>
<h4>Critérios de avaliação</h4>
<table><tr><th>Critério</th><th>Peso</th></tr>
<tr><td>Resolve um problema real e mensurável</td><td>25%</td></tr>
<tr><td>Uso adequado de pelo menos 3 blocos</td><td>25%</td></tr>

<tr><td>Segurança, privacidade e ética</td><td>15%</td></tr>
<tr><td>Documentação e apresentação</td><td>15%</td></tr></table>
<h4>Depois do curso</h4>
<p>Mantenha sua biblioteca de prompts e seus projetos atualizados, teste novas ferramentas com sua avaliação pessoal, continue aprendendo programação com projetos práticos e compartilhe o que aprendeu: ensinar é a melhor forma de consolidar. Você termina este curso sabendo usar, construir e avaliar IA no dia a dia.</p>`,

 const add=x=>{const u=typeof x==="string"?enc.encode(x):x;parts.push(u);len+=u.length;};

 const PW=841.89,PH=595.28,cont=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
 add("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
 obj(1,()=>add("<< /Type /Catalog /Pages 2 0 R >>"));
 obj(2,()=>add("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"));
 obj(3,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>`));
 obj(4,()=>add(`<< /Length ${cont.length} >>\nstream\n${cont}\nendstream`));
 obj(5,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);add(img);add("\nendstream");});
 obj(6,()=>add("<< /Title (Certificado - Central de Estudos) /Producer (Central de Estudos) >>"));
 const x=len;let t=`xref\n0 7\n0000000000 65535 f \n`;for(let n=1;n<=6;n++)t+=String(offs[n]).padStart(10,"0")+" 00000 n \n";
 add(t+`trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${x}\n%%EOF`);

}

function espacado(g,t,x,y,sp){const ch=[...t],ws=ch.map(c=>g.measureText(c).width),tot=ws.reduce((a,b)=>a+b,0)+sp*(ch.length-1);const al=g.textAlign;g.textAlign="left";let px=x-tot/2;ch.forEach((c,i)=>{g.fillText(c,px,y);px+=ws[i]+sp;});g.textAlign=al;}
function quebra(g,t,x,y,mw,lh){const ws=t.split(" ");let l="",yy=y;for(const w of ws){const tt=l?l+" "+w:w;if(g.measureText(tt).width>mw&&l){g.fillText(l,x,yy);l=w;yy+=lh;}else l=tt;}if(l)g.fillText(l,x,yy);return yy;}
function cantos(g,x1,y1,x2,y2,cor,u){g.strokeStyle=cor;g.lineWidth=3*u;const s=60*u;[[x1,y1,1,1],[x2,y1,-1,1],[x1,y2,1,-1],[x2,y2,-1,-1]].forEach(([x,y,a,b])=>{g.beginPath();g.moveTo(x+a*s,y+b*14*u);g.lineTo(x+a*14*u,y+b*14*u);g.lineTo(x+a*14*u,y+b*s);g.stroke();g.beginPath();g.arc(x+a*30*u,y+b*30*u,5*u,0,7);g.fillStyle=cor;g.fill();});}
function roseta(g,x,y,r,ouro,cor,u){g.save();g.fillStyle=ouro;g.beginPath();const n=24;for(let i=0;i<=n*2;i++){const a=i*Math.PI/n,rr2=i%2?r:r*0.9;g.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}g.fill();
 g.beginPath();g.arc(x,y,r*0.8,0,7);g.fillStyle=cor;g.fill();g.strokeStyle="rgba(255,255,255,.7)";g.lineWidth=3*u;g.beginPath();g.arc(x,y,r*0.72,0,7);g.stroke();g.restore();}
function motivo(g,tipo,x,y,u,larg){
 const s=u;
 if(tipo==="ing"){ // balões de conversa e letras
  for(let i=-3;i<=3;i++){const yy=y+i*230*s,xx=x+(i%2?-40:40)*s;rr(g,xx-110*s,yy-60*s,220*s,120*s,40*s);g.stroke();g.beginPath();g.moveTo(xx-40*s,yy+60*s);g.lineTo(xx-60*s,yy+100*s);g.lineTo(xx-5*s,yy+60*s);g.stroke();
   g.font=`700 ${Math.round(60*s)}px 'Space Grotesk',sans-serif`;g.textAlign="center";g.fillText(["Hi!","A–Z","EN","C2","ABC","Yes","Go!"][i+3],xx,yy+22*s);}
 }else if(tipo==="aud"){ // lupas e checklists
  for(let i=-3;i<=3;i++){const yy=y+i*230*s,xx=x+(i%2?-30:30)*s;
   if(i%2){rr(g,xx-70*s,yy-90*s,140*s,180*s,14*s);g.stroke();for(let k=0;k<3;k++){g.beginPath();g.moveTo(xx-40*s,yy-40*s+k*45*s);g.lineTo(xx-25*s,yy-25*s+k*45*s);g.lineTo(xx-5*s,yy-55*s+k*45*s);g.stroke();g.beginPath();g.moveTo(xx+10*s,yy-40*s+k*45*s);g.lineTo(xx+45*s,yy-40*s+k*45*s);g.stroke();}}
   else{g.beginPath();g.arc(xx-15*s,yy-15*s,60*s,0,7);g.stroke();g.beginPath();g.moveTo(xx+28*s,yy+28*s);g.lineTo(xx+85*s,yy+85*s);g.stroke();}}
 }else if(tipo==="sgi"){ // três anéis integrados
  for(let i=-2;i<=2;i++){const yy=y+i*320*s;[[0,-50],[-50,35],[50,35]].forEach(([a,b])=>{g.beginPath();g.arc(x+a*s,yy+b*s,75*s,0,7);g.stroke();});}
 }else{ // rede neural
  const pts=[];for(let i=0;i<26;i++){const a=i*2.39996,r=Math.sqrt(i+0.5)*Math.min(larg,900*s)*0.17;pts.push([x+Math.cos(a)*r*0.9,y+Math.sin(a)*r*2.4]);}
  pts.forEach((p,i)=>{pts.slice(i+1,i+4).forEach(q=>{g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke();});g.beginPath();g.arc(p[0],p[1],14*s,0,7);g.fill();});
 }
}

/* leitor */
const reader=document.getElementById("reader"),sheet=document.getElementById("sheet");let lastFocus=null;
const quizHtml=(q,qi,rev)=>`<div class="quiz"><h4>${rev?"Questão "+(qi+1):"Exercício "+(qi+1)}: ${q[0]}</h4>${q[1].map((t,i)=>`<button class="opt" data-i="${i}">${t}</button>`).join("")}<p class="fb" hidden></p></div>`;
function openW(c,i){const lv=lvAtual(),cur=history.state||{};
 if(lv===0){history.pushState({lv:1,c:c.id},"",BASEURL+"#"+c.id);history.pushState({lv:2,c:c.id,i},"",BASEURL+"#"+c.id);}
 else if(lv===1){if(cur.c!==c.id)history.replaceState({lv:1,c:c.id},"",BASEURL+"#"+c.id);history.pushState({lv:2,c:c.id,i},"",BASEURL+"#"+c.id);}
 else history.replaceState({lv:2,c:c.id,i},"",BASEURL+"#"+c.id);
 if(route!==c.id){route=c.id;tab="curso";render();}
 showW(c,i);}
function showW(c,i){
 const x=c.L[i],m=c.mods[x.mi];sheet.className="sheet c-"+c.id;let body="",qs=[];
 if(x.rev){qs=m.a.flatMap(a=>a.q);
  body=`<div class="lesson"><p>Semana de revisão do módulo <b>${m.n}</b>. Releia os pontos-chave, refaça as atividades pendentes e responda as ${qs.length} questões. Objetivo do módulo: ${m.o}</p></div>
  ${m.a.map(a=>`<div class="box"><h4>${esc(a.t)}</h4><ul>${a.k.map(p=>`<li>${p}</li>`).join("")}</ul></div>`).join("")}
  <div class="box task"><h4>Atividade de revisão</h4><div class="lesson"><p>Faça um resumo de uma página do módulo com suas palavras e um mapa mental ligando os temas.</p></div></div>
  ${qs.map((q,qi)=>quizHtml(q,qi,true)).join("")}`;}
 else{const a=x.a;qs=a.q;
  body=`<div class="lesson">${a.c}</div><div class="box"><h4>Pontos-chave</h4><ul>${a.k.map(p=>`<li>${p}</li>`).join("")}</ul></div>
  <div class="box"><h4>Na prática</h4><div class="lesson"><p>${a.ex}</p></div></div>
  <div class="box task"><h4>Atividade da semana</h4><div class="lesson"><p>${a.at}</p></div></div>
  ${qs.map((q,qi)=>quizHtml(q,qi,false)).join("")}`;}
 sheet.innerHTML=`<div class="sheet-top"><span class="k nowrap">${c.curto} · Módulo ${x.mi+1} · Semana ${x.i+1} de ${c.L.length}</span><div class="st-r"><button class="x fs" id="lFull" aria-label="Tela cheia" title="Tela cheia"></button><button class="x" id="lClose" aria-label="Fechar aula">×</button></div></div>
  <div><h2 id="lTitle">${esc(x.t)}</h2><div class="when num">Aula de ${DSEM[c.dia]}, ${dmy(x.aula)} · semana ${x.i+1} · ${c.horas} h de estudo</div></div>${body}
  <label class="donechk"><input type="checkbox" id="lDone" ${st.feito[x.k]?"checked":""}> Semana concluída</label>
  <div class="nav"><button class="btn" id="lPrev" ${i===0?"disabled":""}>← Anterior</button><button class="btn main" id="lNext">${i===c.L.length-1?"Concluir curso":"Concluir e avançar →"}</button></div>`;
 sheet.querySelectorAll(".quiz").forEach((qz,qi)=>qz.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const q=qs[qi],ok=+b.dataset.i===q[2];
  qz.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));b.classList.add(ok?"right":"wrong");
  const fb=qz.querySelector(".fb");fb.hidden=false;fb.innerHTML=ok?"<b>Certo.</b> "+q[3]:"<b>Ainda não.</b> Releia a aula e tente outra opção.";}));
 sheet.querySelector("#lClose").onclick=closeW;
 const fsIco=f=>f?'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 2v5H2M11 2v5h5M7 16v-5H2M11 16v-5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>':'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 7V2h5M16 7V2h-5M2 11v5h5M16 11v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 const telaCheia=()=>{try{return localStorage.getItem("ceTela")==="full";}catch(e){return false;}};
 const aplicaTela=()=>{const f=telaCheia();sheet.classList.toggle("full",f);const b=sheet.querySelector("#lFull");b.innerHTML=fsIco(f);b.title=b.ariaLabel=f?"Sair da tela cheia":"Tela cheia";};
 aplicaTela();sheet.querySelector("#lFull").onclick=()=>{try{localStorage.setItem("ceTela",telaCheia()?"meia":"full");}catch(e){}aplicaTela();};
 sheet.querySelector("#lDone").onchange=e=>{setDone(x.k,e.target.checked);render();};
 sheet.querySelector("#lPrev").onclick=()=>openW(c,i-1);
 sheet.querySelector("#lNext").onclick=()=>{setDone(x.k,true);render();if(i<c.L.length-1)openW(c,i+1);else{tab="cert";closeW();}};
 if(reader.hidden){lastFocus=document.activeElement;reader.hidden=false;document.body.style.overflow="hidden";}
 prepTabelas(sheet);
 sheet.scrollTop=0;sheet.querySelector("#lClose").focus();
}

/* tabelas das aulas: no celular cada coluna ganha largura pelo tamanho do texto e a tabela rola para o lado */
const swSvg='<svg width="14" height="10" viewBox="0 0 14 10" aria-hidden="true"><path d="M1 5h12M9 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function prepTabelas(root){
 root.querySelectorAll(".lesson table").forEach(t=>{
  if(t.closest(".tblx"))return;
  let d=t.parentElement.classList.contains("tbl")?t.parentElement:null;
  if(!d){d=document.createElement("div");d.className="tbl";t.before(d);d.append(t);}
  const x=document.createElement("div");x.className="tblx";d.before(x);
  x.innerHTML=`<div class="tblhint"><span class="sw">${swSvg} Arraste para o lado</span><span class="dots"></span></div>`;x.append(d);
  const col=[];
  [...t.rows].forEach(r=>{let ci=0;[...r.cells].forEach(cel=>{const L=cel.textContent.trim().replace(/\s+/g," ").length;if(L<=12)cel.classList.add("nw");
   const span=cel.colSpan||1;if(span===1)col[ci]=Math.max(col[ci]||0,L);ci+=span;});});
  const larg=L=>L<=12?Math.max(48,L*8.6+20):L<=30?130:L<=70?165:L<=140?205:245;
  const ncol=col.length;
  if(ncol>=3||col.some(L=>L>70)){const tw=Math.round(col.reduce((s,L)=>s+larg(L),0));t.style.setProperty("--tw",tw+"px");}
  if(ncol>=3&&(col[0]||0)<=28)x.classList.add("stk");
  const dots=x.querySelector(".dots");
  const upd=()=>{const max=d.scrollWidth-d.clientWidth,sc=max>4;x.classList.toggle("sc",sc);
   x.classList.toggle("l",sc&&d.scrollLeft>4);x.classList.toggle("r",sc&&d.scrollLeft<max-4);
   if(!sc){dots.innerHTML="";return;}
   const pg=Math.min(6,Math.max(2,Math.ceil(d.scrollWidth/d.clientWidth))),at=Math.round(d.scrollLeft/max*(pg-1));
   if(dots.children.length!==pg)dots.innerHTML="<i></i>".repeat(pg);
   [...dots.children].forEach((e,k)=>e.classList.toggle("on",k===at));};
  d.addEventListener("scroll",()=>{x.classList.add("mexeu");upd();},{passive:true});
  x.querySelector(".sw").onclick=()=>d.scrollBy({left:d.clientWidth*.8});
  x.querySelector(".sw").style.cursor="pointer";
  upd();requestAnimationFrame(upd);
  if(window.ResizeObserver)new ResizeObserver(upd).observe(d);
 });
}
function closeW(){if(lvAtual()===2&&!reader.hidden){history.back();return;}hideW();}
function hideW(){reader.hidden=true;document.body.style.overflow="";if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}
reader.addEventListener("click",e=>{if(e.target===reader)closeW();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!reader.hidden)closeW();});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});}catch(e){}
render();
if(lessonInicial){const c=C.find(x=>x.id===lessonInicial.c);if(c)showW(c,lessonInicial.i);}

<script>

(function(){
 if("serviceWorker" in navigator && location.protocol.startsWith("http"))
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
 const modal=document.getElementById("instModal"),box=document.getElementById("instBox");
 const instalado=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
 const ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 const android=/android/i.test(ua);
 let pedido=null,feito=false;
 const shareIc='<svg class="ic" width="18" height="18" viewBox="0 0 18 18"><path d="M9 2v9M6 5l3-3 3 3M4 8v7h10V8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

 modal.addEventListener("click",e=>{if(e.target===modal)modal.hidden=true;});
 const atualiza=()=>{if(typeof painelConta==="function")painelConta();};
 window.PWA={
  pode:()=>!feito&&!instalado()&&!!(pedido||ios||android),
  texto:()=>ios?"Adicione à Tela de Início do iPhone":android?"Ícone na tela do celular, abre em tela cheia":"Abre em janela própria, como um programa",
  instalar:async()=>{
   if(pedido){pedido.prompt();const r=await pedido.userChoice;pedido=null;if(r.outcome==="accepted")feito=true;atualiza();return;}
   if(ios)abrir(`<h3>Instalar no iPhone</h3><ol><li>Abra este site no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b> ${shareIc} na barra de baixo.</li><li>Toque em <b>Adicionar à Tela de Início</b> e depois em <b>Adicionar</b>.</li></ol><p class="note">O ícone "Estudos" aparece na tela inicial e abre em tela cheia, como um app.</p>`);
   else if(android)abrir(`<h3>Instalar no Android</h3><ol><li>Abra este site no <b>Chrome</b>.</li><li>Toque no menu <b>⋮</b> no canto de cima.</li><li>Toque em <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>).</li></ol><p class="note">O ícone "Estudos" aparece junto com os outros apps.</p>`);
   else abrir(`<h3>Instalar no computador</h3><ol><li>No Chrome ou Edge, clique no ícone de instalar na barra de endereço (à direita).</li><li>Confirme em <b>Instalar</b>.</li></ol>`);
  }};
 window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();pedido=e;atualiza();});
 window.addEventListener("appinstalled",()=>{feito=true;pedido=null;atualiza();});
})();
