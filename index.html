<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central de Estudos</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b3a75">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estudos">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2034%2034%22%3E%3Crect%20width%3D%2234%22%20height%3D%2234%22%20rx%3D%229%22%20fill%3D%22%230b3a75%22/%3E%3Cpath%20d%3D%22M8%2022%2017%2011l9%2011%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%2217%22%20cy%3D%2211%22%20r%3D%222.6%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: início (4 cursos + financeiro geral) → página de cada curso com abas Curso, Trilha, Financeiro, Leituras, Certificado; leitor de aula em painel lateral */
:root{
  --bg:#f2f5fa; --surface:#fff; --raise:#f7f9fc; --line:#dbe2ee; --fg:#101c33; --muted:#5b6a83; --navy:#0b3a75;
  --sgi:#1559b8; --ia:#0e8a78; --aud:#6b3fc0; --ing:#cf6a0c;
  --sgi-s:#e5eefb; --ia-s:#e0f4f0; --aud-s:#eee8fa; --ing-s:#fcefe2;
  --ok:#2e7d32; --warn:#c0392b; --late:#b26a00;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --cert:"Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1220; --surface:#111b2e; --raise:#16233a; --line:#26344d; --fg:#e8eefa; --muted:#9caccb; --navy:#9cc3f7;
  --sgi:#6aa5f0; --ia:#4fd1bd; --aud:#b49af0; --ing:#f5a54a;
  --sgi-s:#152a4a; --ia-s:#0f2f2b; --aud-s:#251c42; --ing-s:#33230f; --ok:#6cc070; --warn:#ef7a6b; --late:#f0b252; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1220; --surface:#111b2e; --raise:#16233a; --line:#26344d; --fg:#e8eefa; --muted:#9caccb; --navy:#9cc3f7;
  --sgi:#6aa5f0; --ia:#4fd1bd; --aud:#b49af0; --ing:#f5a54a;
  --sgi-s:#152a4a; --ia-s:#0f2f2b; --aud-s:#251c42; --ing-s:#33230f; --ok:#6cc070; --warn:#ef7a6b; --late:#f0b252; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{color:var(--muted);font-size:.84rem;margin:0}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c,var(--navy));outline-offset:2px}
.c-sgi{--c:var(--sgi);--cs:var(--sgi-s)} .c-ia{--c:var(--ia);--cs:var(--ia-s)} .c-aud{--c:var(--aud);--cs:var(--aud-s)} .c-ing{--c:var(--ing);--cs:var(--ing-s)}

/* topo */
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.brand{display:flex;gap:10px;align-items:center;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand h1{font-size:1.35rem;color:var(--navy)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip[aria-current="page"]{background:var(--c,var(--navy));border-color:var(--c,var(--navy));color:#fff}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-current="page"] i{background:#fff}
.sync{font-size:.75rem;color:var(--muted)}

/* início */
.hero{display:grid;gap:6px}
.hero h2{font-size:clamp(1.5rem,3.6vw,2.1rem);color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--navy);white-space:nowrap}
.kpi span{font-size:.8rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;min-width:0}
.ccard .band{background:var(--c);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.band svg{flex:none}
.ccard .band h3{font-size:1.05rem}
.ccard .band small{opacity:.85;font-size:.78rem}
.ccard .body{padding:14px 16px;display:grid;gap:10px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--cs) 0);display:grid;place-items:center;flex:none}
.ring span{background:var(--surface);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.85rem}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.row > div{min-width:0}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.late{background:color-mix(in srgb,var(--late) 18%,transparent);color:var(--late)}
.pill.wait{background:var(--cs);color:var(--c)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--c)}
.btn.main{background:var(--c);border-color:var(--c);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.chart{overflow-x:auto}.chart svg{display:block;min-width:700px;width:100%;height:auto}

/* curso */
.chero{background:var(--c);color:#fff;border-radius:16px;padding:20px;display:grid;gap:14px;position:relative;overflow:hidden}
.chero .motif{position:absolute;right:-30px;top:-30px;opacity:.14;pointer-events:none}
.chero h2{font-size:clamp(1.3rem,3.4vw,1.9rem)}
.chero .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem;opacity:.95}
.chero .bar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.chero .bar i{display:block;height:100%;background:#fff;border-radius:99px}
.chero .btn{background:#fff;color:var(--c);border-color:#fff}
.chero .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--c);border-bottom-color:var(--c)}
details.about{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details > summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"+";color:var(--c);font-weight:700;font-size:1.1rem}
details[open] > summary::after{content:"–"}
.about p{margin:0;padding:0 14px 12px;color:var(--muted)}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mod > summary{padding:12px 14px}
.mod .mh{display:flex;gap:12px;align-items:center;min-width:0;flex:1}
.mnum{width:34px;height:34px;border-radius:9px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:none}
.mod.done .mnum{background:var(--c);color:#fff}
.mod h4{font-size:.98rem}
.mod .sub{font-size:.78rem;color:var(--muted);font-weight:500}
.mod .minibar{width:70px;height:6px;background:var(--cs);border-radius:99px;overflow:hidden;flex:none}
.mod .minibar i{display:block;height:100%;background:var(--c)}
.mobj{padding:0 14px 8px;color:var(--muted);font-size:.86rem;margin:0}
.weeks{list-style:none;margin:0;padding:0 8px 10px;display:grid;gap:2px}
.wk{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;min-width:0}
.wk:hover{background:var(--raise)}
.wk input{accent-color:var(--c);width:17px;height:17px;flex:none}
.wk .open{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.wk .d{font-size:.75rem;color:var(--muted);width:78px;flex:none;white-space:nowrap}
.wk .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wk.done .t{color:var(--muted);text-decoration:line-through}
.wk.now{background:var(--cs)}
.wk .tag{font-size:.68rem;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:5px;padding:0 5px;flex:none}

/* trilha */
.trail{list-style:none;margin:0;padding:8px 0;display:grid}
.stop{display:grid;grid-template-columns:72px 1fr;gap:12px;min-height:84px}
.road{position:relative;display:flex;justify-content:center}
.road::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:10px;margin-left:-5px;background:var(--line);border-radius:6px}
.road .fill{position:absolute;top:0;left:50%;width:10px;margin-left:-5px;background:var(--c);border-radius:6px}
.road::after{content:"";position:absolute;top:0;bottom:0;left:50%;margin-left:-1px;border-left:2px dashed color-mix(in srgb,var(--surface) 80%,transparent)}
.stop:first-child .road::before,.stop:first-child .road::after{top:20px}
.stop:last-child .road::before,.stop:last-child .road::after{bottom:auto;height:22px}
.node{position:relative;z-index:1;margin-top:6px;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--cs) 0);display:grid;place-items:center;box-shadow:0 0 0 4px var(--bg)}
.node span{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--c)}
.stop.done .node span{background:var(--c);color:#fff}
.stop.cur .node{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--bg),0 0 0 9px color-mix(in srgb,var(--c) 30%,transparent)}}
.sinfo{padding-top:8px;min-width:0}
.sinfo h4{font-size:.95rem}
.sinfo .note{font-size:.78rem}
.truck{display:inline-flex;gap:6px;align-items:center;font-size:.74rem;font-weight:700;color:var(--c);margin-top:4px}
.goal .node span{background:var(--c);color:#fff}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;background:var(--raise);color:var(--muted);border:1px dashed var(--line)}
.badge.on{background:var(--c);color:#fff;border:0}

/* financeiro e leituras */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
table.fin{width:100%;border-collapse:collapse;font-size:.88rem}
table.fin th,table.fin td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.fin th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.fin input{accent-color:var(--c);width:16px;height:16px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
/* tudo dentro da tela: nada estica para o lado; tabelas largas rolam dentro da própria caixa */
html,body{overflow-x:hidden;max-width:100%}
#view,#view *,.sheet,.sheet *{min-width:0}
.sheet{grid-template-columns:minmax(0,1fr)}
.sheet h2,.lesson,.box,.mobj,.note{overflow-wrap:break-word}
.lesson img,.lesson svg{max-width:100%;height:auto}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.2em 0 .8em;border-radius:8px;max-width:100%}
.tbl>table{margin:0}
.lesson td,.lesson th{overflow-wrap:normal;word-break:normal;hyphens:manual}
.lesson td.nw,.lesson th.nw{white-space:nowrap}
.lesson pre{max-width:100%;white-space:pre}
@media (max-width:640px){
 .lesson{font-size:.95rem}
 .lesson table{font-size:.82rem}
 .lesson th,.lesson td{padding:5px 6px}
 .sheet h2{font-size:1.25rem}
 .lesson pre{font-size:.78rem}
}
.book{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.book:last-child{border:0}
.spine{width:44px;height:58px;border-radius:3px 6px 6px 3px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 70%,#000) 0 6px,var(--c) 6px);box-shadow:inset -4px 0 0 rgba(255,255,255,.18)}
.book b{display:block;font-size:.92rem}
.book small{color:var(--muted);display:block}
.site{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.site:last-child{border:0}
.site b{color:var(--c)}
.site span{font-size:.82rem;color:var(--muted)}
.site em{font-style:normal;color:var(--c);font-weight:700;flex:none}

/* certificado */
.certwrap{overflow-x:auto}
.cert{min-width:640px;aspect-ratio:1.414;background:#fffdf8;color:#1c2333;border-radius:6px;position:relative;padding:5%;display:grid;align-content:center;justify-items:center;text-align:center;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cert::before{content:"";position:absolute;inset:14px;border:3px solid var(--cc);border-radius:4px}
.cert::after{content:"";position:absolute;inset:22px;border:1px solid var(--cc);border-radius:2px;opacity:.5}
.cert .k{font-family:var(--display);letter-spacing:.3em;font-size:.8rem;color:var(--cc);font-weight:700}
.cert h3{font-family:var(--cert);font-size:2.4rem;font-weight:600;letter-spacing:.04em}
.cert .nm{font-family:var(--cert);font-style:italic;font-size:2.6rem;border-bottom:1px solid #c9ccd6;padding:0 40px 4px;min-width:60%}
.cert p{margin:0;max-width:62ch;font-size:.95rem;color:#3b4459}
.cert .cn{font-family:var(--display);font-size:1.3rem;font-weight:700;color:var(--cc)}
.cert .foot{display:flex;justify-content:space-between;width:80%;margin-top:18px;font-size:.78rem;color:#5b6478}
.cert .seal{position:absolute;right:9%;bottom:12%;width:88px;height:88px;border-radius:50%;background:var(--cc);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.72rem;line-height:1.1;box-shadow:0 0 0 5px #fffdf8,0 0 0 7px var(--cc)}
.certprev{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 2px 14px rgba(20,30,60,.14);background:#fffdf7}
.certprev canvas{display:block;width:100%;height:auto}
.certprev.modelo canvas{opacity:.6;filter:saturate(.75)}
.selo-modelo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);border:3px solid var(--late);color:var(--late);background:rgba(255,253,247,.85);font-family:var(--display);font-weight:700;letter-spacing:.3em;text-transform:uppercase;padding:6px 22px;border-radius:8px;font-size:clamp(.9rem,3vw,1.6rem)}
.certacts{flex-wrap:wrap;gap:12px}
.certbtns{display:flex;gap:8px;flex-wrap:wrap}
/* aula em tela cheia (PC) */
.sheet.full{width:100%;border-left-width:0}
.sheet.full>*{width:100%;max-width:1040px;justify-self:center}
.sheet.full>.lesson{max-width:1040px}
.st-r{display:flex;gap:4px;align-items:center}
.x.fs{font-size:1rem;display:grid;place-items:center}
@media (max-width:800px){.x.fs{display:none}}
.lockmsg{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:grid;gap:4px;font-size:.84rem;font-weight:600}
.field input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:min(360px,100%)}

/* leitor */
[hidden]{display:none!important}
.reader{position:fixed;inset:0;z-index:50;background:rgba(5,12,26,.55);display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(760px,100%);height:100%;overflow-y:auto;border-left:5px solid var(--c);
  padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
.sheet-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.sheet-top .k{font-size:.75rem;color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.x{background:none;border:0;font-size:1.5rem;line-height:1;padding:4px 10px;border-radius:6px;color:var(--muted);cursor:pointer}
.x:hover{background:var(--raise)}
.sheet h2{font-size:1.45rem;color:var(--fg)}
.when{font-size:.84rem;color:var(--muted)}
.lesson{font-size:.98rem;line-height:1.7;max-width:70ch}
.lesson p{margin:0 0 .8em}
.lesson table{border-collapse:collapse;width:100%;font-size:.88rem;margin:.2em 0 .8em}
.lesson th,.lesson td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.lesson th{background:var(--cs)}
.tbl{overflow-x:auto}
.lesson pre{background:var(--raise);border-radius:8px;padding:10px;overflow-x:auto;font-size:.84rem}
.lesson pre code{background:none;padding:0;font-size:1em}
.lesson code{background:var(--raise);padding:1px 5px;border-radius:4px;font-size:.88em}
.box{border-radius:10px;padding:12px 14px;background:var(--cs)}
.box h4{margin:0 0 6px;font-size:.9rem;color:var(--c)}
.box ul{margin:0;padding-left:18px;display:grid;gap:3px}
.box.task{background:var(--raise);border-left:4px solid var(--c)}
.quiz{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px}
.quiz h4{font-size:.95rem}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer}
.opt:hover{border-color:var(--c)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.fb{font-size:.88rem;margin:0}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.donechk{display:flex;gap:8px;align-items:center;font-weight:600}
.donechk input{width:18px;height:18px;accent-color:var(--c)}
@media (max-width:520px){.wk .d{width:88px;font-size:.7rem}.cert{min-width:560px}}
@media (prefers-reduced-motion:reduce){.stop.cur .node{animation:none}}

.menu{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.menu:hover{border-color:var(--navy)}

MOD("ing","A1 · Primeiros passos","Sair do zero: sons do inglês, apresentar-se, falar de pessoas, coisas, números, datas e lugares.",[
L("Alfabeto, sons e como estudar inglês",`<h4>Como este curso funciona</h4>
<p>São 12 módulos, do A1 (iniciante) ao C2 (domínio), seguindo o Quadro Europeu Comum de Referência (CEFR). Cada segunda-feira tem uma aula com explicação, exemplos, atividade e quiz. Entre as aulas, a rotina diária é o que faz você aprender de verdade:</p>
<table><tr><th>Tempo</th><th>O quê</th><th>Ferramenta</th></tr>
<tr><td>10 min</td><td>Vocabulário com repetição espaçada</td><td>Anki ou Quizlet</td></tr>
<tr><td>10 min</td><td>Ouvir algo em inglês</td><td>Podcast, YouTube, série com legenda em inglês</td></tr>
<tr><td>5 min</td><td>Falar em voz alta (shadowing: repetir junto com o áudio)</td><td>Gravador do celular</td></tr></table>
<h4>O alfabeto</h4>
<p>As letras têm nomes diferentes do português, e isso importa para soletrar nomes, e-mails e placas.</p>
<table><tr><th>Letra</th><th>Som aproximado</th><th>Letra</th><th>Som aproximado</th></tr>
<tr><td>A</td><td>êi</td><td>N</td><td>én</td></tr><tr><td>B</td><td>bí</td><td>O</td><td>ôu</td></tr>
<tr><td>C</td><td>Sí</td><td>P</td><td>pí</td></tr><tr><td>D</td><td>dí</td><td>Q</td><td>kiú</td></tr>
<tr><td>E</td><td>Í</td><td>R</td><td>ár</td></tr><tr><td>F</td><td>éf</td><td>S</td><td>És</td></tr>
<tr><td>G</td><td>djí</td><td>T</td><td>Tí</td></tr><tr><td>H</td><td>êitch</td><td>U</td><td>iú</td></tr>
<tr><td>I</td><td>ái</td><td>V</td><td>Ví</td></tr><tr><td>J</td><td>djêi</td><td>W</td><td>dâbliu</td></tr>
<tr><td>K</td><td>kêi</td><td>X</td><td>éks</td></tr><tr><td>L</td><td>él</td><td>Y</td><td>uái</td></tr>
<tr><td>M</td><td>ém</td><td>Z</td><td>zí (EUA) / zéd (Reino Unido)</td></tr></table>
<p>Confusões clássicas de brasileiros: <b>E</b> soa "Í" e <b>I</b> soa "ái"; <b>G</b> soa "djí" e <b>J</b> soa "djêi". Para e-mails: <i>@ = at</i>, <i>. = dot</i>, <i>_ = underscore</i>, <i>- = dash/hyphen</i>.</p>
<h4>Sons que não existem em português</h4>
<ul><li><b>TH</b>: língua entre os dentes. Surdo em <i>think, three</i>; sonoro em <i>this, the, mother</i>. Não é "f" nem "d".</li>
<li><b>H</b> no começo da palavra soa como o "r" de "rato": <i>house, happy, hello</i>.</li>
<li><b>R</b> americano: a língua se curva para trás sem tocar o céu da boca: <i>car, red, world</i>.</li>
<li>Vogais curtas e longas mudam o sentido: <i>ship</i> (navio) × <i>sheep</i> (ovelha); <i>live</i> × <i>leave</i>; <i>full</i> × <i>fool</i>.</li>
<li>Palavras não ganham "i" no final: <i>Facebook</i> é "fêisbuk", não "fêisbuqui"; <i>big</i> é "big", não "bigui".</li></ul>
<h4>Frases de sobrevivência</h4>
<p><i>Hello / Hi. Good morning / afternoon / evening. How are you? – I'm fine, thanks. And you? Nice to meet you. Sorry? Can you repeat, please? Can you speak more slowly? How do you spell that? What does ... mean? Thank you / Thanks. You're welcome. Excuse me. Goodbye / Bye. See you later.</i></p>`,
["Rotina diária de 25 min vale mais que horas uma vez por semana","E = í, I = ái, G = djí, J = djêi","TH com a língua entre os dentes; H inicial soa como 'r' de rato","Vogal curta × longa muda o sentido (ship × sheep)","Não acrescente 'i' no final das palavras"],
`Soletrando um e-mail ao telefone: <i>"My e-mail is ana dot silva at gmail dot com. A-N-A, dot, S-I-L-V-A."</i>`,
`Instale o Anki e crie um baralho "Inglês". Grave você soletrando seu nome completo, seu e-mail e 5 palavras com TH. Ouça e compare com a pronúncia do Google Tradutor ou do Cambridge Dictionary.`,
[["Como se soletra a letra I em inglês?",["Í","ái","êi","iú"],1,"I soa 'ái'. O som 'í' é a letra E."],["Como se lê o símbolo @ num e-mail?",["dot","at","dash","Arroba"],1,"@ = at; ponto = dot."],["Qual par de palavras muda de sentido só pela vogal curta ou longa?",["ship / sheep","car / cars","big / bigger","run / ran"],0,"Ship (navio) tem vogal curta; sheep (ovelha) tem vogal longa."]]),
L("Verb to be: ser e estar",`<h4>Formas</h4>
<table><tr><th>Afirmativa</th><th>Contração</th><th>Negativa</th><th>Pergunta</th></tr>
<tr><td>I am</td><td>I'm</td><td>I'm not</td><td>Am I?</td></tr>
<tr><td>You are</td><td>you're</td><td>you aren't / you're not</td><td>Are you?</td></tr>
<tr><td>He is</td><td>he's</td><td>he isn't</td><td>Is he?</td></tr>
<tr><td>She is</td><td>she's</td><td>she isn't</td><td>Is she?</td></tr>
<tr><td>It is</td><td>it's</td><td>it isn't</td><td>Is it?</td></tr>
<tr><td>We are</td><td>we're</td><td>we aren't</td><td>Are we?</td></tr>
<tr><td>They are</td><td>they're</td><td>they aren't</td><td>Are they?</td></tr></table>
<p><b>It</b> é usado para coisas, animais (quando não sabemos o nome), clima e horas: <i>It's cold. It's 3 o'clock. It's my phone.</i></p>
<h4>Usos do to be</h4>
<ul><li>Nome e identidade: <i>I'm Carlos.</i></li>
<li>Profissão (sempre com a/an): <i>She's a teacher. He's an engineer.</i></li>
<li>Nacionalidade e origem: <i>We're Brazilian. We're from Brazil.</i></li>
<li>Idade: <i>I'm 32 (years old).</i> Nunca "I have 32 years".</li>
<li>Estado e sentimentos: <i>I'm tired. They're hungry. Are you OK?</i></li>
<li>Localização: <i>The keys are on the table. Is she at home?</i></li>
<li>Expressões que em português usam "ter": <i>I'm hungry</i> (tenho fome), <i>I'm thirsty</i> (sede), <i>I'm afraid</i> (medo), <i>I'm right</i> (tenho razão), <i>I'm 20</i> (tenho 20 anos).</li></ul>
<h4>Respostas curtas</h4>
<p><i>Are you married? – Yes, I am. / No, I'm not.</i> Na resposta curta afirmativa não se contrai: diga "Yes, I am", nunca "Yes, I'm".</p>
<h4>Perguntas com to be</h4>
<table><tr><th>Pergunta</th><th>Resposta</th></tr>
<tr><td>What's your name?</td><td>My name's Júlia.</td></tr>
<tr><td>Where are you from?</td><td>I'm from Curitiba.</td></tr>
<tr><td>How old are you?</td><td>I'm 28.</td></tr>
<tr><td>What's your job? / What do you do?</td><td>I'm a nurse.</td></tr>
<tr><td>How are you?</td><td>I'm great / fine / not bad / tired.</td></tr></table>
<h4>Vocabulário de profissões e nacionalidades</h4>
<p><i>doctor, nurse, teacher, student, lawyer, engineer, driver, cook, salesperson, police officer, accountant, designer, farmer, mechanic</i>. Nacionalidades: <i>Brazilian, American, British, Canadian, Mexican, Argentinian, Portuguese, Spanish, French, German, Italian, Chinese, Japanese</i> (sempre com letra maiúscula).</p>`,
["am / is / are; contrações I'm, you're, he's, it's","Profissão sempre com a/an: I'm a teacher","Idade usa to be: I'm 30","Hungry, thirsty, afraid, right usam to be","Resposta curta afirmativa sem contração: Yes, I am"],
`Apresentação completa: <i>"Hi! I'm Rafael. I'm 34 and I'm from Florianópolis, in the south of Brazil. I'm an accountant. I'm married and my wife is a dentist. We're very happy here."</i>`,
`Escreva e grave em voz alta uma apresentação de 8 frases sobre você (nome, idade, cidade, profissão, estado civil, como você está hoje) e 4 frases sobre uma pessoa da família usando he/she.`,
[["Como se diz 'Eu tenho 30 anos'?",["I have 30 years.","I am 30.","I have 30.","I'm 30 years."],1,"Idade em inglês usa o verbo to be: I'm 30 (years old)."],["Qual resposta curta está correta para 'Are you tired?'",["Yes, I'm.","Yes, I am.","Yes, I are.","Yes, am I."],1,"Na resposta curta afirmativa não se usa contração."],["Complete: She ___ an engineer.",["are","am","is","be"],2,"He/she/it usa is."]]),
L("Pronomes, possessivos e o 's",`<h4>Pronomes sujeito, objeto e possessivos</h4>
<table><tr><th>Sujeito</th><th>Objeto</th><th>Adjetivo possessivo</th><th>Pronome possessivo</th></tr>
<tr><td>I</td><td>me</td><td>my</td><td>mine</td></tr>
<tr><td>you</td><td>you</td><td>your</td><td>yours</td></tr>
<tr><td>he</td><td>him</td><td>his</td><td>his</td></tr>
<tr><td>she</td><td>her</td><td>her</td><td>hers</td></tr>
<tr><td>it</td><td>it</td><td>its</td><td>—</td></tr>
<tr><td>we</td><td>us</td><td>our</td><td>ours</td></tr>
<tr><td>they</td><td>them</td><td>their</td><td>theirs</td></tr></table>
<ul><li><b>Sujeito</b> faz a ação: <i>She calls me every day.</i></li>
<li><b>Objeto</b> recebe a ação ou vem depois de preposição: <i>Call him. This gift is for them.</i></li>
<li><b>Adjetivo possessivo</b> vem antes do substantivo: <i>my car, their house</i>.</li>
<li><b>Pronome possessivo</b> substitui o substantivo: <i>This car is mine. Is this yours?</i></li></ul>
<p>Atenção: em inglês o possessivo concorda com o <b>dono</b>, não com a coisa. "A mãe dele" = <i>his mother</i>; "o carro dela" = <i>her car</i>. E o adjetivo possessivo nunca vai para o plural: <i>my friends</i> (não "mys").</p>
<h4>Its × it's</h4>
<p><i>its</i> = dele/dela (coisa, animal): <i>The dog wagged its tail.</i> <i>it's</i> = it is: <i>It's late.</i> É um dos erros mais comuns, até entre nativos.</p>
<h4>O genitivo 's (posse)</h4>
<table><tr><th>Caso</th><th>Regra</th><th>Exemplo</th></tr>
<tr><td>Singular</td><td>+ 's</td><td>my sister's car (o carro da minha irmã)</td></tr>
<tr><td>Plural com s</td><td>Só o apóstrofo</td><td>my parents' house</td></tr>
<tr><td>plural irregular</td><td>+ 's</td><td>the children's room</td></tr>
<tr><td>Dois donos juntos</td><td>'s no último</td><td>John and Mary's wedding</td></tr></table>
<p>Para coisas, prefira <b>of</b>: <i>the end of the movie, the door of the car</i> (ou <i>the car door</i>).</p>
<h4>Família</h4>
<p><i>mother/mom, father/dad, parents, son, daughter, children/kids, brother, sister, siblings, husband, wife, grandmother, grandfather, grandparents, uncle, aunt, cousin, nephew, niece, father-in-law, mother-in-law, brother-in-law, boyfriend, girlfriend, partner.</i></p>
<p>Who × whose: <i>Who is she?</i> (quem) × <i>Whose phone is this?</i> (de quem) – <i>It's Pedro's.</i></p>`,
["Possessivo concorda com o dono: his mother, her car","my/your + substantivo; mine/yours sozinhos","its = dele (coisa); it's = it is","'s para pessoas; parents' (plural com s)","Whose = de quem"],
`<i>"This is my family. My father's name is Antônio and my mother's name is Rosa. My sister has two kids; their names are Leo and Bia. Their dog is small, but its bark is very loud!"</i>`,
`Desenhe sua árvore genealógica com nomes em inglês (uncle, cousin...). Escreva 10 frases usando 's e possessivos, por exemplo: "Ana is my brother's wife."`,
[["Como se diz 'o carro dela'?",["his car","her car","hers car","she's car"],1,"Adjetivo possessivo feminino: her."],["Qual frase está correta?",["The cat is eating it's food.","The cat is eating its food.","The cat is eating its' food.","The cat is eating it food."],1,"Its, sem apóstrofo, é o possessivo."],["A casa dos meus pais:",["my parent's house","my parents' house","my parents's house","the house my parents"],1,"Plural terminado em s recebe só o apóstrofo."]]),
L("Artigos, plurais e this / that / these / those",`<h4>A / an / the</h4>
<ul><li><b>a</b> antes de som de consoante: <i>a car, a book, a university</i> (u soa "iú").</li>
<li><b>an</b> antes de som de vogal: <i>an apple, an hour</i> (h mudo), <i>an e-mail</i>.</li>
<li><b>the</b> = o, a, os, as. Algo específico ou já mencionado: <i>I have a dog. The dog is black.</i></li></ul>
<h4>Quando NÃO usar the</h4>
<ul><li>Generalizações: <i>Dogs are loyal. I love music. Coffee is expensive.</i> (em português diríamos "os cães", "a música").</li>
<li>Nomes de pessoas, cidades e a maioria dos países: <i>Brazil, Paris</i> (exceções: <i>the United States, the UK, the Netherlands</i>).</li>
<li>Refeições, esportes e idiomas: <i>have lunch, play soccer, speak English</i>.</li>
<li>Expressões: <i>at home, at work, go to bed, go to school, by car</i>.</li></ul>
<h4>Plural dos substantivos</h4>
<table><tr><th>Regra</th><th>Exemplo</th></tr>
<tr><td>+ s</td><td>car → cars, book → books</td></tr>
<tr><td>-s, -ss, -sh, -ch, -x, -o + es</td><td>bus → buses, box → boxes, potato → potatoes</td></tr>
<tr><td>Consoante + y → ies</td><td>city → cities, baby → babies (mas day → days)</td></tr>
<tr><td>-f / -fe → ves</td><td>knife → knives, wife → wives, leaf → leaves</td></tr>
<tr><td>Irregulares</td><td>man → men, woman → women, child → children, person → people, foot → feet, tooth → teeth, mouse → mice</td></tr>
<tr><td>Sem mudança</td><td>fish, sheep, series</td></tr></table>
<h4>Demonstrativos</h4>
<table><tr><th></th><th>Perto</th><th>Longe</th></tr>
<tr><td>Singular</td><td>this (este/esta/isto)</td><td>that (aquele/aquilo, esse)</td></tr>
<tr><td>Plural</td><td>these (estes)</td><td>those (aqueles)</td></tr></table>
<p><i>This is my phone. That's your bag over there. These shoes are new. Those people are my neighbors.</i> No telefone: <i>Hi, this is Marcos.</i></p>
<h4>Adjetivos</h4>
<p>Vêm <b>antes</b> do substantivo e não vão para o plural: <i>a big house, two big houses</i> (nunca "bigs"). Básicos: <i>big/small, new/old, good/bad, hot/cold, cheap/expensive, easy/difficult, happy/sad, long/short, beautiful/ugly, fast/slow, clean/dirty, full/empty</i>.</p>`,
["A antes de som de consoante; an antes de som de vogal (an hour)","Generalização sem the: I love music","Plurais irregulares: men, women, children, people","this/these perto; that/those longe","Adjetivo antes do substantivo e sem plural"],
`<i>"Look at those cars! That red one is a Ferrari. These are my keys and this is an old photo of my children."</i>`,
`Ande pela sua casa e diga em voz alta o nome de 20 objetos com a/an e com this/that/these/those. Depois escreva o plural de: knife, city, box, child, tooth, person, bus, day.`,
[["Qual está correto?",["a hour","an hour","the hours a","an houre"],1,"Hour começa com h mudo (som de vogal), por isso an."],["Qual é o plural de child?",["childs","childes","children","childrens"],2,"Child → children (irregular)."],["Como se diz 'Eu amo café' (em geral)?",["I love the coffee.","I love coffee.","I love a coffee.","I love coffees."],1,"Generalizações não usam the."]]),
L("Números, datas, horas e dinheiro",`<h4>Números</h4>
<p>0 zero / oh, 1 one, 2 two, 3 three, 4 four, 5 five, 6 six, 7 seven, 8 eight, 9 nine, 10 ten, 11 eleven, 12 twelve, 13 thirteen, 14 fourteen, 15 fifteen, 16 sixteen, 17 seventeen, 18 eighteen, 19 nineteen, 20 twenty, 21 twenty-one, 30 thirty, 40 forty (sem u!), 50 fifty, 60 sixty, 70 seventy, 80 eighty, 90 ninety, 100 a/one hundred, 1,000 a thousand, 1,000,000 a million, 1,000,000,000 a billion (mil milhões).</p>
<p>Cuidado: <i>thirteen</i> (13) tem acento no fim, "thir-TEEN"; <i>thirty</i> (30) tem acento no início, "THIR-ty". Em números grandes: <i>365 = three hundred and sixty-five</i> (britânico) / <i>three hundred sixty-five</i> (americano). Em inglês, a vírgula separa milhares e o ponto separa decimais: <i>1,500.75</i>.</p>
<h4>Ordinais</h4>
<p>1st first, 2nd second, 3rd third, 4th fourth, 5th fifth, 8th eighth, 9th ninth, 12th twelfth, 20th twentieth, 21st twenty-first, 30th thirtieth.</p>
<h4>Datas</h4>
<ul><li>Meses (com maiúscula): <i>January, February, March, April, May, June, July, August, September, October, November, December</i>.</li>
<li>Dias: <i>Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday</i>.</li>
<li>Americano: mês/dia/ano – 11/10/2026 = November 10th. Britânico: dia/mês – 11/10/2026 = 11th October.</li>
<li>Fala: <i>November tenth</i> (EUA) ou <i>the tenth of November</i> (UK).</li>
<li>Anos: 1998 = <i>nineteen ninety-eight</i>; 2026 = <i>twenty twenty-six</i>; 2005 = <i>two thousand and five</i>.</li>
<li>Preposições: <b>on</b> para dias e datas (<i>on Monday, on May 5th</i>), <b>in</b> para meses, anos e estações (<i>in July, in 2027, in summer</i>), <b>at</b> para horas (<i>at 7 pm</i>).</li></ul>
<h4>Horas</h4>
<table><tr><th>Hora</th><th>Forma simples</th><th>Forma tradicional</th></tr>
<tr><td>7:00</td><td>seven o'clock</td><td>seven o'clock</td></tr>
<tr><td>7:15</td><td>seven fifteen</td><td>a quarter past seven</td></tr>
<tr><td>7:30</td><td>seven thirty</td><td>half past seven</td></tr>
<tr><td>7:45</td><td>seven forty-five</td><td>a quarter to eight</td></tr>
<tr><td>7:10</td><td>seven ten</td><td>ten past seven</td></tr>
<tr><td>7:50</td><td>seven fifty</td><td>ten to eight</td></tr></table>
<p><b>am</b> = da meia-noite ao meio-dia; <b>pm</b> = do meio-dia à meia-noite. 15h = 3 pm. <i>What time is it? – It's half past two.</i></p>
<h4>Dinheiro e preços</h4>
<p><i>How much is it? – It's $12.99 (twelve ninety-nine / twelve dollars and ninety-nine cents). It's R$ 50 (fifty reais).</i> Telefones são lidos número a número: <i>555-0192 = five five five, oh one nine two</i>.</p>`,
["thirteen (acento no fim) × thirty (acento no início)","Vírgula separa milhar, ponto separa decimal","on + dia/data; in + mês/ano; at + hora","EUA: mês/dia; Reino Unido: dia/mês","am antes do meio-dia, pm depois"],

L("There is / there are, preposições de lugar e a casa",`<h4>There is / there are (há, existe, tem)</h4>
<table><tr><th></th><th>Singular</th><th>Plural</th></tr>
<tr><td>Afirmativa</td><td>There's a bank near here.</td><td>There are two bedrooms.</td></tr>
<tr><td>Negativa</td><td>There isn't a pharmacy.</td><td>There aren't any parks.</td></tr>
<tr><td>Pergunta</td><td>Is there a bus stop?</td><td>Are there any restaurants?</td></tr>
<tr><td>Resposta</td><td>Yes, there is. / No, there isn't.</td><td>Yes, there are. / No, there aren't.</td></tr></table>
<p>Erro clássico: dizer "Have a bank near here" traduzindo "tem um banco aqui perto". Para existência, use <b>there is/are</b>; <b>have</b> é para posse (<i>I have a car</i>). Com quantidades: <i>How many people are there? There are about twenty.</i></p>
<h4>Preposições de lugar</h4>
<table><tr><th>Preposição</th><th>Sentido</th><th>Exemplo</th></tr>
<tr><td>in</td><td>Dentro</td><td>in the box, in the kitchen, in Brazil</td></tr>
<tr><td>on</td><td>Sobre, encostado em superfície</td><td>on the table, on the wall, on the second floor</td></tr>
<tr><td>at</td><td>Ponto, local</td><td>at home, at the door, at the bus stop</td></tr>
<tr><td>under</td><td>Embaixo</td><td>under the bed</td></tr>
<tr><td>next to / beside</td><td>Ao lado</td><td>next to the window</td></tr>
<tr><td>between</td><td>Entre (dois)</td><td>between the bank and the café</td></tr>
<tr><td>in front of</td><td>Na frente</td><td>in front of the TV</td></tr>
<tr><td>behind</td><td>Atrás</td><td>behind the door</td></tr>
<tr><td>opposite / across from</td><td>Em frente, do outro lado</td><td>opposite the park</td></tr>
<tr><td>near</td><td>Perto</td><td>near the station</td></tr>
<tr><td>above / below</td><td>Acima / abaixo (sem tocar)</td><td>above the sofa</td></tr></table>
<h4>A casa</h4>
<p>Cômodos: <i>living room, kitchen, bedroom, bathroom, dining room, laundry room, garage, garden/backyard, balcony, hallway, stairs, upstairs, downstairs</i>. Objetos: <i>sofa/couch, armchair, bed, wardrobe/closet, shelf, desk, chair, fridge, stove, oven, microwave, sink, shower, toilet, mirror, lamp, carpet/rug, curtains</i>.</p>
<h4>A cidade e direções simples</h4>
<p><i>supermarket, bakery, drugstore/pharmacy, hospital, bank, post office, gas station, bus stop, square, mall, church, school, hotel, restaurant</i>. Pedir ajuda: <i>Excuse me, is there a pharmacy near here? – Yes, there's one on Main Street, next to the bank. Go straight, turn left, it's on your right.</i></p>`,
["there is/are = existe/há; have = possuir","Is there...? / Are there any...?","in (dentro), on (superfície), at (ponto)","between = entre dois; opposite = em frente","Go straight, turn left/right, it's on your left"],
`<i>"My apartment is small but nice. There are two bedrooms and there's a big balcony. There isn't a garage. My desk is next to the window and there are plants on the shelf above it."</i>`,
`Descreva sua casa em 12 frases usando there is/are e 6 preposições diferentes. Depois desenhe um mapa simples do seu bairro e escreva como ir da sua casa até a padaria.`,
[["Como se diz 'Tem um mercado perto daqui'?",["Have a supermarket near here.","There is a supermarket near here.","It has a supermarket near here.","There are a supermarket near here."],1,"Existência = there is (singular)."],["A pergunta correta é:",["Are there any parks?","Is there any parks?","Have any parks?","There are any parks?"],0,"Plural na pergunta: Are there any...?"],["'O quadro está na parede' usa qual preposição?",["in","at","on","under"],2,"Superfície, inclusive parede: on the wall."]])
]);

MOD("ing","A1 · Vida cotidiana","Falar de rotina, gostos, habilidades, compras, comida e do que está acontecendo agora.",[
L("Simple present: rotinas e fatos",`<h4>Quando usar</h4>
<ul><li>Rotinas e hábitos: <i>I wake up at 6.</i></li><li>Fatos e verdades: <i>Water boils at 100°C.</i></li><li>Gostos e opiniões: <i>She loves pizza.</i></li><li>Horários fixos: <i>The movie starts at 8.</i></li></ul>
<h4>Afirmativa e a regra do he/she/it</h4>
<p>Com <b>he, she, it</b> (e um nome no singular) o verbo ganha <b>-s</b>. É o erro número um de brasileiros: "She work" está errado; o certo é <i>She works</i>.</p>
<table><tr><th>Terminação do verbo</th><th>Regra</th><th>Exemplo</th></tr>
<tr><td>Maioria</td><td>+ s</td><td>work → works, play → plays</td></tr>
<tr><td>-s, -sh, -ch, -x, -o</td><td>+ es</td><td>watch → watches, go → goes, do → does</td></tr>
<tr><td>Consoante + y</td><td>y → ies</td><td>study → studies, fly → flies</td></tr>
<tr><td>irregular</td><td>—</td><td>have → has</td></tr></table>
<p>Pronúncia do -s: /s/ depois de sons surdos (<i>works, stops</i>), /z/ depois de sons sonoros (<i>plays, lives</i>) e /iz/ depois de s, sh, ch, x, z (<i>watches, washes</i>).</p>
<h4>Verbos da rotina</h4>
<p><i>wake up, get up, take a shower, brush my teeth, get dressed, have breakfast, go to work, start work, have lunch, finish work, go home, cook dinner, watch TV, read, go to bed, sleep</i>.</p>
<p>Expressões com <b>have</b>: <i>have breakfast/lunch/dinner, have a coffee, have a shower, have fun</i>. Com <b>do</b>: <i>do homework, do the dishes, do exercise, do the laundry</i>. Com <b>make</b>: <i>make dinner, make the bed, make a mistake, make money</i>.</p>
<h4>Like + -ing</h4>
<p>Para gostos: <i>I like running. She loves cooking. They hate waiting. I don't mind working on weekends.</i> Escala: <i>love > really like > like > don't mind > don't like > hate</i>.</p>
<h4>Ordem das palavras</h4>
<p>Sujeito + verbo + complemento + lugar + tempo: <i>I study English at home every evening.</i> O tempo pode ir no começo: <i>Every evening, I study English at home.</i></p>`,
["He/she/it + verbo com -s: she works, he goes, it has","study → studies; watch → watches","have breakfast, do homework, make dinner","like/love/hate + -ing","Ordem: sujeito + verbo + objeto + lugar + tempo"],
`<i>"My day starts early. I wake up at 6 and have coffee. My wife takes the kids to school and I go to the gym. In the evening we cook dinner together. My son loves playing video games, but he only plays on weekends."</i>`,
`Escreva sua rotina de um dia útil com 12 frases. Depois reescreva tudo na terceira pessoa ("He wakes up at 6...") como se fosse a rotina de um amigo. Grave os dois textos.`,
[["Qual frase está correta?",["She work in a hospital.","She works in a hospital.","She workes in a hospital.","She working in a hospital."],1,"He/she/it recebe -s: works."],["Qual é a forma de 'study' com he?",["studys","studyes","studies","study"],2,"Consoante + y vira ies."],["Complete: I ___ the dishes after dinner.",["make","do","have","take"],1,"Do the dishes = lavar a louça."]]),
L("Perguntas e negativas com do / does",`<h4>Estrutura</h4>
<table><tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td>Negativa</td><td>I don't (do not) drink coffee.</td><td>She doesn't (does not) drink coffee.</td></tr>
<tr><td>Pergunta</td><td>Do you drink coffee?</td><td>Does she drink coffee?</td></tr>
<tr><td>Resposta curta</td><td>Yes, I do. / No, I don't.</td><td>Yes, she does. / No, she doesn't.</td></tr></table>
<p><b>Regra de ouro:</b> com <i>does</i> e <i>doesn't</i>, o verbo principal volta para a forma base, sem -s. O -s "passa" para o auxiliar: <i>He doesn't work</i> (nunca "doesn't works"); <i>Does she live here?</i> (nunca "Does she lives").</p>
<h4>Perguntas com palavras interrogativas</h4>
<p>Wh- word + do/does + sujeito + verbo:</p>
<table><tr><th>Palavra</th><th>Sentido</th><th>Exemplo</th></tr>
<tr><td>What</td><td>O que, qual</td><td>What do you do? (qual é sua profissão)</td></tr>
<tr><td>Where</td><td>Onde</td><td>Where does he live?</td></tr>
<tr><td>When</td><td>Quando</td><td>When do you study?</td></tr>
<tr><td>What time</td><td>Que horas</td><td>What time does the store open?</td></tr>
<tr><td>Who</td><td>Quem</td><td>Who do you live with?</td></tr>
<tr><td>Why</td><td>Por quê</td><td>Why do you like it? – Because...</td></tr>
<tr><td>How</td><td>Como</td><td>How do you go to work?</td></tr>
<tr><td>How often</td><td>Com que frequência</td><td>How often do you exercise?</td></tr>
<tr><td>Which</td><td>Qual (entre opções)</td><td>Which one do you prefer?</td></tr></table>
<h4>To be não usa do</h4>
<p>O verbo to be tem pergunta e negativa próprias. Errado: "Do you are tired?" / "I don't am". Certo: <i>Are you tired? I'm not.</i></p>
<h4>Pergunta sobre o sujeito (sem do)</h4>
<p>Quando <i>who</i> ou <i>what</i> é o sujeito, não há do: <i>Who lives here?</i> (quem mora aqui) × <i>Who do you live with?</i> (com quem você mora). <i>What happens next?</i></p>
<h4>Conversa típica</h4>
<p><i>– What do you do? – I'm a nurse. – Oh, nice. Where do you work? – At a clinic downtown. – Do you work at night? – Sometimes, yes. – Do you like it? – Yes, I do. I love helping people.</i></p>`,
["don't / doesn't + verbo base","Does she work? (sem -s no verbo)","Wh- + do/does + sujeito + verbo","To be não usa do: Are you...?","Who lives here? (who como sujeito, sem do)"],
`<i>"– Does your brother live with you? – No, he doesn't. He lives in São Paulo. – How often do you visit him? – About twice a year. We don't see each other much."</i>`,
`Faça 15 perguntas para conhecer uma pessoa nova (rotina, gostos, família, trabalho) usando do/does e as Wh- words. Responda todas sobre você mesmo, com respostas completas.`,
[["Qual está correta?",["He doesn't likes fish.","He don't like fish.","He doesn't like fish.","He not like fish."],2,"Doesn't + verbo base."],["Complete: ___ your sister speak Spanish?",["Do","Does","Is","Are"],1,"Sister = she, por isso does."],["Qual pergunta está correta?",["Do you are happy?","Are you happy?","Does you happy?","You are happy?"],1,"To be não usa do; inverte-se o verbo."]]),
L("Frequência, tempo livre e hobbies",`<h4>Advérbios de frequência</h4>
<table><tr><th>Advérbio</th><th>Frequência</th></tr>
<tr><td>always</td><td>100% sempre</td></tr><tr><td>usually / normally</td><td>90% geralmente</td></tr>
<tr><td>often / frequently</td><td>70% frequentemente</td></tr><tr><td>sometimes</td><td>50% às vezes</td></tr>
<tr><td>occasionally</td><td>30% de vez em quando</td></tr><tr><td>rarely / seldom</td><td>10% raramente</td></tr>
<tr><td>never</td><td>0% nunca</td></tr></table>
<p><b>Posição:</b> antes do verbo principal (<i>I usually walk to work</i>) mas depois do to be (<i>She is always late</i>). Em perguntas: <i>Do you often eat out?</i> Com never, o verbo fica afirmativo: <i>I never drink soda</i> (não "I don't never").</p>
<h4>Expressões de frequência</h4>
<p>Vão no fim da frase: <i>once a week, twice a month, three times a year, every day, every Monday, on weekends, in the morning, at night, every other day</i> (dia sim, dia não). <i>How often do you go to the gym? – Three times a week.</i></p>
<h4>Hobbies e esportes</h4>
<table><tr><th>play (jogos com bola e competição)</th><th>go (atividades com -ing)</th><th>Do (outras atividades)</th></tr>
<tr><td>play soccer, play tennis, play cards, play video games, play the guitar</td><td>go running, go swimming, go fishing, go shopping, go hiking, go cycling</td><td>do yoga, do karate, do exercise, do crossfit, do puzzles</td></tr></table>
<p>Outros: <i>read, watch series, listen to music/podcasts, cook, garden, draw, paint, travel, take photos, hang out with friends, go out, stay at home, relax</i>.</p>
<h4>Falando de tempo livre</h4>
<p><i>What do you do in your free time? – I usually go cycling on Saturday mornings and I sometimes play soccer with friends. I rarely watch TV, but I love watching series on streaming.</i></p>
<p>Concordar e discordar: <i>I love it! – Me too. / So do I.</i> <i>I don't like horror movies. – Me neither. / Neither do I.</i> <i>I like it. – Really? I don't.</i></p>`,
["Advérbio antes do verbo principal, depois do to be","never com verbo afirmativo: I never drink","once/twice/three times a week no fim da frase","play (bola), go (+ing), do (yoga, exercise)","Me too / Me neither"],
`<i>"I always have coffee in the morning, but I never drink it after 6 pm. I go running three times a week and I sometimes do yoga on Sundays. My wife is always busy on Mondays."</i>`,
`Faça uma tabela da sua semana e escreva 12 frases usando 7 advérbios diferentes e 4 expressões como "twice a week". Grave um áudio de 1 minuto contando o que você faz no seu tempo livre.`,
[["Posição correta:",["I go usually to the gym.","I usually go to the gym.","Usually I go the gym always.","I go to the gym usually always."],1,"O advérbio vem antes do verbo principal."],["Com to be, o advérbio fica:",["antes do to be","Depois do to be","No fim sempre","No começo sempre"],1,"She is always late: depois do to be."],["Qual combinação está correta?",["play yoga","go swimming","do soccer","go tennis"],1,"Atividades com -ing usam go."]]),
L("Can e can't: habilidade, permissão e pedidos",`<h4>Forma</h4>
<p><b>Can</b> é um verbo modal: igual para todas as pessoas, sem -s, seguido de verbo sem to.</p>
<table><tr><th>Afirmativa</th><th>Negativa</th><th>Pergunta</th><th>Resposta</th></tr>
<tr><td>I can swim.</td><td>She can't (cannot) drive.</td><td>Can you cook?</td><td>Yes, I can. / No, I can't.</td></tr></table>
<p>Errado: "He cans", "I can to swim", "Do you can?". Certo: <i>He can, I can swim, Can you...?</i></p>
<h4>Pronúncia</h4>
<p>Na afirmativa, <i>can</i> fica fraco, quase "kn": <i>I kn swim</i>. Na negativa, <i>can't</i> é forte e longo: americano "ként", britânico "káant". Muitas vezes a diferença está só na força da palavra.</p>
<h4>Usos</h4>
<ul><li><b>Habilidade:</b> <i>I can speak two languages. My son can't ride a bike yet.</i></li>
<li><b>Possibilidade:</b> <i>You can pay by card. We can meet tomorrow.</i></li>
<li><b>Permissão:</b> <i>Can I sit here? You can't park here.</i></li>
<li><b>Pedidos:</b> <i>Can you help me? Can you open the window, please?</i> Mais educado: <i>Could you...? / Could I...?</i></li></ul>
<h4>Graus de habilidade</h4>
<p><i>I can swim very well. I can cook quite well. I can play the guitar a little. I can't dance at all</i> (nada). Para perguntar: <i>How well can you speak English?</i></p>
<h4>Pedidos educados no dia a dia</h4>
<table><tr><th>Situação</th><th>Frase</th></tr>
<tr><td>Restaurante</td><td>Can I have the menu, please? Could we have the check?</td></tr>
<tr><td>Loja</td><td>Can I try this on? Can I pay in cash?</td></tr>
<tr><td>Ajuda</td><td>Could you tell me where the station is?</td></tr>
<tr><td>Casa de alguém</td><td>Can I use your bathroom? Could I have some water?</td></tr></table>
<p>Respostas: <i>Sure! / Of course. / No problem. / Go ahead.</i> Recusa educada: <i>Sorry, I'm afraid you can't.</i></p>`,
["Can + verbo base, igual para todas as pessoas","Can fraco na afirmativa; can't forte","Habilidade, possibilidade, permissão e pedidos","Could é mais educado que can","very well / quite well / a little / not at all"],
`<i>"– Can you speak Spanish? – A little. I can understand a lot, but I can't speak very well. – Could you help me with this e-mail? – Sure, no problem."</i>`,
`Escreva 10 coisas que você sabe fazer e 10 que não sabe, com graus (very well, a little, not at all). Depois escreva 8 pedidos educados para situações de restaurante, loja e viagem.`,
[["Qual está correta?",["She cans drive.","She can drives.","She can drive.","She can to drive."],2,"Modal + verbo base, sem -s e sem to."],["Forma mais educada de pedir:",["Give me water.","Could I have some water?","I want water.","Water, now."],1,"Could I have...? é educado."],["Como se pergunta habilidade?",["Do you can swim?","Can you swim?","Are you can swim?","You can swim?"],1,"Pergunta com modal: Can you...?"]]),
L("Comida, compras, contáveis e incontáveis",`<h4>Contáveis × incontáveis</h4>
<p><b>Contáveis</b> têm plural: <i>an apple, two apples, a bottle, three eggs</i>. <b>Incontáveis</b> não têm plural nem a/an: <i>water, rice, milk, bread, money, information, advice, furniture, news</i>. Para contar incontáveis use recipientes: <i>a bottle of water, a slice of bread, a cup of coffee, a kilo of rice, a piece of advice, a can of soda, a carton of milk</i>.</p>
<h4>Some, any, much, many, a lot of</h4>
<table><tr><th>Palavra</th><th>Uso</th><th>Exemplo</th></tr>
<tr><td>some</td><td>Afirmativas e ofertas/pedidos</td><td>I need some eggs. Would you like some tea?</td></tr>
<tr><td>any</td><td>Negativas e perguntas</td><td>We don't have any milk. Do you have any questions?</td></tr>
<tr><td>many</td><td>contáveis (perguntas/negativas)</td><td>How many apples? Not many.</td></tr>
<tr><td>much</td><td>Incontáveis (perguntas/negativas)</td><td>How much water? Not much.</td></tr>
<tr><td>a lot of / lots of</td><td>Qualquer um, na afirmativa</td><td>I drink a lot of water. She has lots of friends.</td></tr>
<tr><td>a few / a little</td><td>Alguns (contável) / um pouco (incontável)</td><td>a few friends, a little sugar</td></tr></table>
<p><i>How much is it?</i> pergunta preço. <i>How many do you need?</i> pergunta quantidade contável.</p>
<h4>Vocabulário de comida</h4>
<p>Frutas e legumes: <i>apple, banana, orange, grapes, strawberry, pineapple, watermelon, lemon, tomato, potato, onion, garlic, carrot, lettuce, beans, corn</i>. Proteínas: <i>chicken, beef, pork, fish, shrimp, eggs, cheese, ham</i>. Outros: <i>rice, pasta, bread, butter, sugar, salt, pepper, oil, flour, cereal, yogurt, juice, soda, beer, wine</i>. Preparos: <i>fried, grilled, boiled, baked, roasted, raw, spicy, sweet, salty, sour</i>.</p>
<h4>No restaurante</h4>
<p><i>A table for two, please. – Can I see the menu? – Are you ready to order? – I'd like (I would like) the grilled chicken, please. – What would you like to drink? – Just water, please. – Anything else? – No, thanks. – Could we have the check (EUA) / the bill (UK), please? – Is service included?</i></p>
<p><b>I'd like</b> é a forma educada de pedir; "I want" soa rude em restaurante.</p>
<h4>No mercado</h4>
<p><i>Where can I find the cereal? – Aisle 5. Do you have a bag? – Would you like a receipt? – Cash or card? – Paper or plastic?</i></p>`,
["Incontáveis: water, money, advice, information, news","some na afirmativa; any na negativa e pergunta","how many (contável) × how much (incontável e preço)","A few (contável) × a little (incontável)","I'd like... é a forma educada de pedir"],
`<i>"We need some groceries. There isn't any milk and we only have a few eggs. Let's buy a bag of rice, two kilos of potatoes and a little cheese. How much money do we have?"</i>`,
`Faça sua lista de compras da semana em inglês com 20 itens e quantidades (a bottle of, a kilo of). Depois escreva e encene um diálogo completo num restaurante, do pedido até a conta.`,
[["Qual é incontável?",["apple","egg","advice","bottle"],2,"Advice (conselho) é incontável: a piece of advice."],["Complete: We don't have ___ bread.",["some","any","many","a few"],1,"Negativa usa any."],["Para incontável na pergunta:",["How many milk?","How much milk?","How lot milk?","How few milk?"],1,"Milk é incontável: how much."]]),
L("Present continuous: o que está acontecendo agora",`<h4>Forma</h4>
<p><b>Sujeito + am/is/are + verbo-ing</b>.</p>
<table><tr><th>Afirmativa</th><th>Negativa</th><th>Pergunta</th></tr>
<tr><td>I'm working.</td><td>I'm not working.</td><td>Am I working?</td></tr>
<tr><td>She's cooking.</td><td>She isn't cooking.</td><td>Is she cooking?</td></tr>
<tr><td>They're sleeping.</td><td>They aren't sleeping.</td><td>Are they sleeping?</td></tr></table>
<h4>Ortografia do -ing</h4>
<ul><li>Regra geral: <i>work → working, read → reading</i>.</li>
<li>Termina em -e: tira o e: <i>make → making, write → writing</i> (mas <i>see → seeing</i>).</li>
<li>Consoante-vogal-consoante com sílaba tônica no fim: dobra: <i>run → running, sit → sitting, stop → stopping, begin → beginning</i>.</li>
<li>-ie vira -y: <i>lie → lying, die → dying</i>.</li></ul>
<h4>Usos</h4>
<ul><li>Agora, neste momento: <i>I'm watching TV right now. Listen! The baby is crying.</i></li>
<li>Temporário, nesta fase: <i>I'm reading a great book this month. She's living with her parents for now.</i></li>
<li>Mudanças em andamento: <i>Prices are going up. My English is getting better.</i></li>
<li>Planos combinados no futuro (veremos no A2): <i>I'm meeting Ana tomorrow.</i></li></ul>
<h4>Present simple × present continuous</h4>
<table><tr><th>Simple (sempre, rotina)</th><th>Continuous (agora, temporário)</th></tr>
<tr><td>I work in an office.</td><td>I'm working from home this week.</td></tr>
<tr><td>She usually drinks tea.</td><td>She's drinking coffee today.</td></tr>
<tr><td>It rains a lot here in winter.</td><td>It's raining now.</td></tr></table>
<h4>Verbos que quase nunca vão para o -ing (stative verbs)</h4>
<p>Estados, não ações: <i>know, understand, believe, like, love, hate, want, need, prefer, own, belong, seem, remember</i>. Diga <i>I know</i> (não "I'm knowing"), <i>I need help</i>, <i>I understand</i>. Exceções com sentido de ação: <i>I'm having lunch</i> (comendo) × <i>I have a car</i> (possuo); <i>I'm thinking about it</i> (pensando) × <i>I think it's good</i> (opinião).</p>
<p>Palavras-sinal: <i>now, right now, at the moment, today, this week, currently, Look!, Listen!</i></p>`,
["am/is/are + verbo-ing","make → making; run → running","Agora ou temporário: this week, right now","Simple = rotina; continuous = agora","Stative verbs (know, want, need) não usam -ing"],
`Mensagem para um amigo: <i>"Hey! I'm sitting in a café near the beach. It's raining a little, so I'm reading and drinking hot chocolate. My kids are playing at their grandma's house. What are you doing?"</i>`,
`Descreva em 10 frases o que as pessoas da sua casa (ou de uma foto) estão fazendo agora. Depois escreva 6 pares de frases contrastando rotina e agora: "I usually..., but today I'm...".`,
[["Qual está correta?",["I'm knowing the answer.","I know the answer.","I knowing the answer.","I am know the answer."],1,"Know é stative verb, não usa -ing."],["Qual é o -ing de 'run'?",["runing","running","runeing","runnning"],1,"Consoante-vogal-consoante: dobra o n."],["Escolha: Look! It ___.",["snows","is snowing","snow","snowing"],1,"Look! indica algo acontecendo agora: present continuous."]])
]);

MOD("ing","A2 · O passado","Contar o que aconteceu, descrever experiências passadas e narrar histórias com sequência.",[
L("Simple past dos verbos regulares",`<h4>Forma afirmativa</h4>
<p>Verbos regulares ganham <b>-ed</b>, igual para todas as pessoas: <i>I worked, she worked, they worked</i>.</p>
<table><tr><th>Regra</th><th>Exemplo</th></tr>
<tr><td>+ ed</td><td>work → worked, watch → watched</td></tr>
<tr><td>Termina em -e: + d</td><td>live → lived, like → liked</td></tr>
<tr><td>Consoante + y → ied</td><td>study → studied, try → tried (mas play → played)</td></tr>
<tr><td>CVC tônica: dobra</td><td>stop → stopped, plan → planned, prefer → preferred</td></tr></table>
<h4>Pronúncia do -ed (muito importante)</h4>
<table><tr><th>Som</th><th>Quando</th><th>Exemplos</th></tr>
<tr><td>/t/</td><td>Depois de som surdo (p, k, s, sh, ch, f)</td><td>worked "workt", stopped "stópt", watched "wótcht"</td></tr>
<tr><td>/d/</td><td>Depois de som sonoro (vogais, b, g, l, m, n, v, z)</td><td>played "plêid", lived "lívd", called "cóld"</td></tr>
<tr><td>/id/</td><td>Só depois de t ou d</td><td>wanted "uónid", needed "nídid", decided</td></tr></table>
<p>O erro mais comum é falar "uorquédi" para <i>worked</i>. O -ed só vira sílaba extra depois de t ou d.</p>
<h4>Negativa e pergunta com did</h4>
<table><tr><th>Negativa</th><th>Pergunta</th><th>Resposta curta</th></tr>
<tr><td>I didn't (did not) work yesterday.</td><td>Did you work yesterday?</td><td>Yes, I did. / No, I didn't.</td></tr></table>
<p>Igual ao does: com <b>did</b> o verbo volta à forma base: <i>Did she call?</i> (nunca "Did she called?"); <i>He didn't watch</i> (nunca "didn't watched").</p>
<h4>Expressões de tempo passado</h4>
<p><i>yesterday, yesterday morning, last night, last week, last month, last year, two days ago, a week ago, in 2019, when I was a child, the day before yesterday</i>. Atenção: <b>ago</b> vem depois do período: <i>three years ago</i> (há três anos). Não use "in the last night": é <i>last night</i>.</p>
<h4>Verbos regulares frequentes</h4>
<p><i>arrive, ask, call, change, clean, close, cook, cry, decide, enjoy, finish, happen, help, invite, listen, look, love, move, need, open, plan, play, rain, remember, start, stay, talk, travel, try, use, visit, wait, walk, want, watch, work</i>.</p>`,
["Regular: + ed para todas as pessoas","-ed soa /t/, /d/ ou /id/ (só depois de t/d)","did / didn't + verbo base","ago vem depois do tempo: two years ago","last night, last week (sem 'the')"],
`<i>"Last weekend I visited my grandparents. We cooked lunch together and talked for hours. In the evening it rained, so we stayed home and watched an old movie. I didn't want to leave!"</i>`,
`Escreva um texto de 12 frases sobre o seu último fim de semana usando só verbos regulares. Marque ao lado de cada verbo se o -ed soa /t/, /d/ ou /id/ e leia em voz alta.`,
[["Como se pronuncia 'worked'?",["uorquédi","uorkt","uorquid","uorkêd"],1,"Depois de som surdo (k), o -ed soa /t/."],["Qual está correta?",["Did you called me?","Did you call me?","Do you called me?","You did call me?"],1,"Did + verbo base."],["Como se diz 'há dois anos'?",["ago two years","two years ago","before two years","two ago years"],1,"Ago vem depois do período."]]),
L("Verbos irregulares mais usados",`<h4>Por que decorar</h4>
<p>Os verbos mais usados do inglês são justamente irregulares. Aprender os 60 abaixo cobre a grande maioria das conversas. A forma do passado é a mesma para todas as pessoas, e na negativa e na pergunta voltamos à base com did: <i>I went → I didn't go → Did you go?</i></p>
<h4>Os essenciais (base – passado – particípio)</h4>
<table><tr><th>Base</th><th>Passado</th><th>Particípio</th><th>Sentido</th></tr>
<tr><td>be</td><td>was/were</td><td>been</td><td>Ser/estar</td></tr><tr><td>have</td><td>had</td><td>had</td><td>Ter</td></tr>
<tr><td>Do</td><td>did</td><td>done</td><td>Fazer</td></tr><tr><td>go</td><td>went</td><td>gone</td><td>Ir</td></tr>
<tr><td>get</td><td>got</td><td>got/gotten</td><td>Conseguir, ficar</td></tr><tr><td>make</td><td>made</td><td>made</td><td>Fazer, fabricar</td></tr>
<tr><td>say</td><td>said</td><td>said</td><td>Dizer</td></tr><tr><td>see</td><td>saw</td><td>seen</td><td>Ver</td></tr>
<tr><td>come</td><td>came</td><td>come</td><td>Vir</td></tr><tr><td>take</td><td>took</td><td>taken</td><td>Pegar, levar</td></tr>
<tr><td>know</td><td>knew</td><td>known</td><td>Saber, conhecer</td></tr><tr><td>think</td><td>thought</td><td>thought</td><td>Pensar</td></tr>
<tr><td>give</td><td>gave</td><td>given</td><td>Dar</td></tr><tr><td>find</td><td>found</td><td>found</td><td>Encontrar</td></tr>
<tr><td>tell</td><td>told</td><td>told</td><td>Contar, dizer a</td></tr><tr><td>feel</td><td>felt</td><td>felt</td><td>Sentir</td></tr>
<tr><td>leave</td><td>left</td><td>left</td><td>Sair, deixar</td></tr><tr><td>buy</td><td>bought</td><td>bought</td><td>Comprar</td></tr>
<tr><td>bring</td><td>brought</td><td>brought</td><td>Trazer</td></tr><tr><td>eat</td><td>ate</td><td>eaten</td><td>Comer</td></tr>
<tr><td>drink</td><td>drank</td><td>drunk</td><td>Beber</td></tr><tr><td>write</td><td>wrote</td><td>written</td><td>Escrever</td></tr>
<tr><td>read</td><td>read ("réd")</td><td>read</td><td>Ler</td></tr><tr><td>speak</td><td>spoke</td><td>spoken</td><td>Falar</td></tr>
<tr><td>meet</td><td>met</td><td>met</td><td>Conhecer, encontrar</td></tr><tr><td>pay</td><td>paid</td><td>paid</td><td>Pagar</td></tr>
<tr><td>sleep</td><td>slept</td><td>slept</td><td>Dormir</td></tr><tr><td>send</td><td>sent</td><td>sent</td><td>Enviar</td></tr>
<tr><td>spend</td><td>spent</td><td>spent</td><td>Gastar, passar tempo</td></tr><tr><td>lose</td><td>lost</td><td>lost</td><td>Perder</td></tr>
<tr><td>begin</td><td>began</td><td>begun</td><td>Começar</td></tr><tr><td>break</td><td>broke</td><td>broken</td><td>Quebrar</td></tr>
<tr><td>choose</td><td>chose</td><td>chosen</td><td>Escolher</td></tr><tr><td>drive</td><td>drove</td><td>driven</td><td>Dirigir</td></tr>
<tr><td>fall</td><td>fell</td><td>fallen</td><td>Cair</td></tr><tr><td>forget</td><td>forgot</td><td>forgotten</td><td>Esquecer</td></tr>
<tr><td>hear</td><td>heard</td><td>heard</td><td>Ouvir</td></tr><tr><td>keep</td><td>kept</td><td>kept</td><td>Manter</td></tr>
<tr><td>put</td><td>put</td><td>put</td><td>Colocar</td></tr><tr><td>run</td><td>ran</td><td>run</td><td>Correr</td></tr>
<tr><td>sell</td><td>sold</td><td>sold</td><td>Vender</td></tr><tr><td>sit</td><td>sat</td><td>sat</td><td>Sentar</td></tr>
<tr><td>stand</td><td>stood</td><td>stood</td><td>Ficar de pé</td></tr><tr><td>teach</td><td>taught</td><td>taught</td><td>Ensinar</td></tr>
<tr><td>understand</td><td>understood</td><td>understood</td><td>Entender</td></tr><tr><td>win</td><td>won</td><td>won</td><td>Ganhar</td></tr>
<tr><td>wear</td><td>wore</td><td>worn</td><td>Vestir, usar</td></tr><tr><td>swim</td><td>swam</td><td>swum</td><td>Nadar</td></tr>
<tr><td>fly</td><td>flew</td><td>flown</td><td>Voar</td></tr><tr><td>grow</td><td>grew</td><td>grown</td><td>Crescer</td></tr>
<tr><td>cost</td><td>cost</td><td>cost</td><td>Custar</td></tr><tr><td>cut</td><td>cut</td><td>cut</td><td>Cortar</td></tr></table>
<h4>Como memorizar</h4>
<ul><li>Agrupe por padrão: <i>buy/bought, bring/brought, think/thought, teach/taught</i>; <i>sing/sang/sung, drink/drank/drunk, swim/swam/swum</i>; <i>put/put/put, cut/cut/cut, cost/cost/cost</i>.</li>
<li>Coloque no Anki com frase: <i>"I bought a new phone last week."</i></li>
<li>5 verbos novos por dia, revisando os anteriores.</li></ul>`,
["Os verbos mais usados são irregulares","Passado igual para todas as pessoas","Negativa e pergunta: did + base (I didn't go)","Agrupe por padrão: bought/brought/thought/taught","read no passado soa 'réd'"],

L("Was / were e past continuous",`<h4>Was / were (passado do to be)</h4>
<table><tr><th></th><th>I / he / she / it</th><th>you / we / they</th></tr>
<tr><td>Afirmativa</td><td>was</td><td>were</td></tr>
<tr><td>Negativa</td><td>wasn't</td><td>weren't</td></tr>
<tr><td>Pergunta</td><td>Was he...?</td><td>Were you...?</td></tr></table>
<p><i>I was tired. We were at the beach. Was it expensive? – Yes, it was. Where were you last night? I was born in 1990</i> (nasci em). Lembre: to be não usa did. Errado: "Did you were".</p>
<p><b>There was / there were:</b> <i>There was a party. There were a lot of people.</i></p>
<h4>Past continuous: was/were + -ing</h4>
<p>Uma ação em andamento num momento do passado.</p>
<ul><li><i>At 8 pm yesterday I was having dinner.</i></li>
<li><i>What were you doing when I called? – I was taking a shower.</i></li>
<li><i>It was raining and people were running to the subway.</i> (cenário de uma história)</li></ul>
<h4>Past continuous + simple past (interrupção)</h4>
<table><tr><th>Ação longa (continuous)</th><th>Ação curta que interrompe (simple)</th></tr>
<tr><td>I was driving home</td><td>when my phone rang.</td></tr>
<tr><td>While she was cooking,</td><td>she cut her finger.</td></tr>
<tr><td>We were watching TV</td><td>when the lights went out.</td></tr></table>
<p><b>When</b> costuma vir com a ação curta; <b>while</b> com a ação longa. Duas ações longas ao mesmo tempo: <i>While I was studying, my wife was working.</i></p>
<h4>Contraste</h4>
<p><i>When I arrived, they had dinner</i> = jantaram depois que cheguei. <i>When I arrived, they were having dinner</i> = já estavam jantando quando cheguei.</p>`,
["was (I/he/she/it) × were (you/we/they)","I was born in... (nasci em)","was/were + -ing = ação em andamento no passado","when + ação curta; while + ação longa","Cenário de histórias usa past continuous"],
`<i>"It was a cold night. I was walking home and it was starting to rain. Suddenly, a dog appeared and started following me. When I got home, it was sitting at my door!"</i>`,
`Responda por escrito: o que você estava fazendo às 7h, 10h, 13h, 18h e 22h de ontem? Depois escreva 6 frases com when/while sobre interrupções reais que você já viveu.`,
[["Complete: They ___ at home last night.",["was","were","did","been"],1,"They usa were."],["Qual frase descreve uma interrupção?",["I was cooking when she arrived.","I cooked when she was arrive.","I was cook when she arrived.","I cooking when she arrived."],0,"Ação longa no past continuous, interrupção no simple past."],["'Eu nasci em 1995':",["I born in 1995.","I was born in 1995.","I am born in 1995.","I did born in 1995."],1,"Nascer em inglês usa was born."]]),
L("Used to e a vida antes",`<h4>Used to + verbo base</h4>
<p>Fala de hábitos e estados do passado que <b>não acontecem mais</b>. Equivale ao "costumava" ou ao imperfeito em português ("eu jogava bola").</p>
<table><tr><th>Afirmativa</th><th>Negativa</th><th>Pergunta</th></tr>
<tr><td>I used to play soccer.</td><td>I didn't use to like vegetables.</td><td>Did you use to live here?</td></tr></table>
<p>Na negativa e na pergunta é <b>use to</b> (sem d), porque vem depois de did. A pronúncia é igual: "iústu".</p>
<h4>Used to × simple past</h4>
<ul><li>Hábito repetido ou estado longo: <i>I used to walk to school</i> (todos os dias).</li>
<li>Ação única ou com número de vezes: use simple past: <i>I went to Paris in 2015. I visited her three times.</i> (não "used to go three times").</li></ul>
<h4>Would para hábitos passados (nível mais avançado)</h4>
<p>Em histórias, <i>would</i> também indica hábito: <i>Every summer we would go to the beach and my dad would make barbecue.</i> Mas <i>would</i> não serve para estados: <i>I used to have long hair</i> (não "would have").</p>
<h4>Cuidado com 3 expressões parecidas</h4>
<table><tr><th>Expressão</th><th>Sentido</th><th>Exemplo</th></tr>
<tr><td>used to + verbo</td><td>Costumava (passado)</td><td>I used to smoke.</td></tr>
<tr><td>be used to + -ing/substantivo</td><td>Estar acostumado</td><td>I'm used to waking up early.</td></tr>
<tr><td>get used to + -ing/substantivo</td><td>Acostumar-se</td><td>I'm getting used to the cold.</td></tr></table>
<h4>Infância e mudanças de vida</h4>
<p>Vocabulário: <i>childhood, teenager, grow up (grew up), neighborhood, primary school, high school, college, toys, nickname, strict, shy, naughty</i>. <i>I grew up in a small town. When I was a kid, I used to be very shy. My parents were strict.</i></p>`,
["used to + base = hábito/estado passado que acabou","didn't use to / Did you use to (sem d)","Ação única: simple past, não used to","be used to + -ing = estar acostumado","grow up (grew up) = crescer, ser criado"],
`<i>"I grew up in the countryside. We didn't use to have internet, so I used to read a lot and play outside all day. Now I live in a big city and I'm used to the noise, but I miss the silence."</i>`,
`Escreva um texto de 15 frases comparando sua vida aos 10 anos e hoje, usando used to, didn't use to, be used to e get used to pelo menos duas vezes cada.`,
[["Qual está correta?",["I use to live in Recife.","I used to live in Recife.","I used to living in Recife.","I am used to live in Recife."],1,"Hábito passado: used to + verbo base."],["Negativa correta:",["I didn't used to smoke.","I didn't use to smoke.","I don't used to smoke.","I usedn't smoke."],1,"Depois de did: use to (sem d)."],["'Estou acostumado a acordar cedo':",["I used to wake up early.","I'm used to waking up early.","I use to wake up early.","I'm used to wake up early."],1,"Be used to + -ing."]]),
L("Contando histórias: sequência e conectores",`<h4>Estrutura de uma boa história</h4>
<ol><li><b>Cenário</b> (quando, onde, quem), em past continuous e simple past: <i>It was a Saturday night and we were celebrating my birthday.</i></li>
<li><b>Acontecimento</b>: <i>Suddenly, the power went out.</i></li>
<li><b>Desenvolvimento</b>: <i>We looked for candles, but we couldn't find any.</i></li>
<li><b>Final e reação</b>: <i>In the end, we had the party in the dark. It was the best birthday ever!</i></li></ol>
<h4>Conectores de sequência</h4>
<table><tr><th>Função</th><th>Conectores</th></tr>
<tr><td>Início</td><td>First, At first, One day, Once</td></tr>
<tr><td>Sequência</td><td>Then, Next, After that, Later, Afterwards</td></tr>
<tr><td>Surpresa</td><td>Suddenly, All of a sudden, Unexpectedly</td></tr>
<tr><td>Ao mesmo tempo</td><td>Meanwhile, While, At the same time</td></tr>
<tr><td>Sorte/azar</td><td>Luckily, Fortunately, Unfortunately</td></tr>
<tr><td>Fim</td><td>Finally, In the end, Eventually</td></tr></table>
<p><b>At the end</b> = no final físico de algo (<i>at the end of the street</i>); <b>in the end</b> = no fim das contas.</p>
<h4>Conectores de lógica</h4>
<p><i>and</i> (e), <i>but</i> (mas), <i>so</i> (então, por isso), <i>because</i> (porque), <i>or</i> (ou), <i>although</i> (embora): <i>I was tired, so I went to bed. I stayed because it was raining. Although it was late, we kept talking.</i></p>
<h4>Reagir quando alguém conta uma história</h4>
<p><i>Really? No way! Oh no! That's amazing! What happened next? And then? Lucky you! Poor thing! That's so funny!</i> Fazer perguntas mantém a conversa viva: <i>Where were you? Who was with you? How did you feel?</i></p>
<h4>Vocabulário de viagem no passado</h4>
<p><i>book a flight, pack, check in, board, take off, land, miss the flight, rent a car, get lost, go sightseeing, take pictures, try local food, stay at a hotel/hostel, come back</i>. <i>How was your trip? – It was amazing / OK / a disaster.</i></p>`,
["Cenário → acontecimento → desenvolvimento → final","First, then, after that, suddenly, in the end","in the end (no fim das contas) × at the end of (no final de)","so = por isso; because = porque","Reaja: Really? No way! What happened next?"],
`<i>"Last year I went to Chile with two friends. First, we missed our flight because of the traffic. Luckily, there was another one two hours later. When we landed, it was snowing! In the end, it was the best trip of my life."</i>`,
`Escreva uma história real de 200 palavras (uma viagem, um susto, um dia engraçado) usando 8 conectores. Grave contando a história sem ler, em até 2 minutos.`,
[["Qual conector indica surpresa?",["Then","Suddenly","Finally","Because"],1,"Suddenly = de repente."],["'No fim das contas, deu tudo certo':",["At the end, everything was fine.","In the end, everything was fine.","On the end, everything was fine.","By the end everything fine."],1,"In the end = finalmente, no fim das contas."],["Escolha: I was hungry, ___ I made a sandwich.",["because","but","so","although"],2,"So introduz consequência."]]),
L("Perguntas no passado e conversas reais",`<h4>Perguntas com Wh- no passado</h4>
<p>Wh- + did + sujeito + verbo base: <i>Where did you go? What did you do? Who did you meet? Why did she leave? How did it happen? What time did you arrive? How long did you stay?</i></p>
<p>Com to be: <i>Where were you? How was the party? Who was there? Why were you late?</i></p>
<p>Pergunta sobre o sujeito, sem did: <i>Who called you? What happened? Who won the game?</i></p>
<h4>Como foi?</h4>
<table><tr><th>Pergunta</th><th>Respostas naturais</th></tr>
<tr><td>How was your weekend?</td><td>It was great / relaxing / busy / boring / not bad.</td></tr>
<tr><td>Did you have a good time?</td><td>Yes, I had a blast! / It was OK.</td></tr>
<tr><td>What did you get up to?</td><td>Not much, I just stayed home.</td></tr>
<tr><td>How did it go?</td><td>It went really well / It didn't go well.</td></tr></table>
<h4>Adjetivos -ed × -ing</h4>
<p><b>-ed</b> descreve como a pessoa se sente; <b>-ing</b> descreve o que causa o sentimento.</p>
<table><tr><th>Sentimento (-ed)</th><th>Causa (-ing)</th></tr>
<tr><td>I was bored.</td><td>The movie was boring.</td></tr>
<tr><td>She was interested.</td><td>The book was interesting.</td></tr>
<tr><td>We were tired.</td><td>The trip was tiring.</td></tr>
<tr><td>I was surprised.</td><td>The news was surprising.</td></tr>
<tr><td>They were excited.</td><td>The game was exciting.</td></tr></table>
<p>"I'm boring" significa "eu sou chato"! Para "estou entediado" é <i>I'm bored</i>.</p>
<h4>Small talk de segunda-feira</h4>
<p><i>– Hey, how was your weekend? – Pretty good, thanks. I went to a concert on Saturday. – Oh, cool! Who did you see? – A local band. It was really exciting. What about you? – I just relaxed. I watched a series and slept a lot. – Sounds perfect!</i></p>
<p>Devolver a pergunta: <i>What about you? / And you? / How about yours?</i></p>`,
["Wh- + did + sujeito + base: Where did you go?","How was...? com to be","Who called? (sem did quando who é sujeito)","-ed = como me sinto; -ing = o que causa","I'm bored (entediado) × I'm boring (chato)"],
`<i>"– What happened? You look surprised. – I just saw my old teacher at the mall! – Really? Did you talk to her? – Yes, we talked for an hour. It was a really interesting conversation."</i>`,
