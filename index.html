MOD("sgi","Ferramentas de gestão e solução de problemas","Dominar as ferramentas para analisar dados, resolver problemas pela causa raiz, antecipar falhas e melhorar continuamente.",[
L("As 7 ferramentas básicas da qualidade",`<h4>As ferramentas</h4>
<table><tr><th>Ferramenta</th><th>Para quê</th><th>Exemplo</th></tr>
<tr><td>Folha de verificação</td><td>Coletar dados de forma organizada</td><td>Marcar tipo de reclamação por dia</td></tr>
<tr><td>Estratificação</td><td>Separar dados por grupos para achar padrões</td><td>Acidentes por turno, setor, idade, tipo de tarefa</td></tr>
<tr><td>Histograma</td><td>Ver a distribuição de uma variável</td><td>Tempo de atendimento de 200 chamadas</td></tr>
<tr><td>Diagrama de Pareto</td><td>Priorizar os poucos fatores vitais (regra 80/20)</td><td>3 tipos de defeito causam 78% das devoluções</td></tr>
<tr><td>Diagrama de causa e efeito (Ishikawa)</td><td>Organizar possíveis causas</td><td>6M: método, máquina, mão de obra, material, medição, meio ambiente</td></tr>
<tr><td>Diagrama de dispersão</td><td>Ver relação entre duas variáveis</td><td>Temperatura × consumo de energia</td></tr>
<tr><td>Carta de controle</td><td>Separar variação comum de variação especial ao longo do tempo</td><td>Peso de embalagens por hora</td></tr></table>
<p>Algumas listas incluem o <b>fluxograma</b> no lugar da estratificação. Todas são simples, visuais e resolvem a maioria dos problemas do dia a dia.</p>
<h4>Pareto passo a passo</h4>
<ol><li>Defina categorias e período.</li>
<li>Conte as ocorrências por categoria.</li>
<li>Ordene do maior para o menor.</li>
<li>Calcule o percentual acumulado.</li>
<li>Desenhe barras (frequência) e linha (acumulado).</li>
<li>Foque nas categorias que somam cerca de 80%.</li></ol>
<p>Dica: faça Pareto também por <b>custo</b> ou <b>gravidade</b>, não só por quantidade: o problema mais frequente nem sempre é o mais caro ou perigoso.</p>
<h4>Ishikawa (6M)</h4>
<ul><li><b>Método</b>: procedimento, sequência, instruções.</li>
<li><b>Máquina</b>: equipamento, ferramenta, sistema.</li>
<li><b>Mão de obra</b>: competência, carga, comunicação.</li>
<li><b>Material</b>: matéria-prima, insumos, informações de entrada.</li>
<li><b>Medição</b>: instrumentos, critérios, dados.</li>
<li><b>Meio ambiente</b>: temperatura, iluminação, ruído, layout.</li></ul>
<p>Em serviços, adapte para 8P (produto, preço, praça, promoção, pessoas, processos, evidência física, produtividade) ou categorias próprias. O Ishikawa organiza hipóteses; elas precisam ser verificadas com dados.</p>
<h4>Ferramentas gerenciais complementares</h4>
<p><i>5W2H</i> (plano de ação: o quê, por quê, onde, quando, quem, como, quanto custa), <i>brainstorming</i>, <i>matriz GUT</i> (gravidade, urgência, tendência) para priorizar, <i>fluxograma</i> e <i>diagrama de afinidades</i>.</p>
<h4>Planilhas e IA como apoio</h4>
<p>Excel ou Google Planilhas fazem Pareto, histograma e dispersão em minutos. Assistentes de IA ajudam a montar as tabelas e sugerir categorias, mas a análise e a validação dos dados são do gestor.</p>`,
["Folha de verificação, estratificação, histograma, Pareto, Ishikawa, dispersão, carta de controle","Pareto: focar nos ~20% de causas que geram ~80% do efeito","Faça Pareto também por custo e gravidade","Ishikawa 6M organiza hipóteses; verifique com dados","5W2H e GUT complementam"],
`Uma pizzaria recebe 200 reclamações no trimestre. Pareto: atraso na entrega 52%, pizza fria 21%, pedido errado 15%, outros 12%. Estratificando o atraso por dia, sextas e sábados concentram 70%. Ishikawa aponta falta de entregadores no pico e roteirização ruim. Ação: escala dinâmica e app de rotas.`,
`Colete dados reais de algo do seu dia a dia por 2 semanas (gastos, interrupções, atrasos) com folha de verificação. Faça Pareto, estratificação e um Ishikawa sobre o principal problema, e um plano 5W2H.`,

L("Análise e solução de problemas: MASP, 8D e 5 porquês",`<h4>MASP: Método de Análise e Solução de Problemas</h4>
<table><tr><th>Fase PDCA</th><th>Etapa MASP</th><th>Ferramentas</th></tr>
<tr><td>P</td><td>1. Identificação do problema</td><td>Dados, Pareto, definição clara</td></tr>
<tr><td>P</td><td>2. Observação (características)</td><td>Estratificação, visita ao local, folhas de verificação</td></tr>
<tr><td>P</td><td>3. Análise (causas)</td><td>Ishikawa, 5 porquês, testes de hipóteses</td></tr>
<tr><td>P</td><td>4. Plano de ação</td><td>5W2H, priorização</td></tr>
<tr><td>D</td><td>5. Ação</td><td>Execução, treinamento</td></tr>
<tr><td>C</td><td>6. Verificação</td><td>Comparação antes × depois</td></tr>
<tr><td>A</td><td>7. Padronização</td><td>Procedimentos, poka-yoke, treinamento</td></tr>
<tr><td>A</td><td>8. Conclusão</td><td>Lições aprendidas, próximos problemas</td></tr></table>
<h4>8D: oito disciplinas</h4>
<p>Muito usado em indústrias e com clientes: D0 preparar; D1 formar equipe; D2 descrever o problema (é/não é); D3 ação de contenção; D4 causa raiz (de ocorrência e de não detecção); D5 escolher ações corretivas permanentes; D6 implementar e validar; D7 prevenir recorrência (sistema, outros produtos e locais); D8 reconhecer a equipe.</p>
<h4>5 porquês bem feitos</h4>
<p>Pergunte "por quê?" sucessivamente até chegar a uma causa sobre a qual se pode agir no sistema.</p>
<p><b>Problema</b>: cliente recebeu produto com etiqueta errada.</p>
<ol><li>Por quê? A operadora colou a etiqueta do pedido anterior.</li>
<li>Por quê? As etiquetas de dois pedidos saíram juntas da impressora.</li>
<li>Por quê? A impressora imprime em lote ao fim de cada hora.</li>
<li>Por quê? O sistema foi configurado assim para economizar papel na implantação.</li>
<li>Por quê? Não houve análise de riscos da configuração (gestão de mudanças).</li></ol>
<p>Ações: impressão por pedido com conferência por leitura de código de barras (poka-yoke) e inclusão de análise de riscos em mudanças de sistema.</p>
<h4>Armadilhas comuns</h4>
<ul><li>Parar em "Erro humano", "Falta de atenção" ou "falta de treinamento".</li>
<li>Seguir apenas um caminho quando há várias causas (faça árvores de porquês).</li>
<li>Pular a verificação com dados.</li>
<li>Ação sem dono, sem prazo ou sem verificação de eficácia.</li></ul>
<h4>Fatores humanos</h4>
<p>Erros humanos são normalmente consequência de condições do sistema: tarefas confusas, pressão de tempo, fadiga, interfaces ruins, procedimentos impraticáveis. A abordagem moderna (como o conceito de Segurança II) pergunta também por que, na maior parte do tempo, as coisas dão certo, e reforça essas condições.</p>
<h4>A3</h4>
<p>Relatório de uma folha (formato A3), de origem Toyota, que resume problema, situação atual, análise, contramedidas, plano e acompanhamento. Excelente para comunicar um MASP à direção.</p>`,

L("Análise preventiva de riscos: FMEA, APR, HAZOP e What-if",`<h4>Por que ferramentas preventivas</h4>
<p>As ferramentas da aula anterior resolvem problemas que já aconteceram. Estas antecipam falhas antes que ocorram, atendendo ao pensamento baseado em risco das três normas.</p>
<h4>FMEA: Análise de Modos e Efeitos de Falha</h4>
<table><tr><th>Coluna</th><th>Pergunta</th></tr>
<tr><td>Função / etapa</td><td>O que deve acontecer?</td></tr>
<tr><td>Modo de falha</td><td>Como pode falhar?</td></tr>
<tr><td>Efeito</td><td>O que acontece se falhar? → Severidade (S)</td></tr>
<tr><td>Causa</td><td>Por que falharia? → Ocorrência (O)</td></tr>
<tr><td>Controles atuais</td><td>Como prevenimos ou detectamos? → Detecção (D)</td></tr>
<tr><td>Prioridade</td><td>Tradicionalmente RPN = S × O × D (1 a 1000); o manual AIAG-VDA (2019) usa a Prioridade de Ação (AP: alta, média, baixa), dando mais peso à severidade</td></tr>
<tr><td>Ações</td><td>O que fazer, quem, quando, e nova avaliação</td></tr></table>
<p>Tipos: FMEA de projeto (DFMEA), de processo (PFMEA) e de serviço. Severidade alta (ex.: 9-10, risco à segurança) exige ação mesmo com RPN baixo.</p>
<h4>APR: Análise Preliminar de Riscos</h4>
<p>Simples e rápida, usada em SSO e meio ambiente, especialmente para tarefas e projetos novos: etapa → perigo → causa → consequência → categoria de risco → medidas. Muito usada antes de permissões de trabalho.</p>
<h4>HAZOP: Estudo de Perigos e Operabilidade</h4>
<p>Para processos contínuos (químicos, petróleo, alimentos, saneamento). Uma equipe multidisciplinar percorre cada trecho (nó) do processo aplicando <b>palavras-guia</b> a parâmetros: <i>nenhum, mais, menos, reverso, parte de, além de, outro que</i> × fluxo, pressão, temperatura, nível. Ex.: "Mais pressão no reator: causas? consequências? salvaguardas? ações?"</p>
<h4>What-if e checklist</h4>
<p>Perguntas "E se...?" em sessões estruturadas: <i>E se faltar energia durante a pasteurização? E se o fornecedor atrasar a entrega? E se o operador pular a etapa de limpeza?</i> Combinado com checklists de boas práticas, é útil para organizações pequenas.</p>
<h4>Escolhendo a ferramenta</h4>
<table><tr><th>Situação</th><th>Ferramenta</th></tr>
<tr><td>Produto ou processo de fabricação/serviço</td><td>FMEA</td></tr>
<tr><td>Tarefa de SSO, obra, atividade não rotineira</td><td>APR</td></tr>
<tr><td>Processo contínuo com fluidos, energia, química</td><td>HAZOP</td></tr>
<tr><td>Visão rápida de cenários, organização pequena</td><td>What-if / checklist</td></tr>
<tr><td>Comunicar barreiras de um evento crítico</td><td>Bow-tie</td></tr>
<tr><td>Calcular probabilidade de falhas combinadas</td><td>Árvore de falhas (FTA)</td></tr></table>
<h4>Ligação com o SGI</h4>
<p>Resultados alimentam o registro de riscos (6.1), controles operacionais (8.1), gestão de mudanças, manutenção, treinamento e planos de emergência. Revise quando houver mudança, incidente ou novo conhecimento.</p>`,

L("PDCA, Lean, Kaizen, 5S e Seis Sigma",`<h4>PDCA e SDCA</h4>
<p><b>PDCA</b> (Planejar, Fazer, Checar, Agir) é o ciclo de melhoria. <b>SDCA</b> (Standard, Do, Check, Act) é o ciclo de manutenção do padrão. Uma organização madura alterna: melhora com PDCA, padroniza com SDCA, e de novo.</p>
<h4>Lean: eliminar desperdícios</h4>
<p>Originado no Sistema Toyota de Produção, foca em gerar valor para o cliente com o mínimo de desperdício. Os <b>8 desperdícios</b> (mnemônico em inglês DOWNTIME):</p>
<table><tr><th>Desperdício</th><th>Exemplo em serviços</th></tr>
<tr><td>Defeitos</td><td>Cadastro com erro que gera retrabalho</td></tr>
<tr><td>Superprodução</td><td>Relatórios que ninguém lê</td></tr>
<tr><td>Espera</td><td>Paciente aguardando resultado de exame</td></tr>
<tr><td>Talento não utilizado</td><td>Ideias da equipe ignoradas</td></tr>
<tr><td>Transporte</td><td>Documentos levados de setor em setor</td></tr>
<tr><td>Inventário (estoque)</td><td>E-mails acumulados, materiais parados</td></tr>
<tr><td>Movimentação</td><td>Procurar ferramentas, cliques desnecessários</td></tr>
<tr><td>Excesso de processamento</td><td>Aprovações em duplicidade</td></tr></table>
<p>Ferramentas Lean: mapeamento do fluxo de valor (VSM), fluxo contínuo, puxar (kanban), trabalho padronizado, troca rápida (SMED), TPM (manutenção produtiva total), gestão visual, gemba (ir ao local onde o trabalho acontece).</p>
<h4>5S</h4>
<table><tr><th>Senso</th><th>Japonês</th><th>Prática</th></tr>
<tr><td>Utilização</td><td>Seiri</td><td>Separar e descartar o desnecessário</td></tr>
<tr><td>Ordenação</td><td>Seiton</td><td>Um lugar para cada coisa, identificado</td></tr>
<tr><td>Limpeza</td><td>Seiso</td><td>Limpar e inspecionar</td></tr>
<tr><td>Padronização / saúde</td><td>Seiketsu</td><td>Padrões visuais e condições saudáveis</td></tr>
<tr><td>Autodisciplina</td><td>Shitsuke</td><td>Manter e melhorar como hábito</td></tr></table>
<p>O 5S contribui para as três normas: menos erros (qualidade), menos desperdício e vazamentos visíveis (ambiente), menos tropeços e obstáculos (SSO).</p>
<h4>Kaizen</h4>
<p>Melhoria contínua em pequenos passos, com participação de todos. Formatos: programa de sugestões, eventos kaizen de 3 a 5 dias focados num problema, círculos de melhoria.</p>
<h4>Seis Sigma</h4>
<p>Metodologia para reduzir variação com estatística, usando o ciclo <b>DMAIC</b>: Definir, Medir, Analisar, Melhorar (Improve), Controlar. Níveis de formação: Yellow, Green, Black e Master Black Belt. "Seis sigma" de desempenho equivale a cerca de 3,4 defeitos por milhão de oportunidades (considerando o deslocamento convencional de 1,5 sigma). Lean Seis Sigma combina velocidade (Lean) e precisão (Seis Sigma).</p>
<h4>Escolhendo a abordagem</h4>
<p>Problema simples com causa evidente: kaizen rápido ou PDCA. Problema crônico com dados: MASP ou DMAIC. Processo lento e burocrático: Lean e VSM. Ambiente desorganizado: 5S como base.</p>`,
["PDCA melhora; SDCA mantém o padrão","8 desperdícios Lean (DOWNTIME)","5S apoia qualidade, ambiente e SSO","Kaizen: pequenas melhorias com todos","Seis Sigma: DMAIC e redução de variação"],

L("Indicadores de desempenho e Balanced Scorecard",`<h4>Indicador bom é indicador usado</h4>
<p>Indicadores existem para responder perguntas de gestão: estamos atingindo os objetivos? Onde agir? A ação funcionou? Se ninguém toma decisão a partir de um indicador, ele é custo, não informação.</p>
<h4>Tipos de indicadores</h4>
<table><tr><th>Tipo</th><th>Mede</th><th>Exemplo</th></tr>
<tr><td>Eficácia</td><td>Se o resultado foi atingido</td><td>% de entregas no prazo</td></tr>
<tr><td>Eficiência</td><td>Recursos usados para o resultado</td><td>Custo por atendimento</td></tr>
<tr><td>Efetividade</td><td>Impacto real para cliente ou sociedade</td><td>Redução de reinternações hospitalares</td></tr>
<tr><td>De resultado (lagging)</td><td>Consequência, olhando para trás</td><td>Taxa de frequência de acidentes</td></tr>
<tr><td>De tendência (leading)</td><td>Condição que antecipa o resultado</td><td>% de inspeções de segurança realizadas</td></tr></table>
<h4>Ficha técnica do indicador</h4>
<p>Nome; objetivo ligado; fórmula; unidade; fonte dos dados; responsável pela coleta e pela análise; frequência; meta e tolerância; polaridade (quanto maior, melhor, ou o contrário); forma de apresentação; ação esperada quando fora da meta.</p>
<h4>Balanced Scorecard (BSC)</h4>
<p>Criado por Kaplan e Norton, equilibra indicadores em quatro perspectivas, ligadas por relações de causa e efeito num <b>mapa estratégico</b>:</p>
<table><tr><th>Perspectiva</th><th>Pergunta</th><th>Indicadores do SGI</th></tr>
<tr><td>Financeira</td><td>Como somos vistos por quem nos sustenta?</td><td>Custo da não qualidade, multas evitadas, custo de resíduos</td></tr>
<tr><td>Clientes e partes interessadas</td><td>Como os clientes e a sociedade nos veem?</td><td>NPS, reclamações, reclamações da comunidade</td></tr>
<tr><td>Processos internos</td><td>Em que precisamos ser excelentes?</td><td>Retrabalho, consumo de água por unidade, taxa de frequência</td></tr>
<tr><td>Aprendizado e crescimento</td><td>Como sustentamos a capacidade de melhorar?</td><td>Horas de treinamento, sugestões implementadas, clima organizacional</td></tr></table>
<h4>Metas: como definir</h4>
<ul><li>Use histórico (média e variação), benchmarking e capacidade do processo.</li>
<li>Meta desafiadora, mas viável, ligada a um plano.</li>
<li>Evite metas que geram comportamento indesejado (efeito "melancia": verde por fora, vermelho por dentro).</li></ul>
<h4>Análise de indicadores</h4>
<p>Olhe tendência, não só o último ponto. Três a cinco pontos seguidos piorando pedem análise, mesmo dentro da meta. Compare com metas e com outras unidades. Registre a análise e as decisões.</p>
<h4>Apresentação</h4>
<p>Gráficos de linha para tendências, barras para comparações, semáforo para status, poucas cores e títulos que contam a conclusão ("Reclamações caíram 40% após novo roteiro de atendimento").</p>`,
["Indicador só vale se gera decisão","Eficácia, eficiência, efetividade; lagging × leading","Ficha técnica completa para cada indicador","BSC: financeira, clientes, processos, aprendizado","Analise tendências e evite metas 'melancia'"],
`Uma rede de farmácias liga no mapa estratégico: treinamento em atendimento (aprendizado) → menos erros de dispensação (processos) → mais confiança e recompra (clientes) → aumento de receita e menos custos de falha (financeira).`,
`Monte um BSC com 3 indicadores por perspectiva para uma organização fictícia e as fichas técnicas completas de 4 deles. Desenhe o mapa estratégico com as relações de causa e efeito.`,
[["Indicador de tendência (leading) é:",["Taxa de frequência de acidentes","% de inspeções de segurança realizadas","Multas pagas","Reclamações do ano passado"],1,"Antecipa o resultado."],["As quatro perspectivas do BSC são:",["Qualidade, ambiente, SSO e custo","Financeira, clientes, processos internos, aprendizado e crescimento","PDCA","Pareto, Ishikawa, 5W2H, GUT"],1,"Kaplan e Norton."],["Três pontos seguidos piorando, ainda dentro da meta, indicam:",["Nada a fazer","Necessidade de analisar a tendência","Sucesso garantido","Erro do gráfico"],1,"Tendências antecipam problemas."]]),
L("Estatística aplicada e controle estatístico de processo",`<h4>Conceitos básicos</h4>
<table><tr><th>Medida</th><th>O que diz</th></tr>
<tr><td>Média</td><td>Valor central (sensível a extremos)</td></tr>
<tr><td>Mediana</td><td>Valor do meio quando os dados estão ordenados</td></tr>
<tr><td>Moda</td><td>Valor mais frequente</td></tr>
<tr><td>Amplitude</td><td>Maior − menor</td></tr>
<tr><td>Desvio padrão (σ ou s)</td><td>Quanto os dados se espalham em torno da média</td></tr></table>
<p>Exemplo: tempos de espera de 8, 9, 10, 10, 33 minutos. Média 14, mediana 10: o valor extremo puxa a média. Para tempos e valores com extremos, a mediana costuma representar melhor.</p>
<h4>Distribuição normal</h4>
<p>Em muitos processos, os dados formam uma curva em sino. Aproximadamente 68% ficam a ±1σ da média, 95% a ±2σ e 99,7% a ±3σ.</p>
<h4>Variação comum × especial (Shewhart e Deming)</h4>
<ul><li><b>Causa comum</b>: variação natural do sistema, sempre presente. Reduzi-la exige mudar o sistema.</li>
<li><b>Causa especial</b>: evento fora do comum (um lote ruim, um equipamento desregulado). Deve ser investigada e eliminada.</li></ul>
<p>Erro clássico de gestão: tratar cada ponto alto como problema especial (reagir a ruído), ou ignorar sinais reais.</p>
<h4>Cartas de controle</h4>
<p>Gráfico com linha central (média) e limites de controle (geralmente média ± 3σ, calculados a partir dos dados do processo, não da especificação). Sinais de causa especial (regras de Western Electric/Nelson, resumidas): ponto fora dos limites; 7 a 9 pontos seguidos do mesmo lado da média; 6 pontos seguidos subindo ou descendo; padrões cíclicos.</p>
<table><tr><th>Tipo de dado</th><th>Carta</th></tr>
<tr><td>Medição em subgrupos (peso, tempo)</td><td>X̄-R ou X̄-S</td></tr>
<tr><td>Medição individual</td><td>I-MR (individuais e amplitude móvel)</td></tr>
<tr><td>Proporção de defeituosos</td><td>P ou np</td></tr>
<tr><td>Número de defeitos</td><td>C ou u</td></tr></table>
<h4>Capacidade do processo</h4>
<p>Compara a variação do processo com a especificação (LIE e LSE).</p>
<ul><li><b>Cp</b> = (LSE − LIE) / 6σ: potencial, se o processo estivesse centralizado.</li>
<li><b>Cpk</b> = menor de (LSE − média)/3σ e (média − LIE)/3σ: considera a centralização.</li>
<li>Referências usuais: Cpk ≥ 1,33 capaz; entre 1,0 e 1,33 aceitável com atenção; &lt; 1,0 incapaz.</li></ul>
<p>Exemplo: embalagens de 500 g com especificação 495–510 g, média 501 g e σ = 2 g. Cp = 15/12 = 1,25; Cpk = menor de (510−501)/6 = 1,5 e (501−495)/6 = 1,0 → Cpk 1,0: centralizar o processo aumentaria a capacidade.</p>
<h4>Amostragem e cuidados</h4>
<p>Defina como coletar (aleatório, por estrato), garanta medições confiáveis (sistema de medição adequado) e cuidado com conclusões a partir de poucos dados. Correlação não prova causa.</p>
<h4>Ferramentas</h4>
<p>Excel/Google Planilhas (funções MÉDIA, MED, DESVPAD), Minitab, R, Python. Assistentes de IA podem gerar fórmulas e gráficos; confira sempre os cálculos.</p>`,
["Média, mediana, moda e desvio padrão","Causa comum (sistema) × causa especial (evento)","Limites de controle vêm dos dados, não da especificação","Cp potencial; Cpk considera centralização; ≥ 1,33 capaz","Correlação não prova causa"],
`Um call center plota diariamente o tempo médio de atendimento numa carta I-MR. Um ponto acima do limite superior numa segunda-feira é investigado: queda do sistema por 2 horas (causa especial). Os demais dias variam dentro dos limites; para reduzir o tempo médio, é preciso mudar o sistema (scripts, base de conhecimento).`,

L("Auditoria interna integrada e análise crítica pela direção",`<h4>Programa de auditoria interna do SGI</h4>
<ul><li>Abrangência: todos os processos e requisitos das três normas no ciclo (geralmente anual).</li>
<li>Frequência por risco: processos com aspectos significativos, riscos altos de SSO, reclamações ou mudanças recebem mais atenção.</li>
<li>Auditores internos de diversas áreas, treinados na ISO 19011 e nas três normas, sem auditar a própria área.</li>
<li>Planos, checklists por processo, relatórios e acompanhamento de ações.</li></ul>
<h4>Formando auditores internos</h4>
<p>Curso típico de 16 a 24 horas: princípios e técnicas (ISO 19011), requisitos das normas, prática de entrevistas, redação de NCs e simulação. Depois, primeiras auditorias acompanhadas por auditor experiente. Avalie os auditores após cada ciclo.</p>
<h4>Fazendo a auditoria interna agregar valor</h4>
<ul><li>Foco em riscos e resultados, não só em papéis.</li>
<li>Pontos fortes também registrados.</li>
<li>Oportunidades de melhoria práticas.</li>
<li>Linguagem respeitosa: auditoria é ajuda, não fiscalização.</li>
<li>Relatório com conclusão sobre a eficácia do processo.</li></ul>
<h4>Análise crítica pela direção integrada</h4>
<table><tr><th>Entradas comuns</th><th>Específicas da 9001</th><th>Específicas da 14001</th><th>Específicas da 45001</th></tr>
<tr><td>Situação de ações anteriores; mudanças em questões internas e externas; desempenho (NCs e ações, monitoramento, auditorias, objetivos); adequação de recursos; riscos e oportunidades; oportunidades de melhoria</td><td>Satisfação do cliente; desempenho de processos e conformidade de produtos; desempenho de provedores externos</td><td>Obrigações de compliance; aspectos ambientais significativos; comunicações de partes interessadas; desempenho ambiental</td><td>Necessidades das partes interessadas; requisitos legais; incidentes; resultados de consulta e participação; comunicação pertinente com partes interessadas</td></tr></table>
<p><b>Saídas</b>: conclusões sobre adequação, suficiência e eficácia; oportunidades de melhoria; necessidade de mudanças; recursos; ações quando objetivos não foram atingidos; oportunidades de integrar o sistema a outros processos de negócio; implicações para a direção estratégica.</p>
<h4>Roteiro de reunião (2 a 3 horas)</h4>
<ol><li>Situação das ações da última análise (10 min).</li>
<li>Contexto e partes interessadas: o que mudou (15 min).</li>
<li>Painel integrado de indicadores e objetivos (40 min).</li>
<li>Auditorias, NCs, incidentes e compliance legal (30 min).</li>
<li>Riscos e oportunidades (20 min).</li>
<li>Recursos e mudanças necessárias (20 min).</li>
<li>Decisões, responsáveis e prazos (15 min).</li></ol>
<p>Envie o material com antecedência para a reunião ser de decisão, não de apresentação. Registre a ata com as saídas e acompanhe as ações até a próxima análise.</p>`,

MOD("sgi","Outras normas e temas do SGI moderno","Conhecer as normas e temas que se somam ao SGI: ESG e sustentabilidade, segurança da informação e LGPD, continuidade de negócios, energia e compliance.",[
L("ESG, responsabilidade social e relato de sustentabilidade",`<h4>O que é ESG</h4>
<p>ESG (<i>Environmental, Social and Governance</i>) é a forma como investidores, clientes e sociedade avaliam a sustentabilidade e a responsabilidade de uma organização. O SGI é uma base forte para ESG: a ISO 14001 cobre boa parte do "E", a ISO 45001 parte do "S" e a governança dos sistemas contribui para o "G".</p>
<table><tr><th>Pilar</th><th>Temas</th></tr>
<tr><td>Ambiental</td><td>Mudança climática e emissões, água, resíduos, biodiversidade, uso de recursos</td></tr>
<tr><td>Social</td><td>Saúde e segurança, diversidade e inclusão, direitos humanos, relação com comunidades, privacidade, cadeia de fornecimento</td></tr>
<tr><td>Governança</td><td>Ética e integridade, anticorrupção, estrutura de conselho, transparência, gestão de riscos, remuneração</td></tr></table>
<h4>ISO 26000: responsabilidade social</h4>
<p>Norma de diretrizes (não certificável) com 7 princípios (accountability, transparência, comportamento ético, respeito às partes interessadas, ao estado de direito, às normas internacionais de comportamento e aos direitos humanos) e 7 temas centrais: governança organizacional, direitos humanos, práticas de trabalho, meio ambiente, práticas leais de operação, questões relativas ao consumidor, envolvimento e desenvolvimento da comunidade.</p>
<h4>Referências de relato</h4>
<table><tr><th>Referência</th><th>Uso</th></tr>
<tr><td>GRI Standards</td><td>Relatório de sustentabilidade com foco em impactos para a sociedade e o ambiente; muito usado no Brasil</td></tr>
<tr><td>Normas IFRS S1 e S2 (ISSB, 2023)</td><td>Informações financeiras relacionadas à sustentabilidade e ao clima, para investidores; no Brasil, a CVM (Resolução 193/2023) as adotou, com obrigatoriedade progressiva para companhias abertas</td></tr>
<tr><td>GHG Protocol / ISO 14064</td><td>Inventário de emissões</td></tr>
<tr><td>ODS da ONU (Agenda 2030)</td><td>17 objetivos para alinhar a estratégia</td></tr>
<tr><td>ABNT PR 2030</td><td>Prática recomendada brasileira sobre ESG: conceitos, critérios e modelo de avaliação</td></tr></table>
<p>As exigências de relato mudam com frequência; acompanhe a CVM, o ISSB e a GRI.</p>
<h4>Materialidade</h4>
<p>Processo para definir quais temas são mais relevantes: consulta a partes interessadas, análise de impactos e de riscos financeiros. A <b>dupla materialidade</b> considera os dois sentidos: impacto da organização no mundo e impacto dos temas de sustentabilidade na organização.</p>
<h4>Greenwashing</h4>
<p>Prática de declarar benefícios ambientais ou sociais exagerados ou sem evidência. Evite: alegações vagas ("ecológico", "verde"), selos inventados, foco num pequeno benefício escondendo grandes impactos. Toda alegação precisa de dados verificáveis, o que um SGI bem gerido fornece.</p>`,
["ESG = ambiental, social, governança","SGI é base para ESG","ISO 26000: 7 princípios e 7 temas centrais, não certificável","GRI, IFRS S1/S2 (CVM 193), GHG Protocol, ODS, ABNT PR 2030","Dupla materialidade e cuidado com greenwashing"],
`Uma indústria de cosméticos com SGI usa dados da ISO 14001 (água, resíduos, emissões), da ISO 45001 (taxa de frequência, treinamentos) e do programa de integridade para publicar seu relatório GRI e definir metas ligadas aos ODS 6 (água), 8 (trabalho decente) e 12 (consumo responsável).`,
`Faça uma matriz de materialidade para uma organização fictícia com 15 temas ESG, indicando para cada um o impacto externo e o impacto financeiro. Escolha 5 ODS prioritários e proponha um indicador para cada.`,
[["A ISO 26000 é:",["Certificável","Norma de diretrizes de responsabilidade social, não certificável","Norma de energia","Norma de auditoria"],1,"Diretrizes, não requisitos."],["Dupla materialidade considera:",["Só lucro","Impactos da organização no mundo e dos temas de sustentabilidade na organização","Apenas o meio ambiente","Dois relatórios por ano"],1,"Impacto e risco financeiro."],["Alegar ser 'ecológico' sem dados verificáveis é:",["ESG","Greenwashing","Economia circular","compliance"],1,"Greenwashing."]]),
L("Segurança da informação (ISO 27001) e LGPD",`<h4>ISO/IEC 27001</h4>
<p>Norma certificável de sistema de gestão de segurança da informação (SGSI), com a mesma Estrutura Harmonizada (cláusulas 4 a 10). Protege a <b>confidencialidade</b> (só quem deve acessa), a <b>integridade</b> (informação correta e completa) e a <b>disponibilidade</b> (acessível quando necessário), o chamado tripé CID.</p>
<h4>Elementos específicos</h4>
<ul><li><b>Avaliação de riscos de segurança da informação</b>: ativos, ameaças, vulnerabilidades, impactos.</li>
<li><b>Tratamento de riscos</b> com seleção de controles.</li>
<li><b>Declaração de Aplicabilidade (SoA)</b>: lista dos controles do Anexo A, com justificativa de inclusão ou exclusão e status.</li>
<li>Na edição de 2022, o Anexo A tem 93 controles em 4 temas: organizacionais, de pessoas, físicos e tecnológicos. A ISO/IEC 27002 detalha como implementá-los.</li></ul>
<h4>Exemplos de controles</h4>
<table><tr><th>Tema</th><th>Controles</th></tr>
<tr><td>Organizacionais</td><td>Política de segurança, classificação da informação, gestão de fornecedores, resposta a incidentes, inteligência de ameaças</td></tr>
<tr><td>Pessoas</td><td>Verificação de antecedentes, conscientização, acordos de confidencialidade, trabalho remoto</td></tr>
<tr><td>Físicos</td><td>Controle de acesso a áreas, mesa limpa, proteção de equipamentos</td></tr>
<tr><td>Tecnológicos</td><td>Autenticação forte, backup, criptografia, gestão de vulnerabilidades, registro de logs, prevenção de vazamento de dados</td></tr></table>
<h4>LGPD: Lei Geral de Proteção de Dados (Lei 13.709/2018)</h4>
<ul><li>Aplica-se ao tratamento de dados pessoais por pessoas e organizações, on-line e off-line.</li>
<li><b>Dado pessoal</b>: identifica ou pode identificar uma pessoa. <b>Dado sensível</b>: origem racial ou étnica, convicção religiosa, opinião política, filiação sindical, saúde, vida sexual, genético ou biométrico.</li>
<li><b>Bases legais</b> para tratar dados: consentimento, cumprimento de obrigação legal, execução de contrato, legítimo interesse, proteção da vida, tutela da saúde, entre outras.</li>
<li><b>Princípios</b>: finalidade, adequação, necessidade, livre acesso, qualidade, transparência, segurança, prevenção, não discriminação, responsabilização.</li>
<li><b>Direitos dos titulares</b>: acesso, correção, eliminação, portabilidade, informação sobre compartilhamento, revogação do consentimento.</li>
<li><b>Agentes</b>: controlador, operador e encarregado (DPO). Fiscalização pela <b>ANPD</b>, com sanções que incluem multas de até 2% do faturamento, limitadas a R$ 50 milhões por infração.</li></ul>
<h4>SGI e dados pessoais</h4>
<p>Um SGI lida com muitos dados pessoais: ASOs e atestados (dados de saúde, sensíveis), registros de treinamento, investigações de acidentes, pesquisas de satisfação. Aplique necessidade, controle de acesso e prazos de retenção. A ISO 9001 (8.5.3) já trata dados do cliente como sua propriedade a ser protegida.</p>
<h4>Integração</h4>
<p>A ISO 27001 se integra facilmente ao SGI pela estrutura comum. A ISO/IEC 27701 estende o SGSI para gestão de privacidade, ajudando a demonstrar conformidade com a LGPD.</p>`,
["Tripé CID: confidencialidade, integridade, disponibilidade","ISO 27001: riscos de SI, Declaração de Aplicabilidade, 93 controles (2022)","LGPD: bases legais, princípios, direitos e ANPD","Dados de saúde são sensíveis (ASOs, atestados)","ISO/IEC 27701 para privacidade"],
`Uma clínica com ISO 9001 integra a 27001: classifica prontuários como confidenciais, implanta autenticação em dois fatores, backup diário criptografado fora do local, termo de confidencialidade para todos e procedimento de resposta a incidentes com comunicação à ANPD e aos pacientes quando necessário.`,
`Faça o inventário de 15 ativos de informação de uma organização fictícia (incluindo dados pessoais), identifique ameaças e vulnerabilidades, e escreva 10 controles. Liste quais dados do SGI são pessoais ou sensíveis e a base legal de cada tratamento.`,
[["O 'D' do tripé CID significa:",["Documentação","Disponibilidade","Dados","Defesa"],1,"Confidencialidade, integridade, disponibilidade."],["Dado de saúde, pela LGPD, é:",["Dado público","Dado pessoal sensível","Dado anônimo","Dado irrelevante"],1,"Categoria especial de dados."],["Documento da ISO 27001 que justifica os controles aplicados:",["Declaração de Aplicabilidade","Manual da Qualidade","PGR","LAIA"],0,"Statement of Applicability (SoA)."]]),
L("Continuidade de negócios (ISO 22301) e energia (ISO 50001)",`<h4>ISO 22301: gestão da continuidade de negócios</h4>
<p>Prepara a organização para continuar entregando seus produtos e serviços críticos durante e após uma interrupção: pandemias, ciberataques, enchentes, falta de energia, falha de fornecedor crítico, incêndio. Mesma Estrutura Harmonizada, certificável.</p>
<h4>Conceitos-chave</h4>
<table><tr><th>Termo</th><th>Significado</th></tr>
<tr><td>BIA (análise de impacto nos negócios)</td><td>Identifica atividades críticas e o impacto de sua interrupção ao longo do tempo</td></tr>
<tr><td>MTPD</td><td>Tempo máximo tolerável de interrupção antes de danos inaceitáveis</td></tr>
<tr><td>RTO</td><td>Tempo-objetivo para retomar uma atividade</td></tr>
<tr><td>RPO</td><td>Quantidade máxima de dados que se aceita perder (ex.: último backup de 4 horas)</td></tr>
<tr><td>MBCO</td><td>Nível mínimo de serviço aceitável durante a crise</td></tr></table>
<h4>Ciclo da continuidade</h4>
<ol><li>BIA e avaliação de riscos de interrupção.</li>
<li>Estratégias e soluções: locais alternativos, trabalho remoto, fornecedores substitutos, estoques de segurança, redundância de TI.</li>
<li>Planos de continuidade e de gestão de crise, com papéis e comunicação.</li>
<li><b>Exercícios e testes</b> (de mesa, simulação, teste real).</li>
<li>Análise e melhoria.</li></ol>
<p>Liga-se diretamente a 8.2 (emergências) das normas 14001 e 45001: emergência cuida das pessoas e do ambiente no momento; continuidade cuida de manter o negócio funcionando.</p>
<h4>ISO 50001: gestão de energia</h4>
<p>Sistema para melhorar o <b>desempenho energético</b> (eficiência, uso e consumo). Certificável, com Estrutura Harmonizada.</p>
<table><tr><th>Elemento</th><th>Explicação</th></tr>
<tr><td>Revisão energética</td><td>Análise do uso e consumo para identificar os usos significativos de energia (USE)</td></tr>
<tr><td>Linha de base energética (LBE)</td><td>Referência para comparar o desempenho</td></tr>
<tr><td>Indicadores de desempenho energético (IDE)</td><td>Ex.: kWh por tonelada, kWh por m² climatizado</td></tr>
<tr><td>Variáveis relevantes</td><td>Fatores que afetam o consumo (produção, temperatura externa, horas de operação)</td></tr>
<tr><td>Normalização</td><td>Ajustar dados às variáveis para comparar de forma justa</td></tr>
<tr><td>Projeto e compras</td><td>Considerar eficiência energética ao projetar e comprar equipamentos</td></tr></table>
<h4>Oportunidades típicas de eficiência</h4>
<p>Iluminação LED com sensores, motores de alto rendimento e inversores de frequência, correção de vazamentos de ar comprimido, isolamento térmico, gestão de demanda, energia solar, manutenção de climatização, desligamento automático fora do expediente. Ganhos de energia reduzem custos e o escopo 2 das emissões, conectando ISO 50001, ISO 14001 e ESG.</p>`,
["ISO 22301: continuidade durante e após interrupções","BIA, MTPD, RTO, RPO","Testes e exercícios são obrigatórios na prática","ISO 50001: desempenho energético, USE, LBE, IDE","Eficiência energética reduz custo e emissões"],
`Uma escola faz BIA e conclui que aulas on-line precisam voltar em até 4 horas (RTO) após falha de internet e que o sistema de notas não pode perder mais de 24 horas de dados (RPO). Solução: segunda operadora de internet, backup diário em nuvem e teste semestral.`,

L("Compliance, integridade e antissuborno (ISO 37301 e ISO 37001)",`<h4>O que é compliance</h4>
<p>Estar em conformidade com leis, regulamentos, normas internas e compromissos voluntários, e principalmente ter uma cultura que faz isso acontecer. No SGI, já existe compliance legal ambiental e de SSO; um sistema de compliance amplia para todas as obrigações da organização.</p>
<h4>ISO 37301: sistemas de gestão de compliance</h4>
<p>Publicada em 2021 (substituiu a ISO 19600), certificável, com Estrutura Harmonizada. Elementos centrais: identificação das obrigações de compliance, avaliação de riscos de compliance, função de compliance com independência e acesso à alta direção, cultura de compliance, canal de denúncias, investigações, controles, monitoramento e relato.</p>
<h4>ISO 37001: sistemas de gestão antissuborno</h4>
<p>Certificável, voltada a prevenir, detectar e responder ao suborno (oferecer ou receber vantagem indevida). Requisitos específicos incluem:</p>
<ul><li>Política antissuborno e função de compliance antissuborno.</li>
<li><b>Due diligence</b> de parceiros de negócio, projetos e funcionários em posições de risco.</li>
<li>Controles financeiros (aprovações, segregação de funções) e não financeiros (compras, contratos).</li>
<li>Regras para presentes, hospitalidade, doações e patrocínios.</li>
<li>Canal para levantar preocupações sem retaliação, investigação e tratamento.</li></ul>
<h4>Legislação brasileira</h4>
<table><tr><th>Norma</th><th>Conteúdo</th></tr>
<tr><td>Lei 12.846/2013 (Lei Anticorrupção)</td><td>Responsabilização objetiva administrativa e civil de pessoas jurídicas por atos contra a administração pública</td></tr>
<tr><td>Decreto 11.129/2022</td><td>Regulamenta a lei e define parâmetros de avaliação de programas de integridade</td></tr>
<tr><td>Lei 14.133/2021 (Licitações)</td><td>Exige programa de integridade em contratações de grande vulto e o considera em desempate e sanções</td></tr>
<tr><td>Lei 14.457/2022</td><td>Medidas de prevenção e combate ao assédio sexual e outras formas de violência no trabalho, com obrigações para a CIPA</td></tr></table>
<h4>Programa de integridade: pilares</h4>
<ol><li>Comprometimento da alta direção (tone at the top).</li>
<li>Avaliação de riscos.</li>
<li>Código de conduta e políticas.</li>
<li>Controles internos.</li>
<li>Treinamento e comunicação.</li>
<li>Canal de denúncias confidencial, com proteção ao denunciante.</li>
<li>Investigação e medidas disciplinares.</li>
<li>Due diligence de terceiros.</li>
<li>Monitoramento e melhoria contínua.</li></ol>
<h4>Conexão com o SGI</h4>
<p>O canal de denúncias pode receber relatos de assédio (SSO psicossocial), fraudes em inspeções (qualidade) e descarte irregular (ambiente). A ética da liderança é tema da revisão da ISO 9001, e a ISO 19011 coloca a integridade como primeiro princípio do auditor. Compliance é o fio que costura todas as disciplinas.</p>`,
["ISO 37301 (compliance) e ISO 37001 (antissuborno), certificáveis","Due diligence de parceiros e regras de presentes e hospitalidade","Lei 12.846/2013 e Decreto 11.129/2022","Lei 14.457/2022: prevenção ao assédio e papel da CIPA","Canal de denúncias com proteção ao denunciante integra o SGI"],

`Escreva um código de conduta resumido (2 páginas) para uma organização fictícia, incluindo regras de presentes, conflito de interesses, assédio e canal de denúncias. Monte uma matriz de riscos de compliance com 12 riscos.`,
[["A ISO 37001 trata de:",["Energia","Gestão antissuborno","Continuidade","Privacidade"],1,"Sistemas de gestão antissuborno."],["A Lei 12.846/2013 é conhecida como:",["Lei Geral de Proteção de Dados","Lei Anticorrupção","Lei de Licitações","Lei de Resíduos"],1,"Lei Anticorrupção."],["Due diligence significa:",["Auditoria de certificação","Diligência prévia para avaliar riscos de parceiros e operações","Contrato de trabalho","Um tipo de EPI"],1,"Avaliação prévia de riscos."]])

MOD("sgi","Implementação do SGI e trabalho de conclusão","Planejar e conduzir a implementação de um SGI, liderar a mudança cultural e desenvolver e apresentar o TCC da pós.",[
L("Projeto de implementação: diagnóstico, cronograma e recursos",`<h4>Tratando a implementação como projeto</h4>
<p>Implantar um SGI é um projeto com objetivo, escopo, prazo, recursos e riscos. Use princípios de gestão de projetos (PMBOK, métodos ágeis) para não deixar a implantação "eterna".</p>
<h4>Fase 1: diagnóstico (gap analysis)</h4>
<ul><li>Checklist de todos os requisitos das três normas, com situação: atende, atende parcialmente, não atende.</li>
<li>Levantamento legal inicial (ambiental e SSO): é comum descobrir pendências graves (licenças, AVCB, PGR).</li>
<li>Entrevistas com direção e donos de processo; visitas ao local.</li>
<li>Resultado: relatório de lacunas, priorizado por risco e esforço.</li></ul>
<h4>Fase 2: planejamento</h4>
<table><tr><th>Item</th><th>Conteúdo</th></tr>
<tr><td>Termo de abertura</td><td>Objetivo, escopo, patrocinador, prazo, orçamento</td></tr>
<tr><td>Estrutura</td><td>Comitê do SGI, coordenador, donos de processo, apoio técnico (qualidade, SESMT, ambiente)</td></tr>
<tr><td>EAP</td><td>Pacotes de trabalho: contexto e riscos, documentação, adequações legais, treinamento, auditoria interna, análise crítica, certificação</td></tr>
<tr><td>Cronograma</td><td>Marcos e dependências (gráfico de Gantt)</td></tr>
<tr><td>Orçamento</td><td>Consultoria, treinamentos, adequações físicas, software, certificação</td></tr>
<tr><td>Riscos do projeto</td><td>Baixa adesão, falta de tempo das equipes, pendências legais caras</td></tr>
<tr><td>Comunicação</td><td>Como informar o avanço a todos</td></tr></table>
<h4>Cronograma típico (organização média)</h4>
<table><tr><th>Mês</th><th>Atividades</th></tr>
<tr><td>1–2</td><td>Diagnóstico, comitê, contexto, partes interessadas, mapa de processos</td></tr>
<tr><td>2–4</td><td>Riscos integrados, LAIA, inventário de perigos, matriz legal, política e objetivos</td></tr>
<tr><td>3–6</td><td>Documentação, adequações legais e físicas, treinamentos</td></tr>
<tr><td>6–8</td><td>Operação do sistema, coleta de registros, indicadores</td></tr>
<tr><td>8–9</td><td>Formação de auditores internos e auditoria interna completa</td></tr>
<tr><td>9–10</td><td>Ações corretivas, análise crítica, escolha do OC</td></tr>
<tr><td>10–12</td><td>Auditorias de certificação estágio 1 e 2</td></tr></table>
<p>Prazos variam muito com tamanho, complexidade, maturidade e situação legal.</p>
<h4>Consultoria: quando e como</h4>
<p>Uma consultoria acelera e traz experiência, mas o sistema precisa ser da organização. Contrate com transferência de conhecimento, entregáveis claros e participação das equipes. Desconfie de "sistemas prontos" copiados de outras empresas.</p>
<h4>Indicadores do projeto</h4>
<p>% de requisitos atendidos, % de documentos aprovados, pessoas treinadas, pendências legais resolvidas, cumprimento do cronograma e do orçamento.</p>`,
["Implantação é projeto: escopo, prazo, recursos e riscos","Gap analysis priorizado por risco e esforço","Levantamento legal cedo: evita surpresas caras","Cronograma com marcos até a certificação","Consultoria com transferência de conhecimento"],
`Uma empresa de engenharia de 80 pessoas faz o gap analysis e descobre: ISO 9001 já certificada (70% dos requisitos comuns atendidos), PGR desatualizado, sem avaliação de conformidade ambiental e sem consulta formal aos trabalhadores. O plano prioriza as pendências legais nos primeiros 60 dias.`,
`Elabore o projeto completo de implementação de um SGI para uma organização fictícia: gap analysis resumido, termo de abertura, EAP, cronograma de 12 meses, orçamento estimado e 8 riscos do projeto com respostas.`,

L("Gestão da mudança, cultura e engajamento",`<h4>Por que implantações falham</h4>
<p>Raramente por falta de documentos; quase sempre por pessoas: liderança ausente, sistema visto como "coisa da qualidade", excesso de burocracia, falta de comunicação, resistência a mudar hábitos.</p>
<h4>Modelo de Kotter: 8 passos da mudança</h4>
<ol><li>Criar senso de urgência (por que mudar agora?).</li>
<li>Formar uma coalizão orientadora.</li>
<li>Criar visão e estratégia.</li>
<li>Comunicar a visão.</li>
<li>Remover obstáculos e empoderar.</li>
<li>Gerar vitórias de curto prazo.</li>
<li>Consolidar ganhos e produzir mais mudança.</li>
<li>Ancorar as mudanças na cultura.</li></ol>
<h4>ADKAR: a mudança individual</h4>
<p>Cada pessoa passa por <b>Awareness</b> (consciência da necessidade), <b>Desire</b> (desejo de participar), <b>Knowledge</b> (conhecimento de como), <b>Ability</b> (capacidade de fazer) e <b>Reinforcement</b> (reforço para manter). Treinamento só resolve o K; sem A e D, as pessoas aprendem mas não mudam.</p>
<h4>Lidando com resistência</h4>
<table><tr><th>Causa</th><th>Resposta</th></tr>
<tr><td>Não entende o porquê</td><td>Explicar benefícios concretos para a pessoa e a equipe</td></tr>
<tr><td>Medo de mais trabalho</td><td>Simplificar, eliminar burocracia, mostrar ganhos de tempo</td></tr>
<tr><td>Medo de punição</td><td>Cultura justa, foco no sistema e não em culpados</td></tr>
<tr><td>Não foi ouvido</td><td>Envolver na construção dos procedimentos e na avaliação de riscos</td></tr>
<tr><td>Falta de exemplo da liderança</td><td>Líderes visíveis no chão de fábrica, usando EPI e seguindo procedimentos</td></tr></table>
<h4>Comunicação e engajamento</h4>
<ul><li>Mensagens simples e frequentes (DDS, murais, vídeos curtos, aplicativos).</li>
<li>Embaixadores do SGI em cada área.</li>
<li>Reconhecimento de boas práticas e ideias.</li>
<li>Gamificação: desafios de 5S, metas de relatos de quase acidentes, campanhas ambientais.</li>
<li>Mostrar resultados: "graças às sugestões, reduzimos 30% do retrabalho".</li></ul>
<h4>Liderança no SGI</h4>
<p>O líder de SGI é um facilitador: entende de normas, mas principalmente de pessoas, processos e negócio. Competências: comunicação, negociação, visão sistêmica, análise de dados, educação de adultos, ética. Sua credibilidade cresce quando o SGI resolve problemas reais, não quando gera mais formulários.</p>
<h4>Maturidade sustentada</h4>
<p>Depois da certificação, o risco é o sistema "dormir" até a próxima auditoria. Mantenha vivo com rotinas de gestão (reuniões de indicadores, gemba, auditorias por camadas), revisão de riscos e projetos de melhoria.</p>`,

L("TCC: projeto, desenvolvimento e apresentação",`<h4>O que é o TCC desta pós</h4>
<p>Um trabalho aplicado que demonstra domínio do SGI: diagnosticar, planejar e propor (ou implementar) melhorias integradas em uma organização real ou em um caso bem fundamentado. Formatos aceitos em pós-graduações: artigo científico (15–25 páginas) ou relatório técnico/estudo de caso, conforme a instituição.</p>
<h4>Sugestões de temas</h4>
<ul><li>Diagnóstico e plano de integração de ISO 9001, 14001 e 45001 em uma organização.</li>
<li>Gestão de riscos integrada com ISO 31000 e bow-tie em um processo crítico.</li>
<li>Redução de acidentes com base em indicadores proativos e cultura de segurança.</li>
<li>Programa de gestão de resíduos e economia circular com indicadores.</li>
<li>Inventário de GEE e plano de redução alinhado a ODS.</li>
<li>Aplicação de Lean Seis Sigma (DMAIC) para reduzir um problema de qualidade.</li>
<li>Avaliação da maturidade do SGI pela ISO 9004.</li>
<li>Uso de inteligência artificial na gestão de documentos, auditorias ou indicadores do SGI.</li></ul>
<h4>Estrutura do artigo</h4>
<table><tr><th>Seção</th><th>Conteúdo</th></tr>
<tr><td>Título e resumo</td><td>150–250 palavras: problema, objetivo, método, resultados, conclusão; 3–5 palavras-chave</td></tr>
<tr><td>Introdução</td><td>Contexto, problema, justificativa, objetivo geral e específicos</td></tr>
<tr><td>Referencial teórico</td><td>Normas, autores e estudos sobre o tema, com citações</td></tr>
<tr><td>Metodologia</td><td>Tipo de pesquisa (estudo de caso, pesquisa-ação), local, período, coleta e análise de dados</td></tr>
<tr><td>Resultados e discussão</td><td>Dados, ferramentas aplicadas, comparação com a literatura</td></tr>
<tr><td>Conclusão</td><td>Respostas aos objetivos, limitações, sugestões de trabalhos futuros</td></tr>
<tr><td>Referências</td><td>No padrão ABNT NBR 6023</td></tr></table>
<h4>Normas ABNT para trabalhos acadêmicos</h4>
<p>NBR 6022 (artigo), NBR 14724 (trabalhos acadêmicos), NBR 6023 (referências), NBR 10520 (citações), NBR 6028 (resumo). Confira as versões vigentes e o manual da sua instituição.</p>
<h4>Onde pesquisar</h4>
<p>Google Acadêmico, SciELO, Portal de Periódicos CAPES, repositórios de universidades, Biblioteca Digital Brasileira de Teses e Dissertações (BDTD), sites da ISO, ABNT, ABQ, Inmetro, MTE, IBAMA.</p>
<h4>Ética e uso de IA</h4>
<p>Cite todas as fontes (plágio é falta grave). Ferramentas de IA podem ajudar a organizar ideias, revisar texto e sugerir estrutura, mas não devem inventar dados ou referências; verifique cada citação na fonte original e siga as regras da sua instituição sobre uso de IA. Dados de organizações reais exigem autorização e anonimização quando necessário.</p>
<h4>Cronograma sugerido (6 meses)</h4>
<p>Mês 1: tema, problema e objetivos. Mês 2: referencial teórico. Mês 3: metodologia e coleta. Mês 4: análise. Mês 5: redação completa e revisão. Mês 6: ajustes finais e apresentação.</p>
<h4>Apresentação</h4>
<p>15 a 20 minutos, 10 a 15 slides: problema, objetivo, método, principais resultados (gráficos), conclusões e contribuições. Ensaie, cronometre e prepare respostas para perguntas sobre método e limitações.</p>`,

L("O que é IA: conceitos, história e tipos",`<h4>Definições que você vai usar sempre</h4>
<table><tr><th>Termo</th><th>O que é</th></tr>
<tr><td>Inteligência Artificial (IA)</td><td>Campo que cria sistemas capazes de tarefas que normalmente exigiriam inteligência humana: reconhecer padrões, entender linguagem, decidir, criar</td></tr>
<tr><td>Machine Learning (aprendizado de máquina)</td><td>Sistemas que aprendem com exemplos em vez de regras escritas à mão</td></tr>
<tr><td>Deep Learning</td><td>Machine learning com redes neurais de muitas camadas</td></tr>
<tr><td>IA generativa</td><td>Modelos que criam conteúdo novo: texto, imagem, áudio, vídeo, código</td></tr>
<tr><td>LLM (grande modelo de linguagem)</td><td>Modelo treinado com enormes volumes de texto para entender e gerar linguagem; base do Claude, ChatGPT, Gemini e Copilot</td></tr>
<tr><td>Agente de IA</td><td>Sistema que usa um modelo para planejar e executar tarefas com ferramentas (navegar, usar arquivos, rodar código)</td></tr></table>
<h4>Linha do tempo</h4>
<table><tr><th>Ano</th><th>Marco</th></tr>
<tr><td>1950</td><td>Alan Turing propõe o "jogo da imitação" (teste de Turing)</td></tr>
<tr><td>1956</td><td>Conferência de Dartmouth cria o termo "inteligência artificial"</td></tr>
<tr><td>1970–1990</td><td>Sistemas especialistas e "invernos da IA" (falta de resultados e financiamento)</td></tr>
<tr><td>1997</td><td>Deep Blue vence Kasparov no xadrez</td></tr>
<tr><td>2012</td><td>Deep learning revoluciona o reconhecimento de imagens</td></tr>
<tr><td>2016</td><td>AlphaGo vence o campeão mundial de Go</td></tr>
<tr><td>2017</td><td>artigo "Attention Is All You Need" apresenta o Transformer, arquitetura dos LLMs atuais</td></tr>
<tr><td>2022</td><td>Lançamento do ChatGPT populariza a IA generativa</td></tr>
<tr><td>2023–2026</td><td>Assistentes multimodais (texto, voz, imagem), modelos que "raciocinam" antes de responder, agentes que usam o computador e escrevem software</td></tr></table>
<h4>Tipos de aprendizado</h4>
<ul><li><b>Supervisionado</b>: aprende com exemplos rotulados (e-mails marcados como spam ou não).</li>
<li><b>Não supervisionado</b>: encontra padrões sem rótulos (agrupar músicas parecidas).</li>
<li><b>Por reforço</b>: aprende por tentativa, erro e recompensa (jogos, robôs). Também é usado para ajustar LLMs com feedback humano.</li></ul>
<h4>IA que você já usa sem perceber</h4>
<p>Recomendações de séries e músicas, filtro de spam, reconhecimento facial do celular, corretor do teclado, rotas do GPS, tradução automática, legendas automáticas, detecção de fraude no cartão, assistentes de voz.</p>
<h4>IA fraca, forte e AGI</h4>
<p>Todas as IAs atuais são especializadas ou de propósito geral, mas sem consciência. <b>AGI</b> (inteligência artificial geral) seria uma IA tão capaz quanto humanos na maioria das tarefas; há debate intenso sobre se e quando isso acontecerá. Neste curso o foco é prático: usar muito bem as ferramentas que existem hoje.</p>`,

L("Como um LLM funciona por dentro (sem matemática)",`<h4>A ideia central</h4>
<p>Um LLM é treinado para prever o próximo pedaço de texto. Ao fazer isso com trilhões de palavras, ele aprende gramática, fatos, estilos, raciocínio e até programação. Depois, é ajustado com exemplos e feedback humano para ser útil, seguir instruções e evitar danos.</p>
<h4>Tokens</h4>
<p>Modelos não leem palavras, leem <b>tokens</b>: pedaços de palavras. Em português, uma palavra tem em média 1 a 2 tokens. Tokens importam porque definem o tamanho máximo de conversa e o custo em uso pago (APIs cobram por milhão de tokens de entrada e de saída).</p>
<h4>Janela de contexto</h4>
<p>É a "memória de trabalho" da conversa: tudo que o modelo consegue considerar de uma vez (suas mensagens, as respostas, arquivos anexados). Modelos atuais têm janelas de centenas de milhares de tokens ou mais, o que permite analisar livros inteiros. Quando a conversa fica longa demais, detalhes do início podem ser esquecidos ou resumidos; por isso, para tarefas novas, abra conversa nova.</p>
<h4>Etapas de criação de um assistente</h4>
<ol><li><b>Pré-treinamento</b>: aprender a prever texto com dados públicos e licenciados.</li>
<li><b>Ajuste fino</b>: aprender a seguir instruções com exemplos de boas respostas.</li>
<li><b>Aprendizado por reforço com feedback</b> (humano ou de IA): preferir respostas úteis, honestas e seguras.</li>
<li><b>Ferramentas</b>: acesso a busca na web, execução de código, leitura de arquivos, memória.</li></ol>
<h4>Temperatura e criatividade</h4>
<p>Ao gerar, o modelo escolhe entre tokens prováveis. Uma "Temperatura" maior deixa as escolhas mais variadas (criativo); menor, mais previsíveis (preciso). Por isso a mesma pergunta pode gerar respostas diferentes.</p>
<h4>Alucinação</h4>
<p>O modelo pode gerar informações falsas com total confiança: datas, citações, referências, números, leis. Acontece porque ele produz o texto mais plausível, não consulta um banco de verdades. Como reduzir:</p>
<ul><li>Peça fontes e confira (ou ative a busca na web).</li>
<li>Forneça o documento e peça respostas só com base nele.</li>
<li>Diga explicitamente: "Se não souber, diga que não sabe."</li>
<li>Para cálculos, peça que use código ou confira na calculadora.</li></ul>
<h4>Data de corte e busca</h4>
<p>Cada modelo tem uma data de corte do conhecimento. Para fatos atuais (preços, notícias, quem ocupa um cargo), use assistentes com busca na web ativada.</p>
<h4>Multimodalidade e raciocínio</h4>
<p>Modelos atuais entendem imagens, PDFs, áudio e às vezes vídeo, e alguns têm modos de <b>raciocínio estendido</b> (pensam passo a passo antes de responder), melhores para matemática, lógica, programação e problemas complexos, porém mais lentos.</p>`,

L("Panorama das ferramentas e como escolher",`<h4>Os grandes assistentes de uso geral</h4>

<tr><td>Claude</td><td>Anthropic</td><td>Escrita natural, análise de documentos longos, programação, artefatos (páginas e documentos interativos), projetos, conectores a apps, agentes de programação (Claude Code)</td></tr>

<tr><td>Meta AI, Grok, DeepSeek, Le Chat (Mistral)</td><td>Diversas</td><td>Alternativas com integrações e estilos próprios</td></tr></table>
<p>Nomes de modelos, recursos e planos mudam muito rápido (às vezes a cada poucos meses). Use esta tabela como mapa e confira sempre o site oficial de cada ferramenta.</p>
<h4>Modelos de "tamanhos" diferentes</h4>
<p>As empresas oferecem famílias com modelos maiores (mais capazes e mais lentos/caros) e menores (rápidos e baratos). Na Anthropic, por exemplo, a família Claude tem linhas como Opus, Sonnet e Haiku. Para conversas comuns, o modelo padrão basta; para tarefas difíceis, escolha o mais capaz ou o modo de raciocínio.</p>
<h4>Planos</h4>
<ul><li><b>Gratuito</b>: ótimo para começar, com limites de uso e de recursos.</li>
<li><b>Individual pago</b>: mais uso, modelos mais capazes, recursos avançados.</li>
<li><b>Equipes e empresas</b>: administração, privacidade reforçada, integrações.</li></ul>
<h4>Como escolher para cada tarefa</h4>
<table><tr><th>Tarefa</th><th>O que considerar</th></tr>
<tr><td>Escrever e revisar textos</td><td>Qualidade e naturalidade do texto em português</td></tr>
<tr><td>Pesquisar fatos atuais</td><td>Busca na web com fontes citadas</td></tr>
<tr><td>Estudar com seus materiais</td><td>Upload de PDFs e ferramentas como NotebookLM ou projetos</td></tr>
<tr><td>Programar</td><td>Qualidade em código e agentes de programação</td></tr>
<tr><td>Planilhas e documentos do Office</td><td>Copilot ou assistente com bons recursos de arquivos</td></tr>
<tr><td>Imagens e vídeos</td><td>Geradores específicos (próximos módulos)</td></tr>
<tr><td>Privacidade sensível</td><td>Configurações de privacidade, planos empresariais ou modelos locais</td></tr></table>
<h4>Estratégia recomendada</h4>
<p>Escolha um assistente principal e domine-o; tenha um segundo para comparar respostas em decisões importantes. Teste o mesmo prompt em dois ou três: as diferenças ensinam muito sobre cada ferramenta.</p>`,

L("Privacidade, segurança e limites no uso pessoal",`<h4>O que acontece com o que você digita</h4>
<p>Dependendo da ferramenta e das configurações, suas conversas podem ser armazenadas, revisadas para segurança ou usadas para melhorar modelos. Cada empresa tem sua política, e muitas oferecem opções para desativar o uso de dados em treinamento, apagar histórico ou usar conversas temporárias. Leia as configurações de privacidade da ferramenta que você usa.</p>
<h4>Nunca coloque em um chat comum</h4>
<ul><li>Senhas, códigos de verificação, chaves de API.</li>
<li>Números completos de cartão, conta bancária, documentos (CPF, RG, passaporte) quando não for necessário.</li>
<li>Dados de outras pessoas sem necessidade ou consentimento (saúde de familiares, conversas privadas).</li>
<li>Informações confidenciais de terceiros.</li></ul>
<p>Quando precisar analisar um documento pessoal, remova ou substitua dados identificadores ("Fulano", "CPF XXX").</p>
<h4>Golpes com IA</h4>
<table><tr><th>Golpe</th><th>Como se proteger</th></tr>
<tr><td>Voz clonada de parente pedindo dinheiro</td><td>Combine uma palavra-código com a família; ligue de volta para o número conhecido</td></tr>
<tr><td>Vídeos falsos (deepfakes) de famosos vendendo produtos ou investimentos</td><td>Desconfie de promessas fáceis; procure no site oficial</td></tr>
<tr><td>Phishing muito bem escrito</td><td>Não clique em links de mensagens inesperadas; confira o remetente</td></tr>
<tr><td>Apps falsos que imitam assistentes de IA</td><td>Baixe só das lojas oficiais e verifique o desenvolvedor</td></tr></table>
<h4>Limites: onde a IA ajuda e onde não substitui</h4>
<ul><li><b>Saúde</b>: ótima para entender termos, preparar perguntas para o médico e organizar informações; não substitui diagnóstico nem prescrição.</li>
<li><b>Direito e finanças</b>: ajuda a entender contratos, comparar opções e calcular; decisões importantes merecem profissional.</li>
<li><b>Emoções</b>: pode ajudar a organizar pensamentos, mas não substitui pessoas e apoio profissional.</li>
<li><b>Fatos e números</b>: sempre conferir em fontes confiáveis.</li></ul>
<h4>Regra de ouro: você é o responsável</h4>
<p>A IA é uma assistente poderosa, mas a responsabilidade pelo que você envia, publica ou decide é sua. Revise, verifique e use bom senso, como faria com o trabalho de um estagiário muito rápido e muito culto, mas que às vezes se engana com segurança.</p>
<h4>Configurações para revisar hoje</h4>
<ol><li>Uso dos dados para treinamento (ativar ou desativar).</li>
<li>Memória do assistente (o que ele lembra entre conversas).</li>
<li>Histórico e exclusão de conversas.</li>
<li>Conexões com outros apps (e-mail, drive, agenda) e permissões.</li>
<li>Verificação em duas etapas na conta.</li></ol>`,

L("Anatomia de um bom prompt",`<h4>Prompt é briefing</h4>
<p>Pense na IA como um profissional muito competente que acabou de chegar e não sabe nada sobre você. Quanto mais claro o briefing, melhor o resultado. Prompts vagos geram respostas genéricas.</p>
<h4>Os 6 elementos</h4>
<table><tr><th>Elemento</th><th>Pergunta</th><th>Exemplo</th></tr>
<tr><td>Contexto</td><td>Qual é a situação?</td><td>"Vou fazer 40 anos e quero reunir 20 amigos em casa."</td></tr>
<tr><td>Tarefa</td><td>O que exatamente fazer?</td><td>"Monte um cardápio de churrasco com acompanhamentos."</td></tr>
<tr><td>Público / objetivo</td><td>Para quem e para quê?</td><td>"Há 3 vegetarianos e 4 crianças."</td></tr>
<tr><td>Formato</td><td>Como entregar?</td><td>"Tabela com item, quantidade e custo estimado."</td></tr>
<tr><td>Restrições</td><td>Limites?</td><td>"Orçamento de até R$ 800; nada que exija forno."</td></tr>
<tr><td>Exemplos ou tom</td><td>Como deve soar?</td><td>"Tom descontraído, como um amigo que entende de churrasco."</td></tr></table>
<h4>Antes e depois</h4>
<table><tr><th>Fraco</th><th>Forte</th></tr>
<tr><td>"Me dá dicas de estudo."</td><td>"Estou estudando para um concurso de nível médio, tenho 1h30 por dia à noite, depois do trabalho, e dificuldade de manter o foco. Monte um plano semanal com técnicas de estudo comprovadas, explicando em uma frase por que cada uma funciona. Formato: tabela por dia da semana."</td></tr>
<tr><td>"Escreve uma mensagem de aniversário."</td><td>"Escreva uma mensagem de aniversário para minha avó de 85 anos, que adora plantas e mora no interior. Tom carinhoso e simples, até 5 linhas, para eu ler em voz alta na festa."</td></tr></table>
<h4>Princípios</h4>
<ul><li><b>Seja específico</b>: números, nomes, prazos, tamanho.</li>
<li><b>Diga o que fazer</b>, não só o que evitar ("use frases curtas" funciona melhor que "não seja prolixo").</li>
<li><b>Explique o porquê</b>: "porque vou ler em voz alta" ajuda o modelo a adaptar o texto.</li>
<li><b>Uma tarefa principal por vez</b>, ou divida em etapas.</li>
<li><b>Peça para perguntar</b>: "Antes de responder, faça até 3 perguntas se faltar informação."</li></ul>
<h4>Conversar é iterar</h4>
<p>O primeiro resultado raramente é o final. Refine: "Mais curto", "Troque o tom para formal", "Mantenha a estrutura, mas use exemplos brasileiros", "O item 3 ficou genérico; aprofunde". A habilidade de dar feedback à IA é tão importante quanto o primeiro prompt.</p>`,
["Prompt é briefing: contexto, tarefa, público, formato, restrições, tom","Seja específico e diga o porquê","Diga o que fazer em vez de só o que evitar","Peça perguntas antes quando faltar informação","Refine em conversas: feedback é parte do processo"],

L("Técnicas essenciais: papel, exemplos, passo a passo e estrutura",`<h4>1. Atribuir um papel</h4>
<p>"Você é um professor de matemática paciente que explica para adultos que têm medo de números." O papel define vocabulário, profundidade e estilo. Combine com o público: "...para alguém que parou de estudar há 15 anos."</p>
<h4>2. Few-shot: dar exemplos</h4>
<p>Mostre 2 ou 3 exemplos do que você quer e a IA segue o padrão.</p>
<pre><code>Transforme frases formais em linguagem simples.
Formal: "Solicitamos a gentileza de comparecer com antecedência."
Simples: "Por favor, chegue um pouco antes."
Formal: "O pagamento deverá ser efetuado até a data de vencimento."
Simples: "Pague até o dia do vencimento."
Formal: "Informamos que o serviço encontra-se temporariamente indisponível."
Simples:</code></pre>
<h4>3. Pensar passo a passo</h4>
<p>Para problemas de lógica, contas e decisões, peça: "Pense passo a passo e mostre o raciocínio antes da resposta final." Modelos com modo de raciocínio já fazem isso internamente; mesmo assim, pedir a estrutura ajuda a conferir.</p>
<h4>4. Delimitadores e tags</h4>
<p>Separe instruções de conteúdo com marcadores claros. Tags no estilo XML funcionam muito bem (especialmente no Claude):</p>
<pre><code>Resuma o texto abaixo em 5 tópicos para eu estudar.
&lt;texto&gt;
...cole aqui o capítulo...
&lt;/texto&gt;
Formato: tópicos com no máximo 15 palavras cada.</code></pre>
<h4>5. Formato de saída explícito</h4>
<p>Tabela, lista numerada, JSON, e-mail com assunto, roteiro com tempos, texto com até 100 palavras, títulos em negrito. Quanto mais claro, menos retrabalho.</p>
<h4>6. Restrições positivas e critérios</h4>
<p>"Use apenas informações do texto fornecido." "Se não estiver no texto, escreva: não encontrado." "Prefira exemplos do Brasil." "Linguagem para um aluno do 9º ano."</p>
<h4>7. Pedir alternativas</h4>
<p>"Dê 3 versões: uma formal, uma neutra e uma descontraída." "Liste 10 ideias, depois escolha as 3 melhores e justifique." Gerar opções e escolher é mais eficiente que pedir a resposta perfeita de primeira.</p>
<h4>Combinando tudo</h4>
<pre><code>Você é um nutricionista que explica de forma prática.
Contexto: família de 4 pessoas, orçamento apertado, pouco tempo para cozinhar durante a semana.
Tarefa: monte um cardápio de jantar de segunda a sexta.
Formato: tabela com prato, tempo de preparo e lista de compras ao final.
Restrições: até 30 minutos por receita, ingredientes de supermercado comum.
Se alguma informação for essencial e estiver faltando, pergunte antes.</code></pre>
<p>Observação: a IA pode dar orientações gerais de alimentação; dietas para condições de saúde devem ser feitas com profissional.</p>`,

L("Técnicas avançadas: encadeamento, autocrítica e meta-prompts",`<h4>Encadeamento (prompt chaining)</h4>
<p>Divida tarefas grandes em etapas, usando a saída de uma como entrada da próxima. Exemplo para escrever um artigo para seu blog pessoal:</p>
<ol><li>"Liste 10 ângulos possíveis sobre o tema X para iniciantes."</li>
<li>"Com o ângulo 4, crie um esboço com introdução, 4 seções e conclusão."</li>
<li>"Escreva a seção 1 com 300 palavras e um exemplo prático."</li>
<li>(repete para cada seção)</li>
<li>"Revise o texto completo: corte repetições e melhore transições."</li></ol>
<h4>Autocrítica e revisão</h4>
<p>"Revise sua resposta como um crítico exigente: aponte 3 fraquezas e reescreva corrigindo." Ou: "Liste os pontos em que você pode ter errado ou em que há incerteza." Isso melhora a qualidade e mostra onde conferir.</p>
<h4>Rubricas</h4>
<p>Dê critérios de avaliação: "Avalie este texto de 0 a 10 em clareza, persuasão, correção e tamanho, justificando cada nota, e depois sugira melhorias para o critério com menor nota."</p>
<h4>Entrevista reversa</h4>
<p>"Quero criar um plano de exercícios para mim. Faça-me perguntas uma de cada vez até ter informação suficiente; depois proponha o plano." Ótimo quando você não sabe o que informar.</p>
<h4>Pensar em perspectivas</h4>
<p>"Analise esta decisão (comprar ou alugar um apartamento) do ponto de vista de um economista, de um corretor e de alguém que valoriza flexibilidade. Depois resuma prós e contras." Debates simulados revelam pontos cegos.</p>
<h4>Meta-prompt: pedir ajuda para escrever o prompt</h4>
<p>"Quero que uma IA me ajude a [objetivo]. Escreva o melhor prompt possível para isso, incluindo contexto, formato e restrições, e diga quais informações eu devo completar." Depois use o prompt gerado.</p>
<h4>Instruções persistentes</h4>
<p>Assistentes permitem instruções que valem para todas as conversas (preferências, perfil) ou para um conjunto de conversas (projetos, Gems, GPTs). Exemplo de instrução pessoal: "Responda em português do Brasil, de forma direta, com exemplos práticos. Quando eu pedir textos, evite clichês. Se algo for incerto, diga."</p>
<h4>Controlando tamanho e estilo</h4>
<ul><li>"Até 120 palavras." "Em 3 frases."</li>
<li>"Sem introdução: comece direto pela resposta."</li>
<li>"Use parágrafos curtos, sem listas."</li>
<li>"Imite o estilo deste texto meu: [exemplo]."</li></ul>
<h4>Quando o resultado não melhora</h4>
<p>Comece uma conversa nova com um prompt mais completo, reúna o que aprendeu e dê exemplos do que você quer e do que não quer. Conversas longas com muitas correções acumulam ruído.</p>`,
["Encadeie tarefas grandes em etapas","Autocrítica e rubricas elevam a qualidade","Entrevista reversa quando você não sabe o que informar","Meta-prompt: peça à IA o melhor prompt","Instruções persistentes para preferências e projetos"],

L("Prompts para aprender, escrever e decidir",`<h4>Aprender qualquer assunto</h4>
<table><tr><th>Objetivo</th><th>Prompt</th></tr>
<tr><td>Explicação em níveis</td><td>"Explique [tema] em 3 níveis: para uma criança de 10 anos, para um adulto leigo e para um estudante universitário."</td></tr>
<tr><td>Analogias</td><td>"Explique [conceito] com uma analogia do dia a dia e diga onde a analogia falha."</td></tr>
<tr><td>Técnica de Feynman</td><td>"Vou explicar [tema] com minhas palavras. Aponte erros, lacunas e o que eu deveria aprofundar."</td></tr>
<tr><td>Quiz</td><td>"Faça 10 perguntas de múltipla escolha sobre [tema], uma por vez, e corrija explicando."</td></tr>
<tr><td>Plano de estudos</td><td>"Crie um plano de 8 semanas para aprender [habilidade] do zero, com 30 min por dia, recursos gratuitos e marcos de progresso."</td></tr>
<tr><td>Tutor socrático</td><td>"Seja meu tutor: não me dê a resposta, faça perguntas que me levem a descobrir."</td></tr></table>
<h4>Escrever melhor</h4>
<ul><li><b>Rascunho para revisão</b>: "Revise este texto: corrija gramática, melhore clareza, mantenha meu estilo. Mostre as principais mudanças em lista."</li>
<li><b>Mudar o tom</b>: "Reescreva este recado para o condomínio em tom firme, mas educado."</li>
<li><b>Resumir</b>: "Resuma em 5 tópicos e uma frase final com a conclusão."</li>
<li><b>Expandir ideias</b>: "Transforme estes tópicos num texto corrido de 300 palavras."</li>
<li><b>Difícil para simples</b>: "Explique este contrato de aluguel em linguagem simples, destacando multas, prazos e obrigações."</li>
<li><b>Seu estilo</b>: dê 2 ou 3 textos seus e peça que identifique seu estilo antes de escrever.</li></ul>
<h4>Decidir com mais clareza</h4>
<table><tr><th>Técnica</th><th>Prompt</th></tr>
<tr><td>Prós e contras ponderados</td><td>"Compare as opções A e B com uma tabela de critérios e pesos que eu defino: custo 40%, tempo 30%, qualidade 30%."</td></tr>
<tr><td>Pre-mortem</td><td>"Imagine que daqui a um ano essa decisão deu errado. Quais os motivos mais prováveis? Como prevenir?"</td></tr>
<tr><td>Advogado do diabo</td><td>"Argumente com força contra a decisão que estou inclinado a tomar."</td></tr>
<tr><td>Perguntas que faltam</td><td>"Que perguntas eu deveria responder antes de decidir?"</td></tr>
<tr><td>Cenários</td><td>"Descreva o melhor, o pior e o cenário mais provável."</td></tr></table>
<h4>Cuidados</h4>
<ul><li>A IA tende a concordar com você; peça explicitamente críticas e contrapontos.</li>
<li>Decisões financeiras, médicas e jurídicas importantes merecem confirmação com profissionais e fontes oficiais.</li>
<li>Nos estudos, use a IA para entender e praticar, não para pular o esforço: aprender exige que você mesmo pense e lembre.</li></ul>`,

L("Biblioteca de prompts, avaliação e melhoria contínua",`<h4>Por que ter uma biblioteca</h4>
<p>Você repete muitas tarefas: resumir, revisar, planejar, pesquisar, explicar. Prompts testados economizam tempo e garantem qualidade. Guarde-os num lugar fácil: notas do celular, documento, planilha, ou recursos dos próprios assistentes (projetos, Gems, GPTs, atalhos).</p>
<h4>Modelo de ficha de prompt</h4>
<table><tr><th>Campo</th><th>Exemplo</th></tr>
<tr><td>Nome</td><td>Resumo de livro para estudo</td></tr>
<tr><td>Quando usar</td><td>Após ler cada capítulo</td></tr>
<tr><td>Prompt</td><td>Texto com espaços [ASSIM] para completar</td></tr>
<tr><td>Ferramenta preferida</td><td>Assistente X com upload de PDF</td></tr>
<tr><td>Exemplo de saída boa</td><td>Trecho de um resultado aprovado</td></tr>
<tr><td>Versão e data</td><td>V3, março</td></tr></table>
<h4>Templates com variáveis</h4>
<pre><code>Você é [PAPEL].
Contexto: [SITUAÇÃO].
Tarefa: [O QUE FAZER].
Público: [PARA QUEM].
Formato: [COMO ENTREGAR].
Restrições: [LIMITES].
Se faltar algo essencial, pergunte antes.</code></pre>
<h4>Biblioteca inicial sugerida (20 prompts)</h4>
<p>Resumo de texto, revisão de texto, mudar tom, e-mail difícil, explicação em níveis, quiz de estudo, plano de estudos, roteiro de viagem, cardápio semanal, lista de compras, comparação de produtos, decisão ponderada, pre-mortem, planejamento financeiro mensal, mensagem de aniversário, legenda para fotos, ideias de presente, organizar rotina, preparar conversa difícil, explicar documento (contrato, bula, exame).</p>
<h4>Avaliando resultados</h4>
<ul><li><b>Correção</b>: os fatos estão certos? Confira o que importa.</li>
<li><b>Completude</b>: respondeu tudo que foi pedido?</li>
<li><b>Formato</b>: está como você pediu?</li>
<li><b>Utilidade</b>: dá para usar sem muito ajuste?</li>
<li><b>Tom</b>: soa como deveria?</li></ul>
<p>Quando um prompt falha, mude uma coisa por vez (mais contexto, um exemplo, formato mais claro) e anote o que funcionou. Isso é engenharia de prompt na prática: um ciclo PDCA de instruções.</p>
<h4>Recursos avançados de personalização</h4>
<ul><li><b>Projetos</b> (Claude, ChatGPT): reúnem arquivos e instruções para um tema contínuo (ex.: "Minha reforma da casa").</li>
<li><b>GPTs personalizados</b> (ChatGPT) e <b>Gems</b> (Gemini): assistentes com instruções fixas para uma tarefa.</li>

L("Gemini e NotebookLM (Google)",`<h4>Visão geral</h4>

<h4>NotebookLM: seu caderno de estudos com IA</h4>

L("Microsoft Copilot",`<h4>Visão geral</h4>
<p>"Copilot" é a marca de IA da Microsoft e aparece em vários lugares: o app Copilot (web, Windows, celular), o navegador Edge, o Microsoft 365 (Word, Excel, PowerPoint, Outlook, OneNote) e o GitHub Copilot, voltado a programação. Os recursos variam conforme a conta (pessoal, família, empresarial) e mudam com frequência.</p>
<h4>Onde ele ajuda no uso pessoal</h4>
<table><tr><th>Onde</th><th>Exemplos</th></tr>
<tr><td>App Copilot / Windows</td><td>Conversa, busca com fontes, voz, criar imagens, ajuda com configurações e com o que está na tela (conforme recursos disponíveis)</td></tr>
<tr><td>Edge</td><td>Resumir a página aberta ou um PDF, comparar produtos de várias abas</td></tr>
<tr><td>Word</td><td>Criar rascunhos, reescrever trechos, resumir documentos longos</td></tr>
<tr><td>Excel</td><td>Criar fórmulas, destacar dados, gerar gráficos e análises a partir de perguntas em português</td></tr>
<tr><td>PowerPoint</td><td>Criar apresentações a partir de um documento ou de um tema</td></tr>
<tr><td>Outlook</td><td>Resumir e-mails longos e sugerir respostas</td></tr>
<tr><td>GitHub Copilot</td><td>Completar e explicar código no editor (VS Code e outros)</td></tr></table>
<h4>Excel com IA: o grande ganho</h4>
<p>Muita gente sabe o que quer da planilha, mas não sabe a fórmula. Com o Copilot (ou qualquer assistente), descreva: "Quero somar os gastos da coluna C só quando a coluna B for 'Mercado' e o mês da coluna A for março." A IA sugere <i>SOMASES</i> com os critérios certos. Peça sempre a explicação da fórmula para aprender.</p>
<h4>Fórmulas que vale entender (com ajuda da IA)</h4>
<p><i>SOMA, MÉDIA, SE, SOMASE/SOMASES, CONT.SE, PROCX (substitui PROCV), ÚNICO, FILTRO, CLASSIFICAR, TEXTO, DATA, MÊS, ANO, SEERRO</i>. Tabelas dinâmicas e formatação condicional completam o kit para controlar finanças, estudos e hábitos.</p>
<h4>Dicas de uso</h4>
<ul><li>Formate os dados como tabela no Excel antes de pedir análises.</li>
<li>No Word, peça "resuma em tópicos" e depois "transforme em e-mail".</li>
<li>No Edge, use o Copilot para resumir avaliações de produtos antes de comprar.</li>
<li>Para PowerPoint, dê um roteiro e depois ajuste o design manualmente.</li></ul>
<h4>Qual assistente para o Office?</h4>
<p>O Copilot está dentro dos apps. Os outros assistentes trabalham com arquivos enviados: você manda a planilha, recebe a análise ou um arquivo novo. Os dois caminhos funcionam; escolha pelo que você já usa.</p>
<h4>Documentação</h4>
<p>Support.microsoft.com (procure "Copilot") para recursos e disponibilidade por plano.</p>`,
