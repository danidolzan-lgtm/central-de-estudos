]);

MOD("ing","A2 · Futuro, comparações e situações reais","Falar de planos e previsões, comparar coisas, dar conselhos e se virar em viagens e serviços.",[
L("Going to e present continuous para planos",`<h4>Be going to + verbo base</h4>
<ul><li><b>Planos e intenções já decididos:</b> <i>I'm going to study Spanish next year. We're going to buy a house.</i></li>
<li><b>Previsões com evidência no presente:</b> <i>Look at those clouds! It's going to rain. Be careful, you're going to fall!</i></li></ul>
<table><tr><th>Afirmativa</th><th>Negativa</th><th>Pergunta</th></tr>
<tr><td>She's going to travel.</td><td>She isn't going to travel.</td><td>Is she going to travel?</td></tr></table>
<p>Na fala informal americana, <i>going to</i> vira <b>gonna</b>: <i>I'm gonna call you later.</i> Entenda, mas escreva "going to".</p>
<h4>Present continuous para compromissos marcados</h4>
<p>Quando há data, hora ou outras pessoas envolvidas (agenda): <i>I'm meeting Paulo at 7. We're flying to Lisbon on Friday. The doctor is seeing me tomorrow.</i></p>
<h4>Comparando</h4>
<table><tr><th>Forma</th><th>Ideia</th><th>Exemplo</th></tr>
<tr><td>going to</td><td>Intenção decidida</td><td>I'm going to visit my parents this summer.</td></tr>
<tr><td>present continuous</td><td>Combinado, marcado</td><td>I'm visiting my parents on Sunday at noon.</td></tr>
<tr><td>will</td><td>Decisão na hora, promessa, previsão de opinião</td><td>(próxima aula)</td></tr></table>
<h4>Expressões de futuro</h4>
<p><i>tomorrow, the day after tomorrow, tonight, this weekend, next week, next month, next year, in two days, in a few weeks, soon, later, someday, in the future</i>. Atenção: "daqui a duas semanas" = <i>in two weeks</i> (não "after two weeks").</p>
<h4>Planos de vida</h4>
<p><i>get a promotion, change jobs, go back to school, get married, have a baby, move to another city, learn to drive, save money, lose weight, get fit, travel abroad, start a business, retire</i>. <i>What are your plans for next year? – I'm going to start a new course and I'm going to save money to travel.</i></p>`,
["going to: plano decidido ou previsão com evidência","Present continuous: compromisso marcado","gonna = going to (fala informal)","in two weeks = daqui a duas semanas","What are your plans for...?"],
`<i>"This weekend is going to be busy. On Saturday morning I'm taking my car to the mechanic, and in the afternoon I'm meeting friends for lunch. On Sunday I'm going to rest. Next year I'm going to learn to play the piano."</i>`,
`Escreva sua agenda da próxima semana com 7 compromissos no present continuous e uma lista de 8 metas para o próximo ano com going to. Grave falando como se contasse a um amigo.`,
[["Previsão com evidência:",["Look at the sky! It will rain.","Look at the sky! It's going to rain.","Look at the sky! It rains.","Look at the sky! It rained."],1,"Evidência no presente: going to."],["Compromisso marcado com hora:",["I meet the dentist at 3 tomorrow.","I'm seeing the dentist at 3 tomorrow.","I will to see the dentist.","I going to see the dentist."],1,"Agenda combinada: present continuous."],["'Daqui a três dias':",["after three days","three days ago","in three days","on three days"],2,"In + período = daqui a."]]),
L("Will: decisões, promessas e previsões",`<h4>Forma</h4>
<p><b>Will + verbo base</b>, igual para todas as pessoas. Contração: <i>I'll, you'll, she'll, we'll</i>. Negativa: <b>won't</b> (will not). Pergunta: <i>Will you...?</i></p>
<h4>Usos</h4>
<table><tr><th>Uso</th><th>Exemplo</th></tr>
<tr><td>Decisão no momento da fala</td><td>The phone is ringing. – I'll get it!</td></tr>
<tr><td>Oferta</td><td>I'll help you with those bags.</td></tr>
<tr><td>Promessa</td><td>I'll call you tonight. I won't forget.</td></tr>
<tr><td>Previsão baseada em opinião</td><td>I think it will be a great year. She'll probably win.</td></tr>
<tr><td>Fatos futuros</td><td>The sun will rise at 5:40 tomorrow.</td></tr>
<tr><td>Pedido</td><td>Will you marry me? Will you close the door, please?</td></tr></table>
<h4>Will × going to</h4>
<ul><li><i>– We're out of milk. – Oh, I'll buy some.</i> (decidiu agora)</li>
<li><i>I'm going to buy milk after work.</i> (já tinha decidido)</li></ul>
<h4>Shall (britânico) para sugestões e ofertas</h4>
<p><i>Shall we go? Shall I open the window?</i> Em inglês americano: <i>Should we go? Do you want me to open the window?</i></p>
<h4>Probabilidade</h4>
<p><i>I'll definitely / certainly go</i> (certeza). <i>I'll probably go / I probably won't go</i> (provável; note a posição de probably). <i>I might go</i> (talvez). <i>I don't think I'll go</i> (mais natural que "I think I won't go").</p>
<h4>Orações de tempo no futuro</h4>
<p>Depois de <b>when, as soon as, before, after, until, if</b>, use presente, não will: <i>I'll call you when I arrive</i> (não "when I will arrive"). <i>As soon as she finishes, we'll leave.</i></p>`,
["will: decisão na hora, oferta, promessa, opinião","won't = will not","I don't think I'll... é mais natural","I'll probably / I probably won't","when/as soon as + presente: I'll call when I arrive"],
`<i>"– I'm so tired, and I still need to cook. – Don't worry, I'll make dinner tonight. – Really? Thanks! I promise I'll do the dishes. – Deal. I think the kids will love my pasta."</i>`,
`Escreva 5 promessas, 5 ofertas e 5 previsões para os próximos 10 anos do mundo. Depois escreva 6 frases com when, as soon as e before sobre seu futuro.`,
[["Decisão no momento:",["The doorbell! I'm going to open it.","The doorbell! I'll open it.","The doorbell! I open it.","The doorbell! I opening it."],1,"Decisão espontânea usa will."],["Qual está correta?",["I'll call you when I will arrive.","I'll call you when I arrive.","I call you when I will arrive.","I'll calling you when I arrive."],1,"Depois de when, presente."],["Forma mais natural:",["I think I won't go.","I don't think I'll go.","I think I will not to go.","I no think I go."],1,"Em inglês nega-se o think."]]),
L("Comparativos e superlativos",`<h4>Regras</h4>
<table><tr><th>Adjetivo</th><th>Comparativo</th><th>Superlativo</th></tr>
<tr><td>1 sílaba: + er / + est</td><td>cheap → cheaper (than)</td><td>the cheapest</td></tr>
<tr><td>Termina em -e</td><td>large → larger</td><td>the largest</td></tr>
<tr><td>CVC: dobra</td><td>big → bigger, hot → hotter</td><td>the biggest</td></tr>
<tr><td>2 sílabas em -y: ier / iest</td><td>easy → easier, happy → happier</td><td>the easiest</td></tr>
<tr><td>2+ sílabas: more / most</td><td>expensive → more expensive</td><td>the most expensive</td></tr>
<tr><td>Irregulares</td><td>good → better, bad → worse, far → farther/further</td><td>the best, the worst, the farthest</td></tr></table>
<p>Erros comuns: "more cheaper", "more good", "the most big". Use <b>than</b> no comparativo: <i>São Paulo is bigger than Rio.</i></p>
<h4>Igualdade e inferioridade</h4>
<ul><li><b>as ... as</b> = tão quanto: <i>She's as tall as her mother.</i></li>
<li><b>not as ... as</b> = não tão quanto: <i>This phone isn't as good as yours.</i></li>
<li><b>less ... than</b> = menos: <i>It's less expensive than I thought.</i></li></ul>
<h4>Intensificar e suavizar</h4>
<p><i>much / a lot / far bigger</i> (muito maior), <i>a little / slightly / a bit cheaper</i> (um pouco mais barato). <i>The more you practice, the better you get</i> (quanto mais..., mais...).</p>
<h4>Superlativo com present perfect</h4>
<p><i>It's the best movie I've ever seen. She's the most interesting person I've ever met.</i> Use <b>in</b> para lugares e grupos: <i>the tallest building in the world</i>; <b>of</b> para períodos: <i>the best day of my life</i>.</p>
<h4>Adjetivos para comparar</h4>
<p><i>safe/dangerous, quiet/noisy, crowded, modern/traditional, comfortable, convenient, healthy/unhealthy, reliable, light/heavy, wide/narrow, early/late, busy, friendly, polite/rude</i>.</p>`,
["1 sílaba: -er/-est; 2+ sílabas: more/most","good-better-best; bad-worse-worst","than no comparativo","As ... as (igualdade); not as ... as","the best ... I've ever seen"],
`<i>"Living in a small town is cheaper and safer than living in a big city, but there are fewer options. The city is noisier, but it's much more convenient. For me, the best place is somewhere in between."</i>`,
`Compare duas cidades, dois celulares e duas épocas da sua vida em 15 frases. Use pelo menos 3 superlativos com "I've ever" e 3 frases com as...as.`,
[["Qual está correta?",["This car is more cheap than that.","This car is cheaper than that.","This car is more cheaper than that.","This car is cheapest than that."],1,"1 sílaba: cheaper than."],["Superlativo de 'good':",["the goodest","the most good","the best","the better"],2,"Good → better → the best."],["'Ela é tão alta quanto o irmão':",["She's as tall as her brother.","She's so tall than her brother.","She's tall as her brother.","She's as taller as her brother."],0,"Igualdade: as + adjetivo + as."]]),
L("Should, must, have to: conselhos e obrigações",`<h4>Should: conselho e opinião</h4>
<p><i>You should drink more water. You shouldn't work so much. Should I call her? – Yes, you should.</i> Mais suave: <i>Maybe you should... / I think you should... / If I were you, I'd...</i></p>
<h4>Must e have to: obrigação</h4>
<table><tr><th>Forma</th><th>Ideia</th><th>Exemplo</th></tr>
<tr><td>must</td><td>Obrigação que o falante sente ou regra escrita</td><td>I must call my mother. Passengers must wear seat belts.</td></tr>
<tr><td>have to / has to</td><td>Obrigação externa (regras, situações)</td><td>I have to work on Saturday. She has to wear a uniform.</td></tr>
<tr><td>had to</td><td>Passado das duas</td><td>We had to wait two hours.</td></tr>
<tr><td>will have to</td><td>Futuro</td><td>You'll have to show your passport.</td></tr></table>
<p><i>Have to</i> funciona como verbo comum: <i>Do you have to work tomorrow? He doesn't have to come.</i></p>
<h4>A diferença mais importante: mustn't × don't have to</h4>
<table><tr><th>mustn't</th><th>don't have to</th></tr>
<tr><td>Proibido</td><td>Não é necessário (opcional)</td></tr>
<tr><td>You mustn't smoke here.</td><td>You don't have to come if you're busy.</td></tr>
<tr><td>You mustn't tell anyone.</td><td>We don't have to pay; it's free.</td></tr></table>
<h4>Outras formas</h4>
<ul><li><b>need to / don't need to</b>: <i>You need to rest. You don't need to bring anything.</i></li>
<li><b>can't</b> para proibição: <i>You can't park here.</i></li>
<li><b>be allowed to</b> (ter permissão): <i>Are we allowed to take photos?</i></li>
<li><b>had better ('d better)</b>: conselho forte com consequência: <i>You'd better leave now or you'll miss the bus.</i></li></ul>
<h4>Saúde e conselhos</h4>
<p><i>I have a headache / a sore throat / a cold / a fever / a backache / a stomachache. I feel sick / dizzy. – You should take some medicine. You should see a doctor. You shouldn't go to work today. You need to rest.</i></p>`,
["should = conselho; shouldn't = não é bom","have to = obrigação externa; had to no passado","mustn't = proibido","don't have to = não precisa (opcional)","You'd better = é melhor você (conselho forte)"],
`<i>"– I have a terrible headache. – You should take a break and drink some water. – I can't, I have to finish this report today. – You don't have to finish it all now. And you mustn't skip lunch again!"</i>`,
`Escreva 10 regras da sua casa ou de um lugar público (must, mustn't, have to, can't) e 10 conselhos para alguém que quer aprender inglês sozinho (should, shouldn't, had better).`,
[["'Você não precisa vir':",["You mustn't come.","You don't have to come.","You shouldn't to come.","You haven't come."],1,"Don't have to = não é necessário."],["Passado de 'have to':",["must","musted","had to","have had"],2,"O passado de must e have to é had to."],["Proibição:",["You don't have to smoke here.","You mustn't smoke here.","You needn't smoke here.","You shouldn't to smoke."],1,"Mustn't = é proibido."]]),
L("Viagens: aeroporto, hotel e direções",`<h4>No aeroporto</h4>
<table><tr><th>Situação</th><th>Frases</th></tr>
<tr><td>check-in</td><td>I'd like to check in. Can I have a window/aisle seat? How many bags can I check? My bag is overweight.</td></tr>
<tr><td>Segurança</td><td>Please take out your laptop. Remove your belt and shoes. Any liquids?</td></tr>
<tr><td>Embarque</td><td>Which gate? The flight is delayed / canceled / boarding now. Final call for passengers...</td></tr>
<tr><td>Imigração</td><td>What's the purpose of your visit? – Tourism / Business. How long are you staying? – Ten days. Where are you staying? – At a hotel downtown.</td></tr>
<tr><td>Bagagem</td><td>Where is baggage claim? My luggage is missing. Where can I report it?</td></tr></table>
<p>Vocabulário: <i>boarding pass, passport, carry-on, checked bag, gate, terminal, layover / connection, customs, departures, arrivals, round trip, one-way ticket</i>.</p>
<h4>No hotel</h4>
<p><i>I have a reservation under the name Souza. – Can I see your ID? – What time is check-out? – Is breakfast included? – What's the Wi-Fi password? – Could I have a late check-out? – The air conditioning isn't working. – Could you call a taxi for me?</i></p>
<h4>Pedindo e dando direções</h4>
<table><tr><th>Pedir</th><th>Dar</th></tr>
<tr><td>Excuse me, how do I get to the museum?</td><td>Go straight ahead for two blocks.</td></tr>
<tr><td>Is it far from here?</td><td>Turn left at the traffic lights.</td></tr>
<tr><td>Can I walk there?</td><td>Take the second right.</td></tr>
<tr><td>Which bus goes to the center?</td><td>It's on the corner, across from the park.</td></tr>
<tr><td>Where's the nearest subway station?</td><td>It's about a ten-minute walk.</td></tr></table>
<h4>Transporte</h4>
<p><i>take a bus / a taxi / an Uber / the subway (EUA) / the underground (UK); get on / get off the bus; catch / miss the train; buy a ticket; Is this seat taken? How much is a ticket to...? Does this train stop at...?</i></p>
<h4>Problemas</h4>
<p><i>I'm lost. I lost my passport. Can you help me? I need a pharmacy. Call an ambulance! Where's the police station? I don't feel well.</i></p>`,
["boarding pass, gate, carry-on, layover","Imigração: purpose of visit, how long, where","Is breakfast included? What time is check-out?","Go straight, turn left, take the second right","get on / get off the bus"],
`<i>"– Good evening, I have a reservation for three nights under Lima. – Welcome, Mr. Lima. Breakfast is included from 6 to 10. – Great. And how do I get to the old town? – Turn right outside and walk about ten minutes."</i>`,
`Monte e grave três diálogos: check-in no aeroporto, entrada na imigração e chegada ao hotel. Depois use o Google Maps para escrever as direções de um hotel a um ponto turístico em inglês.`,
[["Na imigração, 'propósito da visita' é:",["purpose of your visit","reason of your travel","objective trip","what do you visit"],0,"What's the purpose of your visit?"],["Bagagem de mão:",["checked bag","carry-on","baggage claim","layover"],1,"Carry-on é a bagagem de mão."],["'Descer do ônibus':",["get down the bus","get off the bus","go out the bus","leave of the bus"],1,"Get on / get off para ônibus, trem e avião."]]),
L("Telefone, serviços e situações do dia a dia",`<h4>Ao telefone</h4>
<table><tr><th>Situação</th><th>Frase</th></tr>
<tr><td>Atender</td><td>Hello? / Hi, this is Ana speaking.</td></tr>
<tr><td>Pedir para falar</td><td>Could I speak to Mr. Brown, please?</td></tr>
<tr><td>Esperar</td><td>Hold on a second. / Can you hold?</td></tr>
<tr><td>Recado</td><td>Can I leave a message? / Can I take a message?</td></tr>
<tr><td>Não ouviu</td><td>Sorry, the line is bad. Could you say that again?</td></tr>
<tr><td>Soletrar</td><td>Could you spell that, please?</td></tr>
<tr><td>Encerrar</td><td>Thanks for calling. / Talk to you later. Bye!</td></tr></table>
<h4>Marcando horários</h4>
<p><i>I'd like to make an appointment. – When are you available? – Is Tuesday at 10 OK? – Tuesday doesn't work for me. How about Wednesday? – Wednesday is fine. – I need to cancel / reschedule my appointment.</i></p>
<h4>Lojas e reclamações educadas</h4>
<p><i>I'm just looking, thanks. Do you have this in a medium / in blue? Where are the fitting rooms? I'd like to return this. It doesn't fit. It's broken. Can I get a refund / exchange it? Do you have the receipt?</i></p>
<p>Reclamar com educação: <i>I'm sorry, but there's a problem with my order. I ordered X but I received Y. I'd appreciate it if you could fix this.</i></p>
<h4>Banco, médico e farmácia</h4>
<ul><li><i>I'd like to open an account. Where is the ATM? My card was blocked.</i></li>
<li><i>What are your symptoms? – I've had a cough for three days. Are you allergic to anything? Take this twice a day after meals.</i></li>
<li><i>Do I need a prescription for this? What do you recommend for a cold?</i></li></ul>
<h4>Formas educadas que soam naturais</h4>
<p><i>Would you mind + -ing...? (Would you mind closing the door?) Do you happen to know...? I was wondering if you could... Sorry to bother you, but...</i> Em inglês, "please", "thank you" e "sorry" são usados muito mais que em português; sem eles, a frase soa ríspida.</p>`,
["Could I speak to...? / Can I take a message?","make / cancel / reschedule an appointment","It doesn't fit. Can I get a refund?","Would you mind + -ing...?","Use please, thanks e sorry com frequência"],
`<i>"– Hi, I'd like to reschedule my appointment with Dr. Lee. It's on Thursday at 3. – Sure. Would Friday morning work? – Friday at 9 would be perfect. – Great, you're all set. – Thank you so much!"</i>`,
`Grave 4 ligações simuladas: marcar consulta, remarcar, reclamar de um pedido errado e pedir informação a uma loja. Use pelo menos 3 formas educadas (Would you mind, I was wondering...).`,
[["Para pedir que alguém espere ao telefone:",["Wait me.","Hold on a second.","Stay there.","Stop a moment."],1,"Hold on = aguarde."],["'Remarcar' uma consulta:",["remake","reschedule","rebook the time","replace"],1,"Reschedule = remarcar."],["Pedido mais educado:",["Close the door.","Would you mind closing the door?","You close the door.","Door, please close."],1,"Would you mind + -ing é muito educado."]])
]);

MOD("ing","B1 · Experiências e verbos","Falar de experiências e ações ligadas ao presente, e usar verbos com naturalidade (gerúndio, infinitivo, phrasal verbs).",[
L("Present perfect: experiências de vida",`<h4>Forma</h4>
<p><b>have/has + particípio passado</b> (3ª coluna): <i>I have (I've) seen, she has (she's) been, they've eaten</i>.</p>
<table><tr><th>Afirmativa</th><th>Negativa</th><th>Pergunta</th></tr>
<tr><td>I've been to Argentina.</td><td>I haven't been to Europe.</td><td>Have you ever been to Chile?</td></tr>
<tr><td>She's tried sushi.</td><td>She hasn't tried it.</td><td>Has she ever tried it?</td></tr></table>
<h4>Experiências: ever e never</h4>
<p>O present perfect fala de experiências <b>em algum momento da vida</b>, sem dizer quando: <i>Have you ever ridden a horse? – Yes, I have. / No, I've never ridden a horse.</i></p>
<h4>A regra que mais confunde: sem tempo definido</h4>
<p>Se você diz <b>quando</b> aconteceu, use simple past. Se não importa quando, present perfect.</p>
<table><tr><th>Present perfect (quando não importa)</th><th>Simple past (tempo definido)</th></tr>
<tr><td>I've been to London.</td><td>I went to London in 2019.</td></tr>
<tr><td>Have you seen this movie?</td><td>Did you see it last night?</td></tr>
<tr><td>She's met the president.</td><td>She met him two years ago.</td></tr></table>
<p>Errado: "I have seen him yesterday". Certo: <i>I saw him yesterday.</i> Uma conversa típica começa no perfect e passa para o past: <i>– Have you ever been to Bahia? – Yes, I have. I went there last summer. – Did you like it? – I loved it!</i></p>
<h4>Been × gone</h4>
<p><i>She has been to Paris</i> = já foi e voltou. <i>She has gone to Paris</i> = foi e ainda está lá.</p>
<h4>Quantas vezes</h4>
<p><i>I've been to Rio three times. This is the first time I've eaten Thai food. How many times have you moved?</i></p>
<h4>Particípios mais usados</h4>
<p><i>been, done, gone, seen, eaten, drunk, written, spoken, taken, given, made, had, known, met, read, heard, bought, lost, found, broken, forgotten, won, flown, driven, ridden, swum, sung, tried, worked, visited</i>.</p>`,
["have/has + particípio","Have you ever...? / I've never...","Tempo definido (yesterday, in 2019) → simple past","been (foi e voltou) × gone (está lá)","This is the first time I've..."],
`<i>"I've traveled a lot, but I've never been to Asia. I've tried many types of food, and the strangest thing I've ever eaten was frog. I ate it in France about ten years ago."</i>`,
`Faça uma lista "Bucket list" com 10 coisas que você já fez (I've...) e 10 que nunca fez mas quer fazer. Para 5 das que já fez, conte quando com simple past.`,
[["Qual está correta?",["I have seen her yesterday.","I saw her yesterday.","I have saw her yesterday.","I've see her yesterday."],1,"Yesterday é tempo definido: simple past."],["'Você já foi ao Chile?'",["Did you ever go to Chile?","Have you ever been to Chile?","Have you ever gone Chile?","Are you ever been to Chile?"],1,"Experiência de vida: Have you ever been...?"],["'Ela foi para Londres e ainda está lá':",["She has been to London.","She has gone to London.","She went to London ever.","She is been to London."],1,"Gone = foi e ainda não voltou."]]),
L("For, since, already, yet, just e still",`<h4>Present perfect para algo que começou no passado e continua</h4>
<p><i>I've lived here for ten years</i> (moro aqui há dez anos e continuo). Em português usamos presente ("moro há"), mas em inglês é present perfect. "I live here for ten years" está errado.</p>
<table><tr><th>for (duração)</th><th>since (ponto de início)</th></tr>
<tr><td>for two years, for a long time, for ages, for three months</td><td>since 2018, since Monday, since I was a child, since last year</td></tr>
<tr><td>I've known her for five years.</td><td>I've known her since 2021.</td></tr></table>
<p>Pergunta: <i>How long have you worked there? – For about six years. / Since 2020.</i></p>
<h4>Just, already, yet, still</h4>
<table><tr><th>Palavra</th><th>Sentido</th><th>Posição</th><th>Exemplo</th></tr>
<tr><td>just</td><td>Acabou de</td><td>Entre have e particípio</td><td>I've just arrived.</td></tr>
<tr><td>already</td><td>Já (mais cedo que o esperado)</td><td>Entre have e particípio</td><td>She's already finished.</td></tr>
<tr><td>yet</td><td>Ainda (negativa) / já (pergunta)</td><td>No fim</td><td>I haven't eaten yet. Have you eaten yet?</td></tr>
<tr><td>still</td><td>Ainda (continua)</td><td>Antes do verbo; em negativa antes de haven't</td><td>I still haven't paid. He still lives with his parents.</td></tr></table>
<h4>Present perfect com períodos não terminados</h4>
<p><i>today, this week, this month, this year, recently, lately, so far</i> (até agora): <i>I've drunk three coffees today. Have you seen any good movies lately? So far, everything has been fine.</i> Se o período já terminou, simple past: <i>I drank three coffees yesterday.</i></p>
<h4>Notícias e novidades</h4>
<p>Novidades usam present perfect; os detalhes, simple past: <i>Guess what? I've bought a car! I bought it on Saturday. It was a great deal.</i></p>`,
["I've lived here for 10 years (moro há 10 anos)","for + duração; since + ponto de início","How long have you...?","just/already no meio; yet no fim","Novidade no perfect, detalhes no past"],
`<i>"– Have you finished the book yet? – Not yet. I've just started chapter 10. I've been really busy this week. – I've already read it twice! You'll love the ending."</i>`,

[["'Moro aqui há 5 anos':",["I live here for 5 years.","I've lived here for 5 years.","I'm living here since 5 years.","I lived here since 5 years."],1,"Ação que continua: present perfect + for."],["Complete: I've known him ___ 2015.",["for","since","ago","from"],1,"Ponto de início: since."],["Qual está correta?",["I haven't finished already.","I haven't finished yet.","I didn't finish yet already.","I haven't yet finished already."],1,"Negativa com yet no fim."]]),
L("Present perfect continuous e escolha de tempos",`<h4>Forma</h4>
<p><b>have/has been + -ing</b>: <i>I've been studying English for two years. She's been working all day. How long have you been waiting?</i></p>
<h4>Quando usar</h4>
<ul><li>Ação que começou no passado e continua, com foco na <b>duração</b>: <i>It's been raining since morning.</i></li>
<li>Ação recente que explica uma situação atual (resultado visível): <i>You look tired. – I've been running. Your eyes are red. Have you been crying?</i></li></ul>
<h4>Perfect simple × perfect continuous</h4>
<table><tr><th>Simple: resultado, quantidade, conclusão</th><th>Continuous: atividade, duração, processo</th></tr>
<tr><td>I've written three e-mails.</td><td>I've been writing e-mails all morning.</td></tr>
<tr><td>She's painted the kitchen. (terminou)</td><td>She's been painting the kitchen. (talvez não terminou)</td></tr>
<tr><td>How many pages have you read?</td><td>How long have you been reading?</td></tr></table>
<p>Verbos de estado continuam sem -ing: <i>I've known her for years</i> (não "been knowing").</p>
<h4>Mapa dos tempos verbais até aqui</h4>
<table><tr><th>Tempo</th><th>Ideia central</th><th>Exemplo</th></tr>
<tr><td>Simple present</td><td>Rotina, fato</td><td>I work from 9 to 6.</td></tr>
<tr><td>Present continuous</td><td>Agora, temporário, plano marcado</td><td>I'm working on a project.</td></tr>
<tr><td>Simple past</td><td>Terminado, tempo definido</td><td>I worked there in 2020.</td></tr>
<tr><td>Past continuous</td><td>Em andamento no passado</td><td>I was working when you called.</td></tr>
<tr><td>Present perfect</td><td>Experiência, resultado, até agora</td><td>I've worked in three countries.</td></tr>
<tr><td>Present perfect continuous</td><td>Duração até agora</td><td>I've been working since 8.</td></tr>
<tr><td>Going to / will</td><td>Futuro</td><td>I'm going to change jobs. I'll help.</td></tr></table>
<h4>Expressões úteis</h4>
<p><i>It's been ages! (faz tempo!) Long time no see. What have you been up to? (o que você tem feito?) – Not much / I've been really busy with...</i></p>`,
["have/has been + -ing = duração até agora","Resultado visível de atividade recente: I've been running","Simple = quantidade/resultado; continuous = processo","Stative verbs não usam continuous","What have you been up to?"],
`<i>"– Hey, long time no see! What have you been up to? – I've been studying a lot. I've been taking an online course since March and I've already finished four modules."</i>`,

[["Foco na duração:",["I've waited for two hours.","I've been waiting for two hours.","I wait for two hours.","I'm waiting since two hours."],1,"Duração até agora: perfect continuous."],["Quantidade concluída:",["I've been writing three letters.","I've written three letters.","I'm written three letters.","I write three letters since."],1,"Resultado/quantidade: present perfect simple."],["'O que você tem feito?'",["What did you do?","What have you been up to?","What are you up?","What you have done?"],1,"Expressão natural: What have you been up to?"]]),
L("Gerúndio ou infinitivo",`<h4>Verbos seguidos de -ing</h4>
<p><i>enjoy, avoid, finish, mind, miss, suggest, consider, keep, practice, imagine, admit, deny, risk, can't stand, can't help, feel like, give up, look forward to</i>.</p>
<p><i>I enjoy cooking. She avoids driving at night. Would you mind waiting? I feel like going out. I'm looking forward to seeing you</i> (note: to + -ing).</p>
<h4>Verbos seguidos de to + verbo</h4>
<p><i>want, need, decide, hope, plan, expect, promise, agree, refuse, offer, manage, afford, learn, seem, would like, choose, pretend, tend</i>.</p>
<p><i>I want to travel. We decided to stay. She managed to finish on time. I can't afford to buy a new car.</i></p>
<h4>Verbos que aceitam os dois</h4>
<p>Sem mudança de sentido: <i>like, love, hate, prefer, start, begin, continue</i>: <i>It started raining / to rain.</i></p>
<p>Com mudança de sentido:</p>
<table><tr><th>Verbo</th><th>+ -ing</th><th>+ to</th></tr>
<tr><td>stop</td><td>Parar de fazer: I stopped smoking.</td><td>Parar para fazer: I stopped to smoke.</td></tr>
<tr><td>remember</td><td>Lembrar de algo feito: I remember meeting her.</td><td>Lembrar de fazer: Remember to lock the door.</td></tr>
<tr><td>forget</td><td>Esquecer algo feito: I'll never forget seeing the ocean.</td><td>Esquecer de fazer: I forgot to call.</td></tr>
<tr><td>try</td><td>experimentar: Try restarting the computer.</td><td>Esforçar-se: I tried to open it, but I couldn't.</td></tr>
<tr><td>regret</td><td>arrepender-se: I regret saying that.</td><td>lamentar informar: We regret to inform you...</td></tr></table>
<h4>Depois de preposição sempre -ing</h4>
<p><i>I'm good at cooking. She's interested in learning Italian. Thanks for helping. How about going to the beach? Before leaving, turn off the lights. I'm tired of waiting.</i></p>
<h4>-ing como sujeito</h4>
<p><i>Swimming is good for you. Learning a language takes time. Smoking is not allowed.</i></p>
<h4>Make e let</h4>
<p>Seguidos de verbo sem to: <i>My boss made me work late. My parents let me travel alone.</i></p>`,
["enjoy, avoid, finish, mind + -ing","want, decide, need, hope + to","stop/remember/forget/try mudam o sentido","Depois de preposição: -ing (good at cooking)","make/let + verbo sem to"],
`<i>"I've decided to change my habits. I want to sleep earlier, so I've stopped drinking coffee after 4 pm. I'm also considering joining a gym. I'm really looking forward to feeling better."</i>`,
`Escreva 20 frases sobre seus hábitos e planos usando 10 verbos + -ing e 10 verbos + to. Inclua os 4 pares stop/remember/forget/try com os dois sentidos.`,
[["Qual está correta?",["I enjoy to read.","I enjoy reading.","I enjoy read.","I enjoy for reading."],1,"Enjoy + -ing."],["'Parei de fumar':",["I stopped to smoke.","I stopped smoking.","I stopped smoke.","I stop of smoking."],1,"Stop + -ing = parar de fazer."],["Complete: I'm looking forward to ___ you.",["see","seeing","saw","to see"],1,"Look forward to: to é preposição, então -ing."]]),
L("Phrasal verbs essenciais do dia a dia",`<h4>O que são</h4>
<p>Verbo + partícula (preposição ou advérbio) que forma um novo sentido. Nativos usam o tempo todo, especialmente na fala. <i>Look</i> = olhar; <i>look for</i> = procurar; <i>look after</i> = cuidar; <i>look up</i> = pesquisar.</p>
<h4>Separáveis e inseparáveis</h4>
<ul><li><b>Separáveis</b>: o objeto pode ir no meio: <i>Turn off the light / Turn the light off.</i> Com pronome, <b>obrigatoriamente</b> no meio: <i>Turn it off</i> (nunca "turn off it").</li>
<li><b>Inseparáveis</b>: <i>Look after the kids. Look after them.</i></li></ul>
<h4>Os 40 mais úteis</h4>

<tr><td>get up</td><td>Levantar-se</td><td>I get up at 6.</td></tr><tr><td>wake up</td><td>Acordar</td><td>Wake me up at 7.</td></tr>
<tr><td>turn on / off</td><td>Ligar / desligar</td><td>Turn on the TV.</td></tr><tr><td>turn up / down</td><td>Aumentar / abaixar (volume)</td><td>Turn it down!</td></tr>
<tr><td>put on / take off</td><td>Vestir / tirar</td><td>Put on your coat.</td></tr><tr><td>try on</td><td>Experimentar (roupa)</td><td>Can I try it on?</td></tr>
<tr><td>look for</td><td>Procurar</td><td>I'm looking for my keys.</td></tr><tr><td>find out</td><td>Descobrir</td><td>I found out the truth.</td></tr>
<tr><td>look after</td><td>Cuidar</td><td>She looks after her mom.</td></tr><tr><td>look up</td><td>Pesquisar</td><td>Look it up online.</td></tr>
<tr><td>give up</td><td>Desistir, largar</td><td>Don't give up!</td></tr><tr><td>go on</td><td>Continuar, acontecer</td><td>What's going on?</td></tr>
<tr><td>come back</td><td>Voltar</td><td>Come back soon.</td></tr><tr><td>go out</td><td>Sair (para se divertir)</td><td>Let's go out tonight.</td></tr>
<tr><td>pick up</td><td>Buscar, pegar</td><td>I'll pick you up at 8.</td></tr><tr><td>drop off</td><td>Deixar alguém/algo</td><td>Drop me off here.</td></tr>
<tr><td>get on / off</td><td>Entrar / sair (ônibus, trem)</td><td>Get off at the next stop.</td></tr><tr><td>get in / out</td><td>Entrar / sair (carro)</td><td>Get in the car.</td></tr>
<tr><td>fill in / out</td><td>Preencher</td><td>Fill out this form.</td></tr><tr><td>set up</td><td>Montar, configurar</td><td>Set up your account.</td></tr>
<tr><td>sign up</td><td>Inscrever-se</td><td>I signed up for a course.</td></tr><tr><td>log in / out</td><td>Entrar / sair (sistema)</td><td>Log in with your e-mail.</td></tr>
<tr><td>call back</td><td>Retornar ligação</td><td>I'll call you back.</td></tr><tr><td>hang up</td><td>Desligar o telefone</td><td>Don't hang up!</td></tr>
<tr><td>run out of</td><td>Ficar sem</td><td>We ran out of milk.</td></tr><tr><td>throw away</td><td>Jogar fora</td><td>Throw it away.</td></tr>
<tr><td>clean up</td><td>Arrumar, limpar</td><td>Clean up your room.</td></tr><tr><td>grow up</td><td>Crescer</td><td>I grew up in Minas.</td></tr>
<tr><td>break down</td><td>Quebrar (máquina, carro)</td><td>My car broke down.</td></tr><tr><td>work out</td><td>Malhar; dar certo</td><td>It worked out fine.</td></tr>
<tr><td>figure out</td><td>Entender, resolver</td><td>I can't figure it out.</td></tr><tr><td>hang out</td><td>Passar tempo junto</td><td>We hung out all day.</td></tr>
<tr><td>show up</td><td>Aparecer</td><td>He didn't show up.</td></tr><tr><td>get along (with)</td><td>Dar-se bem</td><td>I get along with my boss.</td></tr>
<tr><td>calm down</td><td>Acalmar-se</td><td>Calm down, it's OK.</td></tr><tr><td>slow down</td><td>Diminuir a velocidade</td><td>Slow down!</td></tr>
<tr><td>put off</td><td>Adiar</td><td>Don't put it off.</td></tr><tr><td>call off</td><td>Cancelar</td><td>They called off the game.</td></tr>

<p>Estudo eficaz: aprenda em frases e por tema (casa, transporte, tecnologia), nunca em lista alfabética.</p>`,

L("Vocabulário B1: sentimentos, personalidade e opinião",`<h4>Sentimentos além de happy e sad</h4>
<table><tr><th>Positivo</th><th>Negativo</th></tr>
<tr><td>delighted, thrilled, excited, relieved, proud, grateful, relaxed, satisfied, confident, hopeful</td><td>upset, disappointed, frustrated, annoyed, anxious, worried, stressed, scared, embarrassed, jealous, lonely, overwhelmed</td></tr></table>
<p><i>I was relieved when I passed the test. She was embarrassed when she fell. I feel overwhelmed with so much to do.</i> Cuidado: <b>embarrassed</b> = envergonhado (não "embaraçada"/grávida, que é <i>pregnant</i>).</p>
<h4>Personalidade</h4>
<p><i>outgoing (extrovertido), shy, easygoing (tranquilo), hard-working, lazy, honest, reliable (confiável), generous, selfish, patient, impatient, stubborn (teimoso), sensitive (sensível), sensible (sensato), polite, rude, funny, bossy (mandão), moody (de humor instável), ambitious, open-minded, narrow-minded</i>.</p>
<p>Falsos amigos: <b>sensible</b> = sensato; <b>sensitive</b> = sensível. <b>Nice</b> = legal/simpático (não "nice" como "bacana" para coisas caras). <b>Pretend</b> = fingir (não "Pretender", que é <i>intend</i>).</p>
<h4>Dar opinião</h4>
<table><tr><th>Função</th><th>Expressões</th></tr>
<tr><td>Dar opinião</td><td>I think... / In my opinion... / Personally, I believe... / If you ask me... / As far as I'm concerned...</td></tr>
<tr><td>Concordar</td><td>I agree. / Absolutely. / That's true. / Exactly. / You have a point.</td></tr>
<tr><td>Concordar em parte</td><td>I see what you mean, but... / That's partly true, but... / I agree up to a point.</td></tr>
<tr><td>Discordar com educação</td><td>I'm not sure about that. / I see it differently. / I don't think so. / I'm afraid I disagree.</td></tr>
<tr><td>Pedir opinião</td><td>What do you think? / How do you feel about...? / What's your take on...?</td></tr></table>
<p>Erro de brasileiro: "I agree with you" está certo, mas "I am agree" está errado. Agree é verbo: <i>I agree, I don't agree</i>.</p>
<h4>Justificar</h4>
<p><i>because, since, as, that's why, the reason is that, for example, for instance, such as, on the other hand, however</i>: <i>I prefer living in the countryside because it's quieter. On the other hand, it's harder to find a job.</i></p>`,
["relieved, embarrassed, overwhelmed, disappointed","sensible (sensato) × sensitive (sensível)","pretend = fingir; intend = pretender","I agree (nunca 'I am agree')","I see what you mean, but... para discordar com educação"],
`<i>"– What do you think about working from home? – Personally, I love it because I save time. – I see what you mean, but I get lonely. – That's true. Maybe a mix is the best option."</i>`,
`Escolha 3 temas (redes sociais, morar sozinho, trabalho remoto) e escreva para cada um um parágrafo com sua opinião, um argumento contrário e uma conclusão. Use 8 expressões de opinião.`,

]);

MOD("ing","B1 · Comunicação real","Construir frases complexas com condicionais, passiva, orações relativas e discurso indireto.",[
L("Zero e first conditional",`<h4>Zero conditional: verdades e regras</h4>
<p><b>If + presente, presente</b>. Algo que sempre acontece: <i>If you heat ice, it melts. If I drink coffee at night, I can't sleep. If it rains, the streets flood.</i> Aqui <i>if</i> equivale a <i>when</i>.</p>
<h4>First conditional: possibilidade real no futuro</h4>
<p><b>If + presente, will + verbo</b>: <i>If it rains tomorrow, we'll stay home. If you study, you'll pass. If I see her, I'll tell her.</i></p>
<p>Erro muito comum: usar will depois de if. Errado: "If it will rain". Certo: <i>If it rains</i>.</p>
<p>A ordem pode inverter (sem vírgula): <i>We'll stay home if it rains.</i></p>
<h4>Variações</h4>
<ul><li>Com modais: <i>If you're tired, you should rest. If you finish early, you can leave.</i></li>
<li>Com imperativo: <i>If you see him, call me.</i></li>
<li><b>unless</b> = a menos que (if not): <i>You won't pass unless you study.</i> = <i>if you don't study</i>.</li>
<li><b>as long as / provided that</b> = desde que: <i>You can borrow my car as long as you're careful.</i></li>
<li><b>in case</b> = caso (precaução): <i>Take an umbrella in case it rains.</i></li></ul>
<h4>Orações de tempo</h4>
<p>Mesma lógica com <b>when, as soon as, before, after, until</b>: <i>I'll tell you when I know. Wait here until I come back.</i></p>
<h4>If × when</h4>
<p><i>If I see John, I'll tell him</i> (talvez eu o veja). <i>When I see John, I'll tell him</i> (com certeza vou vê-lo).</p>
<h4>Superstições e conselhos</h4>
<p><i>If you break a mirror, you'll have seven years of bad luck. If you don't sleep enough, you'll feel tired. If you save a little every month, you'll have enough by the end of the year.</i></p>`,
["Zero: If + presente, presente (sempre verdade)","First: If + presente, will (possível no futuro)","Nunca will depois de if","unless = a menos que","in case = por precaução"],
`<i>"If I get the job, I'll move to Porto Alegre. But I won't accept unless they pay for the move. I'll call you as soon as I hear from them, in case you want to celebrate!"</i>`,
`Escreva uma "cadeia" de 10 condicionais em que o resultado de uma vira a condição da próxima ("If I wake up late, I'll miss the bus. If I miss the bus, ..."). Depois 5 frases com unless e 5 com in case.`,
[["Qual está correta?",["If it will rain, we'll stay.","If it rains, we'll stay.","If it rains, we stay will.","If it raining, we'll stay."],1,"Depois de if, presente."],["'A menos que você estude':",["if you study","unless you study","in case you study","as long you study"],1,"Unless = a menos que."],["Zero conditional:",["If you heat water to 100°C, it boils.","If you heat water, it will boil tomorrow.","If you heated water, it boiled.","If you'll heat water, it boils."],0,"Verdade científica: presente nas duas partes."]]),
L("Second conditional: situações imaginárias",`<h4>Forma</h4>
<p><b>If + past simple, would + verbo</b>: situação irreal ou improvável no presente ou futuro.</p>
<p><i>If I won the lottery, I would (I'd) travel the world. If I had more time, I'd learn to play the piano. If she lived closer, we'd see her more often.</i></p>
<p>O passado aqui <b>não indica passado</b>, indica distância da realidade. "Se eu tivesse..." = <i>If I had...</i></p>
<h4>If I were you</h4>
<p>Com to be, o padrão formal é <i>were</i> para todas as pessoas: <i>If I were rich... If he were here...</i> "If I was" é comum na fala, mas use <i>were</i> em textos e provas. <b>If I were you, I'd...</b> é a forma clássica de dar conselho: <i>If I were you, I'd talk to her.</i></p>
<h4>First × second</h4>
<table><tr><th>First (real, possível)</th><th>Second (imaginário, improvável)</th></tr>
<tr><td>If I have time, I'll call you.</td><td>If I had time, I'd call you. (mas não tenho)</td></tr>
<tr><td>If it's sunny tomorrow, we'll go to the beach.</td><td>If I lived by the sea, I'd go to the beach every day.</td></tr></table>
<h4>Could e might no resultado</h4>
<p><i>If I spoke French, I could work in Canada</i> (poderia). <i>If you asked him, he might say yes</i> (talvez).</p>
<h4>Perguntas hipotéticas (ótimas para conversa)</h4>
<p><i>What would you do if you found a wallet with money? Where would you live if you could live anywhere? If you could have any superpower, what would it be? Would you rather be rich or famous?</i></p>
<p><b>Would you rather...?</b> = você preferiria...? Resposta: <i>I'd rather be rich</i> (eu preferiria). <i>I'd rather not</i> = prefiro não.</p>
<h4>Would para pedidos e desejos educados</h4>
<p><i>I'd love to come. Would you like some coffee? It would be great if you could help.</i></p>`,
["If + past, would + verbo = imaginário","If I were you, I'd... (conselho)","O passado aqui indica irrealidade, não tempo","could/might no resultado","Would you rather...? / I'd rather..."],
`<i>"If I didn't have to work, I'd spend more time with my kids. And if I could live anywhere, I'd choose a small town in Portugal. But honestly, if I were you, I'd stay here: you love this city!"</i>`,
`Responda por escrito 10 perguntas hipotéticas (What would you do if...?). Depois escreva 5 conselhos com "If I were you" e 5 escolhas com "I'd rather".`,
[["'Se eu fosse rico, eu viajaria':",["If I am rich, I will travel.","If I were rich, I would travel.","If I would be rich, I traveled.","If I was rich, I will travel."],1,"Second conditional: were + would."],["Conselho clássico:",["If I am you, I go.","If I were you, I'd go.","If I was you, I will go.","If I be you, I'd go."],1,"If I were you, I'd..."],["Situação real e possível:",["If I have time tomorrow, I'll help.","If I had time tomorrow, I'll help.","If I would have time, I help.","If I'd have time, I'll help."],0,"Possibilidade real: first conditional."]]),
L("Voz passiva",`<h4>Quando usar</h4>
<p>Quando o foco é a ação ou o objeto, e não quem faz; quando quem faz é desconhecido, óbvio ou não importa: <i>My car was stolen. English is spoken here. The bridge was built in 1950.</i></p>
<h4>Forma: be (no tempo certo) + particípio</h4>
<table><tr><th>Tempo</th><th>Ativa</th><th>Passiva</th></tr>
<tr><td>Present simple</td><td>They clean the room daily.</td><td>The room is cleaned daily.</td></tr>
<tr><td>Present continuous</td><td>They are painting the house.</td><td>The house is being painted.</td></tr>
<tr><td>Past simple</td><td>Someone stole my bike.</td><td>My bike was stolen.</td></tr>
<tr><td>Past continuous</td><td>They were fixing the road.</td><td>The road was being fixed.</td></tr>
<tr><td>Present perfect</td><td>They have canceled the flight.</td><td>The flight has been canceled.</td></tr>
<tr><td>Future (will)</td><td>They will announce the results.</td><td>The results will be announced.</td></tr>
<tr><td>Modais</td><td>You must sign the form.</td><td>The form must be signed.</td></tr></table>
<h4>By: quem fez</h4>
<p>Só use <b>by</b> quando a informação for importante: <i>The Mona Lisa was painted by Leonardo da Vinci.</i> Em <i>My wallet was stolen</i> não faz sentido "by someone".</p>
<h4>Passiva com dois objetos</h4>
<p><i>They gave me a gift → I was given a gift</i> (mais natural) / <i>A gift was given to me.</i></p>
<h4>Onde a passiva aparece</h4>
<ul><li>Notícias: <i>Three people were injured in the accident.</i></li>
<li>Instruções e avisos: <i>Smoking is not permitted. Payment must be made in advance.</i></li>
<li>Processos: <i>First, the grapes are picked. Then they are crushed...</i></li>
<li>Textos científicos e formais: <i>The data was collected over two years.</i></li></ul>
<h4>Get + particípio (informal)</h4>
<p><i>I got fired. They got married in May. He got hurt playing soccer.</i></p>`,
["be + particípio, no tempo da frase","Foco na ação; quem fez não importa","by só quando quem fez é relevante","is being done (continuous); has been done (perfect)","get married, get hurt, get fired (informal)"],

L("Orações relativas: who, which, that, where, whose",`<h4>Pronomes relativos</h4>
<table><tr><th>Pronome</th><th>Refere-se a</th><th>Exemplo</th></tr>
<tr><td>who</td><td>Pessoas</td><td>The woman who lives next door is a doctor.</td></tr>
<tr><td>which</td><td>Coisas, animais</td><td>The book which I'm reading is great.</td></tr>
<tr><td>that</td><td>Pessoas ou coisas (informal, só em definidoras)</td><td>The car that I bought is red.</td></tr>
<tr><td>where</td><td>Lugares</td><td>This is the restaurant where we met.</td></tr>
<tr><td>when</td><td>Tempo</td><td>I remember the day when you were born.</td></tr>
<tr><td>whose</td><td>Posse (cujo)</td><td>That's the man whose dog bit me.</td></tr>
<tr><td>whom</td><td>Pessoa como objeto (formal)</td><td>The person to whom I spoke...</td></tr></table>
<h4>Definidoras × explicativas</h4>
<ul><li><b>Definidoras</b> (defining): informação essencial, sem vírgulas: <i>People who smoke have more health problems.</i></li>
<li><b>Explicativas</b> (non-defining): informação extra, entre vírgulas, nunca com that: <i>My brother, who lives in Canada, is visiting us.</i> <i>Rio, which is famous for its beaches, gets very hot.</i></li></ul>
<h4>Omitindo o pronome</h4>
<p>Nas definidoras, quando o pronome é <b>objeto</b>, pode ser omitido: <i>The movie (that) we watched was boring. The person (who) I called didn't answer.</i> Quando é sujeito, não: <i>The man who called me</i> (who é obrigatório).</p>
<h4>Preposição no final (natural na fala)</h4>
<p><i>That's the house I grew up in. She's the girl I told you about. Who are you talking to?</i> Formal: <i>the house in which I grew up</i>.</p>
<h4>Which para comentar a frase inteira</h4>
<p><i>He didn't call me, which was strange. It rained all week, which ruined our plans.</i></p>
<h4>Definir coisas (útil quando falta a palavra)</h4>
<p><i>It's a thing that you use to open bottles. It's a person who repairs cars. It's a place where you can buy medicine.</i> Essa técnica salva conversas quando você esquece uma palavra.</p>`,
["who (pessoas), which (coisas), where (lugares), whose (posse)","that só em definidoras, nunca entre vírgulas","Explicativas entre vírgulas: My mom, who...","Pronome objeto pode ser omitido: the movie we watched","It's a thing that... para explicar palavras esquecidas"],

L("Reported speech: contando o que alguém disse",`<h4>Recuo dos tempos (backshift)</h4>
<p>Com <i>said</i> ou <i>told</i> no passado, o verbo da fala original geralmente "volta" um tempo:</p>
<table><tr><th>Fala direta</th><th>Discurso indireto</th></tr>
<tr><td>"I'm tired."</td><td>She said (that) she was tired.</td></tr>
<tr><td>"I'm working."</td><td>He said he was working.</td></tr>
<tr><td>"I saw him."</td><td>She said she had seen him.</td></tr>
<tr><td>"I've finished."</td><td>He said he had finished.</td></tr>
<tr><td>"I'll call you."</td><td>She said she would call me.</td></tr>
<tr><td>"I can help."</td><td>He said he could help.</td></tr>
<tr><td>"I must go."</td><td>She said she had to go.</td></tr></table>
<p>Se a informação ainda é verdade, o recuo é opcional: <i>He said he lives in Recife</i> (ainda mora).</p>
<h4>Say × tell</h4>
<p><b>Tell</b> precisa de pessoa: <i>She told me (that)...</i>. <b>Say</b> não leva pessoa direto: <i>She said (that)...</i> ou <i>She said to me...</i>. Errado: "She said me".</p>
<h4>Mudanças de referência</h4>
<p><i>now → then, today → that day, tomorrow → the next day, yesterday → the day before, here → there, this → that, next week → the following week</i>. Pronomes também mudam: <i>"I love you" → He said he loved me.</i></p>
<h4>Perguntas indiretas</h4>
<p>Ordem de afirmação, sem do/did: <i>"Where do you live?" → She asked me where I lived.</i> Sim/não usa <b>if/whether</b>: <i>"Are you married?" → He asked if I was married.</i></p>
<h4>Ordens e pedidos</h4>
<p><i>"Close the door." → She told me to close the door. "Don't be late." → He told us not to be late. "Can you help me?" → She asked me to help her.</i></p>
<h4>Outros verbos de relato</h4>
<p><i>explain, mention, admit, promise (to), offer (to), suggest (-ing), warn, remind, complain, deny, agree (to), refuse (to)</i>: <i>He promised to call. She suggested going by train. They warned us not to swim there.</i></p>
<h4>Perguntas indiretas para educação</h4>
<p>Muito usadas para soar gentil: <i>Could you tell me where the station is? Do you know what time it opens? I wonder if you could help me.</i></p>`,
["said + recuo do tempo verbal (am → was, will → would)","tell + pessoa; say sem pessoa","Pergunta indireta na ordem de afirmação","if/whether para perguntas de sim/não","told me to / not to para ordens"],
`<i>"My boss called yesterday. He said he was happy with my work and told me not to worry about the deadline. He asked if I could start the new project the following week and promised to send the details."</i>`,
`Lembre uma conversa real recente e escreva o relato em 12 frases de discurso indireto (said, told, asked, promised, suggested). Transforme 5 perguntas diretas em perguntas indiretas educadas.`,
[["'I'm hungry,' she said →",["She said she is hungry me.","She said she was hungry.","She told she was hungry.","She said me she was hungry."],1,"Said + recuo: was."],["Pergunta indireta correta:",["He asked where did I live.","He asked where I lived.","He asked where do I live.","He asked me where lived I."],1,"Ordem de afirmação, sem did."],["Qual está correta?",["She said me to wait.","She told me to wait.","She told to me wait.","She said to wait me."],1,"Tell + pessoa + to."]]),
L("Conversação: manter conversas e soar natural",`<h4>Puxar assunto (small talk)</h4>
<p>Temas seguros: clima, fim de semana, viagens, comida, séries, esportes, o lugar onde vocês estão. <i>Lovely weather today, isn't it? Have you been here before? How do you know the host? Are you from around here? Have you seen any good series lately?</i></p>
<h4>Question tags</h4>
<p>Pequenas perguntas no fim que pedem confirmação: afirmativa → tag negativa; negativa → tag afirmativa. <i>It's hot, isn't it? You live here, don't you? She can swim, can't she? They didn't come, did they? You've been there, haven't you?</i> Exceção: <i>I'm right, aren't I?</i></p>
<h4>Ganhar tempo para pensar</h4>
<p><i>Well... / Let me think... / That's a good question. / How can I put it? / You know... / I mean... / Kind of... / Sort of...</i> Isso é muito mais natural do que ficar em silêncio ou dizer "éééé".</p>
<h4>Mostrar interesse e reagir</h4>
<table><tr><th>Reação</th><th>Exemplo</th></tr>
<tr><td>Surpresa</td><td>Really? / No way! / Seriously? / You're kidding!</td></tr>
<tr><td>Interesse</td><td>That's interesting. / Tell me more. / How did that happen?</td></tr>
<tr><td>Empatia</td><td>That sounds tough. / I'm sorry to hear that. / Oh no!</td></tr>
<tr><td>Alegria</td><td>That's great news! / Congratulations! / Good for you!</td></tr>
<tr><td>Perguntas-eco</td><td>– I've just got back from Japan. – Have you? How was it?</td></tr></table>
<h4>Pedir esclarecimento e corrigir mal-entendidos</h4>
<p><i>Sorry, I didn't catch that. What do you mean by...? So, you're saying that...? Sorry, I meant... What I'm trying to say is...</i></p>
<h4>So / neither para concordar</h4>
<p><i>– I love jazz. – So do I. – I can't swim. – Neither can I. – I've never been to Europe. – Neither have I.</i> O auxiliar acompanha o tempo da frase.</p>
<h4>Encerrar com educação</h4>
<p><i>Well, it was great talking to you. I should get going. Let's keep in touch. See you around! Take care!</i></p>`,
["Small talk: clima, fim de semana, viagens, séries","Question tags: It's hot, isn't it?","Well... / Let me think... para ganhar tempo","Perguntas-eco: Have you? Did she?","So do I / Neither can I"],

`Grave 3 conversas de 2 minutos com você mesmo fazendo os dois papéis (ou com uma IA de voz): numa festa, na fila de um evento e num voo. Use question tags, perguntas-eco e expressões para ganhar tempo.`,

MOD("ing","B2 · Gramática avançada","Dominar as estruturas que separam o intermediário do avançado: hipóteses no passado, deduções, narrativa e desejos.",[
L("Third conditional e mixed conditionals",`<h4>Third conditional: o passado que não aconteceu</h4>
<p><b>If + past perfect, would have + particípio</b>. Fala de situações passadas imaginárias e seus resultados, geralmente arrependimentos ou alívio.</p>
<p><i>If I had studied more, I would have passed. If we had left earlier, we wouldn't have missed the flight. If you hadn't called me, I would have overslept.</i></p>
<p>Contrações na fala: <i>If I'd known, I'd have told you</i> ("aid-av"). Cuidado: o primeiro <i>'d</i> é <b>had</b>, o segundo é <b>would</b>.</p>
<h4>Could have / might have no resultado</h4>
<p><i>If you had asked, I could have helped</i> (poderia ter ajudado). <i>If they had played better, they might have won</i> (talvez tivessem ganhado).</p>
<h4>Mixed conditionals</h4>
<table><tr><th>Tipo</th><th>Estrutura</th><th>Exemplo</th></tr>
<tr><td>Passado → presente</td><td>If + past perfect, would + verbo</td><td>If I had taken that job, I would be rich now.</td></tr>
<tr><td>Presente → passado</td><td>If + past simple, would have + particípio</td><td>If I weren't so shy, I would have talked to her at the party.</td></tr></table>
<h4>Os quatro condicionais lado a lado</h4>
<table><tr><th>Tipo</th><th>Realidade</th><th>Exemplo</th></tr>
<tr><td>Zero</td><td>Sempre verdade</td><td>If you mix red and blue, you get purple.</td></tr>
<tr><td>First</td><td>Possível no futuro</td><td>If it rains, I'll stay home.</td></tr>
<tr><td>Second</td><td>Imaginário no presente</td><td>If I had a car, I'd drive to work.</td></tr>
<tr><td>Third</td><td>Imaginário no passado</td><td>If I had had a car, I'd have driven.</td></tr></table>
<h4>Inversão formal (sem if)</h4>
<p><i>Had I known, I would have come</i> (= If I had known). <i>Were I in your position, I'd accept</i> (= If I were). <i>Should you need help, call me</i> (= If you need). Muito usado em e-mails formais e textos escritos.</p>
<h4>Outras formas de hipótese</h4>
<p><i>But for your help, I would have failed</i> (se não fosse sua ajuda). <i>Without the map, we would have gotten lost. Otherwise</i> (caso contrário): <i>I took a taxi; otherwise I'd have been late.</i></p>`,
["Third: If + had + particípio, would have + particípio","If I'd known, I'd have... ('d = had, depois would)","Mixed: passado → presente (I would be rich now)","Inversão formal: Had I known...","Should you need help... (formal)"],
`<i>"If I hadn't gone to that party in 2015, I wouldn't have met my wife. And if we hadn't met, I wouldn't be living in this city now. Funny how life works!"</i>`,
`Escreva 8 frases com third conditional sobre decisões reais da sua vida e 4 mixed conditionals ligando o passado ao seu presente. Reescreva 3 delas com inversão (Had I...).`,
[["'Se eu soubesse, teria vindo':",["If I knew, I would come.","If I had known, I would have come.","If I would know, I had come.","If I have known, I would come."],1,"Third conditional."],["Mixed (passado → presente):",["If I had saved money, I would have a house now.","If I saved money, I would have had a house.","If I save money, I had a house.","If I had saved money, I will have a house."],0,"Condição no passado, resultado no presente."],["Inversão de 'If I had known':",["Had I known","Did I know","Have I known","Knew I had"],0,"Had + sujeito + particípio."]]),
L("Modais de dedução e de passado",`<h4>Dedução no presente</h4>
<table><tr><th>Modal</th><th>Certeza</th><th>Exemplo</th></tr>
<tr><td>must</td><td>Quase certeza que sim</td><td>She's not answering. She must be busy.</td></tr>
<tr><td>might / may / could</td><td>Possível</td><td>He might be at home. It could be true.</td></tr>
<tr><td>can't</td><td>Quase certeza que não</td><td>That can't be Maria; she's in Spain.</td></tr></table>
<p>Atenção: o oposto de <i>must</i> em dedução é <b>can't</b>, não "mustn't". <i>He must be tired → He can't be tired.</i></p>
<h4>Dedução no passado: modal + have + particípio</h4>
<p><i>The ground is wet. It must have rained. She didn't reply; she might have been asleep. He can't have seen me; it was too dark. They could have taken the wrong road.</i></p>
<h4>Críticas e arrependimentos</h4>
<table><tr><th>Forma</th><th>Sentido</th><th>Exemplo</th></tr>
<tr><td>should have + part.</td><td>Deveria ter (não fez)</td><td>You should have told me!</td></tr>
<tr><td>shouldn't have + part.</td><td>Não deveria ter (fez)</td><td>I shouldn't have eaten so much.</td></tr>
<tr><td>could have + part.</td><td>Poderia ter (possibilidade perdida)</td><td>You could have called. We could have won.</td></tr>
<tr><td>needn't have + part.</td><td>Fez, mas não era necessário</td><td>You needn't have brought a gift.</td></tr>
<tr><td>didn't need to</td><td>Não era necessário (provavelmente não fez)</td><td>I didn't need to wake up early.</td></tr></table>
<h4>Habilidade no passado</h4>
<p><i>could</i> para habilidade geral: <i>I could swim when I was five.</i> Para uma conquista específica, <b>was able to / managed to</b>: <i>The fire was big, but everyone was able to escape</i> (não "could escape").</p>
<h4>Pronúncia natural</h4>
<p><i>should have</i> soa "shúdav" ou "shúda"; <i>must have</i> "mástav"; <i>could have</i> "cúdav". Por isso nativos às vezes escrevem errado "should of".</p>`,
["must (certeza), might/could (possível), can't (impossível)","Dedução no passado: must have been","should have done = deveria ter feito","needn't have = fez sem necessidade","Conquista específica: was able to / managed to"],
`<i>"– Pedro isn't here yet. He must have missed the bus. – Or he might have forgotten. – He can't have forgotten; I reminded him this morning! – Well, he should have left earlier."</i>`,
`Olhe 5 fotos aleatórias na internet e faça 3 deduções sobre cada uma (presente e passado). Depois escreva 8 frases sobre coisas que você should have, shouldn't have e could have feito este ano.`,
[["Oposto de 'He must be at home' (dedução):",["He mustn't be at home.","He can't be at home.","He doesn't must be at home.","He needn't be at home."],1,"Em dedução, o oposto de must é can't."],["'Deve ter chovido':",["It must rain.","It must have rained.","It must had rained.","It should rained."],1,"Dedução no passado: must have + particípio."],["'Você deveria ter me contado':",["You should tell me.","You should have told me.","You must told me.","You should had tell me."],1,"Crítica ao passado: should have + particípio."]]),
L("Past perfect e narrativa avançada",`<h4>Past perfect: o passado do passado</h4>
<p><b>had + particípio</b>: ação que aconteceu antes de outro momento do passado.</p>
<p><i>When I arrived at the station, the train had already left</i> (o trem saiu antes de eu chegar). Compare: <i>When I arrived, the train left</i> (saiu quando cheguei).</p>
<h4>Usos frequentes</h4>
<ul><li>Com <i>already, just, never, before, by the time</i>: <i>By the time we got there, the show had started. I had never seen snow before that trip.</i></li>
<li>Para explicar causas no passado: <i>She was upset because she had lost her phone.</i></li>
<li>No reported speech e no third conditional.</li></ul>
<h4>Past perfect continuous</h4>
<p><b>had been + -ing</b>: duração até um ponto do passado: <i>I had been waiting for an hour when she finally arrived. His eyes were red because he had been crying.</i></p>
<h4>Os quatro tempos da narrativa</h4>
<table><tr><th>Tempo</th><th>Função na história</th><th>Exemplo</th></tr>
<tr><td>Past simple</td><td>Ações principais, em sequência</td><td>She opened the door and screamed.</td></tr>
<tr><td>Past continuous</td><td>Cenário, ações em andamento</td><td>It was raining and the wind was blowing.</td></tr>
<tr><td>Past perfect</td><td>O que aconteceu antes</td><td>Someone had broken the window.</td></tr>
<tr><td>Past perfect continuous</td><td>Duração antes do momento</td><td>She had been living there alone for years.</td></tr></table>
<h4>Recursos de estilo para contar bem</h4>
<ul><li>Advérbios de atitude: <i>Fortunately, Surprisingly, Strangely enough, Needless to say...</i></li>
<li>Verbos mais expressivos que "said" e "went": <i>whispered, shouted, muttered; rushed, wandered, crept, stormed out</i>.</li>
<li>Adjetivos fortes: <i>freezing</i> (em vez de very cold), <i>exhausted, terrified, furious, delighted, huge, tiny, gorgeous</i>. Com eles use <i>absolutely</i>, não "very": <i>absolutely exhausted</i>.</li></ul>
<h4>Expressões de tempo da narrativa</h4>
<p><i>As soon as, The moment (that), By the time, Just as, No sooner had... than, Hardly had... when, Eventually, Shortly afterwards, Little did I know...</i></p>`,
["had + particípio = antes de outro passado","By the time we arrived, it had started","had been + -ing = duração até um ponto passado","Narrativa mistura past simple, continuous e perfect","Adjetivos fortes com absolutely: absolutely exhausted"],
`<i>"By the time I reached the hotel, I was absolutely exhausted. I had been traveling for twenty hours and I hadn't eaten anything. Just as I lay down, the fire alarm went off. Little did I know, it was only a test."</i>`,

[["'Quando cheguei, o filme já tinha começado':",["When I arrived, the movie already started.","When I arrived, the movie had already started.","When I had arrived, the movie started already.","When I arrive, the movie has started."],1,"Ação anterior: past perfect."],["Com 'exhausted', o intensificador natural é:",["very","absolutely","a lot","much"],1,"Adjetivos fortes usam absolutely, não very."],["Duração antes de um ponto passado:",["I had been waiting for an hour when she came.","I was waited for an hour when she came.","I have been waiting when she came.","I waited since an hour when she came."],0,"Past perfect continuous."]]),
L("Wish, if only, it's time e I'd rather",`<h4>Wish + past simple: desejo sobre o presente</h4>
<p><i>I wish I had more time</i> (queria ter mais tempo; não tenho). <i>I wish I were taller. I wish I could speak Japanese. I wish you lived closer.</i></p>
<h4>Wish + past perfect: arrependimento sobre o passado</h4>
<p><i>I wish I had studied harder. I wish I hadn't said that. She wishes she had accepted the offer.</i></p>
<h4>Wish + would: irritação ou desejo de mudança no comportamento de alguém</h4>
<p><i>I wish you would stop interrupting me. I wish it would stop raining.</i> Não se usa "I wish I would".</p>
<h4>If only (mais emotivo)</h4>
<p><i>If only I had listened to you! If only I knew the answer!</i></p>
<h4>Resumo</h4>
<table><tr><th>Sobre</th><th>Estrutura</th><th>Exemplo</th></tr>
<tr><td>Presente</td><td>wish + past simple</td><td>I wish I lived by the sea.</td></tr>
<tr><td>Passado</td><td>wish + past perfect</td><td>I wish I had traveled more.</td></tr>
<tr><td>Habilidade</td><td>wish + could</td><td>I wish I could fly.</td></tr>
<tr><td>Comportamento alheio</td><td>wish + would</td><td>I wish he would call.</td></tr></table>
<h4>Outras estruturas "irreais"</h4>
<ul><li><b>It's (high) time + past</b>: já passou da hora: <i>It's time we left. It's high time you got a job.</i></li>
<li><b>I'd rather + sujeito + past</b>: preferir que outro faça: <i>I'd rather you didn't smoke here. I'd rather you came tomorrow.</i></li>
<li><b>as if / as though</b>: como se: <i>He talks as if he knew everything. She looks as though she's been crying.</i></li>
<li><b>Suppose / Imagine + past</b>: <i>Suppose you lost your job, what would you do?</i></li></ul>
<h4>Hope × wish</h4>
<p><b>Hope</b> é para algo possível: <i>I hope you pass the test</i> (é possível). <b>Wish</b> é para o irreal: <i>I wish I were 20 again.</i> Exceção formal: <i>We wish you a Merry Christmas.</i></p>`,
["wish + past = desejo irreal no presente","wish + past perfect = arrependimento","wish + would = queria que alguém mudasse","It's time we left. I'd rather you didn't...","hope (possível) × wish (irreal)"],
`<i>"I wish I had started learning English as a child. If only I'd known how useful it would be! Anyway, it's high time I stopped complaining and started practicing more. I hope I'll be fluent in two years."</i>`,
`Escreva 5 wishes sobre o presente, 5 sobre o passado e 3 com would. Depois escreva 4 frases com it's time, 3 com I'd rather e 3 com as if.`,
[["'Queria ter mais dinheiro (agora)':",["I wish I have more money.","I wish I had more money.","I wish I would have more money.","I hope I had more money."],1,"Presente irreal: wish + past simple."],["Arrependimento:",["I wish I didn't say that.","I wish I hadn't said that.","I wish I wouldn't say that.","I hope I hadn't said."],1,"Passado: wish + past perfect."],["'Já passou da hora de irmos':",["It's time we go.","It's time we went.","It's time we have gone.","It's time to we went."],1,"It's time + sujeito + past."]]),
L("Passiva avançada e causativa",`<h4>Causativa: have / get something done</h4>
<p>Quando outra pessoa faz o serviço para você: <b>have + objeto + particípio</b>.</p>
<p><i>I had my hair cut</i> (cortei o cabelo no cabeleireiro). <i>We're having the house painted. I need to get my car fixed. She got her nails done.</i></p>
<p>Brasileiro costuma dizer "I cut my hair" quando foi ao salão, o que significa que ele mesmo cortou. Também serve para coisas ruins: <i>I had my phone stolen.</i></p>
<h4>Have/get someone do something</h4>
<p><i>I'll have the technician check it</i> (pedir para alguém fazer). <i>I got my brother to help me move</i> (convencer).</p>
<h4>Passiva impessoal: reportagens e opiniões</h4>
<table><tr><th>Estrutura</th><th>Exemplo</th></tr>
<tr><td>It is said / believed / thought that...</td><td>It is said that the house is haunted.</td></tr>
<tr><td>Sujeito + is said to + verbo</td><td>The house is said to be haunted.</td></tr>
<tr><td>Sujeito + is believed to have + particípio</td><td>He is believed to have left the country.</td></tr></table>
<p>Verbos: <i>say, believe, think, know, expect, report, consider, estimate, claim</i>. Usado em notícias para não afirmar diretamente.</p>
<h4>Passiva com modais e infinitivo</h4>
<p><i>It should be done today. It can't be fixed. It needs to be checked</i> = <i>It needs checking</i>. <i>I don't like being told what to do. She wants to be promoted.</i></p>
<h4>Passiva com verbos com preposição</h4>
<p><i>Someone looked after the kids → The kids were looked after. They laughed at him → He was laughed at.</i> A preposição fica no lugar.</p>
<h4>Escolha estilística</h4>
<p>Textos claros usam mais voz ativa; a passiva é ótima quando o agente é desconhecido, quando se quer foco no resultado ou quando se quer ser diplomático: <i>Mistakes were made</i> (em vez de "você errou").</p>`,
["have/get something done = alguém faz para você","I had my hair cut (no salão)","It is said that... / He is said to be...","It needs checking = It needs to be checked","Passiva diplomática: Mistakes were made"],
`<i>"This week I'm having my kitchen renovated, so I had all the furniture moved to the garage. I also got my car serviced. The neighbors are said to be annoyed with the noise, but it'll be over soon."</i>`,
`Liste 10 serviços que você costuma contratar e escreva frases causativas (I have my... done every...). Depois transforme 6 boatos ou notícias em passiva impessoal (It is said that... / X is believed to...).`,
[["'Cortei o cabelo (no salão)':",["I cut my hair.","I had my hair cut.","I had cut my hair.","I got cut my hair."],1,"Causativa: have + objeto + particípio."],["Forma impessoal correta:",["He is said to be very rich.","He is said that he is rich.","It says he to be rich.","He said to be rich."],0,"Sujeito + is said to + verbo."],["'Isso precisa ser verificado':",["It needs check.","It needs checking.","It needs checked.","It need to checking."],1,"Need + -ing tem sentido passivo."]]),
L("Artigos, quantificadores e precisão",`<h4>Usos avançados de the</h4>
<ul><li>Instrumentos musicais: <i>play the piano</i>.</li>
<li>Coisas únicas: <i>the sun, the internet, the government, the environment</i>.</li>
<li>Superlativos e ordinais: <i>the best, the first time</i>.</li>
<li>Grupos com adjetivo: <i>the rich, the poor, the elderly, the unemployed</i>.</li>
<li>Rios, mares, cadeias de montanhas, desertos: <i>the Amazon, the Atlantic, the Andes, the Sahara</i>. Mas lagos e montanhas isoladas sem: <i>Lake Titicaca, Mount Everest</i>.</li>
<li>Generalizar uma espécie (formal): <i>The tiger is endangered.</i></li></ul>
<h4>Sem artigo (zero article)</h4>
<p>Instituições em seu uso principal: <i>go to school/church/prison/hospital/bed/work</i>. Compare: <i>She's in hospital</i> (paciente, UK) × <i>She went to the hospital to visit a friend.</i> Transporte com by: <i>by car, by bus</i>. Refeições: <i>have dinner</i>.</p>
<h4>Quantificadores</h4>
<table><tr><th>Palavra</th><th>Uso</th><th>Exemplo</th></tr>
<tr><td>few / a few</td><td>Poucos (negativo) / alguns (positivo)</td><td>Few people came (quase ninguém). A few people came (algumas).</td></tr>
<tr><td>little / a little</td><td>Pouco / um pouco (incontável)</td><td>There's little hope. I have a little money.</td></tr>
<tr><td>each / every</td><td>Cada (individual) / todo (grupo)</td><td>Each student got a book. Every student passed.</td></tr>
<tr><td>both / either / neither</td><td>Ambos / qualquer um dos dois / nenhum dos dois</td><td>Both are good. Either is fine. Neither works.</td></tr>
<tr><td>all / whole</td><td>Todos / inteiro</td><td>all day = the whole day</td></tr>
<tr><td>none of / no</td><td>Nenhum</td><td>None of my friends came. No one called.</td></tr>
<tr><td>plenty of</td><td>Bastante, de sobra</td><td>We have plenty of time.</td></tr>
<tr><td>hardly any</td><td>Quase nenhum</td><td>There's hardly any milk.</td></tr></table>
<h4>Fewer × less, number × amount</h4>
<p><i>fewer people, less money; a large number of cars, a large amount of water</i>.</p>
<h4>Substantivos traiçoeiros</h4>
<p>Sempre singular: <i>news, information, advice, furniture, luggage, equipment, research, homework, evidence, knowledge</i>. <i>The news is good. Can you give me some advice?</i> Sempre plural: <i>police, people, clothes, jeans, scissors, glasses, goods</i>. <i>The police are coming.</i></p>`,
["the + instrumentos, coisas únicas, rios e oceanos","go to school/bed/work sem the","few (quase nenhum) × a few (alguns)","fewer + contável; less + incontável","news, advice, furniture: sempre singular"],

L("Phrasal verbs intermediários e avançados",`<h4>Partículas têm lógica</h4>
<table><tr><th>Partícula</th><th>Ideia</th><th>Exemplos</th></tr>
<tr><td>up</td><td>Completar, aumentar, aparecer</td><td>eat up, use up, speed up, come up (surgir), bring up (mencionar)</td></tr>
<tr><td>down</td><td>Diminuir, parar, registrar</td><td>cut down on, break down, write down, turn down (recusar)</td></tr>
<tr><td>out</td><td>Até o fim, descobrir, sair</td><td>sort out (resolver), work out, run out, point out, stand out</td></tr>
<tr><td>off</td><td>Separar, cancelar, começar</td><td>call off, put off, set off (partir), lay off (demitir), show off</td></tr>
<tr><td>on</td><td>Continuar, ativar</td><td>carry on, keep on, move on, catch on (pegar, entender)</td></tr>
<tr><td>over</td><td>Revisar, dominar</td><td>think over, go over, take over, get over (superar)</td></tr>
<tr><td>back</td><td>Retornar, recuar</td><td>back up, cut back, hold back, look back on</td></tr></table>
<h4>Phrasal verbs de três partes</h4>
<p><i>look forward to (aguardar ansiosamente), come up with (ter uma ideia), get along with, put up with (aguentar), run out of, catch up with (alcançar, pôr em dia), keep up with (acompanhar), get away with (escapar impune), look down on (desprezar), cut down on (reduzir), face up to (encarar), go along with (concordar com)</i>.</p>
<h4>Mais 30 de alto uso</h4>
<p><i>bring up</i> (criar filhos; mencionar), <i>turn out</i> (acabar sendo: It turned out to be true), <i>end up</i> (acabar: We ended up staying), <i>take up</i> (começar hobby; ocupar espaço), <i>give in</i> (ceder), <i>hold on</i> (aguardar), <i>pass away</i> (falecer), <i>break up</i> (terminar relacionamento), <i>make up</i> (inventar; fazer as pazes), <i>look into</i> (investigar), <i>come across</i> (encontrar por acaso; parecer), <i>get over</i> (superar), <i>turn down</i> (recusar), <i>set up</i> (fundar, montar), <i>carry out</i> (realizar), <i>deal with</i> (lidar com), <i>rely on</i> (depender, confiar), <i>count on</i> (contar com), <i>stand for</i> (significar), <i>stand out</i> (destacar-se), <i>back up</i> (apoiar; fazer backup), <i>sort out</i> (resolver), <i>fall apart</i> (desmoronar), <i>fall behind</i> (ficar para trás), <i>go through</i> (passar por dificuldade), <i>get through</i> (superar, conseguir falar), <i>pull over</i> (encostar o carro), <i>wear out</i> (desgastar), <i>show off</i> (exibir-se), <i>run into</i> (encontrar por acaso).</p>
<h4>Registro</h4>
<p>Phrasal verbs são mais informais; em textos formais há equivalentes latinos (fáceis para brasileiros): <i>find out → discover, put off → postpone, carry out → conduct, look into → investigate, come up with → devise, go up → increase</i>. Saber os dois é marca de nível B2+.</p>`,
["Partículas têm lógica: up (completar), out (até o fim), off (cancelar)","put up with = aguentar; come up with = ter ideia","turn out, end up = acabar sendo/fazendo","Formal: postpone, investigate, increase","Aprenda em frases, não em listas"],

`Escolha 25 phrasal verbs desta aula e escreva uma frase pessoal para cada. Depois reescreva 10 delas num tom formal, trocando pelo equivalente latino.`,

L("Collocations: as combinações que soam nativas",`<h4>O que são</h4>
<p>Palavras que "andam juntas" por costume. Não há lógica gramatical: nativos dizem <i>make a decision</i>, não "do a decision"; <i>heavy rain</i>, não "strong rain". Errar collocations é o que mais denuncia um estrangeiro de nível intermediário.</p>
<h4>Make × do</h4>
<table><tr><th>make (criar, produzir)</th><th>Do (tarefas, atividades)</th></tr>
<tr><td>make a decision, a mistake, a plan, an effort, progress, money, a phone call, a complaint, an appointment, friends, noise, sense, a difference, an excuse, a suggestion</td><td>do homework, the dishes, the shopping, business, your best, a favor, damage, research, exercise, a course, harm, the laundry, a job</td></tr></table>
<h4>Have, take, get</h4>
<p><i>have a break, a look, a chat, a good time, an idea, a problem, a word with</i>; <i>take a photo, a seat, a risk, a decision (UK), a break, notes, part in, advantage of, care of, place</i> (acontecer); <i>get ready, lost, married, angry, better, a job, the chance</i>.</p>
<h4>Adjetivo + substantivo</h4>
<p><i>heavy rain/traffic, strong coffee/wind, high price/temperature, deep sleep, close friend, bitter disappointment, serious problem, slight change, vast majority, wide range, fast food, quick shower, bright future</i>.</p>
<h4>Advérbio + adjetivo</h4>
<p><i>highly recommended, deeply disappointed, fully aware, completely different, totally agree, utterly ridiculous, bitterly cold, painfully slow, perfectly normal, widely known</i>.</p>
<h4>Verbo + substantivo</h4>
<p><i>pay attention, keep a promise, break a promise/rule/record, save time, waste time, spend time, tell the truth, tell a lie, raise a question, meet a deadline, reach an agreement, run a business, catch a cold, set a goal, face a problem</i>.</p>
<h4>Como aprender</h4>
<ul><li>Ao ler, anote blocos de 2-3 palavras, não palavras soltas.</li>
<li>Use dicionários de collocations: Ozdic (online, grátis), Oxford Collocations Dictionary.</li>
<li>Pergunte a uma IA: "Quais verbos combinam com 'decision'?"</li></ul>`,
["make a decision/mistake; do homework/a favor","take place = acontecer; take part in = participar","heavy rain, strong coffee, close friend","highly recommended, fully aware, bitterly cold","Anote blocos de palavras, não palavras soltas"],
