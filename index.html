L("Certificações: Cambridge C2, IELTS, TOEFL e outras",`<h4>Os principais exames</h4>
<table><tr><th>Exame</th><th>Formato</th><th>Validade</th><th>Para quê</th></tr>
<tr><td>Cambridge C2 Proficiency (CPE)</td><td>Reading & Use of English, Writing, Listening, Speaking</td><td>Não expira</td><td>Prova de domínio máximo; reconhecido mundialmente</td></tr>
<tr><td>Cambridge C1 Advanced (CAE)</td><td>Mesmo formato, nível C1</td><td>Não expira</td><td>Universidades e empregadores</td></tr>
<tr><td>IELTS Academic / General</td><td>4 habilidades, nota de 0 a 9</td><td>2 anos (na prática)</td><td>Imigração e universidades (Reino Unido, Canadá, Austrália)</td></tr>
<tr><td>TOEFL iBT</td><td>4 habilidades, nota de 0 a 120</td><td>2 anos</td><td>Universidades, especialmente EUA</td></tr>
<tr><td>Duolingo English Test</td><td>Online, adaptativo, ~1h</td><td>2 anos</td><td>Muitas universidades aceitam; barato</td></tr>
<tr><td>TOEIC</td><td>Foco em inglês do mundo do trabalho</td><td>2 anos</td><td>Empresas</td></tr>
<tr><td>EF SET</td><td>Online e gratuito</td><td>—</td><td>Medir progresso</td></tr></table>
<p>Preços, formatos e validades mudam: confira sempre no site oficial antes de se inscrever.</p>
<h4>Equivalência aproximada com o CEFR</h4>
<table><tr><th>CEFR</th><th>IELTS</th><th>TOEFL iBT</th></tr>
<tr><td>B2</td><td>5.5–6.5</td><td>72–94</td></tr>
<tr><td>C1</td><td>7.0–8.0</td><td>95–113</td></tr>
<tr><td>C2</td><td>8.5–9.0</td><td>114–120</td></tr></table>
<h4>O que o C2 Proficiency exige</h4>
<ul><li><b>Reading & Use of English</b>: textos literários e acadêmicos; questões de word formation, key word transformation (reescrever frases com uma palavra dada) e lacunas.</li>
<li><b>Writing</b>: um ensaio que resume e avalia dois textos + um texto à escolha (artigo, carta, relatório, resenha).</li>
<li><b>Listening</b>: palestras, entrevistas, conversas com sotaques variados.</li>
<li><b>Speaking</b>: em dupla, com discussão longa e um monólogo de 2 minutos.</li></ul>
<h4>Estratégia de preparação (6 meses)</h4>
<ol><li>Faça um simulado oficial para diagnóstico.</li>
<li>Estude o formato de cada parte: saber o tipo de questão vale pontos.</li>
<li>Treine a parte mais fraca 3x por semana.</li>
<li>Simulados completos cronometrados a cada 3-4 semanas.</li>
<li>Para Writing e Speaking, peça avaliação com base nos critérios oficiais (publicados pela própria Cambridge e pelo IELTS).</li></ol>
<h4>Escolhendo</h4>
<p>Quer um certificado vitalício de domínio? Cambridge C2. Quer imigrar ou estudar fora? IELTS ou TOEFL, conforme o país. Só quer medir? EF SET a cada 6 meses.</p>`,
["Cambridge C2 Proficiency não expira","IELTS/TOEFL: 2 anos, foco em estudo e imigração","C2 ≈ IELTS 8.5+ ≈ TOEFL 114+","Conheça o formato: cada tipo de questão tem técnica","Confira preços e regras no site oficial"],
`Plano: EF SET agora para diagnóstico → 6 meses de preparação com materiais oficiais Cambridge → simulado completo a cada 4 semanas → prova C2 Proficiency no fim do curso.`,
`Faça o EF SET completo (gratuito) e anote sua pontuação. Baixe as amostras oficiais do C2 Proficiency no site da Cambridge e resolva uma parte de cada habilidade, cronometrando.`,
[["Qual certificado não expira?",["IELTS","TOEFL","Cambridge C2 Proficiency","Duolingo English Test"],2,"Os exames Cambridge de nível não expiram."],["IELTS aproximado do C2:",["5.0","6.5","8.5–9.0","4.0"],2,"C2 corresponde ao topo da escala."],["Para medir progresso de graça:",["EF SET","TOEFL","CPE","IELTS"],0,"EF SET é gratuito e online."]]),
L("Plano de manutenção: inglês para a vida toda",`<h4>Por que manter</h4>
<p>Idiomas se perdem sem uso, especialmente a fala e o vocabulário ativo. A boa notícia: depois do C1/C2, manter exige muito menos tempo do que aprender. O segredo é integrar o inglês à vida, não tratá-lo como matéria.</p>
<h4>A dieta de inglês</h4>
<table><tr><th>Frequência</th><th>Atividade</th><th>Tempo</th></tr>
<tr><td>Diária</td><td>Podcast ou vídeo + leitura de notícia ou artigo</td><td>20–30 min</td></tr>
<tr><td>Diária</td><td>Celular, redes e buscas em inglês</td><td>Automático</td></tr>
<tr><td>Semanal</td><td>Uma conversa real (aula, exchange, clube) ou IA de voz</td><td>30–60 min</td></tr>
<tr><td>Semanal</td><td>Escrever algo: e-mail, post, diário, resenha</td><td>20 min</td></tr>
<tr><td>Mensal</td><td>Um livro e alguns filmes ou séries sem legenda</td><td>—</td></tr>
<tr><td>Anual</td><td>Um teste (EF SET) e uma meta nova</td><td>—</td></tr></table>
<h4>Metas que mantêm o interesse</h4>
<ul><li>Aprender algo novo <b>em</b> inglês: um curso online, uma habilidade, um hobby.</li>
<li>Ler um clássico por trimestre.</li>
<li>Viajar ou participar de eventos internacionais online.</li>
<li>Começar um terceiro idioma usando materiais em inglês (o cérebro mantém os dois).</li>
<li>Ensinar: explicar inglês para alguém consolida o seu.</li></ul>
<h4>Revisão inteligente</h4>
<p>Mantenha o Anki só para palavras e expressões de alto valor (que você leu ou ouviu e quer usar). Limite: 10 minutos por dia. Faça uma "Limpeza" a cada 6 meses, suspendendo cartões que já viraram automáticos.</p>
<h4>Sinais de alerta</h4>
<p>Se você notar que demora para achar palavras, que evita conversas ou que voltou a pensar em português antes de falar, aumente a dose de fala por 1 mês. É rápido recuperar.</p>
<h4>O que você conquistou</h4>
<p>Ao terminar este curso você terá estudado a gramática completa do A1 ao C2, milhares de palavras e expressões, pronúncia, escrita formal e informal, apresentação, debate, literatura e cultura. O inglês deixa de ser um objetivo e passa a ser uma ferramenta para tudo que você quiser fazer.</p>`,
["Depois do C2, manter exige pouco tempo, mas todo dia","Dieta: diária, semanal, mensal e anual","Aprenda algo novo em inglês","Anki só para o essencial, 10 min/dia","Sinal de alerta → 1 mês de dose extra de fala"],
`Plano pessoal: <i>"Every day: BBC podcast on the way home and phone in English. Every Tuesday: 30-minute conversation online. Every month: one book. Every December: EF SET and a new goal."</i>`,
`Escreva em inglês seu plano de manutenção para os próximos 5 anos, com atividades diárias, semanais, mensais e anuais e 3 metas grandes. Salve e releia todo ano.`,
[["Depois do C2, o mais importante é:",["Parar de estudar","Manter contato diário com a língua","Decorar listas","Só fazer provas"],1,"Uso regular mantém o nível."],["Sinal de que precisa de mais prática de fala:",["Entender tudo nos filmes","Demorar para achar palavras e evitar conversas","Ler rápido","Escrever bem"],1,"Fala é a primeira a enfraquecer."],["Boa meta de manutenção:",["Aprender algo novo em inglês","Nunca mais ler em inglês","Usar só tradutor","Evitar conversas"],0,"Usar a língua como ferramenta mantém o domínio."]]),
L("Prova final: simulado completo do curso",`<h4>Como fazer esta prova</h4>
<p>Esta é a última aula do curso e funciona como um exame final no estilo C2. Reserve cerca de 4 horas, em um ou dois dias, sem consultar materiais. Cronometre cada parte.</p>
<h4>Parte 1 · Reading e Use of English (90 min)</h4>
<ul><li>Leia um artigo longo de opinião (The Guardian, The Atlantic ou The Economist) e responda: qual a tese, quais os 3 argumentos principais, qual a atitude do autor e como você sabe.</li>
<li>Reescreva 10 frases usando a palavra dada sem mudar o sentido (estilo key word transformation). Exemplo: <i>"I regret not studying harder." (WISH) → I wish I had studied harder.</i></li>
<li>Forme 10 palavras derivadas (word formation): <i>analyze → ____ (substantivo)</i>.</li></ul>
<h4>Parte 2 · Writing (90 min)</h4>
<ul><li>Ensaio de 300 palavras: "Artificial intelligence will make learning languages unnecessary. Discuss."</li>
<li>Um texto à escolha (resenha, artigo ou carta formal) de 280 palavras.</li></ul>
<h4>Parte 3 · Listening (40 min)</h4>
<ul><li>Ouça uma palestra TED de 15 minutos sem legenda e escreva um resumo de 150 palavras.</li>
<li>Ouça um trecho de entrevista com sotaque britânico ou australiano e anote 10 detalhes específicos.</li></ul>
<h4>Parte 4 · Speaking (20 min, gravado)</h4>
<ul><li>Monólogo de 2 minutos sobre um tema sorteado.</li>
<li>Discussão de 5 minutos com uma IA de voz ou parceiro sobre um dilema ético.</li>
<li>Conte uma história pessoal engraçada em 3 minutos.</li></ul>
<h4>Critérios de autoavaliação (como nos exames)</h4>
<table><tr><th>Critério</th><th>O que observar</th></tr>
<tr><td>Content / Task achievement</td><td>Respondeu exatamente o que foi pedido?</td></tr>
<tr><td>Organization / Coherence</td><td>Estrutura clara, parágrafos, conectores</td></tr>
<tr><td>Language / Lexical resource</td><td>Vocabulário preciso, collocations, idioms adequados</td></tr>
<tr><td>Grammatical range and accuracy</td><td>Estruturas variadas com poucos erros</td></tr>
<tr><td>Fluency and pronunciation</td><td>Fala contínua, ritmo, entonação</td></tr></table>
<p>Dê uma nota de 1 a 5 em cada critério e peça avaliação a um professor ou a uma IA. Notas 4 e 5 em todos indicam nível C2. Depois, faça a prova oficial escolhida.</p>
<h4>Parabéns</h4>
<p>Você percorreu o caminho completo, do alfabeto ao domínio. A partir daqui, o inglês é seu.</p>`,
["4 partes: Reading/Use, Writing, Listening, Speaking","Cronometre e não consulte materiais","Avalie por critérios oficiais","Notas 4-5 em todos os critérios = nível C2","Próximo passo: prova oficial"],

MOD("aud","Fundamentos da auditoria e do auditor líder","Entender sistemas de gestão integrados, a ISO 19011, os tipos de auditoria, a certificação e o que se espera de um auditor líder.",[
L("Sistemas de gestão, SGI e a Estrutura Harmonizada",`<h4>O que é um sistema de gestão</h4>
<p>Sistema de gestão é o conjunto de elementos inter-relacionados de uma organização (estrutura, papéis, políticas, objetivos, processos e recursos) para estabelecer políticas e objetivos e alcançá-los. Cada norma ISO de sistema de gestão (MSS, <i>management system standard</i>) trata de uma disciplina:</p>
<table><tr><th>Norma</th><th>Disciplina</th><th>Foco de quem é atendido</th></tr>
<tr><td>ISO 9001</td><td>Qualidade</td><td>Clientes e partes interessadas pertinentes</td></tr>
<tr><td>ISO 14001</td><td>Meio ambiente</td><td>Meio ambiente, comunidade, legislação</td></tr>
<tr><td>ISO 45001</td><td>Saúde e segurança ocupacional (SSO)</td><td>Trabalhadores e outras pessoas no local de trabalho</td></tr>
<tr><td>ISO/IEC 27001</td><td>Segurança da informação</td><td>Dados e partes interessadas</td></tr>
<tr><td>ISO 50001</td><td>Energia</td><td>Desempenho energético</td></tr></table>
<h4>Estrutura Harmonizada (HS)</h4>
<p>Desde 2012 as normas de sistema de gestão seguem uma estrutura comum, antes chamada de Anexo SL / HLS e, desde 2021, de <b>Estrutura Harmonizada</b> (Apêndice 2 do Anexo SL das Diretivas ISO/IEC). Todas têm as mesmas cláusulas, textos-núcleo e termos:</p>
<table><tr><th>Cláusula</th><th>Tema</th><th>Pergunta-chave para o auditor</th></tr>
<tr><td>4</td><td>Contexto da organização</td><td>A organização entende onde está, quem importa e o que o sistema abrange?</td></tr>
<tr><td>5</td><td>Liderança</td><td>A alta direção assume o sistema e define política e papéis?</td></tr>
<tr><td>6</td><td>Planejamento</td><td>Riscos, oportunidades e objetivos estão planejados?</td></tr>
<tr><td>7</td><td>Apoio</td><td>Há recursos, competência, conscientização, comunicação e documentação?</td></tr>
<tr><td>8</td><td>Operação</td><td>Os processos são controlados como planejado?</td></tr>
<tr><td>9</td><td>Avaliação de desempenho</td><td>Há monitoramento, auditoria interna e análise crítica?</td></tr>
<tr><td>10</td><td>Melhoria</td><td>Não conformidades são tratadas e o sistema melhora?</td></tr></table>
<p>As cláusulas 1 a 3 (escopo, referências normativas, termos e definições) não contêm requisitos auditáveis.</p>
<h4>A emenda de mudança climática (2024)</h4>
<p>Em fevereiro de 2024 a ISO publicou emendas em mais de 30 normas de sistema de gestão, incluindo ISO 9001, 14001 e 45001. Na cláusula 4.1 a organização deve determinar se a <b>mudança climática é uma questão relevante</b>, e uma nota em 4.2 lembra que partes interessadas podem ter requisitos relacionados ao clima. O auditor deve verificar se essa avaliação foi feita e se a conclusão é coerente com o negócio.</p>
<h4>Revisões em andamento</h4>
<p>A ISO 9001 e a ISO 14001 passam por revisão com novas edições previstas para 2026, mantendo a Estrutura Harmonizada. Após cada publicação há normalmente um período de transição de três anos para organizações certificadas. Um auditor líder acompanha essas mudanças pelo site da ISO, da ABNT e do organismo acreditador.</p>
<h4>SGI: Sistema de Gestão Integrado</h4>
<p>Graças à estrutura comum, uma organização pode ter <b>um único sistema</b> com política integrada, um programa de auditoria, uma análise crítica e procedimentos comuns (controle de documentos, competência, não conformidade, auditoria interna). Os requisitos específicos de cada disciplina continuam existindo: aspectos ambientais (14001, 6.1.2), perigos e participação dos trabalhadores (45001, 6.1.2 e 5.4), requisitos de produtos e serviços (9001, 8.2).</p>`,
["Estrutura Harmonizada: cláusulas 4 a 10 comuns","Cláusulas 1–3 não têm requisitos auditáveis","Emenda 2024: avaliar se mudança climática é relevante (4.1)","SGI = um sistema que atende várias normas","Requisitos específicos de cada norma continuam valendo"],
`Numa fábrica de móveis com SGI, uma única auditoria pode verificar na mesma entrevista com o gerente de produção: o controle de qualidade das peças (9001, 8.5), o descarte de resíduos de verniz (14001, 8.1) e o uso de protetores auriculares na serra (45001, 8.1.2).`,
`Monte uma matriz com as cláusulas 4 a 10 nas linhas e as três normas nas colunas. Em cada célula escreva o requisito específico de cada norma (por exemplo, 6.1.2: riscos e oportunidades / aspectos ambientais / perigos). Esta matriz será sua ferramenta de estudo durante todo o curso.`,
[["Qual cláusula da Estrutura Harmonizada trata de liderança?",["4","5","7","9"],1,"Cláusula 5: liderança, política e papéis."],["A emenda de 2024 incluiu em 4.1 a avaliação de:",["Custos de energia","Mudança climática como questão relevante","Satisfação do cliente","Número de funcionários"],1,"Emenda climática publicada em fevereiro de 2024."],["As cláusulas 1, 2 e 3 de uma MSS:",["São as mais auditadas","Não contêm requisitos auditáveis","Tratam da operação","Só existem na ISO 45001"],1,"Escopo, referências e definições."]]),
L("ISO 19011: princípios, termos e tipos de auditoria",`<h4>O que é a ISO 19011</h4>
<p>A ISO 19011:2018 (<i>Diretrizes para auditoria de sistemas de gestão</i>) é a principal referência de quem audita. Não é certificável: traz diretrizes (usa "convém", não "deve") sobre princípios, gestão do programa de auditoria, condução de auditorias e competência de auditores. Aplica-se a auditorias internas e de segunda parte; auditorias de certificação seguem também a ISO/IEC 17021-1.</p>
<h4>Os 7 princípios de auditoria</h4>
<ol><li><b>Integridade</b>: honestidade, imparcialidade, responsabilidade e competência; é a base do profissionalismo.</li>
<li><b>Apresentação justa</b>: relatar com veracidade e exatidão, incluindo obstáculos e opiniões divergentes não resolvidas.</li>
<li><b>Devido cuidado profissional</b>: diligência e julgamento proporcionais à importância da tarefa.</li>
<li><b>Confidencialidade</b>: segurança da informação obtida.</li>
<li><b>Independência</b>: base para imparcialidade e objetividade; auditor não audita o próprio trabalho.</li>
<li><b>Abordagem baseada em evidência</b>: conclusões confiáveis e reproduzíveis com base em amostragem adequada.</li>
<li><b>Abordagem baseada em risco</b>: considerar riscos e oportunidades no planejamento, na condução e no relato.</li></ol>
<h4>Termos que o auditor precisa dominar</h4>
<table><tr><th>Termo</th><th>Definição simplificada</th></tr>
<tr><td>Auditoria</td><td>Processo sistemático, independente e documentado para obter evidência objetiva e avaliá-la para determinar a extensão em que os critérios são atendidos</td></tr>
<tr><td>Critérios de auditoria</td><td>Referências usadas para comparar a evidência: normas, requisitos legais, procedimentos, contratos</td></tr>
<tr><td>Evidência de auditoria</td><td>Registros, declarações de fato ou outras informações verificáveis pertinentes aos critérios</td></tr>
<tr><td>Constatações</td><td>Resultado da avaliação da evidência contra os critérios: conformidade, não conformidade ou oportunidade de melhoria</td></tr>
<tr><td>Conclusão</td><td>Resultado da auditoria, considerando objetivos e todas as constatações</td></tr>
<tr><td>Escopo</td><td>Extensão e limites: locais, unidades, atividades, processos, período</td></tr>
<tr><td>Programa de auditoria</td><td>Conjunto de auditorias planejadas para um período e um propósito</td></tr>
<tr><td>Plano de auditoria</td><td>Descrição das atividades de uma auditoria específica</td></tr>
<tr><td>Auditado</td><td>Organização, como um todo ou em partes, que está sendo auditada</td></tr>
<tr><td>Especialista técnico</td><td>Quem fornece conhecimento técnico à equipe, sem atuar como auditor</td></tr></table>
<h4>Tipos de auditoria</h4>
<table><tr><th>Tipo</th><th>Quem audita</th><th>Exemplo</th></tr>
<tr><td>1ª parte (interna)</td><td>A própria organização</td><td>Auditoria interna anual do SGI</td></tr>
<tr><td>2ª parte (externa)</td><td>Cliente ou alguém em nome dele</td><td>Uma montadora audita seu fornecedor de peças</td></tr>
<tr><td>3ª parte (externa)</td><td>Organismo independente</td><td>Auditoria de certificação; auditoria regulatória</td></tr></table>
<p>Também há auditorias <b>combinadas</b> (duas ou mais disciplinas ao mesmo tempo, como num SGI) e <b>conjuntas</b> (duas ou mais organizações auditoras auditando um mesmo auditado).</p>
<h4>Auditoria remota</h4>
<p>A ISO 19011:2018 reconhece métodos remotos (videochamada, compartilhamento de tela, análise de documentos à distância). Riscos: conexão, autenticidade das evidências e confidencialidade. O auditor deve confirmar que o método permite atingir o objetivo.</p>`,
["ISO 19011 dá diretrizes (convém), não é certificável","7 princípios: integridade, apresentação justa, cuidado, confidencialidade, independência, evidência, risco","Critério × evidência × constatação × conclusão","1ª, 2ª e 3ª parte","Combinada (várias normas) × conjunta (várias organizações auditoras)"],
`Uma rede de restaurantes contrata uma consultoria para auditar seus fornecedores de carne quanto a requisitos de higiene do contrato. É uma auditoria de 2ª parte; os critérios são o contrato e a legislação sanitária; a evidência são registros de temperatura, entrevistas e observação da câmara fria.`,
`Escreva com suas palavras os 7 princípios e, para cada um, uma situação real em que um auditor poderia violá-lo (por exemplo, independência: auditar o setor onde trabalha). Depois classifique 6 auditorias inventadas em 1ª, 2ª ou 3ª parte, combinada ou conjunta.`,
[["Quantos princípios de auditoria a ISO 19011:2018 apresenta?",["5","6","7","10"],2,"Integridade, apresentação justa, devido cuidado, confidencialidade, independência, evidência e risco."],["Uma empresa auditando seu fornecedor é auditoria de:",["1ª parte","2ª parte","3ª parte","Certificação"],1,"Cliente auditando fornecedor = 2ª parte."],["O resultado da avaliação da evidência contra os critérios é chamado de:",["Conclusão","Constatação","Escopo","Programa"],1,"Constatação (finding)."]]),
L("Programa de auditoria, certificação e o papel do auditor líder",`<h4>Gestão do programa de auditoria (ISO 19011, cláusula 5)</h4>
<p>O programa é gerido em ciclo PDCA:</p>
<ol><li><b>Estabelecer objetivos</b> do programa (ex.: verificar conformidade com as três normas, preparar para certificação, avaliar fornecedores críticos).</li>
<li><b>Determinar e avaliar riscos e oportunidades</b> do programa: falta de auditores competentes, prazos curtos, áreas de alto risco pouco auditadas.</li>
<li><b>Estabelecer o programa</b>: extensão, frequência, métodos, recursos, responsabilidades, critérios de seleção de equipe.</li>
<li><b>Implementar</b>: definir objetivos, escopo e critérios de cada auditoria, selecionar métodos e equipe, designar líderes.</li>
<li><b>Monitorar</b> e <b>analisar criticamente e melhorar</b> o programa.</li></ol>
<p>A frequência deve considerar importância dos processos, resultados de auditorias anteriores, mudanças, reclamações, incidentes e riscos. Processos críticos (como trabalho em altura ou armazenamento de produtos químicos) merecem mais atenção.</p>
<h4>Certificação de terceira parte</h4>
<table><tr><th>Etapa</th><th>O que acontece</th></tr>
<tr><td>Contrato e definição do escopo</td><td>Organismo certificador (OC) calcula duração com base em funcionários, complexidade e riscos</td></tr>
<tr><td>Auditoria de estágio 1</td><td>Avalia documentação, entendimento dos requisitos, prontidão, escopo, aspectos/perigos significativos, requisitos legais; planeja o estágio 2</td></tr>
<tr><td>Auditoria de estágio 2</td><td>Avalia implementação e eficácia do sistema nos processos, em campo</td></tr>
<tr><td>Decisão de certificação</td><td>Tomada pelo OC (não pelo auditor) após tratamento das não conformidades</td></tr>
<tr><td>Auditorias de manutenção (supervisão)</td><td>Pelo menos anuais</td></tr>
<tr><td>Recertificação</td><td>Antes do fim do ciclo de 3 anos</td></tr></table>
<p>Os OCs seguem a <b>ISO/IEC 17021-1</b> e são acreditados por organismos de acreditação: no Brasil, a <b>Cgcre/Inmetro</b>; internacionalmente, membros do <b>IAF</b>. Certificado de OC sem acreditação tem menor reconhecimento.</p>
<h4>Competência do auditor (ISO 19011, cláusula 7)</h4>
<ul><li><b>Comportamento pessoal</b>: ético, mente aberta, diplomático, observador, perceptivo, versátil, tenaz, decidido, autoconfiante, aberto a melhoria, culturalmente sensível, colaborativo.</li>
<li><b>Conhecimentos genéricos</b>: princípios, métodos e técnicas de auditoria, normas e documentos de referência, contexto organizacional, requisitos legais.</li>
<li><b>Conhecimentos específicos da disciplina</b>: qualidade, meio ambiente, SSO.</li>
<li><b>Para o líder</b>: planejar, usar recursos da equipe, liderar, comunicar, resolver conflitos, prevenir e resolver problemas.</li></ul>
<h4>O auditor líder</h4>
<p>Responsável pela auditoria do início ao fim: contato inicial com o auditado, viabilidade, plano, distribuição de tarefas, reuniões de abertura e encerramento, decisões sobre evidências e constatações, relatório e conclusão. Responde pelo cumprimento dos objetivos e pela conduta da equipe.</p>
<h4>Formação e registro</h4>
<p>O caminho reconhecido internacionalmente é o curso de <b>auditor líder</b> de cada norma (tipicamente 40 horas, com prova final), aprovado por esquemas como o <b>CQI/IRCA</b> ou a <b>Exemplar Global</b>. Também existe o curso de <b>auditor líder de SGI</b> combinado. Para atuar em OC é preciso ainda experiência em auditorias acompanhadas e a qualificação interna do organismo. Verifique sempre se o curso é aprovado pelo esquema escolhido.</p>`,

MOD("aud","Técnicas de auditoria: do plano ao relatório","Planejar, conduzir, registrar constatações, classificar não conformidades e relatar auditorias como auditor líder.",[
L("Preparação: viabilidade, análise documental, plano e listas",`<h4>Iniciando a auditoria (ISO 19011, 6.2)</h4>
<ul><li><b>Contato inicial</b> com o auditado: confirmar comunicação, autoridade, acesso a informações, requisitos de segurança e confidencialidade, idioma, áreas restritas.</li>
<li><b>Determinar a viabilidade</b>: há informação suficiente, cooperação do auditado, tempo e recursos? Se não, propor alternativa ao responsável pelo programa.</li></ul>
<h4>Análise da informação documentada</h4>
<p>Antes de ir a campo, o líder revisa: escopo, política, objetivos, mapa de processos, levantamento de aspectos e perigos, requisitos legais, relatórios anteriores, indicadores, reclamações e incidentes. O objetivo é entender o sistema e identificar áreas de risco, não fazer uma "auditoria de papel".</p>
<h4>Plano de auditoria</h4>
<table><tr><th>Elemento</th><th>Conteúdo</th></tr>
<tr><td>Objetivos</td><td>Ex.: verificar conformidade com ISO 9001, 14001 e 45001 e eficácia do SGI</td></tr>
<tr><td>Escopo</td><td>Unidades, processos, turnos, período</td></tr>
<tr><td>Critérios</td><td>Normas, requisitos legais, procedimentos internos</td></tr>
<tr><td>Data, local, horários</td><td>Incluindo reuniões de abertura e encerramento</td></tr>
<tr><td>Equipe e funções</td><td>Líder, auditores, especialistas, observadores, guias</td></tr>
<tr><td>Métodos</td><td>Presencial, remoto, amostragem</td></tr>
<tr><td>Atividades por horário</td><td>Processo, cláusulas e responsável a entrevistar</td></tr>
<tr><td>Logística e segurança</td><td>EPIs exigidos, regras de acesso, confidencialidade</td></tr></table>
<p>O plano é enviado antes e pode ser ajustado em comum acordo. Planeje por <b>processo</b>, não por cláusula: num SGI, ao auditar "Compras" você cobre 9001 (8.4), 14001 (8.1, critérios ambientais na compra) e 45001 (8.1.4, aquisição e contratados) ao mesmo tempo.</p>
<h4>Distribuição de tarefas e documentos de trabalho</h4>
<p>O líder distribui processos conforme a competência de cada auditor. Documentos de trabalho: listas de verificação, planos de amostragem, formulários de registro de evidências e de constatações.</p>
<h4>Listas de verificação (checklists)</h4>
<ul><li>Vantagens: cobertura, organização, registro.</li>
<li>Riscos: virar questionário de sim/não, engessar a auditoria, perguntar tudo como "Vocês têm...?".</li>
<li>Boas listas trazem <b>perguntas abertas</b>, o <b>que observar</b> e <b>quais registros amostrar</b>.</li></ul>
<table><tr><th>Ruim</th><th>Boa</th></tr>
<tr><td>Existe procedimento de compras? (sim/não)</td><td>Como vocês selecionam e avaliam fornecedores? Mostre os critérios e a avaliação dos 3 fornecedores mais críticos do último semestre.</td></tr>
<tr><td>Os riscos foram identificados?</td><td>Quais são os riscos mais importantes deste processo? Como chegaram a eles? O que mudou desde a última análise?</td></tr></table>
<h4>Quanto tempo auditar</h4>
<p>Em certificação, a duração segue documentos obrigatórios do IAF (como o IAF MD 5 para qualidade, meio ambiente e SSO), conforme número de pessoas e complexidade/risco. Em auditorias internas, o programa define com base em risco e importância dos processos.</p>`,
["Contato inicial e viabilidade antes de tudo","Análise documental para entender riscos, não auditar papel","Plano: objetivos, escopo, critérios, equipe, horários","Planeje por processo e cubra as três normas juntas","Checklist com perguntas abertas e registros a amostrar"],
`Plano integrado de uma escola técnica: 08h30 abertura; 09h00 direção (cláusulas 4, 5, 6, 9.3 das três normas); 10h30 laboratórios de química (14001 8.1/8.2; 45001 6.1.2/8.1.2; 9001 7.1.5 equipamentos de medição); 13h30 compras e manutenção; 15h30 RH (competência e saúde ocupacional); 17h encerramento.`,

[["Planejar a auditoria integrada por processo significa:",["Auditar a ISO 9001 inteira, depois a 14001","Cobrir as três normas ao auditar cada processo","Pular a ISO 45001","Fazer só análise documental"],1,"Por processo, aproveitando requisitos comuns."],["Uma boa pergunta de checklist é:",["Existe procedimento? Sim ou não?","Como vocês avaliam fornecedores? Mostre os critérios e as avaliações do semestre.","Vocês cumprem a norma?","Está tudo certo?"],1,"Perguntas abertas com evidências a solicitar."],["A análise documental prévia serve principalmente para:",["Substituir a ida a campo","Entender o sistema e identificar áreas de risco","Emitir o certificado","Punir os responsáveis"],1,"Preparar a auditoria de campo."]]),
L("Condução: reunião de abertura, entrevistas, amostragem e evidências",`<h4>Reunião de abertura</h4>
<p>Curta (15-30 min), conduzida pelo líder. Conteúdo: apresentação da equipe; confirmação de objetivos, escopo, critérios e plano; métodos (amostragem implica risco de não ver tudo); canais de comunicação; idioma; confidencialidade; segurança e emergência; como as constatações serão classificadas; condições para encerrar a auditoria antecipadamente; como apelar ou reclamar; perguntas.</p>
<h4>Métodos de coleta de evidências</h4>
<table><tr><th>Método</th><th>Exemplos</th></tr>
<tr><td>Entrevista</td><td>Gestor, operador, terceirizado, membro da CIPA</td></tr>
<tr><td>Observação</td><td>Execução de uma tarefa, uso de EPI, armazenamento de produtos</td></tr>
<tr><td>Análise de documentos e registros</td><td>Procedimentos, ordens de serviço, laudos, licenças, treinamentos</td></tr>
<tr><td>Rastreamento (trilha)</td><td>Seguir um pedido do recebimento à entrega; um resíduo da geração à destinação final</td></tr>
<tr><td>Verificação</td><td>Conferir um cálculo, testar um alarme, checar a calibração de uma balança</td></tr></table>
<h4>Técnicas de entrevista</h4>
<ul><li>Entreviste quem executa, no local de trabalho, e no horário normal.</li>
<li>Explique o motivo e deixe a pessoa à vontade.</li>
<li>Use perguntas abertas: <i>Como...? O que...? Mostre-me... Por que...? O que acontece se...?</i></li>
<li>Use perguntas fechadas só para confirmar: <i>Então o registro é feito ao fim do turno, correto?</i></li>
<li>Ouça mais do que fala; silêncio estimula detalhes.</li>
<li>Evite perguntas indutoras ("Vocês usam o EPI sempre, né?") e jargão da norma.</li>
<li>Agradeça e resuma o que entendeu.</li></ul>
<h4>Amostragem</h4>
<p>Auditar é amostrar. A ISO 19011 (anexo A.6) descreve amostragem por <b>julgamento</b> (baseada em conhecimento e risco: escolher os casos mais críticos) e <b>estatística</b> (aleatória, com nível de confiança). Na prática, combine: escolha por risco e complete com aleatórios. Registre o tamanho e o critério da amostra.</p>
<h4>Verificando evidências</h4>
<p>Evidência precisa ser <b>objetiva e verificável</b>. Declarações orais devem ser confirmadas, quando possível, por registro ou observação (triangulação). Registre referências exatas: número do documento, data, nome da função entrevistada (não necessariamente o nome da pessoa), local.</p>
<h4>Gestão da auditoria em andamento</h4>
<ul><li>Reuniões rápidas da equipe para trocar informações e ajustar o plano.</li>
<li>Comunicar ao auditado, durante a auditoria, riscos imediatos (ex.: um extintor obstruído, um vazamento) e constatações relevantes.</li>
<li>Se a evidência indicar que os objetivos são inatingíveis, o líder reporta ao cliente da auditoria e ao auditado.</li>
<li>Guias acompanham a equipe, mas não interferem; observadores não participam.</li></ul>`,
["Abertura: confirmar plano, métodos, confidencialidade e segurança","Entrevista + observação + registros + rastreamento","Perguntas abertas; fechadas só para confirmar","Amostragem por julgamento e estatística (ISO 19011 A.6)","Triangule declarações com registros ou observação"],

L("Constatações e não conformidades: classificar e redigir",`<h4>Tipos de constatação</h4>
<table><tr><th>Tipo</th><th>Quando</th></tr>
<tr><td>Conformidade</td><td>Evidência demonstra atendimento ao critério; também deve ser registrada</td></tr>
<tr><td>Não conformidade (NC)</td><td>Não atendimento a um requisito, com evidência objetiva</td></tr>
<tr><td>Oportunidade de melhoria (OM)</td><td>Requisito atendido, mas há forma melhor ou risco futuro</td></tr>
<tr><td>Observação</td><td>Termo usado por alguns OCs para situação que pode virar NC</td></tr></table>
<h4>NC maior × NC menor (uso comum em certificação)</h4>
<ul><li><b>Maior</b>: afeta a capacidade do sistema de atingir resultados pretendidos; ausência total ou colapso de um requisito; dúvida significativa sobre o controle de processos ou produtos; descumprimento legal grave ou risco grave à vida ou ao meio ambiente; várias menores no mesmo requisito indicando falha sistêmica.</li>
<li><b>Menor</b>: falha pontual que não compromete a capacidade do sistema.</li></ul>
<p>A classificação exata segue as regras do esquema e do OC; em auditorias internas a organização define a sua.</p>
<h4>As três partes de uma boa NC</h4>
<ol><li><b>Requisito</b>: qual critério (norma e cláusula, lei, procedimento interno) e o que ele exige.</li>
<li><b>Evidência</b>: o que foi visto, objetivamente, com referências rastreáveis.</li>
<li><b>Declaração da não conformidade</b>: por que a evidência não atende ao requisito.</li></ol>
<h4>Exemplos</h4>
<table><tr><th>Mal escrita</th><th>Bem escrita</th></tr>
<tr><td>"Treinamentos não estão em dia."</td><td>Requisito: ISO 45001, 7.2 b) exige que a organização assegure que os trabalhadores sejam competentes. Evidência: dos 8 operadores de caldeira do turno B amostrados, 3 não têm registro do curso exigido pela NR-13 (registros de treinamento consultados em 14/05). Declaração: não foi assegurada a competência de trabalhadores que realizam atividades com perigos significativos.</td></tr>
<tr><td>"Área de resíduos bagunçada."</td><td>Requisito: ISO 14001, 8.1 e procedimento interno PR-07 exigem resíduos perigosos segregados, identificados e em área com contenção. Evidência: 4 tambores de óleo usado sem identificação, sobre piso sem bacia de contenção, na área externa do galpão 2. Declaração: o controle operacional de resíduos perigosos não está implementado conforme planejado.</td></tr></table>
<h4>Regras de ouro</h4>
<ul><li>Fatos, não opiniões nem adjetivos ("péssimo", "descaso").</li>
<li>Não nomeie pessoas; use funções.</li>
<li>Não diga como corrigir (o auditor não é consultor na auditoria).</li>
<li>Agrupe evidências do mesmo problema em uma NC, mostrando extensão.</li>
<li>Confirme a constatação com o auditado antes da reunião de encerramento.</li></ul>
<h4>Ação do auditado</h4>
<p>Para cada NC o auditado deve: corrigir (correção imediata), analisar a causa raiz, definir ação corretiva, implementar e verificar eficácia (cláusula 10.2 das três normas). O auditor avalia a análise de causa e o plano; em NC maior, normalmente verifica a implementação antes da decisão de certificação.</p>`,
["Constatações: conformidade, NC, oportunidade de melhoria","NC maior: falha sistêmica, ausência de requisito, risco grave","Requisito + evidência + declaração","Fatos, sem nomes e sem dizer como corrigir","Auditado: correção, causa, ação corretiva, eficácia (10.2)"],

L("Encerramento, relatório, acompanhamento e liderança da equipe",`<h4>Preparando as conclusões</h4>
<p>Antes da reunião de encerramento a equipe se reúne para: revisar constatações, chegar a acordo sobre classificações, avaliar o atendimento aos objetivos, considerar a incerteza da amostragem e preparar recomendações (quando o plano prevê, como recomendar ou não a certificação).</p>
<h4>Reunião de encerramento</h4>
<ul><li>Agradecer, relembrar objetivos e escopo e lembrar que a auditoria é amostral.</li>
<li>Apresentar pontos fortes e constatações, começando pelas NCs mais importantes.</li>
<li>Explicar prazos e como enviar plano de ação.</li>
<li>Explicar consequências de NCs não tratadas (em certificação).</li>
<li>Registrar opiniões divergentes não resolvidas (princípio da apresentação justa).</li>
<li>Apresentar a conclusão ou recomendação.</li></ul>
<h4>Relatório de auditoria</h4>
<table><tr><th>Item</th><th>Conteúdo</th></tr>
<tr><td>Identificação</td><td>Auditado, datas, local, equipe, participantes</td></tr>
<tr><td>Objetivos, escopo e critérios</td><td>Incluindo áreas não auditadas e motivos</td></tr>
<tr><td>Método e amostragem</td><td>Como foi feita e suas limitações</td></tr>
<tr><td>Constatações</td><td>NCs, OMs, pontos fortes, com evidências</td></tr>
<tr><td>Conclusão</td><td>Grau de conformidade, eficácia do sistema, capacidade de atingir objetivos</td></tr>
<tr><td>Divergências</td><td>Opiniões não resolvidas</td></tr>
<tr><td>Confidencialidade e distribuição</td><td>Quem recebe</td></tr></table>
<p>Conclusões úteis respondem: o sistema é conforme? Está implementado? É eficaz para atingir os resultados pretendidos? A alta direção está envolvida? O sistema é capaz de assegurar conformidade legal?</p>
<h4>Acompanhamento (follow-up)</h4>
<p>O auditado envia correções, análise de causa e ações. O auditor avalia se a causa raiz é plausível e se a ação ataca a causa. A eficácia pode ser verificada em nova visita, por evidência documental ou na próxima auditoria.</p>
<h4>Liderando a equipe</h4>
<ul><li>Distribua tarefas pela competência e pelo risco, não por conveniência.</li>
<li>Faça briefing antes e reuniões rápidas durante a auditoria.</li>
<li>Oriente auditores em treinamento; dê feedback ao final.</li>
<li>Garanta consistência: mesmo tipo de problema, mesma classificação.</li>
<li>Administre o tempo; corte desvios.</li></ul>
<h4>Situações difíceis</h4>
<table><tr><th>Situação</th><th>Postura do líder</th></tr>
<tr><td>Auditado discute uma NC</td><td>Ouvir, rever a evidência, explicar o requisito; se persistir, registrar a divergência</td></tr>
<tr><td>Gerente atrasa ou esconde informações</td><td>Registrar, comunicar formalmente, ajustar o plano; se inviável, informar o cliente da auditoria</td></tr>
<tr><td>Tentativa de suborno ou pressão</td><td>Recusar, registrar e comunicar; integridade é o primeiro princípio</td></tr>
<tr><td>Auditor da equipe com conflito de interesse</td><td>Remanejar para preservar independência</td></tr>
<tr><td>Risco grave identificado</td><td>Comunicar imediatamente ao auditado</td></tr></table>`,
["Reunião da equipe para consolidar antes do encerramento","Encerramento: pontos fortes, NCs, prazos, divergências","Relatório: escopo, método, constatações, conclusão","Follow-up avalia causa raiz e eficácia","Líder garante consistência, tempo e ética"],
`Conclusão de relatório: "O SGI está implementado e é, de modo geral, eficaz. Foram identificadas 1 NC maior (ausência de avaliação de conformidade legal ambiental no último ano, ISO 14001 9.1.2) e 4 menores. Recomenda-se a certificação após evidência de tratamento da NC maior."`,

[["Se o auditado discorda de uma NC e não há acordo:",["A NC é retirada","Registra-se a divergência no relatório","O auditor muda a classificação para agradar","A auditoria é cancelada"],1,"Princípio da apresentação justa."],["A conclusão da auditoria deve considerar:",["Só a NC mais grave","Objetivos e todas as constatações","Apenas os pontos fortes","A opinião do gerente"],1,"Visão global em relação aos objetivos."],["No follow-up o auditor avalia principalmente:",["Se a pessoa culpada foi punida","Se a ação ataca a causa raiz e é eficaz","A cor do formulário","O custo da auditoria"],1,"Causa raiz e eficácia."]])

MOD("aud","ISO 9001 para auditores","Interpretar cada requisito da ISO 9001 pelo olhar do auditor: o que pedir, o que observar e onde estão as NCs mais comuns.",[
L("Contexto e liderança (cláusulas 4 e 5)",`<h4>Como auditar a cláusula 4</h4>
<table><tr><th>Requisito</th><th>O que verificar</th><th>Evidências típicas</th></tr>
<tr><td>4.1 Contexto</td><td>Questões internas e externas pertinentes ao propósito e à direção estratégica; monitoramento dessas questões; avaliação de mudança climática</td><td>SWOT, PESTEL, atas de planejamento estratégico, análise crítica</td></tr>
<tr><td>4.2 Partes interessadas</td><td>Quem é pertinente e quais requisitos são relevantes</td><td>Matriz de partes interessadas com necessidades e expectativas</td></tr>
<tr><td>4.3 Escopo</td><td>Limites e aplicabilidade; justificativa de requisitos não aplicáveis (só se não afetarem a conformidade dos produtos)</td><td>Declaração de escopo disponível como informação documentada</td></tr>
<tr><td>4.4 SGQ e processos</td><td>Processos necessários, entradas e saídas, sequência, interação, critérios, indicadores, recursos, responsáveis, riscos</td><td>Mapa de processos, fichas de processo, SIPOC</td></tr></table>
<p>A ISO 9001 não exige documento específico para 4.1 e 4.2. O auditor avalia se a organização <b>entende</b> seu contexto, perguntando à alta direção e verificando se esse entendimento aparece nas decisões e nos riscos.</p>
<p><b>Pergunta útil</b>: "Quais mudanças externas mais afetaram o negócio no último ano? Como o sistema reagiu?"</p>
<h4>Como auditar a cláusula 5</h4>
<ul><li><b>5.1 Liderança e comprometimento</b>: a alta direção presta contas pela eficácia, integra o SGQ aos processos de negócio, promove abordagem de processo e pensamento baseado em risco, garante recursos, comunica a importância, apoia outras funções de gestão.</li>
<li><b>5.1.2 Foco no cliente</b>: requisitos do cliente e legais determinados e atendidos; riscos que afetam a satisfação tratados.</li>
<li><b>5.2 Política</b>: apropriada ao propósito, com estrutura para objetivos, compromisso com requisitos e melhoria contínua; comunicada, entendida e disponível.</li>
<li><b>5.3 Papéis</b>: responsabilidades e autoridades atribuídas, inclusive para relatar desempenho e promover foco no cliente.</li></ul>
<h4>Auditando a alta direção</h4>
<p>Entreviste o principal executivo ou quem responde pelo sistema. Evite perguntar "Qual é a política da qualidade?" (decorar não prova nada). Pergunte: <i>Quais são os objetivos da qualidade mais importantes deste ano e como vocês estão em relação a eles? Que decisões foram tomadas na última análise crítica? Que recursos foram liberados?</i> Depois confirme em campo se operadores entendem como seu trabalho contribui para a política (7.3).</p>
<h4>Novidades esperadas na revisão 2026</h4>
<p>O texto em revisão reforça temas como cultura da qualidade e comportamento ético da liderança, além da emenda climática já em vigor. Use sempre a edição vigente no momento da auditoria e confira as regras de transição do organismo certificador.</p>
<h4>NCs comuns</h4>
<ul><li>Escopo excluindo requisitos que afetam o produto (ex.: excluir projeto quando a organização projeta).</li>
<li>Mapa de processos que não reflete a realidade.</li>
<li>Alta direção que delega tudo ao "pessoal da qualidade" e não conhece os resultados.</li>
<li>Questões de contexto identificadas, mas nunca monitoradas nem ligadas a riscos.</li></ul>`,

L("Planejamento e apoio (cláusulas 6 e 7)",`<h4>Cláusula 6: planejamento</h4>
<table><tr><th>Requisito</th><th>O que auditar</th></tr>
<tr><td>6.1 Riscos e oportunidades</td><td>Riscos e oportunidades considerando contexto (4.1) e partes interessadas (4.2); ações proporcionais ao impacto; integração aos processos; avaliação de eficácia. A ISO 9001 não exige método formal (não exige FMEA nem matriz), mas a abordagem precisa ser coerente.</td></tr>
<tr><td>6.2 Objetivos</td><td>Mensuráveis, coerentes com a política, monitorados, comunicados, atualizados; plano: o quê, recursos, responsável, prazo, como avaliar resultados</td></tr>
<tr><td>6.3 Mudanças</td><td>Mudanças no SGQ planejadas considerando propósito, integridade do sistema, recursos e responsabilidades</td></tr></table>
<p><b>Truque do auditor</b>: escolha 2 ou 3 riscos altos e pergunte "o que foi feito?". Depois vá ao processo e veja se a ação existe na prática.</p>
<h4>Cláusula 7: apoio</h4>
<table><tr><th>Requisito</th><th>Pontos de auditoria</th></tr>
<tr><td>7.1.2 Pessoas / 7.1.3 Infraestrutura / 7.1.4 Ambiente</td><td>Recursos suficientes; manutenção de máquinas, TI e instalações; fatores sociais, psicológicos e físicos do ambiente</td></tr>
<tr><td>7.1.5 Recursos de monitoramento e medição</td><td>Adequação ao uso; quando rastreabilidade for necessária: calibração ou verificação contra padrões, identificação do status, proteção; ação quando instrumento estiver fora</td></tr>
<tr><td>7.1.6 Conhecimento organizacional</td><td>Conhecimento necessário mantido e disponível; como evitar perda quando pessoas saem</td></tr>
<tr><td>7.2 Competência</td><td>Competência determinada por função, com base em educação, treinamento ou experiência; ações para adquiri-la; avaliação de eficácia; registros</td></tr>
<tr><td>7.3 Conscientização</td><td>Política, objetivos, contribuição individual, consequências de não atender requisitos</td></tr>
<tr><td>7.4 Comunicação</td><td>O quê, quando, com quem, como e quem comunica</td></tr>
<tr><td>7.5 Informação documentada</td><td>Criação, identificação, formato, análise e aprovação; controle de distribuição, acesso, armazenamento, versões, retenção e descarte; documentos externos</td></tr></table>
<h4>Instrumentos de medição: onde mais aparecem NCs</h4>
<ul><li>Instrumento em uso com calibração vencida.</li>
<li>Certificado de calibração sem análise crítica: o erro encontrado está dentro da tolerância do processo?</li>
<li>Sem avaliação do que foi medido com um instrumento que estava fora de especificação.</li>
<li>Balança de pesagem de clientes sem verificação diária prevista.</li></ul>
<h4>Competência na prática</h4>
<p>Amostre funções críticas. Compare: competência exigida (perfil de cargo) × o que a pessoa tem (registros) × o que ela faz (observação). Treinamento registrado sem avaliação de eficácia é NC frequente.</p>
<h4>Documentação</h4>
<p>A ISO 9001 fala em "manter" (documentos) e "reter" (registros). Verifique: versão em uso no posto é a vigente? Alterações são identificadas? Registros são legíveis e recuperáveis? Sistemas eletrônicos têm backup e controle de acesso?</p>`,

L("Operação (cláusula 8)",`<h4>Visão geral</h4>
<p>É a cláusula mais extensa e onde o auditor passa mais tempo. Audite seguindo o fluxo real: do pedido do cliente à entrega e ao pós-entrega.</p>
<table><tr><th>Requisito</th><th>O que auditar</th></tr>
<tr><td>8.1 Planejamento operacional</td><td>Critérios de processos e de aceitação, recursos, controles, registros; controle de mudanças planejadas e de processos terceirizados</td></tr>
<tr><td>8.2 Requisitos de produtos e serviços</td><td>Comunicação com cliente, determinação e análise crítica dos requisitos antes de aceitar (capacidade de atender), alterações de pedido</td></tr>
<tr><td>8.3 Projeto e desenvolvimento</td><td>Planejamento, entradas, controles (análises críticas, verificação, validação), saídas, alterações</td></tr>
<tr><td>8.4 Processos, produtos e serviços externos</td><td>Critérios de seleção, avaliação, monitoramento e reavaliação de fornecedores; tipo e extensão do controle; informações claras ao fornecedor</td></tr>
<tr><td>8.5.1 Controle de produção e prestação de serviço</td><td>Informação documentada, monitoramento, infraestrutura, pessoas competentes, validação de processos especiais, prevenção de erro humano</td></tr>
<tr><td>8.5.2 Identificação e rastreabilidade</td><td>Status das saídas; rastreabilidade quando requisito</td></tr>
<tr><td>8.5.3 Propriedade do cliente ou fornecedor</td><td>Cuidado, identificação, proteção; comunicar perda ou dano (inclui dados pessoais)</td></tr>
<tr><td>8.5.4 Preservação</td><td>Identificação, manuseio, embalagem, armazenamento, transporte</td></tr>
<tr><td>8.5.5 Pós-entrega</td><td>Garantia, assistência técnica, recall, retorno do cliente</td></tr>
<tr><td>8.5.6 Controle de mudanças</td><td>Mudanças na produção analisadas e registradas</td></tr>
<tr><td>8.6 Liberação</td><td>Verificação planejada antes da entrega; registro de quem liberou</td></tr>
<tr><td>8.7 Saídas não conformes</td><td>Identificação, segregação, correção, concessão, informação ao cliente, registros</td></tr></table>
<h4>Processos especiais</h4>
<p>Quando a saída não pode ser verificada por inspeção posterior (solda, esterilização, pintura eletrostática, cozimento em larga escala, treinamento), a organização deve <b>validar</b> o processo e revalidar periodicamente (8.5.1 f). Peça a validação e os parâmetros controlados.</p>
<h4>Serviços também têm operação</h4>
<p>Num hotel, escola, clínica ou empresa de software, "produção" é a prestação do serviço. Verifique roteiros, padrões de atendimento, competência, registros de execução e como falhas de serviço são tratadas (8.7 também se aplica a serviço: um check-in com erro, uma aula não dada).</p>
<h4>Fornecedores: armadilhas</h4>
<ul><li>Lista de "fornecedores aprovados" sem critérios nem reavaliação.</li>
<li>Avaliação que dá nota máxima a todos todo ano.</li>
<li>Processo terceirizado crítico (ex.: calibração, laboratório, transporte) sem controle definido.</li></ul>
<h4>Trilha de auditoria sugerida</h4>
<ol><li>Escolha um pedido recente e um que teve problema.</li>
<li>Veja a análise crítica do pedido (8.2.3).</li>
<li>Siga o planejamento, as compras envolvidas (8.4), a execução (8.5), a inspeção e liberação (8.6).</li>
<li>Veja a entrega e qualquer reclamação ou retorno (8.5.5, 9.1.2).</li></ol>`,
["Audite seguindo o fluxo real: pedido → entrega → pós-entrega","8.2: analisar capacidade de atender antes de aceitar","8.4: critérios, avaliação e reavaliação de fornecedores","Processos especiais exigem validação (8.5.1 f)","8.7: identificar, segregar e decidir sobre saídas não conformes"],
`Numa clínica odontológica, a esterilização de instrumentos é processo especial: não é possível testar cada instrumento depois. O auditor pede a validação da autoclave, os indicadores biológicos semanais, os registros de ciclos e o que acontece quando um ciclo falha.`,
`Escolha um serviço que você usa (academia, oficina, restaurante) e desenhe a trilha de auditoria da cláusula 8 com 20 perguntas e as evidências esperadas, incluindo pelo menos um processo especial.`,
[["Um processo cuja saída não pode ser verificada depois precisa ser:",["Eliminado","Validado","Terceirizado","Ignorado"],1,"8.5.1 f exige validação."],["A análise da capacidade de atender ao pedido antes de aceitá-lo está em:",["8.2.3","8.4.1","8.7","9.1.2"],0,"8.2.3 Análise crítica dos requisitos."],["Propriedade do cliente inclui:",["Apenas materiais físicos","Também dados pessoais do cliente","Só dinheiro","Só equipamentos"],1,"8.5.3 cita propriedade intelectual e dados pessoais."]]),
L("Desempenho e melhoria (cláusulas 9 e 10)",`<h4>9.1 Monitoramento, medição, análise e avaliação</h4>
<ul><li>O que monitorar, métodos, quando e quando analisar.</li>
<li><b>9.1.2 Satisfação do cliente</b>: percepção do cliente monitorada (pesquisas, reclamações, elogios, dados de recompra, avaliações on-line, reuniões).</li>
<li><b>9.1.3 Análise e avaliação</b>: conformidade, satisfação, desempenho do SGQ, eficácia do planejamento, ações sobre riscos, desempenho de fornecedores, necessidade de melhoria.</li></ul>
<p>O auditor verifica se os dados são <b>usados</b>: indicador abaixo da meta por 3 meses sem análise ou ação é NC frequente (9.1.3 / 10.2).</p>
<h4>9.2 Auditoria interna</h4>
<table><tr><th>O que verificar</th><th>NCs comuns</th></tr>
<tr><td>Programa considerando importância dos processos, mudanças e resultados anteriores</td><td>Programa igual todo ano sem base em risco</td></tr>
<tr><td>Critérios e escopo de cada auditoria</td><td>Escopo genérico ("todo o SGQ")</td></tr>
<tr><td>Objetividade e imparcialidade dos auditores</td><td>Auditor auditando o próprio processo</td></tr>
<tr><td>Resultados relatados à gerência</td><td>Relatório sem conclusão</td></tr>
<tr><td>Correções e ações corretivas sem demora</td><td>NCs abertas há meses</td></tr></table>
<p>Avalie a <b>qualidade</b> das auditorias internas: são profundas? Encontram problemas reais? Auditorias internas que nunca acham nada são um sinal de alerta.</p>
<h4>9.3 Análise crítica pela direção</h4>
<p>Entradas obrigatórias: situação de ações anteriores; mudanças em questões internas e externas; desempenho e eficácia (satisfação, objetivos, desempenho de processos, NCs e ações, monitoramento, auditorias, fornecedores); adequação de recursos; eficácia das ações sobre riscos; oportunidades de melhoria. Saídas: oportunidades de melhoria, necessidade de mudanças, recursos. Peça a ata e verifique se todas as entradas foram tratadas e se as saídas viraram ações.</p>
<h4>Cláusula 10: melhoria</h4>
<ul><li><b>10.2 Não conformidade e ação corretiva</b>: reagir (controlar e corrigir, lidar com consequências), avaliar necessidade de eliminar causas (análise crítica, determinação de causas, verificar se há NCs semelhantes), implementar ações, analisar eficácia, atualizar riscos e mudar o SGQ se necessário. Reter registros.</li>
<li><b>10.3 Melhoria contínua</b>: adequação, suficiência e eficácia do SGQ.</li></ul>
<h4>Avaliando análises de causa</h4>
<p>Sinais de análise fraca: causa = "falha humana" ou "Falta de atenção"; ação = "treinar novamente" ou "conscientizar"; mesma NC repetida. Pergunte: <i>Por que a pessoa errou? O processo permitia o erro? O que impede que aconteça de novo?</i></p>
<h4>Fechando o ciclo</h4>
<p>Um bom auditor liga os pontos: risco identificado (6.1) → indicador (9.1) → resultado ruim → ação corretiva (10.2) → análise crítica (9.3). Se o ciclo quebra em algum ponto, há uma constatação.</p>`,
["9.1.3: dados precisam gerar análise e ação","9.2: programa baseado em importância e resultados anteriores","Auditor interno não audita o próprio trabalho","9.3: todas as entradas e saídas obrigatórias","Causa 'falha humana' + ação 'treinar' = análise fraca"],

MOD("aud","ISO 14001 para auditores","Auditar o sistema de gestão ambiental: aspectos e impactos, requisitos legais, controle operacional, emergências e avaliação de conformidade.",[
L("Conceitos, contexto e política ambiental",`<h4>Termos-chave da ISO 14001</h4>
<table><tr><th>Termo</th><th>Definição</th><th>Exemplo</th></tr>
<tr><td>Meio ambiente</td><td>Circunvizinhança em que a organização opera: ar, água, solo, recursos naturais, flora, fauna, seres humanos e suas inter-relações</td><td>Rio ao lado da fábrica</td></tr>
<tr><td>Aspecto ambiental</td><td>Elemento das atividades, produtos ou serviços que interage ou pode interagir com o meio ambiente</td><td>Geração de efluente, consumo de energia, emissão de fumaça</td></tr>
<tr><td>Impacto ambiental</td><td>Modificação no meio ambiente, adversa ou benéfica, resultante de aspectos</td><td>Contaminação do rio, esgotamento de recursos</td></tr>
<tr><td>Obrigações de compliance</td><td>Requisitos legais que a organização tem de cumprir e outros que escolhe cumprir</td><td>Licença de operação, acordo com a comunidade</td></tr>
<tr><td>Perspectiva de ciclo de vida</td><td>Considerar estágios consecutivos do produto: matéria-prima, projeto, produção, transporte, uso, fim de vida</td><td>Embalagem reciclável, orientação ao consumidor sobre descarte</td></tr>
<tr><td>Prevenção da poluição</td><td>Uso de processos, práticas, materiais e substitutos para evitar, reduzir ou controlar a geração de poluentes</td><td>Trocar solvente por base água</td></tr></table>
<h4>Contexto (cláusula 4) com olhar ambiental</h4>
<ul><li>4.1 inclui <b>condições ambientais</b> que afetam ou são afetadas pela organização: clima, escassez de água, qualidade do ar, áreas protegidas próximas, mudança climática.</li>
<li>4.2: comunidade vizinha, órgãos ambientais, ONGs, clientes que exigem metas de carbono. A organização decide quais necessidades se tornam obrigações de compliance.</li>
<li>4.3 escopo: não pode excluir atividades com aspectos significativos para "fugir" de controle.</li></ul>
<h4>Liderança e política (cláusula 5)</h4>
<p>A política ambiental tem compromissos específicos que o auditor confere: <b>proteção do meio ambiente</b> (incluindo prevenção da poluição e outros pertinentes ao contexto, como uso sustentável de recursos, mitigação e adaptação às mudanças climáticas, proteção da biodiversidade), <b>atender às obrigações de compliance</b> e <b>melhoria contínua</b> para aumentar o desempenho ambiental. Deve estar disponível às partes interessadas.</p>
<h4>A revisão em andamento</h4>
<p>A ISO 14001 também está em revisão, com nova edição prevista para 2026, mantendo a lógica do sistema e reforçando temas como mudança climática, biodiversidade e uso de recursos. O auditor deve conhecer a edição vigente e o prazo de transição.</p>
<h4>Pergunta-chave para a direção</h4>
<p><i>"Quais são os impactos ambientais mais importantes da organização e o que vocês estão fazendo para reduzi-los? Como sabem que estão cumprindo a legislação ambiental?"</i> Se a direção não sabe responder, a liderança (5.1) provavelmente não está integrada.</p>`,
["Aspecto (causa) × impacto (efeito)","Obrigações de compliance: legais + voluntárias","Perspectiva de ciclo de vida","Política: proteção ambiental, compliance e melhoria","Escopo não pode excluir aspectos significativos"],
`Uma lavanderia industrial tem como aspecto o lançamento de efluente com detergente; o impacto é a alteração da qualidade da água do córrego. Obrigação de compliance: padrões de lançamento da Resolução CONAMA 430/2011 e da licença estadual.`,
`Escolha uma atividade conhecida (restaurante, oficina mecânica, escola) e liste 15 aspectos ambientais com seus impactos, em condições normais, anormais e de emergência. Indique as partes interessadas ambientais pertinentes.`,
[["Consumo de energia elétrica é:",["Um impacto","Um aspecto","Uma obrigação de compliance","Uma política"],1,"É o elemento da atividade que interage com o meio ambiente."],["Obrigações de compliance incluem:",["Apenas leis","Leis e requisitos que a organização escolhe cumprir","Apenas normas ISO","Só metas de venda"],1,"Legais e voluntárias."],["A política ambiental deve incluir compromisso com:",["Lucro máximo","Proteção do meio ambiente, compliance e melhoria contínua","Redução de pessoal","Zero clientes insatisfeitos"],1,"Três compromissos centrais."]]),
L("Aspectos e impactos significativos e requisitos legais",`<h4>6.1.2 Aspectos ambientais</h4>
<p>A organização deve determinar aspectos que pode <b>controlar</b> e aqueles que pode <b>influenciar</b> (ex.: fornecedores, uso do produto pelo cliente), considerando perspectiva de ciclo de vida, mudanças (novos produtos, processos), condições <b>normais, anormais</b> (partida, parada, manutenção) e <b>situações de emergência</b> razoavelmente previsíveis (vazamento, incêndio).</p>
<h4>Levantamento de Aspectos e Impactos Ambientais (LAIA)</h4>
<table><tr><th>Atividade</th><th>Aspecto</th><th>Impacto</th><th>Condição</th><th>Severidade</th><th>Frequência</th><th>Legal?</th><th>Significativo?</th><th>Controle</th></tr>
<tr><td>Troca de óleo de máquinas</td><td>Geração de óleo usado</td><td>Contaminação do solo</td><td>Normal</td><td>3</td><td>2</td><td>Sim</td><td>Sim</td><td>Coleta por empresa licenciada, MTR</td></tr>
<tr><td>Abastecimento de gerador</td><td>Vazamento de diesel</td><td>Contaminação do solo e água</td><td>Emergência</td><td>3</td><td>1</td><td>Sim</td><td>Sim</td><td>Bacia de contenção, kit de emergência</td></tr></table>
<p>A ISO 14001 não define o método: o auditor verifica se os critérios estão definidos, se foram aplicados de forma coerente e se os significativos são comunicados e usados no planejamento (6.1.4, 6.2, 8.1). Um aspecto ligado a requisito legal ou a reclamação da comunidade normalmente deve ser tratado como significativo.</p>
<h4>6.1.3 Obrigações de compliance</h4>
<p>A organização deve determinar e ter acesso às obrigações, saber como se aplicam e mantê-las atualizadas. Principais referências da legislação ambiental brasileira (verifique sempre a versão vigente e normas estaduais e municipais):</p>
<table><tr><th>Tema</th><th>Referência</th></tr>
<tr><td>Política Nacional do Meio Ambiente</td><td>Lei 6.938/1981</td></tr>
<tr><td>Licenciamento ambiental (LP, LI, LO)</td><td>Resolução CONAMA 237/1997, LC 140/2011 e normas estaduais</td></tr>
<tr><td>Crimes e infrações ambientais</td><td>Lei 9.605/1998 e Decreto 6.514/2008</td></tr>
<tr><td>Resíduos sólidos (PGRS, logística reversa)</td><td>Lei 12.305/2010 e Decreto 10.936/2022</td></tr>
<tr><td>Manifesto de Transporte de Resíduos</td><td>MTR pelo SINIR ou sistema estadual</td></tr>
<tr><td>Cadastro Técnico Federal e relatório anual</td><td>CTF/APP e RAPP do IBAMA</td></tr>
<tr><td>Recursos hídricos e outorga</td><td>Lei 9.433/1997</td></tr>
<tr><td>Efluentes</td><td>Resolução CONAMA 430/2011</td></tr>
<tr><td>Qualidade do ar</td><td>Resolução CONAMA 491/2018</td></tr></table>
<h4>Como auditar requisitos legais</h4>
<ol><li>Peça o registro de requisitos legais e veja se cobre os aspectos significativos.</li>
<li>Escolha 3 a 5 requisitos críticos (licença, condicionantes, resíduos perigosos, efluente).</li>
<li>Verifique o cumprimento em campo: licença válida e afixada quando exigido, condicionantes cumpridas e reportadas, MTR e certificados de destinação final.</li>
<li>Pergunte como a organização fica sabendo de leis novas.</li></ol>
<p>Condicionantes de licença são o ponto em que mais se encontram NCs: monitoramentos não realizados ou relatórios não protocolados no prazo.</p>
<h4>6.1.4 e 6.2</h4>
<p>Ações planejadas para aspectos significativos, obrigações e riscos; objetivos ambientais mensuráveis com indicadores (ex.: reduzir consumo de água por unidade produzida em 10%).</p>`,
["Aspectos que controla e que influencia, em condição normal, anormal e de emergência","Método livre, critérios coerentes e aplicados","Ligado a lei ou reclamação → normalmente significativo","Licença, condicionantes, resíduos (MTR) e efluentes são pontos críticos","Verifique cumprimento em campo, não só a lista"],
`Numa fábrica de tintas, a licença de operação exige monitoramento trimestral do efluente. O auditor encontra os laudos de três trimestres, mas falta o do último, que venceu há 40 dias, e não há protocolo de entrega ao órgão ambiental. NC contra 9.1.2 e 6.1.3 (condicionante não cumprida).`,

[["Aspectos em 'condição anormal' incluem:",["Só a operação diária","Partidas, paradas e manutenção","Apenas incêndio","Apenas fornecedores"],1,"Situações não rotineiras previsíveis."],["Documento que acompanha o transporte de resíduos:",["CAT","MTR","PPP","ART"],1,"Manifesto de Transporte de Resíduos."],["A ISO 14001 exige um método específico de significância?",["Sim, uma matriz 5x5","Não, mas os critérios devem ser definidos e aplicados de forma coerente","Sim, o FMEA","Não precisa avaliar significância"],1,"Método livre, critérios estabelecidos."]]),
L("Controle operacional, ciclo de vida e emergências",`<h4>8.1 Planejamento e controle operacional</h4>
<p>Processos devem ter critérios operacionais e controles, incluindo <b>hierarquia de controles</b> quando aplicável (eliminar, substituir, controles de engenharia, administrativos). Inclui processos terceirizados controlados ou influenciados.</p>
<h4>Perspectiva de ciclo de vida em 8.1</h4>
<ul><li>Requisitos ambientais considerados no <b>projeto</b> de produtos e serviços.</li>
<li>Requisitos ambientais nas <b>compras</b>.</li>
<li>Comunicar requisitos ambientais a <b>fornecedores e contratados</b>.</li>
<li>Fornecer informação sobre impactos no <b>transporte, uso, tratamento de fim de vida e disposição final</b>.</li></ul>
<p>Não exige avaliação de ciclo de vida (ACV) formal. O auditor pergunta: "Em que etapas do ciclo de vida do seu produto estão os maiores impactos e o que vocês fazem a respeito?"</p>
<h4>Controles operacionais típicos a verificar em campo</h4>
<table><tr><th>Aspecto</th><th>Controles que o auditor procura</th></tr>
<tr><td>Resíduos</td><td>Segregação por tipo, identificação, armazenamento temporário coberto e com contenção, transportador e destinador licenciados, MTR e CDF (certificado de destinação final)</td></tr>
<tr><td>Produtos químicos</td><td>FDS (ficha com dados de segurança) disponível, rotulagem, bacia de contenção, compatibilidade no armazenamento</td></tr>
<tr><td>Efluentes</td><td>ETE operando, registros de monitoramento, laudos de laboratório acreditado</td></tr>
<tr><td>Emissões atmosféricas</td><td>Manutenção de filtros, monitoramento, controle de fumaça preta em frota</td></tr>
<tr><td>Recursos</td><td>Medição de água e energia, metas, vazamentos</td></tr>
<tr><td>Ruído externo</td><td>Medições nos limites do terreno, horário de operação</td></tr></table>
<h4>8.2 Preparação e resposta a emergências</h4>
<ul><li>Planejar ações para prevenir ou mitigar impactos de emergências.</li>
<li>Responder a emergências reais.</li>
<li><b>Testar periodicamente</b> as ações de resposta (simulados), quando praticável.</li>
<li>Analisar criticamente e revisar após simulados e ocorrências.</li>
<li>Prover informação e treinamento a partes pertinentes, inclusive terceiros.</li></ul>
<p>Em campo: kit de emergência ambiental completo e acessível perto do risco, pessoas que sabem usá-lo, registro e avaliação do último simulado, plano atualizado com telefones corretos.</p>
<h4>Exemplo de teste rápido em auditoria</h4>
<p>Pergunte a um operador do almoxarifado: "Se este tambor de solvente vazar agora, o que você faz?" Observe se ele sabe onde está o kit, se conhece o procedimento e a quem avisar. Resposta incerta + simulado nunca feito naquela área = constatação.</p>
<h4>Terceiros e contratados</h4>
<p>Empresas de manutenção, limpeza e obras geram aspectos significativos dentro do site. Verifique como recebem as regras ambientais, como são fiscalizadas e quem responde pelos resíduos gerados por elas.</p>`,

[["A ISO 14001 exige ACV formal?",["Sim, para todo produto","Não; exige considerar a perspectiva de ciclo de vida","Só para indústrias químicas","Só na certificação"],1,"Perspectiva, não estudo formal."],["Em 8.2 a organização deve, quando praticável:",["Testar periodicamente as ações de resposta","Eliminar todas as emergências","Contratar bombeiros fixos","Apenas ter o plano escrito"],0,"Simulados periódicos."],["Certificado que comprova destino final de resíduos:",["CDF","AVCB","ASO","CAT"],0,"Certificado de Destinação Final."]]),
L("Avaliação de desempenho ambiental e de conformidade",`<h4>9.1.1 Monitoramento, medição, análise e avaliação</h4>
<p>A organização define o que monitorar, métodos, critérios para avaliar o <b>desempenho ambiental</b> e indicadores apropriados. Equipamentos de monitoramento devem ser calibrados ou verificados. Deve comunicar externa e internamente informações pertinentes sobre desempenho ambiental, conforme suas obrigações.</p>
<p>Indicadores típicos: consumo de água e energia por unidade produzida, resíduos gerados e percentual reciclado, emissões de gases de efeito estufa, número de ocorrências ambientais, atendimento a padrões de efluente, reclamações da vizinhança.</p>
<h4>9.1.2 Avaliação do atendimento aos requisitos legais e outros</h4>
<p>Requisito exclusivo e crítico da ISO 14001 (e também da 45001): a organização deve <b>avaliar periodicamente</b> se cumpre suas obrigações de compliance, agir quando necessário e manter conhecimento sobre sua situação de conformidade. Reter registros.</p>
<table><tr><th>O auditor verifica</th><th>NC comum</th></tr>
<tr><td>Frequência definida e cumprida</td><td>Avaliação nunca realizada ou atrasada</td></tr>
<tr><td>Abrangência: todos os requisitos aplicáveis</td><td>Só "check" na lista sem evidência</td></tr>
<tr><td>Evidência de cada atendimento</td><td>Avaliação diz "atende" mas licença está vencida</td></tr>
<tr><td>Ações para não atendimentos</td><td>Não atendimento identificado sem ação</td></tr></table>
<p>Atenção: avaliação de conformidade é diferente de ter a lista de leis (6.1.3). A lista diz quais requisitos se aplicam; a avaliação demonstra se estão sendo cumpridos.</p>
<h4>Comunicação externa (7.4.3)</h4>
<p>Como a organização responde a reclamações e consultas da vizinhança e de autoridades? Há registro? O que foi feito? Em muitas auditorias ambientais, uma reclamação de odor ou ruído mal tratada é a constatação mais importante.</p>
<h4>Auditoria interna e análise crítica no SGA</h4>
<p>Além do comum às outras normas, a análise crítica (9.3) deve considerar: obrigações de compliance, aspectos significativos, riscos e oportunidades, comunicações de partes interessadas, extensão do alcance dos objetivos e informações sobre desempenho ambiental.</p>
<h4>Auditando em campo: dicas práticas</h4>
<ul><li>Comece pelo perímetro: canaletas, saída de efluente, área de resíduos, tanques, chaminés.</li>
<li>Use os sentidos: cheiro, manchas no piso, ruído, fumaça.</li>
<li>Compare o que viu com o LAIA: o aspecto está lá? Foi considerado significativo?</li>
<li>Siga um resíduo da geração até o CDF.</li>
<li>Verifique notificações, autos de infração ou termos de ajustamento de conduta (TAC).</li></ul>`,
["Indicadores de desempenho ambiental definidos e analisados","9.1.2: avaliar periodicamente o cumprimento legal","Lista de leis (6.1.3) ≠ avaliação de conformidade (9.1.2)","Reclamações externas são fonte rica de constatações","Comece pelo perímetro e use os sentidos"],

[["O requisito de avaliar periodicamente o cumprimento legal é:",["6.1.3","9.1.2","8.2","7.4.3"],1,"9.1.2 Avaliação do atendimento aos requisitos legais e outros."],["Qual é a diferença entre 6.1.3 e 9.1.2?",["Nenhuma","6.1.3 identifica requisitos; 9.1.2 avalia se estão cumpridos","9.1.2 é opcional","6.1.3 trata de emergências"],1,"Identificar × avaliar cumprimento."],["Reclamação da vizinhança sobre odor relaciona-se principalmente a:",["7.4.3 comunicação externa e aspectos","8.3 projeto","7.1.6 conhecimento","5.3 papéis"],0,"Comunicação externa e tratamento de aspectos."]])
]);

L("ISO 45001: participação, perigos e hierarquia de controles",`<h4>Termos-chave</h4>
<table><tr><th>Termo</th><th>Definição simplificada</th></tr>
<tr><td>Trabalhador</td><td>Pessoa que executa trabalho sob controle da organização (empregados, temporários, terceiros, estagiários)</td></tr>
<tr><td>Perigo</td><td>Fonte com potencial de causar lesão e problemas de saúde</td></tr>
<tr><td>Risco de SSO</td><td>Combinação da probabilidade de ocorrência de evento perigoso ou exposição com a severidade da lesão ou problema de saúde</td></tr>
<tr><td>Incidente</td><td>Ocorrência que resulta ou pode resultar em lesão e problemas de saúde (inclui quase acidente)</td></tr>
<tr><td>Local de trabalho</td><td>Local sob controle da organização onde a pessoa precisa estar ou ir a trabalho</td></tr></table>
<h4>5.4 Consulta e participação dos trabalhadores: o coração da norma</h4>
<p>A organização deve estabelecer processos de consulta e participação de trabalhadores <b>em todos os níveis</b>, com ênfase nos <b>não gerenciais</b>, eliminando obstáculos (idioma, medo de represália, falta de tempo) e oferecendo tempo, treinamento e recursos.</p>
<ul><li><b>Consulta</b> (pedir opinião antes de decidir): necessidades das partes interessadas, política, papéis, requisitos legais, objetivos, controles de terceiros e compras, o que monitorar, programa de auditoria.</li>
<li><b>Participação</b> (envolver na decisão): mecanismos de consulta, identificação de perigos e avaliação de riscos, ações para eliminar perigos, competência e treinamento, comunicação, controles, investigação de incidentes e NCs.</li></ul>
<p>Como auditar: entreviste operadores, membros da CIPA (NR-5) e terceiros. <i>Você participou da avaliação de riscos da sua atividade? Já sugeriu alguma melhoria de segurança? O que aconteceu? Se você recusar uma tarefa perigosa, o que acontece?</i> A norma exige proteger o trabalhador de represálias ao se retirar de situação de perigo iminente e grave (5.1 e 10.2).</p>
<h4>6.1.2 Identificação de perigos e avaliação de riscos e oportunidades</h4>
<p>Deve ser contínua e proativa, considerando: organização do trabalho e fatores sociais (carga, jornada, assédio, liderança, cultura); atividades rotineiras e não rotineiras; incidentes passados; emergências; pessoas (trabalhadores, terceiros, visitantes, vizinhos); projeto de áreas, equipamentos e procedimentos; situações fora do local controlado; mudanças. No Brasil, a NR-1 exige o <b>GRO</b> (Gerenciamento de Riscos Ocupacionais) com <b>PGR</b> (inventário de riscos e plano de ação), o que converge com a ISO 45001; desde as atualizações recentes da NR-1, os fatores de risco psicossociais também devem ser considerados no inventário.</p>
<h4>8.1.2 Hierarquia de controles</h4>
<ol><li><b>Eliminar</b> o perigo (ex.: deixar de trabalhar em altura usando ferramenta de cabo longo).</li>
<li><b>Substituir</b> por processos, operações, materiais ou equipamentos menos perigosos.</li>
<li><b>Controles de engenharia</b> e reorganização do trabalho (proteção de máquinas, enclausuramento, ventilação, guarda-corpo).</li>
<li><b>Controles administrativos</b>, incluindo treinamento, procedimentos, sinalização, rodízio, permissão de trabalho.</li>
<li><b>EPI</b> adequado.</li></ol>
<p>Constatação clássica: o plano de ação para riscos altos só prevê EPI e treinamento, sem justificar por que níveis superiores não são viáveis.</p>`,
["Perigo (fonte) × risco (probabilidade × severidade)","5.4: consulta e participação, com ênfase nos não gerenciais","Proteção contra represália ao recusar perigo grave","NR-1: GRO e PGR convergem com 6.1.2, incluindo riscos psicossociais","Hierarquia: eliminar, substituir, engenharia, administrativo, EPI"],
`Num restaurante industrial, o perigo é a fritadeira com óleo quente; o risco é queimadura grave. Controles pela hierarquia: substituir por forno combinado em parte do cardápio (substituição), tampa e sistema de desligamento automático (engenharia), procedimento e treinamento (administrativo), luvas e avental térmico (EPI).`,
`Escolha 5 atividades de risco (trabalho em altura, eletricidade, máquina, produtos químicos, carga e descarga) e, para cada uma, proponha controles nos 5 níveis da hierarquia. Escreva 10 perguntas para verificar consulta e participação com operadores.`,
[["O primeiro nível da hierarquia de controles é:",["EPI","Treinamento","Eliminar o perigo","Sinalização"],2,"Eliminar vem primeiro."],["A ISO 45001 dá ênfase à participação de:",["Apenas diretores","Trabalhadores não gerenciais","Somente consultores","Apenas o SESMT"],1,"5.4 enfatiza não gerenciais."],["No Brasil, a NR que estabelece GRO e PGR é a:",["NR-1","NR-6","NR-12","NR-35"],0,"NR-1 Disposições gerais e gerenciamento de riscos ocupacionais."]]),
L("ISO 45001 na operação: mudanças, contratados, emergências e incidentes",`<h4>Requisitos legais de SSO (6.1.3 e 9.1.2)</h4>
<p>Principais Normas Regulamentadoras (NRs) que aparecem em auditorias (confira sempre a versão vigente no site do Ministério do Trabalho e Emprego):</p>
<table><tr><th>NR</th><th>Tema</th><th>Evidência típica</th></tr>
<tr><td>NR-1</td><td>GRO e PGR</td><td>Inventário de riscos e plano de ação</td></tr>
<tr><td>NR-5</td><td>CIPA</td><td>Atas, eleição, treinamento</td></tr>
<tr><td>NR-6</td><td>EPI</td><td>CA válido, fichas de entrega, treinamento de uso</td></tr>
<tr><td>NR-7</td><td>PCMSO</td><td>ASOs, relatório analítico</td></tr>
<tr><td>NR-10</td><td>Eletricidade</td><td>Prontuário, treinamento, bloqueio</td></tr>
<tr><td>NR-12</td><td>Máquinas</td><td>Proteções, dispositivos de parada, inventário de máquinas</td></tr>
<tr><td>NR-17</td><td>Ergonomia</td><td>AEP / AET</td></tr>
<tr><td>NR-23 e normas estaduais</td><td>Incêndio</td><td>Extintores, brigada, AVCB/alvará do Corpo de Bombeiros</td></tr>
<tr><td>NR-33 / NR-35</td><td>Espaço confinado / trabalho em altura</td><td>Permissão de trabalho, treinamento, análise de risco</td></tr></table>
<h4>8.1.3 Gestão de mudanças</h4>
<p>Mudanças temporárias e permanentes (novos produtos, processos, equipamentos, layout, jornada, legislação, conhecimento sobre perigos) devem ser planejadas e avaliadas quanto a riscos antes da implementação. Auditor: peça a última mudança relevante e veja se houve análise de risco antes.</p>
<h4>8.1.4 Aquisição, contratados e terceirização</h4>
<ul><li>Compras de equipamentos, substâncias e serviços consideradas quanto à SSO (ex.: máquina nova já em conformidade com NR-12).</li>
<li><b>Contratados</b>: coordenação de perigos; critérios de SSO para selecionar; integração e permissão de trabalho; fiscalização. Acidentes com terceiros são proporcionalmente frequentes: priorize-os na amostragem.</li>
<li>Processos terceirizados controlados.</li></ul>
<h4>8.2 Emergências</h4>
<p>Plano de resposta, primeiros socorros, treinamento, <b>testes periódicos e simulados</b>, comunicação a trabalhadores, terceiros, visitantes, serviços de emergência e vizinhos. Verifique rotas de fuga desobstruídas, iluminação de emergência, brigada treinada e o registro do último simulado com lições aprendidas.</p>
<h4>10.2 Incidentes, não conformidades e ação corretiva</h4>
<ul><li>Reagir em tempo hábil, investigar com participação dos trabalhadores, determinar causas, avaliar riscos de novos perigos, implementar ações pela hierarquia de controles, verificar eficácia.</li>
<li>Investigar também <b>quase acidentes</b>: são a melhor fonte de prevenção.</li>
<li>No Brasil, acidente do trabalho exige emissão de CAT (no eSocial, evento S-2210).</li></ul>
<h4>Indicadores de SSO</h4>
<p>Reativos: taxa de frequência e de gravidade, dias perdidos. Proativos: quase acidentes reportados, inspeções realizadas, ações concluídas no prazo, participação em treinamentos, observações comportamentais. Um sistema maduro olha os dois.</p>
<h4>Dica de campo</h4>
<p>Sempre peça e use o EPI exigido na área. Observe antes de perguntar: pessoas trabalhando sem proteção, máquinas sem proteção, extintores obstruídos, improvisos. Se houver risco grave e iminente, comunique imediatamente.</p>`,
