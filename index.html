[["Qual combinação é natural?",["do a decision","make a decision","take a decision a mistake","have a decision make"],1,"Make a decision (UK também aceita take a decision)."],["'Chuva forte':",["strong rain","heavy rain","big rain","hard rain-fall"],1,"A collocation é heavy rain."],["'O evento acontece em maio':",["The event takes place in May.","The event makes place in May.","The event does place in May.","The event has place in May."],0,"Take place = acontecer."]]),
L("Conectores e marcadores do discurso",`<h4>Por que importam</h4>
<p>Conectores organizam o pensamento e mostram nível. Um B1 usa <i>and, but, because</i>; um B2 usa <i>however, whereas, as a result, despite</i>.</p>
<h4>Por função</h4>
<table><tr><th>Função</th><th>Informal / fala</th><th>Formal / escrita</th></tr>
<tr><td>Adição</td><td>and, also, plus, too</td><td>moreover, furthermore, in addition, what's more</td></tr>
<tr><td>Contraste</td><td>but, though, still</td><td>however, nevertheless, whereas, while, on the other hand</td></tr>
<tr><td>Concessão</td><td>even though, although</td><td>despite / in spite of + -ing/substantivo, notwithstanding</td></tr>
<tr><td>Causa</td><td>because, since, as</td><td>due to, owing to, because of + substantivo</td></tr>
<tr><td>Consequência</td><td>so</td><td>therefore, consequently, as a result, thus, hence</td></tr>
<tr><td>Finalidade</td><td>to, so that</td><td>in order to, so as to</td></tr>
<tr><td>Exemplo</td><td>like</td><td>for instance, for example, such as, namely</td></tr>
<tr><td>Conclusão</td><td>so, anyway</td><td>in conclusion, to sum up, overall, all in all</td></tr></table>
<h4>Gramática dos conectores (onde se erra)</h4>
<ul><li><b>Despite / in spite of + substantivo ou -ing</b>: <i>Despite the rain, we went out. In spite of being tired, she kept working.</i> Errado: "Despite it was raining". Com frase use <i>despite the fact that</i> ou <i>although</i>.</li>
<li><b>Although + frase</b>: <i>Although it was raining, we went out.</i></li>
<li><b>However</b> começa nova frase, seguido de vírgula: <i>The plan is good. However, it's expensive.</i></li>
<li><b>Because + frase × because of + substantivo</b>: <i>because it rained / because of the rain</i>.</li>
<li><b>So that + sujeito + can/could</b>: <i>I left early so that I could catch the bus.</i></li></ul>
<h4>Marcadores da fala</h4>
<p><i>Actually</i> (na verdade; não é "Atualmente", que é <i>currently/nowadays</i>), <i>Anyway</i> (enfim), <i>By the way</i> (aliás), <i>Basically, Honestly, To be honest, I mean, You see, The thing is..., Mind you, After all, As I was saying, Speaking of which</i>.</p>
<h4>Falso amigo crítico</h4>
<p><b>Eventually</b> = finalmente, por fim (não "Eventualmente", que é <i>occasionally</i> ou <i>possibly</i>).</p>`,
["however, nevertheless: contraste formal","despite + substantivo/-ing; although + frase","because + frase; because of + substantivo","actually = na verdade; currently = atualmente","eventually = por fim; occasionally = eventualmente"],
`<i>"Although the course is expensive, it's worth it. Moreover, it's online, so I can study at night. However, I'll need discipline. Actually, I've already started, and eventually I want to take the IELTS."</i>`,
`Escreva um texto argumentativo de 220 palavras sobre "Vale a pena estudar idiomas com IA?" usando pelo menos 12 conectores diferentes, sendo 6 formais.`,
[["Qual está correta?",["Despite it was late, we stayed.","Despite the late hour, we stayed.","Despite of it was late, we stayed.","Although the late hour, we stayed."],1,"Despite + substantivo."],["'Actually' significa:",["Atualmente","Na verdade","Atual","Ativamente"],1,"Actually = na verdade. Atualmente = currently."],["'Eventually' significa:",["Eventualmente","Por fim, finalmente","Às vezes","Talvez"],1,"Eventually = no final, finalmente."]]),
L("Pronúncia real: connected speech, acento e entonação",`<h4>Por que você entende o professor mas não o filme</h4>
<p>Na fala real, as palavras se juntam, sons desaparecem e as palavras sem importância ficam muito fracas. Treinar esses fenômenos melhora tanto o listening quanto a fala.</p>
<h4>Fenômenos do connected speech</h4>
<table><tr><th>Fenômeno</th><th>O que acontece</th><th>Exemplo</th></tr>
<tr><td>linking</td><td>Consoante final liga na vogal seguinte</td><td>turn it off → "tur-ni-toff"; pick it up → "pi-ki-tup"</td></tr>
<tr><td>elision</td><td>T e d somem entre consoantes</td><td>next day → "nex day"; I don't know → "I dunno"</td></tr>
<tr><td>assimilation</td><td>Sons se transformam</td><td>did you → "didju"; would you → "wudju"; got you → "gotcha"</td></tr>
<tr><td>flap t (EUA)</td><td>T entre vogais soa como r brando</td><td>water → "wórer"; better → "bérer"; a lot of → "alórov"</td></tr>
<tr><td>weak forms</td><td>Palavras funcionais ficam fracas, com som "schwa" /ə/</td><td>to → "tə", for → "fər", and → "ən", of → "əv", can → "kən"</td></tr></table>
<h4>Reduções que você vai ouvir sempre</h4>
<p><i>gonna</i> (going to), <i>wanna</i> (want to), <i>gotta</i> (got to), <i>kinda</i> (kind of), <i>lemme</i> (let me), <i>gimme</i> (give me), <i>whatcha</i> (what are you), <i>shoulda</i> (should have), <i>y'all</i> (you all, sul dos EUA).</p>
<h4>Acento da palavra (word stress)</h4>
<p>Errar a sílaba tônica atrapalha mais do que errar um som. <i>PHOtograph, phoTOGraphy, photoGRAPHic</i>. <i>DEvelop</i> é "di-VÉ-lop". <i>comfortable</i> = "KÂMF-tə-bəl" (3 sílabas). Substantivo × verbo: <i>a REcord / to reCORD, a PREsent / to preSENT, an INcrease / to inCREASE</i>.</p>
<h4>Acento da frase e entonação</h4>
<ul><li>Destacam-se as palavras de conteúdo (substantivos, verbos, adjetivos): <i>I WANT to GO to the BEACH toMORrow.</i></li>
<li>Mudar o acento muda o sentido: <i>I didn't SAY she stole it</i> (mas pensei) × <i>I didn't say SHE stole it</i> (outra pessoa).</li>
<li>Perguntas wh- descem no fim; perguntas sim/não sobem.</li></ul>
<h4>Como treinar</h4>
<ol><li><b>Shadowing</b>: ouça uma frase e repita junto, imitando ritmo e melodia.</li>
<li>Grave-se e compare com o original.</li>
<li>Use YouGlish (youglish.com) para ouvir qualquer palavra em milhares de vídeos reais.</li></ol>`,

L("Escrita: e-mails, mensagens e registro",`<h4>Formal × semiformal × informal</h4>
<table><tr><th>Parte</th><th>Formal</th><th>Semiformal</th><th>Informal</th></tr>
<tr><td>Saudação</td><td>Dear Mr. Smith, / Dear Sir or Madam,</td><td>Dear John, / Hello John,</td><td>Hi John! / Hey!</td></tr>
<tr><td>Abertura</td><td>I am writing to inquire about...</td><td>I hope you're doing well. I'm writing about...</td><td>How's it going?</td></tr>
<tr><td>Pedido</td><td>I would be grateful if you could...</td><td>Could you please...?</td><td>Can you...?</td></tr>
<tr><td>Anexo</td><td>Please find attached...</td><td>I've attached...</td><td>Here's the file.</td></tr>
<tr><td>Fecho</td><td>I look forward to hearing from you.</td><td>Let me know if you have any questions.</td><td>Talk soon!</td></tr>
<tr><td>Despedida</td><td>Yours sincerely, / Yours faithfully,</td><td>Best regards, / Kind regards,</td><td>Cheers, / Best,</td></tr></table>
<p><i>Yours faithfully</i> (UK) quando você não sabe o nome; <i>Yours sincerely</i> quando sabe.</p>
<h4>Tipos de e-mail do dia a dia</h4>
<ul><li><b>Pedido de informação</b>: <i>I'm interested in your course and would like to know more about the schedule and fees.</i></li>
<li><b>Reclamação</b>: fatos, impacto e solução esperada: <i>I ordered... on May 3rd. Unfortunately, it arrived damaged. I would appreciate a replacement or a full refund.</i></li>
<li><b>Desculpa</b>: <i>I'm sorry for the delay in replying. I apologize for any inconvenience.</i></li>
<li><b>Follow-up</b>: <i>I'm just following up on my previous e-mail regarding...</i></li>
<li><b>Agradecimento</b>: <i>Thank you so much for your help with... I really appreciate it.</i></li></ul>
<h4>Regras de clareza</h4>
<ol><li>Assunto específico: <i>Question about invoice #4521</i>, não "Hello".</li>
<li>Primeira frase diz o objetivo.</li>
<li>Parágrafos curtos, uma ideia por parágrafo.</li>
<li>Peça a ação explicitamente, com prazo se houver.</li>
<li>Releia procurando erros de brasileiro: "I'm writing you" (escreva <i>to you</i>), "informations", "doubt" para "question".</li></ol>
<h4>Doubt × question</h4>
<p>"I have a doubt" soa estranho. Para "tenho uma dúvida" diga <i>I have a question</i>. <i>Doubt</i> é desconfiança: <i>I doubt he'll come.</i></p>
<h4>Mensagens curtas</h4>
<p>Abreviações informais: <i>ASAP</i> (as soon as possible), <i>FYI</i> (for your information), <i>BTW</i> (by the way), <i>TBH</i> (to be honest), <i>LMK</i> (let me know), <i>IMO</i> (in my opinion), <i>BRB</i> (be right back). Evite em e-mails formais.</p>`,
["Formal: Dear Mr./Ms., I would be grateful if..., Yours sincerely","Assunto específico e objetivo na primeira frase","Please find attached / I've attached","I have a question (não 'a doubt')","ASAP, FYI, LMK só no informal"],

L("Listening autêntico: séries, podcasts e notícias",`<h4>Os 3 tipos de escuta</h4>
<table><tr><th>Tipo</th><th>Objetivo</th><th>Como fazer</th></tr>
<tr><td>Extensiva</td><td>Volume e prazer</td><td>Séries, vídeos, podcasts sem parar, aceitando não entender tudo</td></tr>
<tr><td>Intensiva</td><td>Entender cada palavra</td><td>Trechos de 1-2 min, várias vezes, com transcrição</td></tr>
<tr><td>Ativa (shadowing)</td><td>Falar como nativo</td><td>Repetir junto com o áudio</td></tr></table>
<h4>O método das 5 escutas (para 1 trecho por dia)</h4>
<ol><li>Ouça sem texto e anote a ideia geral.</li>
<li>Ouça de novo e anote palavras-chave.</li>
<li>Leia a transcrição e procure o que não entendeu.</li>
<li>Ouça lendo junto.</li>
<li>Ouça sem texto: agora você entende tudo.</li></ol>
<h4>Legendas: a progressão certa</h4>
<p>Português → inglês com legenda em inglês → inglês sem legenda. Ficar sempre na legenda em português treina leitura em português, não listening.</p>
<h4>Fontes por nível</h4>
<table><tr><th>Nível</th><th>Fontes</th></tr>
<tr><td>A2-B1</td><td>BBC Learning English (6 Minute English), VOA Learning English, ESL Pod, Easy English (YouTube), séries como Friends e Modern Family</td></tr>
<tr><td>B1-B2</td><td>TED-Ed, Kurzgesagt, podcasts como All Ears English e The English We Speak, séries como The Office, Brooklyn 99</td></tr>
<tr><td>B2-C1</td><td>TED Talks, The Daily (NYT), BBC Global News, documentários, séries dramáticas, stand-up comedy</td></tr>
<tr><td>C1-C2</td><td>Debates, entrevistas longas, rádio britânica, filmes sem legenda, sotaques variados (escocês, australiano, indiano)</td></tr></table>
<h4>Estratégias quando você não entende</h4>
<ul><li>Foque nas palavras acentuadas: elas carregam o sentido.</li>
<li>Use o contexto: quem fala, onde, por quê.</li>
<li>Reduza a velocidade para 0,75x no YouTube só em treino intensivo.</li>
<li>Não pause a cada palavra na escuta extensiva.</li></ul>
<h4>Ferramentas</h4>
<p>Language Reactor (extensão para Netflix/YouTube com legenda dupla), LingQ, YouGlish, Elsa Speak (pronúncia), e assistentes de IA com voz para conversar.</p>`,

MOD("ing","C1 · Precisão e estilo","Usar estruturas sofisticadas com controle: inversões, ênfase, orações reduzidas, registro formal e linguagem diplomática.",[
L("Inversão para ênfase",`<h4>O que é</h4>
<p>Em textos formais e discursos, coloca-se uma expressão negativa ou restritiva no início e inverte-se sujeito e auxiliar, como numa pergunta. O efeito é dramático e enfático.</p>
<table><tr><th>Expressão</th><th>Exemplo</th><th>Normal</th></tr>
<tr><td>Never (before)</td><td>Never have I seen such a beautiful place.</td><td>I have never seen...</td></tr>
<tr><td>Rarely / Seldom</td><td>Rarely do we get this kind of opportunity.</td><td>We rarely get...</td></tr>
<tr><td>Not only... but also</td><td>Not only did she win, but she also broke the record.</td><td>She not only won...</td></tr>
<tr><td>No sooner... than</td><td>No sooner had I arrived than it started raining.</td><td>As soon as I arrived...</td></tr>
<tr><td>Hardly / Scarcely... when</td><td>Hardly had we sat down when the phone rang.</td><td>We had just sat down...</td></tr>
<tr><td>Under no circumstances</td><td>Under no circumstances should you open this door.</td><td>You shouldn't open it at all.</td></tr>
<tr><td>Only then / Only after / Only when</td><td>Only when I left did I realize how much I loved it.</td><td>I realized only when...</td></tr>
<tr><td>Not until</td><td>Not until the end did he tell the truth.</td><td>He didn't tell the truth until...</td></tr>
<tr><td>Little</td><td>Little did they know what was coming.</td><td>They didn't know...</td></tr>
<tr><td>At no time</td><td>At no time was the public informed.</td><td>The public was never informed.</td></tr>
<tr><td>So + adjetivo</td><td>So difficult was the test that few passed.</td><td>The test was so difficult that...</td></tr>
<tr><td>Such</td><td>Such was the noise that we couldn't sleep.</td><td>The noise was so loud...</td></tr></table>
<h4>Regra do auxiliar</h4>
<p>Se não houver auxiliar, use <b>do/does/did</b>: <i>Rarely does he complain. Not only did they lie...</i> Em <i>Only when...</i> e <i>Not until...</i>, a inversão acontece na <b>segunda</b> oração: <i>Only when I saw the photo did I remember.</i></p>
<h4>Inversões condicionais (revisão)</h4>
<p><i>Had I known... / Were it not for your help... / Should you have any questions...</i></p>
<h4>Inversão após advérbios de lugar (literário)</h4>
<p><i>Here comes the bus. There goes my chance. On the hill stood an old castle. Down came the rain.</i> Com pronome não há inversão: <i>Here it comes.</i></p>
<h4>Quando usar</h4>
<p>Discursos, redações de exame (IELTS, Cambridge), textos persuasivos e narrativas. Na conversa do dia a dia soa teatral, exceto em expressões fixas (<i>Little did I know..., Not only that, but...</i>).</p>`,
["Expressão negativa no início + auxiliar + sujeito","Never have I seen... / Rarely do we...","Sem auxiliar: do/does/did (Not only did she...)","Only when / Not until: inversão na 2ª oração","Use em textos formais e discursos"],

L("Cleft sentences e outras estruturas de ênfase",`<h4>It-cleft: It is/was ... that/who</h4>
<p>Destaca um elemento da frase: <i>John broke the window</i> →</p>
<ul><li><i>It was John who broke the window</i> (foi o John, não outra pessoa).</li>
<li><i>It was the window that John broke</i> (foi a janela, não a porta).</li>
<li><i>It was yesterday that it happened.</i></li></ul>
<h4>Wh-cleft (pseudo-cleft): What... is/was</h4>
<p><i>I need a holiday → What I need is a holiday.</i> <i>What I love about this city is the food. What surprised me was his reaction. What we did was call the police</i> (com ação: what + sujeito + do... is/was + verbo).</p>
<p>Variações: <i>All I want is some peace</i> (tudo que eu quero). <i>The thing that worries me is the cost. The reason why I left is... The place where we met was...</i></p>
<h4>Do/does/did enfático</h4>
<p>Em frases afirmativas, para contrastar ou insistir: <i>I do like your idea, but it's too expensive. She did call you, I saw her! Do sit down</i> (formal: por favor, sente-se).</p>
<h4>Fronting (antecipação)</h4>
<p><i>That I can't accept. Strange as it may seem, I enjoyed it. Tired though she was, she kept going.</i></p>
<h4>Palavras de reforço</h4>
<table><tr><th>Função</th><th>Exemplos</th></tr>
<tr><td>Com negativas</td><td>not at all, not in the least, by no means, whatsoever (I have no idea whatsoever)</td></tr>
<tr><td>Com wh-</td><td>What on earth are you doing? Why ever did you do that? Who the heck...? (informal)</td></tr>
<tr><td>reflexivos</td><td>I did it myself. The building itself is ugly, but the view is great.</td></tr>
<tr><td>very como adjetivo</td><td>That's the very book I was looking for (exatamente esse).</td></tr></table>
<h4>Comparação com o português</h4>
<p>Em português usamos muito a ordem das palavras ("Isso eu não aceito") e "é que" ("Foi ele que quebrou"). O inglês tem ordem mais rígida, por isso depende dessas estruturas para dar ênfase. Usá-las bem é marca de nível C1.</p>`,
["It was John who... (destaca quem)","What I need is... (destaca o quê)","All I want is... / The thing that...","Do/did enfático: I do like it","whatsoever, on earth, the very para reforço"],

L("Participle clauses e orações reduzidas",`<h4>O que são</h4>
<p>Orações que usam particípio (-ing ou -ed) no lugar de sujeito + verbo completo. Deixam o texto mais elegante e conciso. Muito usadas em textos escritos, notícias e redações de exame.</p>
<h4>Particípio presente (-ing): sentido ativo</h4>
<ul><li>Tempo: <i>Walking home, I saw an accident</i> (= While I was walking).</li>
<li>Causa: <i>Feeling tired, she went to bed early</i> (= Because she felt).</li>
<li>Resultado: <i>The storm hit the city, causing major damage</i> (= and caused).</li>
<li>Relativa: <i>The man sitting next to me was a pilot</i> (= who was sitting).</li></ul>
<h4>Particípio passado (-ed/3ª coluna): sentido passivo</h4>
<ul><li><i>Built in 1890, the theater is the oldest in the city</i> (= It was built).</li>
<li><i>The cars made in this factory are exported</i> (= that are made).</li>
<li><i>If heated, the metal expands</i> (= if it is heated).</li></ul>
<h4>Perfect participle: having + particípio</h4>
<p>Ação concluída antes da outra: <i>Having finished the report, he went home</i> (= After he had finished). <i>Having been warned, we took precautions.</i></p>
<h4>O erro clássico: dangling participle</h4>
<p>O sujeito implícito tem que ser o mesmo da oração principal. Errado: <i>"Walking down the street, the trees were beautiful"</i> (as árvores estavam andando?). Certo: <i>Walking down the street, I noticed the beautiful trees.</i></p>
<h4>Com conjunções</h4>
<p><i>After leaving school, she traveled. Before signing, read the contract. While waiting, I read a book. When asked, he refused to comment. Once opened, keep refrigerated.</i></p>
<h4>Orações reduzidas com infinitivo</h4>
<p><i>He was the first person to arrive. She was the last to leave. There's nothing to worry about. I have a lot of work to do.</i></p>
<h4>Quando usar</h4>
<p>Escrita formal, relatórios, instruções e narrativas. Na fala, use com moderação: <i>Having said that, ...</i> e <i>Speaking of which, ...</i> são expressões fixas muito naturais.</p>`,
["-ing = sentido ativo; -ed = passivo","Feeling tired, she left (causa)","Built in 1890, the theater... (passiva reduzida)","Having finished, he left (ação anterior)","Evite dangling: o sujeito implícito precisa ser o mesmo"],

L("Registro formal, subjuntivo e linguagem impessoal",`<h4>Subjuntivo em inglês</h4>
<p>Depois de verbos e expressões de exigência, sugestão ou importância, usa-se o <b>verbo base</b> para todas as pessoas (sem -s, sem to):</p>
<p><i>I suggest that he <b>be</b> informed. The doctor recommended that she <b>rest</b>. It is essential that everyone <b>arrive</b> on time. They insisted that he <b>pay</b>.</i></p>
<p>Verbos: <i>suggest, recommend, insist, demand, require, request, propose, ask</i>. Expressões: <i>It is essential / vital / important / crucial / necessary that...</i> Britânicos muitas vezes usam <i>should</i>: <i>I suggest that he should be informed.</i></p>
<p>Formas fixas: <i>God save the King. Long live... Be that as it may... If need be... Suffice it to say...</i></p>
<h4>Características do registro formal</h4>
<table><tr><th>Informal</th><th>Formal</th></tr>
<tr><td>get</td><td>obtain, receive, become</td></tr>
<tr><td>need</td><td>require</td></tr>
<tr><td>help</td><td>assist</td></tr>
<tr><td>start / end</td><td>commence / conclude</td></tr>
<tr><td>enough</td><td>sufficient</td></tr>
<tr><td>a lot of</td><td>a considerable amount of / numerous</td></tr>
<tr><td>about</td><td>regarding, concerning, with regard to</td></tr>
<tr><td>so</td><td>therefore, consequently</td></tr>
<tr><td>but</td><td>however, nevertheless</td></tr>
<tr><td>I think</td><td>It could be argued that...</td></tr>
<tr><td>Sorry</td><td>We apologize for any inconvenience.</td></tr></table>
<h4>Linguagem impessoal</h4>
<ul><li>Passiva: <i>It has been decided that...</i></li>
<li>It + adjetivo: <i>It is recommended that... It is worth noting that...</i></li>
<li>There + be: <i>There is evidence that...</i></li>
<li>Nominalização: transformar verbos em substantivos: <i>We analyzed the data carefully → A careful analysis of the data was carried out. The price increased → There was an increase in price.</i></li></ul>
<h4>Contrações e phrasal verbs</h4>
<p>Em textos formais evite contrações (<i>do not</i>, não <i>don't</i>) e prefira verbos latinos aos phrasal verbs. Mas não exagere: inglês formal moderno valoriza clareza (Plain English). Frases curtas e voz ativa continuam sendo virtudes.</p>`,
["Subjuntivo: I suggest that he be / she rest (verbo base)","It is essential that everyone arrive...","require, assist, obtain, regarding: vocabulário formal","Nominalização: an increase in price","Formal não é complicado: clareza acima de tudo"],

L("Elipse, substituição e coesão",`<h4>Por que estudar</h4>
<p>Nativos evitam repetir palavras. Saber substituir e omitir deixa sua fala natural e seus textos coesos. É um dos critérios de avaliação de coesão no IELTS e nos exames Cambridge.</p>
<h4>Substituição com one / ones</h4>
<p><i>I don't like this shirt. Can I see the blue one? These shoes are old; I need new ones. Which one do you want? – The big one.</i></p>
<h4>Substituição com so e not</h4>
<p><i>– Is it going to rain? – I think so / I hope so / I'm afraid so / I suppose so. – I don't think so / I hope not / I'm afraid not / Probably not.</i> Errado: "I think yes".</p>
<h4>Substituição com do / do so</h4>
<p><i>She speaks French better than I do. I was asked to leave and I did so immediately. – Did you lock the door? – Yes, I did.</i></p>
<h4>Elipse (omitir o que já se entende)</h4>
<ul><li>Depois de auxiliares: <i>I can't swim, but my sister can. – Have you finished? – Not yet, but I will soon.</i></li>
<li>Infinitivo reduzido a to: <i>– Would you like to come? – I'd love to. I didn't want to go, but I had to.</i></li>
<li>Conversa: <i>(Do you) Want some coffee? (I'll) See you later. (It) Sounds good.</i></li></ul>
<h4>Referência</h4>
<p><i>this, that, these, those, it, such, the former / the latter</i> (o primeiro / o último): <i>I visited Rome and Paris. The former was hot; the latter was rainy. Such behavior is unacceptable.</i></p>
<h4>Coesão lexical</h4>
<p>Em vez de repetir a mesma palavra, use sinônimos, termos gerais e paráfrases: <i>The government announced a new tax. The measure / This decision / The policy will affect...</i></p>
<h4>Conectores de coesão em parágrafos</h4>
<p><i>As mentioned above, In this regard, With this in mind, Bearing this in mind, In light of this, That being said, On top of that, Following on from this</i>.</p>`,
["one/ones substituem substantivos","I think so / I hope not (nunca 'I think yes')","Elipse: I can't, but she can. I'd love to.","the former / the latter","Varie palavras: the measure, this decision"],

L("Hedging e diplomacia: suavizar sem perder clareza",`<h4>O que é hedging</h4>
<p>Suavizar afirmações para soar educado, cauteloso ou acadêmico. Brasileiros costumam soar diretos demais em inglês (ou indiretos demais). Saber dosar é competência C1.</p>
<h4>Ferramentas de hedging</h4>
<table><tr><th>Recurso</th><th>Exemplos</th></tr>
<tr><td>Modais</td><td>may, might, could, would: This could be a problem.</td></tr>
<tr><td>Verbos</td><td>seem, appear, tend to, suggest, indicate: It seems that... The data suggests...</td></tr>
<tr><td>advérbios</td><td>probably, possibly, perhaps, arguably, apparently, relatively, somewhat</td></tr>
<tr><td>quantificadores</td><td>some, many, most, a number of (em vez de "all")</td></tr>
<tr><td>Frases introdutórias</td><td>To some extent... / In some cases... / It could be argued that... / As far as I know...</td></tr></table>
<h4>Linguagem diplomática</h4>
<table><tr><th>Direto demais</th><th>Diplomático</th></tr>
<tr><td>You're wrong.</td><td>I'm not sure that's quite right. / I see it a bit differently.</td></tr>
<tr><td>That's a bad idea.</td><td>I'm not sure that would work. / Have we considered...?</td></tr>
<tr><td>I want...</td><td>I was wondering if... / Would it be possible to...?</td></tr>
<tr><td>You didn't do it.</td><td>It seems this hasn't been done yet.</td></tr>
<tr><td>No.</td><td>I'm afraid that won't be possible. / That might be difficult.</td></tr>
<tr><td>It's expensive.</td><td>It's a little more than we expected.</td></tr>
<tr><td>Hurry up.</td><td>Could we try to speed things up a bit?</td></tr></table>
<h4>Técnicas</h4>
<ul><li>Passado de distância: <i>I was hoping you could... I wanted to ask...</i> (mais suave que presente).</li>
<li>Continuous: <i>I'm wondering whether...</i></li>
<li>Negativa + adjetivo positivo: <i>not very good</i> em vez de <i>bad</i>; <i>not ideal</i>.</li>
<li>Minimizadores: <i>a bit, slightly, just, a little</i>.</li>
<li>Perguntas em vez de ordens: <i>Shall we...? How about...? Would you mind...?</i></li></ul>
<h4>Diferenças culturais</h4>
<p>Britânicos usam muito o eufemismo ("<i>quite good</i>" pode significar "razoável"; "<i>with all due respect</i>" muitas vezes precede uma crítica forte). Americanos são mais diretos mas valorizam o positivo ("<i>Great job, one thing I'd change is...</i>"). Em qualquer caso, seja claro sobre o ponto principal.</p>`,
["Hedging: may, seem, tend to, arguably","I see it a bit differently (em vez de You're wrong)","I was wondering if... (passado de distância)","a bit, slightly, not ideal para suavizar","Britânicos: eufemismo; americanos: positivo primeiro"],

]);

MOD("ing","C1 · Inglês acadêmico e profissional","Escrever ensaios, apresentar, debater, ampliar vocabulário acadêmico e ler textos complexos com segurança.",[
L("Escrevendo ensaios argumentativos",`<h4>Estrutura clássica (4-5 parágrafos)</h4>
<ol><li><b>Introdução</b>: contextualize o tema, parafraseie a pergunta e apresente sua tese (thesis statement).</li>
<li><b>Desenvolvimento 1</b>: primeiro argumento + explicação + exemplo.</li>
<li><b>Desenvolvimento 2</b>: segundo argumento + explicação + exemplo.</li>
<li><b>Contra-argumento</b> (opcional): reconheça a outra visão e refute.</li>
<li><b>Conclusão</b>: retome a tese com outras palavras e encerre com uma reflexão ou recomendação. Sem ideias novas.</li></ol>
<h4>Parágrafo PEEL</h4>
<table><tr><th>Letra</th><th>Parte</th><th>Exemplo</th></tr>
<tr><td>P</td><td>Point (frase-tópico)</td><td>Remote work significantly improves quality of life.</td></tr>
<tr><td>E</td><td>Explain</td><td>Employees save hours of commuting, which can be spent on family or rest.</td></tr>
<tr><td>E</td><td>Example / Evidence</td><td>For instance, studies have shown that remote workers report lower stress levels.</td></tr>
<tr><td>L</td><td>Link</td><td>Therefore, flexibility benefits both workers and their families.</td></tr></table>
<h4>Tipos de pergunta de ensaio</h4>
<ul><li><b>Opinion</b> (To what extent do you agree?): tome posição clara.</li>
<li><b>Discussion</b> (Discuss both views and give your opinion): apresente os dois lados.</li>
<li><b>Advantages/disadvantages</b>.</li>
<li><b>Problem/solution</b>: causas e soluções.</li></ul>
<h4>Frases úteis</h4>
<p>Introdução: <i>It is often argued that... / In recent years, there has been growing concern about... / This essay will argue that...</i></p>
<p>Desenvolvimento: <i>The main reason is that... / Another significant factor is... / This is illustrated by... / A clear example of this is...</i></p>
<p>Contra-argumento: <i>Opponents of this view claim that... / While it is true that..., ... / Admittedly,... ; nevertheless,...</i></p>
<p>Conclusão: <i>In conclusion, / All things considered, / On balance, / Taking everything into account, ...</i></p>
<h4>Erros que derrubam a nota</h4>
<ul><li>Começar com "Nowadays, technology is very important" (genérico demais).</li>
<li>Opinião vaga ou que muda ao longo do texto.</li>
<li>Exemplos pessoais demais em ensaio acadêmico.</li>
<li>Repetir as palavras da pergunta em vez de parafrasear.</li>
<li>Usar "I think" em todo parágrafo.</li></ul>`,
["Introdução com tese clara; conclusão sem ideias novas","Parágrafo PEEL: Point, Explain, Example, Link","Identifique o tipo de pergunta","While it is true that..., ... para contra-argumentar","Parafraseie a pergunta; evite abertura genérica"],
`Pergunta: "Some people think social media does more harm than good. To what extent do you agree?" Tese: <i>"While social media has made communication easier, this essay argues that its negative effects on mental health and the spread of misinformation outweigh its benefits."</i>`,
`Escreva um ensaio de 280 palavras respondendo: "Some say that learning a foreign language is no longer necessary because of AI translators. Discuss both views and give your opinion." Peça a uma IA uma avaliação com base nos critérios do IELTS.`,
[["O que é a 'thesis statement'?",["O título","A frase que apresenta sua posição central","A última palavra","Um exemplo"],1,"A tese resume o que o ensaio defende."],["A conclusão deve:",["Trazer novos argumentos","Retomar a tese sem ideias novas","Repetir a introdução palavra por palavra","Fazer perguntas sem resposta"],1,"Conclusão retoma e encerra."],["Para contra-argumentar:",["While it is true that..., ...","Because yes.","I think I think.","Nowadays is important."],0,"Reconhece o outro lado antes de refutar."]]),
L("Apresentações e falar em público",`<h4>Estrutura</h4>
<table><tr><th>Parte</th><th>Frases úteis</th></tr>
<tr><td>Abertura e gancho</td><td>Good morning, everyone. Thank you for being here. Let me start with a question: ... / Imagine that...</td></tr>
<tr><td>Objetivo</td><td>Today I'd like to talk about... / The purpose of this talk is to...</td></tr>
<tr><td>Roteiro</td><td>I've divided my talk into three parts. First, I'll... Then... Finally...</td></tr>
<tr><td>Transições</td><td>Moving on to... / This brings me to my next point. / Now let's look at... / Having covered X, let's turn to Y.</td></tr>
<tr><td>Gráficos</td><td>As you can see, ... / This chart shows... / Sales rose sharply / dropped slightly / remained stable / peaked in June.</td></tr>
<tr><td>Ênfase</td><td>What's really important here is... / I'd like to stress that... / Let me make this clear.</td></tr>
<tr><td>Resumo</td><td>To sum up, / Let me recap the main points.</td></tr>
<tr><td>Encerramento</td><td>Thank you for your attention. I'd be happy to take any questions.</td></tr></table>
<h4>Descrevendo tendências</h4>
<p>Verbos: <i>increase, rise, grow, go up, climb, soar, rocket</i> (subir muito); <i>decrease, fall, drop, decline, go down, plunge, plummet</i> (cair muito); <i>stay the same, remain stable, level off, fluctuate, peak, hit a low</i>. Advérbios: <i>dramatically, sharply, significantly, steadily, gradually, slightly</i>. <i>Prices rose by 10% (diferença) to $50 (valor final).</i></p>
<h4>Respondendo perguntas</h4>
<ul><li>Agradecer: <i>That's a great question. Thanks for asking.</i></li>
<li>Esclarecer: <i>If I understand correctly, you're asking...</i></li>
<li>Não sabe: <i>I'm not sure off the top of my head, but I'll find out and get back to you.</i></li>
<li>Fora do tema: <i>That's a bit outside the scope of today's talk, but I'm happy to discuss it later.</i></li></ul>
<h4>Técnicas de oratória</h4>
<ul><li>Regra de três: <i>It's faster, cheaper and safer.</i></li>
<li>Pausas antes de pontos importantes.</li>
<li>Frases curtas; um ponto por slide.</li>
<li>Contato visual e ritmo: ~130-150 palavras por minuto.</li>
<li>Ensaiar em voz alta pelo menos 3 vezes, gravando.</li></ul>
<h4>Nervosismo em outra língua</h4>
<p>Decore as primeiras e as últimas frases. Tenha "frases de resgate": <i>Let me put it another way. What I mean is...</i> Erros pequenos não importam; clareza e estrutura importam.</p>`,
["Gancho → objetivo → roteiro → pontos → resumo → perguntas","Moving on to... / This brings me to...","rise sharply, drop slightly, remain stable, peak","by (diferença) × to (valor final)","I'll get back to you on that"],

L("Debates, argumentação e pensamento crítico",`<h4>Estrutura de um bom argumento</h4>
<p><b>Claim</b> (afirmação) + <b>Reason</b> (por quê) + <b>Evidence</b> (prova) + <b>Impact</b> (por que importa): <i>Cities should invest in bike lanes (claim) because they reduce traffic (reason). Copenhagen cut car use significantly after expanding its network (evidence), which means cleaner air and healthier citizens (impact).</i></p>
<h4>Linguagem de debate</h4>
<table><tr><th>Função</th><th>Expressões</th></tr>
<tr><td>Apresentar posição</td><td>I'd argue that... / My position is that... / I'm convinced that...</td></tr>
<tr><td>Apoiar</td><td>There's strong evidence that... / Research shows... / Take, for example,...</td></tr>
<tr><td>Interromper educadamente</td><td>Sorry to interrupt, but... / If I could just come in here... / Can I add something?</td></tr>
<tr><td>Manter a palavra</td><td>If I could just finish... / Let me finish my point.</td></tr>
<tr><td>Refutar</td><td>That may be true, but... / I take your point; however... / That argument overlooks... / The problem with that is...</td></tr>
<tr><td>Conceder</td><td>Fair enough. / You've got a point there. / I'll grant you that.</td></tr>
<tr><td>Esclarecer</td><td>Are you saying that...? / Could you elaborate on that?</td></tr>
<tr><td>Resumir</td><td>So, the key issue here is... / At the end of the day,...</td></tr></table>
<h4>Falácias lógicas (reconheça e nomeie)</h4>
<ul><li><b>Ad hominem</b>: atacar a pessoa, não o argumento.</li>
<li><b>Straw man</b>: distorcer o argumento do outro para atacá-lo.</li>
<li><b>False dilemma</b>: "ou isso ou aquilo", ignorando outras opções.</li>
<li><b>Slippery slope</b>: "se permitirmos X, vai acontecer Z" sem provas.</li>
<li><b>Hasty generalization</b>: conclusão a partir de poucos casos.</li>
<li><b>Appeal to popularity</b>: "todo mundo faz, então está certo".</li>
<li><b>Correlation vs causation</b>: duas coisas juntas não significam que uma causa a outra.</li></ul>
<p><i>That's a straw man: I never said we should ban cars. / Correlation doesn't imply causation.</i></p>
<h4>Pensamento crítico em inglês</h4>
<p>Perguntas para avaliar qualquer afirmação: <i>What's the source? Is it biased? What evidence supports it? Are there other explanations? What's missing?</i> Isso vale para notícias, para debates e para respostas de IA.</p>`,
["Claim + Reason + Evidence + Impact","I take your point; however...","Sorry to interrupt, but... / If I could just finish...","Falácias: straw man, ad hominem, false dilemma","Correlation doesn't imply causation"],
`<i>"– We should ban phones in schools. – I take your point, but a total ban seems extreme. – Are you saying they're useful in class? – In some cases, yes. That's a false dilemma: it's not ban or chaos; we could set clear rules."</i>`,

L("Vocabulário acadêmico e formação de palavras",`<h4>Academic Word List (AWL)</h4>
<p>Lista de 570 famílias de palavras que aparecem em todos os textos acadêmicos, independente da área. Boa notícia: a maioria tem origem latina e é parecida com o português. Exemplos: <i>analyze, approach, assess, assume, concept, consist, constitute, context, data, define, derive, distribute, establish, estimate, evident, factor, function, identify, indicate, interpret, involve, issue, method, occur, percent, period, policy, principle, procedure, process, require, research, respond, role, section, significant, source, specific, structure, theory, vary</i>.</p>
<h4>Formação de palavras: prefixos</h4>
<table><tr><th>Prefixo</th><th>Sentido</th><th>Exemplos</th></tr>
<tr><td>un-, in-, im-, il-, ir-, dis-</td><td>Negação</td><td>unlikely, inefficient, impossible, illegal, irrelevant, disagree</td></tr>
<tr><td>mis-</td><td>Errado</td><td>misunderstand, misinterpret, mislead</td></tr>
<tr><td>over- / under-</td><td>Demais / de menos</td><td>overestimate, underpaid</td></tr>
<tr><td>re-</td><td>De novo</td><td>reconsider, rebuild</td></tr>
<tr><td>pre- / post-</td><td>Antes / depois</td><td>predict, postpone</td></tr>
<tr><td>co-, inter-, multi-, trans-</td><td>Junto, entre, muitos, através</td><td>cooperate, interact, multinational, transform</td></tr></table>
<h4>Sufixos: mudando a classe da palavra</h4>
<table><tr><th>Verbo</th><th>Substantivo</th><th>Adjetivo</th><th>Advérbio</th></tr>
<tr><td>analyze</td><td>analysis</td><td>analytical</td><td>analytically</td></tr>
<tr><td>develop</td><td>development</td><td>developmental</td><td>—</td></tr>
<tr><td>succeed</td><td>success</td><td>successful</td><td>successfully</td></tr>
<tr><td>vary</td><td>variety, variation</td><td>various, variable</td><td>variably</td></tr>
<tr><td>create</td><td>creation, creativity</td><td>creative</td><td>creatively</td></tr>
<tr><td>depend</td><td>dependence</td><td>dependent, dependable</td><td>dependently</td></tr>
<tr><td>signify</td><td>significance</td><td>significant</td><td>significantly</td></tr></table>
<p>Sufixos de substantivo: <i>-tion, -ment, -ness, -ity, -ance/-ence, -ship, -hood</i>. De adjetivo: <i>-ful, -less, -ous, -ive, -able/-ible, -al, -ic</i>. De verbo: <i>-ize, -ify, -en</i> (widen, strengthen).</p>
<h4>Falsos cognatos acadêmicos</h4>
<p><i>actual</i> = real (não "Atual"); <i>assist</i> = ajudar; <i>attend</i> = participar, frequentar (não "atender"); <i>library</i> = biblioteca; <i>lecture</i> = palestra, aula (não "leitura"); <i>college</i> = faculdade (não colégio); <i>realize</i> = perceber; <i>resume</i> = retomar (currículo é <i>résumé/CV</i>); <i>argument</i> = discussão ou argumento.</p>`,
["Academic Word List: 570 famílias essenciais","un-, in-, dis-, mis-, over-, under-, re-","analyze → analysis → analytical → analytically","-tion, -ment, -ness, -ity formam substantivos","actual = real; attend = frequentar; lecture = palestra"],
`<i>"The researchers analyzed the data and identified a significant variation between regions. Their analysis indicates that economic development depends on several factors, particularly education."</i>`,
`Coloque 60 palavras da AWL no Anki com sua família completa (verbo, substantivo, adjetivo, advérbio). Escreva um parágrafo de 150 palavras sobre um tema de sua escolha usando 20 delas.`,

L("Leitura de textos complexos",`<h4>Estratégias de leitura</h4>
<table><tr><th>Estratégia</th><th>Para quê</th><th>Como</th></tr>
<tr><td>Skimming</td><td>Ideia geral rápida</td><td>Leia título, subtítulos, primeira e última frase de cada parágrafo</td></tr>
<tr><td>Scanning</td><td>Achar informação específica</td><td>Procure números, nomes, palavras-chave sem ler tudo</td></tr>
<tr><td>Leitura detalhada</td><td>Entender argumentos e nuances</td><td>Frase a frase, anotando conectores e opiniões</td></tr>
<tr><td>Leitura crítica</td><td>Avaliar o texto</td><td>Quem escreveu, para quem, com que intenção, com que evidência</td></tr></table>
<h4>Inferindo palavras pelo contexto</h4>
<ol><li>Qual é a classe da palavra (verbo, substantivo, adjetivo)?</li>
<li>Há prefixo ou sufixo conhecido?</li>
<li>O contexto dá pista de sentido positivo ou negativo?</li>
<li>Há sinônimo ou explicação perto (<i>i.e., that is, or, such as</i>)?</li></ol>
<p>Só consulte o dicionário se a palavra for essencial para entender o trecho ou aparecer várias vezes.</p>
<h4>Identificando a atitude do autor</h4>
<p>Palavras que revelam opinião: <i>arguably, admittedly, surprisingly, unfortunately, so-called</i> (ironia, "suposto"), <i>claim</i> (dúvida), <i>reveal</i> (confirmação), <i>fail to</i> (crítica). Compare: <i>The study shows... × The study claims...</i></p>
<h4>Fatos × opiniões × hipóteses</h4>
<ul><li>Fato: <i>The population reached 8 billion in 2022.</i></li>
<li>Opinião: <i>This is the most important challenge of our time.</i></li>
<li>Hipótese: <i>This may lead to food shortages.</i></li></ul>
<h4>Gêneros e onde treinar</h4>
<table><tr><th>Gênero</th><th>Fontes</th></tr>
<tr><td>Notícias</td><td>BBC News, Reuters, AP News, The Guardian</td></tr>
<tr><td>Análise e opinião</td><td>The Economist, The Atlantic, New Yorker</td></tr>
<tr><td>Ciência popular</td><td>Scientific American, New Scientist, Aeon</td></tr>
<tr><td>Livros</td><td>Edições graded readers (B2-C1) e depois originais; comece por não ficção do seu interesse</td></tr></table>
<h4>Meta de volume</h4>
<p>Ler ao menos 1 artigo longo por dia e 1 livro por mês em inglês é o que leva do B2 ao C1. Leitura é a maior fonte de vocabulário depois do A2.</p>`,
["Skimming (geral), scanning (específico), detalhada, crítica","Infira palavras pela classe, afixos e contexto","claim (dúvida) × show/reveal (confirmação)","Separe fato, opinião e hipótese","1 artigo por dia + 1 livro por mês"],
`Ao ler <i>"The so-called miracle diet has failed to deliver the results its creators claimed"</i>, as palavras <i>so-called</i>, <i>failed to</i> e <i>claimed</i> mostram que o autor é cético.`,
`Leia 5 artigos desta semana (um de cada fonte da tabela). Para cada um: resuma em 3 frases, liste 5 palavras inferidas pelo contexto e classifique 3 frases como fato, opinião ou hipótese.`,
[["Para achar uma data num texto longo, use:",["skimming","scanning","Leitura crítica","Tradução"],1,"Scanning = busca de informação específica."],["'The so-called expert' indica que o autor:",["Admira o especialista","Duvida que seja especialista","Não tem opinião","Está confuso"],1,"So-called sugere ironia ou ceticismo."],["Qual frase é hipótese?",["The bridge was built in 1974.","This may cause delays.","This is the worst idea ever.","The population is 200 million."],1,"May indica possibilidade."]]),
L("Entrevistas e conversas formais em inglês",`<h4>Perguntas clássicas e como estruturar</h4>
<table><tr><th>Pergunta</th><th>Estrutura da resposta</th></tr>
<tr><td>Tell me about yourself.</td><td>Presente (quem você é) → passado (trajetória relevante) → futuro (por que está aqui). 60-90 segundos.</td></tr>
<tr><td>What are your strengths?</td><td>2-3 forças + exemplo concreto de cada.</td></tr>
<tr><td>What's your greatest weakness?</td><td>Fraqueza real, não crítica + o que você faz para melhorar.</td></tr>
<tr><td>Why do you want this position?</td><td>O que você admira + como suas habilidades se encaixam.</td></tr>
<tr><td>Where do you see yourself in five years?</td><td>Crescimento e aprendizado alinhados à oportunidade.</td></tr>
<tr><td>Do you have any questions for us?</td><td>Sempre tenha 2-3 perguntas preparadas.</td></tr></table>
<h4>Método STAR para perguntas de comportamento</h4>
<p>"Tell me about a time when you..." → <b>S</b>ituation (contexto), <b>T</b>ask (seu papel), <b>A</b>ction (o que você fez, com "I", não "we"), <b>R</b>esult (resultado, de preferência com números).</p>
<p><i>"Last year, our volunteer group was losing members (S). As coordinator, I had to turn this around (T). I created a monthly event and a WhatsApp group to keep people engaged (A). Within six months, participation doubled (R)."</i></p>
<h4>Verbos de ação para falar de conquistas</h4>
<p><i>achieved, managed, led, organized, improved, reduced, increased, launched, developed, implemented, coordinated, solved, trained, negotiated, delivered</i>.</p>
<h4>Frases para ganhar tempo e esclarecer</h4>
<p><i>That's a great question; let me think for a moment. Just to make sure I understand, are you asking about...? Could you rephrase that, please?</i></p>
<h4>Small talk inicial e encerramento</h4>
<p><i>– How are you today? – Very well, thank you. Thanks for having me. – Did you find us easily? – Yes, no problem at all.</i> Encerrar: <i>Thank you for your time. I really enjoyed our conversation. I look forward to hearing from you.</i></p>
<h4>Conversas formais em geral</h4>
<p>O mesmo vale para reuniões com escolas, bancos, consulados e médicos: chegue com perguntas escritas, use frases de esclarecimento e resuma no fim: <i>So, just to recap, the next step is...</i></p>`,
["Tell me about yourself: presente → passado → futuro","STAR: Situation, Task, Action, Result","Fale 'I' nas ações, não 'we'","achieved, led, improved, reduced, implemented","Just to recap, the next step is..."],
`<i>"I'm a highly organized person who loves solving problems. Over the past few years I've coordinated several community projects and improved processes along the way. Now I'm looking for an opportunity to keep growing and contribute to a team like yours."</i>`,
`Escreva e grave respostas para as 6 perguntas clássicas e para 3 perguntas STAR ("a time when you solved a problem / worked under pressure / disagreed with someone"). Treine com uma IA de voz fazendo o papel do entrevistador.`,
[["No STAR, o 'A' significa:",["Answer","Action","Ability","Achievement"],1,"Action: o que você fez."],["Na parte Action, prefira:",["we","they","I","the team"],2,"Mostre o que você fez."],["Fechamento adequado:",["OK bye.","Thank you for your time. I look forward to hearing from you.","Call me.","That's all folks."],1,"Fechamento profissional."]])
]);

MOD("ing","C2 · Naturalidade nativa","Entender e usar idioms, gírias, humor, ironia e as variedades do inglês, evitando os erros típicos de brasileiros.",[
L("Idioms essenciais e como usá-los",`<h4>O que são</h4>
<p>Expressões cujo sentido não sai das palavras: <i>It's raining cats and dogs</i> (chove muito). Nativos usam idioms o tempo todo, especialmente na fala e no jornalismo. No C2 você precisa entender centenas e usar com naturalidade algumas dezenas, sem exagerar.</p>
<h4>Idioms de alta frequência</h4>
<table><tr><th>Idiom</th><th>Sentido</th></tr>
<tr><td>break the ice</td><td>Quebrar o gelo</td></tr><tr><td>a piece of cake</td><td>Muito fácil, moleza</td></tr>
<tr><td>hit the nail on the head</td><td>Acertar em cheio</td></tr><tr><td>cost an arm and a leg</td><td>Custar os olhos da cara</td></tr>
<tr><td>once in a blue moon</td><td>Muito raramente</td></tr><tr><td>under the weather</td><td>Meio doente, indisposto</td></tr>
<tr><td>the ball is in your court</td><td>A decisão é sua</td></tr><tr><td>let the cat out of the bag</td><td>Revelar um segredo</td></tr>
<tr><td>call it a day</td><td>Encerrar por hoje</td></tr><tr><td>get cold feet</td><td>amarelar, ficar com medo</td></tr>
<tr><td>beat around the bush</td><td>Enrolar, fazer rodeios</td></tr><tr><td>bite off more than you can chew</td><td>Abraçar mais do que pode</td></tr>
<tr><td>on the same page</td><td>De acordo, alinhados</td></tr><tr><td>the elephant in the room</td><td>O problema óbvio que ninguém menciona</td></tr>
<tr><td>a blessing in disguise</td><td>Um mal que veio para bem</td></tr><tr><td>cut corners</td><td>Economizar fazendo malfeito</td></tr>
<tr><td>keep an eye on</td><td>Ficar de olho</td></tr><tr><td>miss the boat</td><td>Perder a oportunidade</td></tr>
<tr><td>pull someone's leg</td><td>Brincar, zoar alguém</td></tr><tr><td>sit on the fence</td><td>Ficar em cima do muro</td></tr>
<tr><td>spill the beans</td><td>Contar tudo</td></tr><tr><td>the last straw</td><td>A gota d'água</td></tr>
<tr><td>through thick and thin</td><td>Nas horas boas e ruins</td></tr><tr><td>up in the air</td><td>Indefinido</td></tr>
<tr><td>when pigs fly</td><td>No dia de São Nunca</td></tr><tr><td>go the extra mile</td><td>Fazer além do esperado</td></tr>
<tr><td>back to square one</td><td>Voltar à estaca zero</td></tr><tr><td>a drop in the ocean</td><td>Uma gota no oceano</td></tr>
<tr><td>see eye to eye</td><td>Concordar plenamente</td></tr><tr><td>by the skin of your teeth</td><td>Por um triz</td></tr></table>
<h4>Equivalentes com o português</h4>
<p>Alguns são quase iguais (<i>the tip of the iceberg</i> = a ponta do iceberg); outros mudam totalmente (<i>to have a frog in your throat</i> = estar rouco). Traduzir idioms ao pé da letra é a origem de erros engraçados: "to give birth to a chicken" não é "pagar o pato" (que é <i>to take the blame / to pay the price</i>).</p>
<h4>Como usar sem soar forçado</h4>
<ul><li>Prefira idioms comuns e atuais; os antigos soam caricatos (<i>It's raining cats and dogs</i> é pouco usado).</li>
<li>Um ou dois por conversa bastam.</li>
<li>Use exatamente a forma fixa: <i>a piece of cake</i>, não "a slice of cake".</li>
<li>Aprenda observando: séries, podcasts, artigos de opinião.</li></ul>`,
["Idioms têm sentido não literal","a piece of cake, the last straw, up in the air","Não traduza idioms do português ao pé da letra","Forma fixa: não troque palavras","Use poucos e atuais, observe nativos"],
`<i>"The exam was a piece of cake, but the interview was the last straw: they kept beating around the bush about the salary. Anyway, the ball is in their court now."</i>`,
`Coloque os 30 idioms no Anki com uma situação real sua em cada. Assista a um episódio de série anotando todos os idioms que aparecerem e pesquise os que você não conhecia.`,
[["'A gota d'água':",["the last drop","the last straw","the final water","a drop in the ocean"],1,"The last straw."],["'Under the weather' significa:",["Muito feliz","Meio doente","Debaixo da chuva","Atrasado"],1,"Indisposto, adoentado."],["'Ficar em cima do muro':",["sit on the fence","sit on the wall","stay up the wall","hit the wall"],0,"Sit on the fence."]]),
L("Linguagem coloquial, gírias e o inglês da internet",`<h4>Registros da fala informal</h4>
<table><tr><th>Gíria / coloquial</th><th>Sentido</th><th>Onde</th></tr>
<tr><td>awesome, cool, sick, lit</td><td>Incrível</td><td>Geral / jovem</td></tr>
<tr><td>chill / laid-back</td><td>Tranquilo</td><td>Geral</td></tr>
<tr><td>hang out</td><td>Passar tempo juntos</td><td>Geral</td></tr>
<tr><td>broke</td><td>Sem dinheiro, duro</td><td>Geral</td></tr>
<tr><td>bucks / quid</td><td>Dólares / libras</td><td>EUA / UK</td></tr>
<tr><td>mate / buddy / dude</td><td>Amigo, cara</td><td>UK-AUS / EUA / EUA</td></tr>
<tr><td>knackered / beat</td><td>Exausto</td><td>UK / EUA</td></tr>
<tr><td>gutted</td><td>Muito decepcionado</td><td>UK</td></tr>
<tr><td>to bail</td><td>Furar, cancelar em cima da hora</td><td>EUA</td></tr>
<tr><td>no big deal</td><td>Nada demais</td><td>Geral</td></tr>
<tr><td>my bad</td><td>Foi mal</td><td>EUA</td></tr>
<tr><td>I'm down</td><td>Topo, estou dentro</td><td>EUA</td></tr>
<tr><td>to binge-watch</td><td>maratonar séries</td><td>Geral</td></tr>
<tr><td>a rip-off</td><td>Roubo, preço abusivo</td><td>Geral</td></tr>
<tr><td>to crash (at someone's place)</td><td>Dormir na casa de alguém</td><td>Geral</td></tr>
<tr><td>to be into something</td><td>Curtir algo</td><td>Geral</td></tr></table>
<h4>Gírias da internet e da geração Z</h4>
<p><i>low-key</i> (discretamente, meio que), <i>high-key</i> (abertamente), <i>no cap</i> (sem mentira), <i>it's giving...</i> (tem vibe de...), <i>slay</i> (arrasar), <i>vibe</i>, <i>sus</i> (suspeito), <i>GOAT</i> (greatest of all time), <i>FOMO</i> (medo de ficar de fora), <i>ghosting</i> (sumir sem explicação), <i>cringe</i> (vergonha alheia), <i>to flex</i> (ostentar), <i>salty</i> (irritado, ressentido), <i>tea</i> (fofoca), <i>main character energy</i>. Gírias mudam rápido: entenda, mas use com cuidado.</p>
<h4>Palavrões e linguagem ofensiva</h4>
<p>É importante entender o peso das palavras para não ofender. Em inglês, insultos ligados a etnia, religião, orientação e deficiência são extremamente graves. Palavrões comuns em séries soam muito mais pesados ditos por um estrangeiro num contexto errado. Na dúvida, não use. Versões suaves: <i>darn, shoot, heck, freaking, gosh</i>.</p>
<h4>Interjeições e sons</h4>
<p><i>Ugh</i> (irritação), <i>Phew</i> (alívio), <i>Oops</i> (erro), <i>Yikes</i> (susto, constrangimento), <i>Meh</i> (indiferença), <i>Huh?</i> (o quê?), <i>Uh-huh</i> (sim), <i>Uh-uh</i> (não), <i>Hmm</i> (pensando), <i>Aww</i> (fofura), <i>Ouch</i> (dor), <i>Wow</i>.</p>
<h4>Fillers e vagueza natural</h4>
<p><i>like, you know, I mean, sort of, kind of, and stuff, or something, whatever, and so on</i>: <i>We just hung out and watched movies and stuff.</i> Usados com moderação, deixam a fala natural.</p>`,
["broke, beat/knackered, my bad, I'm down","low-key, no cap, sus, FOMO, ghosting, cringe","Gírias mudam rápido: entenda, use com cuidado","Ofensas ligadas a grupos são gravíssimas","Fillers naturais: and stuff, or something"],

L("Variedades do inglês: americano, britânico e mais",`<h4>Vocabulário diferente</h4>
<table><tr><th>EUA</th><th>Reino Unido</th><th>Português</th></tr>
<tr><td>apartment</td><td>flat</td><td>Apartamento</td></tr>
<tr><td>elevator</td><td>lift</td><td>Elevador</td></tr>
<tr><td>truck</td><td>lorry</td><td>Caminhão</td></tr>
<tr><td>gas</td><td>petrol</td><td>Gasolina</td></tr>
<tr><td>cookie</td><td>biscuit</td><td>Biscoito</td></tr>
<tr><td>fries / chips</td><td>chips / crisps</td><td>Batata frita / chips</td></tr>
<tr><td>vacation</td><td>holiday</td><td>Férias</td></tr>
<tr><td>sidewalk</td><td>pavement</td><td>Calçada</td></tr>
<tr><td>subway</td><td>underground / tube</td><td>Metrô</td></tr>
<tr><td>check / bill</td><td>bill</td><td>Conta (restaurante)</td></tr>
<tr><td>line</td><td>queue</td><td>Fila</td></tr>
<tr><td>trash / garbage</td><td>rubbish</td><td>Lixo</td></tr>
<tr><td>cell phone</td><td>mobile</td><td>Celular</td></tr>
<tr><td>first floor</td><td>ground floor</td><td>Térreo</td></tr>
<tr><td>pants</td><td>trousers (pants = cueca!)</td><td>Calça</td></tr>
<tr><td>soccer</td><td>football</td><td>Futebol</td></tr></table>
<h4>Ortografia</h4>
<p><i>color/colour, center/centre, organize/organise, traveled/travelled, program/programme, defense/defence, gray/grey, check/cheque, tire/tyre</i>. Escolha um padrão e seja consistente no mesmo texto.</p>
<h4>Gramática</h4>
<ul><li>UK usa mais present perfect: <i>I've just eaten</i> (EUA aceita <i>I just ate</i>).</li>
<li><i>have got</i> (UK) × <i>have</i> (EUA): <i>Have you got a car? / Do you have a car?</i></li>
<li>Coletivos: UK aceita plural (<i>The team are playing</i>), EUA prefere singular.</li>
<li>Preposições: <i>on the weekend</i> (EUA) × <i>at the weekend</i> (UK); <i>different from/than</i> (EUA) × <i>different from/to</i> (UK).</li>
<li>Particípio: <i>gotten</i> (EUA) × <i>got</i> (UK).</li></ul>
<h4>Pronúncia</h4>
<p>Americano: R sempre pronunciado (<i>car</i>), flap t (<i>water</i> "wórer"), <i>a</i> curto em <i>can't, dance, bath</i>. Britânico padrão: R final mudo (<i>car</i> "káa"), t claro, <i>a</i> longo (<i>can't</i> "káant"). Outros sotaques: australiano (vogais diferentes, <i>mate</i> soa "mait"), irlandês, escocês, indiano, sul-africano, nigeriano. Hoje a maioria dos falantes de inglês do mundo não é nativa: ser entendido importa mais que soar nativo.</p>
<h4>Inglês como língua global</h4>
<p>Em contextos internacionais, prefira frases claras, evite gírias locais e idioms muito regionais e fale um pouco mais devagar. Isso é chamado de "international English" e é uma habilidade, não uma limitação.</p>`,
["apartment/flat, elevator/lift, line/queue","pants (EUA calça) × pants (UK cueca)","color/colour, center/centre: seja consistente","on the weekend (EUA) × at the weekend (UK)","Clareza internacional > sotaque nativo"],
`Em Londres: <i>"Excuse me, where's the queue for the lift? I need to get to the ground floor."</i> Em Nova York: <i>"Excuse me, where's the line for the elevator? I need to get to the first floor."</i>`,
`Assista a 10 minutos de um programa britânico e 10 de um americano e liste 15 diferenças de vocabulário, pronúncia ou gramática. Decida qual variedade você vai adotar na escrita e revise um texto seu para torná-lo consistente.`,
[["'Fila' no Reino Unido:",["line","queue","row","cue"],1,"Queue (UK); line (EUA)."],["'Pants' no Reino Unido significa:",["Calça","Cueca","shorts","Casaco"],1,"No UK pants é roupa íntima; calça é trousers."],["Ortografia britânica:",["color","colour","colr","coulor"],1,"UK: colour; EUA: color."]]),
L("Humor, ironia, sarcasmo e registro",`<h4>Por que humor é difícil</h4>
<p>Humor depende de jogos de palavras, referências culturais, timing e tom de voz. Entender piadas e ironia é um dos últimos marcos de domínio de uma língua.</p>
<h4>Tipos de humor em inglês</h4>
<table><tr><th>Tipo</th><th>Exemplo</th></tr>
<tr><td>Pun (trocadilho)</td><td>I used to be a banker, but I lost interest. (interest = juros / interesse)</td></tr>
<tr><td>Understatement (britânico)</td><td>Durante uma tempestade: "It's a bit windy today."</td></tr>
<tr><td>Self-deprecation</td><td>"I'm not saying I'm bad at cooking, but my smoke alarm cheers me on."</td></tr>
<tr><td>Deadpan</td><td>Dizer algo absurdo com cara séria</td></tr>
<tr><td>Hyperbole</td><td>"I've told you a million times."</td></tr></table>
<h4>Ironia e sarcasmo</h4>
<p>Dizer o contrário do que se pensa, com tom característico (lento, exagerado): <i>Oh, great. Another meeting. Just what I needed.</i> / <i>Nice weather we're having</i> (debaixo de chuva). Pistas: entonação, contexto e expressões como <i>Oh, wonderful / Yeah, right / Tell me about it / Thanks a lot</i>.</p>
<p><i>Yeah, right</i> = não acredito. <i>Tell me about it</i> = nem me fale (concordância). <i>I could care less</i> (EUA, informal) = não me importo (apesar da lógica, significa o mesmo que <i>I couldn't care less</i>).</p>
<h4>Registro: escolher o tom certo</h4>
<table><tr><th>Muito formal</th><th>Neutro</th><th>Informal</th><th>Muito informal</th></tr>
<tr><td>I regret to inform you that...</td><td>Unfortunately,...</td><td>Sorry, but...</td><td>Bad news, mate...</td></tr>
<tr><td>Would you be so kind as to...?</td><td>Could you...?</td><td>Can you...?</td><td>Gimme...</td></tr>
<tr><td>I am delighted to accept.</td><td>I'd be happy to.</td><td>Sure!</td><td>Totally!</td></tr></table>
<p>Erros de registro (formal demais com amigos, informal demais num e-mail de candidatura) chamam mais atenção que erros de gramática no nível C2.</p>
<h4>Cultura e referências</h4>
<p>Muito humor vem de referências: programas antigos, política, celebridades, frases de filmes. Quando não entender, pergunte sem medo: <i>Sorry, I don't get the reference.</i> Explicar uma piada mata a graça, mas aprender referências é parte da fluência cultural.</p>
<h4>Fazendo humor em inglês</h4>
<p>Comece com autodepreciação leve e exagero, que funcionam em qualquer cultura. Evite humor sobre grupos, religião e aparência. Timing: pausa curta antes da parte engraçada.</p>`,
["Pun, understatement, deadpan, self-deprecation","Ironia: tom + contexto (Oh, great.)","Yeah, right = não acredito","Tell me about it = nem me fale","Registro errado chama atenção no C2"],
`<i>"– How was your flight? – Oh, fantastic. A six-hour delay, no food, and a baby kicking my seat. Best day ever. – Tell me about it. Last time they lost my luggage."</i>`,
`Assista a um trecho de stand-up em inglês (com legenda em inglês) e explique por escrito 5 piadas: tipo de humor, jogo de palavras ou referência. Escreva 5 trocadilhos próprios ou adaptados.`,
[["'Yeah, right' geralmente significa:",["Concordo totalmente","Não acredito","Sim, à direita","Correto"],1,"É expressão de ceticismo."],["'It's a bit chilly' numa nevasca é exemplo de:",["hyperbole","understatement","pun","deadpan rule"],1,"Understatement: minimizar algo grande."],["'Tell me about it' expressa:",["Pedido de explicação","Concordância (nem me fale)","Raiva","Pergunta"],1,"Concordância com algo ruim."]]),
L("Nuances de vocabulário e sinônimos",`<h4>Sinônimos nunca são idênticos</h4>
<p>No C2 a diferença está na escolha da palavra exata. Sinônimos variam em intensidade, registro, conotação (positiva/negativa) e colocação.</p>
<h4>Intensidade</h4>
<table><tr><th>Fraco</th><th>Médio</th><th>Forte</th></tr>
<tr><td>like</td><td>love</td><td>adore</td></tr>
<tr><td>dislike</td><td>hate</td><td>loathe, detest</td></tr>
<tr><td>annoyed</td><td>angry</td><td>furious, livid</td></tr>
<tr><td>happy</td><td>delighted</td><td>ecstatic, overjoyed</td></tr>
<tr><td>tired</td><td>exhausted</td><td>drained, worn out</td></tr>
<tr><td>cold</td><td>freezing</td><td>bitterly cold</td></tr></table>
<h4>Conotação</h4>
<table><tr><th>Positiva</th><th>Neutra</th><th>Negativa</th></tr>
<tr><td>slim, slender</td><td>thin</td><td>skinny, scrawny</td></tr>
<tr><td>confident</td><td>sure of oneself</td><td>arrogant, cocky</td></tr>
<tr><td>thrifty, frugal</td><td>careful with money</td><td>stingy, cheap</td></tr>
<tr><td>determined</td><td>persistent</td><td>stubborn, pig-headed</td></tr>
<tr><td>curious</td><td>interested</td><td>nosy</td></tr>
<tr><td>assertive</td><td>direct</td><td>pushy, aggressive</td></tr></table>
<h4>Verbos de olhar, falar e andar</h4>
<ul><li><b>Olhar</b>: <i>glance</i> (olhada rápida), <i>stare</i> (encarar), <i>gaze</i> (contemplar), <i>glare</i> (olhar com raiva), <i>peer</i> (espiar com esforço), <i>glimpse</i> (ver de relance).</li>
<li><b>Falar</b>: <i>whisper, mutter, mumble, shout, yell, scream, stammer, ramble</i> (divagar), <i>blurt out</i> (soltar sem pensar).</li>
<li><b>Andar</b>: <i>stroll</i> (passear), <i>wander</i> (vagar), <i>march, stride, stumble</i> (tropeçar), <i>tiptoe, rush, dash, limp</i> (mancar), <i>sneak</i> (sair de fininho).</li></ul>
<h4>Pares confusos</h4>
<p><i>affect</i> (verbo) × <i>effect</i> (substantivo); <i>imply</i> (o falante insinua) × <i>infer</i> (o ouvinte deduz); <i>economic</i> (da economia) × <i>economical</i> (econômico, que poupa); <i>historic</i> (marcante) × <i>historical</i> (do passado); <i>continuous</i> (sem parar) × <i>continual</i> (repetido); <i>complement</i> (completar) × <i>compliment</i> (elogio); <i>principal</i> (principal, diretor) × <i>principle</i> (princípio); <i>lie/lay</i>; <i>rise/raise</i>.</p>
<h4>Ferramentas</h4>
<p>Thesaurus com exemplos (Merriam-Webster, Collins), dicionário de inglês para inglês (Oxford Learner's, Cambridge, Longman), corpus de frases reais (YouGlish, Ludwig) e IA para comparar nuances: "Qual a diferença entre stubborn e determined, com exemplos?"</p>`,

L("Falsos cognatos e erros típicos de brasileiros",`<h4>Falsos cognatos que mais confundem</h4>
<table><tr><th>Inglês</th><th>Significa</th><th>Para dizer em inglês...</th></tr>
<tr><td>pretend</td><td>Fingir</td><td>pretender = intend</td></tr>

<tr><td>parents</td><td>Pais</td><td>Parentes = relatives</td></tr>
<tr><td>costume</td><td>Fantasia</td><td>costume = habit, custom</td></tr>
<tr><td>novel</td><td>Romance (livro)</td><td>novela = soap opera</td></tr>

<tr><td>sensible</td><td>Sensato</td><td>Sensível = sensitive</td></tr>
<tr><td>assume</td><td>Supor</td><td>Assumir (responsabilidade) = take on</td></tr>

<tr><td>data</td><td>Dados</td><td>data = date</td></tr>
<tr><td>fabric</td><td>Tecido</td><td>Fábrica = factory</td></tr>

<tr><td>appointment</td><td>Compromisso, consulta</td><td>Apontamento = note</td></tr>
<tr><td>discussion</td><td>Conversa, debate</td><td>Discussão (briga) = argument</td></tr></table>
<h4>Erros clássicos de estrutura</h4>
<table><tr><th>Errado</th><th>Certo</th></tr>
<tr><td>I have 30 years.</td><td>I'm 30.</td></tr>
<tr><td>Have a lot of people here.</td><td>There are a lot of people here.</td></tr>

<tr><td>She explained me the problem.</td><td>She explained the problem to me.</td></tr>

<tr><td>It depends of you.</td><td>It depends on you.</td></tr>
<tr><td>I'm married with her.</td><td>I'm married to her.</td></tr>

<tr><td>I'll call you when I will arrive.</td><td>I'll call you when I arrive.</td></tr>
<tr><td>Is necessary to study.</td><td>It's necessary to study.</td></tr>
<tr><td>Look the car!</td><td>Look at the car!</td></tr>
<tr><td>I went to home.</td><td>I went home.</td></tr></table>
<h4>Sujeito obrigatório</h4>
<p>Em português omitimos o sujeito ("Está chovendo", "É importante"). Em inglês, sempre há sujeito: <i>It's raining. It's important. It seems that...</i></p>

MOD("ing","C2 · Domínio total","Consolidar o domínio: literatura e mídia, escrita refinada, fala espontânea, certificação C2 e um plano para manter o inglês para sempre.",[
L("Literatura, cultura e leitura por prazer",`<h4>Por que ler literatura no C2</h4>
<p>Literatura traz o vocabulário mais rico da língua, estruturas variadas, metáforas e referências culturais que aparecem em conversas, filmes e jornais. É também o melhor teste de domínio: entender ironia, subtexto e estilo.</p>
<h4>Progressão sugerida</h4>
<table><tr><th>Etapa</th><th>Tipo de leitura</th><th>Exemplos de autores e obras</th></tr>
<tr><td>1</td><td>Ficção contemporânea direta</td><td>Agatha Christie, Roald Dahl (contos adultos), Kazuo Ishiguro (Never Let Me Go), Andy Weir</td></tr>
<tr><td>2</td><td>Romances modernos premiados</td><td>George Orwell (1984, Animal Farm), Harper Lee, John Steinbeck, Chimamanda Ngozi Adichie</td></tr>
<tr><td>3</td><td>Clássicos do século XIX</td><td>Jane Austen, Charles Dickens, Mark Twain, Oscar Wilde</td></tr>
<tr><td>4</td><td>Poesia e teatro</td><td>Shakespeare (com edição comentada), Emily Dickinson, Robert Frost</td></tr></table>
<h4>Como ler sem travar</h4>
<ul><li>Escolha livros que você leria em português.</li>
<li>Leia o primeiro capítulo com dicionário; depois, só procure palavras que se repetem.</li>
<li>Use Kindle com dicionário integrado e marcação de palavras.</li>
<li>Combine com audiolivro: ler ouvindo melhora pronúncia e ritmo.</li>
<li>Faça um registro: título, 5 expressões novas e um parágrafo de opinião.</li></ul>
<h4>Elementos literários em inglês</h4>
<p><i>plot</i> (enredo), <i>setting</i> (cenário), <i>character</i>, <i>protagonist</i>, <i>narrator</i> (first-person, third-person, unreliable narrator), <i>theme</i>, <i>tone</i>, <i>foreshadowing</i> (prenúncio), <i>flashback</i>, <i>climax</i>, <i>twist</i>, <i>metaphor, simile</i> (comparação com like/as), <i>symbolism, irony, satire, allegory</i>.</p>
<h4>Expressões que vieram de Shakespeare e da Bíblia</h4>
<p>Muitas expressões do dia a dia nasceram de textos antigos e de domínio público: <i>break the ice, wild-goose chase, in a pickle, wear your heart on your sleeve, all that glitters is not gold</i> (Shakespeare); <i>the writing on the wall, a good Samaritan, the salt of the earth, an eye for an eye</i> (Bíblia). Conhecê-las ajuda a entender jornais e discursos.</p>
<h4>Cultura além dos livros</h4>
<p>Séries premiadas, filmes clássicos, podcasts de história, stand-up e jornalismo longo (long-form) completam a imersão cultural. O objetivo do C2 é entender não só a língua, mas o que as pessoas querem dizer com ela.</p>`,
["Literatura = vocabulário rico + referências culturais","Comece por ficção contemporânea direta","Leia + ouça o audiolivro junto","plot, setting, unreliable narrator, foreshadowing","Expressões de Shakespeare e da Bíblia estão por toda parte"],
`Registro de leitura: <i>"Animal Farm – George Orwell. Expressions: to cast a vote, to stir up, to be on the brink of. Opinion: a short allegory that shows how power can corrupt ideals. Very relevant today."</i>`,
`Escolha e comece um livro da etapa 1 ou 2 com audiolivro. Leia 20 páginas por semana e faça o registro de cada capítulo. Ao terminar, grave uma resenha de 3 minutos.`,
[["'Foreshadowing' é:",["Um tipo de sombra","Um prenúncio de algo que vai acontecer","O fim da história","O narrador"],1,"Pista antecipada de eventos futuros."],["Um narrador em quem não se pode confiar é:",["first-person narrator","unreliable narrator","omniscient narrator","main character"],1,"Unreliable narrator."],["'Simile' é uma comparação que usa:",["like ou as","Sempre números","Verbos no passado","Só adjetivos"],0,"Ex.: as brave as a lion."]]),
L("Notícias, política, economia e ciência",`<h4>Vocabulário de notícias</h4>
<p>Manchetes usam linguagem compacta: presente simples para passado (<i>President signs deal</i>), infinitivo para futuro (<i>Minister to resign</i>), sem artigos e verbos de ligação (<i>Fire in city center: 3 injured</i>). Palavras curtas típicas: <i>bid</i> (tentativa), <i>clash</i> (conflito), <i>curb</i> (limitar), <i>probe</i> (investigação), <i>row</i> (briga, UK), <i>slam</i> (criticar duramente), <i>vow</i> (prometer), <i>axe</i> (cortar), <i>boost</i> (impulsionar), <i>hike</i> (aumento).</p>
<h4>Política e governo</h4>
<p><i>election, poll</i> (pesquisa), <i>ballot, turnout</i> (comparecimento), <i>campaign, candidate, incumbent</i> (atual ocupante), <i>bill</i> (projeto de lei), <i>to pass a law, to veto, legislation, Congress / Parliament, the Senate, the House, opposition, coalition, landslide victory, policy</i> (política pública) × <i>politics</i> (atividade política), <i>to step down, to impeach, grassroots</i>.</p>
<h4>Economia e finanças</h4>
<table><tr><th>Termo</th><th>Sentido</th></tr>
<tr><td>inflation / deflation</td><td>Inflação / deflação</td></tr>
<tr><td>interest rate</td><td>Taxa de juros</td></tr>
<tr><td>GDP</td><td>PIB</td></tr>
<tr><td>recession / downturn / recovery</td><td>Recessão / desaceleração / recuperação</td></tr>
<tr><td>unemployment rate</td><td>Taxa de desemprego</td></tr>
<tr><td>stock market / shares / bonds</td><td>Bolsa / ações / títulos</td></tr>
<tr><td>budget deficit / surplus</td><td>Déficit / superávit</td></tr>
<tr><td>cost of living</td><td>Custo de vida</td></tr>
<tr><td>to cut / raise taxes</td><td>Cortar / aumentar impostos</td></tr>
<tr><td>bull / bear market</td><td>Mercado em alta / em baixa</td></tr></table>
<h4>Ciência, tecnologia e meio ambiente</h4>
<p><i>study, findings, peer-reviewed, sample, evidence, breakthrough</i> (descoberta importante), <i>clinical trial, vaccine, climate change, global warming, emissions, renewable energy, carbon footprint, biodiversity, drought, flood, artificial intelligence, data privacy, cybersecurity</i>.</p>
<h4>Ler notícias com olhar crítico</h4>
<ul><li>Separe reportagem (<i>news report</i>) de opinião (<i>op-ed, editorial, column</i>).</li>
<li>Compare a mesma notícia em veículos de linhas editoriais diferentes.</li>
<li>Note verbos de relato que revelam posição: <i>claim, allege, admit, insist, deny</i>.</li>
<li>Desconfie de manchetes caça-clique (<i>clickbait</i>).</li></ul>
<h4>Rotina C2 de notícias</h4>
<p>10 minutos por dia: um podcast diário de notícias (BBC Global News Podcast, NPR News Now) e um artigo de análise. Uma vez por semana, resuma por escrito a notícia mais importante.</p>`,
["Manchetes: presente = passado; to + verbo = futuro","bid, clash, curb, probe, slam, vow, boost","policy (política pública) × politics","interest rate, GDP, recession, cost of living","claim/allege revelam distância do jornalista"],

`Durante uma semana, leia uma notícia por dia de 3 áreas (política, economia, ciência). Traduza 10 manchetes para frases completas e escreva um resumo semanal de 200 palavras com o vocabulário novo.`,
[["'Minister to resign' significa:",["O ministro renunciou","O ministro vai renunciar","O ministro renuncia sempre","O ministro não renuncia"],1,"To + verbo em manchete indica futuro."],["'Interest rate' é:",["Taxa de interesse","Taxa de juros","Imposto","Inflação"],1,"Interest rate = taxa de juros."],["Diferença entre policy e politics:",["São iguais","policy = política pública; politics = atividade política","policy = polícia","politics = lei"],1,"Policy é a medida; politics é o jogo político."]]),
L("Escrita avançada: estilo, concisão e revisão",`<h4>Princípios de boa escrita em inglês</h4>
<ol><li><b>Clareza primeiro</b>: uma ideia por frase, frases de 15-20 palavras em média.</li>
<li><b>Voz ativa</b> sempre que possível: <i>The team made a decision</i> > <i>A decision was made by the team</i>.</li>
<li><b>Verbos fortes</b> em vez de substantivos: <i>decide</i> > <i>make a decision about</i>; <i>analyze</i> > <i>carry out an analysis of</i>.</li>
<li><b>Cortar palavras vazias</b>: <i>very, really, actually, basically, in order to, due to the fact that</i>.</li>
<li><b>Variar o ritmo</b>: alterne frases curtas e longas.</li></ol>
<h4>Cortando o excesso</h4>
<table><tr><th>Prolixo</th><th>Conciso</th></tr>
<tr><td>due to the fact that</td><td>because</td></tr>
<tr><td>at this point in time</td><td>now</td></tr>
<tr><td>in the event that</td><td>if</td></tr>
<tr><td>a large number of</td><td>many</td></tr>
<tr><td>make an assumption</td><td>assume</td></tr>
<tr><td>it is important to note that</td><td>(corte)</td></tr>
<tr><td>in spite of the fact that</td><td>although</td></tr>
<tr><td>has the ability to</td><td>can</td></tr></table>
<h4>Gêneros que você deve dominar no C2</h4>
<ul><li><b>Resumo</b> (summary): reduzir um texto a 1/4 do tamanho com suas palavras.</li>
<li><b>Resenha</b> (review): descrição + avaliação + recomendação.</li>
<li><b>Artigo</b> (article): título atraente, abertura que prende, tom pessoal.</li>
<li><b>Relatório</b> (report): títulos, objetividade, recomendações.</li>
<li><b>Carta/e-mail formal</b> e <b>ensaio argumentativo</b> (vistos no C1).</li></ul>
<h4>Pontuação que brasileiros erram</h4>
<ul><li>Vírgula antes de <i>which</i> explicativo e depois de conectores iniciais (<i>However,</i>).</li>
<li>Nunca vírgula entre sujeito e verbo.</li>
<li>Oxford comma (opcional, mas consistente): <i>red, white, and blue</i>.</li>
<li>Apóstrofo: <i>it's</i> × <i>its</i>, <i>the 1990s</i> (sem apóstrofo).</li>
<li>Títulos em inglês costumam ter maiúsculas nas palavras principais (Title Case).</li></ul>
<h4>Processo de revisão em 3 passadas</h4>
<ol><li><b>Estrutura</b>: o argumento está claro? A ordem faz sentido?</li>
<li><b>Frases</b>: cortar excessos, voz ativa, conectores variados.</li>
<li><b>Correção</b>: gramática, ortografia, pontuação; leia em voz alta.</li></ol>
<p>Use IA como revisora, não como autora: peça "aponte os erros e explique, sem reescrever". Assim você aprende em vez de terceirizar.</p>`,
["Clareza, voz ativa e verbos fortes","Corte: due to the fact that → because","Resumo, resenha, artigo, relatório","Vírgula depois de However; nunca entre sujeito e verbo","Revise em 3 passadas; IA aponta, você corrige"],

[["Versão concisa de 'in the event that':",["in case of that","if","when that","in event"],1,"In the event that = if."],["Qual frase é mais clara?",["A decision was made by us.","We decided.","A decision has been taken by our team members.","The making of a decision occurred."],1,"Voz ativa e verbo forte."],["Pontuação correta:",["However we left early.","However, we left early.","However; we, left early.","However we, left early."],1,"Vírgula depois de conector inicial."]]),
L("Fala espontânea e pensar em inglês",`<h4>O que é fluência de verdade</h4>
<p>Fluência não é falar rápido nem sem erros: é falar sem traduzir mentalmente, recuperar-se de erros sem travar e adaptar o tom ao contexto. Isso se treina com volume de fala e com estratégias.</p>
<h4>Como parar de traduzir</h4>
<ul><li><b>Monólogo interno</b>: narre mentalmente o que você faz: <i>Now I'm making coffee. I need to call the bank later.</i></li>
<li><b>Diário em voz alta</b>: 3 minutos por dia falando do seu dia, gravando.</li>
<li><b>Definir em vez de traduzir</b>: se não sabe a palavra, descreva (<i>the thing you use to...</i>).</li>
<li><b>Chunks</b>: aprenda blocos prontos (<i>to be honest, as far as I know, it depends on</i>) que saem automáticos.</li>
<li>Configure celular, computador e redes em inglês.</li></ul>
<h4>Técnicas para falar por 2 minutos sobre qualquer tema</h4>
<p>Estrutura <b>PREP</b>: <b>P</b>oint (opinião) → <b>R</b>eason → <b>E</b>xample → <b>P</b>oint (retoma). Ou passado-presente-futuro: como era, como é, como será.</p>
<h4>Recuperação e reformulação</h4>
<p><i>What I mean is... / Let me rephrase that. / Or rather... / Sorry, I meant... / How shall I put it? / It's on the tip of my tongue. / I can't think of the word, but it's like...</i></p>
<h4>Parceiros de prática</h4>
<table><tr><th>Opção</th><th>Vantagem</th></tr>
<tr><td>Professor particular online (iTalki, Preply, Cambly)</td><td>Correção e conversa guiada</td></tr>
<tr><td>Language exchange (Tandem, HelloTalk)</td><td>Gratuito, troca com nativos</td></tr>
<tr><td>Grupos e clubes de conversação</td><td>Várias pessoas e sotaques</td></tr>
<tr><td>Assistentes de IA com voz</td><td>Disponível 24h, sem vergonha, pode simular situações</td></tr>
<tr><td>Falar sozinho gravando</td><td>Treino de fluxo e autoavaliação</td></tr></table>
<h4>Temas de C2 para treinar</h4>
<p>Discutir dilemas éticos, explicar processos complexos, defender pontos de vista impopulares, contar histórias com humor, comentar notícias, comparar culturas, especular sobre o futuro. Cada um exige estruturas e vocabulário diferentes.</p>
<h4>Meta semanal</h4>
<p>Pelo menos 60 minutos de fala real por semana (conversa, aula ou IA) + 3 gravações curtas. Sem volume de fala, o C2 fica só na leitura.</p>`,
