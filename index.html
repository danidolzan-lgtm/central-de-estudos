{n:"Business Writing",o:"Escrever e-mails e mensagens profissionais claras.",a:[
L("Estrutura de e-mails profissionais",`<h4>Estrutura</h4><table><tr><th>Parte</th><th>Exemplos</th></tr><tr><td>Saudação</td><td>Hi John, / Dear Ms. Smith, / Hello team,</td></tr><tr><td>Abertura</td><td>I hope you're well. / Thank you for your email.</td></tr><tr><td>Propósito</td><td>I'm writing to confirm… / I'd like to ask about…</td></tr><tr><td>Detalhes</td><td>frases curtas, um assunto por parágrafo</td></tr><tr><td>Anexo</td><td>Please find attached… / I've attached…</td></tr><tr><td>Pedido</td><td>Could you please…? / I'd appreciate it if you could…</td></tr><tr><td>Próximo passo</td><td>I look forward to hearing from you. / Let me know if you have any questions.</td></tr><tr><td>Despedida</td><td>Best regards, / Kind regards, / Thanks,</td></tr></table>
<h4>Assunto</h4><p>Claro e específico: <i>Pickup confirmation – Order 4521 – Friday 10/3</i>.</p>
<h4>Evite</h4><p>Traduções literais ("I come by means of this"), parágrafos longos, vários pedidos misturados.</p>`,
["Propósito na primeira frase","Please find attached…","Could you please…?","Assunto claro e específico"],
`"Hi Anna, I'm writing to confirm the pickup on Friday at 2 p.m. Please find attached the booking details. Let me know if anything changes. Best regards."`,
`Escreva 3 e-mails: confirmação de coleta, envio de relatório e pedido de informação.`,
[["Frase padrão para anexo:",["Follow the attachment.","Please find attached the report.","See in the attach.","Attached goes."],1,"Forma padrão."],["Onde deve aparecer o propósito do e-mail?",["No fim","Na primeira frase do corpo","No assunto apenas","Em lugar nenhum"],1,"Vá direto ao ponto."]]),
L("Conectivos e clareza",`<table><tr><th>Função</th><th>Conectivos</th></tr><tr><td>Adição</td><td>and, also, in addition, moreover, as well as</td></tr><tr><td>Contraste</td><td>but, however, although, even though, on the other hand</td></tr><tr><td>Causa</td><td>because, since, as, due to, because of</td></tr><tr><td>Consequência</td><td>so, therefore, as a result, consequently</td></tr><tr><td>Exemplo</td><td>for example, for instance, such as</td></tr><tr><td>Sequência</td><td>first, then, after that, finally</td></tr><tr><td>Conclusão</td><td>in summary, overall, to sum up</td></tr></table>
<h4>Cuidados</h4><p><i>because</i> + frase (<i>because it rained</i>); <i>because of / due to</i> + substantivo (<i>due to the rain</i>). <i>However</i> começa frase e leva vírgula: <i>However, the delay continued.</i> <i>Although</i> liga duas ideias: <i>Although it rained, we delivered on time.</i></p>
<h4>Clareza</h4><ul><li>Uma ideia por frase.</li><li>Voz ativa: <i>We sent the report</i>.</li><li>Números concretos.</li><li>Releia antes de enviar.</li></ul>`,
["Adição, contraste, causa, consequência","because + frase; due to + substantivo","However, … no início com vírgula","Uma ideia por frase"],
`"Deliveries were delayed due to heavy rain. However, 92% arrived on time. As a result, we kept the service level above target."`,

L("Reclamações, desculpas e mensagens rápidas",`<h4>Respondendo a uma reclamação</h4><ol><li>Agradeça e reconheça: <i>Thank you for letting us know.</i></li><li>Desculpe-se: <i>We apologize for the inconvenience / the delay.</i></li><li>Explique brevemente: <i>The delay was caused by…</i></li><li>Diga a solução e o prazo: <i>The cargo will be delivered tomorrow by 10 a.m.</i></li><li>Previna: <i>We have reviewed our process to avoid this in the future.</i></li><li>Feche: <i>Please don't hesitate to contact me.</i></li></ol>
<h4>Fazendo uma reclamação</h4><p><i>I'm writing to report a problem with… / Unfortunately, … / We would appreciate it if you could… / Please let us know how you intend to resolve this.</i></p>
<h4>Chat e mensagens</h4><table><tr><th>Mensagem</th><th>Uso</th></tr><tr><td>Quick question: …</td><td>pergunta rápida</td></tr><tr><td>Any update on…?</td><td>pedir status</td></tr><tr><td>On it.</td><td>estou cuidando</td></tr><tr><td>Will do.</td><td>vou fazer</td></tr><tr><td>Sorry for the delay in replying.</td><td>desculpa pela demora</td></tr><tr><td>FYI</td><td>para sua informação</td></tr></table>`,
["Agradecer, desculpar, explicar, solucionar, prevenir","We apologize for the inconvenience","We would appreciate it if you could…","Any update on…? / On it. / FYI"],
`"Thank you for letting us know. We apologize for the delay. The truck had a mechanical problem. Your cargo will be delivered tomorrow by 10 a.m."`,
`Responda em inglês a duas reclamações (atraso e avaria) seguindo os 6 passos.`,

{n:"Grammar B1",o:"Construir frases mais complexas com condicionais, passiva e orações relativas.",a:[
L("Condicionais zero, first e second",`<table><tr><th>Tipo</th><th>Estrutura</th><th>Uso</th><th>Exemplo</th></tr><tr><td>Zero</td><td>If + present, present</td><td>verdades gerais</td><td>If it rains, deliveries take longer.</td></tr><tr><td>First</td><td>If + present, will + verbo</td><td>possibilidade real futura</td><td>If the truck arrives late, we will reschedule.</td></tr><tr><td>Second</td><td>If + past, would + verbo</td><td>hipótese no presente</td><td>If we had another truck, we would deliver today.</td></tr></table>
<h4>Detalhes</h4><ul><li>Nunca will depois de if: <i>If it rains</i> (não "if it will rain").</li><li>Na second, use <i>were</i> para todos: <i>If I were you, I would call him.</i></li><li><i>unless</i> = a menos que: <i>We won't deliver unless they confirm.</i></li><li><i>as long as</i> = desde que.</li></ul>`,
["Zero: verdades; first: real futuro; second: hipótese","Sem will depois de if","If I were you… para conselho","unless = a menos que"],
`"If you confirm the order today, we will pick it up tomorrow. If I were you, I would choose the night route."`,
`Escreva 5 frases de cada condicional sobre a sua operação.`,
[["Complete: If I ___ more time, I would study more.",["have","had","will have","has"],1,"Second conditional: passado."],["Qual está correta?",["If it will rain, we cancel.","If it rains, we will cancel.","If it rain, we will cancel.","If rains, cancel."],1,"First conditional sem will no if."]]),
L("Voz passiva",`<h4>Forma</h4><p>to be + particípio. O foco é a ação ou o objeto, não quem fez.</p><table><tr><th>Tempo</th><th>Passiva</th></tr><tr><td>Present</td><td>Invoices are issued daily.</td></tr><tr><td>Past</td><td>The cargo was delivered yesterday.</td></tr><tr><td>Present perfect</td><td>The order has been shipped.</td></tr><tr><td>Future</td><td>The report will be sent tomorrow.</td></tr><tr><td>Modal</td><td>The form must be signed.</td></tr><tr><td>Continuous</td><td>The truck is being loaded.</td></tr></table>
<h4>Quando usar</h4><ul><li>Quem fez não importa ou é óbvio: <i>The package was damaged.</i></li><li>Textos técnicos e procedimentos: <i>Records shall be retained for two years.</i></li><li>Para soar mais neutro: <i>Mistakes were made.</i></li></ul><p>Quem fez entra com <i>by</i>: <i>The audit was carried out by an external company.</i></p>`,
["to be + particípio","Foco na ação, não em quem fez","Muito usada em procedimentos e relatórios","by + agente quando importar"],
`"Your order has been picked up and will be delivered on Thursday. The POD will be sent by email."`,
`Reescreva 10 frases de um procedimento da empresa na voz passiva.`,
[["Passiva de 'They deliver the cargo':",["The cargo delivers.","The cargo is delivered.","The cargo delivered.","The cargo was deliver."],1,"is + particípio."],["'The truck is being loaded' significa:",["O caminhão carregou","O caminhão está sendo carregado","O caminhão será carregado","O caminhão carrega"],1,"Passiva contínua."]]),
L("Orações relativas",`<h4>Pronomes relativos</h4><table><tr><th>Pronome</th><th>Uso</th><th>Exemplo</th></tr><tr><td>who</td><td>pessoas</td><td>The driver who delivered it is new.</td></tr><tr><td>which</td><td>coisas</td><td>The system which we use is slow.</td></tr><tr><td>that</td><td>pessoas e coisas (informal)</td><td>The report that you sent is great.</td></tr><tr><td>where</td><td>lugares</td><td>The branch where I work is in Rio do Sul.</td></tr><tr><td>whose</td><td>posse</td><td>The customer whose cargo was damaged called.</td></tr><tr><td>when</td><td>tempo</td><td>The day when the system went down…</td></tr></table>
<h4>Definindo × explicativas</h4><p>Definindo (sem vírgula, identifica): <i>The truck that broke down is in the shop.</i> Explicativa (com vírgula, informação extra; não usa that): <i>Our CEO, who founded the company in 1990, will speak.</i></p>
<h4>Omissão</h4><p>Quando o relativo é objeto, pode sumir: <i>The report (that) you sent…</i></p>`,
["who pessoas, which coisas, where lugares","whose = cujo","Explicativa com vírgula não usa that","Relativo objeto pode ser omitido"],
`"The customer whose cargo was damaged is the one who called yesterday about the delivery that was late."`,
`Una 10 pares de frases usando who, which, where e whose.`,
[["Complete: The branch ___ I work is new.",["who","which","where","whose"],2,"Lugar: where."],["Complete: The client ___ invoice is wrong called.",["who","whose","which","where"],1,"Posse: whose."]])]},
{n:"Technical English",o:"Ler normas e falar de qualidade, logística e dados em inglês.",a:[
L("Lendo normas ISO em inglês",`<h4>Verbos com significado preciso</h4><table><tr><th>Termo</th><th>Significado na norma</th></tr><tr><td>shall</td><td>requisito (deve)</td></tr><tr><td>should</td><td>recomendação (convém)</td></tr><tr><td>may</td><td>permissão (pode)</td></tr><tr><td>can</td><td>possibilidade ou capacidade</td></tr></table>
<h4>Termos essenciais</h4><table><tr><th>Inglês</th><th>Português</th></tr><tr><td>documented information</td><td>informação documentada</td></tr><tr><td>maintain / retain</td><td>manter (documentos) / reter (registros)</td></tr><tr><td>top management</td><td>alta direção</td></tr><tr><td>interested parties</td><td>partes interessadas</td></tr><tr><td>nonconformity</td><td>não conformidade</td></tr><tr><td>corrective action</td><td>ação corretiva</td></tr><tr><td>management review</td><td>análise crítica pela direção</td></tr><tr><td>externally provided processes</td><td>processos providos externamente</td></tr><tr><td>objective evidence</td><td>evidência objetiva</td></tr><tr><td>continual improvement</td><td>melhoria contínua</td></tr></table>
<h4>Método de leitura</h4><p>Leia a cláusula em português, depois em inglês, marque os verbos (shall) e monte seu glossário. A ISO Online Browsing Platform mostra os termos e definições gratuitamente.</p>`,
["shall = obrigatório; should = recomendação","maintain × retain","Leitura paralela português/inglês","Glossário próprio"],
`"The organization shall retain appropriate documented information as evidence of competence." = 7.2: reter evidência de competência.`,
`Leia as cláusulas 7.2 e 10.2 em inglês e monte um glossário com 20 termos.`,
[["Em uma norma ISO, 'shall' indica:",["Recomendação","Requisito obrigatório","Permissão","Possibilidade"],1,"Shall marca o requisito."],["'Management review' é:",["Revisão de salários","Análise crítica pela direção","Auditoria externa","Gerência de risco"],1,"Cláusula 9.3."]]),
L("Vocabulário de qualidade e auditoria",`<table><tr><th>Inglês</th><th>Português</th></tr><tr><td>quality management system (QMS)</td><td>sistema de gestão da qualidade</td></tr><tr><td>requirement / compliance</td><td>requisito / conformidade</td></tr><tr><td>audit finding</td><td>constatação de auditoria</td></tr><tr><td>major / minor nonconformity</td><td>NC maior / menor</td></tr><tr><td>opportunity for improvement</td><td>oportunidade de melhoria</td></tr><tr><td>root cause analysis</td><td>análise de causa raiz</td></tr><tr><td>containment action</td><td>ação de contenção</td></tr><tr><td>risk assessment</td><td>avaliação de riscos</td></tr><tr><td>key performance indicator (KPI)</td><td>indicador-chave</td></tr><tr><td>work instruction / procedure</td><td>instrução de trabalho / procedimento</td></tr><tr><td>hazard</td><td>perigo (SSO)</td></tr><tr><td>environmental aspect</td><td>aspecto ambiental</td></tr></table>

L("Descrevendo gráficos e números",`<h4>Verbos de tendência</h4><table><tr><th>Subir</th><th>Descer</th><th>Estável</th></tr><tr><td>increase, rise, go up, grow</td><td>decrease, fall, drop, go down, decline</td><td>remain stable, stay the same, level off</td></tr></table><p>Pico: <i>peak</i>. Vale: <i>hit a low</i>. Oscilar: <i>fluctuate</i>.</p>
<h4>Intensidade</h4><p><i>slightly</i> (levemente), <i>gradually</i>, <i>steadily</i> (de forma constante), <i>significantly</i>, <i>sharply / dramatically</i> (acentuadamente). Substantivos: <i>a slight increase, a sharp drop</i>.</p>
<h4>Preposições</h4><p><i>from 88% to 94%</i>; <i>by 6 points</i> (diferença); <i>at 94%</i> (nível); <i>in Q3</i>; <i>over the last six months</i>.</p>
<h4>Frases úteis</h4><p><i>As you can see in this chart… / This graph shows… / On the vertical axis… / The blue line represents…</i></p>`,

L("Perguntas da plateia",`<h4>Recebendo a pergunta</h4><p><i>That's a good question. / Thanks for asking. / If I understood correctly, you're asking about…</i></p>

L("Past perfect e narrativas",`<h4>Forma e uso</h4><p>had + particípio: ação que aconteceu <b>antes</b> de outra no passado. <i>When we arrived, the truck had already left. She had worked there for 5 years before she moved.</i></p>
<h4>Tempos narrativos juntos</h4><table><tr><th>Tempo</th><th>Função</th></tr><tr><td>Simple past</td><td>sequência principal</td></tr><tr><td>Past continuous</td><td>cenário, ação em andamento</td></tr><tr><td>Past perfect</td><td>algo anterior</td></tr></table><p><i>It was raining (cenário) when the driver arrived (evento). He realized he had left the invoice at the branch (anterior).</i></p>
<h4>Conectores</h4><p><i>by the time, before, after, as soon as, when, while</i>.</p>`,
["had + particípio","Ação anterior a outra no passado","Past simple + continuous + perfect juntos","by the time, as soon as"],
`"By the time the customer called, we had already found the missing box."`,
`Escreva uma história de um problema de trabalho em 12 frases usando os três tempos narrativos.`,
[["Complete: When I arrived, the meeting ___ started.",["has already","had already","already","was"],1,"Ação anterior: past perfect."],["'By the time' significa:",["Na hora","Quando/até o momento em que","Por causa","Depois de amanhã"],1,"Indica o momento de referência."]]),
L("Reported speech",`<h4>Relatando o que alguém disse</h4><p><i>"I am busy." → He said (that) he was busy.</i> Os tempos recuam um passo.</p><table><tr><th>Direto</th><th>Relatado</th></tr><tr><td>present</td><td>past</td></tr><tr><td>past / present perfect</td><td>past perfect</td></tr><tr><td>will</td><td>would</td></tr><tr><td>can</td><td>could</td></tr><tr><td>must</td><td>had to</td></tr></table>
<h4>Perguntas e pedidos</h4><p>Perguntas: <i>She asked if/whether we had the invoice. He asked where the truck was.</i> (ordem de afirmativa). Pedidos: <i>He asked me to send the report. She told us not to wait.</i></p>
<h4>Verbos de relato</h4><p><i>say, tell (someone), ask, explain, mention, suggest, promise, confirm, complain</i>. <i>tell</i> pede objeto: <i>He told me</i>; <i>say</i> não: <i>He said that…</i></p>`,
["Tempos recuam um passo","will → would; can → could","asked if… / asked me to…","tell me × said that"],
`"The customer said the cargo had arrived damaged and asked us to send a replacement. I told him we would check the photos."`,
`Relate em inglês, em 10 frases, uma reunião ou ligação recente.`,
[["'I will call you' relatado:",["He said he will call me.","He said he would call me.","He said he calls me.","He told he would call."],1,"Will → would."],["Qual está correta?",["She said me that…","She told me that…","She told that…","She said to me that she told"],1,"Tell + pessoa."]]),
L("Gerúndio, infinitivo e used to",`<h4>Verbo + -ing</h4><p><i>enjoy, avoid, finish, consider, suggest, mind, keep, recommend, deny</i>: <i>We avoid working late. I suggest changing the route.</i> Também depois de preposição: <i>I'm interested in learning. Thank you for helping.</i></p>
<h4>Verbo + to</h4><p><i>want, need, decide, plan, agree, hope, expect, promise, manage, refuse</i>: <i>We decided to hire. I managed to finish.</i></p>
<h4>Muda o sentido</h4><p><i>stop smoking</i> (parar de) × <i>stop to smoke</i> (parar para); <i>remember to call</i> (lembrar de fazer) × <i>remember calling</i> (lembrar que fez).</p>
<h4>Used to × be used to</h4><table><tr><th>Forma</th><th>Significado</th><th>Exemplo</th></tr><tr><td>used to + verbo</td><td>hábito passado</td><td>I used to work at night.</td></tr><tr><td>be used to + -ing</td><td>estar acostumado</td><td>I'm used to working with data.</td></tr><tr><td>get used to + -ing</td><td>acostumar-se</td><td>I'm getting used to speaking English.</td></tr></table>`,
["enjoy, avoid, suggest + -ing","want, decide, plan + to","stop/remember mudam o sentido","used to × be used to + -ing"],
`"I used to do everything in spreadsheets. Now I'm used to automating reports, and I enjoy learning new tools."`,

L("Conduzindo uma reunião",`<h4>Abrir</h4><p><i>Let's get started. / Thanks for joining. / The purpose of today's meeting is to… / We have three items on the agenda.</i></p>

L("Videochamadas e atas",`<h4>Problemas técnicos</h4><table><tr><th>Frase</th><th>Significado</th></tr><tr><td>You're on mute.</td><td>Seu microfone está desligado.</td></tr><tr><td>You're breaking up.</td><td>Sua voz está falhando.</td></tr><tr><td>Can you hear me?</td><td>Está me ouvindo?</td></tr><tr><td>Can you see my screen?</td><td>Está vendo minha tela?</td></tr><tr><td>I'll share my screen.</td><td>Vou compartilhar a tela.</td></tr><tr><td>I'll drop the link in the chat.</td><td>Vou colocar o link no chat.</td></tr><tr><td>Sorry, I was frozen.</td><td>Desculpe, travei.</td></tr><tr><td>Let me turn on my camera.</td><td>Vou ligar a câmera.</td></tr></table>

{n:"Negotiation",o:"Negociar com clareza, diplomacia e foco em acordo.",a:[
L("Linguagem de negociação",`<h4>Fases</h4><table><tr><th>Fase</th><th>Frases</th></tr><tr><td>Abrir</td><td>We'd like to discuss… / Our goal today is to reach an agreement on…</td></tr><tr><td>Expor posição</td><td>Our main priority is… / We're looking for…</td></tr><tr><td>Propor</td><td>We propose… / What we can offer is…</td></tr><tr><td>Condicional</td><td>If you increase the volume, we can offer a better rate.</td></tr><tr><td>Concessão</td><td>We could accept… provided that… / We'd be willing to…</td></tr><tr><td>Recusar</td><td>I'm afraid that's not possible. / That doesn't work for us.</td></tr><tr><td>Buscar alternativa</td><td>What if we…? / Is there any flexibility on…?</td></tr></table>

L("Linguagem diplomática",`<h4>Suavizadores</h4><table><tr><th>Direto</th><th>Diplomático</th></tr><tr><td>Your price is too high.</td><td>I'm afraid the price is a bit higher than we expected.</td></tr><tr><td>That's wrong.</td><td>I'm not sure that's quite right.</td></tr><tr><td>We want a discount.</td><td>We were hoping for a better rate.</td></tr><tr><td>You're late with the payment.</td><td>It seems the payment hasn't arrived yet.</td></tr><tr><td>No.</td><td>That might be difficult for us.</td></tr><tr><td>You must change it.</td><td>Would it be possible to change it?</td></tr></table>
<h4>Técnicas</h4><ul><li>Modais: <i>would, could, might</i>.</li><li>Passado para suavizar: <i>We were wondering…</i></li><li>Qualificadores: <i>a bit, slightly, quite</i>.</li><li>Negativa com adjetivo positivo: <i>not very good</i> em vez de <i>bad</i>.</li><li>Perguntas no lugar de ordens.</li></ul>`,

L("Objeções e fechamento",`<h4>Lidando com objeções</h4><ol><li>Reconheça: <i>I understand your concern.</i></li><li>Pergunte: <i>Could you tell me more about…? What's most important for you?</i></li><li>Responda com valor: <i>Our on-time rate is 96%, which reduces your costs with delays.</i></li><li>Proponha: <i>What if we start with a trial period?</i></li></ol>

L("Prova final e plano de continuidade",`<h4>Escolhendo a prova</h4><table><tr><th>Prova</th><th>Foco</th><th>Uso</th></tr><tr><td>EF SET</td><td>geral, gratuito</td><td>medir o progresso</td></tr><tr><td>TOEIC</td><td>inglês profissional</td><td>empresas</td></tr><tr><td>IELTS / TOEFL</td><td>acadêmico e imigração</td><td>universidades, intercâmbio</td></tr><tr><td>Cambridge B2 First</td><td>geral, certificado vitalício</td><td>currículo</td></tr></table><p>B2 no CEFR equivale aproximadamente a 785+ no TOEIC (Listening + Reading).</p>

 ing:'<path d="M5 8h20a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H14l-6 5v-5H5a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M31 15h3a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-2v4l-5-4h-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><text x="15" y="19.5" font-size="9" font-weight="700" text-anchor="middle" fill="currentColor" font-family="Inter,sans-serif">EN</text>'};

 g.font="400 26px Inter,sans-serif";g.fillStyle="#5b6478";g.textAlign="left";g.fillText("Concluído em "+st.conc[c.id],200,1180);g.fillText("Código "+cod,200,1220);
 g.beginPath();g.arc(1700,1130,105,0,7);g.fillStyle=cc;g.fill();g.lineWidth=6;g.strokeStyle="#fffdf8";g.beginPath();g.arc(1700,1130,92,0,7);g.stroke();
 g.fillStyle="#fff";g.textAlign="center";g.font="700 40px 'Space Grotesk',sans-serif";g.fillText(c.carga+" h",1700,1125);g.font="600 24px 'Space Grotesk',sans-serif";g.fillText(c.curto,1700,1162);
 return await new Promise(r=>cv.toBlob(r,"image/png"));
}

/* leitor */
const reader=document.getElementById("reader"),sheet=document.getElementById("sheet");let lastFocus=null;
const quizHtml=(q,qi,rev)=>`<div class="quiz"><h4>${rev?"Questão "+(qi+1):"Exercício "+(qi+1)}: ${q[0]}</h4>${q[1].map((t,i)=>`<button class="opt" data-i="${i}">${t}</button>`).join("")}<p class="fb" hidden></p></div>`;
function openW(c,i){
 const x=c.L[i],m=c.mods[x.mi];sheet.className="sheet c-"+c.id;let body="",qs=[];
 if(x.rev){qs=m.a.flatMap(a=>a.q);
  body=`<div class="lesson"><p>Semana de revisão do módulo <b>${m.n}</b>. Releia os pontos-chave, refaça as atividades pendentes e responda as ${qs.length} questões. Objetivo do módulo: ${m.o}</p></div>
  ${m.a.map(a=>`<div class="box"><h4>${esc(a.t)}</h4><ul>${a.k.map(p=>`<li>${p}</li>`).join("")}</ul></div>`).join("")}
  <div class="box task"><h4>Atividade de revisão</h4><div class="lesson"><p>Faça um resumo de uma página do módulo com suas palavras e um mapa mental ligando os temas.</p></div></div>
  ${qs.map((q,qi)=>quizHtml(q,qi,true)).join("")}`;}
 else{const a=x.a;qs=a.q;
  body=`<div class="lesson">${a.c}</div><div class="box"><h4>Pontos-chave</h4><ul>${a.k.map(p=>`<li>${p}</li>`).join("")}</ul></div>
  <div class="box"><h4>Na prática</h4><div class="lesson"><p>${a.ex}</p></div></div>
  <div class="box task"><h4>Atividade da semana</h4><div class="lesson"><p>${a.at}</p></div></div>
  ${qs.map((q,qi)=>quizHtml(q,qi,false)).join("")}`;}
 sheet.innerHTML=`<div class="sheet-top"><span class="k nowrap">${c.curto} · Módulo ${x.mi+1} · Semana ${x.i+1} de ${c.L.length}</span><button class="x" id="lClose" aria-label="Fechar aula">×</button></div>
  <div><h2 id="lTitle">${esc(x.t)}</h2><div class="when num">Aula de ${DSEM[c.dia]}, ${dmy(x.aula)} · semana ${x.i+1} · ${c.horas} h de estudo</div></div>${body}
  <label class="donechk"><input type="checkbox" id="lDone" ${st.feito[x.k]?"checked":""}> Semana concluída</label>
  <div class="nav"><button class="btn" id="lPrev" ${i===0?"disabled":""}>← Anterior</button><button class="btn main" id="lNext">${i===c.L.length-1?"Concluir curso":"Concluir e avançar →"}</button></div>`;
 sheet.querySelectorAll(".quiz").forEach((qz,qi)=>qz.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const q=qs[qi],ok=+b.dataset.i===q[2];
  qz.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));b.classList.add(ok?"right":"wrong");
  const fb=qz.querySelector(".fb");fb.hidden=false;fb.innerHTML=ok?"<b>Certo.</b> "+q[3]:"<b>Ainda não.</b> Releia a aula e tente outra opção.";}));
 sheet.querySelector("#lClose").onclick=closeW;
 sheet.querySelector("#lDone").onchange=e=>{setDone(x.k,e.target.checked);render();};
 sheet.querySelector("#lPrev").onclick=()=>openW(c,i-1);
 sheet.querySelector("#lNext").onclick=()=>{setDone(x.k,true);render();if(i<c.L.length-1)openW(c,i+1);else{closeW();if(route===c.id){tab="cert";render();}}};
 if(reader.hidden){lastFocus=document.activeElement;reader.hidden=false;document.body.style.overflow="hidden";}
 sheet.scrollTop=0;sheet.querySelector("#lClose").focus();
}
function closeW(){reader.hidden=true;document.body.style.overflow="";if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}
reader.addEventListener("click",e=>{if(e.target===reader)closeW();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!reader.hidden)closeW();});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});}catch(e){}
render();

</script>
